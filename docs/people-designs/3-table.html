<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Table + panel — Customers & Suppliers</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--bg:#f4f5f7;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}
.app{position:fixed;left:68px;right:0;top:0;bottom:0;display:flex;flex-direction:column;padding:16px 20px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font:900 30px Archivo;letter-spacing:-.02em}
.kind{display:flex;background:#e9ebee;border-radius:12px;padding:3px;margin-left:8px}
.kind span{padding:7px 16px;border-radius:10px;font-weight:700;color:var(--steel);cursor:pointer}.kind span.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sbox{margin-left:auto;display:flex;align-items:center;gap:8px;width:330px;height:42px;border-radius:12px;padding:0 12px;background:#fff;border:2px solid var(--line);color:var(--steel)}
.sbox:focus-within{border-color:var(--red)}.sbox input{flex:1;border:0;outline:0;font:600 14px Inter;min-width:0}
.nb{height:42px;border:0;border-radius:12px;background:var(--red);color:#fff;font:700 13.5px Inter;padding:0 16px;cursor:pointer;white-space:nowrap}
.sum{display:flex;gap:10px;margin-top:14px}
.sm{flex:1;background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 0 0 1px var(--line);cursor:pointer;border:2px solid transparent}
.sm.on{border-color:var(--ink)}
.sm small{font-size:12px;color:var(--steel);font-weight:600}.sm b{display:block;font:800 20px Archivo;margin-top:2px}.sm.r b{color:var(--red)}
.tw{flex:1;min-height:0;margin-top:12px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:#fafbfb;text-align:left;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;z-index:1}
th.on{color:var(--ink)}th.n,td.n{text-align:right}
td{padding:10px 12px;border-bottom:1px solid #f2f3f5;vertical-align:middle}
tr.r{cursor:pointer}tr.r:hover td{background:#fafafa}tr.r.on td{background:#fdf0f1}
.nm{display:flex;align-items:center;gap:10px}.nm .av{width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;font:800 12px Archivo;color:#fff}
.av.old{background:var(--old)}.av.mid{background:var(--mid)}.av.new{background:var(--new)}.av.none{background:#b9bfc6}
.nm b{font-weight:700}
td.amt{font:800 14.5px Archivo}
.ag{font-style:normal;font-size:11.5px;font-weight:800;padding:2px 9px;border-radius:999px}.ag.old{background:#fde7e3;color:var(--old)}.ag.mid{background:#fdf1dc;color:#9a5d00}.ag.new{background:#e2f5ea;color:#1f7a4b}
.lb{display:flex;align-items:center;gap:8px}.lb span{width:80px;height:6px;border-radius:9px;background:#eef0f2;overflow:hidden}.lb i{display:block;height:100%;background:var(--new)}.lb i.hi{background:var(--mid)}.lb i.over{background:var(--old)}
.mut{color:var(--steel);font-size:12.5px}
.dr{position:fixed;right:0;top:0;bottom:0;width:min(470px,100vw);background:#fff;box-shadow:-30px 0 60px -20px rgba(0,0,0,.4);z-index:5;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.9,.3,1)}
.dr.on{transform:none}
.dh{background:linear-gradient(150deg,#2a0b10,#5a1019 58%,#AE1E2B);color:#fff;padding:18px 20px}
.dh .x{float:right;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:6px 10px;font:700 12px Inter;cursor:pointer}
.dh h2{font:900 21px/1.2 Archivo;margin-top:6px;padding-right:60px}.dh .m{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:3px}
.dh .big{font:900 34px Archivo;margin-top:12px}.dh .big em{font-style:normal;font-size:16px;opacity:.6;margin-right:5px}
.dh .ab{display:flex;height:10px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.14);margin-top:10px}
.dh .ab i{display:block}.dh .ab i:nth-child(1){background:#7ee2a8}.dh .ab i:nth-child(2){background:#ffc35c}.dh .ab i:nth-child(3){background:#ff9a7a}.dh .ab i:nth-child(4){background:#ff5a5f}
.dh .sub{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.72);margin-top:6px}
.db{flex:1;overflow:auto;padding:14px 18px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.acts button{height:40px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font:700 12.5px Inter;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 11px}
.acts button:hover{border-color:var(--ink)}.acts button.main{grid-column:span 2;background:var(--red);border-color:var(--red);color:#fff;height:46px;font-size:14px}
.acts kbd{font:700 10px Inter;color:var(--steel)}.acts .main kbd{color:rgba(255,255,255,.8)}
.db h4{font:800 14px Inter;margin:16px 0 6px;display:flex;justify-content:space-between}.db h4 span{font:500 12px Inter;color:var(--steel)}
.bl{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}.bl b{flex:1}.bl em{font:800 13.5px Archivo;font-style:normal}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);font-size:12px;color:var(--steel)}
</style></head><body>
<div class="rail-bg"></div>
<div class="app" id="app"></div>
<div class="dr" id="dr"></div>
<script src="people.js"></script>
<script>
var drOn = false;
window.draw = function (focus) {
  var K = P.kind, all = PEOPLE[K], L = list(), x = cur(), owing = all.filter(function (y) { return y.owed > 0; });
  var sums = [['All', K === 'c' ? 'Customers' : 'Suppliers', all.length], ['Outstanding', 'Outstanding', 'Rs ' + short(owing.reduce(function (a, y) { return a + y.owed; }, 0)), 'r'], ['60+ days', 'Owing 60+ days', all.filter(function (y) { return y.oldest > 60; }).length],
    K === 'c' ? ['Over limit', 'Over their limit', all.filter(function (y) { return y.limit && y.owed > y.limit; }).length, 'r'] : ['Cheques out', 'Cheques out', 'Rs ' + short(all.reduce(function (a, y) { return a + y.chequesOut; }, 0))]];
  document.getElementById('app').innerHTML = '<div class="top"><h1>' + (K === 'c' ? 'Customers' : 'Suppliers') + '</h1><div class="kind"><span data-kind="c" class="' + (K === 'c' ? 'on' : '') + '">Customers</span><span data-kind="s" class="' + (K === 's' ? 'on' : '') + '">Suppliers</span></div>' +
    '<label class="sbox"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name, mobile, code…" autocomplete="off" value="' + P.q + '"></label><button class="nb" onclick="toast(\'Opens New\')">+ New ' + (K === 'c' ? 'customer' : 'supplier') + '</button></div>' +
    '<div class="sum">' + sums.map(function (s) { return '<div class="sm ' + (s[3] || '') + ' ' + (P.f === s[0] ? 'on' : '') + '" data-f="' + s[0] + '"><small>' + s[1] + '</small><b>' + s[2] + '</b></div>'; }).join('') + '</div>' +
    '<div class="tw"><table><tr><th data-sort="Name" class="' + (P.sort === 'Name' ? 'on' : '') + '">' + (K === 'c' ? 'Customer' : 'Supplier') + '</th><th>Mobile</th><th data-sort="Outstanding" class="n ' + (P.sort === 'Outstanding' ? 'on' : '') + '">Outstanding ▾</th><th data-sort="' + (K === 'c' ? 'Oldest debt' : 'Oldest bill') + '">Oldest bill</th><th>' + (K === 'c' ? 'Limit used' : 'Terms') + '</th><th>Last payment</th></tr>' +
    L.map(function (y, i) { var pct = y.limit ? Math.min(100, Math.round(y.owed / y.limit * 100)) : 0;
      return '<tr class="r ' + (i === P.sel && drOn ? 'on' : '') + '" data-i="' + i + '" onclick="drOn=true"><td><div class="nm"><span class="av ' + (y.owed ? tone(y.oldest) : 'none') + '">' + ini(y.name) + '</span><b>' + y.name + '</b></div></td><td class="mut">' + y.phone + '</td>' +
        '<td class="n amt">' + (y.owed ? money(y.owed) : '<span class="mut">clear</span>') + '</td><td>' + (y.bills.length ? '<i class="ag ' + tone(y.oldest) + '">' + y.oldest + ' days</i> <span class="mut">· ' + y.bills.length + ' bills</span>' : '<span class="mut">—</span>') + '</td>' +
        '<td>' + (K === 'c' ? '<div class="lb"><span><i class="' + (pct >= 100 ? 'over' : pct >= 80 ? 'hi' : '') + '" style="width:' + pct + '%"></i></span><span class="mut" style="width:auto;height:auto;background:none">' + pct + '%</span></div>' : '<span class="mut">' + y.terms + ' days</span>') + '</td>' +
        '<td class="mut">' + (y.lastPay ? money(y.lastPay.amt) + ' · ' + ago(y.lastPay.date) : 'never') + '</td></tr>'; }).join('') + '</table></div>';
  var d = document.getElementById('dr');
  if (x && drOn) {
    var b = buckets(x), tot = x.owed || 1, A = ACTIONS[K];
    d.innerHTML = '<div class="dh"><button class="x" onclick="drOn=false;draw()">✕ Esc</button><div class="m">' + x.code + ' · since ' + day(x.since) + '</div><h2>' + x.name + '</h2><div class="m">' + x.phone + (x.phone2 ? ' · ' + x.phone2 : '') + (K === 'c' ? ' · ' + x.level + ' prices' : ' · terms ' + x.terms + ' days') + '</div>' +
      '<div class="big"><em>Rs</em>' + money(x.owed) + '</div>' + (x.owed ? '<div class="ab">' + b.map(function (v) { return '<i style="width:' + (v / tot * 100) + '%"></i>'; }).join('') + '</div>' : '') +
      '<div class="sub"><span>' + x.bills.length + ' unpaid · oldest ' + x.oldest + ' days</span><span>' + (x.lastPay ? 'last paid ' + ago(x.lastPay.date) : 'never paid') + '</span></div></div>' +
      '<div class="db"><div class="acts">' + A.map(function (a) { return '<button class="' + (a[2] || '') + '" data-a="' + a[0] + '">' + a[0] + (a[1] ? '<kbd>' + a[1] + '</kbd>' : '') + '</button>'; }).join('') + '</div>' +
      '<h4>Unpaid bills <span>oldest first</span></h4>' + (x.bills.map(function (bl) { return '<div class="bl"><b>' + bl.no + '</b><span class="mut">' + day(bl.date) + '</span><i class="ag ' + tone(bl.age) + '">' + bl.age + 'd</i><em>' + money(bl.amt) + '</em></div>'; }).join('') || '<div class="mut">Nothing owing.</div>') +
      '<h4>Notes & calls</h4><div class="mut">' + (x.notes[0] || 'No calls or notes yet.') + '</div></div>';
    d.className = 'dr on';
  } else d.className = 'dr';
  if (focus) document.getElementById('q').focus();
};
document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'q') { drOn = true; draw(); } if (e.key === "Escape" && drOn) { drOn = false; draw(); } });
document.addEventListener('click', function (e) { var s = e.target.closest('th[data-sort]'); if (s) { P.sort = s.dataset.sort; draw(); } });
draw(true);
</script>
</body></html>
