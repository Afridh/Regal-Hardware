<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4 · Statement — Customers & Suppliers</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--bg:#f4f5f7;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}
.app{position:fixed;left:68px;right:0;top:0;bottom:0;display:grid;grid-template-columns:320px 1fr 250px}
/* list */
.lp{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.lh{padding:16px 14px 8px}
.lh h2{font:900 22px Archivo;display:flex;align-items:center;gap:8px}
.lh h2 select{margin-left:auto;font:700 12px Inter;border:1px solid var(--line);border-radius:9px;padding:5px 8px;background:#fff;cursor:pointer}
.sbox{margin-top:10px;display:flex;align-items:center;gap:8px;height:42px;border-bottom:2px solid var(--ink);color:var(--steel)}
.sbox:focus-within{border-color:var(--red)}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 15px Inter;color:var(--ink);min-width:0}
.fl{display:flex;flex-wrap:wrap;gap:4px 12px;padding:9px 0 4px;font-size:12.5px}
.fl span{color:var(--steel);cursor:pointer;font-weight:600;padding-bottom:2px;border-bottom:2px solid transparent}.fl span.on{color:var(--red);border-color:var(--red)}
.cnt{font-size:12px;color:var(--steel);padding:4px 0 0}
.list{flex:1;overflow:auto}
.row{display:flex;gap:10px;align-items:center;padding:11px 14px;border-left:3px solid transparent;cursor:pointer;border-bottom:1px solid #f1f2f4}
.row:hover{background:#fafafa}.row.on{background:#fbf1f2;border-left-color:var(--red)}
.row .t{flex:1;min-width:0}.row b{display:block;font-size:13.5px;line-height:1.25}
.row small{font-size:11.5px;color:var(--steel)}
.row .a{text-align:right;font:800 13.5px Archivo;white-space:nowrap}.row .a small{display:block;font:600 11px Inter}
.row .a small.old{color:var(--old)}.row .a small.mid{color:#9a5d00}.row .a small.new{color:var(--new)}
/* middle */
.mid{min-height:0;overflow:auto;padding:22px 26px}
.hd{display:flex;align-items:flex-start;gap:14px}
.hd h1{font:900 28px/1.1 Archivo;letter-spacing:-.01em}
.hd .m{color:var(--steel);font-size:13px;margin-top:5px}
.tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.tags span{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef0f2;color:#3b434c}.tags span.bad{background:#fde7e3;color:var(--old)}
.nums{display:flex;gap:34px;margin-top:20px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.nums small{display:block;font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.nums b{display:block;font:900 30px Archivo;letter-spacing:-.02em;margin-top:2px}.nums b.r{color:var(--red)}
.nums i{font-style:normal;font-size:12px;color:var(--steel)}
.nums .s b{font-size:20px;margin-top:8px}
.st{margin-top:18px;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.st h3{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;font:800 15px Inter}
.st h3 span{font:500 12px Inter;color:var(--steel)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font:700 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:var(--steel);padding:8px 16px;background:#f8f9fa}
td{padding:10px 16px;border-top:1px solid #f0f1f3}
td.n,th.n{text-align:right;white-space:nowrap}td.n{font:700 13.5px Archivo}
tr.pay td{color:var(--new)}tr.pay td.n.b{color:var(--ink)}
td.n.b{font-weight:900}
.ag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px}.ag.old{background:#fde7e3;color:var(--old)}.ag.mid{background:#fdf1dc;color:#9a5d00}.ag.new{background:#e2f5ea;color:#1f7a4b}
tr.tot td{background:#1d2125;color:#fff;font-weight:800}tr.tot td.n{font:900 16px Archivo}
.note{margin-top:14px;background:#fffbea;border-radius:12px;padding:10px 14px;font-size:13px}
/* actions */
.ap{background:#fff;border-left:1px solid var(--line);padding:16px 14px;overflow:auto;display:flex;flex-direction:column;gap:6px}
.ap h4{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin:10px 2px 2px}.ap h4:first-child{margin-top:0}
.ap button{display:flex;align-items:center;justify-content:space-between;width:100%;height:40px;border:1px solid var(--line);background:#fff;border-radius:11px;padding:0 12px;font:600 13px Inter;cursor:pointer;color:var(--ink);text-align:left}
.ap button:hover{border-color:var(--red);color:var(--red)}
.ap button.main{background:var(--red);border-color:var(--red);color:#fff;height:50px;font-size:14.5px;font-weight:800}
.ap kbd{font:700 10px Inter;color:var(--steel);background:#f2f3f5;border-radius:5px;padding:1px 5px}.ap .main kbd{background:rgba(255,255,255,.2);color:#fff}
.pgc{margin-top:auto;background:#f4f0fb;border-radius:14px;padding:12px;font-size:12.5px;color:#4b3a78}
.pgc b{display:block;font-size:13.5px;color:#2e2156;margin-bottom:3px}
.nw{background:var(--ink)!important;color:#fff!important;border-color:var(--ink)!important;font-weight:800!important}
</style></head><body>
<div class="rail-bg"></div>
<div class="app"><div class="lp" id="lp"></div><div class="mid" id="mid"></div><div class="ap" id="ap"></div></div>
<script src="people.js"></script>
<script>
window.draw = function (focus) {
  var K = P.kind, all = PEOPLE[K], L = list(), x = cur();
  document.getElementById('lp').innerHTML = '<div class="lh"><h2>' + (K === 'c' ? 'Customers' : 'Suppliers') + '<select onchange="P.kind=this.value;P.sel=0;P.f=\'All\';P.q=\'\';draw(true)"><option value="c" ' + (K === 'c' ? 'selected' : '') + '>Customers</option><option value="s" ' + (K === 's' ? 'selected' : '') + '>Suppliers</option></select></h2>' +
    '<label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name, mobile, code…" autocomplete="off" value="' + P.q + '"></label>' +
    '<div class="fl">' + FILTERS[K].map(function (f) { return '<span class="' + (P.f === f ? 'on' : '') + '" data-f="' + f + '">' + f + '</span>'; }).join('') + '</div>' +
    '<div class="cnt">' + L.length + ' of ' + all.length + ' · owed Rs ' + short(all.reduce(function (a, y) { return a + y.owed; }, 0)) + '</div></div>' +
    '<div class="list">' + L.map(function (y, i) {
      return '<div class="row ' + (i === P.sel ? 'on' : '') + '" data-i="' + i + '"><div class="t"><b>' + y.name + '</b><small>' + y.phone + '</small></div><div class="a">' + (y.owed ? money(y.owed) : '<span style="color:var(--steel);font:600 12px Inter">clear</span>') +
        (y.owed ? '<small class="' + tone(y.oldest) + '">' + y.oldest + ' days</small>' : '') + '</div></div>';
    }).join('') + '</div>';
  if (!x) { document.getElementById('mid').innerHTML = '<p style="color:var(--steel)">Nobody matches that.</p>'; document.getElementById('ap').innerHTML = ''; return; }
  var over = x.limit && x.owed > x.limit;
  // running statement: unpaid bills oldest first, the last payment in its place
  var rows = x.bills.map(function (b) { return { d: b.date, t: (K === 'c' ? 'Bill ' : '') + b.no, amt: b.amt, age: b.age }; });
  if (x.lastPay) rows.push({ d: x.lastPay.date, t: 'Payment · ' + x.lastPay.how, amt: -x.lastPay.amt, pay: 1 });
  rows.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  var open = x.owed + (x.lastPay ? x.lastPay.amt : 0) - x.bills.reduce(function (a, b) { return a + b.amt; }, 0), run = open;
  document.getElementById('mid').innerHTML = '<div class="hd"><div><h1>' + x.name + '</h1><div class="m">' + x.phone + (x.phone2 ? ' · ' + x.phone2 : '') + ' · ' + x.code + ' · since ' + day(x.since) + '</div>' +
    '<div class="tags">' + (K === 'c' ? '<span>' + x.level + ' prices</span>' : '<span>terms ' + x.terms + ' days</span>') + (over ? '<span class="bad">over the limit</span>' : '') + '<span>own page ' + (x.page ? 'on' : 'off') + '</span></div></div></div>' +
    '<div class="nums"><div><small>' + (K === 'c' ? 'They owe us' : 'We owe them') + '</small><b class="r">Rs ' + money(x.owed) + '</b><i>' + x.bills.length + ' unpaid bills</i></div>' +
    '<div class="s"><small>' + (K === 'c' ? 'Limit' : 'Cheques out') + '</small><b>' + money(K === 'c' ? x.limit : x.chequesOut) + '</b><i>' + (K === 'c' ? (over ? 'over by ' + money(x.owed - x.limit) : money(x.limit - x.owed) + ' left') : x.chequesOut ? 'not cleared' : 'none') + '</i></div>' +
    '<div class="s"><small>Last payment</small><b>' + (x.lastPay ? money(x.lastPay.amt) : '—') + '</b><i>' + (x.lastPay ? ago(x.lastPay.date) : 'never') + '</i></div>' +
    '<div class="s"><small>Bought in all</small><b>' + short(x.bought) + '</b><i>' + x.billsAll + ' bills</i></div></div>' +
    '<div class="st"><h3>Statement <span>what is still open, oldest at the top</span></h3><table><tr><th>Date</th><th>What</th><th class="n">Bill</th><th class="n">Paid</th><th class="n">Balance</th></tr>' +
    (open ? '<tr><td>' + day(rows.length ? rows[0].d : x.since) + '</td><td style="color:var(--steel)">Brought forward</td><td></td><td></td><td class="n b">' + money(open) + '</td></tr>' : '') +
    rows.map(function (r) { run += r.amt; return '<tr class="' + (r.pay ? 'pay' : '') + '"><td>' + day(r.d) + '</td><td>' + r.t + (r.age != null ? '<span class="ag ' + tone(r.age) + '">' + r.age + 'd</span>' : '') + '</td><td class="n">' + (r.pay ? '' : money(r.amt)) + '</td><td class="n">' + (r.pay ? money(-r.amt) : '') + '</td><td class="n b">' + money(run) + '</td></tr>'; }).join('') +
    '<tr class="tot"><td colspan="4">Outstanding now</td><td class="n">' + money(x.owed) + '</td></tr></table></div>' +
    x.notes.map(function (n) { return '<div class="note">📝 ' + n + '</div>'; }).join('');
  var A = ACTIONS[K];
  document.getElementById('ap').innerHTML = '<h4>Money</h4>' + A.slice(0, 3).map(btn).join('') + '<h4>Talk to them</h4>' + A.slice(3, K === 'c' ? 6 : 5).map(btn).join('') +
    '<h4>Other</h4>' + A.slice(K === 'c' ? 6 : 5).map(btn).join('') + '<button class="nw" onclick="toast(\'Opens New ' + (K === 'c' ? 'customer' : 'supplier') + '\')">+ New ' + (K === 'c' ? 'customer' : 'supplier') + '<kbd>Ctrl+N</kbd></button>' +
    (K === 'c' ? '<div class="pgc"><b>Their own page — ' + (x.page ? 'on' : 'off') + '</b>' + (x.page ? 'They sign in with a code texted to ' + x.phone + '.' : 'Switch on so they can see what they owe.') + '</div>' : '');
  function btn(a) { return '<button class="' + (a[2] || '') + '" data-a="' + a[0] + '">' + a[0] + (a[1] ? '<kbd>' + a[1] + '</kbd>' : '') + '</button>'; }
  if (focus) document.getElementById('q').focus();
  var on = document.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
};
draw(true);
</script>
</body></html>
