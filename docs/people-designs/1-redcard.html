<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Red card — Customers & Suppliers</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--bg:#f4f5f7;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}
.app{position:fixed;left:68px;right:0;top:0;bottom:0;display:grid;grid-template-columns:370px 1fr;gap:14px;padding:14px}
.lp{background:#fff;border-radius:20px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lh{padding:14px 14px 8px}
.kind{display:flex;background:#f2f3f5;border-radius:12px;padding:3px}
.kind span{flex:1;text-align:center;padding:8px 0;border-radius:10px;font-weight:700;color:var(--steel);cursor:pointer}
.kind span.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.stat{display:flex;gap:6px;margin-top:10px;font-size:12px;color:var(--steel)}
.stat div{flex:1;background:#f6f7f8;border-radius:10px;padding:7px 9px}.stat b{display:block;font:800 14px Archivo;color:var(--ink)}.stat .r b{color:var(--red)}
.sbox{margin-top:10px;display:flex;align-items:center;gap:10px;height:44px;border-radius:12px;padding:0 12px;background:#f2f3f5;border:2px solid transparent;color:var(--steel)}
.sbox:focus-within{border-color:var(--red);background:#fff}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 15px Inter;color:var(--ink);min-width:0}
.chips{display:flex;gap:5px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:600 12px Inter;color:var(--steel);cursor:pointer;background:#fff}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sortr{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--steel);padding:6px 2px 0}
.sortr select{border:0;background:none;font:700 12px Inter;color:var(--ink);cursor:pointer}
.list{flex:1;overflow:auto;padding:4px 8px 10px}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px;border-radius:13px;cursor:pointer}
.row:hover{background:#f6f7f8}.row.on{background:var(--ink);color:#fff}
.dot{width:9px;height:9px;border-radius:50%;grid-row:1/3}.dot.old{background:var(--old)}.dot.mid{background:var(--mid)}.dot.new{background:var(--new)}.dot.none{background:#c3c8ce}
.row b{font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .a{font:800 14px Archivo;text-align:right;white-space:nowrap}.row .a.z{font:500 12px Inter;color:var(--steel)}
.row .s{grid-column:2/4;display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--steel)}.row.on .s{color:rgba(255,255,255,.6)}
.row .s i{font-style:normal;font-weight:700;color:var(--old)}.row.on .s i{color:#ffb0a5}
.rp{min-height:0;overflow:auto;border-radius:20px}
.card{background:linear-gradient(150deg,#2a0b10,#5a1019 58%,#AE1E2B);color:#fff;border-radius:20px;padding:20px 22px;position:relative;overflow:hidden}
.card:after{content:"";position:absolute;right:-90px;top:-110px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.who{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;flex:none;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center;font:800 20px Archivo}
.who h1{font:900 24px/1.15 Archivo;letter-spacing:-.01em}
.who .m{font-size:13px;color:rgba(255,255,255,.75);margin-top:3px}
.tags{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}.tags span{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:rgba(255,255,255,.13)}
.tags span.bad{background:#ffb0a5;color:#5a0d0a}
.new{margin-left:auto;align-self:flex-start;border:0;background:#fff;color:var(--red);border-radius:12px;height:40px;padding:0 14px;font:800 13px Inter;cursor:pointer;position:relative;z-index:1;white-space:nowrap}
.figs{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px;margin-top:18px;position:relative;z-index:1}
.figs small{display:block;font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.figs .big{font:900 36px/1.05 Archivo;letter-spacing:-.02em;margin-top:3px}.figs .big em{font-style:normal;font-size:17px;opacity:.6;margin-right:5px}
.figs b{display:block;font:800 18px Archivo;margin-top:5px}.figs span{font-size:12px;color:rgba(255,255,255,.65)}
.age{margin-top:16px;position:relative;z-index:1}
.ab{display:flex;height:12px;border-radius:9px;overflow:hidden;background:rgba(255,255,255,.14)}
.ab i{display:block;height:100%}.ab i:nth-child(1){background:#7ee2a8}.ab i:nth-child(2){background:#ffc35c}.ab i:nth-child(3){background:#ff9a7a}.ab i:nth-child(4){background:#ff5a5f}
.al{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;color:rgba(255,255,255,.75)}.al b{color:#fff;font:800 13px Archivo;margin-left:4px}
.al span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
.al span:nth-child(1):before{background:#7ee2a8}.al span:nth-child(2):before{background:#ffc35c}.al span:nth-child(3):before{background:#ff9a7a}.al span:nth-child(4):before{background:#ff5a5f}
.dock{display:flex;gap:7px;align-items:center;background:var(--ink);border-radius:16px;padding:7px;margin-top:12px;position:relative}
.dock button{height:40px;border:0;border-radius:11px;background:rgba(255,255,255,.08);color:#fff;font:700 13px Inter;padding:0 12px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px}
.dock button:hover{background:rgba(255,255,255,.16)}
.dock button.main{background:var(--red)}
.dock kbd{font:700 10px Inter;background:rgba(255,255,255,.15);border-radius:5px;padding:1px 5px}
.dock .more{margin-left:auto}
.menu{position:absolute;right:7px;top:52px;background:#fff;border-radius:14px;box-shadow:0 20px 40px -12px rgba(0,0,0,.4);padding:6px;z-index:5;display:none;min-width:220px}
.menu.on{display:block}.menu a{display:flex;justify-content:space-between;padding:9px 12px;border-radius:9px;color:var(--ink);font-weight:600;cursor:pointer}.menu a:hover{background:#f6f2f2;color:var(--red)}
.menu kbd{font:700 10px Inter;color:var(--steel)}
.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
.box{background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:14px 16px}
.box h4{font:800 14.5px Inter;display:flex;justify-content:space-between;margin-bottom:6px}.box h4 span{font:500 12px Inter;color:var(--steel)}
.bl{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
.bl b{flex:1}.bl em{font:800 14px Archivo;font-style:normal}
.bl i{font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none}.bl i.old{background:#fde7e3;color:var(--old)}.bl i.mid{background:#fdf1dc;color:#9a5d00}.bl i.new{background:#e2f5ea;color:#1f7a4b}
.pg{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.pg b{flex:1}
.pg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font:600 12px Inter;cursor:pointer}
.note{background:#fffbea;border-radius:12px;padding:10px 12px;font-size:13px;margin-top:6px}
.empty{color:var(--steel);font-size:13px;padding:10px 0}
</style></head><body>
<div class="rail-bg"></div>
<div class="app"><div class="lp" id="lp"></div><div class="rp" id="rp"></div></div>
<script src="people.js"></script>
<script>
var menuOn = false;
window.draw = function (focus) {
  var K = P.kind, all = PEOPLE[K], L = list(), x = cur(), owing = all.filter(function (y) { return y.owed > 0; });
  document.getElementById('lp').innerHTML = '<div class="lh"><div class="kind"><span data-kind="c" class="' + (K === 'c' ? 'on' : '') + '">Customers</span><span data-kind="s" class="' + (K === 's' ? 'on' : '') + '">Suppliers</span></div>' +
    '<div class="stat"><div>' + (K === 'c' ? 'Customers' : 'Suppliers') + '<b>' + all.length + '</b></div><div class="r">Outstanding<b>Rs ' + short(owing.reduce(function (a, y) { return a + y.owed; }, 0)) + '</b></div><div>' + (K === 'c' ? 'Over limit<b style="color:var(--red)">' + all.filter(function (y) { return y.limit && y.owed > y.limit; }).length : 'Cheques out<b>Rs ' + short(all.reduce(function (a, y) { return a + y.chequesOut; }, 0))) + '</b></div></div>' +
    '<label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name, mobile, code…" autocomplete="off" value="' + P.q + '"></label>' +
    '<div class="chips">' + FILTERS[K].map(function (f) { return '<span class="chip ' + (P.f === f ? 'on' : '') + '" data-f="' + f + '">' + f + '</span>'; }).join('') + '</div>' +
    '<div class="sortr"><span>' + L.length + ' of ' + all.length + '</span><span>Sort <select onchange="P.sort=this.value;P.sel=0;draw()">' + ['Outstanding', K === 'c' ? 'Oldest debt' : 'Oldest bill', 'Recent', 'Name'].map(function (s) { return '<option ' + (P.sort === s ? 'selected' : '') + '>' + s + '</option>'; }).join('') + '</select></span></div></div>' +
    '<div class="list">' + L.map(function (y, i) {
      var over = y.limit && y.owed > y.limit;
      return '<div class="row ' + (i === P.sel ? 'on' : '') + '" data-i="' + i + '"><span class="dot ' + (y.owed ? tone(y.oldest) : 'none') + '"></span><b>' + y.name + '</b><span class="a ' + (y.owed ? '' : 'z') + '">' + (y.owed ? money(y.owed) : 'clear') + '</span>' +
        '<span class="s"><span>' + y.phone + ' · ' + (y.lastPay ? ago(y.lastPay.date) : 'never paid') + '</span><span>' + (over ? '<i>over limit</i> · ' : '') + (y.bills.length ? y.bills.length + ' bills · ' + y.oldest + 'd' : '') + '</span></span></div>';
    }).join('') + '</div>';
  if (!x) { document.getElementById('rp').innerHTML = '<div class="box">Nobody matches that.</div>'; return; }
  var b = buckets(x), tot = x.owed || 1, A = ACTIONS[K], first = A.slice(0, 6), rest = A.slice(6), over = x.limit && x.owed > x.limit;
  document.getElementById('rp').innerHTML = '<div class="card"><div class="who"><span class="av">' + ini(x.name) + '</span><div><h1>' + x.name + '</h1><div class="m">' + x.phone + (x.phone2 ? ' · ' + x.phone2 : '') + ' · ' + x.code + ' · since ' + day(x.since) + '</div>' +
    '<div class="tags">' + (K === 'c' ? '<span>' + x.level + ' prices</span>' : '<span>terms ' + x.terms + ' days</span>') + (over ? '<span class="bad">over the limit</span>' : '') + (x.page ? '<span>own page on</span>' : '<span>own page off</span>') + '</div></div>' +
    '<button class="new" onclick="toast(\'Opens New ' + (K === 'c' ? 'customer' : 'supplier') + '\')">+ New ' + (K === 'c' ? 'customer' : 'supplier') + '</button></div>' +
    '<div class="figs"><div><small>Outstanding</small><div class="big"><em>Rs</em>' + money(x.owed) + '</div><span>' + x.bills.length + ' unpaid bills' + (x.bills.length ? ' · oldest ' + x.oldest + ' days' : '') + '</span></div>' +
    '<div><small>' + (K === 'c' ? 'Credit limit' : 'Cheques out') + '</small><b>' + (K === 'c' ? money(x.limit) : money(x.chequesOut)) + '</b><span>' + (K === 'c' ? (over ? 'over by ' + money(x.owed - x.limit) : money(x.limit - x.owed) + ' left') : x.chequesOut ? 'not cleared yet' : 'none pending') + '</span></div>' +
    '<div><small>Last payment</small><b>' + (x.lastPay ? money(x.lastPay.amt) : '—') + '</b><span>' + (x.lastPay ? day(x.lastPay.date) + ' · ' + x.lastPay.how : 'nothing received yet') + '</span></div></div>' +
    (x.owed ? '<div class="age"><div class="ab">' + b.map(function (v) { return '<i style="width:' + (v / tot * 100) + '%"></i>'; }).join('') + '</div><div class="al">' + ['up to 30 days', '31–60', '61–90', 'over 90'].map(function (t, i) { return '<span>' + t + '<b>' + (b[i] ? short(b[i]) : '—') + '</b></span>'; }).join('') + '</div></div>' : '') + '</div>' +
    '<div class="dock">' + first.map(function (a) { return '<button class="' + (a[2] || '') + '" data-a="' + a[0] + '">' + a[0] + (a[1] ? '<kbd>' + a[1] + '</kbd>' : '') + '</button>'; }).join('') +
    '<button class="more" onclick="menuOn=!menuOn;draw()">More ▾</button><div class="menu ' + (menuOn ? 'on' : '') + '">' + rest.map(function (a) { return '<a data-a="' + a[0] + '">' + a[0] + (a[1] ? '<kbd>' + a[1] + '</kbd>' : '') + '</a>'; }).join('') + '</div></div>' +
    '<div class="grid"><div class="box"><h4>Unpaid bills <span>oldest first</span></h4>' + (x.bills.length ? x.bills.map(function (bl) { return '<div class="bl"><b>' + bl.no + '</b><span style="color:var(--steel)">' + day(bl.date) + '</span><i class="' + tone(bl.age) + '">' + bl.age + ' days</i><em>' + money(bl.amt) + '</em></div>'; }).join('') : '<div class="empty">Nothing owing — all paid up.</div>') + '</div>' +
    '<div><div class="box"><h4>Their own page <span>' + (x.page ? 'on' : 'off') + '</span></h4><div class="pg"><b>' + (x.page ? 'Signs in with a code texted to ' + x.phone : 'Switch it on to let them see what they owe') + '</b><button data-a="' + (x.page ? 'Text the link' : 'Switch on') + '">' + (x.page ? 'Text the link' : 'Switch on') + '</button></div></div>' +
    '<div class="box" style="margin-top:12px"><h4>Notes & calls <span>' + x.notes.length + '</span></h4>' + (x.notes.length ? x.notes.map(function (n) { return '<div class="note">' + n + '</div>'; }).join('') : '<div class="empty">No calls or notes yet.</div>') + '</div>' +
    '<div class="box" style="margin-top:12px"><h4>In all</h4><div class="pg"><b>Bought Rs ' + money(x.bought) + '</b><span style="color:var(--steel)">' + x.billsAll + ' bills</span></div></div></div></div>';
  if (focus) document.getElementById('q').focus();
  var on = document.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
};
document.addEventListener('click', function (e) { if (menuOn && !e.target.closest('.dock')) { menuOn = false; draw(); } });
draw(true);
</script>
</body></html>
