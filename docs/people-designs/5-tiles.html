<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5 · Tiles — Customers & Suppliers</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--bg:#eef0f3;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden}
.app{position:fixed;left:68px;right:0;top:0;bottom:0;display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px}
.lp{background:#1d2125;color:#fff;border-radius:20px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.lh{padding:14px 14px 8px}
.kind{display:flex;gap:6px}
.kind span{flex:1;text-align:center;padding:9px 0;border-radius:11px;font-weight:700;color:rgba(255,255,255,.55);cursor:pointer;background:rgba(255,255,255,.06)}
.kind span.on{background:var(--red);color:#fff}
.sbox{margin-top:10px;display:flex;align-items:center;gap:10px;height:44px;border-radius:12px;padding:0 12px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.5);border:2px solid transparent}
.sbox:focus-within{border-color:#ff8d95}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 15px Inter;color:#fff;min-width:0}.sbox input::placeholder{color:rgba(255,255,255,.4)}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:9px 0 2px}
.chip{border-radius:8px;padding:4px 9px;font:600 12px Inter;color:rgba(255,255,255,.6);cursor:pointer;background:rgba(255,255,255,.06)}
.chip.on{background:#fff;color:var(--ink)}
.cnt{font-size:12px;color:rgba(255,255,255,.45);padding:7px 2px 0}
.list{flex:1;overflow:auto;padding:4px 8px 10px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:9px 8px;border-radius:13px;cursor:pointer}
.row:hover{background:rgba(255,255,255,.05)}.row.on{background:#fff;color:var(--ink)}
.av{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font:800 13px Archivo;background:rgba(255,255,255,.1);grid-row:1/3}
.row.on .av{background:var(--red);color:#fff}
.row b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .a{font:800 13.5px Archivo;text-align:right;white-space:nowrap}
.row .s{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,.5);margin-top:3px}.row.on .s{color:var(--steel)}
.bar{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.row.on .bar{background:#eceef1}
.bar i{display:block;height:100%;border-radius:3px}.bar i.old{background:#ff6b5e}.bar i.mid{background:#ffb547}.bar i.new{background:#4cd18a}
.rp{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.top{background:#fff;border-radius:20px;padding:18px 20px;display:flex;gap:16px;align-items:center;box-shadow:0 0 0 1px var(--line)}
.top .big{width:60px;height:60px;border-radius:18px;background:linear-gradient(150deg,#5a1019,#AE1E2B);color:#fff;display:grid;place-items:center;font:900 21px Archivo;flex:none}
.top h1{font:900 24px/1.15 Archivo}.top .m{font-size:13px;color:var(--steel);margin-top:3px}
.tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tags span{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef0f2}.tags .bad{background:#fde7e3;color:var(--old)}
.top .new{margin-left:auto;align-self:flex-start;border:0;background:var(--ink);color:#fff;border-radius:12px;height:40px;padding:0 14px;font:800 13px Inter;cursor:pointer;white-space:nowrap}
.ribbon{background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);display:flex;padding:6px;gap:2px;overflow-x:auto}
.ribbon button{flex:1;min-width:76px;border:0;background:none;border-radius:12px;padding:8px 4px 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font:600 11.5px Inter;color:var(--ink);line-height:1.15;text-align:center}
.ribbon button:hover{background:#f6f2f2;color:var(--red)}
.ribbon button svg{width:22px;height:22px}
.ribbon button.main{background:var(--red);color:#fff}
.ribbon kbd{font:700 9.5px Inter;color:var(--steel)}.ribbon .main kbd{color:rgba(255,255,255,.75)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{border-radius:18px;padding:14px 16px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.tile small{font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel)}
.tile b{display:block;font:900 23px Archivo;margin-top:4px;letter-spacing:-.01em}
.tile span{font-size:12px;color:var(--steel)}
.tile.r{background:linear-gradient(150deg,#2a0b10,#5a1019 58%,#AE1E2B);color:#fff;box-shadow:none}.tile.r small,.tile.r span{color:rgba(255,255,255,.7)}
.meter{height:6px;border-radius:4px;background:#eceef1;margin:8px 0 5px;overflow:hidden}.meter i{display:block;height:100%;background:var(--new)}.meter i.o{background:var(--old)}
.box{background:#fff;border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:6px 0 0;overflow:hidden}
.box h4{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font:800 15px Inter}.box h4 span{font:500 12px Inter;color:var(--steel)}
.bl{display:grid;grid-template-columns:28px 1fr 90px 90px 120px;align-items:center;padding:10px 16px;border-top:1px solid #f0f1f3;cursor:pointer;font-size:13.5px}
.bl:hover{background:#fafbfc}.bl.t{background:#fbf1f2}
.ck{width:18px;height:18px;border-radius:5px;border:2px solid #c3c8ce;display:grid;place-items:center;color:#fff;font-size:12px}.bl.t .ck{background:var(--red);border-color:var(--red)}
.bl em{font:800 14px Archivo;font-style:normal;text-align:right}.bl .d{color:var(--steel)}
.ag{font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;justify-self:start}.ag.old{background:#fde7e3;color:var(--old)}.ag.mid{background:#fdf1dc;color:#9a5d00}.ag.new{background:#e2f5ea;color:#1f7a4b}
.payb{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#1d2125;color:#fff}
.payb span{flex:1;font-size:13px;color:rgba(255,255,255,.7)}.payb b{font:900 18px Archivo;color:#fff}
.payb button{border:0;background:var(--red);color:#fff;border-radius:11px;height:40px;padding:0 16px;font:800 13.5px Inter;cursor:pointer}
.payb button:disabled{opacity:.4;cursor:default}
.empty{padding:14px 16px;color:var(--steel)}
.note{margin:0 16px 12px;background:#fffbea;border-radius:12px;padding:10px 12px;font-size:13px}
</style></head><body>
<div class="rail-bg"></div>
<div class="app"><div class="lp" id="lp"></div><div class="rp" id="rp"></div></div>
<script src="people.js"></script>
<script>
var ticked = {}, lastSel = '';
var IC = {
  'Take a payment': '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>', 'Pay supplier': '<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  'New bill': '<path d="M6 3h9l3 3v15H6z"/><path d="M12 10v6M9 13h6"/>', 'New purchase': '<path d="M6 3h9l3 3v15H6z"/><path d="M12 10v6M9 13h6"/>',
  'Statement': '<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>', 'Text it': '<path d="M4 5h16v11H9l-5 4z"/>', 'Remind': '<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>',
  'WhatsApp': '<path d="M4 20l1.5-4A8 8 0 1112 20a8 8 0 01-4-1z"/>', 'Add a note': '<path d="M5 4h14v12l-4 4H5z"/><path d="M15 20v-4h4"/>', 'Edit': '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  'Log a call': '<path d="M5 4h4l2 5-3 2a11 11 0 005 5l2-3 5 2v4a2 2 0 01-2 2A17 17 0 013 6a2 2 0 012-2z"/>', 'Previous balance': '<path d="M3 12a9 9 0 109-9 9 9 0 00-7 3L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>',
  'Black / red list…': '<circle cx="12" cy="12" r="9"/><path d="M6 6l12 12"/>', 'Their page link': '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',
  'Goods back': '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>', 'Damage returns': '<path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17v.5"/>', 'Show them their stock': '<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
  "Show the rep's phone": '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>', 'Credit periods': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'
};
window.draw = function (focus) {
  var K = P.kind, all = PEOPLE[K], L = list(), x = cur();
  document.getElementById('lp').innerHTML = '<div class="lh"><div class="kind"><span data-kind="c" class="' + (K === 'c' ? 'on' : '') + '">Customers</span><span data-kind="s" class="' + (K === 's' ? 'on' : '') + '">Suppliers</span></div>' +
    '<label class="sbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name, mobile, code…" autocomplete="off" value="' + P.q + '"></label>' +
    '<div class="chips">' + FILTERS[K].map(function (f) { return '<span class="chip ' + (P.f === f ? 'on' : '') + '" data-f="' + f + '">' + f + '</span>'; }).join('') + '</div>' +
    '<div class="cnt">' + L.length + ' of ' + all.length + ' · Rs ' + short(all.reduce(function (a, y) { return a + y.owed; }, 0)) + ' outstanding</div></div>' +
    '<div class="list">' + L.map(function (y, i) {
      var pct = y.limit ? Math.min(100, y.owed / y.limit * 100) : Math.min(100, y.oldest / 90 * 100);
      return '<div class="row ' + (i === P.sel ? 'on' : '') + '" data-i="' + i + '"><span class="av">' + ini(y.name) + '</span><b>' + y.name + '</b><span class="a">' + (y.owed ? money(y.owed) : '—') + '</span>' +
        '<span class="s">' + (y.owed ? '<span class="bar"><i class="' + tone(y.oldest) + '" style="width:' + Math.max(6, pct) + '%"></i></span>' + y.oldest + 'd' : 'all clear') + '</span></div>';
    }).join('') + '</div>';
  if (!x) { document.getElementById('rp').innerHTML = '<div class="box"><div class="empty">Nobody matches that.</div></div>'; return; }
  if (lastSel !== K + x.id) { ticked = {}; lastSel = K + x.id; }
  var over = x.limit && x.owed > x.limit, A = ACTIONS[K], tk = x.bills.filter(function (b) { return ticked[b.no]; }), tsum = tk.reduce(function (a, b) { return a + b.amt; }, 0);
  var lp = x.limit ? Math.min(100, x.owed / x.limit * 100) : 0;
  document.getElementById('rp').innerHTML = '<div class="top"><span class="big">' + ini(x.name) + '</span><div><h1>' + x.name + '</h1><div class="m">' + x.phone + (x.phone2 ? ' · ' + x.phone2 : '') + ' · ' + x.code + ' · since ' + day(x.since) + '</div>' +
    '<div class="tags">' + (K === 'c' ? '<span>' + x.level + ' prices</span>' : '<span>terms ' + x.terms + ' days</span>') + (over ? '<span class="bad">over the limit</span>' : '') + '<span>own page ' + (x.page ? 'on' : 'off') + '</span></div></div>' +
    '<button class="new" onclick="toast(\'Opens New ' + (K === 'c' ? 'customer' : 'supplier') + '\')">+ New ' + (K === 'c' ? 'customer' : 'supplier') + '</button></div>' +
    '<div class="ribbon">' + A.map(function (a) { return '<button class="' + (a[2] || '') + '" data-a="' + a[0] + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' + (IC[a[0]] || '<circle cx="12" cy="12" r="8"/>') + '</svg>' + a[0] + (a[1] ? '<kbd>' + a[1] + '</kbd>' : '') + '</button>'; }).join('') + '</div>' +
    '<div class="tiles"><div class="tile r"><small>Outstanding</small><b>Rs ' + money(x.owed) + '</b><span>' + x.bills.length + ' bills' + (x.bills.length ? ' · oldest ' + x.oldest + ' days' : '') + '</span></div>' +
    (K === 'c' ? '<div class="tile"><small>Credit limit</small><b>' + money(x.limit) + '</b><div class="meter"><i class="' + (over ? 'o' : '') + '" style="width:' + lp + '%"></i></div><span>' + (over ? 'over by ' + money(x.owed - x.limit) : money(x.limit - x.owed) + ' left') + '</span></div>'
      : '<div class="tile"><small>Cheques out</small><b>' + money(x.chequesOut) + '</b><span>' + (x.chequesOut ? 'not cleared yet' : 'none pending') + '</span></div>') +
    '<div class="tile"><small>Last payment</small><b>' + (x.lastPay ? money(x.lastPay.amt) : '—') + '</b><span>' + (x.lastPay ? ago(x.lastPay.date) + ' · ' + x.lastPay.how : 'nothing received yet') + '</span></div>' +
    '<div class="tile"><small>Bought in all</small><b>' + money(x.bought) + '</b><span>' + x.billsAll + ' bills</span></div></div>' +
    '<div class="box"><h4>Unpaid bills <span>tick the ones being paid</span></h4>' + (x.bills.length ? x.bills.map(function (b) {
      return '<div class="bl ' + (ticked[b.no] ? 't' : '') + '" onclick="ticked[\'' + b.no + '\']=!ticked[\'' + b.no + '\'];draw()"><span class="ck">' + (ticked[b.no] ? '✓' : '') + '</span><b>' + b.no + '</b><span class="d">' + day(b.date) + '</span><span class="ag ' + tone(b.age) + '">' + b.age + ' days</span><em>' + money(b.amt) + '</em></div>';
    }).join('') + '<div class="payb"><span>' + (tk.length ? tk.length + ' ticked' : 'Nothing ticked — the payment goes to the oldest first') + '</span>' + (tk.length ? '<b>Rs ' + money(tsum) + '</b>' : '') +
      '<button data-a="' + (K === 'c' ? 'Take a payment' : 'Pay supplier') + (tk.length ? ' (' + money(tsum) + ')' : '') + '">' + (K === 'c' ? 'Take payment' : 'Pay') + ' <kbd style="font:700 10px Inter;opacity:.7">F7</kbd></button></div>'
      : '<div class="empty">Nothing owing — all paid up.</div>') +
    x.notes.map(function (n) { return '<div class="note">📝 ' + n + '</div>'; }).join('') + '</div>';
  if (focus) document.getElementById('q').focus();
  var on = document.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
};
draw(true);
</script>
</body></html>
