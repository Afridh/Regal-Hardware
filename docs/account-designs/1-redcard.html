<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Red card — Put on account</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(470px,100vw);background:#fff;z-index:2;display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.45);animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.hd{display:flex;align-items:flex-start;padding:18px 20px 10px}
.hd h2{font:800 20px Archivo,sans-serif}.hd p{color:var(--steel);font-size:13px;margin-top:2px}.hd p b{color:var(--ink)}
.x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:600 12.5px Inter;cursor:pointer}
.x kbd{font:700 10px Inter;color:var(--steel);margin-left:6px}
.sbox{margin:4px 20px 0;display:flex;align-items:center;gap:10px;height:48px;border-radius:12px;padding:0 12px;background:#f2f3f5;border:2px solid transparent;color:var(--steel)}
.sbox:focus-within{border-color:var(--red);background:#fff}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 16px Inter;color:var(--ink)}
.lbl{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin:14px 20px 6px}
.list{flex:1;overflow:auto;padding:0 12px}
.row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px;border-radius:12px;cursor:pointer}
.row:hover{background:#f6f7f8}.row.on{background:var(--ink);color:#fff}
.row .dot{width:9px;height:9px;border-radius:50%}.dot.old{background:var(--old)}.dot.mid{background:var(--mid)}.dot.new{background:var(--new)}
.row b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font:800 14.5px Archivo}
.row .s{grid-column:2/4;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--steel)}.row.on .s{color:rgba(255,255,255,.65)}
.row .lb{flex:1;height:4px;border-radius:9px;background:#e9ecef;overflow:hidden;max-width:120px}.row.on .lb{background:rgba(255,255,255,.18)}
.row .lb i{display:block;height:100%;background:var(--new)}.row .lb i.hi{background:var(--mid)}.row .lb i.over{background:var(--old)}
.ft{display:flex;gap:8px;align-items:center;padding:12px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--steel)}
.ft button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font:600 12.5px Inter;cursor:pointer}
.ft span{margin-left:auto}
/* step 2 */
.card{margin:6px 16px 0;border-radius:18px;padding:16px 18px;color:#fff;background:linear-gradient(150deg,#2a0b10,#5a1019 60%,#AE1E2B);position:relative;overflow:hidden}
.card:after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.who{display:flex;align-items:center;gap:10px}.who .av{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);display:grid;place-items:center;font:800 15px Archivo}
.who b{display:block;font:800 15.5px Archivo;line-height:1.2}.who span{font-size:12px;color:rgba(255,255,255,.7)}
.who button{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:6px 10px;font:700 12px Inter;cursor:pointer;position:relative;z-index:1}
.flow{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:8px;margin-top:14px}
.flow small{display:block;font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.flow .n{font:800 18px Archivo}.flow .n.big{font:900 27px/1.05 Archivo}
.flow .ar{font-size:20px;opacity:.6;padding-bottom:4px}
.meter{margin-top:12px;height:8px;border-radius:9px;background:rgba(255,255,255,.15);position:relative;overflow:hidden}
.meter i{position:absolute;top:0;bottom:0;left:0;background:#fff;opacity:.9;border-radius:9px}
.meter u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#ffc35c 0 5px,#ffd98f 5px 10px);text-decoration:none}
.meter u.over{background:repeating-linear-gradient(45deg,#ff8a7a 0 5px,#ffb0a5 5px 10px)}
.mtx{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.72);margin-top:5px}
.warn{margin:10px 16px 0;background:#fdecea;color:#8b1e12;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.warn button{margin-left:auto;border:0;background:#8b1e12;color:#fff;border-radius:9px;padding:7px 12px;font:700 12.5px Inter;cursor:pointer}
.ok{margin:10px 16px 0;background:#e2f5ea;color:#1f6b43;border-radius:12px;padding:9px 12px;font-size:13px}
.body{flex:1;overflow:auto;padding:4px 20px 10px}
.f{display:block;margin-top:12px}.f>span{display:block;font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);margin-bottom:5px}
.f input{width:100%;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:700 18px Archivo;outline:0}
.f input:focus{border-color:var(--red)}
.f input.small{font:500 14px Inter;height:40px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 12.5px Inter;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill kbd{font:700 10px Inter;opacity:.55;margin-left:4px}
.split{display:flex;justify-content:space-between;margin-top:10px;background:#f6f7f8;border-radius:12px;padding:10px 12px;font-size:13px}
.split b{font:800 15px Archivo}
.save{margin:10px 16px 16px;height:58px;border:0;border-radius:16px;background:var(--red);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 12px 24px -12px var(--red)}
.save b{font:800 17px Inter}.save span{font-size:12px;opacity:.8}
.save:disabled{background:#c9ced4;box-shadow:none;cursor:not-allowed}
</style></head><body>
<div class="dim"></div>
<div class="sheet" id="sheet"></div>
<script src="../payment-designs/common.js"></script>
<script src="till.js"></script>
<script>
till();
var head = function () { return '<div class="hd"><div><h2>Put on account</h2><p>this bill <b>Rs ' + money(BILL.total) + '</b> · ' + BILL.lines + ' lines</p></div><button class="x" data-act="close">Close<kbd>Esc</kbd></button></div>'; };
window.draw = function (focus) {
  var el = document.getElementById('sheet'), c = ST.cust;
  if (!c) {
    var L = cands(); ST.sel = Math.min(ST.sel, Math.max(0, L.length - 1));
    el.innerHTML = head() + '<label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name or mobile…" autocomplete="off" value="' + ST.q + '"></label>' +
      '<div class="lbl">' + (ST.q.trim() ? 'Customers' : 'Your regular credit customers') + '</div><div class="list">' + L.map(function (x, i) {
        var pct = x.limit ? Math.min(100, Math.round(x.owed / x.limit * 100)) : 0;
        return '<div class="row ' + (i === ST.sel ? 'on' : '') + '" data-c="' + i + '"><span class="dot ' + ageTone(x.oldest) + '"></span><b>' + mark(x.name, ST.q) + '</b><span class="a">' + (x.owed ? money(x.owed) : 'clear') + '</span>' +
          '<span class="s">' + x.phone + (x.limit ? '<span class="lb"><i class="' + (pct >= 100 ? 'over' : pct >= 80 ? 'hi' : '') + '" style="width:' + pct + '%"></i></span>' + pct + '% of limit' : '') + '</span></div>';
      }).join('') + '</div><div class="ft"><button data-act="new">New customer…</button><button data-act="close">Full payment screen</button><span>↑ ↓ · Enter</span></div>';
    if (focus !== false) { var q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    var on = el.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  var f = fig(c), now = f.pctNow, add = Math.max(0, f.pctAfter - f.pctNow);
  el.innerHTML = head() + '<div class="card"><div class="who"><span class="av">' + initials(c.name) + '</span><div><b>' + c.name + '</b><span>' + c.phone + ' · retail prices</span></div><button data-act="back">Someone else</button></div>' +
    '<div class="flow"><div><small>Outstanding now</small><span class="n">' + money(f.owes) + '</span></div><span class="ar">→</span><div style="text-align:right"><small>After this bill</small><span class="n big">' + money(f.after) + '</span></div></div>' +
    (c.limit ? '<div class="meter"><i style="width:' + now + '%"></i><u class="' + (f.after > c.limit ? 'over' : '') + '" style="left:' + now + '%;width:' + add + '%"></u></div><div class="mtx"><span>limit Rs ' + money(c.limit) + '</span><span>' + (f.left >= 0 ? money(f.left) + ' left after' : 'over by ' + money(-f.left)) + '</span></div>' : '') + '</div>' +
    (f.over ? '<div class="warn">Over their limit by <b>' + money(f.overBy) + '</b><button data-act="allow">Allow it</button></div>' : ST.allowed ? '<div class="ok">Over the limit — allowed by Afridh</div>' : '') +
    '<div class="body"><label class="f"><span>Paid now</span><input id="paid" inputmode="decimal" placeholder="nothing — all on account" value="' + ST.paid + '"></label>' +
    '<div class="pills"><button class="pill" data-act="half">Half</button><button class="pill" data-act="nothing">Nothing now</button>' + (+ST.paid ? HOWS.map(function (h, i) { return '<button class="pill ' + (ST.how === h[0] ? 'on' : '') + '" data-how="' + h[0] + '">' + h[1] + '<kbd>' + (i + 1) + '</kbd></button>'; }).join('') : '') + '</div>' +
    (+ST.paid ? '<div class="split"><span>Paid now · ' + ST.how.toLowerCase() + ' <b>' + money(f.paid) + '</b></span><span>On account <b>' + money(f.on) + '</b></span></div>' : '') +
    '<label class="f"><span>Taken by (on the bill)</span><input id="taken" class="small" placeholder="name or vehicle no." value="' + ST.taken + '"></label>' +
    '<div class="f"><span>The bill</span><div class="pills">' + PAPERS.map(function (p) { return '<button class="pill ' + (ST.paper === p[0] ? 'on' : '') + '" data-paper="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div></div>' +
    '<button class="save" data-act="save" ' + (f.over ? 'disabled' : '') + '><b>' + (f.paid ? 'Take ' + money(f.paid) + ' · rest on account' : 'Save Rs ' + money(f.on) + ' on account') + '</b><span>' + paperWord(ST.paper) + ' · Enter</span></button>';
  if (focus) document.getElementById('paid').focus();
};
draw(true);
</script>
</body></html>
