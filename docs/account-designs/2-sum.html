<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · The sum — Put on account</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1f1d1a;--steel:#77706a;--line:#e6dfd3;--paper:#fbf7ef;--old:#c0442c;--mid:#c9811a;--new:#2e8c5a}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(480px,100vw);background:var(--paper);z-index:2;display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.45);animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.top{background:var(--ink);color:#fff;padding:16px 20px 18px;display:flex;align-items:flex-end;gap:12px}
.top small{display:block;font:700 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.top .t{font:900 30px/1 Archivo;letter-spacing:-.02em;margin-top:4px}.top .t em{font-style:normal;font-size:16px;opacity:.6;margin-right:5px}
.top .l{color:rgba(255,255,255,.6);font-size:12.5px;margin-left:2px}
.top button{margin-left:auto;align-self:flex-start;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:10px;padding:7px 10px;font:700 12px Inter;cursor:pointer}
.sbox{margin:14px 18px 0;display:flex;align-items:center;gap:10px;height:48px;border-radius:12px;padding:0 12px;background:#fff;border:2px solid var(--line);color:var(--steel)}
.sbox:focus-within{border-color:var(--ink)}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 16px Inter;color:var(--ink)}
.lbl{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin:14px 20px 8px}
.grid{flex:1;overflow:auto;padding:0 18px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.tile:hover{transform:translateY(-2px)}
.tile.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile .h{display:flex;gap:8px;align-items:center}.tile .av{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:800 11.5px Archivo;color:#fff;flex:none}
.av.old{background:var(--old)}.av.mid{background:var(--mid)}.av.new{background:var(--new)}
.tile b{font-size:12.5px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .a{font:800 16px Archivo;margin-top:8px}.tile .p{font-size:11.5px;color:var(--steel)}.tile.on .p{color:rgba(255,255,255,.6)}
.ft{display:flex;gap:8px;align-items:center;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--steel)}
.ft button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 11px;font:600 12.5px Inter;cursor:pointer}.ft span{margin-left:auto}
/* step 2 */
.who{display:flex;align-items:center;gap:10px;padding:14px 20px 0}
.who b{font:800 16px Archivo;display:block}.who span{font-size:12px;color:var(--steel)}
.who button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:700 12px Inter;cursor:pointer}
.sum{margin:12px 18px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px 16px 10px;font-family:'JetBrains Mono',monospace}
.ln{display:grid;grid-template-columns:22px 1fr auto;align-items:center;padding:8px 0;font-size:14px}
.ln+.ln{border-top:1px dashed var(--line)}
.ln i{font-style:normal;font-weight:700;color:var(--steel)}
.ln span{font-family:Inter;color:var(--steel);font-size:13px}
.ln b{font-weight:700}
.ln.paid input{width:150px;text-align:right;border:0;border-bottom:2px solid var(--line);font:700 14px 'JetBrains Mono';outline:0;background:none;padding:2px 0}
.ln.paid input:focus{border-color:var(--red)}
.ln.tot{border-top:2px solid var(--ink)!important;padding-top:10px}
.ln.tot span{color:var(--ink);font-weight:700;font-size:14px}.ln.tot b{font-size:20px}
.ln.tot b.bad{color:var(--old)}
.lim{margin:8px 18px 0;font-size:12.5px;color:var(--steel);display:flex;justify-content:space-between}
.lim b{color:var(--ink)}
.warn{margin:10px 18px 0;background:#fdecea;color:#8b1e12;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center}
.warn button{margin-left:auto;border:0;background:#8b1e12;color:#fff;border-radius:9px;padding:7px 12px;font:700 12.5px Inter;cursor:pointer}
.ok{margin:10px 18px 0;background:#e2f5ea;color:#1f6b43;border-radius:12px;padding:9px 12px;font-size:13px}
.body{flex:1;overflow:auto;padding:0 18px 10px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row>small{font:700 11px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--steel);width:62px}
.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font:600 12.5px Inter;cursor:pointer;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.row input{flex:1;height:38px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:500 14px Inter;outline:0;background:#fff}
.save{margin:8px 18px 16px;height:58px;border:0;border-radius:16px;background:var(--ink);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.save b{font:800 16px Inter}.save span{font-size:12px;opacity:.7;text-align:right}
.save:disabled{background:#c9c3ba;cursor:not-allowed}
</style></head><body>
<div class="dim"></div>
<div class="sheet" id="sheet"></div>
<script src="../payment-designs/common.js"></script>
<script src="till.js"></script>
<script>
till();
var top_ = function () { return '<div class="top"><div><small>Put on account · this bill</small><div class="t"><em>Rs</em>' + money(BILL.total) + '</div></div><span class="l">' + BILL.lines + ' lines</span><button data-act="close">Close · Esc</button></div>'; };
window.draw = function (focus) {
  var el = document.getElementById('sheet'), c = ST.cust;
  if (!c) {
    var L = cands(); ST.sel = Math.min(ST.sel, Math.max(0, L.length - 1));
    el.innerHTML = top_() + '<label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Who is it for? Name or mobile" autocomplete="off" value="' + ST.q + '"></label>' +
      '<div class="lbl">' + (ST.q.trim() ? 'Customers' : 'Who buys on account most') + '</div><div class="grid">' + L.map(function (x, i) {
        return '<div class="tile ' + (i === ST.sel ? 'on' : '') + '" data-c="' + i + '"><div class="h"><span class="av ' + ageTone(x.oldest) + '">' + initials(x.name) + '</span><b>' + mark(x.name, ST.q) + '</b></div><div class="a">' + (x.owed ? money(x.owed) : 'clear') + '</div><div class="p">' + x.phone + '</div></div>';
      }).join('') + '</div><div class="ft"><button data-act="new">New customer…</button><button data-act="close">Full payment screen</button><span>↑ ↓ · Enter</span></div>';
    if (focus !== false) { var q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    var on = el.querySelector('.tile.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  var f = fig(c);
  el.innerHTML = top_() + '<div class="who"><div><b>' + c.name + '</b><span>' + c.phone + ' · retail prices</span></div><button data-act="back">Someone else</button></div>' +
    '<div class="sum"><div class="ln"><i></i><span>Outstanding now</span><b>' + money(f.owes) + '</b></div>' +
    '<div class="ln"><i>+</i><span>This bill</span><b>' + money(BILL.total) + '</b></div>' +
    '<div class="ln paid"><i>−</i><span>Paid now</span><input id="paid" inputmode="decimal" placeholder="0.00" value="' + ST.paid + '"></div>' +
    '<div class="ln tot"><i>=</i><span>Outstanding after</span><b class="' + (f.over ? 'bad' : '') + '">' + money(f.after) + '</b></div></div>' +
    (c.limit ? '<div class="lim"><span>Their limit <b>' + money(c.limit) + '</b></span><span>' + (f.left >= 0 ? '<b>' + money(f.left) + '</b> left after' : 'over by <b style="color:var(--old)">' + money(-f.left) + '</b>') + '</span></div>' : '') +
    (f.over ? '<div class="warn">Over their limit by <b>' + money(f.overBy) + '</b><button data-act="allow">Allow it</button></div>' : ST.allowed ? '<div class="ok">Over the limit — allowed by Afridh</div>' : '') +
    '<div class="body">' + (+ST.paid ? '<div class="row"><small>Paid by</small>' + HOWS.map(function (h) { return '<button class="pill ' + (ST.how === h[0] ? 'on' : '') + '" data-how="' + h[0] + '">' + h[1] + '</button>'; }).join('') + '</div>' : '<div class="row"><small>Paid now</small><button class="pill" data-act="half">Half</button><button class="pill" data-act="nothing">Nothing</button></div>') +
    '<div class="row"><small>Taken by</small><input id="taken" placeholder="name or vehicle no." value="' + ST.taken + '"></div>' +
    '<div class="row"><small>Bill</small>' + PAPERS.map(function (p) { return '<button class="pill ' + (ST.paper === p[0] ? 'on' : '') + '" data-paper="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div>' +
    '<button class="save" data-act="save" ' + (f.over ? 'disabled' : '') + '><b>' + (f.paid ? 'Take ' + money(f.paid) + ', rest on account' : 'Save on account') + '</b><span>' + paperWord(ST.paper) + '<br>Enter</span></button>';
  if (focus) document.getElementById('paid').focus();
};
draw(true);
</script>
</body></html>
