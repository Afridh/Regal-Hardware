<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Steps — Put on account</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#24476b;--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e3e7ec;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(470px,100vw);background:#f4f6f8;z-index:2;display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.45);animation:in .35s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{transform:translateX(40px);opacity:0}}
.hd{background:#fff;padding:16px 20px 0;border-bottom:1px solid var(--line)}
.hd .r{display:flex;align-items:center}.hd h2{font:800 19px Archivo}.hd p{margin-left:10px;color:var(--steel);font-size:13px}
.hd button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 10px;font:600 12px Inter;cursor:pointer}
.steps{display:flex;margin-top:12px}
.st{flex:1;display:flex;align-items:center;gap:8px;padding:10px 0 12px;font:700 12.5px Inter;color:#9aa3ad;border-bottom:3px solid transparent}
.st i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#e9edf1;font-size:11.5px}
.st.on{color:var(--blue);border-color:var(--blue)}.st.on i{background:var(--blue);color:#fff}
.st.done{color:var(--ink)}.st.done i{background:var(--new);color:#fff}
.sbox{margin:14px 16px 0;display:flex;align-items:center;gap:10px;height:48px;border-radius:12px;padding:0 12px;background:#fff;border:2px solid var(--line);color:var(--steel)}
.sbox:focus-within{border-color:var(--blue)}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 16px Inter;color:var(--ink)}
.list{flex:1;overflow:auto;padding:10px 16px}
.row{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:11px 12px;margin-bottom:6px;cursor:pointer;border:2px solid transparent}
.row.on{border-color:var(--blue);box-shadow:0 8px 18px -12px var(--blue)}
.row .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 13px Archivo;background:#e9edf1;color:var(--blue);flex:none}
.row.on .av{background:var(--blue);color:#fff}
.row .nm{flex:1;min-width:0}.row b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm span{font-size:12px;color:var(--steel)}
.row .a{text-align:right}.row .a b{font:800 15px Archivo}.row .a i{font-style:normal;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px}
i.old{background:#fde7e3;color:var(--old)}i.mid{background:#fdf0dc;color:#a8650b}i.new{background:#e2f5ea;color:#1f7a4b}
.body{flex:1;overflow:auto;padding:12px 16px}
.box{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px}
.box h4{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);display:flex;gap:8px;align-items:center;margin-bottom:8px}
.box h4 i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-size:11px;letter-spacing:0}
.who{display:flex;align-items:center;gap:10px}.who .av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font:800 14px Archivo}
.who b{display:block;font:800 15.5px Archivo}.who span{font-size:12px;color:var(--steel)}
.who button{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font:700 12px Inter;cursor:pointer}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.kv div{background:#f4f6f8;border-radius:12px;padding:8px 10px}.kv small{display:block;font-size:11px;color:var(--steel)}.kv b{font:800 15px Archivo}
.bar{height:6px;background:#e9edf1;border-radius:9px;margin-top:10px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--blue)}.bar u{display:block;height:100%;background:#7fa6cf;text-decoration:none}.bar u.over{background:var(--old)}
.bt{display:flex;justify-content:space-between;font-size:11.5px;color:var(--steel);margin-top:4px}
.paid{display:flex;gap:8px;align-items:center}
.paid input{flex:1;height:46px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font:800 18px Archivo;outline:0}
.paid input:focus{border-color:var(--blue)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font:600 12.5px Inter;cursor:pointer}
.pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
.box input.small{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:500 14px Inter;outline:0;margin-top:8px}
.warn{background:#fdecea;color:#8b1e12;border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;margin-bottom:10px}
.warn button{margin-left:auto;border:0;background:#8b1e12;color:#fff;border-radius:9px;padding:7px 12px;font:700 12.5px Inter;cursor:pointer}
.ok{background:#e2f5ea;color:#1f6b43;border-radius:12px;padding:9px 12px;font-size:13px;margin-bottom:10px}
.dock{background:var(--ink);color:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:12px}
.dock .f small{display:block;font-size:11px;color:rgba(255,255,255,.6)}.dock .f b{font:800 18px Archivo}
.dock .f+.f{border-left:1px solid rgba(255,255,255,.14);padding-left:12px}
.dock button{margin-left:auto;height:50px;border:0;border-radius:14px;background:var(--red);color:#fff;font:800 15px Inter;padding:0 18px;cursor:pointer}
.dock button span{display:block;font:600 11px Inter;opacity:.75}
.dock button:disabled{background:#59606a;cursor:not-allowed}
.ft{display:flex;gap:8px;padding:10px 16px;border-top:1px solid var(--line);background:#fff;font-size:12px;color:var(--steel);align-items:center}
.ft button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font:600 12px Inter;cursor:pointer}.ft span{margin-left:auto}
</style></head><body>
<div class="dim"></div>
<div class="sheet" id="sheet"></div>
<script src="../payment-designs/common.js"></script>
<script src="till.js"></script>
<script>
till();
var head = function (step) {
  var s = function (n, t) { return '<div class="st ' + (n === step ? 'on' : n < step ? 'done' : '') + '"><i>' + (n < step ? '✓' : n) + '</i>' + t + '</div>'; };
  return '<div class="hd"><div class="r"><h2>Put on account</h2><p>Rs ' + money(BILL.total) + ' · ' + BILL.lines + ' lines</p><button data-act="close">Close · Esc</button></div><div class="steps">' + s(1, 'Who') + s(2, 'Paid now') + s(3, 'The bill') + '</div></div>';
};
window.draw = function (focus) {
  var el = document.getElementById('sheet'), c = ST.cust;
  if (!c) {
    var L = cands(); ST.sel = Math.min(ST.sel, Math.max(0, L.length - 1));
    el.innerHTML = head(1) + '<label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name or mobile…" autocomplete="off" value="' + ST.q + '"></label>' +
      '<div class="list">' + L.map(function (x, i) {
        return '<div class="row ' + (i === ST.sel ? 'on' : '') + '" data-c="' + i + '"><span class="av">' + initials(x.name) + '</span><div class="nm"><b>' + mark(x.name, ST.q) + '</b><span>' + x.phone + (x.limit ? ' · limit ' + money(x.limit).replace('.00', '') : '') + '</span></div><div class="a">' + (x.owed ? '<b>' + money(x.owed) + '</b><br><i class="' + ageTone(x.oldest) + '">' + ageWord(x.oldest) + '</i>' : '<b style="color:#6b7480;font-size:13px">clear</b>') + '</div></div>';
      }).join('') + '</div><div class="ft"><button data-act="new">New customer…</button><button data-act="close">Full payment screen</button><span>↑ ↓ · Enter</span></div>';
    if (focus !== false) { var q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
    var on = el.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
    return;
  }
  var f = fig(c), step = +ST.paid ? 3 : 2;
  el.innerHTML = head(step) + '<div class="body">' +
    '<div class="box"><div class="who"><span class="av">' + initials(c.name) + '</span><div><b>' + c.name + '</b><span>' + c.phone + ' · retail prices</span></div><button data-act="back">Change</button></div>' +
    '<div class="kv"><div><small>Outstanding now</small><b>' + money(f.owes) + '</b></div><div><small>Oldest unpaid bill</small><b>' + ageWord(c.oldest) + '</b></div></div>' +
    (c.limit ? '<div class="bar"><i style="width:' + f.pctNow + '%"></i><u class="' + (f.after > c.limit ? 'over' : '') + '" style="width:' + Math.max(0, f.pctAfter - f.pctNow) + '%"></u></div><div class="bt"><span>limit Rs ' + money(c.limit) + '</span><span>' + (f.left >= 0 ? money(f.left) + ' left after this bill' : 'over by ' + money(-f.left)) + '</span></div>' : '') + '</div>' +
    (f.over ? '<div class="warn">Over their limit by <b>' + money(f.overBy) + '</b><button data-act="allow">Allow it</button></div>' : ST.allowed ? '<div class="ok">Over the limit — allowed by Afridh</div>' : '') +
    '<div class="box"><h4><i>2</i>Paid now</h4><div class="paid"><input id="paid" inputmode="decimal" placeholder="nothing" value="' + ST.paid + '"></div>' +
    '<div class="pills"><button class="pill" data-act="half">Half</button><button class="pill" data-act="nothing">Nothing now</button></div>' +
    (+ST.paid ? '<div class="pills">' + HOWS.map(function (h, i) { return '<button class="pill ' + (ST.how === h[0] ? 'on' : '') + '" data-how="' + h[0] + '">' + (i + 1) + ' · ' + h[1] + '</button>'; }).join('') + '</div>' : '') +
    '<input id="taken" class="small" placeholder="Taken by — name or vehicle no. (on the bill)" value="' + ST.taken + '"></div>' +
    '<div class="box"><h4><i>3</i>The bill</h4><div class="pills">' + PAPERS.map(function (p) { return '<button class="pill ' + (ST.paper === p[0] ? 'on' : '') + '" data-paper="' + p[0] + '">' + p[1] + '</button>'; }).join('') + '</div></div></div>' +
    '<div class="dock"><div class="f"><small>On account</small><b>' + money(f.on) + '</b></div><div class="f"><small>Outstanding after</small><b>' + money(f.after) + '</b></div>' +
    '<button data-act="save" ' + (f.over ? 'disabled' : '') + '>' + (f.paid ? 'Take ' + money(f.paid) : 'Save') + '<span>' + paperWord(ST.paper) + ' · Enter</span></button></div>';
  if (focus) document.getElementById('paid').focus();
};
draw(true);
</script>
</body></html>
