<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Look before you take — Customer payment</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--old:#c0442c;--mid:#d98a1c;--new:#2e9e64}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.win{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1080px,95vw);height:min(650px,92vh);background:#fff;border-radius:20px;z-index:2;display:grid;grid-template-columns:minmax(0,1fr) 420px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.5)}
.left{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.top{padding:18px 18px 10px}
.top h2{font:800 18px Archivo,sans-serif;display:flex;gap:8px;align-items:baseline}.top h2 small{font:500 12px Inter;color:var(--steel)}
.sbox{margin-top:10px;display:flex;align-items:center;gap:10px;height:46px;border-radius:12px;padding:0 12px;background:#f2f3f5;border:2px solid transparent}
.sbox:focus-within{border-color:var(--red);background:#fff}
.sbox input{flex:1;border:0;outline:0;background:none;font:600 16px Inter;color:var(--ink)}
.list{flex:1;overflow:auto;padding:4px 10px 10px}
.row{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer}
.row:hover{background:#f6f7f8}
.row.on{background:var(--ink);color:#fff}
.row.on .ph{color:rgba(255,255,255,.6)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.old{background:var(--old)}.dot.mid{background:var(--mid)}.dot.new{background:var(--new)}.dot.none{background:#c3c8ce}
.row .nm{flex:1;min-width:0}.row .nm b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ph{color:var(--steel);font-size:12px}
.row .a{font:800 15px Archivo;white-space:nowrap}
.row .a.zero{font:500 12px Inter;color:var(--steel)}
.right{background:linear-gradient(160deg,#2a0b10,#5a1019 60%,#AE1E2B);color:#fff;padding:22px 22px 18px;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.right:after{content:"";position:absolute;right:-90px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.06)}
.who{display:flex;gap:12px;align-items:center}
.who .av{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;font:800 18px Archivo}
.who b{display:block;font:800 17px Archivo;line-height:1.2}.who span{color:rgba(255,255,255,.7);font-size:12.5px}
.big{margin-top:18px}.big small{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:rgba(255,255,255,.65);font-weight:700}
.big div{font:900 40px/1.05 Archivo;letter-spacing:-.02em;margin-top:2px}.big div em{font-style:normal;font-size:20px;opacity:.7;margin-right:6px}
.lim{margin-top:10px}.lim .bar{height:6px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}.lim .bar i{display:block;height:100%;background:#7ee2a8;border-radius:9px}
.lim .bar i.hi{background:#ffc35c}.lim .bar i.over{background:#ff8a7a}
.lim span{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.7);margin-top:5px}
.bills{margin-top:16px;background:rgba(0,0,0,.22);border-radius:14px;padding:6px 12px;flex:1;min-height:0;overflow:auto}
.bills h4{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.6);padding:8px 0 4px}
.bl{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13.5px}
.bl i{font-style:normal;font-size:11.5px;padding:2px 8px;border-radius:999px;margin-left:8px;font-weight:700}
.bl i.old{background:#ff8a7a;color:#4a0d0a}.bl i.mid{background:#ffc35c;color:#4a2d00}.bl i.new{background:#7ee2a8;color:#073d20}
.bl b{font:800 14px Archivo}
.last{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:10px}
.go{margin-top:12px;display:flex;gap:8px}
.go button{flex:1;height:46px;border:0;border-radius:12px;font:800 14px Inter;cursor:pointer}
.go .pay{background:#fff;color:var(--red)}.go .pick{background:rgba(255,255,255,.14);color:#fff;flex:.7}
.go kbd{font:700 10.5px Inter;opacity:.6;margin-left:6px}
.none{margin:auto;text-align:center;color:rgba(255,255,255,.75)}
.none b{display:block;font:800 22px Archivo;color:#fff;margin-bottom:6px}
</style></head><body>
<div class="dim"></div>
<div class="win">
 <div class="left">
  <div class="top"><h2>Customer payment <small>Ctrl+M</small></h2>
   <label class="sbox"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6b7480" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="Name, mobile or code" autocomplete="off"></label></div>
  <div class="list" id="list"></div>
 </div>
 <div class="right" id="card"></div>
</div>
<script src="common.js"></script>
<script>
backdrop();
var q = document.getElementById('q'), cur = 0, rows = [];
function card(c) {
  if (!c) return '<div class="none"><b>Nobody matches that</b>Try the mobile number or the first letters of the name.</div>';
  var pct = c.limit ? Math.min(100, Math.round(c.owed / c.limit * 100)) : 0;
  return '<div class="who"><div class="av">' + initials(c.name) + '</div><div><b>' + c.name + '</b><span>' + c.phone + ' · ' + c.code + '</span></div></div>' +
    (c.owed > 0 ? '<div class="big"><small>Outstanding</small><div><em>Rs</em>' + money(c.owed) + '</div></div>' +
      '<div class="lim"><div class="bar"><i class="' + (pct >= 100 ? 'over' : pct >= 80 ? 'hi' : '') + '" style="width:' + pct + '%"></i></div><span><span>' + pct + '% of their limit</span><span>limit Rs ' + money(c.limit) + '</span></span></div>' +
      '<div class="bills"><h4>' + c.bills.length + ' bill' + (c.bills.length > 1 ? 's' : '') + ' open · oldest first</h4>' + c.bills.map(function (b) { return '<div class="bl"><span>' + b.no + ' · ' + day(b.date) + '<i class="' + ageTone(b.age) + '">' + ageWord(b.age) + '</i></span><b>' + money(b.amt) + '</b></div>'; }).join('') + '</div>' +
      '<div class="last">' + (c.lastPay ? 'Last paid Rs ' + money(c.lastPay.amt) + ' on ' + day(c.lastPay.date) : 'No payment from them yet') + '</div>' +
      '<div class="go"><button class="pay" data-go="all">Take payment<kbd>Enter</kbd></button><button class="pick" data-go="pick">Pick bills<kbd>F2</kbd></button></div>'
    : '<div class="none" style="margin-top:60px"><b>Nothing owing</b>An advance can still be taken from them.<div class="go" style="margin-top:16px"><button class="pay" data-go="adv">Take an advance<kbd>Enter</kbd></button></div></div>');
}
function draw() {
  var v = q.value; rows = CUST.filter(function (c) { return match(c, v); }).slice(0, 60);
  cur = Math.max(0, Math.min(cur, rows.length - 1));
  document.getElementById('list').innerHTML = rows.map(function (c, i) {
    return '<div class="row ' + (i === cur ? 'on' : '') + '" data-i="' + i + '"><span class="dot ' + (c.owed > 0 ? ageTone(c.oldest) : 'none') + '"></span><div class="nm"><b>' + mark(c.name, v) + '</b><span class="ph">' + c.phone + ' · ' + c.code + '</span></div>' +
      (c.owed > 0 ? '<span class="a">' + money(c.owed) + '</span>' : '<span class="a zero">nothing owing</span>') + '</div>';
  }).join('');
  document.getElementById('card').innerHTML = card(rows[cur]);
  var on = document.querySelector('.row.on'); if (on) on.scrollIntoView({ block: 'nearest' });
}
function open(how) { var c = rows[cur]; if (!c) return; toast(how === 'pick' ? 'Opens the payment window for ' + c.name + ', to tick the bills being paid' : how === 'adv' ? 'Opens an advance for ' + c.name : 'Opens the payment window for ' + c.name + ' — Rs ' + money(c.owed)); }
q.oninput = function () { cur = 0; draw(); };
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowDown') { e.preventDefault(); cur = Math.min(rows.length - 1, cur + 1); draw(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); cur = Math.max(0, cur - 1); draw(); }
  else if (e.key === 'Enter') { e.preventDefault(); open(rows[cur] && rows[cur].owed > 0 ? 'all' : 'adv'); }
  else if (e.key === 'F2') { e.preventDefault(); open('pick'); }
  else if (e.key === 'Escape') { if (q.value) { q.value = ''; draw(); } else toast('Closes the window'); }
});
document.addEventListener('click', function (e) { var r = e.target.closest('.row'), g = e.target.closest('[data-go]');
  if (r) { cur = +r.dataset.i; draw(); q.focus(); } if (g) open(g.dataset.go); });
draw(); q.focus();
</script>
</body></html>
