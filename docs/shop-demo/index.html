<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware | Shop online, 748 Main Street, Kaduruwela</title>
<meta name="description" content="Switches, wiring, paint, PVC fittings and more from Regal Hardware, Kaduruwela. Order online, we call to confirm. Call 077 222 22 59.">
<meta name="theme-color" content="#120c0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 430'%3E%3Cpath fill='%23A31D24' d='M246 12 375 235H270L375 414H318L220 235 260 190H300L246 100 95 414H38ZM192 280 272 414H222L168 324ZM142 370 168 414H116ZM350 280H403L480 414H428Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{background:#f3efe8}
:root{
  --bg:#120c0b; --ink:#f4efe9; --paper:#f3efe8; --card:#ffffff; --ink2:#17110f; --mut:rgba(23,17,15,.62); --line:rgba(23,17,15,.13);
  --red:#A31D24; --red2:#E2463F; --gut:clamp(16px,3.4vw,56px); --ease:cubic-bezier(.16,1,.3,1); --hh:116px;
}
*{box-sizing:border-box;margin:0}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{color:var(--ink2);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:rgba(226,70,63,.3)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:6px}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
.lab{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.money small{margin-right:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{padding-left:var(--gut);padding-right:var(--gut)}

/* ---------- header ---------- */
.demo{background:#000;color:#f4efe9;font-size:13px;text-align:center;padding:6px 12px;letter-spacing:.02em}
.demo b{color:#ffcf5a;font-weight:600}
.hdr{position:sticky;top:0;z-index:50;background:var(--bg);color:var(--ink);border-bottom:1px solid rgba(244,239,233,.08)}
.hrow{display:flex;align-items:center;gap:clamp(12px,2vw,28px);height:72px}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:31px;height:27px;fill:var(--red2)}
.brand b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:21px;letter-spacing:.03em;line-height:1;display:block}
.brand i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.3em;opacity:.6;display:block;margin-top:3px}
.find{position:relative;flex:1;max-width:680px}
.find form{display:flex;align-items:center;height:46px;padding:0 5px 0 18px;border-radius:999px;background:var(--ink);color:var(--ink2)}
.find svg{width:18px;height:18px;flex:none;opacity:.5}
.find input{flex:1;min-width:0;height:100%;padding:0 12px;border:0;outline:0;background:none;font-size:15.5px}
.find input::placeholder{color:rgba(23,17,15,.5)}
.find form:focus-within{outline:2px solid var(--red2);outline-offset:2px}
.find button{height:36px;padding:0 18px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:600;font-size:14px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink2);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:6px;display:none;max-height:70vh;overflow:auto}
.sugg.on{display:block}
.sugg a{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:12px}
.sugg a:hover,.sugg a.sel{background:#f3efe8}
.sugg img{width:42px;height:42px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.sugg span{flex:1;font-size:14.5px;line-height:1.3}
.sugg small{color:var(--mut);font-size:13px}
.sugg .all{justify-content:center;font-weight:600;color:var(--red);min-height:44px}
.acts{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.ibtn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:var(--ink);font-weight:500;font-size:14.5px;transition:background .2s}
.ibtn:hover{background:rgba(244,239,233,.1)}
.ibtn svg{width:20px;height:20px;fill:currentColor;flex:none}
.cartbtn{background:var(--red);color:#fff;padding:0 18px 0 14px}
.cartbtn:hover{background:#bd242c}
.cartbtn .n{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:#fff;color:var(--red);font-size:12.5px;font-weight:700;display:inline-grid;place-items:center}
.cartbtn.bump{animation:bump .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{40%{transform:scale(1.08)}}
.dnav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;height:44px;align-items:center;border-top:1px solid rgba(244,239,233,.08)}
.dnav::-webkit-scrollbar{display:none}
.dnav a{flex:none;padding:6px 12px;border-radius:999px;font-size:14px;font-weight:500;color:rgba(244,239,233,.74);transition:background .2s,color .2s;white-space:nowrap}
.dnav a:hover,.dnav a.on{color:var(--ink);background:rgba(244,239,233,.1)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:10px 24px;border-radius:999px;font-size:15px;font-weight:600;border:0;transition:background .2s,transform .2s,color .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#bd242c}
.btn.ink{background:var(--ink2);color:#fff}.btn.ink:hover{background:#000}
.btn.line{border:1px solid rgba(244,239,233,.32);color:var(--ink);background:transparent}.btn.line:hover{background:var(--ink);color:var(--ink2)}
.btn.line.dark{border-color:var(--line);color:var(--ink2)}.btn.line.dark:hover{background:var(--ink2);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}

/* ---------- home: the walk through the mark ---------- */
.stage{position:relative;height:230vh;height:230dvh;background:var(--bg);color:var(--ink);margin-top:calc(var(--hh)*-1)}
.pin{position:sticky;top:0;height:100vh;height:100dvh;overflow:hidden}
.photo{position:absolute;inset:0;opacity:0;animation:lit 1.4s .1s ease-out forwards}
@keyframes lit{to{opacity:1}}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%;will-change:transform}
.tint{position:absolute;inset:0;background:var(--red)}
.veil{position:absolute;inset:0;width:100%;height:100%;display:block}
.veil path{fill:var(--bg);fill-rule:evenodd}
.scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(18,12,11,.96) 0,rgba(18,12,11,.82) 30%,rgba(18,12,11,.28) 58%,rgba(18,12,11,0) 76%);opacity:0}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--hh) + 30px) var(--gut) 84px;pointer-events:none}
.hero>*{pointer-events:auto}
.place{display:flex;align-items:center;gap:10px;color:rgba(244,239,233,.72);margin-bottom:20px}
.place::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red2)}
.hero h1{font-size:clamp(48px,7vw,112px);line-height:.98}
.hero h1 .ln{display:block;overflow:hidden;padding-top:.04em;white-space:nowrap}
.hero h1 .ln>span{display:block;transform:translateY(112%);animation:rise 1.05s var(--ease) forwards}
.hero h1 .ln:nth-child(1)>span{animation-delay:.3s}.hero h1 .ln:nth-child(2)>span{animation-delay:.42s}.hero h1 .ln:nth-child(3)>span{animation-delay:.54s}
.hero h1 em{font-style:normal;color:var(--red2)}
@keyframes rise{to{transform:none}}
.fade{opacity:0;transform:translateY(22px);animation:up .85s var(--ease) forwards}
@keyframes up{to{opacity:1;transform:none}}
.hero .sub{max-width:28rem;margin-top:22px;font-size:clamp(16px,1.3vw,18.5px);color:rgba(244,239,233,.76);animation-delay:.75s}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px;animation-delay:.9s}
.strip{position:absolute;left:var(--gut);right:var(--gut);bottom:24px;display:flex;justify-content:space-between;gap:16px;font-size:14px;color:rgba(244,239,233,.62);animation-delay:1.1s}
.strip .cue{display:flex;align-items:center;gap:9px}
.strip .cue::after{content:"";width:1px;height:22px;background:rgba(244,239,233,.5)}
.walk{position:absolute;left:var(--gut);right:var(--gut);bottom:clamp(40px,9vh,84px);opacity:0;pointer-events:none}
.walk p{font-size:clamp(44px,8.6vw,138px);line-height:.98;text-shadow:0 16px 38px rgba(0,0,0,.32)}
.walk p span{display:block}.walk p span+span{color:var(--red2)}

/* ---------- sections ---------- */
.sheet{position:relative;z-index:10;border-radius:clamp(26px,3.4vw,48px) clamp(26px,3.4vw,48px) 0 0;margin-top:-44px;padding:clamp(64px,8vw,112px) var(--gut)}
.paper{background:var(--paper);color:var(--ink2)}
.dark{background:var(--bg);color:var(--ink)}
.h2{font-size:clamp(40px,5.6vw,84px);line-height:1}
.shead{display:flex;justify-content:space-between;align-items:end;gap:20px 40px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,52px)}
.shead p{max-width:26rem;color:var(--mut)}
.dark .shead p{color:rgba(244,239,233,.7)}
.more{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;border-bottom:2px solid currentColor}
.rv{opacity:0;transform:translateY(26px);transition:opacity .8s var(--ease),transform .8s var(--ease);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* departments */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.tile{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:#ddd6cb;color:#fff;isolation:isolate}
.tile:nth-child(1),.tile:nth-child(2){grid-column:span 3;aspect-ratio:16/9}
.tile:nth-child(n+3){grid-column:span 2}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);z-index:-2}
.tile::after{content:"";position:absolute;inset:40% 0 0;background:linear-gradient(to top,rgba(0,0,0,.7),transparent);z-index:-1}
.tile:hover img{transform:scale(1.05)}
.tile div{position:absolute;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;align-items:end;gap:10px}
.tile b{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(24px,2.4vw,38px);line-height:1.02}
.tile small{font-weight:600;font-size:13.5px;white-space:nowrap;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14.5px;font-weight:500;transition:border-color .2s,background .2s,color .2s}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.chip i{font-style:normal;color:var(--mut);font-size:13px}
.chip.on i{color:rgba(255,255,255,.7)}

/* product cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:14px}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(212px,236px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin:0 calc(var(--gut)*-1);padding-left:var(--gut);padding-right:var(--gut);scroll-padding:0 var(--gut);scrollbar-width:thin}
.rail .card{scroll-snap-align:start}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:20px;border:1px solid var(--line);overflow:hidden;color:var(--ink2);transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 10px 30px rgba(23,17,15,.1)}
.card .im{display:block;aspect-ratio:1/1;background:#fff;padding:16px}
.card .im img{width:100%;height:100%;object-fit:contain;transition:transform .6s var(--ease)}
.card:hover .im img{transform:scale(1.04)}
.card .cb{display:flex;flex-direction:column;gap:3px;padding:2px 16px 16px;flex:1}
.card .br{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.card .nm{font-weight:500;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .op{font-size:13px;color:var(--mut)}
.card .ft{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px}
.card .pr{font-weight:700;font-size:18px}
.card .pr small{font-weight:500;font-size:12.5px;color:var(--mut);margin-right:3px}
.add{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink2);color:#fff;transition:background .2s,transform .2s}
.add:hover{background:var(--red)}
.add:active{transform:scale(.92)}
.add svg{width:18px;height:18px;fill:currentColor}
.add.pick{width:auto;padding:0 16px;border-radius:999px;font-size:13.5px;font-weight:600}
.add.done{background:#1f7a46}

/* finishes */
.fins{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.fin{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:6px 18px 6px 8px;border-radius:999px;border:1px solid rgba(244,239,233,.25);background:transparent;color:var(--ink);font-weight:500;transition:background .2s,color .2s,border-color .2s}
.fin:hover{border-color:var(--ink)}
.fin[aria-pressed=true]{background:var(--ink);color:var(--ink2);border-color:var(--ink)}
.dot{width:28px;height:28px;border-radius:50%;border:1px solid rgba(0,0,0,.15);flex:none}
.dark .card{border-color:transparent}

/* brands */
.brands{position:relative;z-index:11;background:var(--paper);padding:clamp(40px,5vw,64px) 0;border-radius:clamp(26px,3.4vw,48px);border:1px solid var(--line);margin:0}
.brands .lab{display:block;text-align:center;color:var(--mut);margin-bottom:26px;padding:0 var(--gut)}
.mq{overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.mq>div{background:var(--paper);display:flex;align-items:center;gap:clamp(40px,5vw,72px);width:max-content;animation:slide 46s linear infinite}
.mq:hover>div{animation-play-state:paused}
.mq a{flex:none}
.mq img{height:48px;width:auto;max-width:160px;object-fit:contain;filter:grayscale(1) contrast(1.1);mix-blend-mode:multiply;opacity:.72;transition:filter .25s,opacity .25s}
.mq a:hover img{filter:none;opacity:1}
@keyframes slide{to{transform:translateX(-50%)}}

/* how ordering works */
.howto{background:var(--red);color:#fff;margin-top:-44px;padding-top:clamp(104px,12vw,160px);z-index:9}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:clamp(36px,5vw,64px);border-top:1px solid rgba(255,255,255,.3)}
.steps article{padding:26px clamp(18px,2.6vw,40px) 0 0}
.steps article+article{padding-left:clamp(18px,2.6vw,40px);border-left:1px solid rgba(255,255,255,.3)}
.steps i{font-style:normal;font-family:Anton,Impact,sans-serif;font-size:15px;opacity:.7;letter-spacing:.06em}
.steps h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(26px,2.6vw,38px);line-height:1.08;margin:8px 0 12px}
.steps p{max-width:21rem;color:rgba(255,255,255,.88)}

/* footer */
.foot{background:var(--bg);color:var(--ink);padding-bottom:0;overflow:hidden}
.fgrid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,3fr) minmax(0,3fr);gap:clamp(28px,4vw,64px)}
.facts{display:grid;gap:18px}
.facts dt{color:rgba(244,239,233,.55);margin-bottom:2px}
.facts dd{margin:0;font-size:clamp(17px,1.5vw,21px);font-weight:500;line-height:1.35}
.facts a:hover,.flinks a:hover{color:var(--red2)}
.flinks{display:grid;gap:4px;align-content:start}
.flinks .lab{color:rgba(244,239,233,.55);margin-bottom:8px}
.flinks a{display:inline-flex;min-height:36px;align-items:center;color:rgba(244,239,233,.82)}
.legal{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;margin-top:clamp(44px,6vw,80px);padding-top:18px;border-top:1px solid rgba(244,239,233,.14);font-size:14px;color:rgba(244,239,233,.6)}
.mega{font-family:Anton,Impact,sans-serif;text-transform:uppercase;font-size:17vw;line-height:1.16;margin-top:clamp(10px,2vw,24px);padding-bottom:clamp(10px,1.6vw,24px);color:var(--red);white-space:nowrap;user-select:none}
.mega span{display:inline-block}

/* ---------- listing ---------- */
.page{padding-top:clamp(24px,3vw,40px);padding-bottom:clamp(64px,8vw,112px);min-height:70vh}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--mut);margin-bottom:14px}
.crumbs a:hover{color:var(--red)}
.ptitle{font-size:clamp(38px,5vw,72px);line-height:1}
.pcount{color:var(--mut);margin-top:8px}
.lay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,3vw,48px);margin-top:clamp(24px,3vw,40px);align-items:start}
.side{position:sticky;top:calc(var(--hh) + 20px);display:grid;gap:26px}
.side h3{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.side nav{display:grid}
.side a{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;font-size:15px;transition:background .2s}
.side a:hover{background:rgba(23,17,15,.06)}
.side a.on{background:var(--ink2);color:#fff}
.side a i{font-style:normal;color:var(--mut);font-size:13.5px}
.side a.on i{color:rgba(255,255,255,.7)}
.side a.none{color:var(--mut)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.bar select{height:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500}
.mfil{display:none}
.empty{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(28px,4vw,52px);text-align:center;display:grid;justify-items:center;gap:12px}
.empty h2{font-size:clamp(28px,3vw,42px)}
.empty p{max-width:30rem;color:var(--mut)}
.empty .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.showmore{display:flex;justify-content:center;margin-top:26px}

/* ---------- product page ---------- */
.pd{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,64px);align-items:start;margin-top:8px}
.gal{position:sticky;top:calc(var(--hh) + 20px)}
.gmain{aspect-ratio:1/1;background:#fff;border:1px solid var(--line);border-radius:28px;display:grid;place-items:center;overflow:hidden}
.gmain img{width:min(76%,380px);height:auto;max-height:82%;object-fit:contain;animation:gin .45s var(--ease)}
@keyframes gin{from{opacity:0;transform:scale(.97)}}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:72px;height:72px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:6px}
.thumbs button[aria-pressed=true]{border:2px solid var(--ink2)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.info .br{color:var(--red);margin-bottom:10px;display:block}
.info h1{font-size:clamp(34px,3.6vw,56px);line-height:1.02}
.price{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:18px}
.price b{font-size:clamp(28px,2.6vw,36px);font-weight:700}
.tag{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;background:#fff3cf;color:#6b4d00;font-size:12.5px;font-weight:600}
.opt{margin-top:26px}
.opt h3{font-size:14px;font-weight:600;margin-bottom:10px}
.opt h3 span{font-weight:500;color:var(--mut)}
.vars{display:flex;flex-wrap:wrap;gap:8px}
.var{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:500;transition:border-color .2s}
.var:hover{border-color:var(--ink2)}
.var[aria-pressed=true]{border:2px solid var(--ink2);padding:5px 15px}
.var .dot{width:22px;height:22px;margin-left:-6px}
.buyrow{display:flex;gap:10px;margin-top:26px}
.qty{display:inline-flex;align-items:center;height:52px;border-radius:999px;border:1px solid var(--line);background:#fff;flex:none}
.qty button{width:46px;height:100%;border:0;background:none;font-size:20px;border-radius:999px}
.qty button:hover{background:rgba(23,17,15,.06)}
.qty input{width:44px;text-align:center;border:0;background:none;font-weight:600;font-size:16px;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.qty.sm{height:40px}.qty.sm button{width:36px;font-size:17px}.qty.sm input{width:34px;font-size:15px}
.buyrow .btn{flex:1;min-height:52px}
.ask{display:flex;align-items:center;justify-content:center;gap:9px;min-height:46px;margin-top:10px;border-radius:999px;border:1px solid var(--line);font-weight:600;background:transparent;width:100%;transition:border-color .2s}
.ask:hover{border-color:var(--ink2)}
.ask svg{width:19px;height:19px;fill:#1f9d55}
.pfacts{list-style:none;padding:0;margin-top:26px;border-top:1px solid var(--line)}
.pfacts li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.pfacts svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--red);stroke-width:1.8}
.pfacts b{display:block;font-weight:600}
.pfacts span{color:var(--mut)}
.related{margin-top:clamp(56px,7vw,96px)}
.related h2{font-size:clamp(30px,3vw,44px);margin-bottom:18px}

/* ---------- basket drawer ---------- */
.shade{position:fixed;inset:0;z-index:80;background:rgba(10,6,5,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:81;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);color:var(--ink2);display:flex;flex-direction:column;transform:translateX(102%);visibility:hidden;transition:transform .45s cubic-bezier(.32,.72,0,1),visibility 0s .45s;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer.on{transform:none;visibility:visible;transition:transform .45s cubic-bezier(.32,.72,0,1)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:20px 22px;border-bottom:1px solid var(--line)}
.dh h2{font-size:30px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(23,17,15,.06);display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none}
.dl{flex:1;overflow:auto;padding:6px 22px}
.cl{display:grid;grid-template-columns:68px minmax(0,1fr) auto;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.cl img{width:68px;height:68px;object-fit:contain;background:#fff;border-radius:12px;border:1px solid var(--line);padding:4px}
.cl a{font-weight:500;font-size:14.5px;line-height:1.3;display:block}
.cl small{color:var(--mut);font-size:13px;display:block}
.cl .lr{display:grid;justify-items:end;gap:6px}
.cl .rm{border:0;background:none;color:var(--mut);font-size:13px;text-decoration:underline;padding:4px}
.cl .rm:hover{color:var(--red)}
.df{padding:18px 22px 22px;border-top:1px solid var(--line);background:#fff}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}
.sumrow.big{font-size:19px;font-weight:700;padding-top:8px}
.minbar{height:6px;border-radius:3px;background:rgba(23,17,15,.1);overflow:hidden;margin:10px 0 6px}
.minbar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .4s var(--ease)}
.note{font-size:13.5px;color:var(--mut)}
.dempty{display:grid;justify-items:center;text-align:center;gap:12px;padding:48px 10px;color:var(--mut)}
.dempty svg{width:56px;height:56px;fill:none;stroke:rgba(23,17,15,.3);stroke-width:1.4}

/* ---------- checkout ---------- */
.co{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(24px,4vw,56px);align-items:start;margin-top:clamp(20px,3vw,36px)}
.box{background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,2.6vw,32px)}
.box+.box{margin-top:14px}
.box h2{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.box h2 i{font-style:normal;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ink2);color:#fff;font-family:Barlow,sans-serif;font-weight:600;font-size:14px}
.fl{display:grid;gap:6px;margin-bottom:14px}
.fl label{font-size:14px;font-weight:600}
.fl input,.fl textarea,.fl select{min-height:48px;padding:10px 14px;border-radius:14px;border:1px solid rgba(23,17,15,.22);background:#fff;font-size:16px;outline:0;transition:border-color .2s}
.fl input:focus,.fl textarea:focus,.fl select:focus{border-color:var(--ink2);box-shadow:0 0 0 3px rgba(23,17,15,.08)}
.fl .err{color:var(--red);font-size:13.5px;min-height:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:grid;gap:10px}
.pick.cols{grid-template-columns:1fr 1fr}
.pick label{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid rgba(23,17,15,.2);border-radius:16px;cursor:pointer;transition:border-color .2s,background .2s}
.pick label:has(input:checked){border:2px solid var(--ink2);padding:13px 15px;background:#fbf9f6}
.pick input{margin-top:3px;accent-color:var(--red);width:18px;height:18px;flex:none}
.pick b{display:block;font-weight:600}
.pick span{color:var(--mut);font-size:14px}
.osum{position:sticky;top:calc(var(--hh) + 20px)}
.osum .cl{grid-template-columns:54px minmax(0,1fr) auto}
.osum .cl img{width:54px;height:54px}
.done{max-width:640px;margin:clamp(20px,4vw,48px) auto 0;text-align:center;display:grid;justify-items:center;gap:14px}
.tick{width:84px;height:84px;border-radius:50%;background:#1f7a46;display:grid;place-items:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1)}
.tick svg{width:40px;height:40px;stroke:#fff;stroke-width:3;fill:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.done h1{font-size:clamp(40px,5vw,64px)}
.done .box{text-align:left;width:100%}

/* toast */
.toast{position:fixed;z-index:90;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;display:flex;align-items:center;gap:14px;padding:10px 10px 10px 18px;border-radius:999px;background:var(--ink2);color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.3);transition:opacity .25s,transform .5s cubic-bezier(.34,1.56,.64,1);font-weight:500;max-width:calc(100% - 24px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{min-height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:var(--ink2);font-weight:600;flex:none}
.toast span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* click feedback: press, spring back, ripple from the finger */
.btn,.add,.chip,.var,.fin,.ibtn,.find button,.qty button,.x,.toast button,.ask,.thumbs button{position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .2s,color .2s,border-color .2s,box-shadow .2s,opacity .2s}
.btn:active,.add:active,.chip:active,.var:active,.fin:active,.ibtn:active,.find button:active,.qty button:active,.x:active,.toast button:active,.ask:active,.thumbs button:active{transform:scale(.94);transition-duration:.08s}
.btn.wide:active,.buyrow .btn:active,.ask:active{transform:scale(.97)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.24;transform:scale(0);pointer-events:none;animation:rip .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}
.add svg{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.add:not(.pick):not(.done):hover svg{transform:rotate(90deg)}
.add.done{background:#1f7a46}
.add.done svg,.btn.ok svg{animation:pop2 .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop2{from{transform:scale(0) rotate(-60deg)}}
.btn.red.ok{background:#1f7a46}
.btn.busy{opacity:1}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.fly{position:fixed;z-index:95;pointer-events:none;object-fit:contain;background:#fff;border-radius:16px;padding:6px;box-shadow:0 14px 34px rgba(0,0,0,.28);will-change:transform;transform-origin:center}
.drawer.anim .cl{animation:slin .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0)*45ms + 140ms)}
@keyframes slin{from{opacity:0;transform:translateX(26px)}}
.tick svg path{stroke-dasharray:21;stroke-dashoffset:21;animation:draw .45s .35s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tabs .tap svg{animation:tabb .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes tabb{40%{transform:translateY(-4px) scale(1.14)}}

/* phone tab bar */
.tabs{display:none}

function route(){
  var h=location.hash.replace(/^#/,'')||'/', parts=h.split('?'), path=parts[0], qs={};
  (parts[1]||'').split('&').forEach(function(kv){if(!kv)return;var a=kv.split('=');qs[decodeURIComponent(a[0])]=decodeURIComponent((a[1]||'').replace(/\+/g,' '))});
  var m;
  if(path==='/'||path==='')return {name:'home',qs:qs};
  if(path==='/shop')return {name:'shop',qs:qs};
  if((m=path.match(/^\/p\/(.+)$/)))return {name:'product',id:m[1],qs:qs};
  if(path==='/checkout')return {name:'checkout',qs:qs};
  if(path==='/done')return {name:'done',qs:qs};
  return {name:'home',qs:qs};
}

  return '<section class="page wrap"><div class="done"><div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div><span class="tag">Demo: this order was not sent</span>'+
    '<h1 class="disp">Thank you, '+esc(o.form.name.split(' ')[0])+'.</h1><p style="color:var(--mut);max-width:30rem">In the real shop, we would now call you on <b style="color:var(--ink2)">'+esc(o.form.phone.replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3'))+'</b> to confirm the order before anything goes out.</p>'+
    '<div class="box"><div class="sumrow"><span>Order</span><b>'+o.no+'</b></div><div class="sumrow"><span>'+(o.form.how==='deliver'?'Deliver to':'Collect from')+'</span><span style="text-align:right">'+(o.form.how==='deliver'?esc(o.form.addr+', '+o.form.town):esc(SHOP.addr))+'</span></div><div class="sumrow"><span>Payment</span><span>'+pay+'</span></div>'+
    '<div class="sumrow big"><span>Total</span><span class="money">'+rs(o.g+o.del)+'</span></div></div>'+
    '<div class="row" style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><a class="btn ink" href="#/shop">Keep shopping</a><a class="btn line dark" href="'+waLink('Hello Regal Hardware, about my order '+o.no)+'" target="_blank" rel="noopener">'+ICON.wa+'WhatsApp us</a></div></div></section>'+footer();
}

/* ---------------- start ---------------- */
deptNav();badge();drawCart();render();
})();
</script>
