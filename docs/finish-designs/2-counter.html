<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Counter — end of a bill</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#15181b;--pn:#1e2226;--ln:rgba(255,255,255,.08);--tx:#eef0f2;--mu:#8a929b;--red:#e2394a}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;height:100vh;overflow:hidden}
.win{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);background:var(--bg);color:var(--tx);border-radius:24px;overflow:hidden;box-shadow:0 40px 90px -20px rgba(0,0,0,.7),0 0 0 1px var(--ln);z-index:5}
kbd{font:700 10.5px Inter;border-radius:6px;padding:2px 6px;background:rgba(255,255,255,.12);color:#cfd4da}
.pay{width:min(1040px,95vw);display:grid;grid-template-columns:1fr 300px}
.main{padding:20px 22px}
.head{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px}.head b{color:var(--tx);font:800 15px Inter}.head .x{margin-left:auto}
.lcd{margin-top:12px;background:#0b0d0f;border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;align-items:end;box-shadow:inset 0 0 0 1px var(--ln)}
.lcd small{font:700 10.5px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.lcd input{display:block;width:100%;background:none;border:0;outline:0;color:#7ee2a8;font:800 54px/1.1 'JetBrains Mono',monospace;letter-spacing:-.02em;margin-top:2px}
.lcd .nt{text-align:right}.lcd .nt b{display:block;font:800 22px 'JetBrains Mono';color:#fff}
.qk{display:flex;gap:6px;margin-top:10px}
.qk button{flex:1;height:36px;border:0;border-radius:10px;background:var(--pn);color:var(--tx);font:700 13px Inter;cursor:pointer}.qk button:hover{background:#2a2f34}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.k{height:84px;border:0;border-radius:18px;color:#fff;font:800 15px Inter;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:12px 14px;text-align:left;transition:transform .15s cubic-bezier(.34,1.56,.64,1),filter .15s}
.k:hover{transform:translateY(-2px);filter:brightness(1.1)}.k:active{transform:scale(.97)}
.k kbd{background:rgba(0,0,0,.25);color:#fff}
.k.CASH{background:#1f8a55;grid-column:span 2;font-size:19px}.k.CREDIT{background:#AE1E2B}.k.CARD{background:#24476b}.k.CHEQUE{background:#6b3fa0}.k.BANK{background:#127a7a}.k.POINTS{background:#a8650b}.k.VOUCHER{background:#a33b6b}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row2 input{height:40px;border:0;border-radius:11px;background:var(--pn);color:var(--tx);padding:0 12px;font:500 13px Inter;outline:0}
.slipcol{background:#0f1113;padding:20px 18px;display:flex;flex-direction:column}
.slip{background:#fbf8f1;color:#1d1a16;border-radius:6px;padding:16px 14px 18px;font:500 13px 'JetBrains Mono',monospace;position:relative;-webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100%;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100%;flex:1}
.slip h4{font:800 12px Inter;letter-spacing:.14em;text-align:center;margin-bottom:8px}
.sl{display:flex;justify-content:space-between;padding:4px 0}.sl button{border:0;background:none;color:#a33;cursor:pointer;font:inherit;margin-left:6px}
.dash{border-top:1px dashed #b9b2a6;margin:8px 0}
.sl.big{font-weight:800;font-size:15px}.sl.chg{color:#1f8a55;font-weight:800}
.none{color:#8a8378;text-align:center;padding:20px 0}
.go{margin-top:12px;height:64px;border:0;border-radius:18px;background:var(--red);color:#fff;font:900 20px Archivo;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.go.off{background:#2a2f34;color:var(--mu);font:800 15px Inter;letter-spacing:0}
/* who */
.ww{width:min(860px,94vw);padding:20px 22px 22px}
.ww h2{font:800 22px Archivo}.ww p{color:var(--mu);margin-top:2px}
.ww input{width:100%;height:50px;margin-top:12px;border:0;border-radius:14px;background:var(--pn);color:#fff;padding:0 14px;font:600 17px Inter;outline:0;box-shadow:inset 0 0 0 1px var(--ln)}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.s{background:var(--pn);border-radius:16px;padding:14px;cursor:pointer;position:relative;border:2px solid transparent;transition:transform .15s}
.s:hover{transform:translateY(-2px)}.s.on{border-color:var(--red);background:#2a1d20}
.s .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font:800 16px Archivo;background:#2a2f34}
.s.sales .av{background:#1f8a55}.s.none .av{background:#AE1E2B}
.s b{display:block;margin-top:10px;font-size:15px}.s span{font-size:12px;color:var(--mu)}
.s kbd{position:absolute;right:10px;top:10px}
/* print */
.pw{width:min(900px,94vw);padding:22px}
.pw h2{font:800 22px Archivo;display:flex;align-items:center;gap:10px}.pw h2 i{font-style:normal;font:800 12px Inter;background:#1f8a55;border-radius:999px;padding:4px 10px}
.pw p{color:var(--mu)}
.pt{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.p{background:var(--pn);border-radius:18px;padding:14px;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.p:hover{transform:translateY(-2px)}.p.on{border-color:var(--red)}.p.off{opacity:.35;cursor:not-allowed}
.pv{height:120px;border-radius:10px;background:#0b0d0f;display:grid;place-items:center;margin-bottom:12px}
.pv i{display:block;background:#fbf8f1;border-radius:3px;box-shadow:0 8px 16px -8px #000;background-image:repeating-linear-gradient(#fbf8f1 0 7px,#d9d3c7 7px 8px)}
.p b{display:block;font-size:15px}.p span{font-size:12px;color:var(--mu)}.p kbd{float:right}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--mu);cursor:pointer}.rem i{width:20px;height:20px;border-radius:6px;background:var(--pn);display:grid;place-items:center;font-style:normal;color:#7ee2a8;font-weight:900}
</style></head><body>
<div class="win" id="win"></div>
<script src="flow.js"></script>
<script>
frame();
var PV = { r80: '<i style="width:34px;height:90px"></i>', a5: '<i style="width:90px;height:64px"></i>', sms: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8a929b" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>', none: '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#8a929b" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>' };
window.draw = function (focus) {
  stepper(); var w = document.getElementById('win'), L = left(), P = paid();
  if (F.step === 'pay') {
    w.className = 'win';
    w.innerHTML = '<div class="pay"><div class="main"><div class="head"><b>Payment</b>' + BILL.no + ' · ' + BILL.cust + '<span class="x"><kbd>Esc</kbd> back to the bill</span></div>' +
      '<div class="lcd"><div><small>Amount</small><input id="amt" inputmode="decimal" value="' + F.amt + '"></div><div class="nt"><small>Net total</small><b>' + money(BILL.total) + '</b></div></div>' +
      '<div class="qk"><button data-q="exact">Exact</button><button data-q="100">+100</button><button data-q="500">+500</button><button data-q="1000">+1,000</button><button data-q="5000">+5,000</button></div>' +
      '<div class="keys">' + METHODS.map(function (m) { return '<button class="k ' + m[0] + '" data-m="' + m[0] + '">' + m[1] + '<kbd>' + m[2] + '</kbd></button>'; }).join('') + '</div>' +
      '<div class="row2"><input id="note" placeholder="Note on the bill"><input id="ledger" placeholder="Ledger page"></div></div>' +
      '<div class="slipcol"><div class="slip"><h4>TAKEN</h4>' + (F.pays.length ? F.pays.map(function (p, i) { var m = METHODS.find(function (x) { return x[0] === p.k; }); return '<div class="sl"><span>' + m[1] + '</span><span>' + money(p.amt) + '<button data-del="' + i + '">×</button></span></div>'; }).join('') : '<div class="none">nothing yet</div>') +
      '<div class="dash"></div><div class="sl"><span>Bill</span><span>' + money(BILL.total) + '</span></div><div class="sl"><span>Paid</span><span>' + money(P) + '</span></div><div class="dash"></div>' +
      '<div class="sl big"><span>' + (L ? 'TO TAKE' : 'BALANCE') + '</span><span>' + money(L) + '</span></div>' + (change() ? '<div class="sl chg"><span>CHANGE</span><span>' + money(change()) + '</span></div>' : '') + '</div>' +
      '<button class="go ' + (L > 0.005 ? 'off' : '') + '" data-act="print">' + (L > 0.005 ? 'Rs ' + money(L) + ' to take' : 'PRINT') + ' <kbd>P</kbd></button></div></div>';
    if (focus !== false) { var a = document.getElementById('amt'); a.focus(); a.select(); }
  } else if (F.step === 'who') {
    w.className = 'win ww'; var H = staffHits(); F.whoSel = Math.min(F.whoSel, Math.max(0, H.length - 1));
    w.innerHTML = '<h2>Who sold it?</h2><p>The bill counts towards them · Enter on its own leaves it with Afridh</p><input id="who" placeholder="Search a name or a role…" autocomplete="off" value="' + F.who + '"><div class="st">' +
      H.map(function (s, i) { return '<div class="s ' + (i === F.whoSel ? 'on ' : '') + (s[2] === 'Sales' ? 'sales' : s[0] ? '' : 'none') + '" data-w="' + i + '"><span class="av">' + (s[0] ? s[1].slice(0, 2).toUpperCase() : '—') + '</span><b>' + (s[0] ? s[1] : 'Nobody') + '</b><span>' + (s[0] ? s[2] : 'cashier only') + '</span><kbd>' + (s[3] || 'Esc') + '</kbd></div>'; }).join('') + '</div>';
    if (focus) document.getElementById('who').focus();
  } else {
    w.className = 'win pw';
    w.innerHTML = '<h2>' + BILL.no + ' · Rs ' + money(BILL.total) + '<i>PAID</i></h2><p>Which bill? ← → and Enter, or 1 2 3 4</p><div class="pt">' +
      PRINTS.map(function (p, i) { var off = p[0] === 'sms' && !BILL.mobile; return '<div class="p ' + (i === F.pr ? 'on ' : '') + (off ? 'off' : '') + '" data-pr="' + i + '"><div class="pv">' + PV[p[0]] + '</div><kbd>' + (i + 1) + '</kbd><b>' + p[1] + '</b><span>' + p[2] + '</span></div>'; }).join('') +
      '</div><div class="rem" data-act="rem"><i>' + (F.remember ? '✓' : '') + '</i>Remember my choice for cash bills</div>';
  }
};
draw(true);
</script>
</body></html>
