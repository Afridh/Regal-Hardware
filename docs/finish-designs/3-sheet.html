<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Side sheet — end of a bill</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--green:#1f8a55}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(500px,100vw);background:#fff;z-index:5;display:flex;flex-direction:column;box-shadow:-30px 0 60px -20px rgba(0,0,0,.45)}
kbd{font:700 10.5px Inter;border-radius:6px;padding:2px 6px;background:#f2f3f5;color:var(--steel)}
.hd{padding:56px 22px 12px;display:flex;align-items:flex-start;gap:12px}
.hd h2{font:800 22px Archivo}.hd p{color:var(--steel);font-size:13px}
.hd .x{margin-left:auto}
.body{flex:1;overflow:auto;padding:0 22px 14px}
.total{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.total small{color:var(--steel);font-weight:600}.total b{font:900 30px Archivo}
.amt{margin-top:14px;display:flex;align-items:center;border:2px solid var(--ink);border-radius:16px;padding:0 16px;height:70px}
.amt span{font:800 18px Archivo;color:var(--steel)}
.amt input{flex:1;border:0;outline:0;text-align:right;font:900 36px Archivo;min-width:0}
.qk{display:flex;gap:6px;margin-top:8px}.qk button{flex:1;height:34px;border:1px solid var(--line);border-radius:10px;background:#fff;font:700 12.5px Inter;cursor:pointer}
.how{margin-top:14px}
.how h4,.taken h4{font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);margin-bottom:8px}
.ml{display:flex;flex-wrap:wrap;gap:6px}
.mb{height:40px;border:1.5px solid var(--line);border-radius:999px;background:#fff;padding:0 14px;font:700 13.5px Inter;cursor:pointer;display:flex;align-items:center;gap:8px}
.mb:hover{border-color:var(--ink)}.mb kbd{padding:1px 5px}
.mb.CASH{background:var(--green);border-color:var(--green);color:#fff;height:48px;font-size:15px;padding:0 20px}.mb.CASH kbd{background:rgba(255,255,255,.2);color:#fff}
.taken{margin-top:16px}
.tk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.tk b{flex:1}.tk em{font:800 15px Archivo;font-style:normal}.tk button{border:0;background:#f6f7f8;border-radius:8px;width:26px;height:26px;cursor:pointer;color:var(--steel)}
.meter{display:flex;height:12px;border-radius:9px;overflow:hidden;background:#eef0f2;margin-top:12px}
.meter i{display:block;height:100%}
.legend{display:flex;justify-content:space-between;font-size:12.5px;color:var(--steel);margin-top:6px}.legend b{color:var(--ink)}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.more input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:500 13px Inter;outline:0}
.foot{padding:14px 22px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
.foot .lf small{display:block;color:var(--steel);font-size:12px}.foot .lf b{font:900 22px Archivo}.foot .lf b.g{color:var(--green)}
.go{margin-left:auto;height:56px;border:0;border-radius:16px;background:var(--red);color:#fff;font:800 16px Inter;padding:0 24px;cursor:pointer;display:flex;align-items:center;gap:10px}
.go kbd{background:rgba(255,255,255,.2);color:#fff}.go.off{background:#c9ced4}
/* who */
.who input{width:100%;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 16px Inter;outline:0;margin-top:4px}
.who input:focus{border-color:var(--ink)}
.sr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;margin-top:4px}
.sr:hover{background:#f6f7f8}.sr.on{background:var(--ink);color:#fff}
.sr .av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 13px Archivo;background:#eef0f2}
.sr.sales .av{background:var(--green);color:#fff}.sr.on .av{background:#fff;color:var(--ink)}
.sr b{display:block}.sr span{font-size:12px;color:var(--steel)}.sr.on span{color:rgba(255,255,255,.65)}.sr kbd{margin-left:auto}
/* print */
.pr{display:flex;align-items:center;gap:14px;padding:16px;border:2px solid var(--line);border-radius:16px;margin-top:10px;cursor:pointer}
.pr.on{border-color:var(--red);background:#fff6f6}.pr.off{opacity:.4;cursor:not-allowed}
.pr .n{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:900 16px Archivo;background:#f2f3f5}.pr.on .n{background:var(--red);color:#fff}
.pr b{display:block;font-size:15px}.pr span{font-size:12.5px;color:var(--steel)}
.done{display:flex;align-items:center;gap:12px;background:#e2f5ea;color:var(--green);border-radius:16px;padding:14px 16px;font-weight:800}
.done svg{flex:none}
.rem{display:flex;gap:10px;align-items:center;margin-top:14px;font-weight:600;cursor:pointer}.rem i{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-weight:900;font-size:12px}
</style></head><body>
<div class="sheet" id="sheet"></div>
<script src="flow.js"></script>
<script>
frame();
var COL = { CASH: '#1f8a55', CREDIT: '#AE1E2B', CARD: '#24476b', CHEQUE: '#6b3fa0', BANK: '#127a7a', POINTS: '#a8650b', VOUCHER: '#a33b6b' };
window.draw = function (focus) {
  stepper(); var el = document.getElementById('sheet'), L = left(), P = paid();
  if (F.step === 'pay') {
    el.innerHTML = '<div class="hd"><div><h2>Payment</h2><p>' + BILL.no + ' · ' + BILL.cust + ' · ' + BILL.lines + ' lines</p></div><span class="x"><kbd>Esc</kbd></span></div><div class="body">' +
      '<div class="total"><small>Net total</small><b>Rs ' + money(BILL.total) + '</b></div>' +
      '<label class="amt"><span>Rs</span><input id="amt" inputmode="decimal" value="' + F.amt + '"></label><div class="qk"><button data-q="exact">Exact</button><button data-q="100">+100</button><button data-q="500">+500</button><button data-q="1000">+1,000</button><button data-q="5000">+5,000</button></div>' +
      '<div class="how"><h4>Paid by</h4><div class="ml">' + METHODS.map(function (m) { return '<button class="mb ' + m[0] + '" data-m="' + m[0] + '">' + m[1] + '<kbd>' + m[2] + '</kbd></button>'; }).join('') + '</div></div>' +
      '<div class="taken"><h4>Taken</h4>' + (F.pays.length ? F.pays.map(function (p, i) { var m = METHODS.find(function (x) { return x[0] === p.k; }); return '<div class="tk"><span style="width:10px;height:10px;border-radius:50%;background:' + COL[p.k] + '"></span><b>' + m[1] + '</b><em>' + money(p.amt) + '</em><button data-del="' + i + '">×</button></div>'; }).join('') : '<div style="color:var(--steel);font-size:13px">Nothing yet — Enter takes the amount as cash.</div>') +
      '<div class="meter">' + F.pays.map(function (p) { return '<i style="width:' + Math.min(100, p.amt / BILL.total * 100) + '%;background:' + COL[p.k] + '"></i>'; }).join('') + '</div><div class="legend"><span>Paid <b>' + money(P) + '</b></span><span>Left <b>' + money(L) + '</b></span></div></div>' +
      '<div class="more"><input id="note" placeholder="Note on the bill"><input id="ledger" placeholder="Ledger page"></div></div>' +
      '<div class="foot"><div class="lf">' + (change() ? '<small>Give change</small><b class="g">' + money(change()) + '</b>' : L ? '<small>Still to take</small><b>' + money(L) + '</b>' : '<small>All taken</small><b class="g">✓</b>') + '</div><button class="go ' + (L > 0.005 ? 'off' : '') + '" data-act="print">PRINT<kbd>P</kbd></button></div>';
    if (focus !== false) { var a = document.getElementById('amt'); a.focus(); a.select(); }
  } else if (F.step === 'who') {
    var H = staffHits(); F.whoSel = Math.min(F.whoSel, Math.max(0, H.length - 1));
    el.innerHTML = '<div class="hd"><div><h2>Who sold it?</h2><p>The bill counts towards them</p></div><span class="x"><kbd>Esc</kbd> nobody</span></div><div class="body who"><input id="who" placeholder="Search a name or a role…" autocomplete="off" value="' + F.who + '">' +
      H.map(function (s, i) { return '<div class="sr ' + (i === F.whoSel ? 'on ' : '') + (s[2] === 'Sales' ? 'sales' : '') + '" data-w="' + i + '"><span class="av">' + (s[0] ? s[1].slice(0, 2).toUpperCase() : '—') + '</span><div><b>' + s[1] + '</b><span>' + s[2] + '</span></div>' + (s[3] ? '<kbd>' + s[3] + '</kbd>' : '') + '</div>'; }).join('') + '</div>';
    if (focus) document.getElementById('who').focus();
    var on = el.querySelector('.sr.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  } else {
    el.innerHTML = '<div class="hd"><div><h2>The bill</h2><p>' + BILL.no + ' · cash bill</p></div></div><div class="body"><div class="done"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12l5 5L20 7"/></svg>Paid · Rs ' + money(BILL.total) + '</div>' +
      PRINTS.map(function (p, i) { var off = p[0] === 'sms' && !BILL.mobile; return '<div class="pr ' + (i === F.pr ? 'on ' : '') + (off ? 'off' : '') + '" data-pr="' + i + '"><span class="n">' + (i + 1) + '</span><div><b>' + p[1] + '</b><span>' + p[2] + '</span></div></div>'; }).join('') +
      '<div class="rem" data-act="rem"><i>' + (F.remember ? '✓' : '') + '</i>Remember my choice for cash bills</div></div><div class="foot"><div class="lf"><small>↑ ↓ and Enter, or 1–4</small></div></div>';
  }
};
draw(true);
</script>
</body></html>
