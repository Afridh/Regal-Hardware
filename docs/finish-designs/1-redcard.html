<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Red card — end of a bill</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--green:#1f8a55}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);height:100vh;overflow:hidden}
.win{position:fixed;left:50%;top:52%;transform:translate(-50%,-50%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 40px 80px -24px rgba(0,0,0,.55);z-index:5}
kbd{font:700 10.5px Inter;border-radius:6px;padding:2px 6px;background:rgba(0,0,0,.06);color:var(--steel)}
/* payment */
.pay{width:min(1060px,95vw);display:grid;grid-template-columns:330px 1fr 300px;min-height:540px}
.l{background:linear-gradient(160deg,#2a0b10,#5a1019 58%,#AE1E2B);color:#fff;padding:20px 20px 18px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.l:after{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.l small{font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.l .who{font-size:12.5px;color:rgba(255,255,255,.75)}
.l .nt{font:900 44px/1 Archivo;letter-spacing:-.02em}.l .nt em{font-style:normal;font-size:20px;opacity:.6;margin-right:6px}
.box{background:#fff;border-radius:16px;padding:12px;color:var(--ink);position:relative;z-index:1}
.box label{font:700 10.5px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--steel)}
.box input{display:block;width:100%;border:0;outline:0;font:900 34px Archivo;text-align:right;color:var(--ink);margin-top:2px}
.qk{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.qk button{height:32px;border:0;border-radius:9px;background:#f2f3f5;font:700 12px Inter;cursor:pointer}.qk button:hover{background:#e6e8eb}
.lr{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:rgba(255,255,255,.75)}
.lr b{font:800 20px Archivo;color:#fff}.lr.g b{color:#7ee2a8}
.l .f{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative;z-index:1}
.l .f input{width:100%;height:38px;border:0;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;padding:0 10px;font:500 13px Inter;outline:0}
.l .f input::placeholder{color:rgba(255,255,255,.55)}
.m{padding:20px 20px 18px;display:flex;flex-direction:column}
.m h3{font:800 15px Inter;display:flex;justify-content:space-between}.m h3 span{font:500 12.5px Inter;color:var(--steel)}
.pl{flex:1;margin-top:10px}
.pr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:#f6f7f8;margin-bottom:6px;animation:pin .25s ease-out}
@keyframes pin{from{opacity:0;transform:translateY(-6px)}}
.pr i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:12px;background:#fff;color:var(--red)}
.pr b{flex:1}.pr em{font:800 16px Archivo;font-style:normal}.pr button{border:0;background:none;color:var(--steel);font-size:16px;cursor:pointer}
.empty{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--steel)}
.bar{height:10px;border-radius:9px;background:#eef0f2;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:9px;transition:width .3s}
.tot{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--steel)}.tot b{color:var(--ink);font:800 15px Archivo}
.r{padding:20px 18px 18px 0;display:flex;flex-direction:column;gap:7px}
.mk{display:flex;align-items:center;justify-content:space-between;height:46px;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:0 12px;font:700 14px Inter;cursor:pointer;color:var(--ink);transition:.15s}
.mk:hover{border-color:var(--ink)}.mk.cash{background:var(--ink);color:#fff;border-color:var(--ink)}.mk.cash kbd{background:rgba(255,255,255,.15);color:#fff}
.mk.cr{border-color:#f1c9cc;color:var(--red)}
.go{margin-top:auto;height:62px;border:0;border-radius:16px;background:var(--red);color:#fff;font:800 18px Inter;cursor:pointer;box-shadow:0 14px 26px -12px var(--red);display:flex;align-items:center;justify-content:center;gap:10px}
.go kbd{background:rgba(255,255,255,.18);color:#fff}
.go.off{background:#c9ced4;box-shadow:none}
/* who sold it */
.who-w{width:min(640px,94vw)}
.hd{background:linear-gradient(150deg,#2a0b10,#5a1019 60%,#AE1E2B);color:#fff;padding:18px 20px 20px}
.hd h2{font:800 20px Archivo}.hd p{font-size:12.5px;color:rgba(255,255,255,.72)}
.hd input{width:100%;height:52px;margin-top:12px;border:0;border-radius:14px;padding:0 14px;font:700 18px Inter;outline:0}
.sl{padding:10px 12px 14px;max-height:400px;overflow:auto}
.sr{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;cursor:pointer}
.sr:hover{background:#f6f7f8}.sr.on{background:var(--ink);color:#fff}
.sr .av{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:800 14px Archivo;background:#eef0f2;color:var(--ink)}
.sr.sales .av{background:#e2f5ea;color:var(--green)}.sr.none .av{background:#fdecee;color:var(--red)}
.sr.on .av{background:rgba(255,255,255,.16);color:#fff}
.sr b{display:block}.sr span{font-size:12px;color:var(--steel)}.sr.on span{color:rgba(255,255,255,.65)}
.sr kbd{margin-left:auto}.sr.on kbd{background:rgba(255,255,255,.15);color:#fff}
.lb2{font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);padding:10px 10px 4px}
/* the bill */
.pw{width:min(880px,94vw);padding:22px}
.pw h2{font:800 20px Archivo}.pw p{color:var(--steel);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.t{border:2px solid var(--line);border-radius:18px;padding:16px 14px 14px;cursor:pointer;position:relative;transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.t:hover{transform:translateY(-3px)}
.t.on{border-color:var(--red);background:#fff6f6;box-shadow:0 14px 28px -16px var(--red)}
.t.off{opacity:.45;cursor:not-allowed}
.t .k{position:absolute;right:12px;top:12px;width:24px;height:24px;border-radius:8px;background:#f2f3f5;display:grid;place-items:center;font:800 12px Archivo}
.t.on .k{background:var(--red);color:#fff}
.t svg{color:var(--red)}.t b{display:block;font:800 15px Inter;margin-top:10px}.t span{font-size:12.5px;color:var(--steel)}
.rem{display:flex;align-items:center;gap:10px;margin-top:14px;padding:12px 14px;border-radius:14px;background:#f6f7f8;cursor:pointer;font-weight:600}
.sw{width:38px;height:22px;border-radius:12px;background:#c9ced4;position:relative;transition:.2s}.sw:after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--green)}.sw.on:after{left:19px}
.paid{display:inline-flex;align-items:center;gap:8px;background:#e2f5ea;color:var(--green);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;margin-left:10px;vertical-align:middle}
</style></head><body>
<div class="win" id="win"></div>
<script src="flow.js"></script>
<script>
frame();
var ICO = { r80: 'M7 3h10v18l-2-1.5L13 21l-2-1.5L9 21l-2-1.5zM9 8h6M9 12h6', a5: 'M6 2h9l5 5v15H6zM14 2v6h6M9 13h8M9 17h8', sms: 'M4 4h16v12H8l-4 4zM8 9h8M8 12h5', none: 'M6 6l12 12M18 6L6 18' };
window.draw = function (focus) {
  stepper(); var w = document.getElementById('win'), L = left(), P = paid();
  if (F.step === 'pay') {
    w.className = 'win';
    w.innerHTML = '<div class="pay"><div class="l"><div><small>Payment · ' + BILL.no + '</small><div class="who">' + BILL.cust + ' · ' + BILL.lines + ' lines</div></div>' +
      '<div><small>Net total</small><div class="nt"><em>Rs</em>' + money(BILL.total) + '</div></div>' +
      '<div class="box"><label>Amount</label><input id="amt" inputmode="decimal" value="' + F.amt + '"><div class="qk"><button data-q="exact">Exact</button><button data-q="100">+100</button><button data-q="500">+500</button><button data-q="1000">+1k</button><button data-q="5000">+5k</button></div></div>' +
      '<div class="lr"><span>Still to take</span><b>' + money(L) + '</b></div>' + (change() ? '<div class="lr g"><span>Give change</span><b>' + money(change()) + '</b></div>' : '') + (creditAmt() ? '<div class="lr"><span>On their account</span><b>' + money(creditAmt()) + '</b></div>' : '') +
      '<div class="f"><input id="note" placeholder="Note on the bill"><input id="ledger" placeholder="Ledger page"></div></div>' +
      '<div class="m"><h3>Taken so far <span>Del undoes the last</span></h3><div class="pl">' + (F.pays.length ? F.pays.map(function (p, i) { var m = METHODS.find(function (x) { return x[0] === p.k; }); return '<div class="pr"><i>' + m[1][0] + '</i><b>' + m[1] + '</b><em>' + money(p.amt) + '</em><button data-del="' + i + '" title="Take it off">×</button></div>'; }).join('') : '<div class="empty">Type the amount and press the way it was paid.<br><b>Enter</b> takes it as cash.</div>') + '</div>' +
      '<div class="bar"><i style="width:' + Math.min(100, P / BILL.total * 100) + '%"></i></div><div class="tot"><span>Paid <b>' + money(P) + '</b></span><span>of <b>' + money(BILL.total) + '</b></span></div></div>' +
      '<div class="r">' + METHODS.map(function (m) { return '<button class="mk ' + (m[0] === 'CASH' ? 'cash' : m[0] === 'CREDIT' ? 'cr' : '') + '" data-m="' + m[0] + '">' + m[1] + '<kbd>' + m[2] + '</kbd></button>'; }).join('') +
      '<button class="go ' + (L > 0.005 ? 'off' : '') + '" data-act="print">' + (L > 0.005 ? 'Rs ' + money(L) + ' to go' : 'PRINT') + '<kbd>P</kbd></button></div></div>';
    if (focus !== false) { var a = document.getElementById('amt'); a.focus(); a.select(); }
  } else if (F.step === 'who') {
    w.className = 'win who-w'; var H = staffHits(); F.whoSel = Math.min(F.whoSel, Math.max(0, H.length - 1));
    w.innerHTML = '<div class="hd"><h2>Who sold it?</h2><p>The bill counts towards them. Enter on its own leaves it with Afridh.</p><input id="who" placeholder="Search a name or a role…" autocomplete="off" value="' + F.who + '"></div><div class="sl">' +
      H.map(function (s, i) { var sales = s[2] === 'Sales', head = i > 0 && H[i - 1][2] === 'Sales' && !sales ? '<div class="lb2">Others</div>' : (i === 1 && sales ? '<div class="lb2">Salespeople</div>' : '');
        return head + '<div class="sr ' + (i === F.whoSel ? 'on ' : '') + (sales ? 'sales' : s[0] ? '' : 'none') + '" data-w="' + i + '"><span class="av">' + (s[0] ? s[1].slice(0, 2).toUpperCase() : '—') + '</span><div><b>' + s[1] + '</b><span>' + s[2] + '</span></div>' + (s[3] ? '<kbd>' + s[3] + '</kbd>' : '<kbd>Esc</kbd>') + '</div>'; }).join('') + '</div>';
    if (focus) document.getElementById('who').focus();
    var on = w.querySelector('.sr.on'); if (on) on.scrollIntoView({ block: 'nearest' });
  } else {
    w.className = 'win pw';
    w.innerHTML = '<h2>' + BILL.no + ' — cash bill · Rs ' + money(BILL.total) + '<span class="paid">✓ Paid</span></h2><p>Which bill? Enter prints it · ← → to move · 1 2 3 4</p><div class="tiles">' +
      PRINTS.map(function (p, i) { var off = p[0] === 'sms' && !BILL.mobile; return '<div class="t ' + (i === F.pr ? 'on ' : '') + (off ? 'off' : '') + '" data-pr="' + i + '"><span class="k">' + (i + 1) + '</span><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICO[p[0]] + '"/></svg><b>' + p[1] + '</b><span>' + p[2] + '</span></div>'; }).join('') +
      '</div><div class="rem" data-act="rem"><span class="sw ' + (F.remember ? 'on' : '') + '"></span>Remember my choice for cash bills</div>';
  }
};
draw(true);
</script>
</body></html>
