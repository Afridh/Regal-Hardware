<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bills · Clean list — Regal POS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#f4f2f1}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:#1d2124;height:100vh;overflow:hidden;padding-left:68px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid #ae1e2b;outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.page{height:100vh;display:grid;grid-template-rows:auto 1fr;padding:14px 18px 14px}
.head{display:flex;align-items:center;gap:14px;padding-bottom:12px}
.head h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.head .sub{color:#6d7378;font-weight:600}
.head .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border-radius:10px;border:1px solid #ddd6d4;background:#fff;font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap;transition:transform .2s,box-shadow .2s}
.btn:hover{box-shadow:0 6px 14px -8px rgba(0,0,0,.35);transform:translateY(-1px)}
.btn.red{background:#ae1e2b;border-color:#ae1e2b;color:#fff}
.btn kbd{font:700 10.5px Inter,sans-serif;background:rgba(0,0,0,.08);padding:2px 6px;border-radius:5px}.btn.red kbd{background:rgba(255,255,255,.2)}
.main{display:grid;grid-template-columns:410px 1fr;gap:16px;min-height:0}
/* the list */
.list{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -18px rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0}
.lh{padding:14px 14px 10px;border-bottom:1px solid #f0eceb;display:grid;gap:9px}
.find{display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border:1.5px solid #e6dfdd;border-radius:12px}
.find:focus-within{border-color:#ae1e2b;box-shadow:0 0 0 4px rgba(174,30,43,.1)}
.find svg{width:18px;height:18px;color:#8a9094;flex:none}.find input{flex:1;min-width:0;border:0;outline:0;background:none}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:30px;padding:0 12px;border-radius:999px;border:1px solid #e6dfdd;background:#fff;font-weight:600;font-size:12.5px;cursor:pointer}
.chip.on{background:#1d2124;border-color:#1d2124;color:#fff}
.tot{display:flex;justify-content:space-between;font-size:12.5px;color:#6d7378;font-weight:600}.tot b{color:#c0392b}
.rows{flex:1;overflow:auto;padding:6px}
.r{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;border-left:3px solid transparent;transition:background .15s}
.r:hover{background:#faf6f5}
.r.on{background:#fdecec;border-left-color:#ae1e2b}
.r .nm{font-weight:800;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.r .nm.walk{color:#8a9094;font-weight:700}
.r .meta{grid-column:1;font-size:12px;color:#6d7378}
.r .amt{grid-row:1/3;grid-column:2;text-align:right;align-self:center}
.r .amt b{display:block;font-weight:800;font-size:15px}
.r .amt span{display:block;font-size:11.5px;font-weight:700}
.r .amt .due{color:#c0392b}.r .amt .ok{color:#1e8a5a}
.day{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a39b98;padding:10px 12px 4px}
/* the bill */
.bill{background:#fff;border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 30px -18px rgba(0,0,0,.25);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bh{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 20px 12px;align-items:start}
.bh h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1}
.bh .meta{color:#6d7378;font-size:13px;margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor}
.tag.credit{color:#c0392b}.tag.cash{color:#1e8a5a}
.who{display:flex;gap:10px;align-items:center;max-width:380px;text-align:right}
.who .av{width:42px;height:42px;border-radius:50%;background:#5b3fa0;color:#fff;font-weight:800;display:grid;place-items:center;flex:none;order:2}
.who b{display:block;font-weight:800;font-size:15px;line-height:1.2}
.who a{font-size:12.5px;color:#2563b8;font-weight:600}
.acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:0 20px 12px}
.acts .grp{display:flex;gap:4px;padding:4px;border-radius:12px;background:#f6f3f2;align-items:center}
.acts .grp>i{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:#a39b98;padding:0 6px}
.a{height:32px;padding:0 11px;border-radius:9px;border:0;background:#fff;font-weight:700;font-size:12.5px;cursor:pointer;box-shadow:0 1px 1px rgba(0,0,0,.06);white-space:nowrap}
.a:hover{background:#1d2124;color:#fff}
.a.pri{background:#ae1e2b;color:#fff}.a.warn{color:#c0392b}
/* the figures: one strip; every figure shrinks to fit its cell */
.ribbon{container-type:inline-size;margin:0 20px 12px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid #ece6e4;border-radius:14px;overflow:hidden}
.cell{padding:10px 12px;border-right:1px solid #ece6e4;min-width:0}.cell:last-child{border-right:0}
.cell small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8a9094;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell b{display:block;font-weight:800;font-size:clamp(12px,2.05cqw,20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px;letter-spacing:-.01em}
.cell.net{background:#fdecec}.cell.net b{color:#ae1e2b}
.cell.paid{background:#eaf6ef}.cell.paid b{color:#1e8a5a}
.cell.bal b{color:#c0392b}
.items{flex:1;min-height:0;overflow:auto;margin:0 20px 16px;border:1px solid #ece6e4;border-radius:14px}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#faf8f7;font-size:11px;font-weight:800;letter-spacing:.08em;color:#8a9094;text-align:left;padding:9px 12px;border-bottom:1px solid #ece6e4;z-index:1}
td{padding:9px 12px;border-bottom:1px solid #f3efee;font-size:13.5px}
td.n,th.n{text-align:right;white-space:nowrap}td.c{color:#8a9094;font-size:12px}td.it{font-weight:600}
tr:hover td{background:#fbf8f7}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="side"></div>
<div class="page">
  <header class="head"><h1>Bills</h1><span class="sub" id="count"></span><span class="sp"></span>
    <button class="btn" data-do="Opens: Find a missing bill">Find a missing bill</button><button class="btn red" data-do="Opens the till for a new bill">New bill <kbd>F3</kbd></button></header>
  <div class="main">
    <section class="list" aria-label="Bills">
      <div class="lh">
        <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Customer, mobile, bill no, item or amount" aria-label="Find a bill"></label>
        <div class="chips" id="when"></div>
        <div class="chips" id="kind"></div>
        <div class="tot"><span id="t1"></span><span>Outstanding <b id="t2"></b></span></div>
      </div>
      <div class="rows" id="rows"></div>
    </section>
    <section class="bill" id="bill" aria-live="polite"></section>
  </div>
</div>
<a class="demo-back" href="./">← all designs</a>
<script src="common.js"></script>
<script>
(function(){var rs=B.rs,esc=B.esc,cur=B.BILLS[0].no,f='all',q='';
document.getElementById('side').outerHTML=B.SIDE;
document.getElementById('count').textContent=B.totals.bills+' on the system';
document.getElementById('when').innerHTML=['Today','Yesterday','7 days','30 days','All time'].map(function(x,i){return '<button class="chip'+(i===4?' on':'')+'" data-w>'+x+'</button>'}).join('');
document.getElementById('kind').innerHTML=[['all','All'],['cash','Cash'],['credit','Credit'],['out','Outstanding'],['nd','Not delivered · 3'],['cx','Cancelled']].map(function(x){return '<button class="chip'+(x[0]==='all'?' on':'')+'" data-k="'+x[0]+'">'+x[1]+'</button>'}).join('')+'<select class="chip"><option>Any cashier</option><option>Afridh</option><option>Azhad</option></select>';
document.getElementById('t1').textContent=B.totals.bills+' bills · Rs '+rs(B.totals.billed);document.getElementById('t2').textContent='Rs '+rs(B.totals.out);
document.querySelectorAll('[data-w]').forEach(function(c){c.onclick=function(){document.querySelectorAll('[data-w]').forEach(function(x){x.classList.toggle('on',x===c)})}});
document.querySelectorAll('[data-k]').forEach(function(c){c.onclick=function(){f=c.dataset.k;document.querySelectorAll('[data-k]').forEach(function(x){x.classList.toggle('on',x===c)});list()}});
document.getElementById('q').oninput=function(e){q=e.target.value;list()};
function list(){var L=B.filtered(q,f),day='';document.getElementById('rows').innerHTML=L.map(function(b){var h='';if(b.day!==day){day=b.day;h='<div class="day">'+day+'</div>'}
  return h+'<button class="r'+(b.no===cur?' on':'')+'" data-no="'+b.no+'"><span class="nm'+(b.cust?'':' walk')+'">'+esc(b.cust||'Walk-in')+'</span><span class="meta num">'+b.no+(b.phone?' · '+b.phone:'')+' · '+b.time+' · '+b.items+' line'+(b.items===1?'':'s')+' · '+b.by+'</span><span class="amt num"><b>Rs '+rs(b.total)+'</b>'+(b.balance>0?'<span class="due">Rs '+rs(b.balance)+' due</span>':'<span class="ok">'+b.type+'</span>')+'</span></button>'}).join('')||'<div class="day">No bills match</div>';
  document.querySelectorAll('.r').forEach(function(r){r.onclick=function(){cur=r.dataset.no;list();show()}})}
function show(){var b=B.BILLS.filter(function(x){return x.no===cur})[0];
  document.getElementById('bill').innerHTML='<div class="bh"><div><h2 class="num">'+b.no+'</h2><div class="meta num">2026-11-09 '+b.time+' · '+b.items+' lines · '+rs(b.qty,0)+' pcs · by <b>'+b.by+'</b> <span class="tag '+b.type+'">'+b.type+'</span></div></div>'+
   (b.cust?'<div class="who"><span class="av">'+B.initials(b.cust)+'</span><div><b>'+esc(b.cust)+'</b><span class="num">'+b.phone+'</span> · <a href="#" data-do="Opens their account">their account</a></div></div>':'<div class="who"><span class="av" style="background:#8a9094">W</span><div><b>Walk-in customer</b></div></div>')+'</div>'+
   '<div class="acts"><span class="grp"><i>PRINT</i><button class="a pri" data-do="Prints the A5 bill">Large A5</button><button class="a" data-do="Prints the 80 mm receipt">Small 80mm</button><button class="a" data-do="Shows the bill first">Look first</button><button class="a" data-do="Opens the camera at '+b.cam+'">Camera '+b.cam+'</button></span>'+
   '<span class="grp"><i>SEND</i><button class="a" data-do="Texts the e-bill">Text</button><button class="a" data-do="Opens WhatsApp">WhatsApp</button><button class="a" data-do="Sends to another number">Other no.</button><button class="a" data-do="Emails the PDF">Email</button></span>'+
   '<span class="grp"><i>CHANGE</i>'+(b.balance>0?'<button class="a pri" data-do="Takes a payment">Take payment</button><button class="a" data-do="Easy payments">Easy pay</button>':'')+'<button class="a" data-do="Deliver">Deliver</button><button class="a" data-do="Edit in the till">Edit</button><button class="a" data-do="Bill again">Bill again</button><button class="a warn" data-do="Asks to cancel">Cancel</button></span></div>'+
   '<div class="ribbon num"><div class="cell"><small>Gross</small><b>'+rs(b.gross)+'</b></div><div class="cell"><small>Discount</small><b>'+rs(b.disc)+'</b></div><div class="cell net"><small>Net total</small><b>'+rs(b.total)+'</b></div><div class="cell paid"><small>Paid</small><b>'+rs(b.paid)+'</b></div><div class="cell bal"><small>Balance</small><b>'+rs(b.balance)+'</b></div><div class="cell"><small title="Other bills outstanding">Other due</small><b>'+rs(b.other)+'</b></div></div>'+
   '<div class="items"><table><thead><tr><th>CODE</th><th>ITEM</th><th class="n">QTY</th><th class="n">MRP</th><th class="n">PRICE</th><th class="n">DISC</th><th class="n">AMOUNT</th></tr></thead><tbody>'+
   b.lines.map(function(l){return '<tr><td class="c">'+l.code+'</td><td class="it">'+esc(l.name)+'</td><td class="n num">'+l.qty+'</td><td class="n num">'+(l.mrp?rs(l.mrp):'—')+'</td><td class="n num">'+rs(l.price)+'</td><td class="n">—</td><td class="n num"><b>'+rs(l.amount)+'</b></td></tr>'}).join('')+'</tbody></table></div>'}
list();show();
document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT')return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){var L=B.filtered(q,f),i=L.findIndex(function(x){return x.no===cur});i=Math.max(0,Math.min(L.length-1,i+(e.key==='ArrowDown'?1:-1)));cur=L[i].no;e.preventDefault();list();show();var on=document.querySelector('.r.on');if(on)on.scrollIntoView({block:'nearest'})}});
})();
</script></body></html>
