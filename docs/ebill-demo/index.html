<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill · Regal Hardware</title>
<meta name="description" content="Your bill from Regal Hardware, 748 Main Street, Kaduruwela.">
<meta name="theme-color" content="#120c0b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 500 430'%3E%3Cpath fill='%23A31D24' d='M246 12 375 235H270L375 414H318L220 235 260 190H300L246 100 95 414H38ZM192 280 272 414H222L168 324ZM142 370 168 414H116ZM350 280H403L480 414H428Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
html,body{background:#120c0b}
:root{--bg:#120c0b;--ink:#f4efe9;--paper:#fbf8f2;--ink2:#17110f;--mut:rgba(23,17,15,.6);--line:rgba(23,17,15,.12);--red:#A31D24;--red2:#E2463F;--green:#1f7a46;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{color:var(--ink);font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip;min-height:100vh;
  background:radial-gradient(ellipse 90% 55% at 70% -10%,rgba(163,29,36,.28),transparent 70%),var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red2);outline-offset:3px;border-radius:8px}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:1}
.lab{font-size:11.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase}
.money{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* demo switcher (not part of the page) */
.demo{position:sticky;top:0;z-index:40;background:#000;color:#f4efe9;font-size:13px;padding:7px 12px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.demo b{color:#ffcf5a}
.demo button{border:1px solid rgba(255,255,255,.25);background:transparent;border-radius:999px;padding:4px 12px;font-size:12.5px;color:#f4efe9}
.demo button[aria-pressed=true]{background:#f4efe9;color:#000}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px clamp(16px,4vw,48px)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:26px;fill:var(--red2)}
.brand b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:20px;letter-spacing:.03em;display:block;line-height:1}
.brand i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.3em;opacity:.6;display:block;margin-top:3px}
.callme{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(244,239,233,.22);font-weight:600;font-size:14.5px}
.callme svg{width:17px;height:17px;fill:currentColor}

.wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);grid-template-areas:'lead till' 'more till';grid-template-rows:auto 1fr;column-gap:clamp(28px,5vw,80px);row-gap:0;max-width:1180px;margin:0 auto;padding:clamp(8px,3vw,40px) clamp(16px,4vw,48px) 64px;align-items:start}

/* left: what it is, at a glance */
.hi{color:rgba(244,239,233,.75);font-size:clamp(17px,1.6vw,20px)}
.hi b{color:var(--ink);font-weight:600}
.kind{margin-top:22px}
.big{font-size:clamp(56px,9vw,124px);line-height:.92;margin-top:10px;letter-spacing:-.005em}
.big small{font-size:.38em;opacity:.55;margin-right:.18em;vertical-align:.95em}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:20px;padding:9px 16px 9px 12px;border-radius:999px;font-weight:600;font-size:15px}
.status i{width:9px;height:9px;border-radius:50%;flex:none}
.st-paid{background:rgba(31,122,70,.18);color:#9be3b6}.st-paid i{background:#36c172}
.st-acct{background:rgba(226,70,63,.18);color:#ffb3ad}.st-acct i{background:var(--red2)}
.st-void{background:rgba(244,239,233,.1);color:rgba(244,239,233,.8)}.st-void i{background:rgba(244,239,233,.5)}
.st-quote{background:rgba(255,207,90,.14);color:#ffd98a}.st-quote i{background:#ffcf5a}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;color:rgba(244,239,233,.62);font-size:14.5px}
.meta b{color:var(--ink);font-weight:600}
.saved{display:flex;align-items:center;gap:12px;margin-top:26px;padding:14px 18px;border-radius:18px;background:linear-gradient(120deg,rgba(255,207,90,.16),rgba(255,207,90,.04));border:1px solid rgba(255,207,90,.25);max-width:30rem}
.saved svg{width:30px;height:30px;flex:none;fill:none;stroke:#ffcf5a;stroke-width:1.8}
.saved b{display:block;color:#ffd98a;font-size:17px}
.saved span{color:rgba(244,239,233,.7);font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:10px 20px;border-radius:999px;font-weight:600;font-size:15px;border:0;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background-color .2s,color .2s}
.btn:active{transform:scale(.95);transition-duration:.08s}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:#bd242c}
.btn.ghost{background:rgba(244,239,233,.08);color:var(--ink);border:1px solid rgba(244,239,233,.18)}.btn.ghost:hover{background:rgba(244,239,233,.16)}
.btn.wa svg{fill:#4ade80}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.24;transform:scale(0);pointer-events:none;animation:rip .6s cubic-bezier(.22,1,.36,1) forwards}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* the account and the feedback, on paper-coloured cards */
.cardd{margin-top:26px;max-width:30rem;border-radius:22px;padding:20px;background:rgba(244,239,233,.06);border:1px solid rgba(244,239,233,.12)}
.cardd h3{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.01em}
.cardd p{color:rgba(244,239,233,.7);margin-top:6px}
.owes{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.owes b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:36px}
.stars{display:flex;gap:6px;margin-top:12px}
.star{width:48px;height:48px;border-radius:14px;border:1px solid rgba(244,239,233,.18);background:transparent;display:grid;place-items:center;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,border-color .2s}
.star svg{width:24px;height:24px;fill:none;stroke:rgba(244,239,233,.55);stroke-width:1.6;transition:fill .2s,stroke .2s}
.star.on{background:rgba(255,207,90,.14);border-color:rgba(255,207,90,.5)}
.star.on svg{fill:#ffcf5a;stroke:#ffcf5a}
.star:active{transform:scale(.88)}
.star.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{40%{transform:scale(1.18)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tg{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid rgba(244,239,233,.2);background:transparent;font-size:14px;transition:background .2s,color .2s;animation:up .45s var(--ease) both}
.tg.on{background:var(--ink);color:var(--ink2)}
.fbnote{width:100%;margin-top:12px;min-height:44px;border-radius:14px;border:1px solid rgba(244,239,233,.2);background:rgba(0,0,0,.2);color:var(--ink);padding:10px 14px;font:inherit;resize:vertical}
.thanks{display:flex;align-items:center;gap:12px;margin-top:12px;color:#9be3b6;font-weight:600}
.thanks svg{width:28px;height:28px;stroke:#36c172;stroke-width:3;fill:none;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s .1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* right: the bill itself, coming out of the till */
.lead{grid-area:lead}.more{grid-area:more}
.till{grid-area:till;position:sticky;top:64px}
.slot{height:30px;border-radius:14px 14px 6px 6px;background:linear-gradient(#2a201e,#0a0606);box-shadow:inset 0 -8px 10px rgba(0,0,0,.6),0 10px 30px rgba(0,0,0,.4);position:relative;z-index:3;margin:0 -10px}
.slot::after{content:"";position:absolute;left:18px;right:18px;bottom:7px;height:4px;border-radius:2px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.feed{overflow:hidden;margin-top:-10px;padding:0 6px 30px}
.paper{position:relative;background:var(--paper);color:var(--ink2);padding:30px 26px 26px;box-shadow:0 30px 60px rgba(0,0,0,.45);transform-origin:top;animation:feed 1.6s cubic-bezier(.3,.7,.2,1) .25s both;
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 18px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 18px 100%;padding-bottom:40px}
@keyframes feed{from{transform:translateY(-102%)}to{transform:none}}
.paper::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(23,17,15,.018) 0 2px,transparent 2px 4px);pointer-events:none}
.ph{text-align:center;padding-bottom:16px;border-bottom:1px dashed rgba(23,17,15,.3)}
.ph svg{width:40px;height:34px;fill:var(--red)}
.ph b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:24px;letter-spacing:.04em;margin-top:6px}
.ph span{display:block;font-size:12.5px;color:var(--mut);line-height:1.45}
.pmeta{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px dashed rgba(23,17,15,.3);font-size:13px}
.pmeta span{color:var(--mut)}
.pmeta b{font-weight:600;text-align:right}
.rows{padding:6px 0;border-bottom:1px dashed rgba(23,17,15,.3)}
.row{padding:9px 0;animation:up .5s var(--ease) both;animation-delay:calc(1.3s + var(--i)*.09s)}
.row+.row{border-top:1px solid rgba(23,17,15,.06)}
.row .n{font-weight:600;font-size:14.5px;line-height:1.3}
.row .d{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);margin-top:2px}
.row .d b{color:var(--ink2);font-size:14.5px;font-weight:700}
.row s{opacity:.7;margin-left:6px}
.row.back .n::after{content:" — returned";color:var(--red);font-weight:500}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
.tots{padding:12px 0 4px;font-size:14px}
.tots div{display:flex;justify-content:space-between;padding:3px 0}
.tots .grand{font-size:20px;font-weight:700;padding-top:8px;margin-top:6px;border-top:2px solid var(--ink2)}
.tots .pays span{color:var(--mut)}
.tots .bal{color:var(--red);font-weight:700}
.pfoot{text-align:center;font-size:12.5px;color:var(--mut);padding-top:14px}
.pfoot .mono{display:block;margin-top:8px;letter-spacing:.3em;color:var(--ink2);font-size:12px}
.stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);border:4px solid var(--red);color:var(--red);font-family:Anton,Impact,sans-serif;font-size:46px;letter-spacing:.08em;padding:4px 18px;border-radius:10px;opacity:.85;mix-blend-mode:multiply;animation:stamp .5s cubic-bezier(.34,1.56,.64,1) 1.9s both}
@keyframes stamp{from{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}}
.paper.void .rows,.paper.void .tots{opacity:.45}
.printed{display:inline-flex;align-items:center;gap:8px;margin:10px auto 0;font-size:13.5px;color:rgba(244,239,233,.65);border-bottom:1px solid rgba(244,239,233,.3)}
.under{text-align:center}

.foot{border-top:1px solid rgba(244,239,233,.1);padding:22px clamp(16px,4vw,48px) 40px;color:rgba(244,239,233,.55);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;max-width:1180px;margin:0 auto}
.foot a{color:rgba(244,239,233,.85)}
.reveal{opacity:0;transform:translateY(18px);animation:up2 .8s var(--ease) forwards}
@keyframes up2{to{opacity:1;transform:none}}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;grid-template-areas:'lead' 'till' 'more';grid-template-rows:auto;row-gap:22px}
  .till{position:static;max-width:460px;width:100%;margin:0 auto}
  .lead,.more{max-width:560px;margin:0 auto;width:100%}
}
@media (max-width:520px){
  .top{padding:14px 16px}
  .callme span{display:none}.callme{padding:0 14px}
  .paper{padding:24px 18px 38px}
  .acts .btn{flex:1 1 calc(50% - 10px)}
  .big{font-size:clamp(52px,17vw,76px)}
}
@media (prefers-reduced-motion:reduce){
  .paper,.row,.stamp,.reveal,.tg,.thanks svg,.star.pop{animation:none;opacity:1;transform:none}
  .thanks svg{stroke-dashoffset:0}
  .stamp{transform:translate(-50%,-50%) rotate(-14deg)}
}
@media print{
  body{background:#fff}.demo,.top,.lead,.more,.foot,.slot,.under{display:none!important}
  .wrap{display:block;padding:0}.till{position:static}.feed{overflow:visible;padding:0}
  .paper{animation:none;box-shadow:none;-webkit-mask:none;mask:none;max-width:420px;margin:0 auto}.row{animation:none}
}
</style>
</head>
<body>
<div class="demo" role="note"><b>Demo</b> · sample bill · show:

<script>
(function(){
'use strict';
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var rs=function(n){return (+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2})};
var MARK='<svg viewBox="0 0 500 430" aria-hidden="true"><path d="M246 12 375 235H270L375 414H318L220 235 260 190H300L246 100 95 414H38ZM192 280 272 414H222L168 324ZM142 370 168 414H116ZM350 280H403L480 414H428Z"/></svg>';
var WA='<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.7 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.7-.6-3-1.3-5-4.3-5.1-4.5-.2-.2-1.2-1.6-1.2-3s.8-2.2 1-2.5c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.2.5.1.6 0l.9-1c.2-.3.4-.2.6-.1l2 .9c.3.2.5.2.5.4.1.1.1.7-.1 1.4z"/></svg>';
var DL='<svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3zM4 19h16v2H4z"/></svg>';
var SH='<svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.4a3 3 0 0 0 0-1.6l6.7-3.4A3 3 0 1 0 15 7l-6.7 3.4a3 3 0 1 0 0 3.2L15 17a3 3 0 1 0 3-1z"/></svg>';
var BAG='<svg viewBox="0 0 24 24"><path d="M6 7V6a6 6 0 0 1 12 0v1h3l-1 15H4L3 7zm2 0h8V6a4 4 0 0 0-8 0z"/></svg>';
var STAR='<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>';

/* sample bills — on the live page these come from /api/my/b/<link> */
var LINES=[
  {name:'Kevilton 13A Socket — Kumbuk',qty:4,price:1420,mrp:1760},
  {name:'Kevilton 2 Gang 1 Way Switch — Kumbuk',qty:3,price:1190,mrp:1480},
  {name:'Nippon Paint Vinyl Silk 4L',qty:2,price:6800,mrp:7350},
  {name:'S-lon Elbow 90° 20 mm',qty:12,price:75,mrp:90},
  {name:'Kelani Cable 1/1.13 Red (per m)',qty:-5,price:58,mrp:0}
];
var B={
  cash:{kind:'Cash bill',no:'20215',hi:'Thank you for shopping with us.',who:'',status:['st-paid','Paid in full · cash and card'],pays:[['Cash',15960],['Card · HNB',7500]],bal:0,acct:null},
  credit:{kind:'Credit bill',no:'20216',hi:'Thank you, <b>Kamal Stores</b>.',who:'Kamal Stores',status:['st-acct','On your account'],pays:[['On account',23460]],bal:23460,acct:{owes:84650,bills:3}},
  void:{kind:'Cancelled bill',no:'20217',hi:'This bill was cancelled by the shop.',who:'',status:['st-void','Cancelled — nothing is owed'],pays:[],paid:0,bal:0,acct:null,void:true},
  quote:{kind:'Quotation',no:'QTN-00021',hi:'Here is the price we gave you.',who:'',status:['st-quote','Holds good until 22 Nov 2026'],pays:[],paid:0,bal:0,acct:null,quote:true}
};
function totalOf(){return LINES.reduce(function(a,l){return a+l.qty*l.price},0)}
function savedOf(){return LINES.reduce(function(a,l){return a+(l.mrp>l.price&&l.qty>0?(l.mrp-l.price)*l.qty:0)},0)}

function draw(k){
  var b=B[k],t=totalOf(),sv=savedOf();
  var big=b.void?0:b.bal>0?b.bal:t;
  document.title=(b.quote?'Your quotation':'Your bill')+' · Regal Hardware';
  var left='<section class="lead">'+
    '<p class="hi reveal" style="animation-delay:.1s">'+b.hi+'</p>'+
    '<div class="kind lab reveal" style="color:var(--red2);animation-delay:.2s">'+esc(b.kind)+' '+esc(b.no)+'</div>'+
    '<h1 class="big disp reveal" style="animation-delay:.3s"><small>Rs</small><span id="amt">'+(reduce?rs(big):'0.00')+'</span></h1>'+
    '<div class="status '+b.status[0]+' reveal" style="animation-delay:.45s"><i></i>'+esc(b.status[1])+(b.bal>0?' — Rs '+rs(b.bal)+' to pay':'')+'</div>'+
    '<div class="meta reveal" style="animation-delay:.55s"><span>'+(b.quote?'Given':'Bill')+' <b>8 Nov 2026, 10:28 am</b></span><span>'+(b.quote?'By':'Served by')+' <b>Azhad</b></span><span><b>'+LINES.length+'</b> lines</span></div></section><section class="more">'+
    (!b.void&&sv>0?'<div class="saved reveal" style="animation-delay:.65s"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V4h7z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg><div><b>You '+(b.quote?'save':'saved')+' Rs '+rs(sv)+'</b><span>against the marked price (MRP) of these items</span></div></div>':'')+
    '<div class="acts reveal" style="animation-delay:.75s">'+
      (b.quote?'<a class="btn red" href="#" data-demo>'+WA+'Order this on WhatsApp</a><a class="btn ghost" href="tel:+94772222259">Call to order</a>':
        '<button class="btn red" type="button" id="pdf">'+DL+'Save as PDF</button><button class="btn ghost wa" type="button" id="share">'+SH+'Share</button>')+
      '<a class="btn ghost" href="https://regalhw.lk" target="_blank" rel="noopener">'+BAG+'Shop online</a></div>'+
    (b.acct?'<div class="cardd reveal" style="animation-delay:.85s"><span class="lab" style="color:rgba(244,239,233,.55)">Your account with us</span><div class="owes"><b class="money">Rs '+rs(b.acct.owes)+'</b><span style="color:rgba(244,239,233,.65)">across '+b.acct.bills+' bills</span></div><p>Pay at the counter, by bank transfer, or ask us for easy payments.</p><div class="acts" style="margin-top:14px"><a class="btn red" href="#" data-demo>See every bill and payment</a></div></div>':'')+
    (!b.void&&!b.quote?'<div class="cardd reveal" id="fb" style="animation-delay:.95s"><h3>How was your visit?</h3><p>One tap tells the owner. It helps us do better.</p><div class="stars" role="radiogroup" aria-label="Your rating">'+[1,2,3,4,5].map(function(i){return '<button class="star" type="button" role="radio" aria-checked="false" aria-label="'+i+' star'+(i>1?'s':'')+'" data-s="'+i+'">'+STAR+'</button>'}).join('')+'</div><div id="fbmore"></div></div>':'')+
  '</section>';
  var rows=LINES.map(function(l,i){var amt=l.qty*l.price;return '<div class="row'+(l.qty<0?' back':'')+'" style="--i:'+i+'"><div class="n">'+esc(l.name)+'</div><div class="d"><span class="money">'+Math.abs(l.qty)+' × '+rs(l.price)+(l.mrp>l.price&&l.qty>0?'<s>'+rs(l.mrp)+'</s>':'')+'</span><b class="money">'+(amt<0?'− ':'')+rs(Math.abs(amt))+'</b></div></div>'}).join('');
  var right='<section class="till" aria-label="The bill"><div class="slot"></div><div class="feed"><article class="paper'+(b.void?' void':'')+'">'+
    '<div class="ph">'+MARK+'<b>REGAL HARDWARE</b><span>748, Main Street, Kaduruwela<br>077 222 22 59 · 027 222 22 59</span></div>'+
    '<div class="pmeta"><span>'+esc(b.kind)+'</span><b class="mono">'+esc(b.no)+'</b><span>Date</span><b>08 Nov 2026 · 10:28 am</b>'+(b.who?'<span>Customer</span><b>'+esc(b.who)+'</b>':'')+'<span>'+(b.quote?'Prepared by':'Cashier')+'</span><b>Azhad</b></div>'+
    '<div class="rows">'+rows+'</div>'+
    '<div class="tots"><div class="grand"><span>Total</span><span class="money">Rs '+rs(t)+'</span></div>'+
      (b.pays.length?b.pays.map(function(p){return '<div class="pays"><span>'+esc(p[0])+'</span><span class="money">'+rs(p[1])+'</span></div>'}).join(''):'')+
      (b.bal>0?'<div class="bal"><span>To pay</span><span class="money">Rs '+rs(b.bal)+'</span></div>':'')+
      (b.quote?'<div class="pays"><span>Valid for</span><span>14 days</span></div>':'')+'</div>'+
    '<div class="pfoot">'+(b.quote?'Prices hold good for 14 days. Stock is not kept aside until you order.':'Goods once sold are taken back within 7 days with this bill.')+'<span class="mono">'+esc(b.no)+'</span></div>'+
    (b.void?'<div class="stamp" aria-label="Cancelled">CANCELLED</div>':'')+
  '</article></div><div class="under">'+(b.void||b.quote?'':'<a class="printed" href="#" data-demo>See it as printed on paper</a>')+'</div></section>';
  document.getElementById('main').innerHTML=left+right;
  countUp(big);wire(b);
}
function countUp(to){
  var el=document.getElementById('amt');if(!el)return;if(reduce||!to){el.textContent=rs(to);return}
  var t0=null,d=1500,delay=500;
  function f(ts){if(t0===null)t0=ts;var p=Math.min(1,Math.max(0,(ts-t0-delay)/d)),e=1-Math.pow(1-p,4);el.textContent=rs(to*e);if(p<1)requestAnimationFrame(f)}
  requestAnimationFrame(f);
}
var TAGS={low:['Long wait','Item not in stock','Price','Staff','Billing mistake'],high:['Friendly staff','Quick service','Good prices','Found everything','Good advice']};
function wire(b){
  var pdf=document.getElementById('pdf');if(pdf)pdf.onclick=function(){window.print()};
  var sh=document.getElementById('share');if(sh)sh.onclick=function(){var d={title:'My bill from Regal Hardware',text:'Bill '+b.no+' from Regal Hardware',url:location.href};if(navigator.share)navigator.share(d).catch(function(){});else window.open('https://wa.me/?text='+encodeURIComponent(d.text+' '+d.url),'_blank','noopener')};
  document.querySelectorAll('[data-demo]').forEach(function(a){a.onclick=function(e){e.preventDefault();alert('On the live page this opens for real.')}});
  var stars=document.querySelectorAll('.star'),more=document.getElementById('fbmore'),picked=new Set(),rate=0;
  stars.forEach(function(s){s.onclick=function(){rate=+s.dataset.s;stars.forEach(function(x){var on=+x.dataset.s<=rate;x.classList.toggle('on',on);x.setAttribute('aria-checked',+x.dataset.s===rate)});s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop');
    var list=rate<=3?TAGS.low:TAGS.high;picked.clear();
    more.innerHTML='<div class="tags">'+list.map(function(t,i){return '<button type="button" class="tg" data-t="'+esc(t)+'" style="animation-delay:'+(i*45)+'ms">'+esc(t)+'</button>'}).join('')+'</div><textarea class="fbnote" rows="2" placeholder="'+(rate<=3?'What went wrong? The owner reads every one.':'Anything else? (optional)')+'"></textarea><div class="acts" style="margin-top:12px"><button class="btn red" type="button" id="send">Send</button></div>';
    more.querySelectorAll('.tg').forEach(function(g){g.onclick=function(){g.classList.toggle('on');picked.has(g.dataset.t)?picked.delete(g.dataset.t):picked.add(g.dataset.t)}});
    document.getElementById('send').onclick=function(){more.innerHTML='<div class="thanks"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Thank you — the owner has it.</div>';document.querySelector('.stars').style.pointerEvents='none'};
  }});
}
document.addEventListener('pointerdown',function(e){var el=e.target.closest('.btn');if(!el||reduce)return;var r=el.getBoundingClientRect(),sz=Math.max(r.width,r.height)*2.2,sp=document.createElement('span');sp.className='rip';sp.style.cssText='width:'+sz+'px;height:'+sz+'px;left:'+(e.clientX-r.left-sz/2)+'px;top:'+(e.clientY-r.top-sz/2)+'px';el.appendChild(sp);setTimeout(function(){sp.remove()},650)},{passive:true});
document.querySelectorAll('.demo [data-k]').forEach(function(btn){btn.onclick=function(){document.querySelectorAll('.demo [data-k]').forEach(function(x){x.setAttribute('aria-pressed',x===btn)});draw(btn.dataset.k);scrollTo(0,0)}});
draw('cash');
})();
</script>
