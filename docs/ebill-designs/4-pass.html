<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill · Regal Hardware</title><meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#0e0f12}
*{box-sizing:border-box;margin:0}
body{color:#eef0f3;font:500 16px/1.5 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;background:radial-gradient(ellipse 80% 50% at 50% 0%,#1d2027,#0e0f12 70%)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #ff6b5e;outline-offset:3px;border-radius:10px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.page{max-width:460px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;color:#a8adb7;font-size:14px}
.top b{color:#eef0f3}
.call{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:12px;background:#1d2027;font-weight:700;font-size:14px;position:relative;overflow:hidden}
.call svg{width:15px;height:15px;fill:#ff6b5e}
.hello{margin-top:22px;font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.hello span{color:#a8adb7;font-weight:600}
/* the pass: drops in, tilts with the hand, light runs over it, and turns over */
.stage{margin-top:22px}
/* the drop-in is on a wrapper: an animation on the card itself flattens it, and its back would never show */
.dropin{perspective:1200px;animation:drop 1.1s cubic-bezier(.3,1.4,.4,1) .15s both}
.pass{position:relative;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.3,1.25,.4,1);transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)))}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotateX(35deg) scale(.92)}}
.pass.flipped{--flip:180deg}
.face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.back{position:absolute;inset:0;transform:rotateY(180deg)}
.glare{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,30%) var(--gy,20%),rgba(255,255,255,.28),transparent 45%);mix-blend-mode:overlay;z-index:4}
.front{background:#fbfaf7;color:#14161b}
.fhead{position:relative;padding:20px 20px 22px;color:#fff;overflow:hidden}
.fhead.k-cash{background:linear-gradient(135deg,#e2463f,#a31d24 55%,#5a0f14)}
.fhead.k-credit{background:linear-gradient(135deg,#a31d24,#6a1218 60%,#2d070a)}
.fhead.k-void{background:linear-gradient(135deg,#6b6f78,#3b3e45)}
.fhead.k-quote{background:linear-gradient(135deg,#e2a93f,#b2701a 55%,#5c3608)}
.fhead .mk{position:absolute;right:-30px;bottom:-40px;width:200px;opacity:.16}
.fhead .mk svg{width:100%;height:auto;fill:#fff}
.row1{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.row1 .b{display:flex;align-items:center;gap:8px}.row1 .b svg{width:22px;height:19px;fill:#fff}
.amt{font-size:clamp(46px,13vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:26px}
.amt small{font-size:.32em;font-weight:700;opacity:.75;margin-right:6px;vertical-align:1em}
.st{display:inline-flex;align-items:center;gap:7px;margin-top:10px;padding:5px 12px;border-radius:999px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);font-size:13.5px;font-weight:700}
.st i{width:7px;height:7px;border-radius:50%;background:#fff}
/* the tear line with its notches */
.perf{position:relative;height:22px;background:#fbfaf7}
.perf::before,.perf::after{content:"";position:absolute;top:0;width:22px;height:22px;border-radius:50%;background:#0e0f12}
.perf::before{left:-11px}.perf::after{right:-11px}
.perf i{position:absolute;left:18px;right:18px;top:10px;border-top:2px dashed #d9d6cf}
.fbody{padding:4px 20px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.fbody div span{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8a8f99}
.fbody div b{font-size:15px;font-weight:700}
.code{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:4px;padding-top:14px;border-top:1px solid #ebe8e1}
.bars{display:flex;gap:2px;height:38px;flex:1}
.bars i{flex:1;background:#14161b;border-radius:1px}
.flip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;border:0;background:#14161b;color:#fff;font-weight:700;font-size:13.5px;position:relative;overflow:hidden;white-space:nowrap}
.back{background:#14161b;color:#eef0f3;display:flex;flex-direction:column}
.back .bh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.back .rows{flex:1;overflow:auto;padding:0 20px}
.ln{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}
.ln .n{font-weight:700;font-size:14px;line-height:1.3}.ln .n em{font-style:normal;color:#ff8f84;font-weight:600}
.ln .q{font-size:12.5px;color:#8a8f99}.ln .q s{opacity:.7}
.ln .a{grid-row:1/3;grid-column:2;align-self:center;font-weight:800;font-variant-numeric:tabular-nums}
.back .bt{padding:14px 20px 18px;border-top:1px solid rgba(255,255,255,.08)}
.back .bt div{display:flex;justify-content:space-between;font-size:14px;padding:2px 0;color:#a8adb7}
.back .bt .g{color:#fff;font-size:18px;font-weight:800}
.void .rows{opacity:.5;text-decoration:line-through}
.hint{text-align:center;color:#6c717b;font-size:12.5px;margin-top:14px}
/* under the pass */
.rise{opacity:0;animation:rise .8s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.saved{display:flex;align-items:center;gap:14px;margin-top:22px;padding:16px 18px;border-radius:20px;background:linear-gradient(135deg,rgba(255,207,90,.14),rgba(255,207,90,.03));border:1px solid rgba(255,207,90,.22)}
.saved b{font-size:28px;font-weight:800;color:#ffd776;letter-spacing:-.02em}
.saved span{font-size:13.5px;color:#a8adb7}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;border-radius:16px;border:0;background:#1d2027;font-weight:700;font-size:15px;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.34,1.56,.64,1),background .2s}
.btn:hover{background:#262a33}.btn:active{transform:scale(.95);transition-duration:.08s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.lite{background:#eef0f3;color:#14161b}.btn.red{background:linear-gradient(180deg,#e2463f,#a31d24);color:#fff}.btn.full{grid-column:1/-1}
.card{margin-top:12px;padding:20px;border-radius:22px;background:#16181d;border:1px solid rgba(255,255,255,.06)}
.card h3{font-size:20px;font-weight:800;letter-spacing:-.01em}.card p{color:#8a8f99;font-size:14px;margin-top:4px}
.owes{font-size:40px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.ring{display:flex;gap:10px;margin-top:14px}
.rt{flex:1;min-height:56px;border:0;border-radius:16px;background:#1d2027;display:grid;place-items:center;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s}
.rt svg{width:26px;height:26px;fill:none;stroke:#6c717b;stroke-width:1.6}
.rt.on{background:rgba(255,107,94,.16)}.rt.on svg{fill:#ff6b5e;stroke:#ff6b5e}
.rt.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.18)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{min-height:38px;padding:6px 14px;border:0;border-radius:12px;background:#1d2027;font-weight:600;font-size:13.5px;position:relative;overflow:hidden;animation:rise .35s cubic-bezier(.16,1,.3,1) both}
.tg.on{background:#eef0f3;color:#14161b}
.fbnote{width:100%;margin-top:10px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#0e0f12;color:#eef0f3;padding:10px 14px;font:inherit;min-height:46px}
.sendb{width:100%;margin-top:10px;min-height:52px;border:0;border-radius:16px;background:#eef0f3;color:#14161b;font-weight:800;position:relative;overflow:hidden}
.thanks{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:700;color:#7ee2a6}
.thanks svg{width:26px;height:26px;fill:none;stroke:#36c172;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.foot{text-align:center;color:#6c717b;font-size:13px;margin-top:28px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rise{opacity:1}.thanks svg{stroke-dashoffset:0}}
@media print{body{background:#fff}.top,.hello,.hint,.rise,.foot{display:none!important}.pass{animation:none;transform:none}.back{position:static;transform:none;margin-top:12px}.glare{display:none}.face{box-shadow:none}}
</style></head><body>
<main class="page" id="page"></main>
<script src="common.js"></script>
<script>
(function(){var E=EB,pass=null;
function draw(b){
  var big=b.isVoid?0:b.amount;var bars='';for(var i=0;i<38;i++)bars+='<i style="opacity:'+(.35+((i*13)%7)/10)+';flex:'+(1+(i*5)%3)+'"></i>';
  var hello={cash:'Thank you for coming in. <span>Here is your bill.</span>',credit:'Thank you, Kamal Stores. <span>This one is on your account.</span>',void:'This bill was cancelled. <span>Nothing is owed on it.</span>',quote:'Your quotation. <span>It holds good for 14 days.</span>'}[b.k];
  document.getElementById('page').innerHTML=
   '<header class="top"><span><b>Regal Hardware</b> · Kaduruwela</span><a class="call rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call</a></header>'+
   '<h1 class="hello">'+hello+'</h1>'+
   '<div class="stage"><div class="dropin"><div class="pass" id="pass">'+
    '<div class="face front"><div class="glare"></div><div class="fhead k-'+b.k+'"><div class="mk">'+E.MARK+'</div><div class="row1"><span class="b">'+E.MARK+'Regal</span><span>'+E.esc(b.kind)+'</span></div>'+
      '<div class="amt num"><small>RS</small><span id="amt">0.00</span></div><span class="st"><i></i>'+E.esc(b.label)+(b.due?' · to pay':'')+'</span></div>'+
     '<div class="perf"><i></i></div>'+
     '<div class="fbody"><div><span>Bill no</span><b class="num">'+E.esc(b.no)+'</b></div><div><span>Date</span><b>8 Nov · 10:28 am</b></div>'+
      '<div><span>'+(b.who?'Customer':'Paid by')+'</span><b>'+E.esc(b.who||(b.pays[0]?b.pays.map(function(p){return p[0].split(' ')[0]}).join(' + '):'—'))+'</b></div><div><span>Served by</span><b>'+E.by+'</b></div>'+
      '<div class="code"><div class="bars" aria-hidden="true">'+bars+'</div><button class="flip rp" type="button" id="flipb">Flip to see items</button></div></div></div>'+
    '<div class="face back'+(b.isVoid?' void':'')+'"><div class="glare"></div><div class="bh"><span>'+E.LINES.length+' items</span><button class="flip rp" type="button" id="flipb2" style="background:#262a33">Flip back</button></div>'+
      '<div class="rows">'+E.LINES.map(function(l,i){return E.lineHTML(l,i)}).join('')+'</div>'+
      '<div class="bt"><div class="g"><span>Total</span><span class="num">Rs '+E.rs(E.total)+'</span></div>'+b.pays.map(function(p){return '<div><span>'+E.esc(p[0])+'</span><span class="num">'+E.rs(p[1])+'</span></div>'}).join('')+'</div></div>'+
   '</div></div></div><p class="hint">Tilt your phone · tap Flip to see what you bought</p>'+
   (!b.isVoid?'<div class="saved rise" style="--d:.9s"><b class="num">Rs '+Math.round(E.saved).toLocaleString('en-LK')+'</b><span>'+(b.isQuote?'you save':'you saved')+' against the marked price (MRP)</span></div>':'')+
   '<div class="acts rise" style="--d:1s">'+(b.isQuote?'<a class="btn red full rp" href="#" data-demo>'+E.ICON.wa+'Order this on WhatsApp</a><a class="btn rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call to order</a><a class="btn rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online</a>':
     '<button class="btn lite rp" type="button" data-pdf>'+E.ICON.dl+'Save as PDF</button><button class="btn rp" type="button" data-share>'+E.ICON.wa+'Share</button><a class="btn red full rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online at regalhw.lk</a>')+'</div>'+
   (b.acct?'<div class="card rise" style="--d:1.1s"><h3>Your account</h3><div class="owes num">Rs '+E.rs(b.acct.owes)+'</div><p>across '+b.acct.bills.length+' unpaid bills</p><a class="btn lite full rp" style="display:flex;margin-top:14px" href="#" data-demo>See every bill and payment</a></div>':'')+
   (!b.isVoid&&!b.isQuote?'<div class="card rise" id="fb" style="--d:1.2s"><h3>How was your visit?</h3><p>One tap tells the owner.</p><div class="ring" role="radiogroup" aria-label="Your rating">'+[1,2,3,4,5].map(function(i){return '<button class="rt rp" type="button" role="radio" aria-checked="false" aria-label="'+i+' of 5" data-rate="'+i+'">'+E.ICON.star+'</button>'}).join('')+'</div><div data-more></div></div>':'')+
   '<footer class="foot">'+E.shop.name+' · '+E.shop.addr+'<br>Open '+E.shop.hours+' · <a href="'+E.shop.tel+'">'+E.shop.phone+'</a></footer>';
  pass=document.getElementById('pass');
  var f=function(){pass.classList.toggle('flipped')};document.getElementById('flipb').onclick=f;document.getElementById('flipb2').onclick=f;
  // the back is as tall as the front
  var fr=pass.querySelector('.front');pass.querySelector('.back').style.height=fr.offsetHeight+'px';
  E.countUp(document.getElementById('amt'),big,1500,700);
  E.wireActions(document.body,b);var fb=document.getElementById('fb');if(fb)E.rating(fb,{sendClass:'sendb'});
}
E.switcher('4 · Wallet pass',draw);
// tilt with the hand or the phone, the light running the other way
function tilt(x,y){if(!pass||E.reduce)return;pass.style.setProperty('--rx',(-y*10).toFixed(2)+'deg');pass.style.setProperty('--ry',(x*12).toFixed(2)+'deg');pass.querySelectorAll('.glare').forEach(function(g){g.style.setProperty('--gx',(50+x*60)+'%');g.style.setProperty('--gy',(30+y*60)+'%')})}
addEventListener('pointermove',function(e){if(e.pointerType!=='mouse'||!pass)return;var r=pass.getBoundingClientRect();tilt(Math.max(-1,Math.min(1,(e.clientX-r.left-r.width/2)/(r.width/1.2))),Math.max(-1,Math.min(1,(e.clientY-r.top-r.height/2)/(r.height/1.2))))},{passive:true});
addEventListener('deviceorientation',function(e){if(e.gamma==null)return;tilt(Math.max(-1,Math.min(1,e.gamma/30)),Math.max(-1,Math.min(1,((e.beta||45)-45)/30)))},{passive:true});
})();
</script></body></html>
