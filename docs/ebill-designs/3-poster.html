<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill · Regal Hardware</title><meta name="theme-color" content="#a31d24">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{background:#a31d24}
html{overflow-x:clip}
#page{overflow-x:clip}
*{box-sizing:border-box;margin:0}
body{color:#fff;font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid #ffcf5a;outline-offset:3px;border-radius:8px}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9}
.num{font-variant-numeric:tabular-nums}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 18px}
.brand{display:flex;align-items:center;gap:9px;font-family:Anton,Impact,sans-serif;font-size:18px;letter-spacing:.06em}
.brand svg{width:28px;height:24px;fill:#fff}
.call{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;background:#fff;color:#a31d24;font-weight:700;font-size:14.5px;position:relative;overflow:hidden}
.call svg{width:16px;height:16px;fill:currentColor}
.hero{padding:6px 18px 0;position:relative}
.eyebrow{display:flex;gap:10px;align-items:center;font-weight:600;letter-spacing:.18em;font-size:12px;text-transform:uppercase;opacity:.85}
.eyebrow::before{content:"";width:28px;height:2px;background:#fff}
/* the word: drawn as an outline, then filled */
.word{font-size:clamp(84px,30vw,220px);letter-spacing:-.01em;margin-top:6px;color:transparent;-webkit-text-stroke:2px #fff;animation:fillw .6s ease-out 1.1s forwards;white-space:nowrap}
.word span{display:inline-block;transform:translateY(105%);animation:upw .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.15s + var(--i)*.06s)}
.wrapw{overflow:hidden;padding-top:.06em}
@keyframes upw{to{transform:none}}
@keyframes fillw{to{color:#fff;-webkit-text-stroke:2px transparent}}
.w-credit .word{animation-name:fillw2}@keyframes fillw2{to{color:#ffcf5a;-webkit-text-stroke:2px transparent}}
/* the amount, edge to edge, its digits rolling into place */
.amt{font-size:clamp(46px,15.5vw,150px);margin-top:4px;white-space:nowrap}
.amt small{font-size:.32em;vertical-align:1.6em;margin-right:.18em;opacity:.8}
.sub{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-weight:500;opacity:.9}
.sub b{font-weight:700}
/* the band of what was bought, running like a shop's banner */
.band{margin-top:26px;background:#1a0d0e;color:#fff;transform:rotate(-2deg) scale(1.04);padding:12px 0;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.band div{display:flex;gap:34px;width:max-content;animation:run 32s linear infinite;font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.band span::after{content:"✦";margin-left:34px;color:#e2463f}
@keyframes run{to{transform:translateX(-50%)}}
/* the bill: a cream sheet sliding up over the red */
.sheet{position:relative;margin-top:30px;background:#f7f1e6;color:#1a0d0e;border-radius:36px 36px 0 0;padding:30px 20px 40px;animation:sheet 1s cubic-bezier(.16,1,.3,1) .6s both;box-shadow:0 -20px 40px rgba(0,0,0,.18)}
@keyframes sheet{from{transform:translateY(120px);opacity:0}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:rgba(26,13,14,.2);margin:-16px auto 18px}
.inner{max-width:560px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px}
.sh h2{font-size:34px}
.sh span{font-size:13px;color:#6f6156;text-align:right}
.ln{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:14px 0;border-bottom:2px solid #1a0d0e;opacity:0;animation:rl .6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(1.2s + var(--i)*.08s)}
.ln::before{content:counter(l,decimal-leading-zero);counter-increment:l;grid-row:1/3;font-family:Anton,Impact,sans-serif;font-size:22px;color:#a31d24}
.rows{counter-reset:l;border-top:2px solid #1a0d0e;margin-top:14px}
@keyframes rl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.ln .n{font-weight:700;font-size:15px;line-height:1.25}.ln .n em{font-style:normal;color:#a31d24;font-weight:600}
.ln .q{grid-column:2;font-size:13px;color:#6f6156}.ln .q s{opacity:.7}
.ln .a{grid-row:1/3;grid-column:3;font-family:Anton,Impact,sans-serif;font-size:20px;font-variant-numeric:tabular-nums}
.tot{margin-top:14px}
.tot div{display:flex;justify-content:space-between;padding:3px 0;font-size:15px}
.tot .g{font-family:Anton,Impact,sans-serif;font-size:30px;text-transform:uppercase}
.tot .due{color:#a31d24;font-weight:700}
.void .rows,.void .tot{opacity:.45;text-decoration:line-through}
.saved{margin-top:18px;background:#1a0d0e;color:#fff;border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.saved b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:40px;color:#ffcf5a;line-height:1}
.saved span{font-size:14px;opacity:.8;max-width:13rem}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:56px;border-radius:999px;border:2px solid #1a0d0e;background:transparent;font-weight:700;font-size:15.5px;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.btn:hover{box-shadow:4px 4px 0 #1a0d0e;transform:translate(-2px,-2px)}
.btn:active{transform:scale(.95);box-shadow:none;transition-duration:.08s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.red{background:#a31d24;color:#fff;border-color:#a31d24}.btn.ink{background:#1a0d0e;color:#fff}.btn.full{grid-column:1/-1}
.card{margin-top:16px;border:2px solid #1a0d0e;border-radius:26px;padding:20px}
.card h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;text-transform:uppercase;line-height:1}
.card p{color:#6f6156;font-size:14px;margin-top:4px}
.owes{font-family:Anton,Impact,sans-serif;font-size:48px;line-height:1;margin-top:8px}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.nb{aspect-ratio:1;border:2px solid #1a0d0e;border-radius:50%;background:transparent;font-family:Anton,Impact,sans-serif;font-size:24px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s}
.nb.on{background:#a31d24;border-color:#a31d24;color:#fff}
.nb.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.15) rotate(-6deg)}}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:#6f6156;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tg{min-height:40px;padding:6px 15px;border:2px solid #1a0d0e;border-radius:999px;background:transparent;font-weight:600;font-size:14px;position:relative;overflow:hidden;animation:rl .35s cubic-bezier(.16,1,.3,1) both}
.tg.on{background:#1a0d0e;color:#fff}
.fbnote{width:100%;margin-top:12px;border:2px solid #1a0d0e;border-radius:16px;padding:10px 14px;font:inherit;min-height:46px;background:#fff}
.sendb{width:100%;margin-top:10px;min-height:54px;border:0;border-radius:999px;background:#a31d24;color:#fff;font-weight:700;position:relative;overflow:hidden}
.thanks{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:700;color:#1d7a45;font-size:16px}
.thanks svg{width:28px;height:28px;fill:none;stroke:#1d7a45;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.foot{text-align:center;font-size:13px;color:#6f6156;margin-top:28px;line-height:1.7}
@media (min-width:900px){.hero{padding:10px 48px 0}.top{padding:20px 48px}.sheet{padding:40px 48px 60px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.word{color:#fff;-webkit-text-stroke:0}.word span,.ln{transform:none;opacity:1}.thanks svg{stroke-dashoffset:0}.band div{transform:none}}
@media print{body{background:#fff}.top,.hero,.band,.saved,.acts,.card,.foot{display:none!important}.sheet{animation:none;box-shadow:none;margin:0}.ln{opacity:1;animation:none}}
</style></head><body>
<header class="top"><span class="brand">REGAL HARDWARE</span><a class="call rp" href="tel:+94772222259"></a></header>
<div id="page"></div>
<script src="common.js"></script>
<script>
(function(){var E=EB;
document.querySelector('.brand').insertAdjacentHTML('afterbegin',E.MARK);
document.querySelector('.call').innerHTML=E.ICON.call+'Call';
function draw(b){
  var word={cash:'Paid.',credit:'To pay.',void:'Void.',quote:'Quote.'}[b.k];
  var big=b.isVoid?0:b.amount;
  var names=E.LINES.map(function(l){return '<span>'+E.esc(l.name.split(' — ')[0])+'</span>'}).join('');
  document.getElementById('page').innerHTML=
   '<section class="hero w-'+b.k+'"><div class="eyebrow">'+E.esc(b.kind)+' '+E.esc(b.no)+'</div>'+
    '<div class="wrapw"><h1 class="disp word" aria-label="'+E.esc(word)+'">'+word.split('').map(function(c,i){return '<span style="--i:'+i+'">'+E.esc(c)+'</span>'}).join('')+'</h1></div>'+
    '<div class="disp amt num" aria-label="Rs '+E.rs(big)+'"><small>Rs</small><span id="odo">'+E.rs(big)+'</span></div>'+
    '<div class="sub"><span>'+E.esc(b.sub)+'</span><span>'+E.when+'</span><span>by <b>'+E.by+'</b></span>'+(b.who?'<span><b>'+E.esc(b.who)+'</b></span>':'')+'</div></section>'+
   '<div class="band" aria-hidden="true"><div>'+names+names+names+names+'</div></div>'+
   '<section class="sheet"><div class="grab"></div><div class="inner'+(b.isVoid?' void':'')+'">'+
    '<div class="sh"><h2 class="disp">The bill</h2><span>'+E.LINES.length+' lines · '+E.when+'</span></div>'+
    '<div class="rows">'+E.LINES.map(function(l,i){return E.lineHTML(l,i)}).join('')+'</div>'+
    '<div class="tot"><div class="g"><span>Total</span><span class="num">Rs '+E.rs(E.total)+'</span></div>'+b.pays.map(function(p){return '<div><span>'+E.esc(p[0])+'</span><span class="num">'+E.rs(p[1])+'</span></div>'}).join('')+(b.due?'<div class="due"><span>To pay</span><span class="num">Rs '+E.rs(b.due)+'</span></div>':'')+'</div>'+
    (!b.isVoid?'<div class="saved"><span>'+(b.isQuote?'You save':'You saved')+' against the marked price (MRP)</span><b class="num">Rs '+Math.round(E.saved).toLocaleString('en-LK')+'</b></div>':'')+
    '<div class="acts">'+(b.isQuote?'<a class="btn red full rp" href="#" data-demo>'+E.ICON.wa+'Order this on WhatsApp</a><a class="btn rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call to order</a><a class="btn rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online</a>':
      '<button class="btn ink rp" type="button" data-pdf>'+E.ICON.dl+'Save PDF</button><button class="btn rp" type="button" data-share>'+E.ICON.wa+'Share</button><a class="btn red full rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online at regalhw.lk</a>')+'</div>'+
    (b.acct?'<div class="card"><h3>Your account</h3><div class="owes num">Rs '+E.rs(b.acct.owes)+'</div><p>across '+b.acct.bills.length+' unpaid bills</p><a class="btn ink full rp" style="display:flex;margin-top:14px" href="#" data-demo>See every bill and payment</a></div>':'')+
    (!b.isVoid&&!b.isQuote?'<div class="card" id="fb"><h3>Rate us, 1 to 5</h3><p>The owner reads every answer.</p><div class="nums" role="radiogroup" aria-label="Your rating">'+[1,2,3,4,5].map(function(i){return '<button class="nb rp" type="button" role="radio" aria-checked="false" data-rate="'+i+'">'+i+'</button>'}).join('')+'</div><div class="lbl"><span>Not good</span><span>Excellent</span></div><div data-more></div></div>':'')+
    '<footer class="foot">'+E.shop.name+' · '+E.shop.addr+'<br>Open '+E.shop.hours+' · <a href="'+E.shop.tel+'">'+E.shop.phone+'</a></footer>'+
   '</div></section>';
  E.odometer(document.getElementById('odo'),E.rs(big),500);
  E.wireActions(document.body,b);var fb=document.getElementById('fb');if(fb)E.rating(fb,{single:true,sendClass:'sendb'});
}
E.switcher('3 · Poster',draw);
})();
</script></body></html>
