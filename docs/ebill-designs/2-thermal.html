<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill · Regal Hardware</title><meta name="theme-color" content="#e9e6e1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&family=Anton&display=swap" rel="stylesheet">
<style>
html,body{background:#e9e6e1}
*{box-sizing:border-box;margin:0}
body{color:#1b1917;font:400 16px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;background:linear-gradient(180deg,#f2f0ec,#e2ded7)}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #a31d24;outline-offset:3px;border-radius:8px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.page{max-width:480px;margin:0 auto;padding:20px 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.16em;font-size:12.5px}
.brand svg{width:26px;height:22px;fill:#a31d24}
.call{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:12px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 4px 12px rgba(0,0,0,.05);font-weight:600;font-size:14px;position:relative;overflow:hidden}
.call svg{width:15px;height:15px;fill:#a31d24}
/* the printer: a body, a slot, and the roll turning while it prints */
.printer{position:relative;margin:28px 6px 0;height:74px;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#3a3633,#1c1a18);box-shadow:0 18px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12);z-index:3}
.printer .led{position:absolute;left:20px;top:18px;width:8px;height:8px;border-radius:50%;background:#36c172;box-shadow:0 0 10px #36c172;animation:blink .5s steps(2) 0s 8}
@keyframes blink{50%{opacity:.25}}
.printer .lab{position:absolute;left:36px;top:12px;font:600 11px/1 Inter;letter-spacing:.2em;color:rgba(255,255,255,.45)}
.printer .roll{position:absolute;left:24px;right:24px;bottom:12px;height:16px;border-radius:8px;background:repeating-linear-gradient(90deg,#fafaf7 0 6px,#e6e3dc 6px 7px);box-shadow:inset 0 3px 5px rgba(0,0,0,.25);overflow:hidden}
.printer .roll::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,rgba(0,0,0,.12) 0 2px,transparent 2px 6px);animation:turn .18s linear 0s 14}
@keyframes turn{to{background-position:0 6px}}
.printer .mouth{position:absolute;left:14px;right:14px;bottom:-4px;height:8px;border-radius:4px;background:#0c0b0a}
.feed{position:relative;margin:-6px 20px 0;overflow:hidden;z-index:2}
.paper{position:relative;background:#fffefb;padding:26px 20px 34px;transform-origin:top;animation:print 2.6s steps(26,end) .2s both;box-shadow:0 20px 40px rgba(0,0,0,.18);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 14px 100%}
/* the top comes out first, the shop's name, and the paper grows down as it prints */
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
.paper::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.035),transparent 8%,transparent 92%,rgba(0,0,0,.035));pointer-events:none}
.ph{text-align:center}
.ph svg{width:40px;height:34px;fill:#1b1917}
.ph b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.08em;margin-top:6px}
.ph span{display:block;font-size:12px;color:#6b665f}
.dash{border:0;border-top:2px dashed #cfcac2;margin:14px 0}
.tw{white-space:pre-wrap}
.tw .c{opacity:0}
.tw.on .c{animation:ch .01s forwards;animation-delay:calc(var(--d) + var(--j)*18ms)}
@keyframes ch{to{opacity:1}}
.meta{display:grid;grid-template-columns:1fr auto;font-size:12.5px;gap:2px 10px;color:#4d4842}
.meta b{text-align:right;color:#1b1917}
.ln{display:grid;grid-template-columns:1fr auto;gap:0 10px;font-size:13px;padding:6px 0}
.ln .n{grid-column:1/-1;font-weight:500}.ln .n em{font-style:normal;color:#a31d24}
.ln .q{color:#6b665f}.ln .q s{opacity:.7}
.ln .a{font-weight:700;text-align:right}
.big{margin-top:6px;text-align:center}
.big .lab2{font:600 11px/1 Inter;letter-spacing:.24em;color:#6b665f}
.big .v{font-family:Anton,Impact,sans-serif;font-size:clamp(52px,15vw,74px);line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.big .v small{font-size:.32em;margin-right:6px;vertical-align:.95em;color:#6b665f}
.status{display:block;text-align:center;margin-top:8px;font:700 13px/1.3 'JetBrains Mono',monospace;letter-spacing:.14em}
.s-cash{color:#1d7a45}.s-credit{color:#a31d24}.s-void{color:#6b665f}.s-quote{color:#a36b0c}
.tots{font-size:13px}
.tots div{display:flex;justify-content:space-between;padding:2px 0}
.tots .due{font-weight:700;color:#a31d24}
.void .rows,.void .tots{text-decoration:line-through;opacity:.5}
.foot1{text-align:center;font-size:11.5px;color:#6b665f;margin-top:12px}
.bars{display:flex;justify-content:center;gap:2px;height:34px;margin-top:10px}
.bars i{width:2px;background:#1b1917}.bars i:nth-child(3n){width:1px}.bars i:nth-child(5n){width:3px}
/* below the bill: what the paper cannot do */
.under{opacity:0;animation:up .7s cubic-bezier(.16,1,.3,1) forwards;animation-delay:var(--d,2.8s)}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.saved{display:flex;gap:12px;align-items:center;margin-top:18px;padding:14px 16px;border-radius:16px;background:#fff6dd;border:1px dashed #d9b866}
.saved svg{width:28px;height:28px;fill:none;stroke:#a36b0c;stroke-width:1.7;flex:none}
.saved b{display:block;font-size:15.5px}.saved span{font-size:13.5px;color:#6b5320}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:0;background:#fff;font-weight:600;font-size:15px;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.06);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.btn:active{transform:translateY(2px) scale(.97);transition-duration:.08s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.dark{background:#1b1917;color:#fff}.btn.red{background:#a31d24;color:#fff}.btn.full{grid-column:1/-1}
.card{margin-top:14px;padding:18px;border-radius:18px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 20px rgba(0,0,0,.05)}
.card h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:22px;letter-spacing:.02em;text-transform:uppercase}
.card p{color:#6b665f;font-size:14px}
.owes{font-family:Anton,Impact,sans-serif;font-size:40px;line-height:1.1;margin-top:6px}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.key{aspect-ratio:1;border:0;border-radius:12px;background:#f1eee8;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12);font:700 18px/1 'JetBrains Mono',monospace;position:relative;overflow:hidden;transition:transform .2s}
.key small{display:block;font:500 9.5px/1.2 Inter;color:#6b665f;margin-top:4px}
.key.on{background:#1b1917;color:#ffcf5a;box-shadow:inset 0 -3px 0 #000}.key.on small{color:#cfc7b8}
.key.pop{animation:press .3s}@keyframes press{40%{transform:translateY(3px)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{min-height:38px;padding:6px 13px;border:1px dashed #b8b1a6;border-radius:10px;background:#fff;font-size:13.5px;position:relative;overflow:hidden;animation:up .35s cubic-bezier(.16,1,.3,1) both}
.tg.on{background:#1b1917;color:#fff;border-style:solid}
.fbnote{width:100%;margin-top:10px;border:1px solid #d9d3c9;border-radius:12px;padding:10px 12px;font:inherit;min-height:44px;background:#fffefb}
.sendb{width:100%;margin-top:10px;min-height:50px;border:0;border-radius:14px;background:#1b1917;color:#fff;font-weight:700;position:relative;overflow:hidden}
.thanks{display:flex;gap:10px;align-items:center;margin-top:10px;font-weight:600;color:#1d7a45}
.thanks svg{width:24px;height:24px;fill:none;stroke:#1d7a45;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.foot{text-align:center;font-size:12.5px;color:#6b665f;margin-top:26px;line-height:1.7}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.tw .c,.under{opacity:1}.thanks svg{stroke-dashoffset:0}}
@media print{body{background:#fff}.top,.printer,.under,.foot{display:none!important}.feed{margin:0;overflow:visible}.paper{animation:none;-webkit-mask:none;mask:none;box-shadow:none}.tw .c{opacity:1}}
</style></head><body>
<main class="page" id="page"></main>
<script src="common.js"></script>
<script>
(function(){var E=EB;
// text typed out by the printer: each character appears in turn
var line=0;function tw(t,cls){var i=0,s=String(t).split('').map(function(ch){return '<span class="c" style="--j:'+(i++)+'">'+E.esc(ch)+'</span>'}).join('');var d=(.6+line*.16).toFixed(2);line++;return '<span class="tw '+(cls||'')+'" style="--d:'+d+'s">'+s+'</span>'}
function draw(b){
  line=0;
  var bars='';for(var i=0;i<42;i++)bars+='<i style="opacity:'+(.55+((i*7)%5)/10)+'"></i>';
  var rows=E.LINES.map(function(l,i){var a=l.qty*l.price;return '<div class="ln"><span class="n">'+tw(l.name)+(l.qty<0?' <em>returned</em>':'')+'</span><span class="q">'+tw(Math.abs(l.qty)+' x '+E.rs(l.price))+(l.mrp>l.price&&l.qty>0?' <s>'+E.rs(l.mrp)+'</s>':'')+'</span><span class="a">'+tw((a<0?'-':'')+E.rs(Math.abs(a)))+'</span></div>'}).join('');
  var word={cash:'*** PAID IN FULL ***',credit:'*** ON ACCOUNT - TO PAY ***',void:'*** CANCELLED - NOTHING OWED ***',quote:'*** QUOTATION - VALID 14 DAYS ***'}[b.k];
  document.getElementById('page').innerHTML=
   '<header class="top"><span class="brand">'+E.MARK+'REGAL HARDWARE</span><a class="call rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call</a></header>'+
   '<div class="printer" aria-hidden="true"><i class="led"></i><span class="lab">REGAL · PRINTING</span><div class="roll"></div><div class="mouth"></div></div>'+
   '<div class="feed"><article class="paper mono'+(b.isVoid?' void':'')+'" aria-label="The bill">'+
     '<div class="ph">'+E.MARK+'<b>REGAL HARDWARE</b><span>'+E.shop.addr+'<br>'+E.shop.phone+' · 027 222 22 59</span></div><hr class="dash">'+
     '<div class="meta"><span>'+E.esc(b.kind.toUpperCase())+'</span><b>'+E.esc(b.no)+'</b><span>DATE</span><b>08/11/2026 10:28</b>'+(b.who?'<span>CUSTOMER</span><b>'+E.esc(b.who.toUpperCase())+'</b>':'')+'<span>CASHIER</span><b>AZHAD</b></div><hr class="dash">'+
     '<div class="rows">'+rows+'</div><hr class="dash">'+
     '<div class="big"><div class="lab2">'+(b.isQuote?'QUOTED TOTAL':b.due?'TO PAY':'TOTAL')+'</div><div class="v"><small>RS</small><span id="odo">'+E.rs(b.isVoid?0:b.amount)+'</span></div></div>'+
     '<span class="status s-'+b.k+'">'+word+'</span><hr class="dash">'+
     '<div class="tots"><div><span>TOTAL</span><span>'+E.rs(E.total)+'</span></div>'+b.pays.map(function(p){return '<div><span>'+E.esc(p[0].toUpperCase())+'</span><span>'+E.rs(p[1])+'</span></div>'}).join('')+(b.due?'<div class="due"><span>TO PAY</span><span>'+E.rs(b.due)+'</span></div>':'')+(!b.isVoid?'<div><span>YOU SAVED (MRP)</span><span>'+E.rs(E.saved)+'</span></div>':'')+'</div>'+
     '<div class="foot1">'+(b.isQuote?'Prices hold good for 14 days.':'Goods taken back within 7 days with this bill.')+'<br>THANK YOU · COME AGAIN</div><div class="bars" aria-hidden="true">'+bars+'</div>'+
   '</article></div>'+
   (!b.isVoid?'<div class="saved under" style="--d:2.7s">'+E.ICON.tag+'<div><b>You saved Rs '+E.rs(E.saved)+'</b><span>against the marked price (MRP) of these items</span></div></div>':'')+
   '<div class="acts under" style="--d:2.85s">'+(b.isQuote?'<a class="btn red full rp" href="#" data-demo>'+E.ICON.wa+'Order this on WhatsApp</a><a class="btn rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call to order</a><a class="btn rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online</a>':
     '<button class="btn dark rp" type="button" data-pdf>'+E.ICON.dl+'Save as PDF</button><button class="btn rp" type="button" data-share>'+E.ICON.wa+'Share</button><a class="btn full rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online at regalhw.lk</a>')+'</div>'+
   (b.acct?'<div class="card under" style="--d:3s"><p>YOUR ACCOUNT WITH US</p><div class="owes">Rs '+E.rs(b.acct.owes)+'</div><p>across '+b.acct.bills.length+' unpaid bills: '+b.acct.bills.map(function(x){return x[0]}).join(', ')+'</p><a class="btn dark full rp" style="display:flex;margin-top:12px" href="#" data-demo>See every bill and payment</a></div>':'')+
   (!b.isVoid&&!b.isQuote?'<div class="card under" id="fb" style="--d:3.1s"><h3>Rate your visit</h3><p>Press a key. The owner reads every one.</p><div class="keys" role="radiogroup" aria-label="Your rating">'+['Bad','Poor','Okay','Good','Great'].map(function(w,i){return '<button class="key rp" type="button" role="radio" aria-checked="false" data-rate="'+(i+1)+'">'+(i+1)+'<small>'+w+'</small></button>'}).join('')+'</div><div data-more></div></div>':'')+
   '<footer class="foot">'+E.shop.name+' · '+E.shop.addr+' · open '+E.shop.hours+'</footer>';
  // the characters print as the paper comes out
  requestAnimationFrame(function(){document.querySelectorAll('.tw').forEach(function(x){x.classList.add('on')})});
  E.odometer(document.getElementById('odo'),E.rs(b.isVoid?0:b.amount),1500);
  E.wireActions(document.body,b);var fb=document.getElementById('fb');if(fb)E.rating(fb,{single:true,sendClass:'sendb'});
}
E.switcher('2 · Thermal roll',draw);
})();
</script></body></html>
