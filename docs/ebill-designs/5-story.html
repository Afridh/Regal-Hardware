<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your bill · Regal Hardware</title><meta name="theme-color" content="#f4efe6">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
html,body{background:#f4efe6}
*{box-sizing:border-box;margin:0}
body{color:#1e1915;font:400 16px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #a31d24;outline-offset:3px;border-radius:8px}
.serif{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* the rail: a line that fills as the story is read, a dot for each part */
.rail{position:fixed;left:max(14px,calc(50% - 330px));top:120px;bottom:40px;width:2px;background:#e3dbcd;z-index:5}
.rail i{position:absolute;left:0;top:0;width:2px;height:calc(var(--p,0)*100%);background:#a31d24;transition:height .15s linear}
.rail b{position:absolute;left:-5px;width:12px;height:12px;border-radius:50%;background:#f4efe6;border:2px solid #d4c9b6;transition:background .3s,border-color .3s,transform .4s cubic-bezier(.34,1.56,.64,1)}
.rail b.on{background:#a31d24;border-color:#a31d24;transform:scale(1.25)}
.top{position:sticky;top:30px;z-index:6;display:flex;justify-content:space-between;align-items:center;max-width:620px;margin:0 auto;padding:14px 18px 14px 40px;background:linear-gradient(#f4efe6 70%,rgba(244,239,230,0))}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.16em;font-size:12.5px}.brand svg{width:26px;height:22px;fill:#a31d24}
.call{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid #d4c9b6;font-weight:600;font-size:14px;position:relative;overflow:hidden}
.call svg{width:15px;height:15px;fill:#a31d24}
.story{max-width:620px;margin:0 auto;padding:0 18px 60px 46px}
.part{min-height:74vh;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.part.first{min-height:78vh;justify-content:flex-start;padding-top:8vh}
.kick{font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#8a7d6b}
.say{font-size:clamp(38px,10vw,62px);line-height:1.04;letter-spacing:-.02em;margin-top:12px;font-weight:400}
.say em{color:#a31d24}
/* each word lights up as the line comes into view */
.say .w{opacity:.14;transition:opacity .5s ease;transition-delay:calc(var(--i)*55ms)}
.part.in .say .w{opacity:1}
.small{color:#6f6252;margin-top:14px;font-size:16.5px;max-width:30rem}
.big{font-size:clamp(64px,19vw,120px);line-height:.95;letter-spacing:-.04em;margin-top:6px}
.big small{font-size:.26em;font-family:Inter,sans-serif;font-weight:600;color:#8a7d6b;margin-right:8px;vertical-align:1.2em;letter-spacing:.06em}
.items{margin-top:20px}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 0;border-bottom:1px solid #e3dbcd;opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);transition-delay:calc(var(--i)*90ms)}
.part.in .it{opacity:1;transform:none}
.it .n{font-weight:600;font-size:15px}.it .n em{font-style:normal;color:#a31d24;font-weight:500;font-size:13px}
.it .q{font-size:13px;color:#8a7d6b}.it .q s{opacity:.7}
.it .a{grid-row:1/3;grid-column:2;align-self:center;font-weight:700;font-variant-numeric:tabular-nums}
.void .items,.void .tots{opacity:.45;text-decoration:line-through}
.gold{color:#b7791f}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #e3dbcd;font-size:13.5px}
.chip b{color:#1d7a45}
.tots{margin-top:18px;background:#fff;border:1px solid #e3dbcd;border-radius:20px;padding:16px 18px}
.tots div{display:flex;justify-content:space-between;padding:3px 0;font-size:14.5px;color:#6f6252}
.tots .g{color:#1e1915;font-size:17px;font-weight:700}
.tots .due{color:#a31d24;font-weight:700}
.seal{align-self:flex-start;margin-top:18px;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;transform:scale(.7);opacity:0;transition:transform .6s cubic-bezier(.34,1.56,.64,1) .3s,opacity .4s .3s}
.part.in .seal{transform:none;opacity:1}
.seal svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6}
.k-cash{background:#e2f3e8;color:#1d7a45}.k-credit{background:#fbe3e1;color:#a31d24}.k-void{background:#ece7de;color:#6f6252}.k-quote{background:#fbefd5;color:#9a5d0c}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:54px;border-radius:16px;border:1px solid #d4c9b6;background:#fff;font-weight:600;font-size:15px;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .2s}
.btn:hover{box-shadow:0 8px 20px rgba(30,25,21,.1)}.btn:active{transform:scale(.95);transition-duration:.08s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn.ink{background:#1e1915;color:#fff;border-color:#1e1915}.btn.red{background:#a31d24;color:#fff;border-color:#a31d24}.btn.full{grid-column:1/-1}
.card{margin-top:16px;padding:20px;border-radius:22px;background:#fff;border:1px solid #e3dbcd}
.card h3{font-size:28px;font-weight:400;line-height:1.1}.card p{color:#6f6252;font-size:14px;margin-top:4px}
.owes{font-size:44px;line-height:1;margin-top:8px}
.ticks{display:flex;gap:6px;margin-top:14px}
.tk{flex:1;min-height:52px;border-radius:14px;border:1px solid #e3dbcd;background:#faf7f1;font-family:Fraunces,serif;font-size:22px;position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .2s,color .2s}
.tk.on{background:#a31d24;color:#fff;border-color:#a31d24}
.tk.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.14)}}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{min-height:38px;padding:6px 14px;border-radius:999px;border:1px solid #d4c9b6;background:#fff;font-size:14px;position:relative;overflow:hidden}
.tg.on{background:#1e1915;color:#fff;border-color:#1e1915}
.fbnote{width:100%;margin-top:10px;border:1px solid #d4c9b6;border-radius:14px;padding:10px 14px;font:inherit;min-height:46px;background:#faf7f1}
.sendb{width:100%;margin-top:10px;min-height:52px;border:0;border-radius:16px;background:#1e1915;color:#fff;font-weight:700;position:relative;overflow:hidden}
.thanks{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600;color:#1d7a45}
.thanks svg{width:26px;height:26px;fill:none;stroke:#1d7a45;stroke-width:3;stroke-dasharray:24;stroke-dashoffset:24;animation:draw .5s forwards}@keyframes draw{to{stroke-dashoffset:0}}
.scrollcue{margin-top:30px;display:flex;align-items:center;gap:10px;color:#8a7d6b;font-size:13.5px}
.scrollcue i{width:1px;height:34px;background:#8a7d6b;animation:cue 1.6s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
.foot{text-align:center;color:#8a7d6b;font-size:13px;line-height:1.7;padding-bottom:30px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.say .w,.it,.seal{opacity:1;transform:none}.thanks svg{stroke-dashoffset:0}}
@media print{.rail,.top,.scrollcue,.acts,.card,.foot{display:none!important}.part{min-height:0;padding:10px 0}.say .w,.it,.seal{opacity:1;transform:none}}
</style></head><body>
<div class="rail" id="rail" aria-hidden="true"><i></i></div>
<header class="top"><span class="brand"></span><a class="call rp" href="tel:+94772222259"></a></header>
<main class="story" id="page"></main>
<footer class="foot">Regal Hardware · 748, Main Street, Kaduruwela<br>Open 8am to 7pm · <a href="tel:+94772222259">077 222 22 59</a></footer>
<script src="common.js"></script>
<script>
(function(){var E=EB;
document.querySelector('.brand').innerHTML=E.MARK+'REGAL HARDWARE';document.querySelector('.call').innerHTML=E.ICON.call+'Call';
function words(html){var out='',i=0;html.split(/(<em>.*?<\/em>)/).forEach(function(part){if(!part)return;var em=/^<em>/.test(part),t=part.replace(/<\/?em>/g,'');var w=t.split(/\s+/).filter(Boolean).map(function(x){return '<span class="w" style="--i:'+(i++)+'">'+x+'</span>'}).join(' ');out+=(em?'<em>'+w+'</em>':w)+' '});return out}
var io=null;
function draw(b){
  var parts=[];
  parts.push('<section class="part first" data-step><div class="kick">'+E.esc(b.kind)+' '+E.esc(b.no)+'</div><h1 class="serif say">'+words(b.k==='quote'?'You asked for <em>a price</em> at 10:28.':b.k==='void'?'This bill was <em>cancelled.</em>':b.who?'Thank you, <em>'+b.who+'.</em>':'You came in at <em>10:28.</em>')+'</h1><p class="small">'+(b.isVoid?'The shop took it back on 8 Nov. Nothing is owed on it. Here is what it was.':'Saturday, 8 November 2026. '+E.by+' served you at the counter on Main Street.')+'</p><div class="scrollcue"><i></i>Scroll</div></section>');
  parts.push('<section class="part" data-step><div class="kick">What you '+(b.isQuote?'asked about':'took home')+'</div><h2 class="serif say">'+words('You picked <em>'+E.LINES.length+' things.</em>')+'</h2><div class="items'+(b.isVoid?' void':'')+'">'+E.LINES.map(function(l,i){return E.lineHTML(l,i,'it')}).join('')+'</div></section>');
  if(!b.isVoid)parts.push('<section class="part" data-step data-count="'+E.saved+'"><div class="kick">Against the marked price</div><h2 class="serif say">'+words('You '+(b.isQuote?'save':'saved'))+'</h2><div class="serif big gold num"><small>RS</small><span class="cnt">'+E.rs(E.saved)+'</span></div><p class="small">That is the MRP on these items, less what we charged. Our prices are lower than the marked price on almost everything.</p></section>');
  var seal={cash:'Paid in full',credit:'On your account — to pay',void:'Cancelled — nothing owed',quote:'Holds good until 22 Nov'}[b.k];
  parts.push('<section class="part" data-step data-count="'+(b.isVoid?0:b.amount)+'"><div class="kick">'+(b.isQuote?'The price':'Altogether')+'</div><div class="serif big num"><small>RS</small><span class="cnt">'+E.rs(b.isVoid?0:b.amount)+'</span></div>'+
    '<span class="seal k-'+b.k+'">'+E.ICON.tick+E.esc(seal)+'</span>'+
    '<div class="tots'+(b.isVoid?' void':'')+'"><div class="g"><span>Total</span><span class="num">Rs '+E.rs(E.total)+'</span></div>'+b.pays.map(function(p){return '<div><span>'+E.esc(p[0])+'</span><span class="num">'+E.rs(p[1])+'</span></div>'}).join('')+(b.due?'<div class="due"><span>To pay</span><span class="num">Rs '+E.rs(b.due)+'</span></div>':'')+'</div>'+
    '<div class="acts">'+(b.isQuote?'<a class="btn red full rp" href="#" data-demo>'+E.ICON.wa+'Order this on WhatsApp</a><a class="btn rp" href="'+E.shop.tel+'">'+E.ICON.call+'Call to order</a><a class="btn rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online</a>':
      '<button class="btn ink rp" type="button" data-pdf>'+E.ICON.dl+'Save as PDF</button><button class="btn rp" type="button" data-share>'+E.ICON.wa+'Share</button><a class="btn red full rp" href="https://regalhw.lk">'+E.ICON.bag+'Shop online at regalhw.lk</a>')+'</div>'+
    (b.acct?'<div class="card"><p style="margin:0">Your account with us</p><div class="serif owes num">Rs '+E.rs(b.acct.owes)+'</div><p>across '+b.acct.bills.length+' unpaid bills</p><a class="btn ink full rp" style="display:flex;margin-top:14px" href="#" data-demo>See every bill and payment</a></div>':'')+
    (!b.isVoid&&!b.isQuote?'<div class="card" id="fb"><h3 class="serif">And how was it?</h3><p>From 1 to 5. The owner reads every answer.</p><div class="ticks" role="radiogroup" aria-label="Your rating">'+[1,2,3,4,5].map(function(i){return '<button class="tk rp" type="button" role="radio" aria-checked="false" data-rate="'+i+'">'+i+'</button>'}).join('')+'</div><div data-more></div></div>':'')+
    '</section>');
  document.getElementById('page').innerHTML=parts.join('');
  // the rail's dots, one per part
  var rail=document.getElementById('rail');rail.querySelectorAll('b').forEach(function(x){x.remove()});
  var steps=[].slice.call(document.querySelectorAll('[data-step]'));steps.forEach(function(s,i){var d=document.createElement('b');d.style.top=(i/(steps.length-1)*100)+'%';d.style.marginTop='-6px';rail.appendChild(d);s._dot=d});
  if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var s=e.target;s.classList.add('in');s._dot.classList.add('on');
    if(s.dataset.count&&!s._done){s._done=1;E.countUp(s.querySelector('.cnt'),+s.dataset.count,1600,250)}})},{threshold:.35});
  steps.forEach(function(s){if(E.reduce){s.classList.add('in');s._dot.classList.add('on')}else io.observe(s)});
  E.wireActions(document.body,b);var fb=document.getElementById('fb');if(fb)E.rating(fb,{single:true,sendClass:'sendb'});
  onScroll();
}
function onScroll(){var h=document.documentElement.scrollHeight-innerHeight;document.getElementById('rail').style.setProperty('--p',h>0?Math.min(1,scrollY/h):1)}
addEventListener('scroll',onScroll,{passive:true});
E.switcher('5 · The story',draw);
})();
</script></body></html>
