<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Command — Regal POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#0b0c0f}
*{box-sizing:border-box;margin:0}
body{color:#e9ebee;font:500 14px/1.4 Manrope,system-ui,sans-serif;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid #ffb547;outline-offset:2px}
/* the light behind: two slow blooms and a fine dot grid */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.42;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){width:620px;height:620px;background:#a31d24;left:-160px;top:-220px}
.bg i:nth-child(2){width:520px;height:520px;background:#c26a14;right:-180px;bottom:-240px;animation-duration:28s;opacity:.28}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px);background-size:22px 22px;-webkit-mask:linear-gradient(180deg,#000,transparent 85%);mask:linear-gradient(180deg,#000,transparent 85%)}
@keyframes drift{to{transform:translate(120px,80px) scale(1.15)}}
/* glass: a gradient hairline rim, never a border */
.glass{position:relative;background:rgba(255,255,255,.035);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 1px rgba(255,255,255,.08)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.07) 22%,rgba(255,255,255,0) 45%,rgba(255,255,255,0) 60%,rgba(255,255,255,.07) 82%,rgba(255,255,255,.2));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude}
/* top bar */
.top{height:68px;display:grid;grid-template-columns:300px 1fr 300px;align-items:center;gap:20px;padding:0 24px}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#c62833,#7e141d);box-shadow:0 6px 18px rgba(163,29,36,.45)}
.mark svg{width:24px;height:21px;fill:#fff}
.brand b{display:block;font-weight:800;font-size:15px;letter-spacing:.01em}.brand small{color:#8d93a0;font-size:12px}
.find{justify-self:center;width:min(520px,100%);height:44px;border-radius:999px;display:flex;align-items:center;gap:10px;padding:0 8px 0 18px}
.find svg{width:18px;height:18px;flex:none;color:#8d93a0}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:14.5px}
.find input::placeholder{color:#8d93a0}
.kbd{font:700 11px Manrope,sans-serif;color:#c7cbd3;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.07);white-space:nowrap}
.me{justify-self:end;display:flex;align-items:center;gap:14px}
.time{text-align:right}.time b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}.time small{color:#8d93a0;font-size:12px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:#f3f4f6;color:#111}
/* body */
.main{height:calc(100vh - 68px);display:grid;grid-template-columns:330px 1fr;gap:18px;padding:4px 24px 22px}
.side{display:grid;grid-template-rows:auto 1fr auto;gap:14px;min-height:0}
/* the one that matters most: New Invoice, with a travelling light ring */
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.hero{position:relative;border-radius:22px;padding:22px;text-align:left;border:0;cursor:pointer;background:linear-gradient(160deg,#1c0d10,#13090b);isolation:isolate;min-height:196px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.hero::before{content:"";position:absolute;inset:-1.5px;padding:1.5px;border-radius:inherit;z-index:-1;background:conic-gradient(from var(--a),#ff5a4e,#3a0b10 25%,#ffb547 50%,#3a0b10 75%,#ff5a4e);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);mask-composite:exclude;animation:ring 4s linear infinite}
.hero::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;background:radial-gradient(120% 90% at 100% 0%,rgba(198,40,51,.55),transparent 60%)}
@keyframes ring{to{--a:360deg}}
.hero:hover{transform:translateY(-3px)}
.hero .ic{width:46px;height:46px}
.hero h2{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:10px}
.hero p{color:#e3b7b9;font-size:13.5px;margin-top:6px}
.hero .row{display:flex;justify-content:space-between;align-items:flex-end}
.hero .go{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:#fff;color:#111;font-weight:800;font-size:13px}
/* today */
.today{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;min-height:0}
.today small{color:#8d93a0;font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.big em{font-style:normal;font-size:15px;color:#8d93a0;margin-right:6px;font-weight:700}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:rgba(255,255,255,.08)}
.split i{display:block;height:100%;transform-origin:left;animation:grow 1.2s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes grow{from{transform:scaleX(0)}}
.legend{display:flex;justify-content:space-between;font-size:12.5px;color:#b9bec8}.legend b{color:#fff}
.hours{flex:1;min-height:40px;display:flex;align-items:flex-end;gap:5px;padding-top:6px}.hours i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,#ffb547,rgba(255,181,71,.25));transform-origin:bottom;animation:bar .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.6s + var(--j)*45ms)}.hours i.now{background:linear-gradient(180deg,#ff5a4e,rgba(255,90,78,.3))}@keyframes bar{from{transform:scaleY(0)}}.hlab{display:flex;justify-content:space-between;font-size:11px;color:#6d7380}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto}
.kv div{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.04)}
.kv b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.kv span{font-size:12px;color:#8d93a0}
.kv .warn b{color:#ffb547}
.adds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.add{display:flex;align-items:center;gap:9px;padding:11px 12px;border-radius:14px;border:0;cursor:pointer;text-align:left;font-weight:700;font-size:13px;transition:background .2s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.add:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.add .ic{width:20px;height:20px;color:#ffb547;flex:none}
/* the rest: glass tiles with a light that follows the pointer */
.grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:1fr;gap:12px;min-height:0}
.t{border:0;border-radius:18px;padding:14px 12px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:6px;color:#e9ebee;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .25s,filter .25s;animation:up .6s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*28ms + .1s)}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.97)}}
.t::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(180px circle at var(--mx,50%) var(--my,50%),rgba(255,181,71,.18),transparent 65%)}
.t:hover,.t:focus-visible{transform:translateY(-3px)}
.t:hover::after,.t:focus-visible::after{opacity:1}
.t .ic{width:34px;height:34px;color:#cfd3da;transition:color .2s,transform .35s cubic-bezier(.34,1.56,.64,1)}
.t:hover .ic,.t:focus-visible .ic{color:#ffb547;transform:scale(1.08) rotate(-4deg)}
.t b{display:block;font-size:15px;font-weight:800;line-height:1.15}
.t div span{display:block;font-size:11.5px;color:#8d93a0;line-height:1.25;margin-top:3px}
.t .k{position:absolute;right:10px;top:10px;font-size:10px;padding:3px 6px}
.t .dot{position:absolute;left:12px;bottom:0;height:2px;width:22px;border-radius:2px}
.dim{opacity:.18;filter:grayscale(1)}
.first{transform:translateY(-3px)}.first::after{opacity:1}
.g-Sell{--g:#ff6b5e}.g-Buy{--g:#5ec2ff}.g-Stock{--g:#9df07a}.g-Money{--g:#ffb547}.g-People{--g:#c39bff}
.t .dot{background:var(--g)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="bg" aria-hidden="true"><i></i><i></i></div>
<header class="top">
  <div class="brand"><span class="mark"><svg viewBox="0 0 500 430"><path d="M246 12 375 235H270L375 414H318L220 235 260 190H300L246 100 95 414H38ZM192 280 272 414H222L168 324ZM142 370 168 414H116ZM350 280H403L480 414H428Z"/></svg></span><span><b>Regal Hardware</b><small>Counter 01 · Kaduruwela</small></span></div>
  <label class="find glass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" placeholder="Type to find anything — bills, stock, cheques…" aria-label="Find a page" autocomplete="off"><span class="kbd">Ctrl K</span></label>
  <div class="me"><div class="time"><b id="clk">—</b><small id="day"></small></div><span class="av">AF</span></div>
</header>
<main class="main">
  <aside class="side">
    <button class="hero" data-tile="0" type="button"><div class="row"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path id="heroIc"/></svg><span class="kbd" style="background:rgba(255,255,255,.14);color:#fff">F3</span></div>
      <div><h2>New invoice</h2><p id="hello"></p></div>
      <div class="row"><span class="go">Start a bill →</span></div></button>
    <section class="today glass" aria-label="Today">
      <small>Sales today</small>
      <div class="big"><em>Rs</em><span id="sales">0</span></div>
      <div class="split" aria-hidden="true"><i style="width:69%;background:#ffb547"></i><i style="width:31%;background:#ff5a4e;animation-delay:.7s"></i></div>
      <div class="legend"><span>Cash <b id="cash"></b></span><span>Credit <b id="credit"></b></span></div>
      <div class="hours" id="hours" aria-label="Sales by hour"></div><div class="hlab"><span>8 am</span><span>by the hour</span><span>now</span></div><div class="kv"><div><b id="bills">0</b><span>bills today</span></div><div class="warn"><b id="low">0</b><span>items running low</span></div></div>
    </section>
    <div class="adds" id="adds"></div>
  </aside>
  <section class="grid" id="grid" aria-label="Everything else"></section>
</main>
<a class="demo-back" href="./">← all designs</a>
<script src="common.js"></script>
<script>
(function(){var T=H.TILES;
document.getElementById('heroIc').setAttribute('d',H.ICON.pos);
document.getElementById('hello').textContent=H.hello()+', Afridh. The till is ready.';
H.clock(document.getElementById('clk'));document.getElementById('day').textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
document.getElementById('adds').innerHTML=T.map(function(t,i){return t.add&&i>0?'<button class="add glass" type="button" data-tile="'+i+'">'+H.icon(t.k)+H.esc(t.label)+'</button>':''}).join('');
var n=0;document.getElementById('grid').innerHTML=T.map(function(t,i){return t.add?'':'<button class="t glass g-'+t.group+'" type="button" data-tile="'+i+'" style="--i:'+(n++)+'">'+H.icon(t.k)+(t.key?'<span class="kbd k">'+t.key+'</span>':'')+'<div><b>'+H.esc(t.label)+'</b><span>'+H.esc(t.desc)+'</span></div><i class="dot"></i></button>'}).join('');
var tiles=H.wire();H.search(document.getElementById('q'),tiles);
document.querySelectorAll('.t').forEach(function(b){b.addEventListener('pointermove',function(e){var r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left)+'px');b.style.setProperty('--my',(e.clientY-r.top)+'px')})});
var hs=[6,14,22,18,31,26,12,19,28,35,24];document.getElementById('hours').innerHTML=hs.map(function(v,j){return '<i style="height:'+(v/35*100)+'%;--j:'+j+'"'+(j===hs.length-1?' class="now"':'')+'></i>'}).join('');
var D=H.TODAY;H.countUp(document.getElementById('sales'),D.sales,1400,300);H.countUp(document.getElementById('bills'),D.bills,1100,500);H.countUp(document.getElementById('low'),D.lowStock,1100,600);
document.getElementById('cash').textContent='Rs '+H.rs(D.cash);document.getElementById('credit').textContent='Rs '+H.rs(D.credit);
})();
</script></body></html>
