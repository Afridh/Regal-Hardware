<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Shelves — Regal POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#f3f2ef}
*{box-sizing:border-box;margin:0}
body{color:#1d1f23;font:500 14px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;padding:20px 26px 22px;gap:16px;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid #1d1f23;outline-offset:2px}
/* the top: the time, big, and today in three chips */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:28px}
.time b{display:block;font-size:46px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.time span{font-size:13.5px;color:#6b6e75;font-weight:600}
.find{display:flex;align-items:center;gap:10px;height:50px;padding:0 10px 0 18px;border-radius:16px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.18);max-width:520px;width:100%;justify-self:center}
.find svg{width:19px;height:19px;color:#8b8e95;flex:none}
.find input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:15px}
.find input::placeholder{color:#9a9da4}
.kbd{font:700 11px 'Plus Jakarta Sans',sans-serif;color:#6b6e75;padding:4px 8px;border-radius:8px;background:#f0efeb;white-space:nowrap}
.chips{display:flex;gap:10px}
.chip{background:#fff;border-radius:16px;padding:10px 16px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 24px -14px rgba(0,0,0,.2);min-width:130px}
.chip small{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8b8e95}
.chip b{font-size:21px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip.warn b{color:#c2410c}
/* the shelves: a bento of five cards, one for each part of the shop */
.bento{flex:1;min-height:0;display:grid;grid-template-columns:1.32fr 1fr 1fr;grid-template-rows:1.12fr 1fr;gap:14px}
.card{border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;background:var(--bg);animation:rise .7s cubic-bezier(.16,1,.3,1) both;animation-delay:var(--d)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.card h2{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.card h2 i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.card h2 em{margin-left:auto;font-style:normal;font-weight:600;letter-spacing:0;text-transform:none;color:var(--ink);opacity:.65;font-size:12px}
.sell{grid-row:1/3;--bg:#fbe9e7;--c:#c8302b;--ink:#7a1c18;--d:.05s}
.buy{--bg:#e6f0fb;--c:#2563b8;--ink:#183f73;--d:.12s}
.money{--bg:#fdf1db;--c:#c47a0a;--ink:#6e4505;--d:.19s}
.stock{--bg:#e7f5e6;--c:#2f8a3a;--ink:#1d5524;--d:.26s}
.people{--bg:#efe9fb;--c:#6d45c9;--ink:#40287a;--d:.33s}
.in{flex:1;min-height:0;display:grid;gap:8px}
.sell .in{grid-template-columns:repeat(3,1fr);grid-template-rows:1.25fr 1fr 1fr}
.buy .in,.money .in{grid-template-columns:repeat(3,1fr)}
.stock .in{grid-template-columns:repeat(4,1fr)}.people .in{grid-template-columns:repeat(3,1fr)}
.t{border:0;border-radius:16px;background:rgba(255,255,255,.72);cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:6px;padding:11px 12px;text-align:left;min-height:0;
  transition:background .2s,transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,opacity .2s}
.t:hover,.t:focus-visible{background:#fff;transform:translateY(-2px);box-shadow:0 10px 22px -12px rgba(0,0,0,.3)}
.t .chipic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#fff;color:var(--c);box-shadow:0 1px 0 rgba(0,0,0,.05);transition:background .25s,color .25s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.t:hover .chipic,.t:focus-visible .chipic{background:var(--c);color:#fff;transform:scale(1.1) rotate(-6deg)}
.t .ic{width:21px;height:21px}
.t b{display:block;font-size:14px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
.t span{display:block;font-size:11.5px;color:#6b6e75;line-height:1.25;margin-top:1px}
.t .kbd{position:absolute;right:9px;top:9px;background:rgba(0,0,0,.05);font-size:10px;padding:3px 6px}
/* New Invoice: the big one */
.t.lead{grid-column:1/3;background:var(--c);color:#fff;padding:16px 18px}
.t.lead .chipic{width:52px;height:52px;border-radius:16px;background:rgba(255,255,255,.18);color:#fff}
.t.lead .ic{width:28px;height:28px}
.t.lead b{font-size:24px}.t.lead span{color:#ffd9d6;font-size:13px}
.t.lead .kbd{background:rgba(255,255,255,.2);color:#fff}
.t.lead:hover{background:#b0221e}
.t.lead:hover .chipic{background:#fff;color:var(--c)}
.t.add b::before{content:"+ ";color:var(--c)}.t.lead b::before{content:"+ ";color:#fff}
.dim{opacity:.25}
.first{background:#fff;box-shadow:0 0 0 2.5px var(--c)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header class="top">
  <div class="time"><b id="clk">—</b><span id="hello"></span></div>
  <label class="find"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="Find a page — type its name" aria-label="Find a page" autocomplete="off"><span class="kbd">Ctrl K</span></label>
  <div class="chips"><div class="chip"><small>Sales today</small><b>Rs <span id="sales">0</span></b></div><div class="chip"><small>Bills</small><b id="bills">0</b></div><div class="chip warn"><small>Running low</small><b id="low">0</b></div></div>
</header>
<main class="bento" id="bento" aria-label="Everything in the system"></main>
<a class="demo-back" href="./">← all designs</a>
<script src="common.js"></script>
<script>
(function(){var T=H.TILES;
H.clock(document.getElementById('clk'));document.getElementById('hello').textContent=H.hello()+', Afridh · '+H.today();
var cls={Sell:'sell',Buy:'buy',Money:'money',Stock:'stock',People:'people'};
var order=['Sell','Buy','Money','Stock','People'];
document.getElementById('bento').innerHTML=order.map(function(g){var name=H.GROUPS.filter(function(x){return x[0]===g})[0][1];
  var mine=T.map(function(t,i){return [t,i]}).filter(function(x){return x[0].group===g});
  return '<section class="card '+cls[g]+'"><h2><i></i>'+name+'<em>'+mine.length+'</em></h2><div class="in">'+mine.map(function(x){var t=x[0];
    return '<button type="button" class="t'+(t.add?' add':'')+(t.k==='pos'&&t.add?' lead':'')+'" data-tile="'+x[1]+'"><span class="chipic">'+H.icon(t.k)+'</span>'+(t.key?'<span class="kbd">'+t.key+'</span>':'')+'<div><b>'+H.esc(t.label)+'</b><span>'+H.esc(t.desc)+'</span></div></button>'}).join('')+'</div></section>'}).join('');
var tiles=H.wire();H.search(document.getElementById('q'),tiles);
var D=H.TODAY;H.countUp(document.getElementById('sales'),D.sales,1300,300);H.countUp(document.getElementById('bills'),D.bills,1000,400);H.countUp(document.getElementById('low'),D.lowStock,1000,500);
})();
</script></body></html>
