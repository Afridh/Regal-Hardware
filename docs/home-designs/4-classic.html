<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Classic Plus — Regal POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#c9cacb}
*{box-sizing:border-box;margin:0}
body{color:#2b2e31;font:500 14px/1.35 Archivo,system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 0%,#d6d7d8 0%,#c3c4c6 70%)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #a31d24;outline-offset:3px}
.head{display:flex;justify-content:space-between;align-items:center;padding:14px 34px 0}
.head h1{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#4a4f52}
.head h1 b{color:#a31d24}
.find{display:flex;align-items:center;gap:8px;background:#fff;border-radius:6px;padding:7px 8px 7px 12px;box-shadow:0 2px 0 rgba(0,0,0,.08);width:300px}
.find input{flex:1;min-width:0;border:0;outline:0;background:none;font-weight:600}
.find i{font:700 10.5px Archivo,sans-serif;font-style:normal;background:#e6e6e7;border-radius:4px;padding:3px 6px;color:#5a5f63}
/* the tiles: seven across, four down — one screen, no scrolling */
.grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(4,1fr);gap:4px 10px;padding:10px 34px 12px;max-width:1300px;width:100%;margin:0 auto}
.t{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 4px 6px;border-radius:12px;min-height:0;transition:background .2s,opacity .2s}
.t:hover,.t:focus-visible{background:rgba(255,255,255,.28)}
.t .art{position:relative;width:62px;height:62px;color:#4a4f52;transition:color .2s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.t .art .ic{width:62px;height:62px;stroke-width:1.45}
/* the icon draws itself: once as the page opens, and again when pointed at */
.t .ic path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s cubic-bezier(.65,0,.35,1) forwards;animation-delay:calc(.15s + var(--i)*40ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.t:hover .ic path,.t:focus-visible .ic path{animation:redraw .7s cubic-bezier(.65,0,.35,1) forwards}
@keyframes redraw{0%{stroke-dashoffset:1}100%{stroke-dashoffset:0}}
.t:hover .art,.t:focus-visible .art{color:#a31d24;transform:translateY(-3px) scale(1.05)}
.plus{position:absolute;right:-6px;top:-4px;width:24px;height:24px;border-radius:50%;background:#4a4f52;color:#fff;font:800 19px/24px Archivo,sans-serif;text-align:center;box-shadow:0 0 0 3px #cdcecf;transform:scale(0);animation:pop .4s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(.6s + var(--i)*40ms)}
@keyframes pop{to{transform:scale(1)}}
.t:hover .plus,.t:focus-visible .plus{background:#a31d24}
.plate{position:relative;display:block;width:100%;max-width:168px;background:#fff;border-radius:3px;padding:7px 8px;font-weight:800;font-size:15px;color:#1f2224;box-shadow:0 2px 0 rgba(0,0,0,.12),0 6px 10px -6px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plate::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:#a31d24;transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.65,0,.35,1)}
.t:hover .plate::after,.t:focus-visible .plate::after{transform:scaleX(1)}
.desc{min-height:2.5em;font-size:11.5px;color:#4f5458;max-width:170px;text-align:center;line-height:1.25}
.key{font-size:10.5px;font-weight:700;color:#6a6f73}
/* today, in the last two places of the grid */
.today{grid-column:6/8;grid-row:4;align-self:center;background:#3f4346;color:#fff;border-radius:10px;padding:12px 16px;display:grid;grid-template-columns:1.7fr .8fr 1.1fr;gap:10px;box-shadow:0 8px 18px -10px rgba(0,0,0,.5)}
.today small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#b7bcbf}
.today b{white-space:nowrap;font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.today .w b{color:#ffcf5a}
.dim{opacity:.22}
.first{background:rgba(255,255,255,.4)}.first .plate::after{transform:scaleX(1)}
/* the status bar along the foot, as on SePOS */
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 16px;background:#3f4346;color:#e6e7e8;font-size:12.5px;font-weight:600}
.bar .mid{display:flex;height:100%}
.bar .mid a{display:flex;align-items:center;padding:0 18px;color:#fff;text-decoration:none;font-weight:700;font-size:15px}
.bar .mid a:nth-child(1){background:#1b8ac7}.bar .mid a:nth-child(2){background:#f07e1b}
.bar .on{display:inline-block;width:7px;height:7px;border-radius:50%;background:#53d37a;margin-right:6px;box-shadow:0 0 0 0 rgba(83,211,122,.6);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(83,211,122,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.t .ic path{stroke-dashoffset:0}.plus{transform:none}}
</style></head><body>
<header class="head"><h1><b>Regal</b> Hardware · Home</h1><label class="find"><input id="q" placeholder="Find a page…" aria-label="Find a page" autocomplete="off"><i>CTRL K</i></label></header>
<main class="grid" id="grid" aria-label="Everything in the system"></main>
<footer class="bar"><span><i class="on"></i>Counter 01 · Signed in as Afridh · saved 6:42 pm</span><span class="mid"><a href="#" class="rp" onclick="H.toast('Opens: AI support');return false">AI Support</a><a href="#" class="rp" onclick="H.toast('Opens: Settings');return false">Settings</a></span><span id="clk"></span></footer>
<a class="demo-back" href="./" style="bottom:42px">← all designs</a>
<script src="common.js"></script>
<script>
(function(){var T=H.TILES;
var clk=document.getElementById('clk');var tick=function(){clk.textContent=new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'numeric',year:'numeric'})+'  '+new Date().toLocaleTimeString('en-GB',{hour12:true})};tick();setInterval(tick,1000);
document.getElementById('grid').innerHTML=T.map(function(t,i){
  return '<button type="button" class="t" data-tile="'+i+'" style="--i:'+i+'"><span class="art">'+H.icon(t.k)+(t.add?'<b class="plus">+</b>':'')+'</span><span class="plate">'+(t.add?'+ ':'')+H.esc(t.label)+'</span><span class="desc">'+H.esc(t.desc)+(t.key?' · <span class="key">'+t.key+'</span>':'')+'</span></button>'}).join('')+
  '<section class="today" aria-label="Today"><div><small>Sales today</small><b>Rs <span id="sales">0</span></b></div><div><small>Bills</small><b id="bills">0</b></div><div class="w"><small>Running low</small><b id="low">0</b></div></section>';
var tiles=H.wire();H.search(document.getElementById('q'),tiles);
var D=H.TODAY;H.countUp(document.getElementById('sales'),D.sales,1300,700);H.countUp(document.getElementById('bills'),D.bills,1000,800);H.countUp(document.getElementById('low'),D.lowStock,1000,900);
})();
</script></body></html>
