<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Home · Poster — Regal POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{background:#a31d24}
*{box-sizing:border-box;margin:0}
body{color:#fff;font:500 14px/1.4 Barlow,system-ui,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffcf5a;outline-offset:2px}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9}
/* the red: the hour as one huge word, and today in figures */
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding:16px 30px 0}
.eb{display:flex;gap:10px;align-items:center;font-weight:700;letter-spacing:.16em;font-size:12px;text-transform:uppercase;opacity:.9}
.eb::before{content:"";width:28px;height:2px;background:#fff}
.ww{overflow:hidden;padding-top:.05em}
h1{font-size:112px;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:2px #fff;white-space:nowrap;animation:fill .6s ease-out 1s forwards}
h1 span{display:inline-block;transform:translateY(105%);animation:up .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.1s + var(--i)*.045s)}
@keyframes up{to{transform:none}}@keyframes fill{to{color:#fff;-webkit-text-stroke:2px transparent}}
.who{font-weight:800;font-size:20px;color:#ffcf5a;margin-top:6px}
.figs{display:flex;gap:26px;padding-bottom:6px}
.fig small{display:block;font-weight:700;letter-spacing:.14em;font-size:11px;text-transform:uppercase;opacity:.8}
.fig b{display:block;font:400 46px/1 Anton,Impact,sans-serif;font-variant-numeric:tabular-nums;margin-top:4px}
.fig b em{font-style:normal;font-size:.4em;vertical-align:.95em;margin-right:4px;opacity:.8}
.fig.gold b{color:#ffcf5a}
.clock{font:400 22px Anton,Impact,sans-serif;letter-spacing:.04em;text-align:right;opacity:.95}
/* the banner */
.band{margin-top:14px;background:#1a0d0e;transform:rotate(-1.4deg) scale(1.03);padding:9px 0;overflow:hidden;box-shadow:0 12px 26px rgba(0,0,0,.25);flex:none}
.band div{display:flex;gap:30px;width:max-content;animation:run 40s linear infinite;font:400 19px Anton,Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.band span::after{content:"✦";margin-left:30px;color:#e2463f}
@keyframes run{to{transform:translateX(-50%)}}
/* the cream sheet: five rows, one per part of the shop */
.sheet{flex:1;min-height:0;margin-top:16px;background:#f7f1e6;color:#1a0d0e;border-radius:30px 30px 0 0;padding:16px 26px 14px;display:grid;grid-template-rows:repeat(5,1fr);gap:8px;
  animation:sheet .9s cubic-bezier(.16,1,.3,1) .35s both;box-shadow:0 -18px 40px rgba(0,0,0,.18)}
@keyframes sheet{from{transform:translateY(90px);opacity:0}}
.row{display:grid;grid-template-columns:116px 1fr;gap:12px;align-items:stretch;min-height:0}
.row h2{font:400 22px/1 Anton,Impact,sans-serif;text-transform:uppercase;align-self:center;color:#a31d24}
.row h2 small{display:block;font:600 11px Barlow,sans-serif;letter-spacing:.06em;text-transform:none;color:#6f6156;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;min-height:0}
.t{border:2px solid #1a0d0e;border-radius:16px;background:transparent;cursor:pointer;display:flex;align-items:center;gap:10px;padding:0 12px;text-align:left;min-height:0;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .2s,background .15s,color .15s,opacity .2s;animation:pop .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(.6s + var(--i)*22ms)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}}
.t:hover,.t:focus-visible{box-shadow:4px 4px 0 #1a0d0e;transform:translate(-2px,-2px)}
.t:active{transform:scale(.96);box-shadow:none}
.t .ic{width:26px;height:26px;flex:none;color:#a31d24}
.t b{display:block;font-weight:800;font-size:14.5px;line-height:1.1}
.t span{display:block;font-size:11.5px;color:#6f6156;line-height:1.2;margin-top:1px}
.t.add{background:#a31d24;border-color:#a31d24;color:#fff}.t.add .ic{color:#ffcf5a}.t.add span{color:#ffd9d4}
.t.add:hover{box-shadow:4px 4px 0 #1a0d0e}
.t.hot{background:#1a0d0e;border-color:#1a0d0e;color:#fff}.t.hot .ic{color:#ffcf5a}.t.hot span{color:#c9bdb2}
.dim{opacity:.22}
.first{box-shadow:4px 4px 0 #1a0d0e;transform:translate(-2px,-2px)}
.find{position:absolute;right:30px;top:16px;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 6px 6px 14px;width:280px}
.find input{flex:1;min-width:0;background:none;border:0;outline:0;color:#fff;font-weight:600}
.find input::placeholder{color:rgba(255,255,255,.75)}
.find i{font:700 11px Barlow,sans-serif;font-style:normal;background:#fff;color:#a31d24;border-radius:999px;padding:3px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}h1{color:#fff;-webkit-text-stroke:0}h1 span{transform:none}}
</style></head><body>
<label class="find"><input id="q" placeholder="Find anything…" aria-label="Find a page" autocomplete="off"><i>CTRL K</i></label>
<section class="hero">
  <div><div class="eb"><span id="date"></span></div><div class="ww"><h1 class="disp" id="word"></h1></div><div class="who">Afridh · Counter 01</div></div>
  <div><div class="clock" id="clk"></div>
    <div class="figs"><div class="fig"><small>Sales today</small><b><em>Rs</em><span id="sales">0</span></b></div><div class="fig gold"><small>Bills</small><b id="bills">0</b></div><div class="fig"><small>To collect</small><b><em>Rs</em><span id="due">0</span></b></div></div></div>
</section>
<div class="band" aria-hidden="true"><div id="band"></div></div>
<main class="sheet" id="sheet" aria-label="Everything in the system"></main>
<a class="demo-back" href="./" style="color:#1a0d0e">← all designs</a>
<script src="common.js"></script>
<script>
(function(){var T=H.TILES,w=H.hello().toUpperCase()+'.';
document.getElementById('date').textContent=H.today();
document.getElementById('word').innerHTML=w.split('').map(function(c,i){return '<span style="--i:'+i+'">'+(c===' '?'&nbsp;':c)+'</span>'}).join('');
document.getElementById('word').setAttribute('aria-label',w);
H.clock(document.getElementById('clk'));
var bandTxt=['Regal Hardware','42 bills today','17 items running low','3 things need a look','Kaduruwela'];
document.getElementById('band').innerHTML=bandTxt.concat(bandTxt,bandTxt,bandTxt).map(function(x){return '<span>'+x+'</span>'}).join('');
var n=0;document.getElementById('sheet').innerHTML=H.GROUPS.map(function(g){
  var mine=T.map(function(t,i){return [t,i]}).filter(function(x){return x[0].group===g[0]});
  return '<section class="row"><h2>'+g[0]+'<small>'+g[1]+'</small></h2><div class="tiles">'+mine.map(function(x){var t=x[0];
    return '<button type="button" class="t'+(t.add?' add':'')+(t.k==='pos'&&t.add?' hot':'')+'" data-tile="'+x[1]+'" style="--i:'+(n++)+'">'+H.icon(t.k)+'<div><b>'+(t.add?'+ ':'')+H.esc(t.label)+'</b><span>'+H.esc(t.key||t.desc)+'</span></div></button>'}).join('')+'</div></section>'}).join('');
var tiles=H.wire();H.search(document.getElementById('q'),tiles);
var D=H.TODAY;H.countUp(document.getElementById('sales'),D.sales,1400,700);H.countUp(document.getElementById('bills'),D.bills,1100,800);H.countUp(document.getElementById('due'),D.toCollect,1400,900);
})();
</script></body></html>
