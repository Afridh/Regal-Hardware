<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 · Full menu — Regal POS</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#16191c;--steel:#6b7480;--line:#e9ebee;--bg:#fbfbfa;--green:#1f8a55;--amber:#c98114}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;display:flex}
aside{width:262px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .25s}
aside.small{width:72px}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand .lg{width:38px;height:38px;flex:none;border-radius:11px;background:var(--red);color:#fff;display:grid;place-items:center;font:900 14px Archivo}
.brand b{font:800 16px Archivo;line-height:1.1;white-space:nowrap}.brand span{display:block;font:500 11.5px Inter;color:var(--steel)}
.brand button{margin-left:auto;border:0;background:none;color:var(--steel);cursor:pointer;font-size:18px}
.sf{margin:4px 14px 8px;display:flex;align-items:center;gap:8px;height:38px;border-radius:10px;background:#f2f3f5;padding:0 10px;color:var(--steel);cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden}
.sf kbd{margin-left:auto;font:700 10px Inter;border:1px solid var(--line);background:#fff;border-radius:5px;padding:1px 5px}
.nav{flex:1;overflow:auto;padding:4px 10px 10px}
.lb{font:700 10.5px Inter;letter-spacing:.12em;text-transform:uppercase;color:#9aa1a9;padding:12px 8px 6px;white-space:nowrap}
.it{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:9px;cursor:pointer;color:#3d434a;font-weight:600;white-space:nowrap}
.it:hover{background:#f4f5f6}
.it.on{background:#fdecee;color:var(--red)}
.it b{margin-left:auto;font-size:11px;min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;padding:0 6px}
.grp .gh{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;cursor:pointer;font-weight:700;white-space:nowrap}
.grp .gh:hover{background:#f4f5f6}
.grp .gh .c{margin-left:auto;color:#9aa1a9;font-size:12px;transition:transform .2s}
.grp.open .gh .c{transform:rotate(90deg)}
.grp .gh i{font-style:normal;font-size:11px;font-weight:800;color:#fff;background:var(--red);border-radius:9px;padding:1px 6px}
.grp .sub{display:none;padding:2px 0 6px 22px;border-left:2px solid var(--line);margin-left:19px}
.grp.open .sub{display:block}
.grp .sub .it{height:32px;font-weight:500}
aside.small .lb,aside.small .gh span,aside.small .gh .c,aside.small .it span,aside.small .brand div,aside.small .sf span,aside.small .sf kbd,aside.small .sub,aside.small .me div{display:none}
aside.small .it,aside.small .gh{justify-content:center;padding:0}
.me{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.me .av{width:36px;height:36px;flex:none;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 13px Archivo}
.me b{display:block;font-size:13.5px}.me span{font-size:12px;color:var(--steel)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:flex-end;gap:12px;padding:22px 30px 14px}
.top h1{font:900 34px/1 Archivo;letter-spacing:-.02em}.top p{color:var(--steel);margin-top:6px}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0 12px;font:600 13px Inter;display:flex;align-items:center;gap:6px;cursor:pointer}
.pill.red{background:var(--red);border-color:var(--red);color:#fff}
.page{flex:1;overflow:auto;padding:4px 30px 30px}
.bento{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:minmax(118px,auto);gap:12px}
.b{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;position:relative;overflow:hidden}
.b small{font:600 12px Inter;color:var(--steel)}
.b .v{font:800 26px Archivo;margin-top:6px;letter-spacing:-.01em}.b .v em{font-style:normal;font-size:14px;color:var(--steel);margin-right:4px}
.b .s{font-size:12.5px;color:var(--steel);margin-top:2px}
.b.main{grid-column:span 3;grid-row:span 2;background:var(--ink);color:#fff;border:0}
.b.main small{color:rgba(255,255,255,.6)}.b.main .v{font-size:52px;font-weight:900}.b.main .v em{color:rgba(255,255,255,.5);font-size:22px}
.b.main .s{color:rgba(255,255,255,.65)}
.b.main .chart{position:absolute;left:0;right:0;bottom:0;height:120px}
.b.main .row{display:flex;gap:26px;margin-top:14px}.b.main .row b{display:block;font:800 18px Archivo}.b.main .row span{font-size:12px;color:rgba(255,255,255,.6)}
.up{display:inline-block;margin-left:8px;background:#2ecc71;color:#0b3d22;border-radius:999px;padding:2px 8px;font:800 11px Inter;vertical-align:middle}
.b.c3{grid-column:span 3}.b.c2{grid-column:span 2}.b.c1{grid-column:span 1}
.b.alert{background:#fff5f5;border-color:#f5d0d3;cursor:pointer}.b.alert .v{color:var(--red)}
.b h4{font:800 14.5px Inter;display:flex;justify-content:space-between;margin-bottom:8px}.b h4 span{font:500 12px Inter;color:var(--steel)}
.ln{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13.5px}
.ln b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ln em{font:800 13.5px Archivo;font-style:normal}
.ln i{font-style:normal;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:#fdecee;color:var(--red)}.ln i.w{background:#fdf1dc;color:#9a5d00}
.ln .d{width:8px;height:8px;border-radius:50%;background:var(--green)}.ln .d.mid{background:var(--amber)}.ln .d.old{background:#c0442c}
.av2{display:flex;margin-top:6px}.av2 span{width:34px;height:34px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:grid;place-items:center;font:800 12px Archivo;color:#fff;background:#1f8a55}.av2 span:first-child{margin-left:0}.av2 span.late{background:var(--amber)}.av2 span.out{background:#c3c8ce}
</style></head><body>
<aside id="side">
 <div class="brand"><span class="lg">RH</span><div><b>Regal Hardware</b><span>Main shop · Kaduruwela</span></div><button onclick="side.classList.toggle('small')" title="Make the menu small">⟨</button></div>
 <div class="sf" onclick="openPal()">{S}<span>Find a page…</span><kbd>Ctrl K</kbd></div>
 <div class="nav" id="nav"></div>
 <div class="me"><span class="av">AF</span><div><b>Afridh</b><span>Super Admin · signed in 8:02 am</span></div></div>
</aside>
<main>
 <div class="top"><div><h1>Good afternoon, Afridh</h1><p>Tuesday 10 November — here is the shop so far today.</p></div>
  <div class="r"><span class="pill">All shops ▾</span><span class="pill" onclick="toast('Opens notifications')">{B} 9</span><span class="pill red" onclick="toast('Opens POS billing')">{P} New bill · F3</span></div></div>
 <div class="page" id="page"></div>
</main>
<script src="shell.js"></script>
<script>
var side = document.getElementById('side');
['.sf', '.top'].forEach(function (s) { var e = document.querySelector(s); e.innerHTML = e.innerHTML.replace('{S}', ICON('search', 16)).replace('{B}', ICON('bell', 16)).replace('{P}', ICON('plus', 15)); });
var opened = { sell: true }, page = 'Dashboard';
function nav() {
  var it = function (p, ic) { return '<div class="it ' + (p === page ? 'on' : '') + '" data-p="' + p + '">' + (ic || '') + '<span>' + p + '</span>' + (BADGE[p] ? '<b>' + BADGE[p] + '</b>' : '') + '</div>'; };
  document.getElementById('nav').innerHTML = '<div class="lb">Pinned</div>' + it('Dashboard', ICON('rep', 18)) + FAV.map(function (p) { var g = GROUPS.find(function (x) { return x.pages.indexOf(p) >= 0; }); return it(p, ICON(g.k, 18)); }).join('') +
    '<div class="lb">Everything</div>' + GROUPS.filter(function (g) { return g.k !== 'start'; }).map(function (g) {
      var b = g.pages.reduce(function (a, p) { return a + (BADGE[p] || 0); }, 0);
      return '<div class="grp ' + (opened[g.k] ? 'open' : '') + '"><div class="gh" data-g="' + g.k + '">' + ICON(g.k, 18) + '<span>' + g.n + '</span>' + (b ? '<i>' + b + '</i>' : '') + '<span class="c">›</span></div><div class="sub">' + g.pages.map(function (p) { return it(p); }).join('') + '</div></div>';
    }).join('');
}
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-g]'), p = e.target.closest('[data-p]');
  if (g) { if (side.classList.contains('small')) side.classList.remove('small'); opened[g.dataset.g] = !opened[g.dataset.g]; nav(); }
  if (p) { goPage(p.dataset.p); }
});
var D = DASH;
document.getElementById('page').innerHTML = '<div class="bento">' +
  '<div class="b main"><small>Sales so far today</small><div class="v"><em>Rs</em>' + money(D.sales) + '</div><div class="s">' + D.bills + ' bills <span class="up">▲ ' + D.vsAvg + '%</span> on the fortnight\'s average</div>' +
  '<div class="row"><div><b>' + money(D.cash) + '</b><span>cash</span></div><div><b>' + money(D.credit) + '</b><span>on credit</span></div></div><div class="chart">' + spark(400, 120, '#ff5a5f', 'rgba(255,90,95,.14)') + '</div></div>' +
  '<div class="b c3 alert" onclick="toast(\'Opens Action centre\')"><small>Waiting on you</small><div class="v">2 approvals · 1 supplier order</div><div class="s">Silva Builders over limit by Rs 12,400 · a price change · Sample Cement Ltd, 40 bags</div></div>' +
  '<div class="b c1"><small>Profit today</small><div class="v" style="font-size:20px">' + money(D.gp) + '</div><div class="s">' + D.gpPct + '% margin</div></div>' +
  '<div class="b c1"><small>Receivable</small><div class="v" style="font-size:20px">' + money(D.receivable) + '</div><div class="s">' + D.accounts + ' accounts</div></div>' +
  '<div class="b c1"><small>Payable</small><div class="v" style="font-size:20px">' + money(D.payable) + '</div><div class="s">' + D.suppliers + ' suppliers</div></div>' +
  '<div class="b c2"><h4>Where the day stands <span>4</span></h4>' + D.todo.map(function (t) { return '<div class="ln"><i class="' + (t[2] === 'wait' ? 'w' : '') + '">' + (t[2] === 'wait' ? 'waiting' : 'to do') + '</i><b>' + t[0] + '</b></div>'; }).join('') + '</div>' +
  '<div class="b c2"><h4>Who owes most <span>oldest dot</span></h4>' + D.owing.map(function (o) { return '<div class="ln"><span class="d ' + (o[2] > 60 ? 'old' : o[2] > 30 ? 'mid' : '') + '"></span><b>' + o[0] + '</b><em>' + money(o[1]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="b c2"><h4>Selling today <span>top 5</span></h4>' + D.top.map(function (t) { return '<div class="ln"><b>' + t[0] + '</b><em>' + money(t[2]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="b c3"><h4>Who is in today <span>6 of 7</span></h4><div class="av2">' + D.staff.map(function (s) { return '<span class="' + s[1] + '" title="' + s[0] + '">' + s[0].slice(0, 2).toUpperCase() + '</span>'; }).join('') + '</div><div class="s" style="margin-top:8px">Sales3 came in late · Ravi not in yet</div></div>' +
  '<div class="b c3"><h4>Cheques <span>in the drawer</span></h4><div class="v" style="font-size:22px">Rs ' + money(D.cheques) + '</div><div class="s">1 to bank today — Hill Top Builders</div></div></div>';
nav();
</script>
</body></html>
