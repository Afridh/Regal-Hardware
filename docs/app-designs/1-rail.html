<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1 · Grouped rail — Regal POS</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#AE1E2B;--ink:#1d2125;--steel:#6b7480;--line:#e7e9ec;--bg:#f4f5f7;--green:#1f8a55;--amber:#c98114}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;overflow:hidden;display:flex}
.rail{width:84px;flex:none;background:linear-gradient(180deg,#3d0a10,#22070a);color:#fff;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:2px;z-index:5}
.logo{width:46px;height:46px;border-radius:14px;background:var(--red);display:grid;place-items:center;font:900 16px Archivo;margin-bottom:12px;box-shadow:0 8px 18px -8px #000}
.g{width:72px;padding:8px 0 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;color:rgba(255,255,255,.62);font:600 10.5px Inter;position:relative;transition:background .15s,color .15s}
.g:hover{background:rgba(255,255,255,.08);color:#fff}
.g.on{background:#fff;color:var(--red)}
.g.open:not(.on){background:rgba(255,255,255,.14);color:#fff}
.g i{position:absolute;top:4px;right:12px;min-width:16px;height:16px;border-radius:9px;background:#ff5a4f;color:#fff;font:800 9.5px/16px Inter;font-style:normal;text-align:center;padding:0 4px}
.rail .sp{flex:1}
.me{width:40px;height:40px;border-radius:50%;background:var(--red);display:grid;place-items:center;font:800 14px Archivo;margin-top:6px}
.fly{position:fixed;left:84px;top:0;bottom:0;width:250px;background:#fff;box-shadow:20px 0 40px -20px rgba(0,0,0,.35);z-index:4;padding:20px 14px;transform:translateX(-12px);opacity:0;pointer-events:none;transition:.2s}
.fly.on{transform:none;opacity:1;pointer-events:auto}
.fly h3{font:800 20px Archivo;padding:0 8px 12px;display:flex;align-items:center;gap:10px;color:var(--red)}
.fly a{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;cursor:pointer}
.fly a:hover{background:#f6f2f2;color:var(--red)}
.fly a b{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 6px}
.fly .k{font-size:11.5px;color:var(--steel);padding:12px 10px 0;border-top:1px solid var(--line);margin-top:10px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font:800 22px Archivo}
.top .crumb{color:var(--steel);font-size:13px}
.find{margin-left:auto;display:flex;align-items:center;gap:10px;width:340px;height:42px;border-radius:12px;background:var(--bg);padding:0 12px;color:var(--steel);cursor:pointer;font-weight:500}
.find kbd{margin-left:auto;font:700 11px Inter;border:1px solid var(--line);background:#fff;border-radius:6px;padding:2px 6px}
.ib{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--ink);position:relative;cursor:pointer}
.ib i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font:800 10px/18px Inter;font-style:normal;text-align:center;padding:0 4px}
.on-l{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--steel)}.on-l:before{content:"";width:8px;height:8px;border-radius:50%;background:#2ecc71}
.new{height:42px;border:0;border-radius:12px;background:var(--red);color:#fff;font:700 14px Inter;padding:0 16px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 10px 20px -10px var(--red)}
.page{flex:1;overflow:auto;padding:20px 24px 30px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs span{padding:7px 14px;border-radius:999px;font-weight:600;color:var(--steel);cursor:pointer}.tabs span.on{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 0 0 1px var(--line)}
.hero{grid-column:span 8;background:linear-gradient(150deg,#2a0b10,#5a1019 55%,#AE1E2B);color:#fff;position:relative;overflow:hidden;box-shadow:0 20px 40px -24px #AE1E2B;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero small{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700;color:rgba(255,255,255,.65)}
.hero .big{font:900 46px/1.05 Archivo;letter-spacing:-.02em;margin-top:4px}.hero .big em{font-style:normal;font-size:22px;opacity:.6;margin-right:6px}
.hero .sub{color:rgba(255,255,255,.75);margin-top:4px}
.hero .two{display:flex;gap:26px;margin-top:16px}.hero .two b{display:block;font:800 19px Archivo}.hero .two span{font-size:12px;color:rgba(255,255,255,.65)}
.hero .sp{align-self:end}
.side{grid-column:span 4;display:grid;gap:14px}
.ask{display:flex;align-items:center;gap:14px;cursor:pointer}.ask .n{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:900 20px Archivo;background:#fdebec;color:var(--red)}
.ask.g2 .n{background:#e3f4ea;color:var(--green)}
.ask b{display:block}.ask span{font-size:12.5px;color:var(--steel)}
.kpi{grid-column:span 3}.kpi small{font-size:11.5px;color:var(--steel);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font:800 23px Archivo;margin-top:4px}.kpi span{font-size:12.5px;color:var(--steel)}
.kpi .bar{height:5px;border-radius:9px;background:#eef0f2;margin-top:10px;overflow:hidden}.kpi .bar i{display:block;height:100%;border-radius:9px}
.half{grid-column:span 6}.third{grid-column:span 4}
.card h4{font:800 15px Inter;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.card h4 span{font:500 12.5px Inter;color:var(--steel)}
.todo div{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.todo i{font-style:normal;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fdebec;color:var(--red)}.todo i.wait{background:#fdf1dc;color:#9a5d00}
.todo b{font-weight:700}.todo span{color:var(--steel);font-size:13px}
.ow div,.tp div{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.ow .d{width:9px;height:9px;border-radius:50%;background:var(--green)}.ow .d.mid{background:var(--amber)}.ow .d.old{background:#c0442c}
.ow b,.tp b{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ow em,.tp em{font:800 14px Archivo;font-style:normal}
.tp span{font-size:12px;color:var(--steel);width:54px;text-align:right}
.who{display:flex;flex-wrap:wrap;gap:6px}.who span{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:#e3f4ea;color:#1a6b43}.who span.late{background:#fdf1dc;color:#9a5d00}.who span.out{background:#eef0f2;color:var(--steel)}
</style></head><body>
<nav class="rail" id="rail"></nav>
<div class="fly" id="fly"></div>
<main>
 <div class="top"><div><h1>Dashboard</h1><div class="crumb">Tuesday 10 November · all shops</div></div>
  <div class="find" onclick="openPal()">{S}<span>Find a page, a bill or a customer</span><kbd>Ctrl K</kbd></div>
  <span class="on-l">2 tills online</span>
  <div class="ib" onclick="toast('Opens notifications')">{B}<i>9</i></div>
  <button class="new" onclick="toast('Opens POS billing')">{P}New bill<kbd style="font:700 10px Inter;opacity:.7">F3</kbd></button></div>
 <div class="page" id="page"></div>
</main>
<script src="shell.js"></script>
<script>
document.querySelector('.top').innerHTML = document.querySelector('.top').innerHTML.replace('{S}', ICON('search', 18)).replace('{B}', ICON('bell', 19)).replace('{P}', ICON('plus', 17));
var open = null;
function rail() {
  document.getElementById('rail').innerHTML = '<div class="logo">RH</div>' + GROUPS.map(function (g) {
    var b = g.pages.reduce(function (a, p) { return a + (BADGE[p] || 0); }, 0);
    return '<div class="g ' + (g.k === 'start' ? 'on ' : '') + (open === g.k ? 'open' : '') + '" data-g="' + g.k + '">' + ICON(g.k, 21) + g.n + (b ? '<i>' + b + '</i>' : '') + '</div>';
  }).join('') + '<div class="sp"></div><div class="me">A</div>';
}
function fly() {
  var f = document.getElementById('fly'), g = GROUPS.find(function (x) { return x.k === open; });
  if (!g) { f.className = 'fly'; return; }
  f.innerHTML = '<h3>' + ICON(g.k, 22) + g.n + '</h3>' + g.pages.map(function (p) { return '<a data-p="' + p + '">' + p + (BADGE[p] ? '<b>' + BADGE[p] + '</b>' : '') + '</a>'; }).join('') + '<div class="k">Ctrl+K finds any page by typing</div>';
  f.className = 'fly on';
}
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-g]'), p = e.target.closest('[data-p]');
  if (g) { open = open === g.dataset.g ? null : g.dataset.g; rail(); fly(); return; }
  if (p) { goPage(p.dataset.p); open = null; rail(); fly(); return; }
  if (!e.target.closest('.fly')) { if (open) { open = null; rail(); fly(); } }
});
var D = DASH, pct = function (a, b) { return Math.min(100, Math.round(a / b * 100)); };
document.getElementById('page').innerHTML = '<div class="tabs"><span class="on">All shops</span><span>Main shop</span><span>Store 2</span></div><div class="grid">' +
  '<div class="card hero"><div><small>Sales so far today</small><div class="big"><em>Rs</em>' + money(D.sales) + '</div><div class="sub">' + D.bills + ' bills · +' + D.vsAvg + '% on the fortnight\'s average</div>' +
  '<div class="two"><div><b>' + money(D.cash) + '</b><span>cash</span></div><div><b>' + money(D.credit) + '</b><span>on credit</span></div><div><b>' + money(D.gp) + '</b><span>profit · ' + D.gpPct + '%</span></div></div></div>' +
  '<div class="sp">' + spark(300, 110, '#fff', 'rgba(255,255,255,.12)') + '<div style="font-size:11.5px;color:rgba(255,255,255,.6);text-align:right">last 14 days</div></div></div>' +
  '<div class="side"><div class="card ask" onclick="toast(\'Opens Action centre\')"><span class="n">2</span><div><b>Approvals waiting on you</b><span>a credit over limit · a price change</span></div></div>' +
  '<div class="card ask g2" onclick="toast(\'Opens Supplier orders\')"><span class="n">1</span><div><b>Supplier order to answer</b><span>Sample Cement Ltd — 40 bags</span></div></div></div>' +
  [['Receivable from customers', D.receivable, D.accounts + ' accounts', '#AE1E2B', 62], ['Payable to suppliers', D.payable, D.suppliers + ' suppliers', '#24476b', 85], ['Cheques in the drawer', D.cheques, '1 to bank today', '#c98114', 20], ['Profit today', D.gp, D.gpPct + '% margin', '#1f8a55', 45]].map(function (k) {
    return '<div class="card kpi"><small>' + k[0] + '</small><b>Rs ' + money(k[1]) + '</b><span>' + k[2] + '</span><div class="bar"><i style="width:' + k[4] + '%;background:' + k[3] + '"></i></div></div>'; }).join('') +
  '<div class="card third todo"><h4>Where the day stands <span>4 to do</span></h4>' + D.todo.map(function (t) { return '<div><i class="' + t[2] + '">' + (t[2] === 'wait' ? 'waiting' : 'to do') + '</i><div><b>' + t[0] + '</b><br><span>' + t[1] + '</span></div></div>'; }).join('') + '</div>' +
  '<div class="card third ow"><h4>Who owes most <span>Rs ' + money(D.receivable) + '</span></h4>' + D.owing.map(function (o) { return '<div><span class="d ' + (o[2] > 60 ? 'old' : o[2] > 30 ? 'mid' : '') + '"></span><b>' + o[0] + '</b><em>' + money(o[1]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="card third tp"><h4>Selling today <span>top 5</span></h4>' + D.top.map(function (t) { return '<div><b>' + t[0] + '</b><span>' + t[1] + ' sold</span><em>' + money(t[2]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="card" style="grid-column:span 12"><h4>Who is in today <span>6 of 7</span></h4><div class="who">' + D.staff.map(function (s) { return '<span class="' + s[1] + '">' + s[0] + ' · ' + (s[1] === 'in' ? 'in' : s[1] === 'late' ? 'late' : 'not in yet') + '</span>'; }).join('') + '</div></div></div>';
rail();
</script>
</body></html>
