<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3 · Top bar — Regal POS</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--red:#a31d24;--ink:#1a0d0e;--cream:#f7f1e6;--mute:#6f6156;--gold:#ffcf5a;--green:#1d7a45;--line:#e6dccb}
*{box-sizing:border-box;margin:0}
body{font:500 14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:var(--cream);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{background:var(--ink);color:#fff;display:flex;align-items:center;gap:6px;padding:0 18px;height:60px;position:relative;z-index:5}
.lg{width:38px;height:38px;flex:none;border-radius:10px;background:var(--red);display:grid;place-items:center;font:900 14px Archivo;margin-right:10px}
.tab{height:60px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:13.5px;color:rgba(255,255,255,.7);font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
.tab:hover,.tab.open{color:#fff;background:rgba(255,255,255,.07)}
.tab.on{color:#fff}.tab.on:after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--gold);border-radius:3px 3px 0 0}
.tab i{font-style:normal;font-size:10px;font-weight:800;background:#ff5a4f;color:#fff;border-radius:8px;padding:1px 5px}
.r{margin-left:auto;display:flex;align-items:center;gap:8px}
.k{display:flex;align-items:center;gap:8px;height:38px;border-radius:999px;background:rgba(255,255,255,.1);padding:0 14px;color:rgba(255,255,255,.75);cursor:pointer;font-size:13px}
.k kbd{display:none;font:700 10px Inter;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:1px 5px}
.nb{white-space:nowrap;height:38px;border:0;border-radius:999px;background:var(--red);color:#fff;font:800 13px Inter;padding:0 16px;cursor:pointer}
.av{width:36px;height:36px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center;font:800 13px Archivo}
.mega{position:absolute;left:0;right:0;top:60px;background:#fff;box-shadow:0 30px 50px -30px rgba(0,0,0,.5);z-index:4;padding:22px 30px 26px;display:none;grid-template-columns:260px 1fr;gap:30px}
.mega.on{display:grid;animation:dn .2s ease-out}
@keyframes dn{from{opacity:0;transform:translateY(-8px)}}
.mega .h{font:400 40px/1 Anton,Impact;text-transform:uppercase;color:var(--red)}.mega .h small{display:block;font:500 13px Inter;color:var(--mute);text-transform:none;margin-top:8px}
.mega .ps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 16px;align-content:start}
.mega .ps a{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:12px;background:var(--cream);font-weight:700;cursor:pointer}
.mega .ps a:hover{background:var(--ink);color:#fff}
.mega .ps a b{font-size:11px;background:var(--red);color:#fff;border-radius:9px;padding:1px 7px}
.page{flex:1;overflow:auto}
.hero{background:var(--red);color:#fff;padding:26px 34px 70px;position:relative;overflow:hidden}
.hero .ey{font:700 12px Inter;letter-spacing:.2em;text-transform:uppercase;opacity:.75;display:flex;gap:12px;align-items:center}.hero .ey:before{content:"";width:34px;height:2px;background:#fff}
.hero .w{font:400 104px/0.95 Anton,Impact;text-transform:uppercase;letter-spacing:.005em;margin-top:8px}
.hero .w span{color:var(--gold)}
.hero .row{display:flex;gap:36px;margin-top:16px;align-items:flex-end}
.hero .row div b{display:block;font:400 30px Anton}.hero .row div span{font-size:12.5px;opacity:.75}
.hero .chart{position:absolute;right:30px;top:30px;width:420px;height:160px;opacity:.9}
.band{background:var(--ink);color:#fff;transform:rotate(-1.3deg);margin:-34px -10px 0;padding:14px 0;white-space:nowrap;overflow:hidden;font:400 24px Anton;letter-spacing:.03em;position:relative;z-index:2}
.band span{display:inline-block;animation:mq 26s linear infinite}.band em{font-style:normal;color:var(--gold);margin:0 18px}
@keyframes mq{to{transform:translateX(-50%)}}
.sheet{padding:30px 34px 40px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.c{border-top:3px solid var(--ink);padding-top:12px}
.c small{font:700 11px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.c .v{font:400 34px/1.1 Anton;margin-top:4px}.c .s{font-size:12.5px;color:var(--mute)}
.c.red .v{color:var(--red)}
.w2{grid-column:span 2}
.c h3{font:400 26px Anton;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}.c h3 span{font:600 12px Inter;color:var(--mute);text-transform:none}
.ln{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln .n{font:400 20px Anton;color:var(--red);width:28px}
.ln b{flex:1;font-weight:700}.ln em{font:400 19px Anton;font-style:normal}
.ln i{font-style:normal;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--ink);color:#fff}.ln i.w{background:var(--gold);color:var(--ink)}
.ask{grid-column:span 4;display:flex;gap:16px}
.ask div{flex:1;background:var(--ink);color:#fff;border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:16px;cursor:pointer}
.ask b{font:400 44px/1 Anton;color:var(--gold)}.ask span{font-weight:700}.ask small{display:block;opacity:.65;font-weight:500}
</style></head><body>
<header id="hd"></header>
<div class="mega" id="mega"></div>
<div class="page">
 <section class="hero"><div class="ey">Tuesday 10 November · all shops</div>
  <div class="w" id="w"></div>
  <div class="row" id="row"></div>
  <div class="chart" id="chart"></div></section>
 <div class="band"><span id="band"></span></div>
 <div class="sheet" id="sheet"></div>
</div>
<script src="shell.js"></script>
<script>
var open = null, D = DASH;
function hd() {
  document.getElementById('hd').innerHTML = '<span class="lg">RH</span>' + GROUPS.map(function (g) {
    var b = g.pages.reduce(function (a, p) { return a + (BADGE[p] || 0); }, 0);
    return '<div class="tab ' + (g.k === 'start' ? 'on ' : '') + (open === g.k ? 'open' : '') + '" data-g="' + g.k + '">' + ICON(g.k, 17) + g.n + (b ? '<i>' + b + '</i>' : '') + '</div>';
  }).join('') + '<div class="r"><span class="k" onclick="openPal()">' + ICON('search', 15) + 'Ctrl K<kbd>Ctrl K</kbd></span><button class="nb" onclick="toast(\'Opens POS billing\')">+ New bill</button><span class="av">AF</span></div>';
}
function mega() {
  var m = document.getElementById('mega'), g = GROUPS.find(function (x) { return x.k === open; });
  if (!g) { m.className = 'mega'; return; }
  m.innerHTML = '<div class="h">' + g.n + '<small>' + g.pages.length + ' pages · or press Ctrl+K and type</small></div><div class="ps">' + g.pages.map(function (p) { return '<a data-p="' + p + '">' + p + (BADGE[p] ? '<b>' + BADGE[p] + '</b>' : '') + '</a>'; }).join('') + '</div>';
  m.className = 'mega on';
}
document.addEventListener('click', function (e) {
  var g = e.target.closest('[data-g]'), p = e.target.closest('[data-p]');
  if (g) { open = open === g.dataset.g ? null : g.dataset.g; hd(); mega(); return; }
  if (p) { goPage(p.dataset.p); }
  if (open && !e.target.closest('.mega')) { open = null; hd(); mega(); }
});
var h = new Date().getHours();
document.getElementById('w').innerHTML = 'Rs <span>' + money(D.sales).replace(/\.\d\d$/, '') + '</span><br>sold today.';
document.getElementById('row').innerHTML = '<div><b>' + money(D.cash) + '</b><span>cash</span></div><div><b>' + money(D.credit) + '</b><span>on credit</span></div><div><b>' + D.bills + '</b><span>bills</span></div><div><b>+' + D.vsAvg + '%</b><span>on the fortnight</span></div>';
document.getElementById('chart').innerHTML = spark(420, 160, '#ffcf5a', 'rgba(255,207,90,.15)');
var bt = ['2 approvals waiting', 'Cheque to bank today', 'Ravi not in yet', 'Profit ' + D.gpPct + '%', 'Rs ' + money(D.receivable) + ' to collect'];
document.getElementById('band').innerHTML = (bt.concat(bt)).map(function (t) { return t + '<em>✦</em>'; }).join('') + (bt.concat(bt)).map(function (t) { return t + '<em>✦</em>'; }).join('');
document.getElementById('sheet').innerHTML =
  '<div class="ask"><div onclick="toast(\'Opens Action centre\')"><b>2</b><span>approvals waiting on you<small>Silva Builders over limit · a price change</small></span></div><div onclick="toast(\'Opens Supplier orders\')"><b>1</b><span>supplier order to answer<small>Sample Cement Ltd — 40 bags</small></span></div><div onclick="toast(\'Opens Cheques in\')"><b>1</b><span>cheque to bank<small>Rs 10,000.00 · Hill Top Builders</small></span></div></div>' +
  [['Profit today', D.gp, D.gpPct + '% margin', ''], ['To collect', D.receivable, D.accounts + ' customers', 'red'], ['To pay suppliers', D.payable, D.suppliers + ' suppliers', ''], ['Cheques in drawer', D.cheques, '1 to bank', '']].map(function (k) {
    return '<div class="c ' + k[3] + '"><small>' + k[0] + '</small><div class="v">' + money(k[1]) + '</div><div class="s">' + k[2] + '</div></div>'; }).join('') +
  '<div class="c w2"><h3>Who owes most <span>Rs ' + money(D.receivable) + '</span></h3>' + D.owing.map(function (o, i) { return '<div class="ln"><span class="n">0' + (i + 1) + '</span><b>' + o[0] + '</b><em>' + money(o[1]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="c w2"><h3>The day <span>4 to do</span></h3>' + D.todo.map(function (t) { return '<div class="ln"><i class="' + (t[2] === 'wait' ? 'w' : '') + '">' + (t[2] === 'wait' ? 'waiting' : 'to do') + '</i><b>' + t[0] + '</b></div>'; }).join('') + '</div>' +
  '<div class="c w2"><h3>Selling today</h3>' + D.top.map(function (t, i) { return '<div class="ln"><span class="n">0' + (i + 1) + '</span><b>' + t[0] + '</b><em>' + money(t[2]) + '</em></div>'; }).join('') + '</div>' +
  '<div class="c w2"><h3>Who is in <span>6 of 7</span></h3>' + D.staff.map(function (s) { return '<div class="ln"><b>' + s[0] + '</b><i class="' + (s[1] === 'in' ? '' : 'w') + '">' + (s[1] === 'in' ? 'in' : s[1] === 'late' ? 'late' : 'not in') + '</i></div>'; }).join('') + '</div>';
hd();
</script>
</body></html>
