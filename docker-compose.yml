# Optional: run PostgreSQL in Docker if you don't want to use a local install.
#   docker compose up -d
#   then set DATABASE_URL=postgresql://sepos:sepos@localhost:5432/sepos in server/.env
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sepos
      POSTGRES_PASSWORD: sepos
      POSTGRES_DB: sepos
    ports:
      - "5432:5432"
    volumes:
      - sepos_pgdata:/var/lib/postgresql/data
volumes:
  sepos_pgdata:
