<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#7E141D">
<title>Directors' report</title>
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* The directors' report: one live page from a private link (backend/src/routes/directors.js). */
:root{
 --ink:#201819;--steel:#5A6E72;--faint:#8C9CA0;--line:#E4E9E8;--panel:#F6F8F7;--white:#fff;
 --brand:#AE1E2B;--brand-dark:#7E141D;--brand-bright:#C62833;
 --green:#1E8A5A;--blue:#16799B;--amber:#C98A10;--rust:#C0442C;--violet:#6B4FBB;
 --tint-green:#DCF1E7;--tint-blue:#DCEEF4;--tint-amber:#FBF0D6;--tint-rust:#FBE4DE;--tint-red:#FBE4E6;
 --shadow:0 1px 2px rgba(16,30,34,.05),0 10px 30px rgba(16,30,34,.08);
 --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root{
 --ink:#F1ECEC;--steel:#A9B8BB;--faint:#7E8D90;--line:#2B3336;--panel:#171C1E;--white:#1E2427;
 --tint-green:#173328;--tint-blue:#15303A;--tint-amber:#3A2F14;--tint-rust:#3A1F19;--tint-red:#3A1B1F;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--panel);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
h1,h2,h3,.num{font-family:Archivo,system-ui,sans-serif}
/* hero */
.hero{background:radial-gradient(900px 400px at 85% -20%,rgba(255,255,255,.18),transparent 60%),linear-gradient(135deg,#4A0B11 0%,var(--brand-dark) 40%,var(--brand-bright) 100%);color:#fff;padding:22px 0 76px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -10% -60px -10%;height:120px;background:var(--panel);border-radius:50% 50% 0 0/100% 100% 0 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:40px;height:40px;border-radius:10px;background:#fff;padding:3px}
.brand b{font-family:Archivo;font-size:18px;letter-spacing:.02em;display:block}.brand small{opacity:.8}
.live{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:99px;font-size:12.5px;backdrop-filter:blur(6px)}
.dot{width:8px;height:8px;border-radius:50%;background:#5EF0A8;box-shadow:0 0 0 0 rgba(94,240,168,.7);animation:pulse 2s infinite}
.dot.off{background:#FFB4B4;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(94,240,168,.7)}70%{box-shadow:0 0 0 10px rgba(94,240,168,0)}100%{box-shadow:0 0 0 0 rgba(94,240,168,0)}}
.ranges{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.ranges button,.ranges label{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:99px;padding:7px 14px;font:600 13px 'IBM Plex Sans';cursor:pointer;transition:all .2s var(--ease)}
.ranges button:hover{background:rgba(255,255,255,.18)}.ranges button.on{background:#fff;color:var(--brand-dark);border-color:#fff}
.ranges input{background:transparent;border:0;color:#fff;font:inherit;color-scheme:dark;width:118px}
.headline{margin-top:20px;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.headline .big{font-family:Archivo;font-weight:800;font-size:clamp(36px,7vw,58px);line-height:1;letter-spacing:-.02em}
.headline .sub{opacity:.85;font-size:14px;padding-bottom:6px}
.when{opacity:.85;margin-top:6px;font-size:13px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:-56px;position:relative;z-index:2}
.tile{background:var(--white);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);position:relative;overflow:hidden;opacity:0;transform:translateY(14px);animation:rise .6s var(--ease) forwards}
.tile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--brand))}
.tile .l{color:var(--steel);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:Archivo;font-weight:800;font-size:clamp(19px,2.6vw,26px);margin-top:4px;white-space:nowrap}
.tile .s{color:var(--faint);font-size:12.5px;margin-top:2px}
@keyframes rise{to{opacity:1;transform:none}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;margin-top:14px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);opacity:0;transform:translateY(14px);animation:rise .7s var(--ease) forwards;min-width:0}
.card h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}.card h2 i{font-style:normal;width:26px;height:26px;border-radius:8px;display:inline-grid;place-items:center;background:var(--tint-red);font-size:14px}
.card .hint{color:var(--faint);font-size:12.5px;margin-bottom:12px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
/* chart */
.chart{width:100%;height:auto;display:block}
.chart .area{fill:url(#g1);opacity:0;animation:fade .9s .3s forwards}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:3000;stroke-dashoffset:3000;animation:draw 1.6s var(--ease) forwards}
.chart .gl{stroke:var(--line);stroke-width:1}.chart text{fill:var(--faint);font-size:10.5px;font-family:'IBM Plex Sans'}
.chart .pt{fill:var(--white);stroke:var(--brand);stroke-width:2;opacity:0;animation:fade .4s 1.2s forwards}
.chart .bar{fill:var(--brand);opacity:.85;transform-origin:bottom;transform-box:fill-box;transform:scaleY(0);animation:grow .9s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}@keyframes grow{to{transform:scaleY(1)}}
/* donut */
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:none}.donut circle{fill:none;stroke-width:18;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dasharray 1.2s var(--ease)}
.legend{display:flex;flex-direction:column;gap:7px;flex:1;min-width:150px}.legend div{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;color:var(--steel);white-space:nowrap}.legend b{font-weight:600;white-space:nowrap}
/* bars */
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.row .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .n small{color:var(--faint);margin-left:6px}.row .a{font-weight:600;text-align:right;white-space:nowrap}
.row .t{grid-column:1/-1;height:7px;background:var(--panel);border-radius:99px;overflow:hidden}
.row .t i{display:block;height:100%;width:0;border-radius:99px;background:var(--c,var(--brand));transition:width 1.1s var(--ease)}
.age{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--panel);margin:6px 0 10px}.age i{display:block;width:0;transition:width 1.2s var(--ease)}
.agel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}.agel div{background:var(--panel);border-radius:10px;padding:7px 9px}.agel span{display:block;color:var(--faint)}.agel b{font-size:13px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span{color:var(--steel)}.kv b{font-weight:600}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px}.pill.g{background:var(--tint-green);color:var(--green)}.pill.r{background:var(--tint-rust);color:var(--rust)}.pill.a{background:var(--tint-amber);color:var(--amber)}
.list{font-size:13px}.list .it{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}.list .it:last-child{border:0}.list small{color:var(--faint);display:block}
.empty{color:var(--faint);padding:10px 0;font-size:13px}
.foot{text-align:center;color:var(--faint);font-size:12px;margin-top:22px}
.foot button{border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:99px;padding:7px 14px;font:600 12.5px 'IBM Plex Sans';cursor:pointer;margin:0 4px}
.shut{max-width:440px;margin:80px auto;text-align:center;padding:30px;background:var(--white);border-radius:16px;box-shadow:var(--shadow)}
/* the sign-in */
.login{max-width:400px;margin:-80px auto 0;position:relative;z-index:2;background:var(--white);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:26px 24px 20px;animation:rise .6s var(--ease) both;opacity:0;transform:translateY(14px)}
.login .lock{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--tint-red);margin:-52px auto 10px;box-shadow:var(--shadow)}
.login h2{text-align:center;margin:0 0 4px;font-size:21px}.login p{text-align:center;color:var(--steel);margin:0 0 16px;font-size:13.5px}
.login label{display:block;font-weight:600;font-size:12.5px;color:var(--steel);margin:10px 0 0}.login label small{font-weight:400;color:var(--faint)}
.login input{display:block;width:100%;margin-top:5px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);font:600 18px Archivo,sans-serif;letter-spacing:.12em;outline:none;transition:border-color .2s}
.login input:focus{border-color:var(--brand);background:var(--white)}
.login .lmsg{min-height:20px;color:var(--rust);font-size:13px;margin-top:10px;text-align:center}
.login .lgo{display:block;width:100%;margin-top:6px;border:0;border-radius:12px;padding:14px;font:700 15px 'IBM Plex Sans';color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--brand-dark),var(--brand-bright));box-shadow:0 8px 20px rgba(174,30,43,.3)}
.login .lgo:disabled{opacity:.6}.login .lhelp{text-align:center;color:var(--faint);font-size:12px;margin-top:12px}
.login.shake{animation:shake .4s;opacity:1;transform:none}@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--panel),var(--line),var(--panel));background-size:200% 100%;animation:sk 1.2s infinite;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
@media (max-width:420px){.tile .v{font-size:19px}.agel{grid-template-columns:repeat(2,1fr)}}
.quiet .tile,.quiet .card{animation:none;opacity:1;transform:none}.quiet .chart .ln{animation:none;stroke-dashoffset:0}.quiet .chart .area,.quiet .chart .pt{animation:none;opacity:1}.quiet .chart .bar{animation:none;transform:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{.ranges,.foot button,.live{display:none!important}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card,.tile{opacity:1!important;transform:none!important;animation:none!important;break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="hero"><div class="wrap"><div class="skel" style="width:40%;opacity:.3"></div><div class="skel" style="width:60%;height:40px;opacity:.3"></div></div></div></div>
<script>
(function(){
  const qs = new URLSearchParams(location.search);
  const K = qs.get('k') || '';
  let range = qs.get('r') || 'today', from = qs.get('from') || '', to = qs.get('to') || '';
  let last = null, timer = null, failed = 0;
  const app = document.getElementById('app');
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  const rs = (n, d = 0) => 'Rs ' + (+n || 0).toLocaleString('en-LK', { minimumFractionDigits: d, maximumFractionDigits: d });
  const short = n => { n = +n || 0; const a = Math.abs(n); return a >= 1e6 ? (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M' : a >= 1e3 ? (n / 1e3).toFixed(a >= 1e5 ? 0 : 1) + 'k' : String(Math.round(n)); };
  const RANGES = [['today', 'Today'], ['yesterday', 'Yesterday'], ['week', 'Last 7 days'], ['month', 'This month'], ['lastmonth', 'Last month']];
  const nice = d => new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });

  /* numbers count up to their value (from what they showed before, on a refresh) */
  function countUp(el, to, fmt, ms = 1100) {
    const from = +el.dataset.v || 0; el.dataset.v = to;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = fmt(to); return; }
    const t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  const num = (v, fmt = 'rs', cls = '') => `<span class="num ${cls}" data-to="${+v || 0}" data-f="${fmt}">${fmt === 'rs' ? 'Rs 0' : '0'}</span>`;
  const FMT = { rs: v => rs(v), n: v => Math.round(v).toLocaleString('en-LK'), pct: v => v.toFixed(1) + '%' };

  function trend(days, hours, single) {
    const pts = single ? hours.map(x => ({ k: x.h + ':00', v: x.v })) : days.map(x => ({ k: x.d.slice(8) + '/' + x.d.slice(5, 7), v: x.v }));
    if (!pts.length || pts.every(p => !p.v)) return '<div class="empty">No sales in this time yet.</div>';
    const W = 640, H = 220, pl = 46, pr = 10, pt = 14, pb = 26, max = Math.max(...pts.map(p => p.v), 1);
    const x = i => pl + (pts.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1)), y = v => pt + (H - pt - pb) * (1 - v / max);
    const grid = [0, .25, .5, .75, 1].map(f => `<line class="gl" x1="${pl}" x2="${W - pr}" y1="${y(max * f)}" y2="${y(max * f)}"/><text x="${pl - 6}" y="${y(max * f) + 3}" text-anchor="end">${short(max * f)}</text>`).join('');
    const every = Math.ceil(pts.length / 8);
    const labels = pts.map((p, i) => i % every === 0 || i === pts.length - 1 ? `<text x="${x(i)}" y="${H - 6}" text-anchor="middle">${p.k}</text>` : '').join('');
    if (single || pts.length <= 2) {   // a day: by the hour, as bars
      // bars sit in slots of their own, clear of the figures up the side
      const slot = (W - pl - pr) / pts.length, bx = i => pl + slot * (i + .5), bw = Math.max(6, slot * .62);
      return `<svg class="chart" viewBox="0 0 ${W} ${H}" >${grid}${pts.map((p, i) => `<rect class="bar" style="animation-delay:${i * 40}ms" x="${bx(i) - bw / 2}" y="${y(p.v)}" width="${bw}" height="${Math.max(0, H - pb - y(p.v))}" rx="3"><title>${p.k} · ${rs(p.v)}</title></rect>`).join('')}${pts.map((p, i) => i % every === 0 || i === pts.length - 1 ? `<text x="${bx(i)}" y="${H - 6}" text-anchor="middle">${p.k}</text>` : '').join('')}</svg>`;
    }
    const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
    const area = line + ` L${x(pts.length - 1)},${H - pb} L${x(0)},${H - pb} Z`;
    return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C62833" stop-opacity=".35"/><stop offset="1" stop-color="#C62833" stop-opacity="0"/></linearGradient></defs>
      ${grid}<path class="area" d="${area}"/><path class="ln" d="${line}"/>${pts.map((p, i) => `<circle class="pt" cx="${x(i)}" cy="${y(p.v)}" r="3"><title>${p.k} · ${rs(p.v)}</title></circle>`).join('')}${labels}</svg>`;
  }
  function donut(parts) {
    const tot = parts.reduce((a, p) => a + p.v, 0);
    if (!tot) return '<div class="empty">Nothing taken yet.</div>';
    const C = 2 * Math.PI * 56; let off = 0;
    const rings = parts.filter(p => p.v > 0).map(p => { const len = p.v / tot * C, s = `<circle cx="75" cy="75" r="56" stroke="${p.c}" data-len="${len}" stroke-dasharray="0 ${C}" stroke-dashoffset="${-off}"/>`; off += len; return s; }).join('');
    return `<div class="donut"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="56" stroke="var(--panel)"/>${rings}
      <text x="75" y="72" text-anchor="middle" style="font:800 15px Archivo;fill:var(--ink)">${short(tot)}</text><text x="75" y="90" text-anchor="middle" style="font:11px 'IBM Plex Sans';fill:var(--faint)">total</text></svg>
      <div class="legend">${parts.map(p => `<div><i style="background:${p.c}"></i><span>${p.k}</span><b>${rs(p.v)}</b><small style="color:var(--faint);width:40px;text-align:right">${tot ? Math.round(p.v / tot * 100) : 0}%</small></div>`).join('')}</div></div>`;
  }
  const bars = (rows, val, label, sub, color) => {
    if (!rows.length) return '<div class="empty">Nothing to show.</div>';
    const max = Math.max(...rows.map(val), 1);
    return `<div class="rows">${rows.map(r => `<div class="row" style="--c:${color}"><div class="n">${esc(label(r))}${sub ? `<small>${esc(sub(r))}</small>` : ''}</div><div class="a">${rs(val(r))}</div><div class="t"><i data-w="${val(r) / max * 100}"></i></div></div>`).join('')}</div>`;
  };
  const tile = (l, v, s, c, i, f = 'rs') => `<div class="tile" style="--c:${c};animation-delay:${i * 70}ms"><div class="l">${l}</div><div class="v">${num(v, f)}</div><div class="s">${s}</div></div>`;

  function draw(d, quiet) {
    // a refresh in the background: the figures move on from what they showed, nothing slides in again
    const old = [...app.querySelectorAll('.num')].map(e => +e.dataset.v || 0);
    app.classList.toggle('quiet', !!quiet);
    const one = d.from === d.to, S = d.sales, M = d.money;
    const when = one ? nice(d.from) : `${nice(d.from)} — ${nice(d.to)}`;
    const ageT = d.customers.age.reduce((a, b) => a + b, 0) || 1;
    const AC = ['#1E8A5A', '#C98A10', '#C0442C', '#7E141D'];
    app.innerHTML = `
    <div class="hero"><div class="wrap">
      <div class="top"><div class="brand"><img src="/regal-logo.png" alt=""><div><b>${esc(d.shop.name)}</b><small>Directors' report${d.who ? ' · for ' + esc(d.who) : ''}</small></div></div>
        <div class="live"><span class="dot" id="dot"></span><span id="liveT">Live · updated ${esc(d.at.slice(11))}</span></div></div>
      <div class="ranges">${RANGES.map(r => `<button data-r="${r[0]}" class="${range === r[0] ? 'on' : ''}">${r[1]}</button>`).join('')}
        <label title="Pick the days">📅 <input type="date" id="f" value="${range === 'custom' ? esc(d.from) : ''}" max="${esc(d.to)}"> – <input type="date" id="t" value="${range === 'custom' ? esc(d.to) : ''}"></label></div>
      <div class="headline"><div class="big">${num(S.total)}</div><div class="sub">sales · ${num(S.bills, 'n')} bills${S.profit != null ? ` · profit ${num(S.profit)} (${S.margin}%)` : ''}</div></div>
      <div class="when">${when}${one && d.from === d.to ? (d.dayEnd.closed ? ` · <span class="pill g">day closed${Math.abs(d.dayEnd.diff) > 0.005 ? ' · drawer ' + rs(Math.abs(d.dayEnd.diff), 2) + (d.dayEnd.diff > 0 ? ' over' : ' short') : ', drawer agreed'}</span>` : ' · <span class="pill a">day not closed yet</span>') : ''}</div>
    </div></div>
    <div class="wrap">
      <div class="tiles">
        ${tile('Collected from customers', M.collected.total, 'payments on credit bills', 'var(--green)', 0)}
        ${tile('Customers owe us', d.customers.total, `${d.customers.count} customers${d.customers.overLimit ? ' · ' + d.customers.overLimit + ' over limit' : ''}`, 'var(--amber)', 1)}
        ${tile('We owe suppliers', d.suppliers.total, `${d.suppliers.count} suppliers${d.suppliers.overdue > 0.5 ? ' · ' + rs(d.suppliers.overdue) + ' past due' : ''}`, 'var(--rust)', 2)}
        ${tile('Cash & banks', d.cash.total, 'drawer, petty cash and banks now', 'var(--blue)', 3)}
      </div>
      <div class="grid">
        <div class="card c8" style="animation-delay:.15s"><h2><i>📈</i>${one ? 'Sales through the day' : 'Sales day by day'}</h2><div class="hint">${one ? 'by the hour' : 'each day in this time'} · average bill ${rs(S.avg)}</div>${trend(S.days, S.hours, one)}</div>
        <div class="card c4" style="animation-delay:.2s"><h2><i>💳</i>How it was paid</h2><div class="hint">the sales above, by how the money came</div>
          ${donut([{ k: 'Cash', v: S.cash, c: '#1E8A5A' }, { k: 'Card', v: S.card, c: '#16799B' }, { k: 'Bank transfer', v: S.bank, c: '#6B4FBB' }, { k: 'Cheque', v: S.cheque, c: '#C98A10' }, { k: 'On credit', v: S.credit, c: '#C0442C' }])}</div>
        <div class="card c6" style="animation-delay:.25s"><h2><i>🏆</i>Best sellers</h2><div class="hint">by value</div>${bars(d.topItems, r => r.value, r => r.name, r => (+r.qty).toLocaleString('en-LK') + ' ' + (r.unit || ''), 'var(--brand)')}</div>
        <div class="card c6" style="animation-delay:.3s"><h2><i>🗂</i>By category</h2><div class="hint">where the sales came from</div>${bars(d.topCats, r => r.value, r => r.name, null, 'var(--violet)')}
          <h2 style="margin-top:16px"><i>👤</i>By salesperson</h2><div class="hint">sales and bills</div>${bars(d.sellers, r => r.value, r => r.name, r => r.bills + ' bills', 'var(--blue)')}</div>
        <div class="card c6" style="animation-delay:.35s"><h2><i>🧾</i>Customers who owe</h2><div class="hint">now · ${rs(d.customers.total)} from ${d.customers.count}</div>
          <div class="age">${d.customers.age.map((v, i) => `<i data-w="${v / ageT * 100}" style="background:${AC[i]}" title="${rs(v)}"></i>`).join('')}</div>
          <div class="agel">${['Up to 30 days', '31–60 days', '61–90 days', 'Over 90 days'].map((k, i) => `<div><span><i style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${AC[i]}"></i> ${k}</span><b>${rs(d.customers.age[i])}</b></div>`).join('')}</div>
          <div style="margin-top:12px">${bars(d.customers.top, r => r.owes, r => r.name, r => `${r.oldest} days${r.cat ? ' · ' + r.cat : ''}`, 'var(--amber)')}</div></div>
        <div class="card c6" style="animation-delay:.4s"><h2><i>🏭</i>Suppliers we owe</h2><div class="hint">now · ${rs(d.suppliers.total)} to ${d.suppliers.count}${d.suppliers.overdue > 0.5 ? ` · <span class="pill r">${rs(d.suppliers.overdue)} past due</span>` : ''}</div>
          ${bars(d.suppliers.top, r => r.owed, r => r.name, r => `${r.bills} bill${r.bills === 1 ? '' : 's'} · oldest ${r.oldest} days${r.overdue > 0.5 ? ' · ' + rs(r.overdue) + ' due' : ''}`, 'var(--rust)')}</div>
        <div class="card c4" style="animation-delay:.45s"><h2><i>💰</i>Money in and out</h2><div class="hint">in this time</div>
          <div class="kv"><span>Collected from customers</span><b>${rs(M.collected.total)}</b></div>
          <div class="kv"><span style="padding-left:12px">cash · card · bank · cheque</span><b style="font-weight:400;color:var(--steel);font-size:12px">${short(M.collected.cash)} · ${short(M.collected.card)} · ${short(M.collected.bank)} · ${short(M.collected.cheque)}</b></div>
          <div class="kv"><span>Paid to suppliers</span><b>${rs(M.paidSuppliers)}</b></div>
          <div class="kv"><span>Goods bought in</span><b>${rs(M.bought)}</b></div>
          <div class="kv"><span>Expenses</span><b>${rs(M.expenses)}</b></div>
          <div class="kv"><span>Returns given back</span><b>${rs(S.returns)}</b></div>
          <div class="kv"><span>Discounts given</span><b>${rs(S.discounts)}</b></div></div>
        <div class="card c4" style="animation-delay:.5s"><h2><i>🏦</i>Cash &amp; banks</h2><div class="hint">balances now</div>
          <div class="kv"><span>Cash in the drawer</span><b>${rs(d.cash.drawer)}</b></div>${d.cash.petty ? `<div class="kv"><span>Petty cash with staff</span><b>${rs(d.cash.petty)}</b></div>` : ''}
          ${d.cash.banks.map(b => `<div class="kv"><span>${esc(b.name)}</span><b>${rs(b.bal)}</b></div>`).join('')}
          <div class="kv"><span><b>Together</b></span><b>${rs(d.cash.total)}</b></div>
          ${M.expByCat.length ? `<h2 style="margin-top:14px"><i>🧮</i>Expenses</h2><div class="hint">by kind</div>${bars(M.expByCat, r => r.value, r => r.name, null, 'var(--steel)')}` : ''}</div>
        <div class="card c4" style="animation-delay:.55s"><h2><i>🖊</i>Cheques</h2><div class="hint">now</div>
          <div class="kv"><span>In hand, to bank</span><b>${rs(d.cheques.inHand)} <small style="color:var(--faint)">(${d.cheques.inHandN})</small></b></div>
          <div class="kv"><span>Ours, still to clear</span><b>${rs(d.cheques.toClear)} <small style="color:var(--faint)">(${d.cheques.toClearN})</small></b></div>
          <div class="list" style="margin-top:8px">${d.cheques.nextIn.map(c => `<div class="it"><div>${esc(c.who || 'Customer')} <small>#${esc(c.no)} · ${esc(c.bank)} · ${esc(c.date)}</small></div><b style="color:var(--green)">+${rs(c.amount)}</b></div>`).join('')}
            ${d.cheques.nextOut.map(c => `<div class="it"><div>${esc(c.who || 'Supplier')} <small>#${esc(c.no)} · ${esc(c.bank)} · ${esc(c.date)}</small></div><b style="color:var(--rust)">−${rs(c.amount)}</b></div>`).join('')}
            ${!d.cheques.nextIn.length && !d.cheques.nextOut.length ? '<div class="empty">None falling due in the next 7 days.</div>' : ''}</div>
          <h2 style="margin-top:14px"><i>📦</i>Stock</h2>
          <div class="kv"><span>Stock at cost</span><b>${rs(d.stock.value)}</b></div>
          <div class="kv"><span>Items</span><b>${d.stock.items.toLocaleString('en-LK')}${d.stock.low ? ` · <span class="pill a">${d.stock.low} low</span>` : ''}</b></div></div>
      </div>
      <div class="foot"><button id="pr">🖨 Print / save as PDF</button><button id="rf">⟳ Refresh now</button><button id="so">🔒 Sign out</button>
        <div style="margin-top:10px">Keeps itself up to date every minute while it is open · this link is for ${d.who ? esc(d.who) + ' — please keep it to yourself' : 'directors only'}</div></div>
    </div>`;
    // the moving parts: numbers count up, bars and rings fill
    app.querySelectorAll('.num').forEach((el, i) => { if (quiet && old[i] !== undefined) el.dataset.v = old[i]; countUp(el, +el.dataset.to, FMT[el.dataset.f] || FMT.rs, quiet ? 800 : 1100); });
    requestAnimationFrame(() => setTimeout(() => {
      app.querySelectorAll('[data-w]').forEach(el => el.style.width = Math.max(0, Math.min(100, +el.dataset.w)) + '%');
      app.querySelectorAll('.donut circle[data-len]').forEach(el => { const C = 2 * Math.PI * 56; el.style.strokeDasharray = `${el.dataset.len} ${C}`; });
    }, 60));
    app.querySelectorAll('.ranges button').forEach(b => b.onclick = () => { range = b.dataset.r; from = to = ''; keep(); load(true); });
    const f = document.getElementById('f'), t = document.getElementById('t');
    const pick = () => { if (f.value && t.value) { range = 'custom'; from = f.value; to = t.value; keep(); load(true); } };
    f.onchange = pick; t.onchange = pick;
    document.getElementById('pr').onclick = () => window.print();
    document.getElementById('rf').onclick = () => load(true);
    document.getElementById('so').onclick = () => { store.set(TK, ''); signIn('Signed out.'); };
  }
  function keep() { const u = new URL(location.href); u.searchParams.set('r', range); if (range === 'custom') { u.searchParams.set('from', from); u.searchParams.set('to', to); } else { u.searchParams.delete('from'); u.searchParams.delete('to'); } history.replaceState(null, '', u); }
  function shut(msg) { app.innerHTML = `<div class="shut"><img src="/regal-logo.png" alt="" style="width:56px;border-radius:12px"><h2 style="font-family:Archivo">Directors' report</h2><p style="color:var(--steel)">${esc(msg)}</p></div>`; }

  /* ---- signing in: the user code from the shop's message, and their own PIN (made the first time) ----
     The sign-in is kept on this device for 12 hours; Sign out ends it. */
  const TK = 'dirTok:' + K, CK = 'dirCode:' + K;
  const store = { get: k => { try { return localStorage.getItem(k) || '' } catch (e) { return '' } }, set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k) } catch (e) {} } };
  let signing = false;
  async function signIn(note) {
    if (signing) return; signing = true; clearInterval(timer); timer = null; last = null;
    let h = {};
    try { const r = await fetch('/api/directors/hello?k=' + encodeURIComponent(K), { cache: 'no-store' }); h = await r.json().catch(() => ({}));
      if (r.status === 403) { signing = false; return shut(h.error || 'This link is not open any more — ask the shop for a new one.'); }
      if (!r.ok) throw new Error(); }
    catch (e) { signing = false; return shut('Could not reach the shop just now. Check the internet and open the link again.'); }
    const first = !h.hasPin, nm = String(h.name || '').replace(/^(mr|mrs|ms|miss|dr|rev|eng|hon)\.?\s+/i, '').split(' ')[0];   // the name, not the title
    app.innerHTML = `<div class="hero" style="padding-bottom:110px"><div class="wrap"><div class="brand"><img src="/regal-logo.png" alt=""><div><b>${esc(h.shop)}</b><small>Directors' report</small></div></div></div></div>
     <div class="wrap"><form class="login" id="lg" autocomplete="off">
      <div class="lock">🔒</div>
      <h2>${first ? `Welcome${nm ? ', ' + esc(nm) : ''}` : `Hello${nm ? ' ' + esc(nm) : ''}`}</h2>
      <p>${first ? 'Type the user code from the shop\'s message, then make a PIN of your own. You will use the two to open the report from now on.' : 'Your user code and PIN, to see the figures.'}</p>
      <label>User code<input id="lc" value="${esc(store.get(CK))}" placeholder="e.g. RH-7KQ2" autocapitalize="characters" spellcheck="false"></label>
      <label>${first ? 'Make a PIN' : 'PIN'} <small>${first ? '4 to 6 numbers' : ''}</small><input id="lp" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></label>
      ${first ? '<label>The same PIN again<input id="lp2" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></label>' : ''}
      <div class="lmsg" id="lm">${esc(note || '')}</div>
      <button class="lgo" id="lb">${first ? 'Make my PIN and open the report' : 'Open the report'}</button>
      <div class="lhelp">${first ? 'Keep the PIN to yourself — the shop does not know it.' : 'Forgotten the PIN? Ask the shop to reset it, then make a new one.'}</div>
     </form></div>`;
    const g = id => document.getElementById(id);
    (g('lc').value ? g('lp') : g('lc')).focus();
    g('lg').onsubmit = async ev => {
      ev.preventDefault(); const b = g('lb'); b.disabled = true; g('lm').textContent = '';
      try {
        const r = await fetch('/api/directors/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ k: K, code: g('lc').value, pin: g('lp').value, pin2: g('lp2') ? g('lp2').value : undefined }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok || !j.token) throw new Error(j.error || 'Could not sign in');
        store.set(TK, j.token); store.set(CK, g('lc').value.trim().toUpperCase());
        signing = false; app.innerHTML = ''; await load(true); startLive();
      } catch (e) { g('lm').textContent = e.message; b.disabled = false; const f = g('lp'); f.value = ''; if (g('lp2')) g('lp2').value = ''; f.focus();
        g('lg').classList.remove('shake'); void g('lg').offsetWidth; g('lg').classList.add('shake'); }
    };
  }

  async function load(fresh) {
    if (!K) return shut('This page opens from the link the shop sends you.');
    if (!store.get(TK)) return signIn();
    const u = `/api/directors/report?k=${encodeURIComponent(K)}&range=${range}${range === 'custom' ? `&from=${from}&to=${to}` : ''}`;
    try {
      const r = await fetch(u, { cache: 'no-store', headers: { Authorization: 'Bearer ' + store.get(TK) } }); const j = await r.json().catch(() => ({}));
      if (r.status === 403) return shut(j.error || 'This link is not open any more — ask the shop for a new one.');
      if (r.status === 401) { store.set(TK, ''); return signIn(last ? 'Your sign-in ran out — please sign in again.' : ''); }
      if (!r.ok || !j.ok) throw new Error(j.error || r.status);
      failed = 0;
      if (fresh || !last || JSON.stringify(j) !== JSON.stringify(last)) {
        if (last && !fresh) { const y = scrollY; draw(j, true); scrollTo(0, y); }   // a quiet refresh: keep the page, let the figures move
        else draw(j);
      } else { const lt = document.getElementById('liveT'); if (lt) lt.textContent = 'Live · updated ' + j.at.slice(11); }
      last = j;
    } catch (e) {
      failed++; const dot = document.getElementById('dot'), lt = document.getElementById('liveT');
      if (dot) dot.classList.add('off'); if (lt) lt.textContent = 'Could not reach the shop — trying again';
      if (!last) shut('Could not reach the shop just now. Check the internet and open the link again.');
    }
  }
  // live: every minute while it is on the screen, and at once when it comes back to the front
  function startLive() { clearInterval(timer); timer = setInterval(() => { if (!document.hidden && !signing) load(false); }, 60000); }
  load(true).then(() => { if (!signing) startLive(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !signing && store.get(TK)) load(false); });
})();
</script>
</body>
</html>
