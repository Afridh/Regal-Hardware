<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1719">
<title>Your bill</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/bill-print.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Sinhala:wght@600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101E22;--ink2:#0B1719;--steel:#5A6E72;--faint:#8C9CA0;--page:#EEF2F1;--white:#fff;
  --line:#D8DEDD;--line2:#EAEEED;--amber:#F0A81E;--amber2:#E0900A;--teal:#1FA39A;--green:#1E8A5A;--rust:#C0442C;
  --spring:cubic-bezier(.2,1.25,.35,1);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit}

/* ---------- the shop, across the top ---------- */
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 0% 0%,#17343A 0%,var(--ink2) 55%,#081113 100%);
  color:#fff;padding:26px 0 74px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.13;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:28px 28px;-webkit-mask-image:radial-gradient(80% 90% at 70% 0%,#000,transparent 75%);mask-image:radial-gradient(80% 90% at 70% 0%,#000,transparent 75%)}
.blob{position:absolute;z-index:-1;border-radius:50%;filter:blur(46px);opacity:.55;animation:drift 14s ease-in-out infinite alternate}
.blob.a{width:260px;height:260px;background:var(--amber);right:-70px;top:-90px}
.blob.b{width:220px;height:220px;background:var(--teal);left:-80px;bottom:-110px;animation-duration:17s;animation-delay:-5s;opacity:.4}
.blob.c{width:140px;height:140px;background:#F25F3A;right:30%;bottom:-70px;animation-duration:11s;opacity:.28}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-30px,24px) scale(1.12)}100%{transform:translate(18px,-14px) scale(.94)}}
.brand{display:flex;align-items:center;gap:14px;animation:fadeDown .7s var(--ease) both}
.logo{position:relative;width:64px;height:64px;flex:0 0 64px;border-radius:18px;background:#fff;overflow:hidden;
  display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.12);animation:pop .8s var(--spring) .1s both}
.logo img{width:100%;height:100%;object-fit:contain;padding:6px}
.logo .ini{font:800 22px Archivo,sans-serif;color:var(--ink);background:linear-gradient(145deg,#FFD271,var(--amber));width:100%;height:100%;display:grid;place-items:center}
.logo::after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);
  transform:translateX(-120%);animation:shine 4.5s ease-in-out 1.2s infinite}
@keyframes shine{0%,70%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}
.bname b{display:block;font:800 21px/1.15 Archivo,sans-serif;letter-spacing:.02em}
.bname .si{display:block;font:600 13.5px 'Noto Sans Sinhala',sans-serif;color:#FFD27A;margin-top:2px}
.bname small{display:block;font-size:12px;color:#9FB4B7;margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;animation:fadeDown .7s var(--ease) .15s both}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:#E6EEEF;text-decoration:none;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 11px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .2s,transform .2s}
.chip:active{transform:scale(.96)} .chip:hover{background:rgba(255,255,255,.16)}
.chip svg{width:14px;height:14px;flex:0 0 14px;opacity:.9}
.hi{margin-top:18px;font-size:14px;color:#CFDADB;animation:fadeDown .7s var(--ease) .25s both}
.hi b{color:#fff}

/* ---------- the bill ---------- */
.receipt{position:relative;margin-top:-52px;background:var(--white);border-radius:20px 20px 0 0;padding:20px 18px 26px;
  box-shadow:0 24px 50px -18px rgba(16,30,34,.35),0 2px 6px rgba(16,30,34,.06);animation:rise .9s var(--spring) .2s both}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;
  background:radial-gradient(circle at 10px 12px,transparent 6px,var(--white) 6.5px) 0 0/20px 12px repeat-x}
@keyframes rise{from{opacity:0;transform:translateY(60px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}100%{opacity:1;transform:none}}
.rtop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rno{font:800 13px Archivo,sans-serif;letter-spacing:.12em;color:var(--steel);text-transform:uppercase}
.rno b{display:block;font-size:22px;letter-spacing:.02em;color:var(--ink);text-transform:none}
.when{font-size:12.5px;color:var(--steel);margin-top:2px}
.stamp{flex:0 0 auto;font:800 13px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;padding:7px 12px;border-radius:8px;
  border:2.5px solid currentColor;transform:rotate(-8deg);animation:stamp .55s cubic-bezier(.3,1.6,.5,1) 1.05s both;white-space:nowrap}
.stamp.paid{color:var(--green);background:rgba(30,138,90,.06)}
.stamp.due{color:var(--rust);background:rgba(192,68,44,.06)}
.stamp.acc{color:#A86C00;background:rgba(240,168,30,.08)}
@keyframes stamp{0%{opacity:0;transform:rotate(-24deg) scale(2.6)}70%{opacity:1;transform:rotate(-6deg) scale(.92)}100%{opacity:1;transform:rotate(-8deg) scale(1)}}
.grand{margin:18px -18px 4px;padding:18px;background:linear-gradient(135deg,#FFF8E8,#FFF1D2);border-top:1px dashed #F0D39A;border-bottom:1px dashed #F0D39A;text-align:center}
.grand .lbl{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8A6A1F;font-weight:700}
.grand .amt{font:800 38px/1.1 Archivo,sans-serif;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.grand .amt small{font-size:18px;font-weight:700;margin-right:4px;color:#8A6A1F}
.saved{display:inline-flex;align-items:center;gap:6px;margin-top:10px;padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;color:#0F5E3A;
  background:linear-gradient(90deg,#D3F3E3,#EFFFF6,#D3F3E3);background-size:200% 100%;animation:fadeUp .6s var(--ease) 1.5s both,sheen 2.6s linear 2.1s infinite}
@keyframes sheen{to{background-position:-200% 0}}
.items{margin-top:14px}
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);animation:fadeUp .5s var(--ease) both;animation-delay:calc(.55s + var(--i) * 60ms)}
.item:last-child{border-bottom:0}
.item .q{flex:0 0 34px;height:34px;border-radius:10px;background:var(--page);display:grid;place-items:center;font:700 12.5px Archivo,sans-serif;color:var(--steel)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.item .sub{font-size:12px;color:var(--faint);margin-top:2px}
.item .sub s{margin-left:4px}
.item .am{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.item.ret .nm b,.item.ret .am{color:#9F1239}
.rtag{background:#FFE4E6;color:#9F1239;border-radius:999px;font-size:10px;padding:1px 7px;margin-left:5px;font-weight:600;vertical-align:1px}
.tots{margin-top:8px;padding-top:10px;border-top:1.5px solid var(--line)}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--steel)}
.tot b{color:var(--ink);font-variant-numeric:tabular-nums}
.tot.due b{color:var(--rust)} .tot.ok b{color:var(--green)}
.by{margin-top:12px;font-size:12px;color:var(--faint);text-align:center}

/* ---------- what to do with it ---------- */
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:30px;animation:fadeUp .6s var(--ease) .9s both}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--white);border:1px solid var(--line);
  text-decoration:none;color:var(--ink);font-size:12px;font-weight:600;cursor:pointer;transition:transform .2s var(--spring),box-shadow .2s}
.act:hover{transform:translateY(-2px);box-shadow:0 8px 18px -8px rgba(16,30,34,.3)} .act:active{transform:scale(.95)}
.act i{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--page)}
.act i svg{width:19px;height:19px}
.act.main i{background:var(--amber);color:var(--ink)}
.act[disabled]{opacity:.6;pointer-events:none}

/* ---------- how was it ---------- */
.fb{position:relative;margin-top:16px;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px 18px;text-align:center;overflow:hidden;
  animation:fadeUp .7s var(--ease) 1.1s both}
.fb h3{margin:0;font:800 18px Archivo,sans-serif}
.fb .lead{font-size:13px;color:var(--steel);margin-top:2px}
.face{font-size:44px;line-height:1;height:52px;margin-top:10px;display:grid;place-items:center}
.face span{display:inline-block;animation:faceIn .45s var(--spring) both}
@keyframes faceIn{from{opacity:0;transform:scale(.3) rotate(-25deg)}to{opacity:1;transform:none}}
.stars{display:flex;justify-content:center;gap:6px;margin-top:6px}
.star{background:none;border:0;padding:4px;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.star svg{width:40px;height:40px;display:block;transition:transform .25s var(--spring)}
.star path{fill:#E6EBEA;stroke:#CBD4D3;stroke-width:1;transition:fill .2s,stroke .2s}
.star.on path{fill:url(#gold);stroke:#D18A00}
.star.on svg{animation:starPop .45s var(--spring) both;animation-delay:calc(var(--i) * 55ms)}
.star:hover svg{transform:scale(1.12) rotate(-6deg)}
@keyframes starPop{0%{transform:scale(.6)}60%{transform:scale(1.28) rotate(8deg)}100%{transform:scale(1)}}
.star .ring{position:absolute;inset:50% auto auto 50%;width:8px;height:8px;margin:-4px;border-radius:50%;border:2px solid var(--amber);opacity:0;pointer-events:none}
.star.burst .ring{animation:ring .55s ease-out}
@keyframes ring{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(7)}}
.say{font-weight:700;font-size:14px;height:22px;margin-top:4px;color:var(--steel);transition:color .2s}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin-top:12px}
.tg{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s var(--spring)}
.tg.on{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.04)}
.fb textarea{width:100%;margin-top:12px;border:1.5px solid var(--line);border-radius:14px;padding:11px 13px;font:14px Inter,sans-serif;resize:none;min-height:76px;
  transition:border-color .2s,box-shadow .2s;background:#FBFCFC}
.fb textarea:focus{outline:0;border-color:var(--amber);box-shadow:0 0 0 4px rgba(240,168,30,.18)}
.send{margin-top:12px;width:100%;border:0;border-radius:14px;padding:14px;font:700 15px Inter,sans-serif;cursor:pointer;color:var(--ink);
  background:linear-gradient(135deg,#FFC74A,var(--amber) 55%,var(--amber2));box-shadow:0 10px 22px -10px rgba(224,144,10,.8);
  transition:transform .2s var(--spring),filter .2s;position:relative}
.send:active{transform:scale(.97)} .send[disabled]{filter:grayscale(.4);opacity:.7}
.send .sp{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(16,30,34,.25);border-top-color:var(--ink);border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fbmsg{font-size:13px;color:var(--rust);margin-top:8px;min-height:18px}
.thanks{padding:8px 0 4px;animation:fadeUp .6s var(--ease) both}
.thanks svg.tick{width:74px;height:74px;display:block;margin:4px auto 8px}
.thanks .c{stroke:var(--green);stroke-width:3;fill:none;stroke-dasharray:190;stroke-dashoffset:190;animation:draw .7s ease-out .1s forwards}
.thanks .k{stroke:var(--green);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .45s ease-out .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.thanks h3{font-size:19px}
.thanks .gave{color:#E59E0B;font-size:20px;letter-spacing:2px;margin-top:4px}
.heart{position:absolute;bottom:20px;font-size:20px;pointer-events:none;animation:float 1.8s ease-out forwards}
@keyframes float{0%{opacity:0;transform:translateY(0) scale(.5)}15%{opacity:1}100%{opacity:0;transform:translateY(-170px) translateX(var(--dx)) scale(1.2) rotate(var(--r))}}

/* ---------- the shop, at the foot ---------- */
.shopfoot{margin:22px 0 34px;text-align:center;font-size:12.5px;color:var(--steel);line-height:1.7;animation:fadeUp .6s var(--ease) 1.3s both}
.shopfoot b{color:var(--ink);font-family:Archivo,sans-serif;letter-spacing:.04em}
.shopfoot a{color:var(--ink);font-weight:600}
.msgcard{margin-top:-52px;background:var(--white);border-radius:20px;padding:34px 20px;text-align:center;color:var(--steel);box-shadow:0 24px 50px -18px rgba(16,30,34,.35);animation:rise .8s var(--spring) both}
.msgcard b{display:block;font:800 18px Archivo,sans-serif;color:var(--ink);margin-bottom:6px}
.loader{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--amber);animation:spin .8s linear infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* The exact branded bill the till printed — kept so "save as PDF" is the real invoice with its
   logo and QR, but hidden on screen, where the card above reads properly on a phone. */
.paper{background:#fff;padding:0;margin:0;overflow:hidden}
.paper .print{border:0;margin:0 auto;padding:0}
.fit.a5{width:760px}
.fit.r80{width:302px}
.paper .print.a5{width:100%;aspect-ratio:auto;min-height:0}
.paper .print.r80{width:302px}
.forprint{display:none}
@media print{
  *{animation:none!important}
  body{background:#fff;margin:0}
  .hero,.acts,.fb,.shopfoot,#confetti{display:none!important}
  .receipt{margin:0;box-shadow:none}
  .wrap{max-width:none;padding:0;margin:0}
  .screenview{display:none!important}
  .forprint{display:block!important}
  /* Fill the page width exactly, whatever page the device gives us. iOS Safari ignores the @page
     size and prints portrait, and a fixed-width bill then runs off the right edge — so the A5 is
     made fluid, and the receipt is pinned to its own 76mm so a portrait page does not stretch it. */
  .paper{overflow:visible}
  .forprint .fit.a5{width:100%!important}
  .forprint .print.a5{width:100%!important}
  .forprint .fit.r80{width:76mm!important;margin:0 auto}
  .forprint .print.r80{width:76mm!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD45C"/><stop offset="1" stop-color="#F0A81E"/></linearGradient></defs></svg>
<header class="hero"><i class="blob a"></i><i class="blob b"></i><i class="blob c"></i>
  <div class="wrap">
    <div class="brand"><span class="logo" id="logo"><span class="ini" id="mk">RH</span></span>
      <span class="bname"><b id="shopName">Regal Hardware</b><span class="si" id="shopSi"></span><small id="shopTags"></small></span></div>
    <div class="chips" id="chips"></div>
    <div class="hi" id="hi"></div>
  </div></header>
<div class="wrap"><div id="out"><div class="msgcard"><div class="loader"></div>Reading your bill…</div></div></div>
<canvas id="confetti"></canvas>
<script>

const $=(s)=>document.querySelector(s);
const money=(n)=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* The shop sometimes keeps two numbers in the one phone field ("027… , 077…"). A tel: link can only
   dial one, so take the first and strip it to digits — otherwise the phone tries to call both at
   once and does nothing. */
const firstPhone=(s)=>String(s==null?'':s).split(/[,/;]|\s(?:or)\s/i)[0].replace(/[^0-9+]/g,'');
const ICON={
  pin:'<path d="M12 21s-7-6.1-7-11.5A7 7 0 0119 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
  pdf:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  print:'<path d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v6H7z"/>',
  wa:'<path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-3.9-1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 01-1.8-1.8l.8-1-1-2z"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* A real PDF file of the bill the till printed, made on the customer's own phone: the paper is drawn
   to a picture and laid on an A5 landscape page (or an 80 mm strip for a receipt). "Print or save as
   PDF" is still there, but on most phones it is three steps and a print dialog; this is one tap. */
const load=(src)=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('could not load the PDF maker')); document.head.appendChild(s) });
let bill=null;
async function downloadPdf(btn){
  const b=bill; if(!b||!b.html) return window.print();
  const lbl=btn.querySelector('span'), was=lbl.textContent; btn.setAttribute('disabled',''); lbl.textContent='Making…';
  const host=document.createElement('div');
  try{
    if(!window.html2canvas) await load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const r80=b.paper==='r80';
    host.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
    host.innerHTML=`<div class="paper"><div class="fit printArea ${r80?'r80':'a5'}">${b.html}</div></div>`;
    document.body.appendChild(host);
    await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{ i.onload=i.onerror=r })));
    const el=host.querySelector('.fit');
    const canvas=await html2canvas(el,{scale:3,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const { jsPDF }=window.jspdf;
    let doc;
    if(r80){
      const w=80, m=2, h=(w-2*m)*canvas.height/canvas.width+2*m;
      doc=new jsPDF({unit:'mm',format:[w,Math.max(h,w)],orientation:'portrait'});
      doc.addImage(img,'JPEG',m,m,w-2*m,h-2*m);
    }else{
      doc=new jsPDF({unit:'mm',format:'a5',orientation:'landscape'});
      const W=210, H=148, m=6; let w=W-2*m, h=w*canvas.height/canvas.width;
      if(h>H-2*m){ h=H-2*m; w=h*canvas.width/canvas.height }
      doc.addImage(img,'JPEG',(W-w)/2,m,w,h);
    }
    doc.save(String(b.no||'bill').replace(/[^\w.-]+/g,'-')+'.pdf');
  }catch(e){
    alert('The PDF could not be made here ('+e.message+'). The print window will open instead — choose "Save as PDF".');
    window.print();
  }finally{ host.remove(); btn.removeAttribute('disabled'); lbl.textContent=was }
}

/* the total runs up to its figure as the bill lands */
function countUp(el,to,ms){
  if(calm){ el.textContent=(+to).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}); return }
  const t0=performance.now(), ease=x=>x>=1?1:1-Math.pow(2,-10*x);      // lands on the exact figure
  const step=(t)=>{ const p=Math.min(1,(t-t0)/ms); el.textContent=(to*ease(p)).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}); if(p<1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
/* a handful of paper pieces in the shop's colours — for a bill paid in full, and for a kind word */
function confetti(n=140,from){
  if(calm) return;
  const cv=$('#confetti'), cx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cols=['#F0A81E','#FFD45C','#1FA39A','#1E8A5A','#F25F3A','#101E22'];
  const ox=from?from.x:innerWidth/2, oy=from?from.y:innerHeight*.32;
  const P=Array.from({length:n},()=>{ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1, v=6+Math.random()*9;
    return {x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.random()*cols.length|0],round:Math.random()<.3} });
  const t0=performance.now();
  const step=(t)=>{ const age=(t-t0)/1000; cx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){ p.vy+=.32; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.globalAlpha=Math.max(0,1-age/2.8); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,7); cx.fill() } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));
      cx.restore() }
    if(age<2.8) requestAnimationFrame(step); else cx.clearRect(0,0,innerWidth,innerHeight) };
  requestAnimationFrame(step);
}
const seen=(k)=>{ try{ if(localStorage.getItem(k)) return true; localStorage.setItem(k,'1') }catch(e){} return false };

/* ---------- how was it ---------- */
const FACES=[['🙂','Tap a star'],['😞','Not good'],['😕','Could be better'],['😐','It was okay'],['😊','Good'],['🤩','Loved it!']];
const TAGS={good:['Friendly staff','Quick service','Good prices','Good quality','Found everything','Helpful advice'],
  bad:['Slow service','Out of stock','Price too high','Wrong item','Friendly staff','Good quality']};
function feedbackCard(b){
  if(b.feedback) return `<div class="fb" id="fb">${thanksHtml(b.feedback.stars,true)}</div>`;
  return `<div class="fb" id="fb">
    <h3>How was your visit?</h3><div class="lead">Your word goes straight to ${esc(b.shop.name)}.</div>
    <div class="face" id="face"><span>${FACES[0][0]}</span></div>
    <div class="stars" id="stars" role="radiogroup" aria-label="Your rating">${[1,2,3,4,5].map(i=>`<button class="star" type="button" role="radio" aria-checked="false" aria-label="${i} star${i>1?'s':''}" data-s="${i}" style="--i:${i}"><svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9z" stroke-linejoin="round"/></svg><i class="ring"></i></button>`).join('')}</div>
    <div class="say" id="say">${FACES[0][1]}</div>
    <div class="more" id="more"><div>
      <div class="tags" id="tags"></div>
      <textarea id="note" maxlength="300" placeholder="Anything you would like to tell us? (optional)"></textarea>
      <button class="send" id="send" type="button">Send my feedback</button>
      <div class="fbmsg" id="fbmsg"></div>
    </div></div></div>`;
}
const thanksHtml=(stars,before)=>`<div class="thanks"><svg class="tick" viewBox="0 0 64 64"><circle class="c" cx="32" cy="32" r="29"/><path class="k" d="M20 33l8 8 16-17"/></svg>
  <h3>${before?'You have rated this visit':'Thank you!'}</h3><div class="gave">${'★'.repeat(stars)}<span style="color:#DCE2E1">${'★'.repeat(5-stars)}</span></div>
  <div class="lead">${before?'Thank you for telling us — it helps the whole shop.':stars>=4?'We are so glad. See you again soon!':'We are sorry it was not better — the shop has your note and will put it right.'}</div></div>`;
function feedbackAfter(b,id){
  const box=$('#fb'); if(!box||b.feedback) return;
  let stars=0; const picked=new Set();
  const paintTags=()=>{ const list=stars>=4?TAGS.good:TAGS.bad;
    $('#tags').innerHTML=list.map((t,i)=>`<button type="button" class="tg ${picked.has(t)?'on':''}" data-t="${esc(t)}" style="animation:fadeUp .4s var(--ease) ${i*45}ms both">${esc(t)}</button>`).join('');
    $('#tags').querySelectorAll('.tg').forEach(x=>x.onclick=()=>{ const t=x.dataset.t; picked.has(t)?picked.delete(t):picked.add(t); x.classList.toggle('on') }) };
  box.querySelectorAll('.star').forEach(s=>{
    s.onclick=()=>{ const was=stars; stars=+s.dataset.s;
      box.querySelectorAll('.star').forEach(x=>{ const on=+x.dataset.s<=stars; x.classList.toggle('on',on); x.setAttribute('aria-checked',String(+x.dataset.s===stars));
        if(on&&+x.dataset.s>was){ x.classList.remove('on'); void x.offsetWidth; x.classList.add('on') } });
      s.classList.remove('burst'); void s.offsetWidth; s.classList.add('burst');
      $('#face').innerHTML=`<span>${FACES[stars][0]}</span>`; $('#say').textContent=FACES[stars][1];
      $('#say').style.color=stars<=2?'var(--rust)':stars>=4?'var(--green)':'var(--steel)';
      if((was>=4)!==(stars>=4)||!was){ [...picked].forEach(t=>{ if(!(stars>=4?TAGS.good:TAGS.bad).includes(t)) picked.delete(t) }); paintTags() }
      $('#more').classList.add('open');
      if(navigator.vibrate) try{ navigator.vibrate(12) }catch(e){} };
  });
  $('#send').onclick=async()=>{
    if(!stars){ $('#fbmsg').textContent='Tap the stars first'; return }
    const btn=$('#send'); btn.disabled=true; btn.innerHTML='<i class="sp"></i>Sending…'; $('#fbmsg').textContent='';
    try{
      const r=await fetch('/api/my/b/'+encodeURIComponent(id)+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stars,tags:[...picked],note:$('#note').value})});
      const j=await r.json().catch(()=>({}));
      // a server not yet restarted on the new version answers a plain "Not found" for this address
      if(r.status===404&&j.error==='Not found') throw new Error('The shop is updating its system — please try again in a little while');
      if(!r.ok) throw new Error(j.error||'It did not go — please try again');
      box.innerHTML=thanksHtml(stars,false);
      if(stars>=4){ const rc=box.getBoundingClientRect(); confetti(90,{x:rc.left+rc.width/2,y:rc.top+40});
        for(let i=0;i<7;i++){ const h=document.createElement('span'); h.className='heart'; h.textContent=['💛','🧡','💚'][i%3];
          h.style.left=(18+Math.random()*64)+'%'; h.style.setProperty('--dx',(Math.random()*60-30)+'px'); h.style.setProperty('--r',(Math.random()*40-20)+'deg');
          h.style.animationDelay=(i*110)+'ms'; box.appendChild(h); setTimeout(()=>h.remove(),2600) } }
    }catch(e){ btn.disabled=false; btn.textContent='Send my feedback'; $('#fbmsg').textContent=e.message }
  };
}

(async () => {
  const id = location.pathname.split('/').filter(Boolean).pop() || '';
  try {
    const r = await fetch('/api/my/b/' + encodeURIComponent(id));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.bill) throw new Error(j.error || 'That bill could not be found');
    const b = j.bill, sh = b.shop;
    /* the shop, as on its own bill: the logo, the name in both languages, what it sells, where it is */
    $('#shopName').textContent = sh.name;
    $('#shopSi').textContent = sh.sinhala || '';
    $('#shopTags').textContent = sh.tags || sh.line1 || '';
    const ini = (sh.name||'RH').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    // the logo set in the till, else the shop's own — the initials only if neither will load
    { const im = new Image(); im.alt = sh.name; im.onload = () => { $('#logo').innerHTML = ''; $('#logo').appendChild(im) }; im.src = sh.logo || '/regal-logo.png' }
    $('#mk').textContent = ini;
    document.title = sh.name + ' · bill ' + b.no;
    const telNum = firstPhone(sh.phone) || firstPhone(sh.land);
    const mob = firstPhone(sh.phone), wa = /^0?7\d{8}$/.test(mob) ? '94' + mob.replace(/^0/, '') : '';
    const where = [sh.addr, sh.near].filter(Boolean).join(' ');
    const maps = sh.addr ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(sh.name + ' ' + sh.addr) : '';
    const web = sh.web ? (/^https?:/.test(sh.web) ? sh.web : 'https://' + sh.web) : '';
    $('#chips').innerHTML = [
      maps ? `<a class="chip" href="${esc(maps)}" target="_blank" rel="noopener">${svg('pin')}${esc(sh.addr)}</a>` : '',
      telNum ? `<a class="chip" href="tel:${esc(telNum)}">${svg('call')}${esc(String(sh.phone||sh.land).split(/[,/;]/)[0].trim())}</a>` : '',
      web ? `<a class="chip" href="${esc(web)}" target="_blank" rel="noopener">${svg('web')}${esc(sh.web.replace(/^https?:\/\//,''))}</a>` : ''].join('');
    $('#hi').innerHTML = b.customer ? `Thank you for shopping with us, <b>${esc(b.customer.name)}</b>.` : 'Thank you for shopping with us.';

    const settled = !(b.balance > 0.005);
    const stamp = settled ? `<span class="stamp paid">Paid</span>` : b.type === 'CREDIT' && !(b.paid > 0.005) ? `<span class="stamp acc">On account</span>` : `<span class="stamp due">Balance due</span>`;
    const card = `
      <div class="receipt ${b.html ? 'screenview' : ''}">
        <div class="rtop"><div><div class="rno">Invoice<b>${esc(b.no)}</b></div>
          <div class="when">${esc(b.date)}${b.time ? ' · ' + esc(b.time) : ''}</div></div>${stamp}</div>
        <div class="grand"><div class="lbl">Total</div><div class="amt"><small>Rs</small><span id="amt">0.00</span></div>
          ${b.saved > 0.005 ? `<span class="saved">🎉 You saved ${money(b.saved)}</span>` : ''}</div>
        <div class="items">${b.lines.map((l, i) => `<div class="item ${l.returned ? 'ret' : ''}" style="--i:${Math.min(i, 14)}">
            <span class="q">${+l.qty === Math.round(l.qty) ? Math.abs(l.qty) : Math.abs(l.qty).toFixed(2)}×</span>
            <span class="nm"><b>${esc(l.name)}${l.returned ? '<span class="rtag">returned</span>' : ''}</b>
              <span class="sub">${money(l.price)}${l.unit ? ' / ' + esc(l.unit) : ''}${l.mrp ? `<s>${money(l.mrp)}</s>` : ''}${l.disc > 0 ? ` · less ${money(l.disc)}` : ''}</span></span>
            <span class="am">${money(l.amount)}</span></div>`).join('')}</div>
        <div class="tots">
          <div class="tot"><span>Subtotal</span><b>${money(b.sub)}</b></div>
          ${b.billDisc > 0 ? `<div class="tot"><span>Discount</span><b>− ${money(b.billDisc)}</b></div>` : ''}
          <div class="tot"><span>Paid${b.pays && b.pays.length ? ' · ' + b.pays.map(p => esc(String(p.method).toLowerCase())).join(', ') : ''}</span><b>${money(b.paid)}</b></div>
          ${settled ? `<div class="tot ok"><span>Settled</span><b>✓ in full</b></div>` : `<div class="tot due"><span>Outstanding</span><b>${money(b.balance)}</b></div>`}
        </div>
        ${b.by ? `<div class="by">Served by ${esc(b.by)}</div>` : ''}
      </div>`;
    const paper = b.html
      ? `<div class="paper forprint"><div class="fit printArea ${b.paper === 'r80' ? 'r80' : 'a5'}">${b.html}</div></div>`
      : '';
    // size the printed page to the bill it holds, so the saved PDF is one clean sheet
    const pageRule = b.html
      ? `<style media="print">@page{size:${b.paper === 'r80' ? '80mm auto;margin:2mm' : 'A5 landscape;margin:6mm'}}</style>`
      : '';
    const acts = `<div class="acts screenview">
        <button class="act main" type="button" onclick="downloadPdf(this)"><i>${svg('pdf')}</i><span>PDF</span></button>
        <button class="act" type="button" onclick="window.print()"><i>${svg('print')}</i><span>Print</span></button>
        ${telNum ? `<a class="act" href="tel:${esc(telNum)}"><i>${svg('call')}</i><span>Call</span></a>` : ''}
        ${wa ? `<a class="act" href="https://wa.me/${wa}?text=${encodeURIComponent('Hello, about my bill ' + b.no)}" target="_blank" rel="noopener"><i>${svg('wa')}</i><span>WhatsApp</span></a>`
             : maps ? `<a class="act" href="${esc(maps)}" target="_blank" rel="noopener"><i>${svg('pin')}</i><span>Find us</span></a>` : ''}
      </div>`;
    const foot = `<div class="shopfoot screenview"><b>${esc(sh.name)}</b><br>${esc(where)}<br>
        ${[sh.phone, sh.land].filter(Boolean).map(esc).join(' · ')}${sh.email ? '<br>' + esc(sh.email) : ''}${web ? `<br><a href="${esc(web)}" target="_blank" rel="noopener">${esc(sh.web.replace(/^https?:\/\//,''))}</a>` : ''}</div>`;
    $('#out').innerHTML = pageRule + card + paper + acts + feedbackCard(b) + foot;
    bill = b;
    setTimeout(() => countUp($('#amt'), +b.total || 0, 1400), calm ? 0 : 650);
    feedbackAfter(b, id);
    // a bill paid in full: a little celebration, the first time it is opened on this phone
    if (settled && !seen('bill-cheer-' + id)) setTimeout(() => confetti(), 1500);
  } catch (e) {
    $('#out').innerHTML = `<div class="msgcard"><b>We cannot show that bill</b>${esc(e.message)}.<br>
      Please ring the shop and they will help.</div>`;
  }
})();
</script>
