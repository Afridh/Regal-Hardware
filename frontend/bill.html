<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#a31d24">
<title>Your bill</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/bill-print.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@600&display=swap" rel="stylesheet">
<style>
/* The customer's e-bill, "Poster" design (chosen 8 Nov 2026 from docs/ebill-designs/3-poster.html):
   the shop's red, the bill's state as one huge word, the amount edge to edge, a running banner of the
   state (PAID / QUOTATION…), and the bill itself on a cream sheet that slides up over the red. */
:root{--red:#a31d24;--red2:#e2463f;--ink:#1a0d0e;--cream:#f7f1e6;--mute:#6f6156;--gold:#ffcf5a;--green:#1d7a45}
*{box-sizing:border-box;margin:0}
html,body{background:var(--red)}
html{overflow-x:clip;-webkit-text-size-adjust:100%}
body{color:#fff;font:400 16px/1.5 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.disp{font-family:Anton,Impact,sans-serif;font-weight:400;text-transform:uppercase;line-height:.9}
.num{font-variant-numeric:tabular-nums}
.rp{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(2.6);opacity:0}}

/* ---------- the shop, across the top ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.logo img{width:100%;height:100%;object-fit:contain;padding:4px}
.logo .ini{font:400 18px Anton,Impact,sans-serif;color:var(--red)}
.bname{min-width:0}
.bname b{display:block;font:400 18px/1.1 Anton,Impact,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.bname .si{display:block;font:600 12.5px 'Noto Sans Sinhala',sans-serif;color:#ffd9a0}
.bname small{display:block;font-size:11.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call{flex:none;display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 16px;border-radius:999px;background:#fff;color:var(--red);font-weight:700;font-size:14.5px}
.call svg{width:16px;height:16px}

/* ---------- the state, the amount ---------- */
.hero{padding:6px 18px 0}
.eyebrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600;letter-spacing:.16em;font-size:12px;text-transform:uppercase;opacity:.9}
.eyebrow::before{content:"";width:28px;height:2px;background:#fff}
.wrapw{overflow:hidden;padding-top:.06em}
/* the word: drawn as an outline, then filled; sized to its length so a long one still fits a phone */
.word{font-size:clamp(60px,calc(150vw / var(--n)),220px);letter-spacing:-.01em;margin-top:6px;color:transparent;-webkit-text-stroke:2px #fff;animation:fillw .6s ease-out 1.1s forwards;white-space:nowrap}
.word span{display:inline-block;transform:translateY(105%);animation:upw .9s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(.15s + var(--i)*.06s)}
@keyframes upw{to{transform:none}}
@keyframes fillw{to{color:#fff;-webkit-text-stroke:2px transparent}}
.w-due .word{animation-name:fillw2}@keyframes fillw2{to{color:var(--gold);-webkit-text-stroke:2px transparent}}
.amt{font-size:clamp(44px,14vw,140px);margin-top:4px;white-space:nowrap}
.amt small{font-size:.32em;vertical-align:1.6em;margin-right:.18em;opacity:.8}
.stamp{display:inline-block;margin-top:12px;font-weight:800;font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;padding:6px 12px;border:2px solid #fff;border-radius:999px;opacity:0;animation:fadeUp .5s ease-out 1.3s forwards}
.stamp.due{border-color:var(--gold);color:var(--gold)}
/* a credit customer's name, big and bold */
.cust{margin-top:12px;display:flex;flex-direction:column;gap:2px}
.cust span{font-weight:600;letter-spacing:.18em;font-size:12px;text-transform:uppercase;opacity:.85}
.cust b{font-weight:800;font-size:clamp(26px,7.5vw,44px);line-height:1.1;color:var(--gold);overflow-wrap:anywhere}
.hi{margin-top:10px;font-weight:500;opacity:.92}
.hi b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;font-size:13px;font-weight:600;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;padding:4px 12px;max-width:100%}
.chip svg{width:14px;height:14px;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* the band: the bill's state running like a shop's banner */
.band{margin-top:24px;background:var(--ink);color:#fff;transform:rotate(-2deg) scale(1.04);padding:12px 0;overflow:hidden;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.band div{display:flex;gap:34px;width:max-content;animation:run 32s linear infinite;font-family:Anton,Impact,sans-serif;font-size:22px;letter-spacing:.04em;text-transform:uppercase}
.band span::after{content:"✦";margin-left:34px;color:var(--red2)}
@keyframes run{to{transform:translateX(-50%)}}

/* ---------- the bill: a cream sheet sliding up over the red ---------- */
.sheet{position:relative;margin-top:30px;background:var(--cream);color:var(--ink);border-radius:36px 36px 0 0;padding:30px 18px 40px;animation:sheet 1s cubic-bezier(.16,1,.3,1) .6s both;box-shadow:0 -20px 40px rgba(0,0,0,.18)}
@keyframes sheet{from{transform:translateY(120px);opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(26,13,14,.2);margin:-16px auto 18px}
.inner{max-width:560px;margin:0 auto}
.sh{display:flex;justify-content:space-between;align-items:end;gap:10px}
.sh h2{font-size:34px}
.sh span{font-size:13px;color:var(--mute);text-align:right}
.items{counter-reset:l;border-top:2px solid var(--ink);margin-top:14px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 14px;align-items:center;padding:14px 0;border-bottom:2px solid var(--ink);opacity:0;animation:rl .6s cubic-bezier(.16,1,.3,1) forwards;animation-delay:calc(1.2s + var(--i)*.08s)}
.item::before{content:counter(l,decimal-leading-zero);counter-increment:l;grid-row:1/3;font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--red)}
@keyframes rl{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.item .nm{font-weight:700;font-size:15px;line-height:1.25;overflow-wrap:anywhere;min-width:0}
.item .sub{grid-column:2;font-size:13px;color:var(--mute)}.item .sub s{opacity:.7}
.item .am{grid-row:1/3;grid-column:3;font-family:Anton,Impact,sans-serif;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.ret .nm,.item.ret .am{color:#9F1239}
/* a warranty item: the period, the day it runs to, the serial numbers (10 Nov 2026) */
.item.w::before,.item.w .am{grid-row:1/4}
.item .wr{grid-column:2;justify-self:start;display:inline-flex;align-items:center;gap:6px;margin-top:5px;background:#e6f2ea;color:var(--green);border-radius:999px;padding:4px 10px 4px 8px;font-size:12.5px;font-weight:600;line-height:1.3}
.item .wr svg{flex:none}.item .wr b{font-weight:800}.item .wr i{font-style:normal;color:var(--mute);font-weight:500}
.rtag{font-style:normal;color:var(--red);font-weight:600;margin-left:5px}
.tots{margin-top:14px}
.tot{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:15px}
.tot b{font-variant-numeric:tabular-nums}
.tot.g{font-family:Anton,Impact,sans-serif;font-size:28px;text-transform:uppercase}.tot.g b{font-weight:400}
.tot.due{color:var(--red);font-weight:700}.tot.ok{color:var(--green);font-weight:700}
.by{margin-top:10px;font-size:13px;color:var(--mute)}
.saved{margin-top:18px;background:var(--ink);color:#fff;border-radius:22px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.saved b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(28px,9vw,40px);color:var(--gold);line-height:1;white-space:nowrap}
.saved span{font-size:14px;opacity:.85;max-width:13rem}

/* ---------- what to do with it ---------- */
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:56px;padding:0 12px;border-radius:999px;border:2px solid var(--ink);background:transparent;font-weight:700;font-size:15.5px;transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .2s;text-align:center}
.btn:hover{box-shadow:4px 4px 0 var(--ink);transform:translate(-2px,-2px)}
.btn:active{transform:scale(.95);box-shadow:none;transition-duration:.08s}
.btn svg{width:18px;height:18px;flex:none}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}.btn.ink{background:var(--ink);color:#fff}.btn.full{grid-column:1/-1}
.btn[disabled]{opacity:.6;pointer-events:none}
.card{margin-top:16px;border:2px solid var(--ink);border-radius:26px;padding:20px}
.card h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:28px;letter-spacing:.02em;line-height:1}
.card .lead{color:var(--mute);font-size:14px;margin-top:4px}
/* the customer's whole account, under the bill */
.acct-who{font-weight:800;font-size:18px;margin-top:4px}
.acct-owe{margin-top:12px}
.acct-owe span{display:block;color:var(--mute);font-size:14px;font-weight:700}
.acct-owe b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:44px;line-height:1.05;color:var(--red)}
.acct-owe small{color:var(--mute);font-size:13px}
.acct-owe.ok b{color:var(--green);font-size:32px}
.acct-go{display:block;margin-top:14px;text-align:center;color:#fff;font-weight:700;padding:14px;border-radius:22px;background:var(--ink);border:0;width:100%;font:inherit;font-weight:700}
.acct-go span{display:block;font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
button.acct-go:disabled{opacity:.6}
.acct-go.wait{background:#fff3d6;color:#6b4a00;border:2px dashed #e0b450}
.acct-msg{color:var(--red);font-size:13px;text-align:center;margin-top:6px}
/* how was it: 1 to 5 */
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}
.star{aspect-ratio:1;border:2px solid var(--ink);border-radius:50%;background:transparent;font-family:Anton,Impact,sans-serif;font-size:24px;transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .15s,color .15s}
.star.on{background:var(--red);border-color:var(--red);color:#fff}
.star.pop{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{40%{transform:scale(1.15) rotate(-6deg)}}
.lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:6px}
.say{font-weight:700;font-size:16px;min-height:24px;margin-top:8px;text-align:center}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.16,1,.3,1)}
.more.open{grid-template-rows:1fr}
.more>div{overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tg{min-height:40px;padding:6px 15px;border:2px solid var(--ink);border-radius:999px;background:transparent;font-weight:600;font-size:14px;animation:rl .35s cubic-bezier(.16,1,.3,1) both}
.tg.on{background:var(--ink);color:#fff}
#note{width:100%;margin-top:12px;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font:inherit;min-height:70px;background:#fff;resize:none}
.send{width:100%;margin-top:10px;min-height:54px;border:0;border-radius:999px;background:var(--red);color:#fff;font-weight:700}
.send[disabled]{opacity:.7}
.send .sp{display:inline-block;width:16px;height:16px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;vertical-align:-3px;margin-right:8px;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fbmsg{font-size:13px;color:var(--red);margin-top:8px;min-height:18px;text-align:center}
.thanks{text-align:center;padding:4px 0;animation:fadeUp .5s ease-out both}
.thanks svg{width:64px;height:64px;display:block;margin:0 auto 8px}
.thanks .c{stroke:var(--green);stroke-width:3;fill:none;stroke-dasharray:190;stroke-dashoffset:190;animation:draw .7s ease-out .1s forwards}
.thanks .k{stroke:var(--green);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:50;stroke-dashoffset:50;animation:draw .45s ease-out .7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.thanks h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:30px;line-height:1}
.thanks .gave{font-family:Anton,Impact,sans-serif;font-size:22px;color:var(--red);margin-top:4px}
.thanks .lead{margin-top:4px}
.shopfoot{text-align:center;font-size:13px;color:var(--mute);margin-top:28px;line-height:1.7}
.shopfoot b{color:var(--ink);font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.06em;font-size:16px}
.shopfoot a{color:var(--ink);font-weight:700}
.msgcard{margin:20px 18px;background:var(--cream);color:var(--mute);border-radius:28px;padding:34px 22px;text-align:center;animation:sheet .8s cubic-bezier(.16,1,.3,1) both}
.msgcard b{display:block;font:400 26px/1.1 Anton,Impact,sans-serif;text-transform:uppercase;color:var(--ink);margin-bottom:8px}
.loader{width:42px;height:42px;margin:0 auto 12px;border-radius:50%;border:3px solid rgba(26,13,14,.12);border-top-color:var(--red);animation:spin .8s linear infinite}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@media (min-width:900px){.hero{padding:10px 48px 0}.top{padding:18px 48px}.sheet{padding:40px 48px 60px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}
  .word{color:#fff;-webkit-text-stroke:0}.word span,.item{transform:none;opacity:1}.stamp{opacity:1}.thanks .c,.thanks .k{stroke-dashoffset:0}}

/* The exact branded bill the till printed — kept so "save as PDF" is the real invoice with its
   logo and QR, but hidden on screen, where the poster above reads properly on a phone. */
.paper{background:#fff;padding:0;margin:0;overflow:hidden}
.paper .print{border:0;margin:0 auto;padding:0}
.fit.a5{width:760px}
.fit.r80{width:302px}
.paper .print.a5{width:100%;aspect-ratio:auto;min-height:0}
.paper .print.r80{width:302px}
.forprint{display:none}
@media print{
  *{animation:none!important}
  html,body{background:#fff;margin:0}
  .top,.hero,.band,#confetti{display:none!important}
  .sheet{margin:0;padding:0;box-shadow:none;background:#fff;border-radius:0}
  .screenview{display:none!important}
  .forprint{display:block!important}
  /* Fill the page width exactly, whatever page the device gives us. iOS Safari ignores the @page
     size and prints portrait, and a fixed-width bill then runs off the right edge — so the A5 is
     made fluid, and the receipt is pinned to its own 76mm so a portrait page does not stretch it. */
  .paper{overflow:visible}
  .forprint .fit.a5{width:100%!important}
  .forprint .print.a5{width:100%!important}
  .forprint .fit.r80{width:76mm!important;margin:0 auto}
  .forprint .print.r80{width:76mm!important}
}
</style>
</head>
<body>
<header class="top screenview">
  <div class="brand"><span class="logo" id="logo"><span class="ini" id="mk">RH</span></span>
    <span class="bname"><b id="shopName">Regal Hardware</b><span class="si" id="shopSi"></span><small id="shopTags"></small></span></div>
  <span id="callTop"></span>
</header>
<div id="out"><div class="msgcard"><div class="loader"></div>Reading your bill…</div></div>
<canvas id="confetti"></canvas>
<script>

const $=(s)=>document.querySelector(s);
const money=(n)=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// "1 YEAR" as the till keeps it → "1 year"; "LIFETIME" → "Lifetime"
const wrWord=(w)=>{ const t=String(w||'').trim().toLowerCase(); return /life/.test(t)?'Lifetime':t };
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* The shop sometimes keeps two numbers in the one phone field ("027… , 077…"). A tel: link can only
   dial one, so take the first and strip it to digits — otherwise the phone tries to call both at
   once and does nothing. */
const firstPhone=(s)=>String(s==null?'':s).split(/[,/;]|\s(?:or)\s/i)[0].replace(/[^0-9+]/g,'');
const ICON={
  pin:'<path d="M12 21s-7-6.1-7-11.5A7 7 0 0119 9.5C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  call:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',
  web:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 010 18M12 3a14 14 0 000 18"/>',
  pdf:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  print:'<path d="M7 9V4h10v5M7 17H5a2 2 0 01-2-2v-4a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2h-2M7 14h10v6H7z"/>',
  bag:'<path d="M5 8h14l-1 12H6zM9 8V6a3 3 0 016 0v2"/>',
  wa:'<path d="M4 20l1.3-3.9A8 8 0 1112 20a8 8 0 01-3.9-1z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 01-1.8-1.8l.8-1-1-2z"/>'
};
const svg=(k)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>`;

/* a ripple on anything marked .rp, where it was pressed */
document.addEventListener('pointerdown',e=>{ const el=e.target.closest('.rp'); if(!el||calm) return;
  const r=el.getBoundingClientRect(), d=Math.max(r.width,r.height), s=document.createElement('span');
  s.className='ripple'; s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
  el.appendChild(s); setTimeout(()=>s.remove(),650) });

/* A real PDF file of the bill the till printed, made on the customer's own phone: the paper is drawn
   to a picture and laid on an A5 landscape page (or an 80 mm strip for a receipt). "Print or save as
   PDF" is still there, but on most phones it is three steps and a print dialog; this is one tap. */
const load=(src)=>new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=()=>no(new Error('could not load the PDF maker')); document.head.appendChild(s) });
let bill=null;
async function downloadPdf(btn){
  const b=bill; if(!b||!b.html) return window.print();
  const lbl=btn.querySelector('span'), was=lbl.textContent; btn.setAttribute('disabled',''); lbl.textContent='Making…';
  const host=document.createElement('div');
  try{
    if(!window.html2canvas) await load('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if(!window.jspdf) await load('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const r80=b.paper==='r80';
    host.style.cssText='position:fixed;left:-10000px;top:0;background:#fff';
    host.innerHTML=`<div class="paper"><div class="fit printArea ${r80?'r80':'a5'}">${b.html}</div></div>`;
    document.body.appendChild(host);
    await document.fonts.ready;
    await Promise.all([...host.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{ i.onload=i.onerror=r })));
    const el=host.querySelector('.fit');
    const canvas=await html2canvas(el,{scale:3,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const img=canvas.toDataURL('image/jpeg',0.92);
    const { jsPDF }=window.jspdf;
    let doc;
    if(r80){
      const w=80, m=2, h=(w-2*m)*canvas.height/canvas.width+2*m;
      doc=new jsPDF({unit:'mm',format:[w,Math.max(h,w)],orientation:'portrait'});
      doc.addImage(img,'JPEG',m,m,w-2*m,h-2*m);
    }else{
      doc=new jsPDF({unit:'mm',format:'a5',orientation:'landscape'});
      const W=210, H=148, m=6; let w=W-2*m, h=w*canvas.height/canvas.width;
      if(h>H-2*m){ h=H-2*m; w=h*canvas.width/canvas.height }
      doc.addImage(img,'JPEG',(W-w)/2,m,w,h);
    }
    doc.save(String(b.no||'bill').replace(/[^\w.-]+/g,'-')+'.pdf');
  }catch(e){
    alert('The PDF could not be made here ('+e.message+'). The print window will open instead — choose "Save as PDF".');
    window.print();
  }finally{ host.remove(); btn.removeAttribute('disabled'); lbl.textContent=was }
}

/* the total runs up to its figure as the bill lands */
function countUp(el,to,ms){
  if(calm){ el.textContent=(+to).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}); return }
  const t0=performance.now(), ease=x=>x>=1?1:1-Math.pow(2,-10*x);      // lands on the exact figure
  const step=(t)=>{ const p=Math.min(1,(t-t0)/ms); el.textContent=(to*ease(p)).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2}); if(p<1) requestAnimationFrame(step) };
  requestAnimationFrame(step);
}
/* a handful of paper pieces in the shop's colours — for a bill paid in full, and for a kind word */
function confetti(n=140,from){
  if(calm) return;
  const cv=$('#confetti'), cx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cols=['#ffcf5a','#ffffff','#e2463f','#1a0d0e','#f7f1e6','#1d7a45'];
  const ox=from?from.x:innerWidth/2, oy=from?from.y:innerHeight*.32;
  const P=Array.from({length:n},()=>{ const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1, v=6+Math.random()*9;
    return {x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,w:5+Math.random()*6,h:8+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:cols[Math.random()*cols.length|0],round:Math.random()<.3} });
  const t0=performance.now();
  const step=(t)=>{ const age=(t-t0)/1000; cx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of P){ p.vy+=.32; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      cx.save(); cx.globalAlpha=Math.max(0,1-age/2.8); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c;
      if(p.round){ cx.beginPath(); cx.arc(0,0,p.w/2,0,7); cx.fill() } else cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));
      cx.restore() }
    if(age<2.8) requestAnimationFrame(step); else cx.clearRect(0,0,innerWidth,innerHeight) };
  requestAnimationFrame(step);
}
const seen=(k)=>{ try{ if(localStorage.getItem(k)) return true; localStorage.setItem(k,'1') }catch(e){} return false };

/* ---------- how was it: 1 to 5 ---------- */
const SAY=['Tap a number','Not good','Could be better','It was okay','Good','Loved it!'];
const TAGS={good:['Friendly staff','Quick service','Good prices','Good quality','Found everything','Helpful advice'],
  bad:['Slow service','Out of stock','Price too high','Wrong item','Friendly staff','Good quality']};
function feedbackCard(b){
  if(b.feedback) return `<div class="card screenview" id="fb">${thanksHtml(b.feedback.stars,true)}</div>`;
  return `<div class="card screenview" id="fb">
    <h3>Rate us, 1 to 5</h3><div class="lead">Your word goes straight to ${esc(b.shop.name)}.</div>
    <div class="nums" id="stars" role="radiogroup" aria-label="Your rating">${[1,2,3,4,5].map(i=>`<button class="star rp" type="button" role="radio" aria-checked="false" aria-label="${i} out of 5" data-s="${i}">${i}</button>`).join('')}</div>
    <div class="lbl"><span>Not good</span><span>Excellent</span></div>
    <div class="say" id="say">${SAY[0]}</div>
    <div class="more" id="more"><div>
      <div class="tags" id="tags"></div>
      <textarea id="note" maxlength="300" placeholder="Anything you would like to tell us? (optional)"></textarea>
      <button class="send rp" id="send" type="button">Send my feedback</button>
      <div class="fbmsg" id="fbmsg"></div>
    </div></div></div>`;
}
const thanksHtml=(stars,before)=>`<div class="thanks"><svg viewBox="0 0 64 64"><circle class="c" cx="32" cy="32" r="29"/><path class="k" d="M20 33l8 8 16-17"/></svg>
  <h3>${before?'You have rated this visit':'Thank you!'}</h3><div class="gave">${stars} out of 5</div>
  <div class="lead">${before?'Thank you for telling us — it helps the whole shop.':stars>=4?'We are so glad. See you again soon!':'We are sorry it was not better — the shop has your note and will put it right.'}</div></div>`;
function feedbackAfter(b,id){
  const box=$('#fb'); if(!box||b.feedback) return;
  let stars=0; const picked=new Set();
  const paintTags=()=>{ const list=stars>=4?TAGS.good:TAGS.bad;
    $('#tags').innerHTML=list.map((t,i)=>`<button type="button" class="tg rp ${picked.has(t)?'on':''}" data-t="${esc(t)}" style="animation-delay:${i*45}ms">${esc(t)}</button>`).join('');
    $('#tags').querySelectorAll('.tg').forEach(x=>x.onclick=()=>{ const t=x.dataset.t; picked.has(t)?picked.delete(t):picked.add(t); x.classList.toggle('on') }) };
  box.querySelectorAll('.star').forEach(s=>{
    s.onclick=()=>{ const was=stars; stars=+s.dataset.s;
      box.querySelectorAll('.star').forEach(x=>{ const on=x===s; x.classList.toggle('on',on); x.setAttribute('aria-checked',String(on)) });
      s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
      $('#say').textContent=SAY[stars];
      $('#say').style.color=stars<=2?'var(--red)':stars>=4?'var(--green)':'var(--mute)';
      if((was>=4)!==(stars>=4)||!was){ [...picked].forEach(t=>{ if(!(stars>=4?TAGS.good:TAGS.bad).includes(t)) picked.delete(t) }); paintTags() }
      $('#more').classList.add('open');
      if(navigator.vibrate) try{ navigator.vibrate(12) }catch(e){} };
  });
  $('#send').onclick=async()=>{
    if(!stars){ $('#fbmsg').textContent='Tap a number first'; return }
    const btn=$('#send'); btn.disabled=true; btn.innerHTML='<i class="sp"></i>Sending…'; $('#fbmsg').textContent='';
    try{
      const r=await fetch('/api/my/b/'+encodeURIComponent(id)+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({stars,tags:[...picked],note:$('#note').value})});
      const j=await r.json().catch(()=>({}));
      // a server not yet restarted on the new version answers a plain "Not found" for this address
      if(r.status===404&&j.error==='Not found') throw new Error('The shop is updating its system — please try again in a little while');
      if(!r.ok) throw new Error(j.error||'It did not go — please try again');
      box.innerHTML=thanksHtml(stars,false);
      if(stars>=4){ const rc=box.getBoundingClientRect(); confetti(90,{x:rc.left+rc.width/2,y:rc.top+40}) }
    }catch(e){ btn.disabled=false; btn.textContent='Send my feedback'; $('#fbmsg').textContent=e.message }
  };
}
