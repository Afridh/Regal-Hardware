async function changeUser(){
  const u=($('#aUser')||{}).value||'', c=($('#aUserPass')||{}).value||'';
  if(u.trim().length<3) return toast('A user name needs at least three letters');
  try{ const j=await api('/username',{method:'POST',body:{username:u,current:c}}); ls.set('user',j.username); toast('Your user name is now '+j.username); await load() }
  catch(e){ toast(e.message) }
}
async function changePass(){
  const c=($('#aCur')||{}).value||'', n=($('#aNew')||{}).value||'';
  if(n.length<6) return toast('A password needs at least six characters');
  try{ await api('/password',{method:'POST',body:{current:c,password:n}}); toast('Password changed'); await load() }
  catch(e){ toast(e.message) }
}

function bind(){
  const m=$('#main');
  $$('[data-dans]',m).forEach(b=>b.onclick=()=>{ const [no,a]=b.dataset.dans.split('|'); dmgAnswer(no,a) });
  // orders from the shop
  $$('[data-done]',m).forEach(b=>b.onclick=()=>completeOrder(b.dataset.done,false));
  $$('[data-edit]',m).forEach(b=>b.onclick=()=>{ const o=st.me.pos.find(x=>x.no===b.dataset.edit); st.edit=st.edit||{};
    st.edit[o.no]={lines:o.lines.map(l=>({...l,price:l.price||''})),invoice:'',note:''}; render() });
  const ed=(v)=>{ const [no,i]=v.split('|'); return [st.edit[no],+i] };
  $$('[data-eq]',m).forEach(el=>el.oninput=()=>{ const [e,i]=ed(el.dataset.eq); e.lines[i].qty=el.value });
  $$('[data-ep]',m).forEach(el=>el.oninput=()=>{ const [e,i]=ed(el.dataset.ep); e.lines[i].price=el.value });
  $$('[data-eq],[data-ep]',m).forEach(el=>el.onblur=()=>render());
  $$('[data-ed]',m).forEach(b=>b.onclick=()=>{ const [e,i]=ed(b.dataset.ed); e.lines.splice(i,1); render() });
  $$('[data-einv]',m).forEach(el=>el.oninput=()=>{ st.edit[el.dataset.einv].invoice=el.value });
  $$('[data-enote]',m).forEach(el=>el.oninput=()=>{ st.edit[el.dataset.enote].note=el.value });
  $$('[data-esave]',m).forEach(b=>b.onclick=()=>completeOrder(b.dataset.esave,true));
  $$('[data-ecancel]',m).forEach(b=>b.onclick=()=>{ delete st.edit[b.dataset.ecancel]; render() });
  // create an order
  const cq=$('#cq'); if(cq){ cq.oninput=()=>{ const D=st.draft; D.q=cq.value; D.pick=null; const at=cq.selectionStart; render();
      const a=$('#cq'); if(a){ a.focus(); try{ a.setSelectionRange(at,at) }catch(e){} } };
    cq.onkeydown=e=>{ if(e.key==='Enter'&&st.draft.q.trim()&&!st.draft.pick){ e.preventDefault();
      const hit=(st.items||[]).find(p=>p.name.toLowerCase()===st.draft.q.trim().toLowerCase());
      st.draft.pick=hit?{desc:hit.name,pid:hit.pid,unit:hit.unit}:{desc:st.draft.q.trim(),pid:null,unit:''}; render(); const f=$('#cqty'); if(f) f.focus() } } }
  $$('[data-cpick]',m).forEach(el=>el.onclick=()=>{ const p=(st.items||[]).find(x=>x.pid===+el.dataset.cpick);
    st.draft.pick={desc:p.name,pid:p.pid,unit:p.unit}; render(); const f=$('#cqty'); if(f) f.focus() });
  $$('[data-ctyped]',m).forEach(el=>el.onclick=()=>{ st.draft.pick={desc:st.draft.q.trim(),pid:null,unit:''}; render(); const f=$('#cqty'); if(f) f.focus() });
  const cqty=$('#cqty'); if(cqty){ cqty.oninput=()=>{ st.draft.qty=cqty.value }; cqty.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const p=$('#cprice'); if(p) p.focus() } } }
  const cpr=$('#cprice'); if(cpr){ cpr.oninput=()=>{ st.draft.price=cpr.value }; cpr.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addDraftLine() } } }
  const cadd=$('#cadd'); if(cadd) cadd.onclick=addDraftLine;
  $$('[data-cq]',m).forEach(el=>el.onchange=()=>{ const v=+el.value; if(v>0) st.draft.lines[+el.dataset.cq].qty=v; else st.draft.lines.splice(+el.dataset.cq,1); render() });
  $$('[data-cp]',m).forEach(el=>el.onchange=()=>{ st.draft.lines[+el.dataset.cp].price=+el.value||0; render() });
  $$('[data-cdel]',m).forEach(b=>b.onclick=()=>{ st.draft.lines.splice(+b.dataset.cdel,1); render() });
  const cn=$('#cnote'); if(cn) cn.oninput=()=>{ st.draft.note=cn.value };
  const cs=$('#csend'); if(cs) cs.onclick=sendDraft;
  // create an order: the two ways, and the photos
  $$('[data-cmode]',m).forEach(b=>b.onclick=()=>{ st.cmode=b.dataset.cmode; st.flash=''; render() });
  const psnap=$('#psnap'); if(psnap) psnap.onclick=()=>$('#pfile').click();
  const pfile=$('#pfile'); if(pfile) pfile.onchange=()=>{ const P=st.photo;
    [...pfile.files].slice(0,6-P.photos.length).forEach(f=>shrink(f).then(d=>{ if(P.photos.length<6){ P.photos.push(d); render() } }).catch(()=>toast('Could not read that picture'))) };
  $$('[data-prm]',m).forEach(b=>b.onclick=()=>{ st.photo.photos.splice(+b.dataset.prm,1); render() });
  const pinv=$('#pinv'); if(pinv) pinv.oninput=()=>{ st.photo.inv=pinv.value };
  const pnote=$('#pnote'); if(pnote) pnote.oninput=()=>{ st.photo.note=pnote.value };
  const psend=$('#psend'); if(psend) psend.onclick=sendPhotos;
  // pending orders: edit and resend, delete; links between places
  $$('[data-resend]',m).forEach(b=>b.onclick=()=>resendOrder(b.dataset.resend));
  $$('[data-hide]',m).forEach(b=>b.onclick=()=>hideOrder(b.dataset.hide));
  $$('[data-unreplace]',m).forEach(b=>b.onclick=()=>{ st.replacing=null; st.draft={lines:[],q:'',pick:null,qty:'',price:'',note:''}; st.photo={photos:[],inv:'',note:''}; render() });
  $$('[data-goto]',m).forEach(a=>a.onclick=e=>{ e.preventDefault(); st.tab=a.dataset.goto; st.flash=''; render(); window.scrollTo(0,0) });
  // their stock
  const sq=$('#stockQ'); if(sq) sq.oninput=()=>{ st.stockQ=sq.value; const at=sq.selectionStart; render(); const n=$('#stockQ'); if(n){ n.focus(); try{ n.setSelectionRange(at,at) }catch(e){} } };
  const sa=$('#stockAgain'); if(sa) sa.onclick=()=>{ st.stock=null; loadStock() };
  const sk=$('#stockAsk'); if(sk) sk.onclick=async()=>{ sk.disabled=true; sk.textContent='Asking…';
    try{ const j=await api('/stock/ask',{method:'POST',body:{note:(($('#stockAskNote')||{}).value||'').trim()}});
      if(j.open){ st.me=await api('/me'); }
      else { st.me.stockAsk=j.stockAsk||{state:'waiting',at:'just now'}; toast(j.already?'You have already asked — the shop will answer soon':'Asked — the shop will see it in their Approvals'); }
    }catch(e){ toast(e.message||'Could not ask just now'); sk.disabled=false; sk.textContent='Ask the shop to open my stock'; return }
    render() };
  $$('[data-stockadd]',m).forEach(b=>b.onclick=()=>{ const l=stockLineByKey(b.dataset.stockadd); if(!l) return; const inp=b.closest('td').querySelector('.stqin'); stockOrder(l, inp?+inp.value||0:0); });
  $$('.stqin',m).forEach(el=>el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=el.closest('td').querySelector('[data-stockadd]'); if(b) b.click(); } });
  const saa=$('#stockAddAll'); if(saa) saa.onclick=addAllShownToOrder;
  const sr=$('#stockReview'); if(sr) sr.onclick=()=>{ st.tab='create'; st.cmode='items'; st.flash=''; render(); window.scrollTo(0,0); };
  // payment portal
  $$('[data-paypick]',m).forEach(cb=>cb.onchange=()=>{ st.payPick=st.payPick||{};
    if(cb.checked) st.payPick[cb.dataset.paypick]={claim:'',note:''}; else delete st.payPick[cb.dataset.paypick];
    render() });
  $$('[data-payamt]',m).forEach(el=>{ el.oninput=()=>{ st.payPick[el.dataset.payamt].claim=el.value }; el.onblur=()=>render() });
  $$('[data-paynote]',m).forEach(el=>el.oninput=()=>{ st.payPick[el.dataset.paynote].note=el.value });
  const pn=$('#payNote'); if(pn) pn.oninput=()=>{ st.payNote=pn.value };
  const ag=$('#payAgain'); if(ag) ag.onclick=()=>{ st.paySent=null; render() };
  const ps=$('#paySend'); if(ps) ps.onclick=askToBePaid;
  // account
  const au=$('#aUserGo'); if(au) au.onclick=changeUser;
  const ap=$('#aPassGo'); if(ap) ap.onclick=changePass;
  const ts=$('#tmSend'); if(ts) ts.onclick=askForPerson;
  const ta=$('#teamAgain'); if(ta) ta.onclick=()=>{ st.teamSent=null; render() };
}

/* Goods of theirs that came in broken. The value came off what the shop owes them the moment it
   was raised, so a rep who cannot see why the figure moved would otherwise have to ring and ask. */
const DMG_SAID={held:['Waiting to go back','warn'],sent:['Sent back to you','blue'],
  refused:['You turned it down','bad'],credited:['Credited','ok'],replaced:['Replaced','ok']};
function damageCard(){
  const list=(st.me.damages||[]).filter(d=>['held','sent'].includes(d.status));
  if(!list.length) return '';
  const tag=(s)=>{ const d=DMG_SAID[s]||['',''];  return `<span class="tag ${d[1]}">${d[0]||esc(s)}</span>` };
  return `<div class="card"><h2>Damaged goods</h2>
   <div class="muted" style="margin-bottom:10px">${list.length} item${list.length===1?'':'s'} of yours came in
    broken or faulty, worth ${money(st.me.damageValue||0)}. That has already been taken off your outstanding
    above. Ring the counter if you want to see them.</div>
   <button class="btn dark" data-go="dmg">See and answer them</button></div>`;
}
/* Every return of theirs: open ones first, with an answer for each. Their answer goes to the shop, which
   moves the return on (sent back, credited, replaced) — the status here follows the shop's. */
const DMG_ANS=[['replace','We will replace it'],['credit','We will credit it'],['collected','We have collected it'],['reject','Not accepted']];
function dmgPage(){
  const me=st.me, list=me.damages||[], open=list.filter(d=>['held','sent'].includes(d.status)), done=list.filter(d=>!['held','sent'].includes(d.status));
  const tag=(s)=>{ const d=DMG_SAID[s]||['',''];  return `<span class="tag ${d[1]}">${d[0]||esc(s)}</span>` };
  const said={replace:'You said you will replace it',credit:'You said you will credit it',collected:'You said you have collected it',reject:'You said it is not accepted'};
  const row=(d)=>`<div class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>${esc(d.item)}</b> × ${d.qty}
      <div class="muted">${esc(d.no)} · ${esc(d.code)} · ${esc(d.date)}${['held','sent'].includes(d.status)?' · waiting '+d.days+' day'+(d.days===1?'':'s'):''}</div></div>${tag(d.status)}</div>
    <div style="margin:6px 0">${d.warranty?'<span class="tag warn">a customer brought it back under warranty</span>':'<span class="tag">arrived damaged</span>'}</div>
    <div>${esc(d.fault||d.reason)}${d.itemSerial?' · S/N '+esc(d.itemSerial):''}${d.note?'<div class="muted">'+esc(d.note)+'</div>':''}</div>
    <div class="kv"><span class="muted">Worth</span><b>${money(d.value)}${d.offBill?'':' <span class="muted">(not taken off your outstanding — a replacement piece is needed)</span>'}</b></div>
    ${d.said?`<div class="notice">${said[d.said.action]||esc(d.said.action)}${d.said.ref?' — credit note '+esc(d.said.ref):''}${d.said.note?' — '+esc(d.said.note):''}</div>`
      :d.asked?'<div class="notice">Your answer is with the shop.</div>'
      :['held','sent'].includes(d.status)?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${DMG_ANS.map(([k,l])=>`<button class="btn ${k==='reject'?'':'dark'}" data-dans="${esc(d.no)}|${k}">${l}</button>`).join('')}</div>`:''}
  </div>`;
  return `${me.damageHold?`<div class="notice" style="margin-bottom:12px"><b>Payments are on hold</b> while ${open.length} return${open.length===1?' is':'s are'} open. Answer each one below — the shop releases payments once they are settled.</div>`:''}
   <div class="card"><div class="kv"><span class="muted">Open returns</span><b>${open.length}</b></div><div class="kv"><span class="muted">Already off your outstanding</span><b>${money(me.damageValue||0)}</b></div></div>
   ${open.length?open.map(row).join(''):'<div class="card muted">Nothing open — thank you.</div>'}
   ${done.length?`<h2 style="margin-top:18px">Settled lately</h2>${done.map(row).join('')}`:''}`;
}
async function dmgAnswer(no,action){
  const ask=action==='credit'?'The credit note number':action==='reject'?'Why is it not accepted?':'A note for the shop (optional)';
  const v=prompt(ask,''); if(v===null) return;
  const body={action}; if(action==='credit') body.ref=v.trim(); else body.note=v.trim();
  try{ await api('/dmg/'+encodeURIComponent(no)+'/respond',{method:'POST',body}); toast('Sent to the shop'); await load() }
  catch(e){ toast(e.message) }
}
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const g=c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',0.82)) }; img.onerror=rej; img.src=URL.createObjectURL(file) }) }
/* Signing in: by the user name the shop gave you, or the old way with the mobile on file and a
   texted code. Forgotten sends a code to the number kept against that sign-in. */
function signIn(then){
  const el=document.createElement('div'); el.className='sheet';
  let phone=st.phone||'', stage='user', hint='', name='', user=ls.get('user')||'';
  /* asking the shop to open the page: a code to the mobile on file, then the ask */
  let offer=false, askCoded=false, askName='', askNote='';
  const closed=(m)=>/not opened|switched your page off|closed this page/i.test(String(m||''));
  const draw=()=>{
    const titles={user:'Sign in',phone:'Your mobile',code:'The code we sent',forgot:'Forgotten your password',reset:'A new password',ask:'Ask the shop to open your page',asked:'Asked'};
    el.innerHTML=`<div class="box"><h2 style="margin-bottom:2px">${titles[stage]}</h2>
    <div class="muted" style="margin-bottom:12px">${
      stage==='user'?'The user name the shop gave you.'
      :stage==='phone'?'The number the shop has on file for your company.'
      :stage==='forgot'?'We will text a code to the number on that sign-in.'
      :stage==='reset'?'The code we texted you, and the password you want from now on.'
      :stage==='ask'?(askCoded?'The code we texted to '+esc(phone)+' — then the shop is asked.':'Your page is not open yet. We text a code to the mobile the shop has for you, then ask the shop to open it. You are texted when it is.')
      :stage==='asked'?'':'Sent to '+esc(phone)+(name?' — '+esc(name):'')+'. It works for 5 minutes.'}</div>
    ${offer&&(stage==='user'||stage==='phone')?`<div class="ask-offer"><b>Your page is not open yet</b><span>The shop has not switched it on for you.</span><button class="btn tape" id="sAsk">Ask the shop to open it</button></div>`:''}
    ${stage==='user'?`<div class="f"><label>User name</label><input id="sUser" value="${esc(user)}" autocapitalize="off" spellcheck="false" autocomplete="username"></div>
       <div class="f"><label>Password</label><input id="sPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>`
     :stage==='phone'?`<div class="f"><label>Mobile</label><input id="sPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel" data-phone></div>`
     :stage==='forgot'?`<div class="f"><label>User name</label><input id="sFUser" value="${esc(user)}" autocapitalize="off" spellcheck="false"></div>`
     :stage==='reset'?`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}
       <div class="f code"><label>Code</label><input id="sFCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" data-otp data-otp-next="#sFPass"></div>
       <div class="f"><label>New password</label><input id="sFPass" type="password" autocomplete="new-password" placeholder="at least six characters"></div>`
     :stage==='ask'?(askCoded
       ?`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="f code"><label>Code</label><input id="sACode" data-otp data-otp-go="#sGo" inputmode="numeric" maxlength="6" autocomplete="one-time-code"></div>`
       :`<div class="f"><label>Mobile</label><input id="sPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel" data-phone></div>
         <div class="f"><label>Your name (optional)</label><input id="sAName" value="${esc(askName)}" placeholder="e.g. Nimal, sales rep"></div>
         <div class="f"><label>A note for the shop (optional)</label><input id="sANote" value="${esc(askNote)}" placeholder="e.g. we supply your paints"></div>`)
     :stage==='asked'?`<div class="ask-done"><span class="tick">✓</span><b>The shop has your request</b><span>When they open your page you will get a text with the way in. Nothing more to do now.</span></div>`
     :`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="f code"><label>Code</label><input id="sCode" data-otp data-otp-go="#sGo" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>`}
    <div style="display:flex;gap:8px;margin-top:6px">${stage==='asked'?'':'<button class="btn" id="sX">Cancel</button>'}
     <button class="btn tape" id="sGo" style="flex:1">${stage==='user'?'Sign in':stage==='phone'?'Text me a code':stage==='forgot'?'Text me a code':stage==='reset'?'Set it':stage==='ask'?(askCoded?'Send to the shop':'Text me a code'):stage==='asked'?'Close':'Sign in'}</button></div>
    <div class="muted" style="margin-top:10px">${
      stage==='user'?'<a href="#" id="sForgot">Forgotten your password?</a> · <a href="#" id="sPhoneWay">use my mobile instead</a>'
      :stage==='phone'?'<a href="#" id="sUserWay">sign in with a user name</a>'
      :stage==='code'?'<a href="#" id="sBack">Wrong number?</a>'
      :stage==='asked'?'':'<a href="#" id="sUserWay">back</a>'}</div></div>`;
    const x=$('#sX',el); if(x) x.onclick=()=>el.remove();
    const go=(s)=>e=>{ e.preventDefault(); stage=s; draw() };
    const bk=$('#sBack',el); if(bk) bk.onclick=go('phone');
    const fw=$('#sForgot',el); if(fw) fw.onclick=go('forgot');
    const pw=$('#sPhoneWay',el); if(pw) pw.onclick=go('phone');
    const uw=$('#sUserWay',el); if(uw) uw.onclick=e=>{ e.preventDefault(); stage='user'; askCoded=false; draw() };
    const ak=$('#sAsk',el); if(ak) ak.onclick=()=>{ stage='ask'; askCoded=false; hint=''; draw() };
    const an=$('#sAName',el); if(an) an.oninput=()=>{ askName=an.value };
    const ao=$('#sANote',el); if(ao) ao.oninput=()=>{ askNote=ao.value };
    $('#sGo',el).onclick=step; const inp=$('input',el); if(inp) inp.focus();
    $$('input',el).forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();step()} });
    // the mobile and the code, dressed (otp-ui.js): spaced number and network, six code boxes
    if(window.RegalOTP){ RegalOTP.auto(el); const first=$('.ro-code input',el)||$('.ro-phone input',el); if(first) first.focus() } };
  const step=async()=>{ const go=$('#sGo',el); go.disabled=true;
    try{
      if(stage==='asked'){ el.remove(); return }
      if(stage==='ask'){
        if(!askCoded){ phone=$('#sPh',el).value.replace(/\D/g,''); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567');
          const j=await api('/ask-code',{method:'POST',body:{phone}}); hint=j.sent?'':(j.code||''); if(!j.sent&&!j.code) throw new Error(j.note||'Could not text you — please ring the shop');
          askCoded=true; return draw() }
        const code=$('#sACode',el).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code');
        await api('/ask',{method:'POST',body:{phone,code,name:askName,note:askNote}});
        if(window.RegalOTP){ RegalOTP.ok('#sACode'); await new Promise(r=>setTimeout(r,600)) }
        stage='asked'; offer=false; return draw();
      }
      if(stage==='user'){
        user=$('#sUser',el).value.trim(); const password=$('#sPass',el).value;
        if(!user||!password) throw new Error('Your user name and password, please');
        const j=await api('/signin',{method:'POST',body:{user,password}});
        st.token=j.token; st.rep=j.rep||st.rep; ls.set('token',j.token); ls.set('user',user); ls.set('rep',st.rep);
        el.remove(); toast('Welcome, '+(j.rep||j.supplier)); return then&&then();
      }
      if(stage==='forgot'){
        user=$('#sFUser',el).value.trim(); if(!user) throw new Error('Which user name?');
        const j=await api('/forgot',{method:'POST',body:{user}}); hint=j.sent?'':(j.code||''); if(!j.sent&&!j.code) throw new Error(j.note||'Could not text you — please ring the shop'); stage='reset'; return draw();
      }
      if(stage==='reset'){
        await api('/reset',{method:'POST',body:{user,code:$('#sFCode',el).value.trim(),password:$('#sFPass',el).value}});
        toast('That is your password now'); stage='user'; return draw();
      }
      if(stage==='phone'){ phone=$('#sPh',el).value.replace(/\D/g,''); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567');
        const j=await api('/otp',{method:'POST',body:{phone}}); hint=j.sent?'':(j.code||''); if(!j.sent&&!j.code) throw new Error(j.note||'Could not text you — please ring the shop'); name=j.name||''; stage='code'; return draw() }
      const code=$('#sCode',el).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code');
      const j=await api('/login',{method:'POST',body:{phone,code}}); if(window.RegalOTP){ RegalOTP.ok('#sCode'); await new Promise(r=>setTimeout(r,650)) } st.token=j.token; st.rep=j.rep||''; ls.set('rep',st.rep); st.phone=phone; ls.set('token',j.token); ls.set('phone',phone); el.remove(); toast('Welcome, '+(st.rep||j.supplier)); if(then) then() }
    catch(e){
      // a page not switched on: offer to ask, rather than leave them at a closed door
      if(closed(e.message)&&(stage==='phone'||stage==='user'||stage==='code')){ offer=true; if(stage==='code') stage='phone'; draw(); toast(e.message); return }
      toast(e.message); go.disabled=false; if(window.RegalOTP){ if(stage==='code') RegalOTP.fail('#sCode'); else if(stage==='reset') RegalOTP.fail('#sFCode'); else if(stage==='ask'&&askCoded) RegalOTP.fail('#sACode') } } };
  document.body.appendChild(el); draw();
}
async function load(){ if(!st.token) return render(); try{ st.me=await api('/me') }catch(e){ if(st.token) toast(e.message); st.me=null } render() }
/* what the shop does shows here within seconds: read again every 15 seconds while the page is in
   front, and at once when it comes back to the front — never while something is being filled in */
const quiet=()=>{ const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  return st.token&&!st.busy&&!typing&&!document.hidden&&!(st.edit&&Object.keys(st.edit).length)&&!(st.draft&&st.draft.lines.length)&&!(st.photo&&st.photo.photos.length) };
load(); setInterval(()=>{ if(quiet()) load() },15000);
document.addEventListener('visibilitychange',()=>{ if(quiet()) load() });
</script>
</body>
