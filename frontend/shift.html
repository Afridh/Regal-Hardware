<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Clock — Regal Hardware</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#101E22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="sl-holidays.js"></script>
<style>
:root{
 --ink:#101E22; --ink2:#1B2E33; --steel:#5A6E72; --faint:#8C9CA0;
 --page:#EEF1F0; --panel:#F7F9F8; --white:#fff; --line:#D8DEDD; --line2:#EAEEED;
 --brand:#9E2A31; --brand2:#C33A42; --gold:#F0A81E;
 --work:#10B981; --late:#F59E0B; --brk:#6366F1; --done:#64748B; --abs:#EF4444; --ot:#0EA5A4; --pend:#EAB308;
 --r:10px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);background:var(--page);
 background-image:radial-gradient(1100px 520px at 10% -10%,#FFFDF7 0%,transparent 60%),radial-gradient(900px 480px at 100% 0%,#E6F1F3 0%,transparent 55%);
 background-attachment:fixed;font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
 font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit}
.hide{display:none!important}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--steel);font-size:12.5px}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:9px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13.5px;
 display:inline-flex;align-items:center;gap:6px;justify-content:center;transition:transform .14s var(--ease),box-shadow .14s,filter .14s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(16,30,34,.14)}
.btn:active{transform:translateY(0) scale(.97)}
.btn.go{background:linear-gradient(180deg,#14C08A,#0E9F72);border-color:#0E9F72}
.btn.stop{background:linear-gradient(180deg,#C33A42,#9E2A31);border-color:#9E2A31}
.btn.tape{background:linear-gradient(180deg,#F7BB3C,#EFA412);border-color:#D08F09;color:#2A2103}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.42;cursor:default;transform:none;box-shadow:none}

/* ---- the top bar ---- */
.top{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,#0C171A,#14262B 55%,#1B3238);color:#fff;box-shadow:0 6px 24px rgba(16,30,34,.25)}
.top-in{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;border-radius:10px;background:#fff;padding:3px;object-fit:contain;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.brand b{display:block;font:800 16px Archivo,sans-serif;letter-spacing:.02em}
.brand span{display:block;font-size:11.5px;color:#9FB3B8}
.clock{margin-left:auto;text-align:right}
.clock .t{font:700 26px 'IBM Plex Mono',monospace;letter-spacing:.02em;color:var(--gold);line-height:1}
.clock .t i{font-style:normal;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.clock .d{font-size:11.5px;color:#9FB3B8;margin-top:3px}
.who{display:flex;align-items:center;gap:8px;padding-left:14px;border-left:1px solid rgba(255,255,255,.1)}
.who .av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;font:800 12px Archivo,sans-serif}
.who small{display:block;font-size:10.5px;color:#9FB3B8}.who b{font-size:13px}
.who button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:8px;padding:5px 9px;font-size:11.5px;cursor:pointer}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:#CBD5E1}
.sync i{width:8px;height:8px;border-radius:50%;background:#94A3B8}
.sync.live i{background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ping 2s infinite}
.sync.bad i{background:#F87171}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}80%,100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}

main{max-width:1240px;margin:0 auto;padding:16px 16px 70px}

/* ---- the day ---- */
.day{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.stat{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;overflow:hidden;cursor:pointer;
 transition:transform .16s var(--ease),box-shadow .16s,border-color .16s;animation:rise .45s var(--ease) both}
.stat:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(16,30,34,.08)}
.stat.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 25%,transparent)}
.stat::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:50%;background:var(--c);opacity:.09}
.stat .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);display:flex;align-items:center;gap:6px}
.stat .l i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.stat .v{font:800 28px Archivo,sans-serif;line-height:1.1;margin-top:4px}
.stat .s{font-size:11.5px;color:var(--steel)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.dayline{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;animation:rise .45s var(--ease) both .1s}
.dl-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--steel);margin-bottom:8px}
.dl-head b{color:var(--ink)}
.dl-bar{position:relative;height:14px;border-radius:99px;background:var(--line2);overflow:hidden}
.dl-fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#0E9F72,#14C08A);transition:width 1s var(--ease)}
.dl-brk{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(99,102,241,.55) 0 4px,rgba(99,102,241,.3) 4px 8px)}
.dl-now{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 3px rgba(158,42,49,.18)}
.dl-ticks{position:relative;height:18px;margin-top:4px;font-size:10.5px;color:var(--faint)}
.dl-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.note{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;animation:rise .4s var(--ease) both}
.note.bad{background:#FEE2E2;border-color:#FECACA;color:#B91C1C}

/* ---- filters ---- */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:all .14s}
.chip b{font-family:Archivo,sans-serif}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.search{position:relative;margin-left:auto;flex:0 1 300px;min-width:180px}
.search input{width:100%;font:inherit;font-size:15px;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(240,168,30,.15)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint)}

/* ---- the people ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden;
 box-shadow:0 1px 3px rgba(0,0,0,.04);transition:box-shadow .18s,border-color .18s,transform .18s var(--ease)}
.card:hover{box-shadow:0 12px 26px rgba(16,30,34,.09);transform:translateY(-2px)}
.card.enter{animation:rise .5s var(--ease) both;animation-delay:calc(var(--i,0)*40ms)}
.card.flash{animation:flash 1.1s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}100%{box-shadow:0 0 0 14px color-mix(in srgb,var(--c) 0%,transparent)}}
.card::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--c)}
.c-top{display:flex;gap:11px;align-items:center}
.ring{position:relative;width:48px;height:48px;flex:0 0 48px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p,0)*1%),var(--line2) 0)}
.ring span{width:100%;height:100%;border-radius:50%;background:var(--ink);color:var(--gold);display:grid;place-items:center;font:800 15px Archivo,sans-serif;border:2px solid #fff}
.ring.live::after{content:"";position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid #fff;animation:ping2 1.6s infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}80%,100%{box-shadow:0 0 0 7px transparent}}
.c-meta{flex:1;min-width:0}
.c-name{font:800 15.5px Archivo,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-role{font-size:11.5px;color:var(--steel)}
.pill{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,#fff);color:color-mix(in srgb,var(--c) 75%,#000);white-space:nowrap}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel);color:var(--steel);border:1px solid var(--line2)}
.tag.late{background:#FEF3C7;color:#92400E;border-color:#FCD34D}.tag.ot{background:#CCFBF1;color:#0F766E;border-color:#5EEAD4}.tag.xb{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
.big{display:flex;align-items:baseline;gap:8px}
.big b{font:800 30px 'IBM Plex Mono',monospace;letter-spacing:-.02em;line-height:1}
.big span{font-size:12px;color:var(--steel)}
.tl{position:relative;height:10px;border-radius:99px;background:var(--line2);overflow:hidden}
.tl i{position:absolute;top:0;bottom:0}
.tl .w{background:var(--work)}.tl .b{background:var(--brk)}.tl .lt{background:repeating-linear-gradient(45deg,#FCD34D 0 3px,#FDE68A 3px 6px)}.tl .o{background:var(--ot)}
.tl .n{width:2px;background:var(--brand);top:-2px;bottom:-2px}
.tl-key{display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:-6px}
.breaks{display:flex;gap:6px;flex-wrap:wrap}
.bk{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;gap:6px;align-items:center;transition:all .14s}
.bk:hover{border-color:var(--brk);background:#EEF2FF;color:#3730A3}
.bk.done{background:#F0FDF4;border-color:#BBF7D0;color:#166534;cursor:default}
.onbreak{background:linear-gradient(135deg,#EEF2FF,#F5F3FF);border:1px solid #C7D2FE;border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px}
.onbreak .cup{font-size:24px;animation:steam 2s ease-in-out infinite}
@keyframes steam{50%{transform:translateY(-3px) rotate(-4deg)}}
.onbreak b{display:block;font-size:13px}.onbreak small{color:var(--steel)}
.onbreak .btn{margin-left:auto}
.ask{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px;font-size:12.5px;color:#92400E}
.acts{display:flex;gap:8px;margin-top:auto}
.acts .btn{flex:1;padding:11px 12px;font-size:13.5px}
.more{border:0;background:none;color:var(--steel);font-size:12px;font-weight:600;cursor:pointer;padding:4px;display:flex;gap:4px;align-items:center;justify-content:center;border-top:1px dashed var(--line2);padding-top:8px}
.more:hover{color:var(--ink)}
.det{display:grid;gap:10px;animation:rise .3s var(--ease) both}
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mx div{background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:7px 9px}
.mx span{display:block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--steel)}
.mx b{font-size:13px}.mx b.late{color:#B45309}.mx b.ot{color:#0F766E}
.log{font-size:12px;display:grid;gap:4px}
.log div{display:flex;gap:8px;align-items:center}.log i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--c,#94A3B8)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:74px;padding-top:4px}
.week div{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.week u{text-decoration:none;display:block;width:100%;max-width:26px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,#14C08A,#0E9F72);min-height:3px;transform-origin:bottom;animation:grow .6s var(--ease) both}
.week u.off{background:var(--line)}.week u.abs{background:var(--abs)}
.week small{font-size:10px;color:var(--steel)}.week em{font-style:normal;font-size:9.5px;color:var(--faint)}
@keyframes grow{from{transform:scaleY(0)}}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:16px;padding:44px 16px;color:var(--steel)}
.empty h3{margin:0 0 4px;color:var(--ink);font-family:Archivo,sans-serif}
.skel{height:220px;border-radius:16px;background:linear-gradient(90deg,#fff 0%,#F4F7F6 40%,#fff 80%);background-size:200% 100%;animation:sh 1.2s linear infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* ---- the moment a punch lands ---- */
.burst{position:fixed;inset:0;z-index:400;display:grid;place-items:center;pointer-events:none}
.burst .in{background:#fff;border-radius:22px;padding:22px 30px;text-align:center;box-shadow:0 30px 80px rgba(16,30,34,.3);animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.burst.out .in{animation:fade .35s ease forwards}
.burst .tick{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--c);display:grid;place-items:center;color:#fff;font-size:32px;box-shadow:0 0 0 0 var(--c);animation:ring 1s ease .2s}
.burst b{display:block;font:800 22px Archivo,sans-serif}.burst span{color:var(--steel);font-size:13.5px}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
@keyframes fade{to{opacity:0;transform:scale(.95)}}
@keyframes ring{to{box-shadow:0 0 0 22px transparent}}

/* dialogs */
.veil{position:fixed;inset:0;z-index:300;background:rgba(16,30,34,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade2 .2s ease both}
@keyframes fade2{from{opacity:0}}
.dlg{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:pop .35s var(--ease) both}
.dlg h2{margin:0 0 6px;font-family:Archivo,sans-serif;font-size:18px}
.dlg p{margin:0 0 14px;color:var(--steel);font-size:13.5px}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:4px}
.dlg input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;outline:none}
.dlg input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(158,42,49,.12)}
.dlg .err{color:#B42318;font-size:13px;min-height:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:500;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;max-width:calc(100vw - 32px);transition:.25s var(--ease);pointer-events:none;box-shadow:0 12px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:640px){
 .top-in{gap:10px}.clock .t{font-size:21px}.brand span{display:none}
 .who{border-left:0;padding-left:0;width:100%;justify-content:space-between}
 .grid{grid-template-columns:1fr}.search{flex:1 1 100%;margin-left:0}
 .stat .v{font-size:24px}.mx{grid-template-columns:repeat(2,1fr)}
}

/* ---- the sign-in: the till's lock screen ---- */
.lock{position:fixed;inset:0;background:#FAFBFD;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.lock-ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.lock-mesh{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(rgba(148,163,184,.28) 1.2px,transparent 1.2px);background-size:28px 28px}
.lock-glow{position:absolute;border-radius:50%;filter:blur(85px);opacity:.75;will-change:transform;pointer-events:none}
.lock-glow-1{width:640px;height:640px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(224,80,92,.18) 0%,rgba(224,80,92,0) 70%);animation:calmFloat1 24s ease-in-out infinite alternate}
.lock-glow-2{width:720px;height:720px;bottom:-120px;right:-100px;background:radial-gradient(circle,rgba(139,35,41,.12) 0%,rgba(139,35,41,0) 70%);animation:calmFloat2 28s ease-in-out infinite alternate}
.lock-glow-3{width:580px;height:580px;bottom:12%;left:18%;background:radial-gradient(circle,rgba(240,140,150,.10) 0%,rgba(240,140,150,0) 70%);animation:calmFloat3 22s ease-in-out infinite alternate}
@keyframes calmFloat1{0%{transform:translate(0,0) scale(1)}50%{transform:translate(50px,35px) scale(1.08)}100%{transform:translate(-30px,60px) scale(.96)}}
@keyframes calmFloat2{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-45px,-35px) scale(1.06)}100%{transform:translate(30px,-55px) scale(.95)}}
@keyframes calmFloat3{0%{transform:translate(0,0) scale(.96)}50%{transform:translate(40px,-30px) scale(1.1)}100%{transform:translate(-25px,25px) scale(1)}}
.lockbox{position:relative;z-index:2;background:#FFFFFF;border:1px solid rgba(226,232,240,.9);border-top:4px solid #8B2329;border-radius:18px;padding:36px 32px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 50px -12px rgba(15,23,42,.08),0 8px 24px -6px rgba(15,23,42,.04),0 0 0 1px rgba(255,255,255,.8) inset;animation:lockboxIn .45s cubic-bezier(.16,1,.3,1) both}
@keyframes lockboxIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.lockmark{display:flex;justify-content:center;align-items:center;margin-bottom:10px}
.locklogo{height:68px;width:auto;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(139,35,41,.12));transition:transform .3s ease}
.locklogo:hover{transform:scale(1.03)}
.lockname{font-family:Archivo,sans-serif;font-weight:800;font-size:25px;letter-spacing:.02em;color:#0F172A;line-height:1.1;margin-bottom:4px}
.locksub{color:#64748B;font-size:12px;margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:6px 12px;flex-wrap:wrap;line-height:1.4}
.locksub-item{display:inline-flex;align-items:center;gap:6px}
.lockdot{width:7px;height:7px;border-radius:50%;background:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.18);display:inline-block;flex-shrink:0}
.lock-input{width:100%;font-size:14.5px;padding:10.5px 13px;border:1px solid #CBD5E1;border-radius:9px;box-sizing:border-box;background:#F8FAFC;color:#0F172A;transition:border-color .2s,box-shadow .2s,background-color .2s;font-family:inherit}
.lock-input:focus{outline:none;border-color:#8B2329;background:#FFFFFF;box-shadow:0 0 0 3.5px rgba(139,35,41,.12)}
/* the user code + PIN lock screen */
.pinlock .pin-stage{position:relative;z-index:2;width:100%;max-width:400px}
.pinbox.hide{display:none}
.pinbox.leave{animation:pin-out .26s ease forwards}
.pinbox.enter{animation:pin-in .45s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes pin-out{to{opacity:0;transform:translateX(-40px) scale(.96)}}
@keyframes pin-in{from{opacity:0;transform:translateX(40px) scale(.96)}}

<body>

<header class="top hide" id="top">
  <div class="top-in">
    <div class="brand"><img src="regal-logo.png" alt=""><div><b>Shift Clock</b><span>Regal Hardware · attendance &amp; breaks</span></div></div>
    <div class="clock"><div class="t" id="clk">--<i>:</i>--</div><div class="d" id="clkD"></div></div>
    <div class="who"><div class="av" id="whoAv">··</div><div><small><span class="sync" id="sync"><i></i><span id="syncTxt">Connecting…</span></span></small><b id="whoName"></b></div>
      <button onclick="signOut()" title="Sign this device out">Sign out</button></div>
  </div>
</header>

<main id="app" class="hide">
  <div id="notice"></div>
  <section class="day">
    <div class="stats" id="stats"></div>
    <div class="dayline" id="dayline"></div>
  </section>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Find someone — name or code" autocomplete="off"></label>
  </div>
  <div class="grid" id="grid"></div>
</main>
<div id="toast"></div>

<script>
/* The shift clock. It shows the same staff and the same attendance as the Attendance screen in the
   shop system (/pos) — one set of records on the server. A punch here is saved as that one record and
   the till picks it up within a couple of seconds; anything done at the till, or on another phone, shows
   here the same way. The owner or an admin signs in once on the device, the till's way: their user code,
   then their PIN or a texted code (or name and password). The sign-in is the shift page's own and lasts
   30 days, so it never signs them out of their till. */
const API = '/api';
const TOKEN_KEY = 'regal_shift_token';
const CACHE_KEY = 'regal_shift_cache';
const POLL_MS = 2000;
const DEFAULTS = {
  startTime: '08:00', closeTime: '19:30', graceMin: 0, weeklyOff: [],
  breaks: [
    { id: 'b1', name: 'Breakfast', start: '08:30', end: '08:45', mins: 15, extra: 0, paid: true },
    { id: 'b2', name: 'Lunch', start: '12:30', end: '13:00', mins: 30, extra: 0, paid: true },
    { id: 'b3', name: 'Evening Tea', start: '15:30', end: '15:40', mins: 10, extra: 0, paid: true }
  ]
};
const COL = { working: 'var(--work)', late: 'var(--late)', break: 'var(--brk)', leave_pending: 'var(--pend)', leave_early: '#3B82F6', done: 'var(--done)', absent: 'var(--abs)', leave: '#3B82F6', out: '#94A3B8' };

let token = ''; try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
let me = null;
let S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } };
let rev = 0, pollT = null, loading = false, online = null, filter = 'all', firstDraw = true;
const openDetails = new Set(), lastState = {};

/* ---------------- time, the way the till counts it ---------------- */
const pad = n => String(n).padStart(2, '0');
const D = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(Math.round(m % 60));
const hrs = m => (m || 0) / 60;
const dur = m => { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m / 60)}h ${pad(m % 60)}m`; };
const fmtMin = m => { m = Math.max(0, Math.round(m || 0)); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ampm = t => { const m = toMin(t), h = Math.floor(m / 60) % 24; return `${h % 12 || 12}:${pad(m % 60)} ${h < 12 ? 'AM' : 'PM'}`; };

function set() {
  const s = { ...DEFAULTS, ...(S.shift.settings || {}) };
  if (!(S.shift.settings || {}).slCalendar) s.weeklyOff = [];
  if (!s.breaks || !s.breaks.length) s.breaks = DEFAULTS.breaks;
  return s;
}
const stdMin = () => Math.max(60, toMin(set().closeTime) - toMin(set().startTime)
  - set().breaks.filter(b => !b.paid).reduce((a, b) => a + (toMin(b.end) - toMin(b.start)), 0));
const recOf = (ds, id) => ((S.shift.days || {})[ds] || {})[id];
const holidayOf = ds => window.slHoliday ? window.slHoliday(S.shift, ds) : null;
const isOff = ds => !(S.shift.openDays || []).includes(ds)
  && ((set().weeklyOff || []).includes(new Date(ds + 'T00:00').getDay()) || !!holidayOf(ds));

/* index.html empState */
function state(ds, id) {
  const r = recOf(ds, id);
  if (r && r.status === 'absent') return 'absent';
  if (r && r.status === 'leave') return 'leave';
  if (r && r.leaveEarly && r.leaveEarly.pending) return 'leave_pending';
  if (r && (r.breaks || []).some(b => !b.end)) return 'break';
  if (r && r.in && !r.out) return 'working';
  if (r && r.in && r.out) return (r.leaveEarly && r.leaveEarly.approved) ? 'leave_early' : 'done';
  return 'out';
}

/* index.html dayFigures: the same figures the till's Attendance screen shows */
function figures(ds, id) {
  const r = recOf(ds, id);
  const f = { status: r ? r.status : 'none', in: r && r.in, out: r && r.out, gross: 0, breakMin: 0, worked: 0, late: 0, ot: 0, reg: 0, over: 0 };
  if (!r || r.status !== 'work' || !r.in) return f;
  const today = ds === D();
  const now = today ? nowMin() : (r.out ? toMin(r.out) : toMin(r.in));
  const close = toMin(set().closeTime || '19:30');
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions : [{ in: r.in, out: r.out }];
  f.late = Math.max(0, toMin(sessions[0].in || r.in) - (toMin(set().startTime || '08:00') + (+set().graceMin || 0)));
  const intervals = (r.breaks || []).map(b => {
    const def = set().breaks.find(x => x.id === b.id);
    const bid = String(b.id || '').toLowerCase(), bname = String(b.name || '').toLowerCase();
    let allow = 15;
    if (bid === 'b1' || bname.includes('breakfast')) allow = 15;
    else if (bid === 'b2' || bname.includes('lunch')) allow = 30;
    else if (bid === 'b3' || bname.includes('tea')) allow = 10;
    else if (def && def.mins) allow = +def.mins;
    const bs = toMin(b.start), be = b.end ? toMin(b.end) : (today ? now : bs), d = Math.max(0, be - bs);
    if (d > allow) f.over += d - allow;
    f.breakMin += d;
    return { start: bs, end: be };
  });
  const inBreak = (a, b) => intervals.reduce((t, k) => t + Math.max(0, Math.min(k.end, b) - Math.max(k.start, a)), 0);
  sessions.forEach(s => {
    if (!s || !s.in) return;
    const sIn = toMin(s.in), sOut = s.out ? toMin(s.out) : (today ? now : sIn);
    const gross = Math.max(0, sOut - sIn);
    f.gross += gross;
    f.worked += Math.max(0, gross - inBreak(sIn, sOut));
    if (sOut > close) { const a = Math.max(sIn, close); f.ot += Math.max(0, sOut - a - inBreak(a, sOut)); }
  });
  if (f.worked > stdMin()) f.ot = Math.max(f.ot, f.worked - stdMin());
  f.reg = Math.max(0, f.worked - f.ot);
  return f;
}

/* ---------------- punching: what the till's buttons do ---------------- */
function put(ds, id, patch) {
  S.shift.days = S.shift.days || {};
  S.shift.days[ds] = S.shift.days[ds] || {};
  S.shift.days[ds][id] = { ...(S.shift.days[ds][id] || {}), ...patch, by: me ? me.name : 'shift', updatedAt: Date.now() };
  draw();
  save(ds, id);
}
const emp = id => S.employees.find(e => e.id === id) || { name: 'Staff' };
const first = n => String(n || '').split(' ')[0];

function punchIn(id) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  let sessions = Array.isArray(r.sessions) ? r.sessions.map(s => ({ ...s })) : [];
  if (r.in && (r.out || sessions.length)) {
    if (!sessions.length) sessions = [{ in: r.in, out: r.out || t }];
    if (!sessions[sessions.length - 1].out) sessions[sessions.length - 1].out = t;
    sessions.push({ in: t, out: null });
    put(ds, id, { status: 'work', in: r.in, out: null, sessions, breaks: r.breaks || [], leaveEarly: null });
    burst('var(--work)', '↻', `${first(emp(id).name)} is back`, `Checked in again at ${ampm(t)}`);
  } else {
    put(ds, id, { status: 'work', in: t, out: null, sessions: [{ in: t, out: null }], breaks: r.breaks || [], leaveEarly: null });
    const late = Math.max(0, nowMin() - toMin(set().startTime) - (+set().graceMin || 0));
    burst(late ? 'var(--late)' : 'var(--work)', '✓', `Welcome, ${first(emp(id).name)}`, late ? `Checked in at ${ampm(t)} · ${fmtMin(late)} late` : `Checked in at ${ampm(t)} · on time`);
  }
}
function punchOut(id) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t });
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions.map(s => ({ ...s })) : (r.in ? [{ in: r.in, out: null }] : []);
  if (sessions.length) sessions[sessions.length - 1].out = t;
  put(ds, id, { out: t, breaks, sessions });
  const f = figures(ds, id);
  burst('var(--done)', '👋', `Goodbye, ${first(emp(id).name)}`, `${dur(f.worked)} worked today${f.ot ? ` · ${fmtMin(f.ot)} overtime` : ''}`);
}
function mealStart(id, bid) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || r.status !== 'work' || !r.in) return toast('Check in first');
  const def = set().breaks.find(b => b.id === bid) || { name: bid };
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t }).concat([{ id: bid, name: def.name, start: t, end: null }]);
  put(ds, id, { breaks });
  toast(`${first(emp(id).name)} is on ${def.name}`);
}
function mealEnd(id) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || !r.breaks) return;
  const open = r.breaks.find(b => !b.end);
  put(ds, id, { breaks: r.breaks.map(b => b.end ? b : { ...b, end: t }) });
  toast(`${first(emp(id).name)} is back from ${open ? open.name || 'break' : 'break'}`);
}
function confirmAbsent(id) {
  const e = emp(id);
  const v = veil(`<div class="dlg"><h2>Mark ${esc(e.name)} absent?</h2>
      <p>For today, <b>${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</b>. It counts against their day's attendance and pay. Only the Super Admin can undo it, at the till.</p>
      <div class="row"><button class="btn ghost" id="abNo">Cancel</button><button class="btn stop" id="abOk">Mark absent</button></div></div>`);
  v.querySelector('#abNo').onclick = () => v.remove();
  v.querySelector('#abOk').onclick = () => { v.remove(); put(D(), id, { status: 'absent', at: hhmm(nowMin()), in: null, out: null, breaks: [], sessions: [] }); toast(`${e.name} marked absent for today`); };
}
function approveLeave(id, yes) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || !r.leaveEarly) return;
  if (yes) {
    const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions.map(s => ({ ...s })) : (r.in ? [{ in: r.in, out: null }] : []);
    if (sessions.length && !sessions[sessions.length - 1].out) sessions[sessions.length - 1].out = t;
    put(ds, id, { out: t, sessions, breaks: (r.breaks || []).map(b => b.end ? b : { ...b, end: t }),
      leaveEarly: { ...r.leaveEarly, approved: true, pending: false, approvedBy: me ? me.name : 'Admin', at: t } });
    toast(`Early leave approved for ${emp(id).name}`);
  } else { put(ds, id, { leaveEarly: null }); toast(`Early leave turned down for ${emp(id).name}`); }
}
function toggleDetails(id) { if (openDetails.has(id)) openDetails.delete(id); else openDetails.add(id); draw(); }

/* ---------------- drawing ---------------- */
const LABEL = { working: 'Working', late: 'Working · late', break: 'On break', leave_pending: 'Asking to leave', leave_early: 'Left early', done: 'Gone home', absent: 'Absent', leave: 'On leave', out: 'Not in yet' };
function rowsToday() {
  const ds = D();
  return (S.employees || []).filter(e => { if (!e || e.active === false || !e.name) return false; const n = String(e.name).toLowerCase().trim(); return n !== 'demo' && n !== 'demo user'; })
    .map(e => { const st = state(ds, e.id), f = figures(ds, e.id); return { e, st, f, r: recOf(ds, e.id) || {}, key: st === 'working' && f.late > 0 ? 'late' : st }; });
}
const FILTERS = [['all', 'Everyone', () => true], ['in', 'In the shop', x => x.st === 'working' || x.st === 'break' || x.st === 'leave_pending'], ['break', 'On break', x => x.st === 'break'],
  ['late', 'Late', x => x.f.late > 0], ['out', 'Not in yet', x => x.st === 'out'], ['done', 'Gone home', x => x.st === 'done' || x.st === 'leave_early'], ['absent', 'Absent / leave', x => x.st === 'absent' || x.st === 'leave']];

function draw() {
  const ds = D(), rows = rowsToday(), cfg = set();
  const cnt = k => rows.filter(FILTERS.find(f => f[0] === k)[2]).length;
  const workedAll = rows.reduce((a, x) => a + x.f.worked, 0), otAll = rows.reduce((a, x) => a + x.f.ot, 0);
  const stat = (k, label, v, sub, c) => `<div class="stat ${filter === k ? 'on' : ''}" style="--c:${c}" onclick="setFilter('${k}')"><div class="l"><i></i>${label}</div><div class="v" data-n="${v}">${v}</div><div class="s">${sub}</div></div>`;
  document.getElementById('stats').innerHTML =
    stat('in', 'In the shop', cnt('in'), `of ${rows.length} staff`, 'var(--work)') +
    stat('break', 'On break', cnt('break'), 'right now', 'var(--brk)') +
    stat('late', 'Late today', cnt('late'), `after ${ampm(cfg.startTime)}`, 'var(--late)') +
    stat('out', 'Not in yet', cnt('out'), 'no check-in', '#94A3B8') +
    stat('done', 'Gone home', cnt('done'), 'checked out', 'var(--done)') +
    `<div class="stat" style="--c:var(--ot);cursor:default"><div class="l"><i></i>Hours today</div><div class="v">${Math.floor(workedAll / 60)}<small style="font-size:15px">h ${pad(workedAll % 60)}m</small></div><div class="s">${otAll ? fmtMin(otAll) + ' overtime' : 'no overtime yet'}</div></div>`;
  if (firstDraw) document.querySelectorAll('.stat').forEach((s, i) => s.style.animationDelay = (i * 50) + 'ms'); else document.querySelectorAll('.stat').forEach(s => s.style.animation = 'none');

  // the shop's day: open to close, the breaks, and where we are in it
  const a = toMin(cfg.startTime), z = toMin(cfg.closeTime), now = nowMin(), span = Math.max(60, z - a), pct = m => Math.max(0, Math.min(100, (m - a) / span * 100));
  const ticks = []; for (let h = Math.ceil(a / 60); h * 60 <= z; h += 2) ticks.push(h * 60);
  const left = z - now;

/* one person's day on a bar: late gap, sessions, breaks, overtime, and now */

  const lo = Math.min(a, ...sessions.map(s => toMin(s.in))), hi = Math.max(z, now <= z + 240 ? now : z, ...sessions.map(s => s.out ? toMin(s.out) : 0));

/* the last seven days, as bars */

      <u class="${st === 'absent' ? 'abs' : !f.worked ? 'off' : ''}" style="height:${st === 'absent' ? 100 : Math.max(4, Math.min(100, f.worked / max * 100))}%;animation-delay:${(6 - k) * 50}ms"></u>

/* ---------------- the server ---------------- */
function status(txt, kind) { document.getElementById('syncTxt').textContent = txt; document.getElementById('sync').className = 'sync ' + (kind || ''); }
const OPEN_PATHS = ['/books/shift-login', '/books/shift-pin', '/books/shift-otp', '/books/pin-who', '/books/otp-send'];
async function call(method, path, body) {
  try {
    const r = await fetch(API + path, { method, headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) }, body: body ? JSON.stringify(body) : undefined });
    let j = {}; try { j = await r.json(); } catch (e) {}

    return j;

}
function cache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rev, S })); } catch (e) {} }
function dropToken() { token = ''; me = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }
async function save(ds, id) {
  const rec = recOf(ds, id) || null; cache();
  const j = await call('POST', '/books/regal/shift', { date: ds, empId: id, rec });
  if (j.__status === 200) { rev = j.rev; cache(); status('Live', 'live'); return; }
  if (j.__status === 409 && j.rec) { S.shift.days[ds][id] = j.rec; draw(); toast('Changed on another device just now — showing the latest'); return; }
  if (j.__status !== 401 && j.__status !== 403) { status('Not saved', 'bad'); toast('Not saved — ' + (j.error || 'the server did not answer') + '. Try that again.'); load(true); }
}
async function load(quiet) {

    const j = await call('GET', '/books/regal/shift');
    if (j.__status !== 200) {
      if (j.__status === 401 || j.__status === 403) return;
      online = false; status('Offline', 'bad');

}

    const j = mode === 'otp' ? await call('POST', '/books/shift-otp', { code: who.uid, otp: pin }) : await call('POST', '/books/shift-pin', { code: who.uid, pin });
    busy = false;
    if (j.__status === 200 && j.token) return done(j);
    pin = ''; dots(); shake($l('#pinDots')); say('#pinMsg2', j.__status === 0 ? 'The server cannot be reached' : (j.error || 'That is not right'), true);
  };
  const key = k => {
    if (busy || !who || s2.classList.contains('hide')) return;
    if (k === 'c') pin = ''; else if (k === 'b') pin = pin.slice(0, -1); else if (pin.length < need()) pin += k;
    dots(); if (pin.length === need()) tryPin(); else say('#pinMsg2', ask());
  };
  $l('.pin-pad').querySelectorAll('button').forEach(b => b.onclick = () => { b.classList.remove('hit'); void b.offsetWidth; b.classList.add('hit'); key(b.dataset.k); });
  el.addEventListener('keydown', e => { if (s2.classList.contains('hide')) return; if (/^\d$/.test(e.key)) key(e.key); else if (e.key === 'Backspace') key('b'); else if (e.key === 'Escape') back(); });
  $l('#pinNext').onclick = next;
  code.addEventListener('keydown', e => { if (e.key === 'Enter') next(); });
  code.addEventListener('input', () => { code.value = code.value.toUpperCase(); });
  $l('#pinBack').onclick = back; $l('#pwBack').onclick = back;
  $l('#pinUsePw').onclick = e => { e.preventDefault(); toPassword('', s1); };
  s3.onsubmit = async ev => {
    ev.preventDefault();
    const b = $l('#pwGo'); b.disabled = true; b.textContent = 'Signing in…'; say('#pinMsg3', '');
    const j = await call('POST', '/books/shift-login', { user: $l('#pwUser').value.trim(), password: $l('#pwPass').value });
    b.disabled = false; b.textContent = 'Sign in';
    if (j.__status !== 200 || !j.token) { shake(s3); return say('#pinMsg3', j.__status === 0 ? 'The server cannot be reached' : (j.error || 'Could not sign in'), true); }
    token = j.token; me = j.user; try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    el.remove(); welcome(me); signedIn();
  };
  if (why && why !== 'An admin has to sign in on this device') say('#pinMsg1', why, true);
  setTimeout(() => code.focus(), 60);
}
function say(sel, t, bad) { const m = document.querySelector(sel); if (!m) return; m.textContent = t || ''; m.classList.toggle('bad', !!bad); }
function welcome(u) {
  const h = new Date().getHours(), hi = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  const w = document.createElement('div'); w.className = 'pin-welcome';
  w.innerHTML = `<div class="pw-rays"></div><div class="pw-in"><div class="pw-av">${esc(String(u.uid || u.name || '?').slice(0, 3).toUpperCase())}</div>
     <div class="pw-hi">${hi},</div><div class="pw-name">${esc(first(u.name))}</div><div class="pw-sub">${esc(u.role || '')} · Shift Clock</div><div class="pw-bar"><i></i></div></div>`;
  document.body.appendChild(w);
  setTimeout(() => w.classList.add('out'), 1500); setTimeout(() => w.remove(), 2100);
}
function signedIn() {
  if (!me) { try { const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); me = { name: p.name, role: p.role }; } catch (e) { me = { name: 'Admin' }; } }
  document.getElementById('whoName').textContent = me.name;
  document.getElementById('whoAv').textContent = String(me.uid || me.name || '?').slice(0, 2).toUpperCase();
  document.getElementById('top').classList.remove('hide'); document.getElementById('app').classList.remove('hide');
  firstDraw = true; draw(); load(); startPolling();
}
function signOut() {
  const v = veil(`<div class="dlg"><h2>Sign this device out?</h2><p>The shift clock closes on this device until the owner or an admin signs in again.</p>
    <div class="row"><button class="btn ghost" id="soNo">Stay signed in</button><button class="btn stop" id="soOk">Sign out</button></div></div>`);
  v.querySelector('#soNo').onclick = () => v.remove();
  v.querySelector('#soOk').onclick = () => { v.remove(); dropToken(); S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } }; try { localStorage.removeItem(CACHE_KEY); } catch (e) {} lockScreen(); };
}

/* ---------------- bits ---------------- */
function veil(html) { const v = document.createElement('div'); v.className = 'veil'; v.innerHTML = html; v.onclick = e => { if (e.target === v) v.remove(); }; document.body.appendChild(v); return v; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000); }
function burst(c, icon, title, sub) {
  document.querySelectorAll('.burst').forEach(b => b.remove());
  const b = document.createElement('div'); b.className = 'burst'; b.style.setProperty('--c', c);
  b.innerHTML = `<div class="in"><div class="tick">${icon}</div><b>${esc(title)}</b><span>${esc(sub)}</span></div>`;
  document.body.appendChild(b); setTimeout(() => b.classList.add('out'), 1500); setTimeout(() => b.remove(), 1900);
}
function tick() {
  const d = new Date();
  document.getElementById('clk').innerHTML = `${pad(d.getHours() % 12 || 12)}<i>:</i>${pad(d.getMinutes())} <small style="font-size:13px">${d.getHours() < 12 ? 'AM' : 'PM'}</small>`;
  document.getElementById('clkD').textContent = d.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
}
setInterval(tick, 1000); tick();
// the minutes on the cards move on their own, as the till's do; a new day starts clean at midnight
setInterval(() => { if (document.querySelector('.veil') || !token) return; draw(); }, 20000);
document.getElementById('q').addEventListener('input', () => draw());
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
try { new BroadcastChannel('regal_books_sync').onmessage = e => { if (e.data === 'attendance_updated' || e.data === 'books_updated') load(true); }; } catch (e) {}
try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.S && Array.isArray(c.S.employees)) { S = c.S; rev = c.rev || 0; } } catch (e) {}
if (token) signedIn(); else lockScreen();
</script>
