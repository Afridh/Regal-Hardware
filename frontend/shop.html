/* ---------------- departments ---------------- */
function categoriesPage() {
  const cats = st.cat.categories || [];
  return `<div class="e-title"><div class="e-crumb"><a href="#/">Home</a><span>/</span><span>Departments</span></div>
      <h1 class="e-h1" style="font-size:clamp(30px,4vw,48px)">Departments</h1>
      <p>${fq(st.cat.products.length)} products in ${cats.length} departments, all on the shelves at 748, Main Street, Kaduruwela.</p></div>
    <div class="e-grid bordered">${cats.slice(0, 12).map(c => `
      <a class="e-card" href="${url('search', { cat: c.name })}">
        <div class="media">${c.img ? `<div class="tile"><img src="${esc(c.img)}" alt=""></div>` : `<div class="tile ph" style="--h1:${tintOf(c.name)[0]};--h2:${tintOf(c.name)[1]}"><span class="ph-cat">${c.count} item${c.count === 1 ? '' : 's'}</span><span class="ph-ic">${artFor(c.name)}</span><span class="ph-nm">${esc(c.name)}</span></div>`}</div>
        <div class="info"><span class="nm">${esc(c.name)}</span><span class="pr e-muted" style="font-size:13px">${c.count}</span></div>
      </a>`).join('')}</div>
    ${cats.length > 12 ? `<div class="e-head" style="padding-top:clamp(48px,6vw,80px)"><h2 class="e-h2">Every department, A – Z</h2></div>
      <div class="e-az" style="padding-bottom:90px">${(() => { const by = {}; cats.slice().sort((a, b) => a.name.localeCompare(b.name)).forEach(c => { const k = /^[a-z]/i.test(c.name) ? c.name[0].toUpperCase() : '#'; (by[k] = by[k] || []).push(c); });
        return Object.keys(by).sort().map(k => `<h3>${k}</h3>` + by[k].map(c => `<a href="${url('search', { cat: c.name })}"><span>${esc(c.name)}</span><small>${c.count}</small></a>`).join('')).join(''); })()}</div>` : '<div style="height:70px"></div>'}`;
}

/* ---------------- the collection: search, a department, or everything ---------------- */
function listing() {
  const q = st.route.q || {};
  const kw = (q.q || '').toLowerCase().trim();
  const { cat = '', brand = '', range = '', instock = '', sort = '' } = q;
  let list = st.cat.products.filter(p => {
    if (cat && p.cat !== cat) return false;
    if (brand && p.brand !== brand) return false;
    if (instock === '1' && isOut(p)) return false;
    if (kw && ![p.name, p.code, p.short, p.cat, p.desc, p.brand].some(x => String(x || '').toLowerCase().includes(kw))) return false;
    if (range === 'under1' && p.price >= 1000) return false;
    if (range === '1to5' && (p.price < 1000 || p.price > 5000)) return false;
    if (range === '5to20' && (p.price < 5000 || p.price > 20000)) return false;
    if (range === 'over20' && p.price <= 20000) return false;
    return true;
  });
  if (sort === 'best') list.sort((a, b) => (b.sold || 0) - (a.sold || 0));
  else if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
  else if (sort === 'name-asc') list.sort((a, b) => a.name.localeCompare(b.name));
  // a few dozen at a time — a department can hold hundreds
  const key = JSON.stringify(q);
  if (st.listKey !== key) { st.listKey = key; st.limit = 24; }
  const shown = list.slice(0, st.limit);
  const brands = Array.from(new Set(st.cat.products.map(p => p.brand).filter(Boolean))).sort();
  const title = cat || (kw ? `“${q.q}”` : sort === 'best' ? 'Best sellers' : 'All products');
  const filtered = cat || brand || range || instock || kw;
  return `
  <div class="e-title">
    <div class="e-crumb"><a href="#/">Home</a><span>/</span>${cat || kw ? '<a href="#/search">Shop</a><span>/</span>' : ''}<span>${esc(cat || (kw ? 'Search' : 'Shop'))}</span></div>
    <h1 class="e-h1" style="font-size:clamp(30px,4vw,48px)">${esc(title)}</h1>
  </div>
  <div class="e-cats">
    <button class="${!cat ? 'on' : ''}" onclick="go('search',{...st.route.q,cat:''})">All<small>${fq(st.cat.products.length)}</small></button>
    ${(() => { const all = st.cat.categories || [], top = all.slice(0, 14); if (cat && !top.some(c => c.name === cat)) { const c = all.find(c => c.name === cat); if (c) top.push(c); }
      return top.map(c => `<button class="${cat === c.name ? 'on' : ''}" onclick="go('search',{...st.route.q,cat:'${esc(c.name).replace(/'/g, "\\'")}'})">${esc(c.name)}<small>${c.count}</small></button>`).join('')
        + (all.length > top.length ? `<button onclick="go('categories')">More departments<small>${all.length}</small></button>` : ''); })()}
  </div>
  <div class="e-tools">
    <div class="left">
      <label class="e-sel">Price <select onchange="go('search',{...st.route.q,range:this.value})">
        <option value="">Any</option>
        <option value="under1" ${range === 'under1' ? 'selected' : ''}>Under Rs 1,000</option>
        <option value="1to5" ${range === '1to5' ? 'selected' : ''}>Rs 1,000 – 5,000</option>
        <option value="5to20" ${range === '5to20' ? 'selected' : ''}>Rs 5,000 – 20,000</option>
        <option value="over20" ${range === 'over20' ? 'selected' : ''}>Over Rs 20,000</option>
      </select></label>
      ${brands.length ? `<label class="e-sel">Brand <select onchange="go('search',{...st.route.q,brand:this.value})"><option value="">Any</option>${brands.map(b => `<option ${brand === b ? 'selected' : ''}>${esc(b)}</option>`).join('')}</select></label>` : ''}
      <label class="e-chk"><input type="checkbox" ${instock === '1' ? 'checked' : ''} onchange="go('search',{...st.route.q,instock:this.checked?'1':''})"> In stock</label>
      ${filtered ? `<button class="e-clear" onclick="go('search',{})">Clear all</button>` : ''}
    </div>
    <div class="right">
      <span class="e-count">${fq(list.length)} product${list.length === 1 ? '' : 's'}</span>
      <label class="e-sel">Sort <select onchange="go('search',{...st.route.q,sort:this.value})">
        <option value="">Featured</option>
        <option value="best" ${sort === 'best' ? 'selected' : ''}>Best selling</option>
        <option value="price-asc" ${sort === 'price-asc' ? 'selected' : ''}>Price, low to high</option>
        <option value="price-desc" ${sort === 'price-desc' ? 'selected' : ''}>Price, high to low</option>
        <option value="name-asc" ${sort === 'name-asc' ? 'selected' : ''}>A – Z</option>
      </select></label>
    </div>
  </div>
  ${shown.length ? `<div class="e-grid bordered">${shown.map(productBox).join('')}</div>
    ${list.length > shown.length ? `<div class="e-more"><button class="e-btn line" onclick="st.limit+=24;render();">Show more (${fq(list.length - shown.length)} left)</button></div>` : ''}
    <div style="height:70px"></div>`
  : `<div class="e-empty"><h2 class="e-h2">Nothing matches</h2><p>Try fewer filters or another word — or call us on ${esc(shopPhone())}, it may be on the shelf and not yet online.</p>
      <button class="e-btn" onclick="go('search',{})">Clear all</button></div>`}`;
}

/* ---------------- one product ---------------- */
function productPage() {
  const p = P(st.route.parts[1]);
  if (!p) return `<div class="e-empty"><h2 class="e-h2">Product not found</h2><p>It may have been taken off the site. Everything that is on it is in the shop.</p><a class="e-btn" href="#/search">Shop all products</a></div>`;
  if (st.pdFor !== p.id) { st.pdFor = p.id; st.pdQty = 1; }
  const qty = st.pdQty || 1, price = priceFor(p, qty), d = discPct(p), out = isOut(p);
  const w = st.cat.settings || {};
  const opt = st.selectedOptions[p.id] || (p.options && p.options[0]) || '';
  const same = listed().filter(x => x.cat === p.cat && x.id !== p.id).slice(0, 8);
  const waText = encodeURIComponent(`Hello ${shopName()}, I'd like to ask about ${p.name} (${p.code || ''}).`);
  return `
  <div class="e-page">
    <div class="e-crumb"><a href="#/">Home</a><span>/</span><a href="${url('search', { cat: p.cat })}">${esc(p.cat)}</a><span>/</span><span>${esc(p.name)}</span></div>
    <div class="e-pd" style="margin-top:18px">
      <div class="gal">${d > 0 ? `<span class="e-badge sale">−${d}%</span>` : ''}${tile(p)}</div>
      <div class="info">
        <h1>${esc(p.name)}</h1>
        <div class="meta">${p.code ? `<span>Code ${esc(p.code)}</span>` : ''}<span>${esc(p.cat)}</span>${p.unit ? `<span>Sold per ${esc(p.unit)}</span>` : ''}</div>
        <div class="price"><span>${money(price)}</span>${p.mrp > price ? `<s>${money(p.mrp)}</s><span class="off">Save ${money(p.mrp - price)}</span>` : ''}</div>
        <div class="stock ${out ? 'out' : isLow(p) ? 'low' : ''}"><i></i>${out ? 'Sold out just now — call us, more may be on the way' : isLow(p) ? `Only ${fq(p.stock)} left` : p.stock === null || p.stock === undefined ? 'Available' : 'In stock, ready to go'}</div>
        ${p.options && p.options.length ? `<span class="lbl">Option</span><div class="e-opts">${p.options.map(o => `<button class="${o === opt ? 'on' : ''}" onclick="selectProductOption('${esc(p.id)}','${esc(o).replace(/'/g, "\\'")}',this)">${esc(o)}</button>`).join('')}</div>` : ''}
        ${p.tiers && p.tiers.length ? `<span class="lbl">Buy more, pay less</span><div class="e-tiers">${p.tiers.slice().sort((a, b) => a.min - b.min).map(t => `<div><span>${fq(t.min)}${p.unit ? ' ' + esc(p.unit) : ''} or more${t.label ? ' · ' + esc(t.label) : ''}</span><b>${money(t.price)} each</b></div>`).join('')}</div>` : ''}
        ${out ? `<button class="e-btn block" disabled>Sold out</button>` : `
        <span class="lbl">Quantity</span>
        <div class="e-buy">
          <div class="e-qty"><button data-qty="-1" aria-label="One less">−</button><input type="number" id="pdQty" value="${qty}" min="1" aria-label="Quantity"><button data-qty="1" aria-label="One more">+</button></div>
          <button class="e-btn" data-add="${esc(p.id)}" data-qtyfrom="pdQty">Add to cart</button>
        </div>
        <button class="e-btn line block" data-buynow="${esc(p.id)}">Buy it now</button>
        <div class="tot">Total for this quantity: <b>${money(price * qty)}</b></div>`}
        <div class="contact"><a href="https://wa.me/${waLinkNo()}?text=${waText}" target="_blank" rel="noopener">Ask on WhatsApp</a><a href="tel:${esc(shopPhone().replace(/\s+/g, ''))}">Call ${esc(shopPhone())}</a>
          <button class="e-link" style="border:0;text-decoration:underline;text-transform:none;letter-spacing:0;font-size:14px" data-wish="${esc(p.id)}">${st.wish.includes(p.id) ? 'Saved to wishlist' : 'Save to wishlist'}</button></div>
        <div class="e-acc">
          <details open><summary>Description</summary><div class="body">${p.desc ? esc(p.desc) : `${esc(p.name)}${p.code ? ` (code ${esc(p.code)})` : ''}, from the ${esc(p.cat)} department. Ask at the counter or on WhatsApp for sizes, colours and quantities for your job.`}</div></details>
          <details><summary>Delivery &amp; pickup</summary><div class="body">${w.delivery || w.freeOver ? `Delivery from our Kaduruwela depot${w.delivery ? ` costs ${money(w.delivery)}` : ''}${w.freeOver ? `, free on orders over ${money(w.freeOver)}` : ''}.` : 'Delivered from our Kaduruwela depot, or collect it from the counter.'} Collect from 748, Main Street, Kaduruwela at no charge.${w.minOrder ? ` The smallest online order is ${money(w.minOrder)}.` : ''}</div></details>
          ${p.warranty ? `<details><summary>Warranty</summary><div class="body">${p.warranty >= 12 && p.warranty % 12 === 0 ? `${p.warranty / 12} year${p.warranty === 12 ? '' : 's'}` : `${p.warranty} month${p.warranty === 1 ? '' : 's'}`} warranty — keep your bill.</div></details>` : ''}
        </div>
      </div>
    </div>
  </div>
  ${same.length ? `<section class="e-sec soft"><div class="e-head"><h2 class="e-h2">You may also need</h2><a class="e-link" href="${url('search', { cat: p.cat })}">Shop ${esc(p.cat)}</a></div>
    <div class="e-rail">${same.map(productBox).join('')}</div></section>` : ''}`;
}

/* ---------------- cart ---------------- */
function cartPage() {
  const lines = st.cart.filter(l => P(l.pid));
  if (!lines.length) return `<div class="e-empty"><h2 class="e-h2">Your cart is empty</h2><p>Cement, paint, wiring, tools — it is all on the shelves in Kaduruwela.</p><a class="e-btn" href="#/search">Shop all products</a></div>`;
  const t = totals(lines);
  return `<div class="e-title"><h1 class="e-h1" style="font-size:clamp(30px,4vw,48px)">Your cart</h1></div>
  <div class="e-page" style="padding-top:0"><div class="e-two">
    <div class="e-lines">${lines.map(l => {
      const p = P(l.pid), u = priceFor(p, l.qty), opt = st.selectedOptions[p.id] || '';
      return `<div class="e-line">
        <a href="${url('product/' + p.id)}">${tile(p, true)}</a>
        <div><a class="nm" href="${url('product/' + p.id)}">${esc(p.name)}</a>${opt ? `<div class="opt">${esc(opt)}</div>` : ''}
          <div class="u">${money(u)}${p.unit ? ' / ' + esc(p.unit) : ''}</div>
          <div class="act"><div class="e-qty sm"><button onclick="updateCartQty('${esc(p.id)}', -1)" aria-label="One less">−</button><span>${fq(l.qty)}</span><button onclick="updateCartQty('${esc(p.id)}', 1)" aria-label="One more">+</button></div>
            <button class="rm" data-cartrm="${esc(p.id)}">Remove</button></div></div>
        <div class="amt">${money(u * l.qty)}</div>

function summary(t, proceed) {
  const w = st.cat.settings || {};
  return `<aside class="e-sum">
    <h3>Order summary</h3>
    <div class="row"><span>Subtotal</span><span>${money(t.goods)}</span></div>
    ${t.off ? `<div class="row"><span>Discount${st.code ? ' (' + esc(st.code) + ')' : ''}</span><span>− ${money(t.off)}</span></div>` : ''}
    <div class="row"><span>${st.deliver ? 'Delivery' : 'Collect from the shop'}</span><span>${!st.deliver ? 'Free' : t.del ? money(t.del) : 'Free'}</span></div>
    <div class="row tot"><span>Total</span><span>${money(t.total)}</span></div>
    ${st.under && st.minOrder ? `<div class="note" style="color:var(--red)">The smallest online order is ${money(st.minOrder)}.</div>` : ''}
    ${proceed ? `<a class="e-btn block" style="margin-top:20px" href="#/checkout">Check out</a><a class="e-btn line block" style="margin-top:10px" href="#/search">Keep shopping</a>` : ''}
    <div class="note">${w.freeOver && st.deliver && t.goods < w.freeOver ? `Free delivery from ${money(w.freeOver)}. ` : ''}The shop confirms every order by phone before it goes out.</div>
  </aside>`;
}

function floatingCartBar() { return ''; }

  const t = totals(lines);

          <label class="${!st.deliver ? 'on' : ''}"><input type="radio" name="dlv" ${!st.deliver ? 'checked' : ''} onchange="st.deliver=false;ls.set('deliver',false);askQuote();render()"><span><b>I'll collect it</b><small>748, Main Street, Kaduruwela — we text you when it is ready</small></span><span>Free</span></label>
        </div>
        ${st.deliver ? `

        ${(w.zones && w.zones.length) ? `<label class="e-field"><span>Area</span><select class="e-input" onchange="st.zone=this.value;ls.set('zone',st.zone);askQuote();render()">
          <option value="">Choose the area…</option>
          ${w.zones.map(z => `<option value="${esc(z.id)}" ${st.zone === z.id ? 'selected' : ''}>${esc(z.name)} — ${z.charge ? money(z.charge) : 'free'}${z.freeOver ? `, free over ${money(z.freeOver)}` : ''}${z.days ? ` · ${esc(z.days)}` : ''}</option>`).join('')}
        </select>${st.zone ? '' : '<div class="e-hint">Until an area is chosen the usual charge is shown.</div>'}</label>` : ''}` : ''}
        <label class="e-field" style="${st.deliver ? '' : 'margin-top:18px'}"><span>Note for the shop (optional)</span><input class="e-input" id="note" placeholder="${st.deliver ? 'Gate, landmark, who will be on site…' : 'When you will come, who will collect…'}"></label>

        ${w.payNote ? `<div class="e-hint" style="margin-top:10px">${esc(w.payNote)}</div>` : ''}

      <section>

  </div></div>`;
}

/* ---------------- the page on a phone, and in motion ----------------

const mobOpen = (on) => {

/* Sections and cards arriving as they come into view. An observer rather than a scroll handler,
   so nothing is measured on a thread a finger is already using. */
let revEye = null;
function revealOn() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
    return;
  }
  if (!revEye) revEye = new IntersectionObserver((rows) => {
    for (const r of rows) if (r.isIntersecting) { r.target.classList.add('in'); revEye.unobserve(r.target) }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });

  /* What is worth revealing: a section as a whole, and the cards inside it one after another.
     Anything already on screen when the page opens is shown at once — a thing you are already
     looking at should not fade in. */
  const marks = document.querySelectorAll('main > section, .e-sec, .e-grid > *, .e-tiles > *, .e-foot');
  let i = 0;
  marks.forEach(el => {
    if (el.classList.contains('rv') || el.closest('.mob-nav')) return;
    el.classList.add('rv');
    const inside = el.parentElement && el.parentElement.children.length > 1;
    if (inside) { el.classList.add('rv-' + (1 + (i++ % 6))) }
    const box = el.getBoundingClientRect();
    if (box.top < window.innerHeight * 0.9) el.classList.add('in');   // already in front of them
    else revEye.observe(el);
  });
}

/* A figure counting up the first time it is looked at. Only the number moves; whatever is
   written around it is left exactly as it was. */
let cntEye = null;
function countUps() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!cntEye) cntEye = new IntersectionObserver((rows) => {
    for (const r of rows) {
      if (!r.isIntersecting) continue;
      cntEye.unobserve(r.target);
      const el = r.target, text = el.textContent;
      const m = /[\d,]*\.?\d+/.exec(text); if (!m) continue;
      const to = +m[0].replace(/,/g, ''); if (!isFinite(to) || to < 2) continue;
      const dec = (m[0].split('.')[1] || '').length, grouped = m[0].includes(',');
      const head = text.slice(0, m.index), tail = text.slice(m.index + m[0].length);
      const say = (v) => { let s = v.toFixed(dec);
        if (grouped) { const [a, b] = s.split('.'); s = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b ? '.' + b : '') }
        return head + s + tail };
      const t0 = performance.now();
      const step = (now) => { const k = Math.min(1, (now - t0) / 700);
        el.textContent = say(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step); else el.textContent = text };
      requestAnimationFrame(step);
    }
  }, { threshold: 0.5 });
  document.querySelectorAll('.count-up, .stat-num, .trust-num').forEach(el => cntEye.observe(el));
}

/* Called after every draw. Cheap enough to run on each one: the observers only ever look at
   elements they have not seen before. */
function mobileAndMotion() {
  try { mobNav(); mobNavFill() } catch (e) {}
  try { revealOn() } catch (e) {}
  try { countUps() } catch (e) {}
}

    + `<a class="wa-float" href="https://wa.me/${waLinkNo()}" target="_blank" rel="noopener" aria-label="WhatsApp the shop">${I.wa}</a>`;

async function place() {
  if (st.busy) return;
  const name = ($('#custName')?.value || st.name || 'Trade Customer').trim();
  const phone = ($('#custPhone')?.value || st.phone || '').trim();
  const addr = ($('#addr')?.value || ls.get('addr') || '').trim();
  const note = ($('#note')?.value || '').trim();
  const lines = selLines();

  if (!lines.length) return notify('danger', 'Your cart is empty');
  if (!signedIn()) return signIn(() => render());
  if (st.deliver && !addr) { $('#addr')?.focus(); return notify('warning', 'Where should it be delivered? Enter the address'); }
  if (!$('#agree')?.checked) return notify('warning', 'Tick the box to say the shop may call to confirm');

  if (st.deliver) ls.set('addr', addr);
  st.name = name;
  st.phone = phone;
  ls.set('name', name);
  ls.set('phone', phone);

  st.busy = true;
  loading(true);

  try {
    const t = totals(lines);
    const oRef = 'RGL-' + Math.floor(1000 + Math.random() * 9000);
    const order = {
      ref: oRef,
      no: oRef,
      createdAt: new Date().toISOString(),
      customerName: name,
      phone: phone,
      email: st.email || '',
      address: st.deliver ? addr : '',
      deliver: !!st.deliver,
      note: note,
      pay: st.pay || 'cod',
      items: lines.map(l => {
        const p = P(l.pid);
        return {
          pid: l.pid,
          name: p.name,
          code: p.code,
          img: p.img,
          option: st.selectedOptions[l.pid] || (p.options && p.options[0]) || '',
          price: priceFor(p, l.qty),
          qty: l.qty,
          total: l.qty * priceFor(p, l.qty)
        };
      }),
      goods: t.goods,
      del: t.del,
      total: t.total,
      status: 'Confirmed & Logged'
    };


    // Async save to Firestore if connected
    if (window.__fbSaveOrder) {
      try {
        await window.__fbSaveOrder(st.gUser?.uid || 'guest', order);
      } catch (err) {
        console.warn('Firestore sync note:', err.message);
      }
    }

    /* The shop's server has the last word: it checks the stock, the smallest order and the code.
       If it says no, the customer is told why and the basket is left alone — telling somebody
       their order is placed when it is not is how they wait all day for goods that never come. */
    try {
      const said = await api('/order', {
        method: 'POST',
        body: { lines: lines.map(({ pid, qty }) => ({ pid, qty })), deliver: !!st.deliver,
                zone: st.zone || '', code: st.code || '', address: st.deliver ? addr : '', note, pay: st.pay || 'cod' }
      });
      if (said && said.no) { order.no = order.ref = said.no; order.total = said.total; order.goods = said.goods || order.goods; order.del = said.del; order.off = said.off || 0 }
    } catch (e) {
      const why = (e && e.message) || 'The shop could not take that order just now';
      notify('bad', why);
      await loadCatalog(true);                   // what is left may have changed under us
      render();
      return;                                    // the basket is kept, so nothing has to be keyed again
    }

    // the history on this device keeps the shop's own number, the one a customer can track
    const storedOrders = ls.get('regal_orders_v1', []); storedOrders.unshift(order); ls.set('regal_orders_v1', storedOrders); st.orders = storedOrders;
    st.placed = order;
    st.cart = [];
    saveCart();
    drawHeaderBits();
    notify('success', `Order ${order.no} is with the shop`);
    go('done/' + order.no);
  } catch (e) {
    notify('danger', e.message || 'Error processing order');
  } finally {
    st.busy = false;
    loading(false);
  }
}

/* Signing in is the shop's own: a mobile number, a six-figure code by SMS, and — the first
   time — a name. The token that comes back is what the server takes an order on, so an order
   can only ever be placed by someone who has the phone. (The earlier sign-in only asked for a
   name, and the server then turned every order away.) */
function signIn(then) {
  const el = modal(`<div class="e-dialog" role="dialog" aria-label="Sign in">
    <button class="e-x" data-close aria-label="Close">&times;</button>
    <h2>Sign in</h2>
    <p class="lead">Enter your mobile number. We text you a code — no password to remember.</p>
    <div id="siStep1">
      <label class="e-field"><span>Mobile number</span><input class="e-input" id="siPhone" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" value="${esc(st.phone || '')}"></label>
      <button class="e-btn block" id="siSend">Text me a code</button>
    </div>
    <div id="siStep2" class="hide">
      <label class="e-field"><span>The code we sent</span><input class="e-input e-code" id="siCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></label>
      <label class="e-field hide" id="siNameRow"><span>Your name</span><input class="e-input" id="siName" autocomplete="name" placeholder="As you would like us to call you"></label>
      <div class="e-hint" id="siHint"></div>
      <button class="e-btn block" id="siGo" style="margin-top:14px">Sign in</button>
      <button class="e-clear" id="siBack" style="color:var(--muted);margin-top:14px">Use another number</button>
    </div>
    ${window.__firebaseReady ? `<div class="or">or</div><button class="e-google" id="siGoogle"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Continue with Google</button>` : ''}
  </div>`);
  const box = $('.e-dialog', el);
  let phone = '';
  const digitsOf = (s) => String(s || '').replace(/\D/g, '').replace(/^94/, '0');
  const hint = (t, bad) => { const h = $('#siHint', box); h.textContent = t || ''; h.className = 'e-hint' + (bad ? ' bad' : ''); };
  setTimeout(() => $('#siPhone', box)?.focus(), 40);

  $('#siSend', box).onclick = async () => {
    phone = digitsOf($('#siPhone', box).value);
    if (!/^0\d{9}$/.test(phone)) return notify('warning', 'Enter a mobile like 0771234567');
    const b = $('#siSend', box); b.disabled = true; b.textContent = 'Sending…';
    try {
      const r = await api('/otp', { method: 'POST', body: { phone } });
      $('#siStep1', box).classList.add('hide'); $('#siStep2', box).classList.remove('hide');
      hint(r.sent ? `Code sent to ${phone}. It works for 5 minutes.` : r.code ? `Texting is not set up on this machine — your code is ${r.code}.` : (r.note || 'We could not text a code just now — call the shop and we will help.'), !r.sent && !r.code);
      setTimeout(() => $('#siCode', box)?.focus(), 40);
    } catch (e) { notify('danger', e.message); }
    finally { b.disabled = false; b.textContent = 'Text me a code'; }
  };
  $('#siPhone', box).onkeydown = (e) => { if (e.key === 'Enter') $('#siSend', box).click(); };
  $('#siBack', box).onclick = () => { $('#siStep2', box).classList.add('hide'); $('#siStep1', box).classList.remove('hide'); };
  $('#siCode', box).onkeydown = (e) => { if (e.key === 'Enter') $('#siGo', box).click(); };

  $('#siGo', box).onclick = async () => {
    const code = ($('#siCode', box).value || '').trim();
    const name = ($('#siName', box).value || '').trim();
    if (!/^\d{6}$/.test(code)) return hint('The code is six figures.', true);
    const b = $('#siGo', box); b.disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: { phone, code, name } });
      if (r.needName) { $('#siNameRow', box).classList.remove('hide'); hint('First time here — what name should we put on your orders?'); setTimeout(() => $('#siName', box)?.focus(), 40); return; }
      st.token = r.token; st.name = r.name; st.phone = r.phone || phone;
      ls.set('token', st.token); ls.set('name', st.name); ls.set('phone', st.phone);
      el.remove();
      notify('success', `Welcome, ${st.name.split(' ')[0]}`);
      render();
      if (then) then();
    } catch (e) { hint(e.message, true); }
    finally { b.disabled = false; }
  };

  const g = $('#siGoogle', box);
  if (g) g.onclick = () => notify('warning', 'Sign in with your mobile number — orders are confirmed on it.');
}

async function loadCatalog() {
  try {
    st.cat = await api('/catalog');
    const live = await api('/catalog');
    if (live && live.products && live.products.length > 0) {
      st.cat = live;
      render();
    }
  } catch (e) {
    st.cat = {
      shop: { name: 'Regal Hardware' },
      settings: { open: true },
      categories: [
        { name: 'Power Tools', count: 18 },
        { name: 'Paints & Finishes', count: 32 },
        { name: 'Hand Tools', count: 26 },
        { name: 'Hardware & Fasteners', count: 48 },
        { name: 'Plumbing & PVC', count: 40 },
        { name: 'Safety & Tools', count: 20 },
        { name: 'House Construction', count: 35 }
      ],
      products: []
    };
    // Keep using DEFAULT_CATALOG seamlessly
  }
  if (!st.cat.products || st.cat.products.length === 0) {
    st.cat.products = DEFAULT_PRODUCTS;
  }
  if (!st.cat.categories || st.cat.categories.length === 0) {
    st.cat.categories = [
      { name: 'Power Tools', count: 18 },
      { name: 'Paints & Finishes', count: 32 },
      { name: 'Hand Tools', count: 26 },
      { name: 'Hardware & Fasteners', count: 48 },
      { name: 'Plumbing & PVC', count: 40 },
      { name: 'Safety & Tools', count: 20 },
      { name: 'House Construction', count: 35 }
    ];
  }
}

(async () => {
  st.route = parseRoute();
  render();
  await loadCatalog();
  render();
})();
</script>
</body>
</html>
