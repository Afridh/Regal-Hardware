/* Sections and cards arriving as they come into view. An observer rather than a scroll handler,
   so nothing is measured on a thread a finger is already using. */
let revEye = null;
function revealOn() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
    return;
  }
  if (!revEye) revEye = new IntersectionObserver((rows) => {
    for (const r of rows) if (r.isIntersecting) { r.target.classList.add('in'); revEye.unobserve(r.target) }
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });

  /* What is worth revealing: a section as a whole, and the cards inside it one after another.
     Anything already on screen when the page opens is shown at once — a thing you are already
     looking at should not fade in. */
  const marks = document.querySelectorAll('main > section, .e-sec, .e-grid > *, .e-tiles > *, .e-foot');
  let i = 0;
  marks.forEach(el => {
    if (el.classList.contains('rv') || el.closest('.mob-nav')) return;
    el.classList.add('rv');
    const inside = el.parentElement && el.parentElement.children.length > 1;
    if (inside) { el.classList.add('rv-' + (1 + (i++ % 6))) }
    const box = el.getBoundingClientRect();
    if (box.top < window.innerHeight * 0.9) el.classList.add('in');   // already in front of them
    else revEye.observe(el);
  });
}

/* A figure counting up the first time it is looked at. Only the number moves; whatever is
   written around it is left exactly as it was. */
let cntEye = null;
function countUps() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  if (!cntEye) cntEye = new IntersectionObserver((rows) => {
    for (const r of rows) {
      if (!r.isIntersecting) continue;
      cntEye.unobserve(r.target);
      const el = r.target, text = el.textContent;
      const m = /[\d,]*\.?\d+/.exec(text); if (!m) continue;
      const to = +m[0].replace(/,/g, ''); if (!isFinite(to) || to < 2) continue;
      const dec = (m[0].split('.')[1] || '').length, grouped = m[0].includes(',');
      const head = text.slice(0, m.index), tail = text.slice(m.index + m[0].length);
      const say = (v) => { let s = v.toFixed(dec);
        if (grouped) { const [a, b] = s.split('.'); s = a.replace(/\B(?=(\d{3})+(?!\d))/g, ',') + (b ? '.' + b : '') }
        return head + s + tail };
      const t0 = performance.now();
      const step = (now) => { const k = Math.min(1, (now - t0) / 700);
        el.textContent = say(to * (1 - Math.pow(1 - k, 3)));
        if (k < 1) requestAnimationFrame(step); else el.textContent = text };
      requestAnimationFrame(step);
    }
  }, { threshold: 0.5 });
  document.querySelectorAll('.count-up, .stat-num, .trust-num').forEach(el => cntEye.observe(el));
}

/* Called after every draw. Cheap enough to run on each one: the observers only ever look at
   elements they have not seen before. */
function mobileAndMotion() {
  try { mobNav(); mobNavFill() } catch (e) {}
  try { revealOn() } catch (e) {}
  try { countUps() } catch (e) {}
}

        <b>${money(p.price)}</b>
      </a>
    `).join('') || '<div style="padding:16px;text-align:center;color:var(--gray)">No materials found</div>';
    box.classList.remove('hide');
  }, 120);
}

function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = html;
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  document.body.appendChild(bg);
  return bg;
}

async function place() {
  if (st.busy) return;
  const name = ($('#custName')?.value || st.name || 'Trade Customer').trim();
  const phone = ($('#custPhone')?.value || st.phone || '').trim();
  const addr = ($('#addr')?.value || ls.get('addr') || '').trim();
  const note = ($('#note')?.value || '').trim();
  const lines = selLines();

  if (!lines.length) return notify('danger', 'Your cart is empty');
  if (!signedIn()) return signIn(() => render());
  if (st.deliver && !addr) { $('#addr')?.focus(); return notify('warning', 'Where should it be delivered? Enter the address'); }
  if (!$('#agree')?.checked) return notify('warning', 'Tick the box to say the shop may call to confirm');

  if (st.deliver) ls.set('addr', addr);
  st.name = name;
  st.phone = phone;
  ls.set('name', name);
  ls.set('phone', phone);

  st.busy = true;
  loading(true);

  try {
    const t = totals(lines);
    const oRef = 'RGL-' + Math.floor(1000 + Math.random() * 9000);
    const order = {
      ref: oRef,
      no: oRef,
      createdAt: new Date().toISOString(),
      customerName: name,
      phone: phone,
      email: st.email || '',
      address: st.deliver ? addr : '',
      deliver: !!st.deliver,
      note: note,
      pay: st.pay || 'cod',
      items: lines.map(l => {
        const p = P(l.pid);
        return {
          pid: l.pid,
          name: p.name,
          code: p.code,
          img: p.img,
          option: st.selectedOptions[l.pid] || (p.options && p.options[0]) || '',
          price: priceFor(p, l.qty),
          qty: l.qty,
          total: l.qty * priceFor(p, l.qty)
        };
      }),
      goods: t.goods,
      del: t.del,
      total: t.total,
      status: 'Confirmed & Logged'
    };


    // Async save to Firestore if connected
    if (window.__fbSaveOrder) {
      try {
        await window.__fbSaveOrder(st.gUser?.uid || 'guest', order);
      } catch (err) {
        console.warn('Firestore sync note:', err.message);
      }
    }

    /* The shop's server has the last word: it checks the stock, the smallest order and the code.
       If it says no, the customer is told why and the basket is left alone — telling somebody
       their order is placed when it is not is how they wait all day for goods that never come. */
    try {
      const said = await api('/order', {
        method: 'POST',
        body: { lines: lines.map(({ pid, qty }) => ({ pid, qty })), deliver: !!st.deliver,
                zone: st.zone || '', code: st.code || '', address: st.deliver ? addr : '', note, pay: st.pay || 'cod' }
      });
      if (said && said.no) { order.no = order.ref = said.no; order.total = said.total; order.goods = said.goods || order.goods; order.del = said.del; order.off = said.off || 0 }
    } catch (e) {
      const why = (e && e.message) || 'The shop could not take that order just now';
      notify('bad', why);
      await loadCatalog(true);                   // what is left may have changed under us
      render();
      return;                                    // the basket is kept, so nothing has to be keyed again
    }

    // the history on this device keeps the shop's own number, the one a customer can track
    const storedOrders = ls.get('regal_orders_v1', []); storedOrders.unshift(order); ls.set('regal_orders_v1', storedOrders); st.orders = storedOrders;
    st.placed = order;
    st.cart = [];
    saveCart();
    drawHeaderBits();
    notify('success', `Order ${order.no} is with the shop`);
    go('done/' + order.no);
  } catch (e) {
    notify('danger', e.message || 'Error processing order');
  } finally {
    st.busy = false;
    loading(false);
  }
}

/* Signing in is the shop's own: a mobile number, a six-figure code by SMS, and — the first
   time — a name. The token that comes back is what the server takes an order on, so an order
   can only ever be placed by someone who has the phone. (The earlier sign-in only asked for a
   name, and the server then turned every order away.) */
function signIn(then) {
  const el = modal(`<div class="e-dialog" role="dialog" aria-label="Sign in">
    <button class="e-x" data-close aria-label="Close">&times;</button>
    <h2>Sign in</h2>
    <p class="lead">Enter your mobile number. We text you a code — no password to remember.</p>
    <div id="siStep1">
      <label class="e-field"><span>Mobile number</span><input class="e-input" id="siPhone" inputmode="tel" autocomplete="tel" placeholder="07XXXXXXXX" value="${esc(st.phone || '')}"></label>
      <button class="e-btn block" id="siSend">Text me a code</button>
    </div>
    <div id="siStep2" class="hide">
      <label class="e-field"><span>The code we sent</span><input class="e-input e-code" id="siCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="······"></label>
      <label class="e-field hide" id="siNameRow"><span>Your name</span><input class="e-input" id="siName" autocomplete="name" placeholder="As you would like us to call you"></label>
      <div class="e-hint" id="siHint"></div>
      <button class="e-btn block" id="siGo" style="margin-top:14px">Sign in</button>
      <button class="e-clear" id="siBack" style="color:var(--muted);margin-top:14px">Use another number</button>
    </div>
    ${window.__firebaseReady ? `<div class="or">or</div><button class="e-google" id="siGoogle"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>Continue with Google</button>` : ''}
  </div>`);
  const box = $('.e-dialog', el);
  let phone = '';
  const digitsOf = (s) => String(s || '').replace(/\D/g, '').replace(/^94/, '0');
  const hint = (t, bad) => { const h = $('#siHint', box); h.textContent = t || ''; h.className = 'e-hint' + (bad ? ' bad' : ''); };
  setTimeout(() => $('#siPhone', box)?.focus(), 40);

  $('#siSend', box).onclick = async () => {
    phone = digitsOf($('#siPhone', box).value);
    if (!/^0\d{9}$/.test(phone)) return notify('warning', 'Enter a mobile like 0771234567');
    const b = $('#siSend', box); b.disabled = true; b.textContent = 'Sending…';
    try {
      const r = await api('/otp', { method: 'POST', body: { phone } });
      $('#siStep1', box).classList.add('hide'); $('#siStep2', box).classList.remove('hide');
      hint(r.sent ? `Code sent to ${phone}. It works for 5 minutes.` : r.code ? `Texting is not set up on this machine — your code is ${r.code}.` : (r.note || 'We could not text a code just now — call the shop and we will help.'), !r.sent && !r.code);
      setTimeout(() => $('#siCode', box)?.focus(), 40);
    } catch (e) { notify('danger', e.message); }
    finally { b.disabled = false; b.textContent = 'Text me a code'; }
  };
  $('#siPhone', box).onkeydown = (e) => { if (e.key === 'Enter') $('#siSend', box).click(); };
  $('#siBack', box).onclick = () => { $('#siStep2', box).classList.add('hide'); $('#siStep1', box).classList.remove('hide'); };
  $('#siCode', box).onkeydown = (e) => { if (e.key === 'Enter') $('#siGo', box).click(); };

  $('#siGo', box).onclick = async () => {
    const code = ($('#siCode', box).value || '').trim();
    const name = ($('#siName', box).value || '').trim();
    if (!/^\d{6}$/.test(code)) return hint('The code is six figures.', true);
    const b = $('#siGo', box); b.disabled = true;
    try {
      const r = await api('/login', { method: 'POST', body: { phone, code, name } });
      if (r.needName) { $('#siNameRow', box).classList.remove('hide'); hint('First time here — what name should we put on your orders?'); setTimeout(() => $('#siName', box)?.focus(), 40); return; }
      st.token = r.token; st.name = r.name; st.phone = r.phone || phone;
      ls.set('token', st.token); ls.set('name', st.name); ls.set('phone', st.phone);
      el.remove();
      notify('success', `Welcome, ${st.name.split(' ')[0]}`);
      render();
      if (then) then();
    } catch (e) { hint(e.message, true); }
    finally { b.disabled = false; }
  };

  const g = $('#siGoogle', box);
  if (g) g.onclick = () => notify('warning', 'Sign in with your mobile number — orders are confirmed on it.');
}

/* What the page needs to draw itself in the shop's own look before the catalogue has arrived: the
   template and colours, the shop's details and its departments. Kept from the last visit (a few KB),
   so a refresh does not show the plain look, or the sample goods, for the second the catalogue takes. */
const LOOK_KEY = 'look_v1';
function lookFromLastVisit() {
  const c = ls.get(LOOK_KEY, null);
  if (!c || !c.settings) return null;
  return { shop: c.shop || {}, settings: c.settings, categories: c.categories || [], products: [], slides: c.slides || [], banners: c.banners || [], _early: true };
}
function keepLook(cat) {
  try { ls.set(LOOK_KEY, { shop: cat.shop, settings: cat.settings, categories: (cat.categories || []).slice(0, 40), slides: cat.slides || [], banners: cat.banners || [] }); } catch (e) {}
}
/* Goods the till keeps selling at the counter but the online shop does not offer, by product code. */
const NOT_ONLINE = new Set([
  'PCT-11-001772', 'PCT-11-003028', 'PCT-11-003444',   // Kevilton 5A plug bases
]);
/* Goods shown on the online shop that the till does not have yet: [code, name, department, MRP, price].
   They can be looked at and asked about, but not put in the basket — an online order is only taken
   for what is in the books. Once the till has a product with the same code, the till's one is shown. */
const WEB_ONLY = [
  ['PCT-12-007801', 'ORANGE ENIGMA 1G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 890, 715],
  ['PCT-12-007802', 'ORANGE ENIGMA 2G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 1160, 930],
  ['PCT-12-007803', 'ORANGE ENIGMA 3G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 1520, 1220],
  ['PCT-12-007804', 'ORANGE ENIGMA 4G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 1970, 1580],
  ['PCT-12-007805', 'ORANGE ENIGMA 5G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 2320, 1860],
  ['PCT-12-007806', 'ORANGE ENIGMA 6G 1WAY SWITCH - GUNMETAL', 'SWITCHES', 2850, 2280],
  ['PCT-12-007807', 'ORANGE ENIGMA 1G 2WAY SWITCH - GUNMETAL', 'SWITCHES', 1200, 960],
  ['PCT-12-007808', 'ORANGE ENIGMA 13AMP PLUG BASE - GUNMETAL', 'PLUG BASS', 865, 692],
  ['PCT-12-007809', 'ORANGE ENIGMA BELL PRESS SWITCH - GUNMETAL', 'SWITCHES', 595, 476],
  ['PCT-12-007810', 'ORANGE ENIGMA 20AMP D/POLE INDICATOR - GUNMETAL', 'SWITCHES', 2180, 1800],
  ['PCT-12-007811', 'ORANGE ENIGMA LIGHT DIMMER - GUNMETAL', 'SWITCHES', 3840, 3075],
  ['PCT-12-007812', 'ORANGE ENIGMA FAN CONTROLLER - GUNMETAL', 'SWITCHES', 3530, 2830],
  ['PCT-12-007813', 'ORANGE ENIGMA FAN SPEED CONTROLER - GUNMETAL', 'SWITCHES', 1375, 1160],
  ['PCT-12-007814', 'ORANGE ENIGMA TELEPHONE SOCKET - GUNMETAL', 'SWITCHES', 3000, 2400],
  ['PCT-12-007815', 'ORANGE ENIGMA TV SOCKET - GUNMETAL', 'SWITCHES', 2850, 2290],
];
/* What the shop shows differently from the till, until the till is tidied: names put right, and a
   product moved to the category it belongs in (product code -> category). */
const SHOP_RENAME = [[/\bSUN ?BOX\b/g, 'SUNK BOX']];
const SHOP_MOVE = {
  'PCT-11-001572': 'MAIN SWITCH',   // the Kevilton Hexa main switch is a wiring item
  'PCT-11-000504': 'PLUG TOP',      // 2 pin plug top (Polymax), filed under multi sockets
};
function tidyCatalog(cat) {
  const fix = (t) => SHOP_RENAME.reduce((a, [re, to]) => a.replace(re, to), String(t || ''));
  cat.products.forEach(p => { p.name = fix(p.name); p.cat = SHOP_MOVE[p.code] || fix(p.cat); });
  const count = {}; cat.products.forEach(p => { count[p.cat] = (count[p.cat] || 0) + 1; });
  const cats = new Map((cat.categories || []).map(c => [fix(c.name), { ...c, name: fix(c.name) }]));
  Object.keys(count).forEach(n => { if (!cats.has(n)) cats.set(n, { name: n, count: 0, img: '' }); });
  cat.categories = [...cats.values()].map(c => ({ ...c, count: count[c.name] || 0 })).filter(c => c.count);
}
function addWebOnly(cat) {
  const have = new Set(cat.products.map(p => p.code));
  WEB_ONLY.filter(([code]) => !have.has(code)).forEach(([code, name, dept, mrp, price]) => cat.products.push(
    { id: 'web-' + code, code, name, cat: dept, unit: 'pcs', mrp, price, stock: null, img: '', desc: '', warranty: 0, sold: 0, featured: false, webOnly: true }));
}
const askOnWhatsApp = (p) => 'https://wa.me/' + waLinkNo() + '?text=' + encodeURIComponent(`Hello ${shopName()}, I'd like to order ${p.name} (${p.code}).`);
async function loadCatalog() {
  try {
    // once — it is the whole shop (thousands of items), and asking twice made every visit wait twice
    const live = await api('/catalog');
    if (live && Array.isArray(live.products)) { live.products = live.products.filter(p => !NOT_ONLINE.has(p.code)); if (live.products.length) { addWebOnly(live); tidyCatalog(live); groupCatalog(live); groupVariants(live); } }
    if (live && live.products && live.products.length > 0) { st.cat = live; keepLook(live); }
    else st.cat = live || st.cat;
  } catch (e) {
    st.cat = {
      shop: { name: 'Regal Hardware' },
      settings: { open: true },
      categories: [
        { name: 'Power Tools', count: 18 },
        { name: 'Paints & Finishes', count: 32 },
        { name: 'Hand Tools', count: 26 },
        { name: 'Hardware & Fasteners', count: 48 },
        { name: 'Plumbing & PVC', count: 40 },
        { name: 'Safety & Tools', count: 20 },
        { name: 'House Construction', count: 35 }
      ],
      products: []
    };
    // Keep using DEFAULT_CATALOG seamlessly
  }
  if (!st.cat.products || st.cat.products.length === 0) {
    st.cat.products = DEFAULT_PRODUCTS;
  }
  if (!st.cat.categories || st.cat.categories.length === 0) {
    st.cat.categories = [
      { name: 'Power Tools', count: 18 },
      { name: 'Paints & Finishes', count: 32 },
      { name: 'Hand Tools', count: 26 },
      { name: 'Hardware & Fasteners', count: 48 },
      { name: 'Plumbing & PVC', count: 40 },
      { name: 'Safety & Tools', count: 20 },
      { name: 'House Construction', count: 35 }
    ];
  }
}

/* The pop-up poster the shop puts up from the till. It waits for the welcome to finish, and keeps to
   how often the shop chose — every visit, once a day, or once per person; a new picture or a new
   line counts as a new poster, so a change is seen. */
function showPoster() {
  const p = st.cat && st.cat.settings && st.cat.settings.poster;
  if (!p || (!p.img && !p.title)) return;
  const sig = (p.v || 0) + '|' + (p.title || '') + '|' + (p.text || '');
  const seen = ls.get('poster_seen', {}), dayKey = new Date().toDateString();
  if (p.every === 'once' && seen.sig === sig) return;
  if (p.every === 'day' && seen.sig === sig && seen.day === dayKey) return;
  const open = () => {
    if (document.querySelector('.modal-bg')) return;          // someone is already in the cart or signing in
    ls.set('poster_seen', { sig, day: dayKey });
    const el = modal(`<div class="e-poster ${p.img ? '' : 'noimg'}" role="dialog" aria-label="${esc(p.title || 'Offer')}">
      <button class="e-x" data-close aria-label="Close">&times;</button>
      ${p.img ? `<div class="pi" style="background-image:url('${esc(p.img)}')"></div>` : ''}
      <div class="pt"><span class="e-eyebrow">${esc(shopName())}</span>${p.title ? `<h3>${esc(p.title)}</h3>` : ''}${p.text ? `<p>${esc(p.text)}</p>` : ''}
        ${p.button ? `<a class="e-btn" href="${esc(p.link || '#/search')}" data-close>${esc(p.button)}</a>` : ''}</div></div>`);
    el.querySelectorAll('a[data-close]').forEach(a => a.addEventListener('click', () => el.remove()));
  };
  const wait = () => document.getElementById('intro') ? setTimeout(wait, 300) : setTimeout(open, 700);
  wait();
}

(async () => {
  st.route = parseRoute();
  /* Before the catalogue is here: the home page is drawn at once in the shop's own look from the last
     visit (the welcome covers it the first time). Any other page — a product, the cart — waits the
     second for the real goods, rather than showing "not found" or the sample items. */
  const early = lookFromLastVisit();
  if (early && !(st.route.parts[0] || '')) { st.cat = early; render(); }
  else { if (early) { const keep = st.cat; st.cat = early; try { applyTheme(TH()); } catch (e) {} st.cat = keep; } loading(true); }
  await loadCatalog();
  loading(false);
  render();
  showPoster();
})();
</script>
