<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware — suppliers</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101E22'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' fill='%23F0A81E' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101E22;--ink2:#1B2E33;--steel:#5A6E72;--faint:#8C9CA0;--page:#EEF1F0;--panel:#F7F9F8;--line:#D8DEDD;--line2:#EAEEED;
 --yellow:#F0A81E;--rust:#C0442C;--blue:#16799B;--green:#1E8A5A;--tint-yellow:#FFF4DA;--tint-rust:#FBE4DE;--tint-green:#DCF1E7;--tint-blue:#DCEEF4;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
h1,h2{font-family:Archivo,sans-serif;margin:0 0 8px;letter-spacing:-.01em}h2{font-size:17px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--ink),#16343A);color:#fff;border-bottom:3px solid var(--yellow)}
.top-in{max-width:760px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;white-space:nowrap}.brand span{color:var(--yellow)}.brand small{display:block;font:400 10.5px 'IBM Plex Sans';color:#9BB0AE;letter-spacing:.08em;margin-top:-2px}
.who{margin-left:auto;font-size:12.5px;color:#D7E0DF;text-align:right}.who a{color:var(--yellow)}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
.paytbl{width:100%;border-collapse:collapse}
.paytbl th{text-align:left;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-bottom:1px solid var(--line)}
.paytbl td{padding:7px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.paytbl th.n,.paytbl td.n{text-align:right}
.paytbl tr.on td{background:var(--tint-yellow)}
.paytbl tr.sub td{border-bottom:1px solid var(--line2);padding-top:0}
.paytbl tr.sub input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.paytbl input[type=checkbox]{width:18px;height:18px}
.paytbl .payamt{width:112px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,30,34,.05)}
.muted{color:var(--steel);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:11px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.tape{background:linear-gradient(180deg,#F7BB3C,#EFA412);border-color:#D08F09;color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.big{width:100%;padding:14px;font-family:Archivo,sans-serif;font-size:16px;font-weight:800}
.btn:disabled{opacity:.45;cursor:default}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f label{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.04em;text-transform:uppercase}
input,textarea,select{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:11px 12px;width:100%;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(240,168,30,.2)}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:12px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:99px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--steel);font-size:13.5px;position:relative}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button i{position:absolute;top:2px;right:8px;background:var(--rust);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.ok{background:var(--tint-green);color:#12613D}.tag.warn{background:var(--tint-yellow);color:#8A5D06}.tag.bad{background:var(--tint-rust);color:#9A2F1B}.tag.blue{background:var(--tint-blue);color:#0E5B76}
.o .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.o .h b{font-family:Archivo,sans-serif;font-size:16px}
.o table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.o td{padding:6px 0;border-bottom:1px solid var(--line2)}.o td.n{text-align:right;white-space:nowrap;font-weight:600}
.ev{border-left:2px solid var(--line);padding-left:10px;margin:8px 0;font-size:13px}.ev div{padding:3px 0}.ev b{font-weight:600}.ev .pending{color:var(--faint)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photos .ph{width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;background:#fff}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
.snap{width:84px;height:84px;border:2px dashed var(--line);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--steel);font-size:11px;gap:2px}
.snap:hover{border-color:var(--yellow);color:var(--ink)}.snap b{font-size:22px}
.steps{display:flex;gap:6px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;z-index:50;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(16,30,34,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:20px 18px 26px}
@media (min-width:600px){.sheet{align-items:center;padding:16px}.sheet .box{border-radius:14px}}
.code input{letter-spacing:.35em;font-family:Archivo,sans-serif;font-size:24px;text-align:center}
.demo{background:var(--tint-yellow);border:1px dashed var(--yellow);border-radius:var(--r);padding:8px 10px;font-size:13px;margin:8px 0}
.hero{background:linear-gradient(135deg,var(--ink),#16323A);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero b{font-family:Archivo,sans-serif;font-size:22px;display:block}.hero .muted{color:#B9C8C6}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">REGAL <span>HARDWARE</span><small>SUPPLIERS</small></div><div class="who" id="who"></div></div></header>
<main id="main"></main>
<script>
/* ======================= the supplier's page =======================
   Talks only to /api/sup/*.  A rep signs in with the mobile the shop has on file for the supplier.
   Two jobs: answer the orders the shop sends, and send in the orders taken by hand (photos). */
const API='/api/sup';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=n=>(+n||0).toLocaleString('en-LK',{maximumFractionDigits:3});
const money=n=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const ls={get:(k,d)=>{try{const v=localStorage.getItem('rs_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('rs_'+k,JSON.stringify(v))}catch(e){}}};
const st={token:ls.get('token',''),phone:ls.get('phone',''),rep:ls.get('rep',''),me:null,tab:'orders',photos:[],text:'',busy:false,done:null};
let toastT; function toast(m){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3000) }
async function api(path,opts={}){ const h={'Content-Type':'application/json'}; if(st.token) h.Authorization='Bearer '+st.token;
  const r=await fetch(API+path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined}); let j={}; try{ j=await r.json() }catch(e){}
  if(r.status===401&&st.token&&!/^\/(otp|login)/.test(path)) signOut(false);
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')')); return j }
async function askToBePaid(){
  const picked=st.payPick||{}, nos=Object.keys(picked);
  if(!nos.length) return;
  st.busy=true; render();
  try{
    const lines=nos.map(no=>({ no, claim:picked[no].claim===''?undefined:+picked[no].claim, note:picked[no].note||'' }));
    const j=await api('/payreq',{method:'POST',body:{lines,note:st.payNote||'',rep:st.rep||''}});
    st.payPick={}; st.payNote=''; st.paySent={lines:j.lines,total:j.total};
    await load();                                   // so what was asked for shows straight away
  }catch(e){ alert(e.message) }
  finally{ st.busy=false; render() }
}
function signOut(redraw=true){ st.token=''; st.me=null; ls.set('token',''); if(redraw) render() }
const PAYSTATUS={sent:['warn','With the shop'],accepted:['blue','Agreed — being made ready'],ready:['ok','Ready to collect'],issued:['ok','Paid'],rejected:['bad','Turned down']};
const PAYACT={asked:'Asked to be paid',accepted:'The shop agreed',queried:'The shop asked about it',rejected:'The shop turned it down',ready:'The money is ready',issued:'Handed over'};
const paytag=s=>{const x=PAYSTATUS[s]||['',s];return `<span class="tag ${x[0]}">${esc(x[1])}</span>`};
const STATUS={sent:['warn','Waiting for your answer'],accepted:['ok','You confirmed it'],changes:['warn','You asked for a change'],dispatched:['blue','On its way'],received:['ok','Received by the shop'],cancelled:['bad','Cancelled by the shop'],pending:['warn','Waiting for the shop'],rejected:['bad','Not accepted'],adjusted:['warn','Shop asked for a change'],revised:['','Replaced']};
const tag=s=>{const x=STATUS[s]||['',s];return `<span class="tag ${x[0]}">${esc(x[1])}</span>`};
const ACT={sent:'Order sent',accepted:'Accepted',changes:'Asked for a change',dispatched:'Dispatched',received:'Goods received',cancelled:'Cancelled',uploaded:'Order sent in',rejected:'Not accepted',adjusted:'Change requested',comment:''};

function render(){
  const m=$('#main'); $('#who').innerHTML=st.token&&st.me?`${esc(st.me.supplier.name.split(/[–(]/)[0].trim())}${st.rep?' · '+esc(st.rep):''}<br><a href="#" id="out">sign out</a>`:'';
  const out=$('#out'); if(out) out.onclick=e=>{e.preventDefault();signOut()};
  if(!st.token){ m.innerHTML=`<div class="hero"><b>For our suppliers</b><div class="muted">See the orders Regal Hardware has sent you, confirm them, tell us when the goods are on the way — and send in the orders our reps took by hand.</div></div>
    <div class="card"><h2>Sign in</h2><div class="muted" style="margin-bottom:10px">Use the mobile number the shop has for your company. We text you a code.</div><button class="btn tape big" id="signin">Sign in with my mobile</button></div>`; $('#signin').onclick=()=>signIn(load); return }
  if(!st.me){ m.innerHTML='<div class="card muted">Loading…</div>'; return }
  const me=st.me, open=me.pos.filter(o=>['sent','changes'].includes(o.status)).length;
  const payDue=(st.me.payReqs||[]).filter(r=>r.status==='ready').length;
  m.innerHTML=`<div class="tabs"><button class="${st.tab==='orders'?'on':''}" data-t="orders">Orders from the shop${open?`<i>${open}</i>`:''}</button><button class="${st.tab==='send'?'on':''}" data-t="send">Send an order</button><button class="${st.tab==='sent'?'on':''}" data-t="sent">Sent</button><button class="${st.tab==='pay'?'on':''}" data-t="pay">Get paid${payDue?`<i>${payDue}</i>`:''}</button><button class="${st.tab==='account'?'on':''}" data-t="account">Account</button></div>
   ${({orders,send,sent,pay,account})[st.tab]()}`;
  $$('[data-t]',m).forEach(b=>b.onclick=()=>{st.tab=b.dataset.t;render()}); bind();
}
function orders(){ const me=st.me; if(!me.pos.length) return '<div class="card muted">The shop has not sent you an order yet.</div>';
  return me.pos.map(o=>`<div class="card o">
   <div class="h"><div><b>${esc(o.no)}</b><div class="muted">Sent ${esc(o.date)}${o.want?' · wanted by '+esc(o.want):''} · by ${esc(o.by)}</div>${o.note?`<div class="muted">“${esc(o.note)}”</div>`:''}</div>${tag(o.status)}</div>
   <table>${o.lines.map(l=>`<tr><td>${esc(l.desc)}${l.known?'':' <span class="tag blue">new item</span>'}</td><td class="n">${fq(l.qty)} ${esc(l.unit)}</td></tr>`).join('')}</table>
   <div class="ev">${o.events.map(e=>`<div class="${e.pending?'pending':''}"><b>${esc(e.who)}</b> <span class="muted">· ${when(e.at)}</span>${e.pending?' <span class="muted">(reaching the shop)</span>':''}<div>${esc(ACT[e.action]||e.action)}${e.note?': '+esc(e.note):''}</div></div>`).join('')}</div>
   ${['received','cancelled'].includes(o.status)?'':`<div class="acts">
    ${o.status==='sent'||o.status==='changes'?`<button class="btn green" data-resp="accepted" data-no="${esc(o.no)}">✓ Confirm the order</button><button class="btn" data-resp="changes" data-no="${esc(o.no)}">Ask for a change</button>`:''}
    ${o.status!=='dispatched'?`<button class="btn dark" data-resp="dispatched" data-no="${esc(o.no)}">🚚 Goods dispatched</button>`:`<div class="muted">Invoice ${esc(o.invoiceNo||'—')} · waiting for the shop to receive it</div>`}</div>`}</div>`).join('');
}
function send(){ if(st.done) return `<div class="card" style="text-align:center;padding:30px 16px"><div style="font-size:44px">✅</div><h2>Sent to the shop</h2><div class="muted">${st.done.photos} photo${st.done.photos===1?'':'s'} · the owner will approve it and you will see the answer under <b>Sent</b>.</div><div style="margin-top:16px;display:flex;gap:8px;justify-content:center"><button class="btn tape" id="another">Send another</button><button class="btn" id="seeSent">See sent orders</button></div></div>`;
  return `<div class="card"><h2>An order you took by hand</h2><div class="muted" style="margin-bottom:10px">Photograph the order sheet (up to 6 photos) and add anything the shop should know. It goes to the owner for approval.</div>
   <div class="photos">${st.photos.map((p,i)=>`<div class="ph"><img src="${p}"><button data-rm="${i}">✕</button></div>`).join('')}${st.photos.length<6?`<div class="snap" id="snap"><b>📷</b>Camera / photo</div>`:''}</div>
   <input type="file" id="file" accept="image/*" capture="environment" multiple style="display:none">
   <div class="f"><label>Your name</label><input id="rep" value="${esc(st.rep)}" placeholder="Rep's name"></div>
   <div class="f"><label>Note, or the order typed out</label><textarea id="text" placeholder="e.g. 20 bags Tokyo cement, 10 lengths 25mm PVC — delivery Thursday">${esc(st.text)}</textarea></div>
   <button class="btn tape big" id="sendOrder" ${st.busy?'disabled':''}>${st.busy?'Sending…':'Send to the shop'}</button></div>`;
}
function sent(){ const me=st.me; if(!me.sent.length) return '<div class="card muted">Nothing sent yet. Use <b>Send an order</b>.</div>';
  return me.sent.map(o=>`<div class="card o"><div class="h"><div><b>${esc(o.date)}</b><div class="muted">${esc(o.rep||'')}${o.photos?` · ${o.photos} photo${o.photos===1?'':'s'}`:''}${o.grn?' · became '+esc(o.grn):''}</div></div>${o.waiting?'<span class="tag warn">Reaching the shop</span>':tag(o.status)}</div>
   ${o.text?`<div style="white-space:pre-wrap;background:var(--panel);padding:8px 10px;border-radius:8px;font-size:14px;margin:6px 0">${esc(o.text)}</div>`:''}
   ${o.note&&o.status!=='pending'?`<div class="muted"><b>Shop:</b> ${esc(o.note)}</div>`:''}
   <div class="ev">${o.events.map(e=>`<div><b>${esc(e.who)}</b> <span class="muted">· ${when(e.at)}</span><div>${esc(ACT[e.action]||e.action)}${e.note&&e.action!=='uploaded'?': '+esc(e.note):''}</div></div>`).join('')}</div></div>`).join('');
}
/* Asking to be paid: tick the bills, change a figure where it is wrong, say why, send it.
   Nothing here settles anything — the shop goes through it and tells you where it is. */
function pay(){
  const me=st.me, s=me.supplier;
  if(!s.showAccount) return '<div class="card muted">The shop has not switched your account page on yet. Ask them to, and you will be able to see what is outstanding and ask to be paid from here.</div>';
  const bills=me.bills||[], reqs=me.payReqs||[];
  const asked=new Set(reqs.filter(r=>['sent','accepted','ready'].includes(r.status)).flatMap(r=>(r.lines||[]).map(l=>l.no)));
  const picked=st.payPick||{};
  const chosen=bills.filter(b=>picked[b.no]);
  const total=chosen.reduce((a,b)=>a+(picked[b.no].claim===''?b.owing:+picked[b.no].claim||0),0);
  return `${st.paySent?`<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:40px">📨</div>
     <h2>Sent to the shop</h2><div class="muted">${st.paySent.lines} bill${st.paySent.lines===1?'':'s'} · ${money(st.paySent.total)}. You will see it move below as they go through it.</div>
     <button class="btn tape" id="payAgain" style="margin-top:14px">Ask for something else</button></div>`:
   bills.length?`<div class="card">
     <h2>What is outstanding</h2>
     <div class="muted" style="margin-bottom:10px">Tick the bills you want settled. If a figure is wrong — a credit note, short delivery, a price agreed later — put what it should be and say why.</div>
     <table class="paytbl">
      <tr><th></th><th>Invoice</th><th class="n">Owing</th><th class="n">Asking for</th></tr>
      ${bills.map(b=>{ const p=picked[b.no], on=!!p, already=asked.has(b.no);
        return `<tr class="${on?'on':''}">
        <td><input type="checkbox" data-paypick="${esc(b.no)}" ${on?'checked':''} ${already?'disabled':''}></td>
        <td><b>${esc(b.supInv||b.no)}</b><div class="muted">${esc(b.date)}${already?' · already asked for':''}</div></td>
        <td class="n">${money(b.owing)}</td>
        <td class="n">${on?`<input class="payamt" type="number" step="any" data-payamt="${esc(b.no)}" value="${p.claim}" placeholder="${b.owing}">`:'<span class="muted">—</span>'}</td>
       </tr>${on?`<tr class="sub"><td></td><td colspan="3"><input data-paynote="${esc(b.no)}" value="${esc(p.note||'')}" placeholder="why it is different, if it is — optional"></td></tr>`:''}`}).join('')}
     </table>
     <div class="kv" style="margin-top:10px"><span class="muted">${chosen.length} bill${chosen.length===1?'':'s'} ticked</span><b>${money(total)}</b></div>
     <div class="f" style="margin-top:8px"><label>Anything else the shop should know</label>
      <textarea id="payNote" placeholder="e.g. cheque please, the rep will collect on Friday">${esc(st.payNote||'')}</textarea></div>
     <div class="f"><label>Your name</label><input id="payRep" value="${esc(st.rep)}" placeholder="Rep's name"></div>
     <button class="btn tape big" id="paySend" ${chosen.length&&!st.busy?'':'disabled'}>${st.busy?'Sending…':`Ask to be paid ${chosen.length?money(total):''}`}</button>
    </div>`:'<div class="card muted">Nothing is outstanding — every bill of yours is settled.</div>'}

   ${reqs.length?`<h2 style="margin:16px 0 8px">What you have asked for</h2>
    ${reqs.map(r=>`<div class="card o">
      <div class="h"><div><b>${money(r.total)}</b><div class="muted">${esc(r.date)} · ${(r.lines||[]).length} bill${(r.lines||[]).length===1?'':'s'}</div></div>
       ${r.waiting?'<span class="tag warn">Reaching the shop</span>':paytag(r.status)}</div>
      ${r.status==='ready'?'<div class="card" style="margin:8px 0;background:var(--tint-green);border-color:var(--green)"><b>The money is ready.</b> <span class="muted">Call in for the cheque or the cash.</span></div>':''}
      <table>${(r.lines||[]).map(l=>`<tr><td>${esc(l.supInv||l.no)}${l.note?`<div class="muted">${esc(l.note)}</div>`:''}</td><td class="n">${money(l.claim)}</td></tr>`).join('')}</table>
      ${r.pay?`<div class="muted" style="margin-top:6px">Handed over ${esc(r.pay.date)} · ${esc(r.pay.what||'')}</div>`:''}
      <div class="ev">${(r.events||[]).map(e=>`<div><b>${esc(e.who)}</b> <span class="muted">· ${when(e.at)}</span><div>${esc(PAYACT[e.action]||e.action)}${e.note?': '+esc(e.note):''}</div></div>`).join('')}</div>
     </div>`).join('')}`:''}`;
}
function account(){ const me=st.me, s=me.supplier; return `<div class="card"><h2>${esc(s.name)}</h2>
   <div class="kv"><span class="muted">Contact on file</span><b>${esc(s.contact||'—')}</b></div><div class="kv"><span class="muted">Mobile</span><b>${esc(s.phone||'—')}</b></div><div class="kv"><span class="muted">Terms</span><b>${s.terms?s.terms+' days':'—'}</b></div>
   ${s.showAccount?`<div class="kv"><span class="muted">The shop owes you</span><b>${money(s.owed)}</b></div>`:'<div class="muted" style="margin-top:8px">Ask the shop to switch on your account page to see what is owed here.</div>'}</div>
   <div class="card"><h2>${esc(me.shop.name)}</h2><div class="muted">${esc(me.shop.addr||'')}</div>${me.shop.phone?`<div style="margin-top:8px"><a class="btn" href="tel:${esc(me.shop.phone)}">📞 ${esc(me.shop.phone)}</a></div>`:''}</div>`;
}
function bind(){
  const m=$('#main');
  $$('[data-resp]',m).forEach(b=>b.onclick=()=>respond(b.dataset.no,b.dataset.resp));
  const sn=$('#snap'); if(sn) sn.onclick=()=>$('#file').click();
  // ticking a bill, changing what is asked for, and sending it
  $('[data-paypick]',m).forEach(cb=>cb.onchange=()=>{ st.payPick=st.payPick||{};
    if(cb.checked) st.payPick[cb.dataset.paypick]={claim:'',note:''}; else delete st.payPick[cb.dataset.paypick];
    render() });
  $('[data-payamt]',m).forEach(el=>{ el.oninput=()=>{ st.payPick[el.dataset.payamt].claim=el.value };
    el.onblur=()=>render() });
  $('[data-paynote]',m).forEach(el=>el.oninput=()=>{ st.payPick[el.dataset.paynote].note=el.value });
  const pn=$('#payNote'); if(pn) pn.oninput=()=>{ st.payNote=pn.value };
  const pr=$('#payRep'); if(pr) pr.oninput=()=>{ st.rep=pr.value; ls.set('rep',pr.value) };
  const ag=$('#payAgain'); if(ag) ag.onclick=()=>{ st.paySent=null; render() };
  const ps=$('#paySend'); if(ps) ps.onclick=askToBePaid;
  const f=$('#file'); if(f) f.onchange=()=>{ [...f.files].slice(0,6-st.photos.length).forEach(file=>shrink(file).then(d=>{ st.photos.push(d); render() }).catch(()=>toast('Could not read that picture'))) };
  $$('[data-rm]',m).forEach(b=>b.onclick=()=>{ st.photos.splice(+b.dataset.rm,1); render() });
  const t=$('#text'); if(t) t.oninput=()=>{ st.text=t.value };
  const rp=$('#rep'); if(rp) rp.onchange=()=>{ st.rep=rp.value.trim(); ls.set('rep',st.rep) };
  const so=$('#sendOrder'); if(so) so.onclick=sendOrder;
  const an=$('#another'); if(an) an.onclick=()=>{ st.done=null; render() };
  const ss=$('#seeSent'); if(ss) ss.onclick=()=>{ st.done=null; st.tab='sent'; load() };
}
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const g=c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',0.82)) }; img.onerror=rej; img.src=URL.createObjectURL(file) }) }
async function sendOrder(){ if(st.busy) return; st.rep=($('#rep')||{}).value||st.rep; st.text=($('#text')||{}).value||''; ls.set('rep',st.rep);
  if(!st.text.trim()&&!st.photos.length) return toast('Add a photo of the order or type it');
  st.busy=true; render();
  try{ const j=await api('/order',{method:'POST',body:{text:st.text,rep:st.rep,photos:st.photos}}); st.done=j; st.photos=[]; st.text=''; st.busy=false; render() }
  catch(e){ st.busy=false; render(); toast(e.message) }
}
function respond(no,action){
  const el=document.createElement('div'); el.className='sheet';
  const title={accepted:'Confirm '+no,changes:'What needs to change on '+no+'?',dispatched:no+' — goods dispatched'}[action];
  el.innerHTML=`<div class="box"><h2>${esc(title)}</h2>
   ${action==='dispatched'?`<div class="f"><label>Your invoice number</label><input id="rInv" placeholder="e.g. INV-4521"></div><div class="f"><label>Expected at the shop</label><input id="rEta" type="date"></div>`:''}
   <div class="f"><label>${action==='changes'?'The change':'A note for the shop (optional)'}</label><textarea id="rNote" style="min-height:80px" placeholder="${action==='changes'?'e.g. only 15 bags available this week':action==='dispatched'?'e.g. on the lorry leaving 2 pm':'e.g. delivery Thursday morning'}"></textarea></div>
   <div style="display:flex;gap:8px"><button class="btn" id="rX">Cancel</button><button class="btn ${action==='accepted'?'green':'dark'}" id="rGo" style="flex:1">${{accepted:'Confirm',changes:'Send the change',dispatched:'Mark dispatched'}[action]}</button></div></div>`;
  document.body.appendChild(el); $('#rX',el).onclick=()=>el.remove(); ($('#rInv',el)||$('#rNote',el)).focus();
  $('#rGo',el).onclick=async()=>{ const b=$('#rGo',el); b.disabled=true;
    try{ await api('/po/'+encodeURIComponent(no)+'/respond',{method:'POST',body:{action,note:$('#rNote',el).value,invoice:($('#rInv',el)||{}).value||'',eta:($('#rEta',el)||{}).value||''}}); el.remove(); toast({accepted:'Confirmed — the shop has been told',changes:'Sent to the shop',dispatched:'Marked dispatched'}[action]); load() }
    catch(e){ toast(e.message); b.disabled=false } };
}
/* Signing in: by the user name the shop gave you, or the old way with the mobile on file and a
   texted code. Forgotten sends a code to the number kept against that sign-in. */
function signIn(then){
  const el=document.createElement('div'); el.className='sheet';
  let phone=st.phone||'', stage=ls.get('user')?'user':'user', hint='', name='', user=ls.get('user')||'';
  const draw=()=>{
    const titles={user:'Sign in',phone:'Your mobile',code:'The code we sent',forgot:'Forgotten your password',reset:'A new password'};
    el.innerHTML=`<div class="box"><h2 style="margin-bottom:2px">${titles[stage]}</h2>
    <div class="muted" style="margin-bottom:12px">${
      stage==='user'?'The user name the shop gave you.'
      :stage==='phone'?'The number the shop has on file for your company.'
      :stage==='forgot'?'We will text a code to the number on that sign-in.'
      :stage==='reset'?'The code we texted you, and the password you want from now on.'
      :'Sent to '+esc(phone)+(name?' — '+esc(name):'')+'. It works for 5 minutes.'}</div>
    ${stage==='user'?`<div class="f"><label>User name</label><input id="sUser" value="${esc(user)}" autocapitalize="off" spellcheck="false" autocomplete="username"></div>
       <div class="f"><label>Password</label><input id="sPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>`
     :stage==='phone'?`<div class="f"><label>Mobile</label><input id="sPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel"></div><div class="f"><label>Your name</label><input id="sRep" value="${esc(st.rep)}" placeholder="Rep's name"></div>`
     :stage==='forgot'?`<div class="f"><label>User name</label><input id="sFUser" value="${esc(user)}" autocapitalize="off" spellcheck="false"></div>`
     :stage==='reset'?`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}
       <div class="f code"><label>Code</label><input id="sFCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>
       <div class="f"><label>New password</label><input id="sFPass" type="password" autocomplete="new-password" placeholder="at least six characters"></div>`
     :`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="f code"><label>Code</label><input id="sCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>`}
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="sX">Cancel</button>
     <button class="btn tape" id="sGo" style="flex:1">${stage==='user'?'Sign in':stage==='phone'?'Text me a code':stage==='forgot'?'Text me a code':stage==='reset'?'Set it':'Sign in'}</button></div>
    <div class="muted" style="margin-top:10px">${
      stage==='user'?'<a href="#" id="sForgot">Forgotten your password?</a> · <a href="#" id="sPhoneWay">use my mobile instead</a>'
      :stage==='phone'?'<a href="#" id="sUserWay">sign in with a user name</a>'
      :stage==='code'?'<a href="#" id="sBack">Wrong number?</a>'
      :'<a href="#" id="sUserWay">back</a>'}</div></div>`;
    $('#sX',el).onclick=()=>el.remove();
    const go=(s)=>e=>{ e.preventDefault(); stage=s; draw() };
    const bk=$('#sBack',el); if(bk) bk.onclick=go('phone');
    const fw=$('#sForgot',el); if(fw) fw.onclick=go('forgot');
    const pw=$('#sPhoneWay',el); if(pw) pw.onclick=go('phone');
    const uw=$('#sUserWay',el); if(uw) uw.onclick=go('user');
    $('#sGo',el).onclick=step; const inp=$('input',el); if(inp) inp.focus();
    $$('input',el).forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();step()} }) };
  const step=async()=>{ const go=$('#sGo',el); go.disabled=true;
    try{
      if(stage==='user'){
        user=$('#sUser',el).value.trim(); const password=$('#sPass',el).value;
        if(!user||!password) throw new Error('Your user name and password, please');
        const j=await api('/signin',{method:'POST',body:{user,password}});
        st.token=j.token; st.rep=j.rep||st.rep; ls.set('token',j.token); ls.set('user',user); ls.set('rep',st.rep);
        el.remove(); toast('Welcome, '+(j.rep||j.supplier)); return then&&then();
      }
      if(stage==='forgot'){
        user=$('#sFUser',el).value.trim(); if(!user) throw new Error('Which user name?');
        const j=await api('/forgot',{method:'POST',body:{user}}); hint=j.sent?'':j.code; stage='reset'; return draw();
      }
      if(stage==='reset'){
        await api('/reset',{method:'POST',body:{user,code:$('#sFCode',el).value.trim(),password:$('#sFPass',el).value}});
        toast('That is your password now'); stage='user'; return draw();
      }
      if(stage==='phone'){ phone=$('#sPh',el).value.replace(/\D/g,''); st.rep=$('#sRep',el).value.trim(); ls.set('rep',st.rep); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567');
        const j=await api('/otp',{method:'POST',body:{phone}}); hint=j.sent?'':j.code; name=j.name||''; stage='code'; return draw() }
      const code=$('#sCode',el).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code');
      const j=await api('/login',{method:'POST',body:{phone,code,rep:st.rep}}); st.token=j.token; st.phone=phone; ls.set('token',j.token); ls.set('phone',phone); el.remove(); toast('Welcome, '+(st.rep||j.supplier)); if(then) then() }
    catch(e){ toast(e.message); go.disabled=false } };
  document.body.appendChild(el); draw();
}
async function load(){ if(!st.token) return render(); try{ st.me=await api('/me') }catch(e){ if(st.token) toast(e.message); st.me=null } render() }
load(); setInterval(()=>{ if(st.token&&!st.busy&&document.activeElement.tagName!=='TEXTAREA') load() },60000);
</script>
</body>
</html>
