<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware — suppliers</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101E22'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' fill='%23F0A81E' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#201819;--ink2:#2E2324;--steel:#5A6E72;--faint:#8C9CA0;--page:#EEF1F0;--panel:#F7F9F8;--line:#D8DEDD;--line2:#EAEEED;
 --brand:#AE1E2B;--brand-dark:#7E141D;--brand-bright:#C62833;--yellow:#AE1E2B;--rust:#C0442C;--blue:#16799B;--green:#1E8A5A;--tint-yellow:#FBE4E6;--tint-rust:#FBE4DE;--tint-green:#DCF1E7;--tint-blue:#DCEEF4;--r:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
h1,h2{font-family:Archivo,sans-serif;margin:0 0 8px;letter-spacing:-.01em}h2{font-size:17px}
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--ink),#16343A);color:#fff;border-bottom:3px solid var(--yellow)}
.top-in{max-width:760px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:18px;white-space:nowrap}.brand span{color:var(--yellow)}.brand small{display:block;font:400 10.5px 'IBM Plex Sans';color:#9BB0AE;letter-spacing:.08em;margin-top:-2px}
.who{margin-left:auto;font-size:12.5px;color:#D7E0DF;text-align:right}.who a{color:var(--yellow)}
main{max-width:760px;margin:0 auto;padding:14px 12px 90px}
.paytbl{width:100%;border-collapse:collapse}
/* keying an order off the stock list: find it, put the quantity, add it */
.sug{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 12px 28px rgba(0,0,0,.14);max-height:240px;overflow:auto}
.sug div{padding:9px 11px;cursor:pointer;border-bottom:1px solid var(--line2);display:flex;
  flex-direction:column;gap:2px;font-size:14px}
.sug div:last-child{border-bottom:0}
.sug div:active,.sug div:hover{background:var(--tint-yellow)}
.sug .muted{font-size:12px}
.discrow{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center}
.discrow select,.discrow input{margin:0}
.pickrow{display:grid;grid-template-columns:1fr 84px 84px auto;gap:7px;align-items:center;margin-top:8px;
  padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.pickrow input{margin:0;text-align:right}
.paytbl th{text-align:left;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-bottom:1px solid var(--line)}
.paytbl td{padding:7px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
.paytbl th.n,.paytbl td.n{text-align:right}
.paytbl tr.on td{background:var(--tint-yellow)}
.paytbl tr.sub td{border-bottom:1px solid var(--line2);padding-top:0}
.paytbl tr.sub input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
.paytbl input[type=checkbox]{width:18px;height:18px}
.paytbl .payamt{width:112px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:right}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,30,34,.05)}
.muted{color:var(--steel);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:11px 16px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.tape{background:linear-gradient(180deg,var(--brand-bright),var(--brand));border-color:var(--brand-dark);color:#fff}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.big{width:100%;padding:14px;font-family:Archivo,sans-serif;font-size:16px;font-weight:800}
.btn:disabled{opacity:.45;cursor:default}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.f label{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.04em;text-transform:uppercase}
input,textarea,select{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:11px 12px;width:100%;font-size:16px}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(240,168,30,.2)}
.tabs{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:12px;gap:4px}
.tabs button{flex:1;border:0;background:none;border-radius:99px;padding:9px 6px;font-weight:600;cursor:pointer;color:var(--steel);font-size:13.5px;position:relative}
.tabs button.on{background:var(--ink);color:#fff}
.tabs button i{position:absolute;top:2px;right:8px;background:var(--rust);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.tag.ok{background:var(--tint-green);color:#12613D}.tag.warn{background:var(--tint-yellow);color:#8A5D06}.tag.bad{background:var(--tint-rust);color:#9A2F1B}.tag.blue{background:var(--tint-blue);color:#0E5B76}
.o .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.o .h b{font-family:Archivo,sans-serif;font-size:16px}
.o table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.o td{padding:6px 0;border-bottom:1px solid var(--line2)}.o td.n{text-align:right;white-space:nowrap;font-weight:600}
.ev{border-left:2px solid var(--line);padding-left:10px;margin:8px 0;font-size:13px}.ev div{padding:3px 0}.ev b{font-weight:600}.ev .pending{color:var(--faint)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.photos .ph{width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);position:relative;background:#fff}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
.snap{width:84px;height:84px;border:2px dashed var(--line);border-radius:8px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--steel);font-size:11px;gap:2px}
.snap:hover{border-color:var(--yellow);color:var(--ink)}.snap b{font-size:22px}
.steps{display:flex;gap:6px;margin:8px 0}.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}.steps i.on{background:var(--green)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;z-index:50;max-width:90vw}
.sheet{position:fixed;inset:0;background:rgba(16,30,34,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:#fff;width:100%;max-width:480px;border-radius:14px 14px 0 0;padding:20px 18px 26px}
@media (min-width:600px){.sheet{align-items:center;padding:16px}.sheet .box{border-radius:14px}}
.code input{letter-spacing:.35em;font-family:Archivo,sans-serif;font-size:24px;text-align:center}
.demo{background:var(--tint-yellow);border:1px dashed var(--yellow);border-radius:var(--r);padding:8px 10px;font-size:13px;margin:8px 0}
.hero{background:linear-gradient(135deg,var(--ink),#16323A);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.hero b{font-family:Archivo,sans-serif;font-size:22px;display:block}.hero .muted{color:#B9C8C6}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line2);font-size:14px}
/* the menu: across the top on a phone, down the left (as on the till) on anything wider */
.menu{position:sticky;top:59px;z-index:15;background:var(--ink);border-bottom:1px solid #0A1416}
.menu-in{display:flex;gap:2px;padding:6px 6px;overflow-x:auto;scrollbar-width:none}
.menu-in::-webkit-scrollbar{display:none}
.menu button{flex:1 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;border-radius:10px;padding:7px 8px;cursor:pointer;color:#B9C8C6;font-size:11.5px;font-weight:600;position:relative;white-space:nowrap}
.menu button .ic{font-size:18px;line-height:1}
.menu button.on{background:rgba(240,168,30,.16);color:var(--yellow)}
.menu .long{display:none}
.menu button i{position:absolute;top:2px;right:4px;background:var(--rust);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:0 6px;line-height:16px}
@media (min-width:860px){
  .menu{position:fixed;top:59px;left:0;bottom:0;width:236px;border:0;border-right:1px solid #0A1416;overflow-y:auto}
  .menu-in{flex-direction:column;gap:3px;padding:14px 10px}
  .menu button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:14px;color:#C9D4D2;border-radius:8px;border-left:3px solid transparent}
  .menu button:hover{background:rgba(255,255,255,.06);color:#fff}
  .menu button.on{background:rgba(240,168,30,.14);color:#fff;border-left-color:var(--yellow)}
  .menu button .ic{width:22px;text-align:center}
  .menu .long{display:inline}.menu .short{display:none}
  .menu button i{position:static;margin-left:auto;line-height:18px}
  body.in main{margin-left:236px;max-width:none;padding:22px 28px 60px}
  body.in main>*{max-width:860px}
  .top-in{max-width:none;padding:0 22px}
}
.ptitle{font-size:22px;margin:2px 0 14px}
h2.sec{display:flex;align-items:center;gap:8px;margin:18px 0 8px}h2.sec:first-child{margin-top:0}
h2.sec i{font-style:normal;background:var(--ink);color:#fff;border-radius:99px;font-size:12px;padding:1px 9px}
.o.attn{border-left:4px solid var(--yellow)}
.o.dead{opacity:.85;border-left:4px solid var(--rust)}
.notice.bad{background:var(--tint-rust);border-color:#EBB1A3}
.btn.del{color:var(--rust);border-color:rgba(192,68,44,.35)}
h3{font-family:Archivo,sans-serif;font-size:14px;margin:16px 0 8px}
.seg{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:99px;padding:9px 8px;font-weight:600;cursor:pointer;color:var(--steel);font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:30px 18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;color:var(--steel)}
.empty div{font-size:38px}.empty b{color:var(--ink);font-family:Archivo,sans-serif;font-size:16px}
.flash{background:var(--tint-green);border:1px solid var(--green);color:#12613D;border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-weight:600}
.notice{background:var(--tint-yellow);border:1px solid #F5D488;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}
.notice.ok{background:var(--tint-green);border-color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:10px}
.stats span{display:block;font-size:11px;color:var(--steel);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.stats b{font-family:Archivo,sans-serif;font-size:17px}.stats .bad b{color:var(--rust)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.tblwrap{overflow-x:auto}
.qtyin{width:84px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;text-align:right;font-size:15px}
.txt{white-space:pre-wrap;background:var(--panel);padding:8px 10px;border-radius:8px;font-size:14px;margin:6px 0}
</style>
</head>
<body>
<header class="top"><div class="top-in"><div class="brand">REGAL <span>HARDWARE</span><small>SUPPLIERS</small></div><div class="who" id="who"></div></div></header>
<nav class="menu" id="menu" style="display:none"></nav>
<main id="main"></main>
<script>
/* ======================= the supplier's page =======================
   Talks only to /api/sup/*. A rep signs in with the user name the shop made for them (their name, and
   that name with 123 as the first password). A menu down the left, as on the till:
     Orders From Shop  — complete an order as it was sent, or edit it and complete. The shop asked for
                         it, so it goes straight to Pending Orders to wait for the purchase
     Create new order  — pick their own items at the shop or type new ones, or send a photo of the
                         invoice; the owner approves it
     Pending Orders    — everything not yet bought in: waiting for approval, waiting for the purchase,
                         sent back for changes (edit and resend), and cancelled or turned down (delete)
     Order History     — what the shop has bought in
     Payment Request   — their bills, how old each is against the credit period, and asking to be paid
     Account           — their user name and password, and asking for a sign-in for someone else */
const API='/api/sup';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fq=n=>(+n||0).toLocaleString('en-LK',{maximumFractionDigits:3});
const money=n=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const when=t=>t?new Date(t).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const ls={get:(k,d)=>{try{const v=localStorage.getItem('rs_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('rs_'+k,JSON.stringify(v))}catch(e){}}};
const st={token:ls.get('token',''),phone:ls.get('phone',''),rep:ls.get('rep',''),me:null,tab:'orders',photos:[],text:'',disc:{kind:'pct',value:'',note:''},busy:false,done:null};
let toastT; function toast(m){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3000) }
async function api(path,opts={}){ const h={'Content-Type':'application/json'}; if(st.token) h.Authorization='Bearer '+st.token;
  const r=await fetch(API+path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined}); let j={}; try{ j=await r.json() }catch(e){}
  if(r.status===401&&st.token&&!/^\/(otp|login)/.test(path)) signOut(false);
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')')); return j }
async function askToBePaid(){
  const picked=st.payPick||{}, nos=Object.keys(picked);
  if(!nos.length) return;
  st.busy=true; render();
  try{
    const lines=nos.map(no=>({ no, claim:picked[no].claim===''?undefined:+picked[no].claim, note:picked[no].note||'' }));
    const j=await api('/payreq',{method:'POST',body:{lines,note:st.payNote||'',rep:st.rep||''}});
    st.payPick={}; st.payNote=''; st.paySent={lines:j.lines,total:j.total};
    await load();                                   // so what was asked for shows straight away
  }catch(e){ alert(e.message) }
  finally{ st.busy=false; render() }
}

/* Somebody else from their side needs to get in. The shop decides; until it does,
   there is nothing to sign in with. */
function teamCard(){
  if(st.team===undefined&&!st.teamBusy){ st.teamBusy=true; loadTeam().finally(()=>{ st.teamBusy=false; render() }) }
  const asks = st.team || [];
  const waiting = asks.filter(a => a.status === 'waiting');
  return `<div class="card">
   <h2>Give someone from your firm a sign-in</h2>
   <div class="muted" style="margin-bottom:10px">Your own sign-in was made for you. If somebody else here needs one — the accountant, the storekeeper — ask for it and the shop will decide. They are texted the user name and the password only once the shop says yes.</div>
   ${st.teamSent ? `<div class="card" style="text-align:center;padding:22px 14px;margin:0 0 10px"><div style="font-size:36px">📨</div>
     <b>Asked the shop</b><div class="muted">They will see it straight away. Nobody can sign in until they say yes.</div>
     <button class="btn" id="teamAgain" style="margin-top:12px">Ask for another</button></div>` : `
   <div class="f"><label>Their name</label><input id="tmName" placeholder="e.g. Nimal Perera" maxlength="80">
    <div class="muted">Their user name is made from it — e.g. nimal.perera, with the password nimal.perera123 until they change it.</div></div>
   <div class="f"><label>Role</label><input id="tmRole" placeholder="branch manager, accountant, storekeeper…" maxlength="40"></div>
   <div class="f"><label>Their mobile</label><input id="tmPhone" inputmode="tel" placeholder="07XXXXXXXX" maxlength="15">
    <div class="muted">The sign-in is texted here if the shop agrees.</div></div>
   <div class="f"><label>Anything to tell the shop</label><input id="tmNote" placeholder="optional" maxlength="300"></div>
   <div class="muted" id="tmMsg"></div>
   <button class="btn tape big" id="tmSend" ${st.busy?'disabled':''} style="margin-top:8px">${st.busy?'Asking…':'Ask the shop'}</button>`}
   ${asks.length ? `<h2 style="margin:14px 0 6px;font-size:15px">What you have asked for</h2>
     ${asks.map(a => `<div class="kv"><span>${esc(a.name)}${a.role?' <span class="muted">· '+esc(a.role)+'</span>':''}</span>
       <b>${a.status==='waiting'?'<span class="tag warn">With the shop</span>'
         :a.status==='accepted'?'<span class="tag ok">Let in — texted to them</span>'
         :'<span class="tag bad">Turned down</span>'}</b></div>
       ${a.reason?`<div class="muted" style="margin:-4px 0 8px">"${esc(a.reason)}"</div>`:''}`).join('')}` : ''}
  </div>`;
}
async function loadTeam(){
  try{ const j = await api('/team'); st.team = j.requests || [] }catch(e){ st.team = [] }
}
async function askForPerson(){
  const name = ($('#tmName')||{}).value || '', phone = ($('#tmPhone')||{}).value || '';
  const role = ($('#tmRole')||{}).value || '', note = ($('#tmNote')||{}).value || '';
  const msg = $('#tmMsg');
  if(!name.trim()){ if(msg) msg.textContent = 'Who is it for?'; return }
  if(!phone.replace(/\D/g,'')){ if(msg) msg.textContent = 'A mobile is needed — that is where the sign-in goes.'; return }
  st.busy = true; render();
  try{
    await api('/team', { method:'POST', body:{ name, phone, role, note } });
    st.teamSent = true; await loadTeam();
  }catch(e){ alert(e.message) }
  finally{ st.busy = false; render() }
}
function signOut(redraw=true){ st.token=''; st.me=null; ls.set('token',''); if(redraw) render() }
const PAYSTATUS={sent:['warn','With the shop'],accepted:['blue','Agreed — being made ready'],ready:['ok','Ready to collect'],issued:['ok','Paid'],rejected:['bad','Turned down']};
const PAYACT={asked:'Asked to be paid',accepted:'The shop agreed',queried:'The shop asked about it',rejected:'The shop turned it down',ready:'The money is ready',issued:'Handed over'};
const paytag=s=>{const x=PAYSTATUS[s]||['',s];return `<span class="tag ${x[0]}">${esc(x[1])}</span>`};
const STATUS={sent:['warn','Waiting for your answer'],accepted:['ok','You confirmed it'],changes:['warn','You asked for a change'],dispatched:['blue','On its way'],received:['ok','Received by the shop'],cancelled:['bad','Cancelled by the shop'],pending:['warn','Waiting for the shop'],rejected:['bad','Not accepted'],adjusted:['warn','Shop asked for a change'],revised:['','Replaced'],completed:['blue','Completed — with the shop for approval'],approved:['ok','Approved']};
const tag=s=>{const x=STATUS[s]||['',s];return `<span class="tag ${x[0]}">${esc(x[1])}</span>`};
const ACT={sent:'Order sent',accepted:'Accepted',changes:'Asked for a change',dispatched:'Dispatched',received:'Goods received',cancelled:'Cancelled',uploaded:'Order sent in',rejected:'Not accepted',adjusted:'Change requested',comment:''};

/* ---- the five pages, one menu ---- */
const MENU=[['orders','📥','Orders From Shop','From shop'],['create','➕','Create new order','Create'],['pending','⏳','Pending Orders','Pending'],['history','🗂️','Order History','History'],['stock','📦','Your stock','Stock'],['pay','💳','Payment Request','Payment'],['account','👤','Account','Account']];
/* Their stock is a place only while the shop has opened it to them (Suppliers → Show them their stock). */
const stockOpen=()=>!!(st.me&&+st.me.stockUntil>Date.now());
const ACTIVE=['sent','accepted','changes','dispatched','adjusted'];      // a shop order still in the supplier's hands — once completed it is under Pending Orders
const NEEDS_ME=['sent','accepted','changes','dispatched','adjusted'];

function render(){
  const m=$('#main');
  $('#who').innerHTML=st.token&&st.me?`${esc(st.me.supplier.name.split(/[–(]/)[0].trim())}${st.rep?' · '+esc(st.rep):''}<br><a href="#" id="out">Sign out</a>`:'';
  const out=$('#out'); if(out) out.onclick=e=>{e.preventDefault();signOut()};
  const nav=$('#menu');

async function completeOrder(no,edited){

/* ---------- Pending Orders and Order History ----------
   One list of every order, theirs and the shop's, each saying where it stands. Pending is everything
   not bought in yet; History is what the shop has bought in. */
function allOrders(){
  const me=st.me;
  const theirs=me.pos.filter(o=>['completed','approved','received','cancelled'].includes(o.status))
    .map(o=>({from:'shop',ref:'po:'+o.no,no:o.no,date:o.date,lines:o.supLines||o.lines,grn:o.grn,status:o.status,note:o.note,invoiceNo:o.invoiceNo,events:o.events||[]}));
  const ours=(me.sent||[]).filter(o=>o.status!=='revised')
    .map(o=>({...o,from:'you',ref:'in:'+o.id,no:''}));
  return theirs.concat(ours).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
const bought=o=>!!o.grn||o.status==='received';
/* where an order stands, said for the one who sent it — and whose order it was */
function orderState(o){
  if(o.from==='shop') return bought(o)?['ok','Order from shop — purchased']
    :o.status==='cancelled'?['bad','Order from shop — cancelled by the shop']
    :o.status==='completed'?['warn','Order from shop — waiting for approval']
    :['blue','Order from shop — waiting for purchase'];
  return bought(o)?['ok','Your order — purchased']
    :o.waiting?['warn','Your order — reaching the shop']
    :o.status==='pending'?['warn','Your order — waiting for approval']
    :o.status==='adjusted'?['warn','The shop asked for changes']
    :o.status==='rejected'?['bad','Your order — rejected by the shop']
    :['blue','Your order — approved, waiting for purchase'];
}
function shopSaid(o){ const e=(o.events||[]).filter(e=>['adjusted','rejected','cancelled'].includes(e.action)).slice(-1)[0]; return (e&&e.note)||o.note||'' }
function orderCard(o){
  const lines=(o.lines&&o.lines.length)?o.lines:null, state=orderState(o), said=shopSaid(o);
  const closed=o.status==='cancelled'||o.status==='rejected';
  return `<div class="card o${o.status==='adjusted'?' attn':closed?' dead':''}"><div class="h"><div><b>${esc(o.no||'Your order')}</b><div class="muted">${esc(o.date)}${o.rep?' · '+esc(o.rep):''}${o.invoiceNo?' · invoice '+esc(o.invoiceNo):''}${o.grn?' · purchased as '+esc(o.grn):''}</div></div>
     <span class="tag ${state[0]}">${state[1]}</span></div>
    ${['adjusted','rejected','cancelled'].includes(o.status)&&said?`<div class="notice${closed?' bad':''}"><b>The shop said:</b> ${esc(said)}</div>`:''}
    ${lines?linesTable(lines,true):o.text&&o.text!=='(photo only)'?`<div class="txt">${esc(o.text)}</div>`:''}
    ${o.photos?`<div class="muted">📷 Sent as ${o.photos} photo${o.photos===1?'':'s'} of the invoice</div>`:''}
    ${o.status==='adjusted'&&!o.waiting?`<div class="acts"><button class="btn tape" data-resend="${esc(o.id)}">✎ Edit and resend</button></div>`:''}
    ${closed?`<div class="acts"><button class="btn sm del" data-hide="${esc(o.ref)}">🗑 Delete</button></div>`:''}</div>`;
}
function pendingPage(){
  const all=allOrders().filter(o=>!bought(o));
  const changes=all.filter(o=>o.status==='adjusted');
  const approval=all.filter(o=>o.waiting||o.status==='pending'||o.status==='completed');
  const purchase=all.filter(o=>o.status==='approved'||(o.from==='you'&&o.status==='accepted'));
  const closed=all.filter(o=>o.status==='cancelled'||o.status==='rejected');
  if(!all.length) return '<div class="empty"><div>⏳</div><b>Nothing pending</b><span>Orders you send, and orders from the shop once you complete them, wait here until the shop buys them in.</span></div>';
  const part=(title,sub,list)=>list.length?`<h2 class="sec">${title} <i>${list.length}</i></h2>${sub?`<div class="muted" style="margin:-4px 0 8px">${sub}</div>`:''}${list.map(orderCard).join('')}`:'';
  return part('Needs your changes','The shop asked for a change. Edit the order and send it again — the new one replaces the old.',changes)
    +part('Waiting for approval','',approval)
    +part('Waiting for purchase','Approved — the shop enters the purchase when the goods arrive.',purchase)
    +part('Cancelled or rejected','The shop will not take these. Delete them to clear them away.',closed);
}
function historyPage(){
  const done=allOrders().filter(bought);
  if(!done.length) return '<div class="empty"><div>🗂️</div><b>No history yet</b><span>Once the shop buys in an order, it shows here.</span></div>';
  return done.map(orderCard).join('');
}
async function hideOrder(ref){
  if(!confirm('Delete this order from your page? The shop keeps its own record.')) return;
  try{ await api('/hide',{method:'POST',body:{ref}}); toast('Deleted'); await load() }catch(e){ toast(e.message) }

function resendOrder(id){
  const o=(st.me.sent||[]).find(x=>x.id===id); if(!o) return;
  st.replacing={id:o.id,date:o.date,note:shopSaid(o)};
  if((o.lines||[]).length){ st.cmode='items';
    st.draft={lines:o.lines.map(l=>({desc:l.desc,pid:l.pid||null,unit:l.unit||'',qty:+l.qty||0,price:+l.price||0})),q:'',pick:null,qty:'',price:'',note:o.supNote||''} }

/* ---------- Your stock: what the shop holds of their lines, while the shop has it open ---------- */
async function loadStock(){
  st.stockBusy=true; render();
  try{ st.stock=await api('/stock') }catch(e){ st.stock={error:e.message} }
  finally{ st.stockBusy=false; render() }
}
/* ---------- Easy ordering from the stock list ----------
   Each item on the Stock page can be put straight on an order: the quantity is suggested (enough to
   get back to the reorder level), the supplier changes it if they like, and "Review & send" takes
   them to Create with the lines already on it. Nothing is sent until they send it there. */
function stockSug(l){ const need=(+l.min||0)-(+l.stock||0); return need>0?Math.ceil(need):(+l.min||1); }
function stockLineByKey(k){ return ((st.stock&&st.stock.lines)||[]).find(l=>String(l.code||l.name)===k); }
function stockOrder(l,qty){
  const D=st.draft=st.draft||{lines:[],q:'',pick:null,qty:'',price:'',note:''};
  const at=D.lines.findIndex(x=> l.pid? x.pid===l.pid : (!x.pid&&String(x.desc||'').toLowerCase()===String(l.name||'').toLowerCase()));
  if(!(qty>0)){ if(at>=0){ D.lines.splice(at,1); toast(`${l.name} taken off the order`) } render(); return; }
  if(at>=0){ D.lines[at].qty=qty; if(l.pid) D.lines[at].pid=l.pid; }
  else D.lines.push({desc:l.name,pid:l.pid||null,unit:l.unit||'',qty,price:0});
  toast(`${l.name} — ${fq(qty)} on your order`); render();
}
function addAllShownToOrder(){
  const q=(st.stockQ||'').trim().toLowerCase();
  const all=((st.stock&&st.stock.lines)||[]).filter(l=>!q||(l.name+' '+l.code).toLowerCase().includes(q));
  const low=all.filter(l=>l.low);
  let pick=q?all:(low.length?low:all);
  const CAP=120; let capped=false;
  if(pick.length>CAP){ pick=pick.slice(0,CAP); capped=true; }
  const D=st.draft=st.draft||{lines:[],q:'',pick:null,qty:'',price:'',note:''};
  let n=0;
  pick.forEach(l=>{ const at=D.lines.findIndex(x=> l.pid? x.pid===l.pid : (!x.pid&&String(x.desc||'').toLowerCase()===String(l.name||'').toLowerCase()));
    if(at<0){ D.lines.push({desc:l.name,pid:l.pid||null,unit:l.unit||'',qty:stockSug(l),price:0}); n++; } });
  toast(n?`${n} item${n===1?'':'s'} added${capped?` (first ${CAP} — search to add more)`:''}`:'They are already on your order');
  render();
}
function stockPage(){
  if(!stockOpen()) return '<div class="empty"><div>📦</div><b>Not open just now</b><span>The shop opens this for you for a day at a time. Ask them to show you your stock.</span></div>';
  if(!st.stock&&!st.stockBusy){ setTimeout(loadStock,0); return '<div class="card muted">Loading your stock…</div>' }
  if(st.stockBusy&&!st.stock) return '<div class="card muted">Loading your stock…</div>';
  const S2=st.stock||{};
  if(S2.error) return `<div class="card"><b>Could not load it</b><div class="muted">${esc(S2.error)}</div><div class="acts"><button class="btn" id="stockAgain">Try again</button></div></div>`;
  const lines=S2.lines||[], q=(st.stockQ||'').trim().toLowerCase();
  const shown=q?lines.filter(l=>(l.name+' '+l.code).toLowerCase().includes(q)):lines;
  const until=new Date(+st.me.stockUntil).toLocaleString('en-GB',{weekday:'short',hour:'2-digit',minute:'2-digit'});
  const D=st.draft=st.draft||{lines:[],q:'',pick:null,qty:'',price:'',note:''};
  const inDraft=l=>D.lines.find(x=> l.pid? x.pid===l.pid : (!x.pid&&String(x.desc||'').toLowerCase()===String(l.name||'').toLowerCase()));
  const onOrder=D.lines.length;
  return `<div class="stats">
     <div><span>Your items</span><b>${lines.length}</b></div>
     <div class="${S2.low?'bad':''}"><span>Low or out</span><b>${S2.low||0}</b></div>
     <div><span>Open until</span><b style="font-size:14px">${esc(until)}</b></div></div>
   <div class="card">
    <div class="muted" style="margin-bottom:8px">Tap <b>＋</b> to put an item on your order — the quantity is filled in for you, change it if you like, then <b>Review &amp; send</b>.</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
     <input id="stockQ" value="${esc(st.stockQ||'')}" placeholder="Search your items…" autocomplete="off" style="margin:0">
     <button class="btn" id="stockAgain" title="Read it again">↻</button></div>
    ${shown.length?`<button class="btn" id="stockAddAll" style="width:100%;margin-bottom:10px">＋ Add all ${q?'shown':'low'} items to the order</button><div class="tblwrap"><table class="paytbl"><tr><th>Item</th><th class="n">In shop</th><th class="n">Reorder</th><th class="n">Order</th></tr>
     ${shown.map(l=>{const od=inDraft(l);return `<tr${od?' class="on"':''}><td><b>${esc(l.name)}</b><div class="muted">${esc(l.code)}${l.unit?' · '+esc(l.unit):''}</div></td>
      <td class="n"><b>${fq(l.stock)}</b>${l.stock<=0?'<div><span class="tag bad">Out</span></div>':l.low?'<div><span class="tag warn">Low</span></div>':''}</td><td class="n">${fq(l.min)}</td>
      <td class="n"><div style="display:flex;gap:4px;align-items:center;justify-content:flex-end"><input class="qtyin stqin" style="width:54px" type="number" step="any" inputmode="decimal" value="${od?fq(od.qty):stockSug(l)}"><button class="btn sm${od?' tape':''}" data-stockadd="${esc(l.code||l.name)}" title="${od?'On your order — tap to update':'Put on your order'}">${od?'✓':'＋'}</button></div></td></tr>`}).join('')}</table></div>`
     :`<div class="muted">${lines.length?'Nothing matches that.':'None of your items are on the shop\'s list yet.'}</div>`}
   </div>
   ${onOrder?`<div class="card" style="position:sticky;bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px"><span><b>${onOrder}</b> item${onOrder===1?'':'s'} on your order</span><button class="btn tape" id="stockReview">Review &amp; send →</button></div>`:''}`;
}

/* ---------- Payment Portal: the bills, how old they are, and asking to be paid ---------- */
function pay(){
  const me=st.me, s=me.supplier;
  const reqs=me.payReqs||[];
  // a bill already asked for is under "Your payment requests", not here; if the shop turns the request
  // down it comes back to this list to be asked for again
  const asked=new Set(reqs.filter(r=>r.waiting||['sent','accepted','ready','queried'].includes(r.status)).flatMap(r=>(r.lines||[]).map(l=>l.no)));
  const bills=(me.bills||[]).filter(b=>!asked.has(b.no));
  const picked=st.payPick||{};
  const chosen=bills.filter(b=>picked[b.no]);
  const total=chosen.reduce((a,b)=>a+(picked[b.no].claim===''?b.owing:+picked[b.no].claim||0),0);
  const all=me.bills||[], owing=all.reduce((a,b)=>a+b.owing,0), over=all.filter(b=>b.due!==null&&b.due<0);
  const dueTag=b=>b.due===null?'':b.due<0?`<span class="tag bad">${-b.due}d over</span>`:b.due===0?'<span class="tag warn">due today</span>':`<span class="tag ok">${b.due}d left</span>`;
  return `<div class="stats">
     <div><span>Outstanding</span><b>${money(owing)}</b></div>
     <div><span>Bills</span><b>${all.length}</b></div>
     <div><span>Credit period</span><b>${s.terms?s.terms+' days':'—'}</b></div>
     <div class="${over.length?'bad':''}"><span>Past the credit period</span><b>${over.length}</b></div></div>
   ${st.paySent?`<div class="card" style="text-align:center;padding:26px 16px"><div style="font-size:40px">📨</div>
     <h2>Sent to the shop</h2><div class="muted">${st.paySent.lines} bill${st.paySent.lines===1?'':'s'} · ${money(st.paySent.total)}. The shop has been told — you will see it move below.</div>
     <button class="btn tape" id="payAgain" style="margin-top:14px">Ask for something else</button></div>`:
   bills.length?`<div class="card">
     <h2>Your bills at the shop</h2>
     <div class="muted" style="margin-bottom:10px">Tick the bills you want paid. If a figure is wrong — a credit note, a short delivery — put what it should be and say why.</div>
     <div class="tblwrap"><table class="paytbl">
      <tr><th></th><th>Invoice</th><th class="n">Amount</th><th class="n">Days</th><th class="n">Owing</th><th class="n">Asking for</th></tr>
      ${bills.map(b=>{ const p=picked[b.no], on=!!p, already=false;
        return `<tr class="${on?'on':''}">
        <td><input type="checkbox" data-paypick="${esc(b.no)}" ${on?'checked':''} ${already?'disabled':''}></td>
        <td><b>${esc(b.supInv||b.no)}</b><div class="muted">${esc(b.date)}${already?' · already asked for':''}</div></td>
        <td class="n">${money(b.total)}</td>
        <td class="n"><b>${b.days}</b>d${b.terms?`<div class="muted">of ${b.terms}d</div>`:''}<div>${dueTag(b)}</div></td>
        <td class="n">${money(b.owing)}</td>
        <td class="n">${on?`<input class="payamt" type="number" step="any" data-payamt="${esc(b.no)}" value="${p.claim}" placeholder="${b.owing}">`:'<span class="muted">—</span>'}</td>
       </tr>${on?`<tr class="sub"><td></td><td colspan="5"><input data-paynote="${esc(b.no)}" value="${esc(p.note||'')}" placeholder="why it is different, if it is — optional"></td></tr>`:''}`}).join('')}
     </table></div>
     <div class="kv" style="margin-top:10px"><span class="muted">${chosen.length} bill${chosen.length===1?'':'s'} ticked</span><b>${money(total)}</b></div>
     <div class="f" style="margin-top:8px"><label>Anything else the shop should know</label>
      <textarea id="payNote" style="min-height:70px" placeholder="e.g. cheque please, the rep will collect on Friday">${esc(st.payNote||'')}</textarea></div>
     <button class="btn tape big" id="paySend" ${chosen.length&&!st.busy?'':'disabled'}>${st.busy?'Sending…':`Request payment ${chosen.length?money(total):''}`}</button>
    </div>`:all.length?'<div class="empty"><div>📨</div><b>Every bill is asked for</b><span>They are under <b>Your payment requests</b> below. If the shop turns one down, its bills come back here.</span></div>'
     :'<div class="empty"><div>✅</div><b>Nothing outstanding</b><span>Every bill of yours is settled.</span></div>'}
   ${reqs.length?`<h2 style="margin:16px 0 8px">Your payment requests</h2>
    ${reqs.map(r=>`<div class="card o">
      <div class="h"><div><b>${money(r.total)}</b><div class="muted">${esc(r.date)} · ${(r.lines||[]).length} bill${(r.lines||[]).length===1?'':'s'}</div></div>
       ${r.waiting?'<span class="tag warn">Reaching the shop</span>':paytag(r.status)}</div>
      ${r.status==='rejected'?`<div class="notice bad">The shop turned this down${(r.events||[]).filter(e=>e.action==='rejected').slice(-1).map(e=>e.note?': <b>'+esc(e.note)+'</b>':'')[0]||''}. Its bills are back under <b>Your bills at the shop</b> to ask for again.</div>`:''}
      ${r.status==='ready'?'<div class="notice ok"><b>The money is ready.</b> Call in for the cheque or the cash.</div>':''}
      <table>${(r.lines||[]).map(l=>`<tr><td>${esc(l.supInv||l.no)}${l.note?`<div class="muted">${esc(l.note)}</div>`:''}</td><td class="n">${money(l.claim)}</td></tr>`).join('')}</table>
      ${r.pay?`<div class="muted" style="margin-top:6px">Paid ${esc(r.pay.date)} · ${esc(r.pay.what||'')}</div>`:''}
     </div>`).join('')}`:''}`;
}

async function changeUser(){
  const u=($('#aUser')||{}).value||'', c=($('#aUserPass')||{}).value||'';
  if(u.trim().length<3) return toast('A user name needs at least three letters');
  try{ const j=await api('/username',{method:'POST',body:{username:u,current:c}}); ls.set('user',j.username); toast('Your user name is now '+j.username); await load() }
  catch(e){ toast(e.message) }
}
async function changePass(){
  const c=($('#aCur')||{}).value||'', n=($('#aNew')||{}).value||'';
  if(n.length<6) return toast('A password needs at least six characters');
  try{ await api('/password',{method:'POST',body:{current:c,password:n}}); toast('Password changed'); await load() }
  catch(e){ toast(e.message) }
}

function bind(){
  const m=$('#main');
  // orders from the shop
  $$('[data-done]',m).forEach(b=>b.onclick=()=>completeOrder(b.dataset.done,false));
  $$('[data-edit]',m).forEach(b=>b.onclick=()=>{ const o=st.me.pos.find(x=>x.no===b.dataset.edit); st.edit=st.edit||{};
    st.edit[o.no]={lines:o.lines.map(l=>({...l,price:l.price||''})),invoice:'',note:''}; render() });
  const ed=(v)=>{ const [no,i]=v.split('|'); return [st.edit[no],+i] };
  $$('[data-eq]',m).forEach(el=>el.oninput=()=>{ const [e,i]=ed(el.dataset.eq); e.lines[i].qty=el.value });
  $$('[data-ep]',m).forEach(el=>el.oninput=()=>{ const [e,i]=ed(el.dataset.ep); e.lines[i].price=el.value });
  $$('[data-eq],[data-ep]',m).forEach(el=>el.onblur=()=>render());
  $$('[data-ed]',m).forEach(b=>b.onclick=()=>{ const [e,i]=ed(b.dataset.ed); e.lines.splice(i,1); render() });
  $$('[data-einv]',m).forEach(el=>el.oninput=()=>{ st.edit[el.dataset.einv].invoice=el.value });
  $$('[data-enote]',m).forEach(el=>el.oninput=()=>{ st.edit[el.dataset.enote].note=el.value });
  $$('[data-esave]',m).forEach(b=>b.onclick=()=>completeOrder(b.dataset.esave,true));
  $$('[data-ecancel]',m).forEach(b=>b.onclick=()=>{ delete st.edit[b.dataset.ecancel]; render() });
  // create an order
  const cq=$('#cq'); if(cq){ cq.oninput=()=>{ const D=st.draft; D.q=cq.value; D.pick=null; const at=cq.selectionStart; render();
      const a=$('#cq'); if(a){ a.focus(); try{ a.setSelectionRange(at,at) }catch(e){} } };
    cq.onkeydown=e=>{ if(e.key==='Enter'&&st.draft.q.trim()&&!st.draft.pick){ e.preventDefault();
      const hit=(st.items||[]).find(p=>p.name.toLowerCase()===st.draft.q.trim().toLowerCase());
      st.draft.pick=hit?{desc:hit.name,pid:hit.pid,unit:hit.unit}:{desc:st.draft.q.trim(),pid:null,unit:''}; render(); const f=$('#cqty'); if(f) f.focus() } } }
  $$('[data-cpick]',m).forEach(el=>el.onclick=()=>{ const p=(st.items||[]).find(x=>x.pid===+el.dataset.cpick);
    st.draft.pick={desc:p.name,pid:p.pid,unit:p.unit}; render(); const f=$('#cqty'); if(f) f.focus() });
  $$('[data-ctyped]',m).forEach(el=>el.onclick=()=>{ st.draft.pick={desc:st.draft.q.trim(),pid:null,unit:''}; render(); const f=$('#cqty'); if(f) f.focus() });
  const cqty=$('#cqty'); if(cqty){ cqty.oninput=()=>{ st.draft.qty=cqty.value }; cqty.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const p=$('#cprice'); if(p) p.focus() } } }
  const cpr=$('#cprice'); if(cpr){ cpr.oninput=()=>{ st.draft.price=cpr.value }; cpr.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); addDraftLine() } } }
  const cadd=$('#cadd'); if(cadd) cadd.onclick=addDraftLine;
  $$('[data-cq]',m).forEach(el=>el.onchange=()=>{ const v=+el.value; if(v>0) st.draft.lines[+el.dataset.cq].qty=v; else st.draft.lines.splice(+el.dataset.cq,1); render() });
  $$('[data-cp]',m).forEach(el=>el.onchange=()=>{ st.draft.lines[+el.dataset.cp].price=+el.value||0; render() });
  $$('[data-cdel]',m).forEach(b=>b.onclick=()=>{ st.draft.lines.splice(+b.dataset.cdel,1); render() });
  const cn=$('#cnote'); if(cn) cn.oninput=()=>{ st.draft.note=cn.value };
  const cs=$('#csend'); if(cs) cs.onclick=sendDraft;
  // create an order: the two ways, and the photos
  $$('[data-cmode]',m).forEach(b=>b.onclick=()=>{ st.cmode=b.dataset.cmode; st.flash=''; render() });
  const psnap=$('#psnap'); if(psnap) psnap.onclick=()=>$('#pfile').click();
  const pfile=$('#pfile'); if(pfile) pfile.onchange=()=>{ const P=st.photo;
    [...pfile.files].slice(0,6-P.photos.length).forEach(f=>shrink(f).then(d=>{ if(P.photos.length<6){ P.photos.push(d); render() } }).catch(()=>toast('Could not read that picture'))) };
  $$('[data-prm]',m).forEach(b=>b.onclick=()=>{ st.photo.photos.splice(+b.dataset.prm,1); render() });
  const pinv=$('#pinv'); if(pinv) pinv.oninput=()=>{ st.photo.inv=pinv.value };
  const pnote=$('#pnote'); if(pnote) pnote.oninput=()=>{ st.photo.note=pnote.value };
  const psend=$('#psend'); if(psend) psend.onclick=sendPhotos;
  // pending orders: edit and resend, delete; links between places
  $$('[data-resend]',m).forEach(b=>b.onclick=()=>resendOrder(b.dataset.resend));
  $$('[data-hide]',m).forEach(b=>b.onclick=()=>hideOrder(b.dataset.hide));
  $$('[data-unreplace]',m).forEach(b=>b.onclick=()=>{ st.replacing=null; st.draft={lines:[],q:'',pick:null,qty:'',price:'',note:''}; st.photo={photos:[],inv:'',note:''}; render() });
  $$('[data-goto]',m).forEach(a=>a.onclick=e=>{ e.preventDefault(); st.tab=a.dataset.goto; st.flash=''; render(); window.scrollTo(0,0) });
  // their stock
  const sq=$('#stockQ'); if(sq) sq.oninput=()=>{ st.stockQ=sq.value; const at=sq.selectionStart; render(); const n=$('#stockQ'); if(n){ n.focus(); try{ n.setSelectionRange(at,at) }catch(e){} } };
  const sa=$('#stockAgain'); if(sa) sa.onclick=()=>{ st.stock=null; loadStock() };
  $$('[data-stockadd]',m).forEach(b=>b.onclick=()=>{ const l=stockLineByKey(b.dataset.stockadd); if(!l) return; const inp=b.closest('td').querySelector('.stqin'); stockOrder(l, inp?+inp.value||0:0); });
  $$('.stqin',m).forEach(el=>el.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); const b=el.closest('td').querySelector('[data-stockadd]'); if(b) b.click(); } });
  const saa=$('#stockAddAll'); if(saa) saa.onclick=addAllShownToOrder;
  const sr=$('#stockReview'); if(sr) sr.onclick=()=>{ st.tab='create'; st.cmode='items'; st.flash=''; render(); window.scrollTo(0,0); };
  // payment portal
  $$('[data-paypick]',m).forEach(cb=>cb.onchange=()=>{ st.payPick=st.payPick||{};
    if(cb.checked) st.payPick[cb.dataset.paypick]={claim:'',note:''}; else delete st.payPick[cb.dataset.paypick];
    render() });
  $$('[data-payamt]',m).forEach(el=>{ el.oninput=()=>{ st.payPick[el.dataset.payamt].claim=el.value }; el.onblur=()=>render() });
  $$('[data-paynote]',m).forEach(el=>el.oninput=()=>{ st.payPick[el.dataset.paynote].note=el.value });
  const pn=$('#payNote'); if(pn) pn.oninput=()=>{ st.payNote=pn.value };
  const ag=$('#payAgain'); if(ag) ag.onclick=()=>{ st.paySent=null; render() };
  const ps=$('#paySend'); if(ps) ps.onclick=askToBePaid;
  // account
  const au=$('#aUserGo'); if(au) au.onclick=changeUser;
  const ap=$('#aPassGo'); if(ap) ap.onclick=changePass;
  const ts=$('#tmSend'); if(ts) ts.onclick=askForPerson;
  const ta=$('#teamAgain'); if(ta) ta.onclick=()=>{ st.teamSent=null; render() };
}

/* Goods of theirs that came in broken. The value came off what the shop owes them the moment it
   was raised, so a rep who cannot see why the figure moved would otherwise have to ring and ask. */
const DMG_SAID={held:['Waiting to go back','warn'],sent:['Sent back to you','blue'],
  refused:['You turned it down','bad'],credited:['Credited','ok'],replaced:['Replaced','ok']};
function damageCard(){
  const list=st.me.damages||[];
  if(!list.length) return '';
  const tag=(s)=>{ const d=DMG_SAID[s]||['',''];  return `<span class="tag ${d[1]}">${d[0]||esc(s)}</span>` };
  return `<div class="card"><h2>Damaged goods</h2>
   <div class="muted" style="margin-bottom:10px">${list.length} item${list.length===1?'':'s'} of yours came in
    broken or faulty, worth ${money(st.me.damageValue||0)}. That has already been taken off what the shop
    owes you above. Ring the counter if you want to see them.</div>
   <table class="paytbl">
    <tr><th>What</th><th class="n">How many</th><th class="n">Worth</th><th></th></tr>
    ${list.map(d=>`<tr><td><b>${esc(d.item)}</b><div class="muted">${esc(d.date)}${d.reason?' · '+esc(d.reason):''}</div></td>
     <td class="n">${d.qty}</td><td class="n">${money(d.value)}</td><td>${tag(d.status)}</td></tr>`).join('')}
   </table></div>`;
}
function shrink(file){ return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,1600/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc); const g=c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg',0.82)) }; img.onerror=rej; img.src=URL.createObjectURL(file) }) }
/* Signing in: by the user name the shop gave you, or the old way with the mobile on file and a
   texted code. Forgotten sends a code to the number kept against that sign-in. */
function signIn(then){
  const el=document.createElement('div'); el.className='sheet';
  let phone=st.phone||'', stage=ls.get('user')?'user':'user', hint='', name='', user=ls.get('user')||'';
  const draw=()=>{
    const titles={user:'Sign in',phone:'Your mobile',code:'The code we sent',forgot:'Forgotten your password',reset:'A new password'};
    el.innerHTML=`<div class="box"><h2 style="margin-bottom:2px">${titles[stage]}</h2>
    <div class="muted" style="margin-bottom:12px">${
      stage==='user'?'The user name the shop gave you.'
      :stage==='phone'?'The number the shop has on file for your company.'
      :stage==='forgot'?'We will text a code to the number on that sign-in.'
      :stage==='reset'?'The code we texted you, and the password you want from now on.'
      :'Sent to '+esc(phone)+(name?' — '+esc(name):'')+'. It works for 5 minutes.'}</div>
    ${stage==='user'?`<div class="f"><label>User name</label><input id="sUser" value="${esc(user)}" autocapitalize="off" spellcheck="false" autocomplete="username"></div>
       <div class="f"><label>Password</label><input id="sPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>`
     :stage==='phone'?`<div class="f"><label>Mobile</label><input id="sPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel"></div><div class="f"><label>Your name</label><input id="sRep" value="${esc(st.rep)}" placeholder="Rep's name"></div>`
     :stage==='forgot'?`<div class="f"><label>User name</label><input id="sFUser" value="${esc(user)}" autocapitalize="off" spellcheck="false"></div>`
     :stage==='reset'?`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}
       <div class="f code"><label>Code</label><input id="sFCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>
       <div class="f"><label>New password</label><input id="sFPass" type="password" autocomplete="new-password" placeholder="at least six characters"></div>`
     :`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="f code"><label>Code</label><input id="sCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>`}
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="sX">Cancel</button>
     <button class="btn tape" id="sGo" style="flex:1">${stage==='user'?'Sign in':stage==='phone'?'Text me a code':stage==='forgot'?'Text me a code':stage==='reset'?'Set it':'Sign in'}</button></div>
    <div class="muted" style="margin-top:10px">${
      stage==='user'?'<a href="#" id="sForgot">Forgotten your password?</a> · <a href="#" id="sPhoneWay">use my mobile instead</a>'
      :stage==='phone'?'<a href="#" id="sUserWay">sign in with a user name</a>'
      :stage==='code'?'<a href="#" id="sBack">Wrong number?</a>'
      :'<a href="#" id="sUserWay">back</a>'}</div></div>`;
    $('#sX',el).onclick=()=>el.remove();
    const go=(s)=>e=>{ e.preventDefault(); stage=s; draw() };
    const bk=$('#sBack',el); if(bk) bk.onclick=go('phone');
    const fw=$('#sForgot',el); if(fw) fw.onclick=go('forgot');
    const pw=$('#sPhoneWay',el); if(pw) pw.onclick=go('phone');
    const uw=$('#sUserWay',el); if(uw) uw.onclick=go('user');
    $('#sGo',el).onclick=step; const inp=$('input',el); if(inp) inp.focus();
    $$('input',el).forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();step()} }) };
  const step=async()=>{ const go=$('#sGo',el); go.disabled=true;
    try{
      if(stage==='user'){
        user=$('#sUser',el).value.trim(); const password=$('#sPass',el).value;
        if(!user||!password) throw new Error('Your user name and password, please');
        const j=await api('/signin',{method:'POST',body:{user,password}});
        st.token=j.token; st.rep=j.rep||st.rep; ls.set('token',j.token); ls.set('user',user); ls.set('rep',st.rep);
        el.remove(); toast('Welcome, '+(j.rep||j.supplier)); return then&&then();
      }
      if(stage==='forgot'){
        user=$('#sFUser',el).value.trim(); if(!user) throw new Error('Which user name?');
        const j=await api('/forgot',{method:'POST',body:{user}}); hint=j.sent?'':(j.code||''); if(!j.sent&&!j.code) throw new Error(j.note||'Could not text you — please ring the shop'); stage='reset'; return draw();
      }
      if(stage==='reset'){
        await api('/reset',{method:'POST',body:{user,code:$('#sFCode',el).value.trim(),password:$('#sFPass',el).value}});
        toast('That is your password now'); stage='user'; return draw();
      }
      if(stage==='phone'){ phone=$('#sPh',el).value.replace(/\D/g,''); st.rep=$('#sRep',el).value.trim(); ls.set('rep',st.rep); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567');
        const j=await api('/otp',{method:'POST',body:{phone}}); hint=j.sent?'':(j.code||''); if(!j.sent&&!j.code) throw new Error(j.note||'Could not text you — please ring the shop'); name=j.name||''; stage='code'; return draw() }
      const code=$('#sCode',el).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code');
      const j=await api('/login',{method:'POST',body:{phone,code,rep:st.rep}}); st.token=j.token; st.phone=phone; ls.set('token',j.token); ls.set('phone',phone); el.remove(); toast('Welcome, '+(st.rep||j.supplier)); if(then) then() }
    catch(e){ toast(e.message); go.disabled=false } };
  document.body.appendChild(el); draw();
}
async function load(){ if(!st.token) return render(); try{ st.me=await api('/me') }catch(e){ if(st.token) toast(e.message); st.me=null } render() }
/* what the shop does shows here within seconds: read again every 15 seconds while the page is in
   front, and at once when it comes back to the front — never while something is being filled in */
const quiet=()=>{ const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  return st.token&&!st.busy&&!typing&&!document.hidden&&!(st.edit&&Object.keys(st.edit).length)&&!(st.draft&&st.draft.lines.length)&&!(st.photo&&st.photo.photos.length) };
load(); setInterval(()=>{ if(quiet()) load() },15000);
document.addEventListener('visibilitychange',()=>{ if(quiet()) load() });
</script>
</body>
</html>
