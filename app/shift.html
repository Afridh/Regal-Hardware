<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Clock — Regal Hardware</title>
<meta name="theme-color" content="#101E22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="sl-holidays.js"></script>
<style>
/* the till's own look (index.html): the same tokens, buttons and attendance cards, so the board here
   and the Attendance screen at the till are one thing on two screens */
:root{
 --ink:#101E22; --ink2:#1B2E33; --steel:#5A6E72; --faint:#8C9CA0;
 --page:#EEF1F0; --panel:#F7F9F8; --white:#fff; --line:#D8DEDD; --line2:#EAEEED;
 --chip-yellow:#F0A81E; --chip-rust:#C0442C; --chip-blue:#16799B; --chip-green:#1E8A5A;
 --accent:#F0A81E; --r:6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);
 background:var(--page);
 background-image:radial-gradient(1200px 600px at 15% -10%, #FFFDF7 0%, transparent 60%),
                  radial-gradient(900px 500px at 100% 0%, #E6F1F3 0%, transparent 55%);
 background-attachment:fixed;
 font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.5;
 font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
button{font:inherit}
.mono{font-family:'IBM Plex Mono',monospace}
.muted{color:var(--steel);font-size:12.5px}

.btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:8px 13px;border-radius:var(--r);
 cursor:pointer;font-weight:500;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;justify-content:center;
 box-shadow:0 1px 1px rgba(16,30,34,.10);transition:transform .12s ease,box-shadow .12s ease,background .12s ease,filter .12s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.tape{background:linear-gradient(180deg,#F7BB3C,#EFA412);border-color:#D08F09;color:#2A2103;font-weight:600;
 box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px rgba(240,168,30,.35)}
.btn.tape:hover{filter:brightness(1.04)}
.btn.ghost{background:var(--white);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--panel);border-color:var(--steel)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.42;cursor:default;transform:none}

main{max-width:1180px;margin:0 auto;padding:12px 16px 60px}

/* ---- the Attendance board, as the till draws it ---- */
.att-banner{background:#101E22;color:#fff;border-radius:10px;padding:12px 16px;margin-bottom:12px;border:1px solid rgba(240,168,30,.25);box-shadow:0 2px 8px rgba(16,30,34,.12)}
.att-banner-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.att-banner-title{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;color:#fff}
.att-banner-title img{width:26px;height:26px;border-radius:6px;background:#fff;object-fit:contain;padding:2px}
.att-banner-rules{display:flex;gap:6px;font-size:11.5px;flex-wrap:wrap;color:#94A3B8;margin-top:3px}
.att-banner-rules span{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.07);padding:2px 7px;border-radius:6px;border:1px solid rgba(255,255,255,.08)}
.att-header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.att-summary-chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.att-chip{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.08);color:#E2E8F0}
.att-chip.green{background:rgba(16,185,129,.15);color:#34D399;border:1px solid rgba(16,185,129,.25)}
.att-chip.purple{background:rgba(99,102,241,.15);color:#A5B4FC;border:1px solid rgba(99,102,241,.25)}
.att-chip.amber{background:rgba(245,158,11,.15);color:#FBBF24;border:1px solid rgba(245,158,11,.25)}
.att-chip.red{background:rgba(239,68,68,.15);color:#F87171;border:1px solid rgba(239,68,68,.25)}
.att-chip.slate{background:rgba(148,163,184,.15);color:#CBD5E1;border:1px solid rgba(148,163,184,.25)}
.att-clock{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;letter-spacing:0.5px;background:#162A30;color:var(--accent);padding:3px 9px;border-radius:6px;white-space:nowrap;border:1px solid rgba(240,168,30,.25)}
.att-who{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#CBD5E1}
.att-who .btn.sm{color:#fff;background:transparent;border-color:rgba(255,255,255,.2);font-size:11px;padding:3px 8px}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:#94A3B8}
.sync.live i{background:#34D399;box-shadow:0 0 6px #34D399}
.sync.bad i{background:#F87171}

.card.note{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:13px}
.card.note.bad{background:#FEE2E2;border-color:#FECACA;color:#B91C1C}
.att-search-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.att-search-box{position:relative;flex:1;max-width:380px;min-width:0}
.att-search-box input{width:100%;font-size:16px;padding:7px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none;font-family:inherit}
.att-search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,168,30,.15)}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bcard{position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:flex;flex-direction:column;gap:9px;overflow:hidden;transition:box-shadow .15s,border-color .15s}
.bcard:hover{box-shadow:0 4px 12px rgba(0,0,0,.07);border-color:#CBD5E1}
.bcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#CBD5E1}
.bcard.working::before{background:#10B981}
.bcard.late::before{background:#F59E0B}
.bcard.break::before{background:#6366F1}
.bcard.leave_pending::before{background:#F59E0B}
.bcard.leave_early::before{background:#3B82F6}
.bcard.done::before{background:#64748B}
.bcard.absent::before{background:#EF4444}
.bc-top{display:flex;align-items:flex-start;gap:9px}
.bc-avatar{width:34px;height:34px;border-radius:8px;background:#101E22;color:#F0A81E;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;flex:0 0 34px}
.bc-meta{flex:1;min-width:0}
.bc-meta .bc-name{font-family:Archivo,sans-serif;font-weight:700;font-size:14px;color:var(--ink);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bc-meta .bc-role{font-size:11px;color:var(--steel);margin-top:2px}
.bc-badge{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.bc-badge.working{background:#DCFCE7;color:#15803D}
.bc-badge.late{background:#FEF3C7;color:#B45309}
.bc-badge.break{background:#EEF2FF;color:#4F46E5}
.bc-badge.pending{background:#FEF9C3;color:#A16207;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.bc-badge.leave_early{background:#DBEAFE;color:#1D4ED8}
.bc-badge.done{background:#F1F5F9;color:#475569}
.bc-badge.absent{background:#FEE2E2;color:#B91C1C}
.bc-badge.extra-break{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
.bc-badge.ot-badge{background:#ECFDF5;color:#047857;border:1px solid #6EE7B7}
.bc-live-badge{display:inline-flex;align-items:center;gap:6px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;padding:4px 9px;border-radius:6px;width:fit-content;letter-spacing:0.2px;background:#F8FAFC;color:#94A3B8;border:1px solid #E2E8F0}
.bc-live-badge.working{background:rgba(16,185,129,.12);color:#059669;border:1px solid rgba(16,185,129,.3)}
.bc-live-badge.working .live-dot{width:6px;height:6px;border-radius:50%;background:#10B981;display:inline-block;animation:pulseDot 1.5s infinite}
@keyframes pulseDot{0%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(0.8)}100%{opacity:1;transform:scale(1)}}
.bc-live-badge.break{background:rgba(99,102,241,.12);color:#4F46E5;border:1px solid rgba(99,102,241,.25)}
.bc-live-badge.done,.bc-live-badge.leave_early{background:#F1F5F9;color:#475569;border:1px solid #E2E8F0}
.bc-live-badge.out{font-size:11px}
.bc-live-badge.absent{background:#FEE2E2;color:#DC2626;border:1px solid #FECACA}
.bc-meal-row{display:flex;flex-direction:column;gap:4px}
.bc-meal-title{font-size:10.5px;font-weight:700;color:var(--steel);text-transform:uppercase;letter-spacing:.05em}
.bc-meals{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.bc-meal-btn{border:1px solid var(--line);background:#F8FAFC;border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:all .12s;font-family:inherit}
.bc-meal-btn:hover{border-color:var(--accent);background:#FFFBEB;color:#92400E}
.bc-meal-btn.taken{background:#F0FDF4;color:#166534;border-color:#BBF7D0;opacity:.8}
.bc-notice{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;padding:6px 9px;border-radius:6px;font-size:11.5px;line-height:1.35}
.bc-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:2px}
.bc-acts .btn{flex:1;min-width:78px}
.bc-acts .btn.sm{padding:5px 8px;font-size:11.5px}
.bc-bottom-row{display:flex;justify-content:center;padding-top:4px;border-top:1px solid #F1F5F9}
.bc-toggle-btn{background:none;border:none;color:var(--steel);font-size:11px;font-weight:600;cursor:pointer;padding:2px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:3px;font-family:inherit;transition:color .12s}
.bc-toggle-btn:hover{color:var(--ink);background:#F8FAFC}
.bc-metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;background:#F8FAFC;padding:8px 10px;border-radius:6px;font-size:11.5px;border:1px solid #E2E8F0}
.bc-metric{display:flex;flex-direction:column}
.bc-metric .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);font-weight:700}
.bc-metric .val{font-size:12.5px;font-weight:600;color:var(--ink);margin-top:1px}
.bc-metric .val.late-val{color:#B45309}
.bc-metric .val.ot-val{color:#15803D;font-weight:700}
.bc-breaks{margin-top:6px;font-size:10.5px;color:var(--steel);background:#F8FAFC;padding:5px 8px;border-radius:6px;border:1px solid #E2E8F0}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:10px;padding:40px 16px;color:var(--steel)}
.empty h3{margin:0 0 4px;color:var(--ink);font-family:Archivo,sans-serif}
@media (max-width:520px){ .bgrid{grid-template-columns:1fr} .att-search-box{max-width:none} }

/* dialogs: the till's modal, and its lock screen for signing in */
.veil{position:fixed;inset:0;z-index:200;background:rgba(16,30,34,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:#fff;border-radius:10px;padding:20px;width:100%;max-width:380px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.dlg img{width:54px;height:54px;display:block;margin:0 auto 10px;object-fit:contain}
.dlg h2,.dlg h3{margin:0 0 6px;font-family:Archivo,sans-serif;font-size:17px}
.dlg h3{text-align:center}
.dlg p{margin:0 0 14px;color:var(--steel);font-size:13px;line-height:1.5}
.dlg p.c{text-align:center}
.dlg label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin-bottom:4px}
.dlg input{width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:#fff;outline:none}
.dlg input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(240,168,30,.15)}
.dlg .err{color:var(--chip-rust);font-size:13px;min-height:18px;margin-bottom:6px;text-align:center}
.dlg .row{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.dlg .wide{width:100%;padding:10px 13px}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:300;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100vw - 32px);transition:.22s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<main>
  <div class="att-banner">
    <div class="att-banner-row">
      <div>
        <div class="att-banner-title"><img src="regal-logo.png" alt=""> Regal Hardware · Attendance &amp; Shifts</div>
        <div class="att-banner-rules" id="rules"></div>
      </div>
      <div class="att-header-right">
        <div class="att-summary-chips" id="chips"></div>
        <div class="att-clock" id="clk">🕒 --:--</div>
      </div>
    </div>
    <div class="att-who">
      <span class="sync" id="sync"><i></i><span id="syncTxt">Connecting…</span></span>
      <span id="whoBox" style="display:none">Signed in: <b id="whoName"></b> <button class="btn sm" onclick="signOut()">Sign out</button></span>
    </div>
  </div>
  <div id="notice"></div>
  <div class="att-search-bar">
    <div class="att-search-box"><input id="q" type="search" placeholder="🔍 Search staff name / code…" autocomplete="off" oninput="draw()"></div>
  </div>
  <div class="bgrid" id="grid"><div class="empty"><h3>Loading…</h3>Getting the staff list from the shop system</div></div>
</main>
<div id="toast"></div>

<script>
/* The shift clock. It shows the same staff and the same attendance as the Attendance screen in the
   shop system (/pos) — one set of records on the server, drawn with the till's own cards. A punch here
   is saved as that one record and the till picks it up within a couple of seconds; anything done at the
   till, or on another phone, shows here the same way. Only an admin can open it: they sign in once on
   the device. */
const API = '/api';
const TOKEN_KEY = 'regal_shift_token';          // this page's own sign-in, apart from the till's
const CACHE_KEY = 'regal_shift_cache';          // this page's own copy — never the till's
const POLL_MS = 2000;

const DEFAULTS = {
  startTime: '08:00', closeTime: '19:30', graceMin: 0, weeklyOff: [],
  breaks: [
    { id: 'b1', name: 'Breakfast', start: '08:30', end: '08:45', mins: 15, extra: 0, paid: true },
    { id: 'b2', name: 'Lunch', start: '12:30', end: '13:00', mins: 30, extra: 0, paid: true },
    { id: 'b3', name: 'Evening Tea', start: '15:30', end: '15:40', mins: 10, extra: 0, paid: true }
  ]
};

let token = ''; try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
let me = null;                                   // { name, role } of the admin signed in here
let S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } };
let rev = 0, pollT = null, loading = false, online = null;
const openDetails = new Set();                   // cards with "See details" open survive a redraw

/* ---------------- time, the way the till counts it ---------------- */
const pad = n => String(n).padStart(2, '0');
const D = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;   // local date, never UTC
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(Math.round(m % 60));
const hrs = m => (m || 0) / 60;
const dur = m => { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m / 60)}h ${m % 60}m`; };
const fmtMin = m => { m = Math.max(0, Math.round(m || 0)); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ampm = t => { const m = toMin(t), h = Math.floor(m / 60) % 24; return `${h % 12 || 12}:${pad(m % 60)} ${h < 12 ? 'AM' : 'PM'}`; };

function set() {
  const s = { ...DEFAULTS, ...(S.shift.settings || {}) };
  if (!(S.shift.settings || {}).slCalendar) s.weeklyOff = [];      // as the till: Sundays open until a weekly off is chosen
  if (!s.breaks || !s.breaks.length) s.breaks = DEFAULTS.breaks;
  return s;
}
const stdMin = () => Math.max(60, toMin(set().closeTime) - toMin(set().startTime)
  - set().breaks.filter(b => !b.paid).reduce((a, b) => a + (toMin(b.end) - toMin(b.start)), 0));
const recOf = (ds, id) => ((S.shift.days || {})[ds] || {})[id];
// index.html isOff: Sri Lankan public holidays and Poya days, the shop's own, a weekly off — unless opened
const holidayOf = ds => window.slHoliday ? window.slHoliday(S.shift, ds) : null;
const isOff = ds => !(S.shift.openDays || []).includes(ds)
  && ((set().weeklyOff || []).includes(new Date(ds + 'T00:00').getDay()) || !!holidayOf(ds));

/* index.html empState */
function state(ds, id) {
  const r = recOf(ds, id);
  if (r && r.status === 'absent') return 'absent';
  if (r && r.status === 'leave') return 'leave';
  if (r && r.leaveEarly && r.leaveEarly.pending) return 'leave_pending';
  if (r && (r.breaks || []).some(b => !b.end)) return 'break';
  if (r && r.in && !r.out) return 'working';
  if (r && r.in && r.out) return (r.leaveEarly && r.leaveEarly.approved) ? 'leave_early' : 'done';
  return 'out';
}

/* index.html dayFigures: the same figures the till's Attendance screen shows */
function figures(ds, id) {
  const r = recOf(ds, id);
  const f = { status: r ? r.status : 'none', in: r && r.in, out: r && r.out, gross: 0, breakMin: 0, worked: 0, late: 0, ot: 0, reg: 0, over: 0 };
  if (!r || r.status !== 'work' || !r.in) return f;
  const today = ds === D();
  const now = today ? nowMin() : (r.out ? toMin(r.out) : toMin(r.in));
  const close = toMin(set().closeTime || '19:30');
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions : [{ in: r.in, out: r.out }];
  f.late = Math.max(0, toMin(sessions[0].in || r.in) - (toMin(set().startTime || '08:00') + (+set().graceMin || 0)));
  // 15m breakfast, 30m lunch, 10m evening tea: anything past the allowance is extra break
  const intervals = (r.breaks || []).map(b => {
    const def = set().breaks.find(x => x.id === b.id);
    const bid = String(b.id || '').toLowerCase(), bname = String(b.name || '').toLowerCase();
    let allow = 15;
    if (bid === 'b1' || bname.includes('breakfast')) allow = 15;
    else if (bid === 'b2' || bname.includes('lunch')) allow = 30;
    else if (bid === 'b3' || bname.includes('tea')) allow = 10;
    else if (def && def.mins) allow = +def.mins;
    const bs = toMin(b.start), be = b.end ? toMin(b.end) : (today ? now : bs), d = Math.max(0, be - bs);
    if (d > allow) f.over += d - allow;
    f.breakMin += d;
    return { start: bs, end: be };
  });
  const inBreak = (a, b) => intervals.reduce((t, k) => t + Math.max(0, Math.min(k.end, b) - Math.max(k.start, a)), 0);
  sessions.forEach(s => {
    if (!s || !s.in) return;
    const sIn = toMin(s.in), sOut = s.out ? toMin(s.out) : (today ? now : sIn);
    const gross = Math.max(0, sOut - sIn);
    f.gross += gross;
    f.worked += Math.max(0, gross - inBreak(sIn, sOut));
    if (sOut > close) { const a = Math.max(sIn, close); f.ot += Math.max(0, sOut - a - inBreak(a, sOut)); }   // past 7:30 PM is OT
  });
  if (f.worked > stdMin()) f.ot = Math.max(f.ot, f.worked - stdMin());
  f.reg = Math.max(0, f.worked - f.ot);
  return f;
}

/* ---------------- punching: what the till's buttons do ---------------- */
function put(ds, id, patch) {
  S.shift.days = S.shift.days || {};
  S.shift.days[ds] = S.shift.days[ds] || {};
  S.shift.days[ds][id] = { ...(S.shift.days[ds][id] || {}), ...patch, by: me ? me.name : 'shift', updatedAt: Date.now() };
  draw();
  save(ds, id);
}
const emp = id => S.employees.find(e => e.id === id) || { name: 'Staff' };

function punchIn(id) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  let sessions = Array.isArray(r.sessions) ? r.sessions.map(s => ({ ...s })) : [];
  if (r.in && (r.out || sessions.length)) {
    // back again the same day: the hours carry on from the last check-out
    if (!sessions.length) sessions = [{ in: r.in, out: r.out || t }];
    if (!sessions[sessions.length - 1].out) sessions[sessions.length - 1].out = t;
    sessions.push({ in: t, out: null });
    put(ds, id, { status: 'work', in: r.in, out: null, sessions, breaks: r.breaks || [], leaveEarly: null });
    toast(`${emp(id).name} checked in again at ${t}`);
  } else {
    put(ds, id, { status: 'work', in: t, out: null, sessions: [{ in: t, out: null }], breaks: r.breaks || [], leaveEarly: null });
    const late = Math.max(0, nowMin() - toMin(set().startTime));
    toast(late ? `${emp(id).name} checked in at ${t} (${fmtMin(late)} Late)` : `${emp(id).name} checked in on time at ${t}`);
  }
}
function punchOut(id) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t });
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions.map(s => ({ ...s })) : (r.in ? [{ in: r.in, out: null }] : []);
  if (sessions.length) sessions[sessions.length - 1].out = t;
  put(ds, id, { out: t, breaks, sessions });
  const f = figures(ds, id);
  toast(`${emp(id).name} checked out at ${t} · ${dur(f.worked)} worked${f.ot ? ` · ${dur(f.ot)} OT` : ''}`);
}
function mealStart(id, bid) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || r.status !== 'work' || !r.in) return toast('Check in required before starting break');
  const def = set().breaks.find(b => b.id === bid) || { name: bid };
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t }).concat([{ id: bid, name: def.name, start: t, end: null }]);
  put(ds, id, { breaks });
  toast(`${emp(id).name} started ${def.name}`);
}
function mealEnd(id) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || !r.breaks) return;
  const open = r.breaks.find(b => !b.end);
  put(ds, id, { breaks: r.breaks.map(b => b.end ? b : { ...b, end: t }) });
  toast(`${emp(id).name} back from ${open ? open.name || 'break' : 'break'}`);
}
function confirmAbsent(id) {
  const e = emp(id);
  const v = veil(`<div class="dlg">
      <h2>⚠️ Verify Absence · ${esc(e.name)}</h2>
      <p>Are you sure you want to mark <b>${esc(e.name)}</b>${e.position ? ` (${esc(e.position)}${e.code ? ' · ' + esc(e.code) : ''})` : ''} as <b style="color:var(--chip-rust)">Absent</b> for today (<b>${new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}</b>)?</p>
      <p class="muted" style="margin-top:-6px">This will record them as not present for today and deduct their day's attendance/wage.</p>
      <div class="row"><button class="btn ghost" id="abNo">Cancel</button>
        <button class="btn" style="background:var(--chip-rust);border-color:var(--chip-rust)" id="abOk">Confirm Absent</button></div>
    </div>`);
  v.querySelector('#abNo').onclick = () => v.remove();
  v.querySelector('#abOk').onclick = () => {
    v.remove();
    put(D(), id, { status: 'absent', at: hhmm(nowMin()), in: null, out: null, breaks: [], sessions: [] });
    toast(`${e.name} marked absent for today`);
  };
}
function approveLeave(id, yes) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || !r.leaveEarly) return;
  if (yes) {
    const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions.map(s => ({ ...s })) : (r.in ? [{ in: r.in, out: null }] : []);
    if (sessions.length && !sessions[sessions.length - 1].out) sessions[sessions.length - 1].out = t;
    put(ds, id, { out: t, sessions, breaks: (r.breaks || []).map(b => b.end ? b : { ...b, end: t }),
      leaveEarly: { ...r.leaveEarly, approved: true, pending: false, approvedBy: me ? me.name : 'Admin', at: t } });
    toast(`Early leave approved for ${emp(id).name}`);
  } else {
    put(ds, id, { leaveEarly: null });
    toast(`Early leave request rejected for ${emp(id).name}`);
  }
}
function toggleDetails(id, btn) {
  const box = document.getElementById('details-' + id);
  if (!box) return;
  const open = box.style.display !== 'none';
  box.style.display = open ? 'none' : 'block';
  btn.innerHTML = open ? 'See details ▾' : 'Hide details ▴';
  if (open) openDetails.delete(id); else openDetails.add(id);
}

/* ---------------- drawing: index.html boardToday + renderStaffCard ---------------- */
function draw() {
  const ds = D();
  const rows = (S.employees || []).filter(e => {
    if (!e || e.active === false || !e.name) return false;
    const n = String(e.name).toLowerCase().trim();
    return n !== 'demo' && n !== 'demo user';
  }).map(e => ({ e, st: state(ds, e.id), f: figures(ds, e.id), r: recOf(ds, e.id) || {} }));

  const c = st => rows.filter(x => x.st === st).length, late = rows.filter(x => x.f.late > 0).length;
  document.getElementById('chips').innerHTML =
    `<span class="att-chip green"><b>${c('working') + c('break')}</b> In Shop</span>
     <span class="att-chip purple"><b>${c('break')}</b> On Break</span>
     ${late ? `<span class="att-chip amber"><b>${late}</b> Late</span>` : ''}
     <span class="att-chip slate"><b>${c('out')}</b> Not In</span>
     ${c('absent') ? `<span class="att-chip red"><b>${c('absent')}</b> Absent</span>` : ''}`;
  document.getElementById('rules').innerHTML =
    `<span>⏰ ${ampm(set().startTime)} – ${ampm(set().closeTime)}</span><span>⚡ Late past ${ampm(set().startTime)}</span><span>🌙 OT past ${ampm(set().closeTime)}</span>`;
  if (online !== false) {
    document.getElementById('notice').innerHTML = isOff(ds) ? `<div class="card note"><b>The shop is closed today</b>
      <div class="muted">${esc(holidayOf(ds) || 'Weekly off')} — check-ins and overtime still track normally if staff report to duty.</div></div>` : '';
  }

  const grid = document.getElementById('grid');
  if (!rows.length) {
    grid.innerHTML = `<div class="empty"><h3>${online === false ? 'Cannot reach the shop system' : 'No staff yet'}</h3>${online === false
      ? 'The server is not answering. The cards come back by themselves when it does.'
      : 'Staff are added in the shop system under Users — they show here straight away.'}</div>`;
    return;
  }
  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = q ? rows.filter(x => [x.e.name, x.e.position, x.e.code, x.e.card].some(v => String(v || '').toLowerCase().includes(q))) : rows;
  grid.innerHTML = list.length ? list.map(card).join('') : `<div class="empty"><h3>No one here</h3>Nobody matches “${esc(q)}”.</div>`;
}

function card({ e, st, f, r }) {
  const id = e.id, brs = r.breaks || [], open = brs.find(b => !b.end), isLate = f.late > 0;
  let bc = 'out', bl = '';
  if (st === 'working') {
    if (f.ot > 0) { bc = 'working'; bl = isLate ? `WORKING · LATE ${fmtMin(f.late).toUpperCase()} · OT` : 'WORKING · OT'; }
    else if (isLate) { bc = 'late'; bl = `WORKING · LATE ${fmtMin(f.late).toUpperCase()}`; }
    else { bc = 'working'; bl = 'WORKING'; }
  } else if (st === 'break') { bc = 'break'; bl = `ON BREAK · ${(open ? open.name || 'Meal' : 'Meal').toUpperCase()}`; }
  else if (st === 'leave_pending') { bc = 'pending'; bl = 'LEAVE REQUESTED'; }
  else if (st === 'leave_early') { bc = 'leave_early'; bl = 'LEFT EARLY'; }
  else if (st === 'done') { bc = 'done'; bl = 'GONE HOME'; }
  else if (st === 'absent') { bc = 'absent'; bl = 'ABSENT'; }
  else if (st === 'leave') { bc = 'leave_early'; bl = 'ON LEAVE'; }
  const taken = bid => brs.some(b => b.id === bid && b.end);
  const meal = (bid, icon, name, mins) => `<button class="bc-meal-btn ${taken(bid) ? 'taken' : ''}" onclick="mealStart(${id},'${bid}')">${taken(bid) ? '✓ ' + name : `${icon} ${name} (${mins}m)`}</button>`;
  const shown = openDetails.has(id);
  const live = st === 'working' || st === 'leave_pending' ? `<span class="live-dot"></span>⏱️ ${dur(f.worked)} working${f.ot > 0 ? ` · ${fmtMin(f.ot)} OT` : ''}`
    : st === 'break' ? `☕ ${esc(open && open.name ? open.name.charAt(0).toUpperCase() + open.name.slice(1).toLowerCase() : 'Break')} · ${dur(f.worked)} floor time`
    : st === 'done' || st === 'leave_early' ? `✓ ${dur(f.worked)} worked today${f.ot > 0 ? ` · ${fmtMin(f.ot)} OT` : ''}`
    : st === 'absent' ? '✕ Absent today'
    : st === 'leave' ? `On leave${r.note ? ' · ' + esc(r.note) : ''}` : '⏱️ 0h 0m · Not in yet';
  return `<div class="bcard ${st === 'working' && isLate ? 'late' : st}">
      <div class="bc-top">
        <div class="bc-avatar">${esc((String(e.name || '?').trim()[0] || '?').toUpperCase())}</div>
        <div class="bc-meta">
          <div class="bc-name" title="${esc(e.name)}">${esc(e.name)}</div>
          <div class="bc-role">${esc(e.position || 'Staff')}${e.code ? ` · <span class="mono">${esc(e.code)}</span>` : ''}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px">
          ${st !== 'out' && bl ? `<div class="bc-badge ${bc}">${bl}</div>` : ''}
          ${f.over > 0 ? `<div class="bc-badge extra-break">EXTRA BREAK · ${fmtMin(f.over).toUpperCase()}</div>` : ''}
          ${f.ot > 0 ? `<div class="bc-badge ot-badge">🌙 OT · ${fmtMin(f.ot).toUpperCase()}</div>` : ''}
        </div>
      </div>
      <div class="bc-live-badge ${st === 'leave_pending' ? 'working' : st}">${live}</div>
      ${st === 'leave_pending' ? `<div class="bc-notice"><b>⚠️ Early Leave Request:</b> ${esc(r.leaveEarly.reason || 'Personal')}${r.leaveEarly.requestedAt ? ` (${esc(r.leaveEarly.requestedAt)})` : ''}
          <div style="display:flex;gap:6px;margin-top:6px">
            <button class="btn sm tape" onclick="approveLeave(${id},true)">✓ Approve</button>
            <button class="btn sm ghost" onclick="approveLeave(${id},false)">✕ Reject</button>
          </div></div>` : ''}
      ${st === 'leave_early' ? `<div class="bc-notice" style="background:#EFF6FF;border-color:#BFDBFE;color:#1E40AF">
          🚪 Left early at <b>${esc(r.out)}</b> (${esc(r.leaveEarly.approvedBy || r.leaveEarly.by || 'Admin')}: "${esc(r.leaveEarly.reason || 'Personal')}")</div>` : ''}
      ${st === 'working' ? `<div class="bc-meal-row"><div class="bc-meal-title">BREAK OPTIONS:</div>
          <div class="bc-meals">${meal('b1', '☕', 'Breakfast', 15)}${meal('b2', '🍲', 'Lunch', 30)}${meal('b3', '🫖', 'Evening Tea', 10)}</div></div>` : ''}
      ${st === 'break' ? `<div style="margin:2px 0">
          <button class="btn tape sm" style="width:100%;padding:8px 12px;font-size:12.5px" onclick="mealEnd(${id})">✓ Back from ${esc(open ? open.name || 'Break' : 'Break')}</button>
          <div class="muted" style="font-size:10.5px;text-align:center;margin-top:3px">Break started at ${esc(open ? open.start : 'now')}</div></div>` : ''}
      <div class="bc-acts">
        ${st === 'out' ? `<button class="btn tape sm" onclick="punchIn(${id})">⚡ Check In</button>` : ''}
        ${st === 'working' ? `<button class="btn tape sm" onclick="punchOut(${id})">Check Out</button>` : ''}
        ${st === 'break' ? `<button class="btn ghost sm" onclick="punchOut(${id})">Check Out</button>` : ''}
        ${st === 'done' || st === 'leave_early' ? `<button class="btn tape sm" onclick="punchIn(${id})">⚡ Check In Again</button>` : ''}
        ${st === 'absent' ? `<span class="muted" style="font-size:12px;align-self:center">Marked absent today · only the Super Admin can undo it, at the till</span>` : ''}
      </div>
      <div class="bc-bottom-row"><button class="bc-toggle-btn" onclick="toggleDetails(${id},this)">${shown ? 'Hide details ▴' : 'See details ▾'}</button></div>
      <div id="details-${id}" style="display:${shown ? 'block' : 'none'}">
        <div class="bc-metrics">
          <div class="bc-metric"><span class="lbl">Check-In</span><span class="val ${isLate ? 'late-val' : ''}">${esc(f.in || '—')}${isLate ? ` <small style="font-size:10px">(${fmtMin(f.late)} late)</small>` : ''}</span></div>
          <div class="bc-metric"><span class="lbl">Check-Out</span><span class="val">${esc(f.out || '—')}</span></div>
          <div class="bc-metric"><span class="lbl">Floor Time</span><span class="val">${f.worked ? `${hrs(f.worked).toFixed(2)}h (${Math.floor(f.worked / 60)}h ${f.worked % 60}m)` : '—'}</span></div>
          <div class="bc-metric"><span class="lbl">OT Past ${ampm(set().closeTime)}</span><span class="val ${f.ot ? 'ot-val' : ''}">${f.ot ? `${hrs(f.ot).toFixed(2)}h (${Math.floor(f.ot / 60)}h ${f.ot % 60}m)` : '0.00h'}</span></div>
        </div>
        ${brs.length ? `<div class="bc-breaks"><b>Breaks:</b> ${brs.map(b => `${esc(b.name || 'Break')}: ${esc(b.start)}–${esc(b.end || 'now')}`).join(' · ')}</div>` : ''}
      </div>
    </div>`;
}

/* ---------------- the server ---------------- */
function status(txt, kind) {
  document.getElementById('syncTxt').textContent = txt;
  document.getElementById('sync').className = 'sync ' + (kind || '');
}
async function call(method, path, body) {
  try {
    const r = await fetch(API + path, {
      method,
      headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    j.__status = r.status;
    if ((r.status === 401 || r.status === 403) && path !== '/books/shift-login') { dropToken(); askSignIn(j.error); }
    return j;
  } catch (e) { return { __status: 0, error: 'The server cannot be reached' }; }
}
function cache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rev, S })); } catch (e) {} }
function dropToken() { token = ''; me = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function save(ds, id) {
  const rec = recOf(ds, id) || null;
  cache();
  const j = await call('POST', '/books/regal/shift', { date: ds, empId: id, rec });
  if (j.__status === 200) { rev = j.rev; cache(); status('Live', 'live'); return; }
  if (j.__status === 409 && j.rec) {
    // punched on another device a moment later: that one stands
    S.shift.days[ds][id] = j.rec; draw(); toast('Changed on another device just now — showing the latest');
    return;
  }
  if (j.__status !== 401 && j.__status !== 403) {
    status('Not saved', 'bad');
    toast('Not saved — ' + (j.error || 'the server did not answer') + '. Try that punch again.');
    load(true);
  }
}

async function load(quiet) {
  if (!token || loading) return;
  loading = true;
  try {
    const j = await call('GET', '/books/regal/shift');
    if (j.__status !== 200) {
      if (j.__status === 401 || j.__status === 403) return;
      online = false; status('Offline', 'bad');
      document.getElementById('notice').innerHTML = `<div class="card note bad">The shop system is not answering${j.error ? ' (' + esc(j.error) + ')' : ''}. Punches cannot be saved until it does.</div>`;
      if (!quiet || !S.employees.length) draw();
      return;
    }
    online = true;
    rev = j.rev || 0;
    S = {
      employees: (j.employees || []).filter(e => {
        const n = String(e?.name || '').toLowerCase().trim();
        return n !== 'demo' && n !== 'demo user';
      }),
      shift: j.shift || { days: {}, settings: {}, holidays: [] }
    };
    cache(); status('Live', 'live');
    if (!document.querySelector('.veil')) draw();
  } finally { loading = false; }
}

async function poll() {
  if (!token || document.hidden) return;
  const j = await call('GET', '/books/regal/rev');
  if (j.__status !== 200) { online = false; status('Offline', 'bad'); return; }
  if (Number(j.rev) !== rev || online === false) await load(true);
  else status('Live', 'live');
}
function startPolling() { clearInterval(pollT); pollT = setInterval(poll, POLL_MS); }

/* ---------------- sign in: admins only ---------------- */
function askSignIn(why) {
  clearInterval(pollT);
  document.getElementById('whoBox').style.display = 'none';
  status('Signed out');
  if (document.getElementById('signin')) { if (why) document.getElementById('siErr').textContent = why; return; }
  const v = veil(`<form class="dlg" id="signin" autocomplete="on">
      <img src="regal-logo.png" alt="">
      <h3>Shift clock</h3>
      <p class="c">An admin signs in once on this device with their shop system login. Staff then check in and out here.</p>
      <label for="siU">Username</label><input id="siU" name="username" autocomplete="username" required>
      <label for="siP">Password</label><input id="siP" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="siErr">${esc(why && why !== 'An admin has to sign in on this device' ? why : '')}</div>
      <button class="btn tape wide" id="siGo" type="submit">Sign In</button>
    </form>`);
  const f = v.querySelector('form');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const b = f.querySelector('#siGo'), err = f.querySelector('#siErr');
    b.disabled = true; b.textContent = 'Signing in…'; err.textContent = '';
    const j = await call('POST', '/books/shift-login', { user: f.querySelector('#siU').value.trim(), password: f.querySelector('#siP').value });
    b.disabled = false; b.textContent = 'Sign In';
    if (j.__status !== 200 || !j.token) { err.textContent = j.__status === 0 ? 'The server cannot be reached.' : (j.error || 'Could not sign in'); return; }
    token = j.token; me = j.user;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    v.remove();
    signedIn();
  };
  setTimeout(() => f.querySelector('#siU').focus(), 50);
}
function signedIn() {
  if (!me) { try { const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); me = { name: p.name, role: p.role }; } catch (e) { me = { name: 'Admin' }; } }
  document.getElementById('whoName').textContent = me.name;
  document.getElementById('whoBox').style.display = '';
  load();
  startPolling();
}
function signOut() {
  if (!confirm('Sign this device out of the shift clock? An admin will have to sign in again.')) return;
  dropToken(); S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } };
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  draw(); askSignIn();
}

/* ---------------- bits ---------------- */
function veil(html) { const v = document.createElement('div'); v.className = 'veil'; v.innerHTML = html; document.body.appendChild(v); return v; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000); }
function tick() { document.getElementById('clk').textContent = '🕒 ' + hhmm(nowMin()); }
setInterval(tick, 1000); tick();
// the minutes on the cards move on their own, as the till's do; a new day starts clean at midnight
setInterval(() => { if (document.querySelector('.veil')) return; draw(); }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
// the till open in another tab of this browser: its saves show here at once
try { new BroadcastChannel('regal_books_sync').onmessage = e => { if (e.data === 'attendance_updated' || e.data === 'books_updated') load(true); }; } catch (e) {}

try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.S && Array.isArray(c.S.employees)) { S = c.S; rev = c.rev || 0; } } catch (e) {}
draw();
if (token) signedIn(); else askSignIn();
</script>
