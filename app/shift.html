<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shift Clock — Regal Hardware</title>
<meta name="theme-color" content="#101E22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #101E22; --steel: #526361; --faint: #8E9F9D; --line: #D5DEE3; --panel: #F8FAFC; --bg: #EEF2F5; --card: #fff;
  --brand: #921B1D; --gold: #F0A81E;
  --green: #059669; --green-t: #D1FAE5; --amber: #B45309; --amber-t: #FEF3C7;
  --orange: #C2410C; --orange-t: #FFEDD5; --blue: #1D4ED8; --blue-t: #DBEAFE; --red: #B91C1C; --red-t: #FEE2E2;
  --r: 12px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 'IBM Plex Sans', system-ui, sans-serif; -webkit-text-size-adjust: 100%; min-height: 100vh; }
button { font: inherit; cursor: pointer; }
.mono { font-family: 'JetBrains Mono', monospace; }

/* header */
header { position: sticky; top: 0; z-index: 50; background: var(--ink); color: #fff; border-bottom: 3px solid var(--gold); }
.hdr { max-width: 1080px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; flex: 1 1 auto; min-width: 0; }
.brand img { width: 38px; height: 38px; border-radius: 9px; background: #fff; object-fit: contain; padding: 3px; }
.brand b { display: block; font-family: Archivo, sans-serif; font-size: 17px; line-height: 1.1; }
.brand small { color: #94A3B8; font-size: 11.5px; }
.clock { text-align: right; }
.clock .t { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; }
.clock .d { color: #94A3B8; font-size: 11.5px; }
.who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #CBD5E1; width: 100%; justify-content: space-between; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 600; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: #94A3B8; }
.pill.live i { background: #34D399; box-shadow: 0 0 6px #34D399; }
.pill.bad i { background: #F87171; }
.ghostbtn { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.3); border-radius: 99px; padding: 3px 11px; font-size: 12px; }

/* page */
main { max-width: 1080px; margin: 0 auto; padding: 14px 16px 60px; }
.notice { background: var(--amber-t); color: var(--amber); border: 1px solid #FCD34D; border-radius: 10px; padding: 9px 12px; margin-bottom: 12px; font-size: 13px; }
.notice.bad { background: var(--red-t); color: var(--red); border-color: #FCA5A5; }
.bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.search { flex: 1 1 220px; min-width: 0; font-size: 16px; padding: 10px 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; outline: none; }
.search:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(146,27,29,.12); }
.chips { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; max-width: 100%; }
.chip { white-space: nowrap; border: 1px solid var(--line); background: #fff; color: var(--steel); border-radius: 99px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; }
.chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
@media (max-width: 520px) { .grid { grid-template-columns: 1fr; } .clock .t { font-size: 17px; } }

/* card */
.card { background: var(--card); border: 1px solid var(--line); border-top: 4px solid var(--line); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 11px; }
.card.working { border-top-color: var(--green); }
.card.late { border-top-color: var(--amber); }
.card.break { border-top-color: var(--orange); background: #FFFBF7; }
.card.done { border-top-color: var(--blue); }
.card.absent, .card.leave { border-top-color: var(--red); }
.top { display: flex; gap: 11px; align-items: flex-start; }
.av { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 11px; background: #1E293B; color: var(--gold); display: flex; align-items: center; justify-content: center; font-family: Archivo, sans-serif; font-weight: 800; font-size: 16px; }
.nm { flex: 1; min-width: 0; }
.nm b { display: block; font-family: Archivo, sans-serif; font-size: 16px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nm small { color: var(--steel); font-size: 12px; }
.tags { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.tag.working { background: var(--green-t); color: #065F46; }
.tag.break { background: var(--orange-t); color: var(--orange); }
.tag.done { background: var(--blue-t); color: var(--blue); }
.tag.out { background: #F1F5F9; color: #64748B; }
.tag.absent, .tag.leave { background: var(--red-t); color: var(--red); }
.tag.late, .tag.extra { background: var(--amber-t); color: var(--amber); }
.tag.early { background: #EDE9FE; color: #6D28D9; }
.live { font-weight: 600; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; background: var(--panel); border: 1px solid var(--line); }
.live.working { background: var(--green-t); border-color: #A7F3D0; color: #065F46; }
.live.break { background: var(--orange-t); border-color: #FED7AA; color: var(--orange); }
.live.done { background: var(--blue-t); border-color: #BFDBFE; color: var(--blue); }
.live.absent, .live.leave { background: var(--red-t); border-color: #FECACA; color: var(--red); }
.nums { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nums div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 7px; min-width: 0; }
.nums span { display: block; font-size: 10px; color: var(--faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.nums b { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; }
.nums b.warn { color: var(--amber); }
.brk { display: flex; gap: 6px; flex-wrap: wrap; }
.brk button { flex: 1 1 0; min-width: 88px; border: 1px dashed #CBD5E1; background: #fff; border-radius: 8px; padding: 7px 6px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.brk button.taken { border-style: solid; background: var(--panel); color: var(--faint); cursor: default; }
.brklist { font-size: 12px; color: var(--steel); }
.acts { display: flex; gap: 8px; }
.btn { flex: 1; border: 0; border-radius: 9px; padding: 11px 12px; font-weight: 700; font-size: 14px; }
.btn.go { background: var(--brand); color: #fff; }
.btn.alt { background: #fff; color: var(--ink); border: 1px solid var(--line); }
.btn.back { background: var(--orange); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }
.empty { grid-column: 1 / -1; text-align: center; background: #fff; border: 1px dashed var(--line); border-radius: var(--r); padding: 40px 16px; color: var(--steel); }
.empty h3 { margin: 0 0 4px; color: var(--ink); }

/* dialogs */
.veil { position: fixed; inset: 0; z-index: 200; background: rgba(16,30,34,.72); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlg { background: #fff; border-radius: 14px; padding: 22px; width: 100%; max-width: 360px; box-shadow: 0 24px 60px rgba(0,0,0,.35); }
.dlg img { width: 54px; height: 54px; display: block; margin: 0 auto 10px; object-fit: contain; }
.dlg h3 { margin: 0 0 4px; font-family: Archivo, sans-serif; text-align: center; }
.dlg p { margin: 0 0 14px; color: var(--steel); font-size: 13px; text-align: center; }
.dlg label { display: block; font-size: 12px; font-weight: 600; color: var(--steel); margin-bottom: 4px; }
.dlg input, .dlg select { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; margin-bottom: 10px; background: #fff; }
.dlg .err { color: var(--red); font-size: 13px; min-height: 18px; margin-bottom: 6px; text-align: center; }
.dlg .row { display: flex; gap: 8px; }
.dlg .btn { width: 100%; }

#toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; z-index: 300; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: calc(100vw - 32px); transition: .22s; pointer-events: none; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<header>
  <div class="hdr">
    <div class="brand">
      <img src="regal-logo.png" alt="">
      <div><b>Regal Hardware</b><small>Shift clock · attendance</small></div>
    </div>
    <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="dt">--</div></div>
    <div class="who">
      <span class="pill" id="sync"><i></i><span id="syncTxt">Connecting…</span></span>
      <span id="whoBox" style="display:none">Signed in: <b id="whoName"></b> <button class="ghostbtn" onclick="signOut()">Sign out</button></span>
    </div>
  </div>
</header>

<main>
  <div id="notice"></div>
  <div class="bar">
    <input class="search" id="q" type="search" placeholder="Search name, role or code…" autocomplete="off" oninput="draw()">
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"><div class="empty"><h3>Loading…</h3>Getting the staff list from the shop system</div></div>
</main>
<div id="toast"></div>

<script>
/* The shift clock. It shows the same staff and the same attendance as the Attendance screen in the
   shop system (/pos) — one set of records on the server. A punch here is saved as that one record and
   the till picks it up within a couple of seconds; anything done at the till, or on another phone,
   shows here the same way. Only an admin can open it: they sign in once on the device. */
const API = '/api';
const TOKEN_KEY = 'regal_shift_token';          // this page's own sign-in, apart from the till's
const CACHE_KEY = 'regal_shift_cache';          // this page's own copy — never the till's
const POLL_MS = 2000;

const DEFAULTS = {
  startTime: '08:00', closeTime: '19:30', graceMin: 0, weeklyOff: [0],
  breaks: [
    { id: 'b1', name: 'Breakfast', start: '08:30', end: '08:45', mins: 15, extra: 0, paid: true },
    { id: 'b2', name: 'Lunch', start: '12:30', end: '13:00', mins: 30, extra: 0, paid: true },
    { id: 'b3', name: 'Evening Tea', start: '15:30', end: '15:40', mins: 10, extra: 0, paid: true }
  ]
};
const BREAK_ICON = { b1: '☕', b2: '🍛', b3: '🫖' };

let token = ''; try { token = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
let me = null;                                   // { name, role } of the admin signed in here
let S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } };
let rev = 0, pollT = null, loading = false, filter = 'all', online = null;

/* ---------------- time, the way the till counts it ---------------- */
const pad = n => String(n).padStart(2, '0');
const D = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;   // local date, never UTC
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const hhmm = m => pad(Math.floor(m / 60)) + ':' + pad(Math.round(m % 60));
const dur = m => { m = Math.max(0, Math.round(m || 0)); return `${Math.floor(m / 60)}h ${m % 60}m`; };
const fmtMin = m => { m = Math.max(0, Math.round(m || 0)); const h = Math.floor(m / 60), r = m % 60; return h && r ? `${h}h ${r}m` : h ? `${h}h` : `${r}m`; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

function set() {
  const s = { ...DEFAULTS, ...(S.shift.settings || {}) };
  if (!s.breaks || !s.breaks.length) s.breaks = DEFAULTS.breaks;
  return s;
}
const stdMin = () => Math.max(60, toMin(set().closeTime) - toMin(set().startTime)
  - set().breaks.filter(b => !b.paid).reduce((a, b) => a + (toMin(b.end) - toMin(b.start)), 0));
const recOf = (ds, id) => ((S.shift.days || {})[ds] || {})[id];
const isOff = ds => (set().weeklyOff || []).includes(new Date(ds + 'T00:00').getDay()) || (S.shift.holidays || []).some(h => h.date === ds);

function state(ds, id) {
  const r = recOf(ds, id);
  if (r && r.status === 'absent') return 'absent';
  if (r && r.status === 'leave') return 'leave';
  if (r && (r.breaks || []).some(b => !b.end)) return 'break';
  if (r && r.in && !r.out) return 'working';
  if (r && r.in && r.out) return 'done';
  return 'out';
}

/* the same figures the till's Attendance screen shows */
function figures(ds, id) {
  const r = recOf(ds, id);
  const f = { in: r && r.in, out: r && r.out, gross: 0, breakMin: 0, worked: 0, late: 0, ot: 0, over: 0 };
  if (!r || r.status !== 'work' || !r.in) return f;
  const today = ds === D();
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions : [{ in: r.in, out: r.out }];
  const inM = toMin(sessions[0].in || r.in);
  const outM = r.out ? toMin(r.out) : (today ? nowMin() : inM);
  f.gross = sessions.reduce((t, s) => !s || !s.in ? t : t + Math.max(0, (s.out ? toMin(s.out) : (today ? nowMin() : toMin(s.in))) - toMin(s.in)), 0);
  (r.breaks || []).forEach(b => {
    const def = set().breaks.find(x => x.id === b.id);
    const bs = toMin(b.start), be = b.end ? toMin(b.end) : (today ? nowMin() : bs);
    const actual = Math.max(0, Math.min(be, outM) - Math.max(bs, inM));
    if (!def) { f.breakMin += actual; return; }
    const free = def.paid ? (+def.mins || 0) + (+def.extra || 0) : 0;
    if (actual > free) { f.breakMin += actual - free; f.over += actual - free; }
  });
  set().breaks.filter(b => !b.paid).forEach(b => {
    if ((r.breaks || []).some(x => x.id === b.id)) return;
    f.breakMin += Math.max(0, Math.min(outM, toMin(b.end)) - Math.max(inM, toMin(b.start)));
  });
  f.worked = Math.max(0, f.gross - f.breakMin);
  f.late = Math.max(0, inM - (toMin(set().startTime) + (+set().graceMin || 0)));
  const close = toMin(set().closeTime);
  f.ot = outM > close ? outM - close : Math.max(0, f.worked - stdMin());
  return f;
}

/* ---------------- punching ---------------- */
function put(ds, id, patch) {
  S.shift.days = S.shift.days || {};
  S.shift.days[ds] = S.shift.days[ds] || {};
  S.shift.days[ds][id] = { ...(S.shift.days[ds][id] || {}), ...patch, by: me ? me.name : 'shift', updatedAt: Date.now() };
  draw();
  save(ds, id);
}
const emp = id => S.employees.find(e => e.id === id) || { name: 'Staff' };

function checkIn(id) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  let sessions = Array.isArray(r.sessions) ? r.sessions.map(s => ({ ...s })) : [];
  if (r.in && (r.out || sessions.length)) {
    // back again the same day: the hours carry on from the last check-out
    if (!sessions.length) sessions = [{ in: r.in, out: r.out || t }];
    if (!sessions[sessions.length - 1].out) sessions[sessions.length - 1].out = t;
    sessions.push({ in: t, out: null });
    put(ds, id, { status: 'work', in: r.in, out: null, sessions, breaks: r.breaks || [], leaveEarly: null });
    toast(`${emp(id).name} checked in again at ${t}`);
  } else {
    put(ds, id, { status: 'work', in: t, out: null, sessions: [{ in: t, out: null }], breaks: r.breaks || [], leaveEarly: null });
    const late = Math.max(0, nowMin() - toMin(set().startTime));
    toast(late ? `${emp(id).name} checked in at ${t} · ${fmtMin(late)} late` : `${emp(id).name} checked in on time at ${t}`);
  }
}

function checkOut(id) {
  const early = nowMin() < toMin(set().closeTime);
  if (early) return earlyLeave(id);
  finishDay(id, null);
}
function finishDay(id, leaveEarly) {
  const ds = D(), t = hhmm(nowMin()), r = recOf(ds, id) || {};
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t });
  const sessions = Array.isArray(r.sessions) && r.sessions.length ? r.sessions.map(s => ({ ...s })) : (r.in ? [{ in: r.in, out: null }] : []);
  if (sessions.length) sessions[sessions.length - 1].out = t;
  put(ds, id, { status: 'work', out: t, breaks, sessions, ...(leaveEarly ? { leaveEarly } : {}) });
  const f = figures(ds, id);
  toast(`${emp(id).name} checked out at ${t} · ${dur(f.worked)} worked${f.ot ? ` · ${dur(f.ot)} OT` : ''}`);
}

/* before closing time the till asks why — so does this, and an admin's say-so approves it */
function earlyLeave(id) {
  const reasons = ['Personal Emergency', 'Feeling Sick / Medical', 'Urgent Family Matter', 'Official Shop Duty / Field Task'];
  const v = veil(`<div class="dlg">
      <h3>Leaving early · ${esc(emp(id).name)}</h3>
      <p>The shop closes at <b>${esc(set().closeTime)}</b>. It is ${hhmm(nowMin())}. Checking out now is recorded as early leave approved by you.</p>
      <label>Reason</label>
      <select id="elR">${reasons.map(r => `<option>${r}</option>`).join('')}<option value="other">Other reason…</option></select>
      <input id="elO" placeholder="Say why" style="display:none">
      <div class="row"><button class="btn alt" id="elNo">Cancel</button><button class="btn go" id="elOk">Check out</button></div>
    </div>`);
  const sel = v.querySelector('#elR'), other = v.querySelector('#elO');
  sel.onchange = () => { other.style.display = sel.value === 'other' ? '' : 'none'; if (sel.value === 'other') other.focus(); };
  v.querySelector('#elNo').onclick = () => v.remove();
  v.querySelector('#elOk').onclick = () => {
    const reason = sel.value === 'other' ? (other.value.trim() || 'Other reason') : sel.value, t = hhmm(nowMin());
    v.remove();
    finishDay(id, { approved: true, pending: false, at: t, by: me.name, approvedBy: me.name, reason });
  };
}

function breakStart(id, bid) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r || r.status !== 'work' || !r.in) return toast('Check in first');
  const def = set().breaks.find(b => b.id === bid) || { name: 'Break' };
  const breaks = (r.breaks || []).map(b => b.end ? b : { ...b, end: t }).concat([{ id: bid, name: def.name, start: t, end: null }]);
  put(ds, id, { breaks });
  toast(`${emp(id).name} started ${def.name}`);
}
function breakEnd(id) {
  const ds = D(), r = recOf(ds, id), t = hhmm(nowMin());
  if (!r) return;
  const open = (r.breaks || []).find(b => !b.end);
  put(ds, id, { breaks: (r.breaks || []).map(b => b.end ? b : { ...b, end: t }) });
  toast(`${emp(id).name} back from ${open ? open.name : 'break'}`);
}

/* ---------------- drawing ---------------- */
const CHIPS = [['all', 'All'], ['working', 'Working'], ['break', 'On break'], ['done', 'Done'], ['out', 'Not in'], ['away', 'Absent / leave']];

function draw() {
  const ds = D();
  const staff = (S.employees || []).filter(e => e && e.active !== false).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const st = new Map(staff.map(e => [e.id, state(ds, e.id)]));
  const count = k => k === 'all' ? staff.length : staff.filter(e => k === 'away' ? ['absent', 'leave'].includes(st.get(e.id)) : st.get(e.id) === k).length;
  document.getElementById('chips').innerHTML = CHIPS.map(([k, l]) => `<button class="chip ${filter === k ? 'on' : ''}" onclick="filter='${k}';draw()">${l} ${count(k)}</button>`).join('');

  document.getElementById('notice').innerHTML = isOff(ds) ? `<div class="notice">The shop is closed today (weekly off or a holiday). Punches are still recorded.</div>` : '';

  const q = document.getElementById('q').value.trim().toLowerCase();
  const list = staff.filter(e => (filter === 'all' || (filter === 'away' ? ['absent', 'leave'].includes(st.get(e.id)) : st.get(e.id) === filter))
    && (!q || [e.name, e.position, e.code].some(x => String(x || '').toLowerCase().includes(q))));

  const grid = document.getElementById('grid');
  if (!staff.length) {
    grid.innerHTML = `<div class="empty"><h3>${online === false ? 'Cannot reach the shop system' : 'No staff yet'}</h3>${online === false
      ? 'The server is not answering. The cards come back by themselves when it does.'
      : 'Staff are added in the shop system under Users — they show here straight away.'}</div>`;
    return;
  }
  if (!list.length) { grid.innerHTML = `<div class="empty"><h3>No one here</h3>${q ? `Nobody matches “${esc(q)}”.` : 'No one in this group right now.'}</div>`; return; }
  grid.innerHTML = list.map(e => card(ds, e, st.get(e.id))).join('');
}

function card(ds, e, s) {
  const r = recOf(ds, e.id) || {}, f = figures(ds, e.id), id = e.id;
  const late = f.late > 0, brs = r.breaks || [], open = brs.find(b => !b.end);
  const tags = [
    `<span class="tag ${s}">${({ working: 'Working', break: 'On break', done: 'Done', out: 'Not in', absent: 'Absent', leave: 'On leave' })[s]}</span>`,
    late ? `<span class="tag late">Late ${fmtMin(f.late)}</span>` : '',
    f.over > 0 ? `<span class="tag extra">Extra break ${fmtMin(f.over)}</span>` : '',
    r.leaveEarly && r.leaveEarly.approved ? `<span class="tag early">Left early</span>` : ''
  ].join('');
  const live = s === 'working' ? `⏱ ${dur(f.worked)} working`
    : s === 'break' ? `☕ ${esc(open ? open.name : 'Break')} since ${esc(open ? open.start : '')} · ${dur(f.worked)} on the floor`
    : s === 'done' ? `✓ ${dur(f.worked)} worked today`
    : s === 'absent' ? '✕ Absent today' : s === 'leave' ? `On leave${r.note ? ' · ' + esc(r.note) : ''}` : 'Not checked in yet';
  const nums = r.in ? `<div class="nums">
      <div><span>In</span><b class="${late ? 'warn' : ''}">${esc(f.in || '—')}</b></div>
      <div><span>Out</span><b>${esc(f.out || '—')}</b></div>
      <div><span>Worked</span><b>${dur(f.worked)}</b></div>
      <div><span>OT</span><b>${dur(f.ot)}</b></div></div>` : '';
  const breakBtns = s === 'working' ? `<div class="brk">${set().breaks.map(b => {
      const taken = brs.some(x => x.id === b.id && x.end);
      return `<button class="${taken ? 'taken' : ''}" ${taken ? 'disabled' : `onclick="breakStart(${id},'${esc(b.id)}')"`}>${taken ? '✓ ' : (BREAK_ICON[b.id] || '⏸') + ' '}${esc(b.name)}${taken ? '' : ` (${+b.mins || (toMin(b.end) - toMin(b.start))}m)`}</button>`;
    }).join('')}</div>` : '';
  const list = brs.length ? `<div class="brklist"><b>Breaks:</b> ${brs.map(b => `${esc(b.name || 'Break')} ${esc(b.start)}–${esc(b.end || 'now')}`).join(' · ')}</div>` : '';
  const acts = s === 'out' ? `<button class="btn go" onclick="checkIn(${id})">Check in</button>`
    : s === 'working' ? `<button class="btn alt" onclick="checkOut(${id})">Check out</button>`
    : s === 'break' ? `<button class="btn back" onclick="breakEnd(${id})">Back from break</button><button class="btn alt" onclick="checkOut(${id})">Check out</button>`
    : s === 'done' ? `<button class="btn alt" onclick="checkIn(${id})">Check in again</button>` : '';
  const cls = s === 'working' && late ? 'working late' : s;
  return `<div class="card ${cls}">
      <div class="top">
        <div class="av">${esc((String(e.name || '?').trim()[0] || '?').toUpperCase())}</div>
        <div class="nm"><b>${esc(e.name)}</b><small>${esc(e.position || '')}${e.code ? ' · ' + esc(e.code) : ''}</small></div>
        <div class="tags">${tags}</div>
      </div>
      <div class="live ${s}">${live}</div>
      ${nums}${breakBtns}${list}
      ${acts ? `<div class="acts">${acts}</div>` : ''}
    </div>`;
}

/* ---------------- the server ---------------- */
function status(txt, kind) {
  document.getElementById('syncTxt').textContent = txt;
  document.getElementById('sync').className = 'pill ' + (kind || '');
}
async function call(method, path, body) {
  try {
    const r = await fetch(API + path, {
      method,
      headers: { ...(body ? { 'Content-Type': 'application/json' } : {}), ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    j.__status = r.status;
    if ((r.status === 401 || r.status === 403) && path !== '/books/shift-login') { dropToken(); askSignIn(j.error); }
    return j;
  } catch (e) { return { __status: 0, error: 'The server cannot be reached' }; }
}
function cache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ rev, S })); } catch (e) {} }
function dropToken() { token = ''; me = null; try { localStorage.removeItem(TOKEN_KEY); } catch (e) {} }

async function save(ds, id) {
  const rec = recOf(ds, id) || null;
  cache();
  const j = await call('POST', '/books/regal/shift', { date: ds, empId: id, rec });
  if (j.__status === 200) { rev = j.rev; cache(); status('Live', 'live'); return; }
  if (j.__status === 409 && j.rec) {
    // punched on another device a moment later: that one stands
    S.shift.days[ds][id] = j.rec; draw(); toast('Changed on another device just now — showing the latest');
    return;
  }
  if (j.__status !== 401 && j.__status !== 403) {
    status('Not saved', 'bad');
    toast('Not saved — ' + (j.error || 'the server did not answer') + '. Try that punch again.');
    load(true);
  }
}

async function load(quiet) {
  if (!token || loading) return;
  loading = true;
  try {
    const j = await call('GET', '/books/regal/shift');
    if (j.__status !== 200) {
      if (j.__status === 401 || j.__status === 403) return;
      online = false; status('Offline', 'bad');
      document.getElementById('notice').innerHTML = `<div class="notice bad">The shop system is not answering${j.error ? ' (' + esc(j.error) + ')' : ''}. Punches cannot be saved until it does.</div>`;
      if (!quiet || !S.employees.length) draw();
      return;
    }
    online = true;
    rev = j.rev || 0;
    S = { employees: j.employees || [], shift: j.shift || { days: {}, settings: {}, holidays: [] } };
    cache(); status('Live', 'live');
    if (!document.querySelector('.veil')) draw();
  } finally { loading = false; }
}

async function poll() {
  if (!token || document.hidden) return;
  const j = await call('GET', '/books/regal/rev');
  if (j.__status !== 200) { online = false; status('Offline', 'bad'); return; }
  if (Number(j.rev) !== rev || online === false) await load(true);
  else status('Live', 'live');
}
function startPolling() { clearInterval(pollT); pollT = setInterval(poll, POLL_MS); }

/* ---------------- sign in: admins only ---------------- */
function askSignIn(why) {
  clearInterval(pollT);
  document.getElementById('whoBox').style.display = 'none';
  status('Signed out');
  if (document.getElementById('signin')) { if (why) document.getElementById('siErr').textContent = why; return; }
  const v = veil(`<form class="dlg" id="signin" autocomplete="on">
      <img src="regal-logo.png" alt="">
      <h3>Shift clock</h3>
      <p>An admin signs in once on this device with their shop system login. Staff then check in and out here.</p>
      <label for="siU">Username</label><input id="siU" name="username" autocomplete="username" required>
      <label for="siP">Password</label><input id="siP" name="password" type="password" autocomplete="current-password" required>
      <div class="err" id="siErr">${esc(why && why !== 'An admin has to sign in on this device' ? why : '')}</div>
      <button class="btn go" id="siGo" type="submit">Sign in</button>
    </form>`);
  const f = v.querySelector('form');
  f.onsubmit = async ev => {
    ev.preventDefault();
    const b = f.querySelector('#siGo'), err = f.querySelector('#siErr');
    b.disabled = true; b.textContent = 'Signing in…'; err.textContent = '';
    const j = await call('POST', '/books/shift-login', { user: f.querySelector('#siU').value.trim(), password: f.querySelector('#siP').value });
    b.disabled = false; b.textContent = 'Sign in';
    if (j.__status !== 200 || !j.token) { err.textContent = j.__status === 0 ? 'The server cannot be reached.' : (j.error || 'Could not sign in'); return; }
    token = j.token; me = j.user;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    v.remove();
    signedIn();
  };
  setTimeout(() => f.querySelector('#siU').focus(), 50);
}
function signedIn() {
  if (!me) { try { const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))); me = { name: p.name, role: p.role }; } catch (e) { me = { name: 'Admin' }; } }
  document.getElementById('whoName').textContent = me.name;
  document.getElementById('whoBox').style.display = '';
  load();
  startPolling();
}
function signOut() {
  if (!confirm('Sign this device out of the shift clock? An admin will have to sign in again.')) return;
  dropToken(); S = { employees: [], shift: { days: {}, settings: {}, holidays: [] } };
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
  draw(); askSignIn();
}

/* ---------------- bits ---------------- */
function veil(html) { const v = document.createElement('div'); v.className = 'veil'; v.innerHTML = html; document.body.appendChild(v); return v; }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 3000); }
function tick() {
  const d = new Date();
  document.getElementById('clk').textContent = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  document.getElementById('dt').textContent = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}
setInterval(tick, 1000); tick();
// the minutes on the cards move on their own; a new day starts clean at midnight
let lastDay = D();
setInterval(() => { if (document.querySelector('.veil') || document.activeElement === document.getElementById('q')) return; if (D() !== lastDay) lastDay = D(); draw(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
// the till open in another tab of this browser: its saves show here at once
try { new BroadcastChannel('regal_books_sync').onmessage = e => { if (e.data === 'attendance_updated' || e.data === 'books_updated') load(true); }; } catch (e) {}

try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.S && Array.isArray(c.S.employees)) { S = c.S; rev = c.rev || 0; } } catch (e) {}
draw();
if (token) signedIn(); else askSignIn();
</script>
