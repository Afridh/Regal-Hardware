<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your bill</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 84'%3E%3Cpath d='M50 4 96 80H72L50 40 28 80H4z' fill='%23F0A81E'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/bill-print.css">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#101E22;--steel:#5A6E72;--faint:#8C9CA0;--page:#EEF1F0;--white:#fff;
  --line:#D8DEDD;--line2:#EAEEED;--amber:#F0A81E;--green:#1E8A5A;--rust:#C0442C}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--ink);color:#fff;padding:18px 0 22px;margin-bottom:-14px}
header .wrap{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:linear-gradient(145deg,#F7BB3C,#E0960F);
  color:#101E22;display:grid;place-items:center;font:700 15px Archivo,sans-serif}
header b{display:block;font:700 17px Archivo,sans-serif;letter-spacing:.01em}
header span{display:block;font-size:12.5px;color:#A9BBBE;margin-top:1px}
.card{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.big{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.big .no{font:700 20px Archivo,sans-serif}
.big .when{font-size:12.5px;color:var(--steel)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid}
.tag.cash{background:#DCF1E7;color:#14663F;border-color:#9FD9BF}
.tag.credit{background:#FFF4DA;color:#7A5200;border-color:#F2D08A}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--steel);
  border-bottom:1px solid var(--line);padding:7px 4px;font-weight:600}
td{padding:9px 4px;border-bottom:1px solid var(--line2);vertical-align:top}
.n{text-align:right;white-space:nowrap}
.sub{font-size:11.5px;color:var(--faint);margin-top:1px}
tr.ret td{color:#9F1239}
.rtag{background:#FFE4E6;color:#9F1239;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:4px}
.tot{display:flex;justify-content:space-between;padding:6px 4px;font-size:14px}
.tot b{font-family:Archivo,sans-serif}
.tot.big2{border-top:1.5px solid var(--line);margin-top:6px;padding-top:10px;font-size:19px}
.tot.due b{color:var(--rust)}
.tot.ok b{color:var(--green)}
.msg{padding:26px 16px;text-align:center;color:var(--steel)}
.msg b{display:block;font:700 17px Archivo,sans-serif;color:var(--ink);margin-bottom:6px}
.shopfoot{margin-top:16px;text-align:center;font-size:12.5px;color:var(--steel);line-height:1.7}
.shopfoot a{color:var(--ink)}
.btns{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;text-align:center;border:1px solid var(--line);background:var(--white);border-radius:10px;
  padding:11px 12px;font:600 14px Inter,sans-serif;color:var(--ink);text-decoration:none;cursor:pointer}
.btn.pay{background:var(--amber);border-color:#D08F09}
@media print{header{background:#fff;color:#000}.btns,.shopfoot a{display:none}.card{border:0}}
/* The exact branded bill the till printed — kept so "save as PDF" is the real invoice with its
   logo and QR, but hidden on screen, where the clean card above reads properly on a phone. */
.paper{background:#fff;padding:0;margin:0;overflow:hidden}
.paper .print{border:0;margin:0 auto;padding:0}
.fit.a5{width:760px}
.fit.r80{width:302px}
.paper .print.a5{width:100%;aspect-ratio:auto;min-height:0}
.paper .print.r80{width:302px}
.forprint{display:none}
@media print{
  body{background:#fff}
  header,.btns,.shopfoot,.screenview{display:none!important}
  .wrap{max-width:none;padding:0;margin:0}
  .forprint{display:block!important}
}

</style>
</head>
<body>
<header><div class="wrap"><span class="mark" id="mk">RH</span>
  <span><b id="shopName">Regal Hardware</b><span id="shopSub">your bill</span></span></div></header>
<div class="wrap"><div id="out"><div class="card msg">Reading the bill…</div></div></div>
<script>

const $=(s)=>document.querySelector(s);
const money=(n)=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=(s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* The shop sometimes keeps two numbers in the one phone field ("027… , 077…"). A tel: link can only
   dial one, so take the first and strip it to digits — otherwise the phone tries to call both at
   once and does nothing. */
const firstPhone=(s)=>String(s==null?'':s).split(/[,/;]|\s(?:or)\s/i)[0].replace(/[^0-9+]/g,'');

(async () => {
  const id = location.pathname.split('/').filter(Boolean).pop() || '';
  try {
    const r = await fetch('/api/my/b/' + encodeURIComponent(id));
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.bill) throw new Error(j.error || 'That bill could not be found');
    const b = j.bill;
    $('#shopName').textContent = b.shop.name;
    $('#shopSub').textContent = b.customer ? b.customer.name : 'your bill';
    $('#mk').textContent = (b.shop.name||'RH').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.title = b.shop.name + ' · bill ' + b.no;
    /* On screen: a clean card that reads on a phone. For "save as PDF": the exact branded bill the
       till printed, kept hidden on screen and shown only when printing. If the till did not send a
       printed copy, the card itself prints. */
    const telNum = firstPhone(b.shop.phone) || firstPhone(b.shop.land);
    const telBtn = telNum ? `<a class="btn pay" href="tel:${esc(telNum)}">Ring the shop</a>` : '';
    const card = `
      <div class="card ${b.html ? 'screenview' : ''}">
        <div class="big">
          <div><div class="no">${esc(b.no)}</div>
            <div class="when">${esc(b.date)}${b.time ? ' · ' + esc(b.time) : ''}</div></div>
          <span class="tag ${b.type === 'CREDIT' ? 'credit' : 'cash'}">${b.type === 'CREDIT' ? 'on account' : 'paid, cash'}</span>
        </div>
        <table><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th></tr></thead><tbody>
        ${b.lines.map(l => `<tr class="${l.returned ? 'ret' : ''}">
            <td>${esc(l.name)}${l.returned ? '<span class="rtag">returned</span>' : ''}${l.code ? `<div class="sub">${esc(l.code)}</div>` : ''}</td>
            <td class="n">${l.qty}${l.unit ? ' ' + esc(l.unit) : ''}</td>
            <td class="n">${money(l.price)}</td><td class="n">${money(l.amount)}</td></tr>`).join('')}
        </tbody></table>
        <div class="tot"><span>Subtotal</span><b>${money(b.sub)}</b></div>
        ${b.billDisc > 0 ? `<div class="tot"><span>Discount</span><b>− ${money(b.billDisc)}</b></div>` : ''}
        <div class="tot big2"><span>Total</span><b>${money(b.total)}</b></div>
        <div class="tot"><span>Paid</span><b>${money(b.paid)}</b></div>
        ${b.balance > 0.005
          ? `<div class="tot due"><span>Still owing</span><b>${money(b.balance)}</b></div>`
          : `<div class="tot ok"><span>Settled</span><b>✓</b></div>`}
      </div>
      <div class="shopfoot screenview"><b>${esc(b.shop.name)}</b><br>${esc(b.shop.addr)}<br>
        ${esc(b.shop.phone)}</div>`;
    const paper = b.html
      ? `<div class="paper forprint"><div class="fit printArea ${b.paper === 'r80' ? 'r80' : 'a5'}">${b.html}</div></div>`
      : '';
    // size the printed page to the bill it holds, so the saved PDF is one clean sheet
    const pageRule = b.html
      ? `<style media="print">@page{size:${b.paper === 'r80' ? '80mm auto;margin:2mm' : 'A5 landscape;margin:6mm'}}</style>`
      : '';
    $('#out').innerHTML = pageRule + card + paper +
      `<div class="btns screenview"><button class="btn" onclick="window.print()">Print or save as PDF</button>${telBtn}</div>`;
  } catch (e) {
    $('#out').innerHTML = `<div class="card msg"><b>We cannot show that bill</b>${esc(e.message)}.<br>
      Please ring the shop and they will help.</div>`;
  }
})();
</script>
</body>
</html>
