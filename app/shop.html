<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware — Build products that matter</title>
<meta name="description" content="Industrial-grade power tools, building supplies, architectural paints, and same-day jobsite delivery.">
<link rel="icon" href="regal-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Regal Hardware — Signature Modern Customer Storefront
   Official Brand Palette: Regal Crimson Red (#921B1D), Warm Cream Canvas,
   Neo-Modern Feature Cards, and Iconic Tradesmen Hero Showcase
   ========================================================================== */
:root {
  --primary: #921B1D;
  --hov-primary: #751416;
  --soft-primary: rgba(146, 27, 29, 0.08);
  --secondary-base: #921B1D;
  --hov-secondary-base: #751416;
  --soft-secondary-base: rgba(146, 27, 29, 0.14);
  --brand-red: #921B1D;
  --brand-red-dark: #751416;
  --brand-red-bright: #B91C1C;
  --brand-orange: #921B1D;
  --brand-orange-dark: #751416;
  --brand-cream: #FDF6F6;
  --brand-dark: #111215;
  --dark: #111215;
  --soft-dark: #1f2026;
  --bg-body: #FCF9F5;
  --bg-card: #FFFFFF;
  --border-subtle: #E5E7EB;
  --soft-light: #E5E7EB;
  --gray: #6B7280;
  --secondary: #6B7280;
  --soft-secondary: rgba(107, 114, 128, 0.1);
  --light: #F3F4F6;
  --soft-white: #D1D5DB;
  --success: #10B981;
  --soft-success: rgba(16, 185, 129, 0.12);
  --warning: #F59E0B;
  --soft-warning: rgba(245, 158, 11, 0.12);
  --danger: #EF4444;
  --soft-danger: rgba(239, 68, 68, 0.1);
  --blue: #2563EB;
  --hov-blue: #1D4ED8;
  --soft-blue: rgba(37, 99, 235, 0.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 2px 4px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 8px 16px -4px rgba(17, 18, 21, 0.08), 0 2px 4px -2px rgba(17, 18, 21, 0.04);
  --shadow-lg: 0 20px 25px -5px rgba(17, 18, 21, 0.08), 0 8px 10px -6px rgba(17, 18, 21, 0.04);
  --shadow-xl: 0 25px 50px -12px rgba(17, 18, 21, 0.15);
  --shadow-orange: 0 20px 40px -15px rgba(146, 27, 29, 0.22);
  --shadow-neo: 6px 6px 0px #000000;
  --container: 1240px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg-body);
  color: var(--dark);
  font-family: 'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
::selection { background: #921B1D; color: #fff; }
a { color: var(--blue); text-decoration: none; transition: color 0.15s ease; }
a:hover { color: var(--hov-blue); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 800; line-height: 1.15; color: var(--dark); letter-spacing: -0.02em; }
.container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }
.hide { display: none !important; }

/* Utilities */
.text-primary { color: var(--primary) !important; }
.text-dark { color: var(--dark) !important; }
.text-gray { color: var(--gray) !important; }
.text-secondary { color: var(--secondary) !important; }
.fw-500 { font-weight: 500; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.fw-800 { font-weight: 800; }
.fs-12 { font-size: 12px; }
.fs-13 { font-size: 13px; }
.fs-14 { font-size: 14px; }
.fs-15 { font-size: 15px; }
.fs-16 { font-size: 16px; }
.fs-20 { font-size: 20px; }
.fs-24 { font-size: 24px; }
.row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
.col { padding: 0 8px; flex: 1 1 0; min-width: 0; }
svg.i { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; flex: none; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  padding: 10px 22px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  border-radius: var(--radius-full);
  background: #fff;
  transition: all 0.2s ease;
  line-height: 1.4;
  user-select: none;
}
.btn:active { transform: scale(0.97); }
.btn-primary {
  background: var(--brand-red);
  color: #fff;
  border-color: var(--brand-red);
  box-shadow: 0 4px 14px rgba(146, 27, 29, 0.35);
}
.btn-primary:hover { background: var(--brand-red-dark); border-color: var(--brand-red-dark); color: #fff; }
.btn-dark {
  background: var(--brand-dark);
  color: #fff;
  border-color: var(--brand-dark);
  box-shadow: var(--shadow-sm);
}
.btn-dark:hover { background: #000; color: #fff; }
.btn-outline {
  border-color: #D1D5DB;
  background: transparent;
  color: #111827;
}
.btn-outline:hover { border-color: #4B5563; }
.btn-light { background: #F3F4F6; border-color: #E5E7EB; color: var(--dark); }
.btn-light:hover { background: #E5E7EB; }
.btn-block { width: 100%; }
.btn-lg { padding: 14px 28px; font-size: 15px; }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-link { background: none; border-color: transparent; padding: 0; color: var(--blue); font-weight: 600; }
.btn-link:hover { text-decoration: underline; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

/* Form Controls */
.form-control {
  width: 100%;
  border: 1.5px solid var(--border-subtle);
  padding: 11px 16px;
  background: #fff;
  border-radius: var(--radius-md);
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease;
  color: var(--dark);
}
.form-control:focus {
  border-color: var(--brand-red);
  box-shadow: 0 0 0 3px rgba(146, 27, 29, 0.15);
}
textarea.form-control { min-height: 90px; resize: vertical; }
label.lbl { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--dark); }
.form-group { margin-bottom: 18px; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  font-size: 11px;
  font-weight: 700;
  border-radius: var(--radius-full);
  line-height: 1.4;
  letter-spacing: 0.03em;
}
.badge-soft-success { background: var(--soft-success); color: #047857; }
.badge-soft-warning { background: var(--soft-warning); color: #B45309; }
.badge-soft-danger { background: var(--soft-danger); color: var(--danger); }
.badge-soft-orange { background: var(--soft-primary); color: var(--brand-orange); }

/* Checkbox & Radios */
.aiz-checkbox { cursor: pointer; display: inline-flex; align-items: center; position: relative; user-select: none; }
.aiz-square-check {
  position: relative;
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--soft-white);
  border-radius: 4px;
  vertical-align: middle;
  margin-right: 10px;
  background: #fff;
  transition: all 0.15s ease;
  flex: none;
}
.aiz-checkbox input { position: absolute; opacity: 0; width: 0; height: 0; }
.aiz-checkbox input:checked + .aiz-square-check { background: var(--brand-orange); border-color: var(--brand-orange); }
.aiz-checkbox input:checked + .aiz-square-check:after {
  content: '';
  position: absolute;
  left: 5px;
  top: 2px;
  width: 5px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.aiz-radio {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  padding: 14px 18px;
  border: 1.5px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  margin-bottom: 10px;
  background: #fff;
  transition: all 0.2s ease;
  user-select: none;
}
.aiz-radio input { accent-color: var(--brand-orange); width: 18px; height: 18px; margin: 0; flex: none; }
.aiz-radio:hover { border-color: #D1D5DB; }
.aiz-radio.on { border-color: var(--brand-orange); background: var(--soft-primary); box-shadow: 0 0 0 1px var(--brand-orange); }

.text-truncate-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ==========================================================================
   Header & Navigation
   ========================================================================== */
.top-navbar {
  background: #111215;
  color: #D1D5DB;
  font-size: 12px;
  height: 38px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.top-navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}
.top-navbar a { color: #fff; opacity: 0.85; display: inline-flex; align-items: center; gap: 6px; }
.top-navbar a:hover { opacity: 1; color: var(--brand-orange); }
.top-navbar .tagline { opacity: 0.9; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.top-navbar .tagline .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10B981;
  display: inline-block;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
}

header.hdr {
  position: sticky;
  top: 0;
  z-index: 1020;
  background: rgba(252, 249, 245, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
  transition: all 0.2s ease;
}
.logo-bar .container {
  display: flex;
  align-items: center;
  height: 76px;
  gap: 20px;
}

/* Official Regal Hardware Brand Logo */
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--dark);
  flex: none;
  cursor: pointer;
  text-decoration: none;
}
.brand-logo-img {
  height: 44px;
  width: auto;
  object-fit: contain;
  transition: transform 0.25s ease;
  filter: drop-shadow(0 2px 6px rgba(146, 27, 29, 0.20));
}
.logo:hover .brand-logo-img {
  transform: scale(1.05);
}
.logo-text-col {
  display: flex;
  flex-direction: column;
  line-height: 1;
}
.logo-text-brand {
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--brand-red);
}
.logo-text-sub {
  font-size: 9.5px;
  font-weight: 800;
  letter-spacing: 0.16em;
  color: var(--dark);
  text-transform: uppercase;
  margin-top: 3px;
}

/* Search Box */
.search-wrap {
  flex: 1;
  position: relative;
  max-width: 520px;
  margin: 0 auto;
}
.search-input-box { position: relative; }
.search-input-box input {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--border-subtle);
  border-radius: var(--radius-full);
  padding: 0 46px 0 20px;
  outline: none;
  font-size: 13.5px;
  background: #fff;
  color: var(--dark);
  transition: all 0.2s ease;
}
.search-input-box input:focus {
  border-color: var(--brand-red);
  box-shadow: 0 0 0 3px rgba(146, 27, 29, 0.15);
}
.search-input-box svg {
  position: absolute;
  right: 16px;
  top: 13px;
  width: 18px;
  height: 18px;
  fill: var(--gray);
  pointer-events: none;
}
.typed-search-box {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 8px);
  background: #fff;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 1050;
  max-height: 400px;
  overflow: auto;
  padding: 8px 0;
}
.typed-search-box .hd {
  padding: 8px 16px 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.typed-search-box a.sr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  color: var(--dark);
  border-bottom: 1px solid #f8fafc;
  transition: background 0.15s ease;
}
.typed-search-box a.sr:hover { background: var(--light); }
.typed-search-box .sr .th { width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); flex: none; }
.typed-search-box .sr b { color: var(--brand-orange); margin-left: auto; white-space: nowrap; font-size: 14px; font-weight: 700; }

/* Navigation Links */
.nav-links {
  display: flex;
  align-items: center;
  gap: 24px;
  font-size: 13.5px;
  font-weight: 500;
  color: #4B5563;
}
.nav-links a { color: #4B5563; transition: color 0.15s ease; }
.nav-links a:hover, .nav-links a.on { color: var(--dark); font-weight: 600; }

/* Header Actions */
.hdr-icons { display: flex; align-items: center; gap: 12px; flex: none; }

/* Contractor Mode Pill Toggle */
.contractor-pill {
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  border-radius: var(--radius-full);
  border: 1px solid #D1D5DB;
  background: transparent;
  color: #1F2937;
  cursor: pointer;
  transition: all 0.2s ease;
}
.contractor-pill:hover { border-color: #9CA3AF; color: #000; }
.contractor-pill.active {
  background: var(--brand-cream);
  border-color: var(--brand-orange);
  color: var(--brand-orange);
  font-weight: 700;
}

/* Black Cart Pill from Sample UI */
.cart-pill-btn {
  padding: 8px 18px;
  font-size: 13.5px;
  font-weight: 600;
  color: #fff;
  background: #111215;
  border: 1px solid #111215;
  border-radius: var(--radius-full);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  box-shadow: var(--shadow-sm);
  position: relative;
}
.cart-pill-btn:hover { background: #000; }
.cart-pill-badge {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--brand-orange);
  color: #fff;
  font-size: 11px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* User Account Icon */
.nav-user {
  position: relative;
  display: flex;
  align-items: center;
  cursor: pointer;
}
.nav-user .circle {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid var(--border-subtle);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  color: var(--brand-orange);
}
.user-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 220px;
  background: #fff;
  box-shadow: var(--shadow-xl);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  display: none;
  z-index: 1050;
  overflow: hidden;
}
.nav-user:hover .user-menu, .nav-user.open .user-menu { display: block; }
.user-menu a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  color: var(--dark);
  border-bottom: 1px solid var(--light);
  font-size: 13.5px;
  font-weight: 500;
}
.user-menu a:hover { background: var(--light); }

/* Mini-cart Dropdown */
.cart-dropdown {
  position: absolute;
  right: 0;
  top: calc(100% + 10px);
  width: 360px;
  background: #fff;
  color: var(--dark);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-xl);
  display: none;
  z-index: 1050;
  cursor: default;
  overflow: hidden;
}
.nav-cart-box:hover .cart-dropdown { display: block; }
.cart-dropdown .items { max-height: 300px; overflow: auto; }
.cart-dropdown .it {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--light);
  font-size: 13px;
}
.cart-dropdown .it .th { width: 44px; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); flex: none; }
.cart-dropdown .it .nm { flex: 1; min-width: 0; text-align: left; }
.cart-dropdown .it .nm span { display: block; color: var(--secondary); font-size: 12px; margin-top: 2px; }
.cart-dropdown .it b { color: var(--brand-orange); white-space: nowrap; font-size: 13.5px; }
.cart-dropdown .x { background: none; border: 0; color: var(--gray); cursor: pointer; font-size: 16px; padding: 4px; }
.cart-dropdown .x:hover { color: var(--danger); }
.cart-dropdown .sub { display: flex; justify-content: space-between; padding: 14px 16px; font-weight: 700; border-top: 1px solid var(--border-subtle); background: #FCF9F5; font-size: 15px; }
.cart-dropdown .ft { padding: 12px 16px; display: flex; gap: 10px; background: #fff; }

/* Submenu / Category Bar */
.menu-bar {
  background: #fff;
  border-bottom: 1px solid var(--border-subtle);
  height: 46px;
}
.menu-bar .container { display: flex; align-items: center; height: 100%; justify-content: space-between; }
.all-category-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 13.5px;
  color: var(--dark);
  cursor: pointer;
}
.all-category-btn:hover { color: var(--brand-orange); }
.cat-chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.cat-chips::-webkit-scrollbar { display: none; }
.cat-chip {
  padding: 4px 12px;
  border-radius: var(--radius-full);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--secondary);
  background: #F3F4F6;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.cat-chip:hover { background: var(--brand-cream); color: var(--brand-orange); }

/* ==========================================================================
   Hero Section (Matching Sample UI with Concentric Rings & Tradesmen Photo)
   ========================================================================== */
.hero-section {
  position: relative;
  width: 100%;
  max-width: var(--container);
  margin: 0 auto;
  padding: 32px 24px 80px;
  overflow: hidden;
}

/* Concentric Circles Ambient Backdrop in exact SVG from Sample UI */
.hero-concentric-bg {
  position: absolute;
  top: -40px;
  right: -80px;
  width: 960px;
  height: 960px;
  pointer-events: none;
  select-none: none;
  z-index: 0;
}

.hero-grid {
  display: grid;
  grid-template-columns: 5fr 7fr;
  gap: 32px;
  align-items: center;
  position: relative;
  z-index: 10;
}

.hero-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-right: 12px;
}
.hero-tag {
  font-size: 14px;
  font-weight: 700;
  color: var(--brand-orange);
  letter-spacing: 0.02em;
  margin-bottom: 14px;
}
.hero-title {
  font-size: 54px;
  font-weight: 800;
  line-height: 1.08;
  color: #0A0A0C;
  letter-spacing: -0.035em;
  margin-bottom: 18px;
}
.hero-desc {
  font-size: 15px;
  line-height: 1.6;
  color: #4B5563;
  max-width: 440px;
  margin: 0 0 28px;
}
.hero-cta-row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.btn-hero-start {
  padding: 13px 30px;
  border-radius: var(--radius-full);
  background: #111215;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  border: 1px solid #111215;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-hero-start:hover { background: #000; transform: translateY(-1px); }
.btn-hero-learn {
  padding: 13px 30px;
  border-radius: var(--radius-full);
  background: transparent;
  border: 1px solid #D1D5DB;
  color: #111827;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.btn-hero-learn:hover { border-color: #4B5563; }

/* Hero Right: Tradesmen Photo + Floating Interactive Badges */
.hero-visual {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  min-height: 540px;
}

/* Tradesmen Cutout Frame */
.hero-photo-wrapper {
  position: relative;
  width: 100%;
  max-width: 620px;
  max-width: 720px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  user-select: none;
}
.hero-tradesmen-img {
  width: 100%;
  height: auto;
  max-height: 640px;
  object-fit: contain;
  filter: drop-shadow(0 20px 35px rgba(146, 27, 29, 0.20));
  transition: transform 0.4s ease;
}
.hero-photo-wrapper:hover .hero-tradesmen-img {
  transform: scale(1.02);
}

/* Floating Badges from Sample UI */
.hero-badge-top-left {
  position: absolute;
  left: 0;
  top: 40px;
  z-index: 20;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);

/* API and State Helpers */

}
function loading(on) { $('#loader').classList.toggle('active', !!on); }
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (st.token) h.Authorization = 'Bearer ' + st.token;
  const r = await fetch(API + path, { ...opts, headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && st.token && !/^\/(otp|login)/.test(path)) { signOut(false); }
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;

  const w = st.cat ? st.cat.settings : { delivery: 0, freeOver: 0 };

    return a + (p ? l.qty * priceFor(p, l.qty) : 0);
  }, 0);
  const del = (st.deliver && goods < w.freeOver && goods > 0) ? w.delivery : 0;
  return { goods, del, total: goods + del, n: lines.length };

function priceFor(p, qty) {
  let pr = p.price;
  if (st.isContractorMode) {
    pr = Math.round(p.price * 0.88); // 12% Contractor discount

  if (p.tiers && p.tiers.length) {
    const t = p.tiers.filter(t => qty >= t.min).sort((a, b) => b.min - a.min)[0];

}

}

  if (s.includes('compress') || s.includes('pneumatic') || s.includes('air pump') || s.includes('generator')) return 'products/compressor.jpg';
  if (s.includes('insulat') || s.includes('cement') || s.includes('concrete') || s.includes('mortar') || s.includes('wool') || s.includes('tokyo') || s.includes('national') || s.includes('universal')) return 'products/insulation.jpg';
  return 'products/drill.jpg';
}
function thumb(p, small) {
  const src = getProductImage(p);
  return `<div class="th"><img src="${esc(src)}" alt="${esc(p?.name || 'Product')}" loading="lazy" onerror="this.src='products/drill.jpg'"></div>`;
}

/* Routing */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = {};
  (qs || '').split('&').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split('=');
    q[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  const parts = path.split('/').filter(Boolean);
  return { path, parts, q };
}
function go(path, q) {
  const qs = q ? Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '';
  location.hash = '#/' + path + (qs ? '?' + qs : '');
}
const url = (path, q) => '#/' + path + (q ? '?' + Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '');
window.addEventListener('hashchange', () => {
  st.route = parseRoute();
  st.catOpen = false;
  st.drawer = false;
  render();
  window.scrollTo({ top: 0 });
});

/* Render & Binding */
function render() {
  const app = $('#app');
  if (!st.cat) {
    app.innerHTML = '<div style="padding:100px 20px;text-align:center"><div class="dot-loader" style="justify-content:center;margin-bottom:16px"><i></i><i></i><i></i></div><b>Loading Regal Hardware storefront...</b></div>';
    return;
  }
  const v = st.route.parts[0] || '';
  const page = ({ '': home, search: listing, categories: categoriesPage, product: productPage, cart: cartPage, checkout: checkout, done: donePage, account: accountPage, track: trackPage, contact: contactPage })[v] || home;
  const waNo = (st.cat.settings.whatsapp || '').replace(/\D/g, '').replace(/^0/, '94');

  app.innerHTML = header() + `<main>${page()}</main>` + footer()
    + (waNo ? `<a class="wa-float" href="https://wa.me/${waNo}" target="_blank" rel="noopener">${I.wa}<span>Direct Quotes</span></a>` : '');
  bind();
}

function bind() {
  const root = $('#app');
  $$('[data-login]', root).forEach(a => a.onclick = e => { e.preventDefault(); signIn(() => { st.me = null; render(); }); });
  $$('[data-logout]', root).forEach(a => a.onclick = e => { e.preventDefault(); signOut(); });

  const cBtn = $('#contractorBtn');
  if (cBtn) cBtn.onclick = toggleContractorMode;

  const s = $('#search');
  if (s) {
    s.oninput = () => typed(s.value);
    s.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('#typed')?.classList.add('hide');
        go('search', { q: s.value.trim() });
      }
    };
  }
  document.onclick = e => {
    if (!e.target.closest('.search-wrap')) $('#typed')?.classList.add('hide');
    if (!e.target.closest('#navUser')) $('#navUser')?.classList.remove('open');
  };

  $$('[data-add]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    const q = b.dataset.qtyfrom ? +$('#' + b.dataset.qtyfrom).value || 1 : 1;
    addToCart(+b.dataset.add, q);
  });
  $$('[data-buynow]', root).forEach(b => b.onclick = () => {
    addToCart(+b.dataset.buynow, +$('#pdQty').value || 1, true);
    go('checkout');
  });
  $$('[data-wish]', root).forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      toggleWish(+a.dataset.wish);
    };
  });
  $$('[data-cartrm]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    st.cart = st.cart.filter(l => l.pid !== +b.dataset.cartrm);
    saveCart();
    notify('danger', 'Item removed');
    if (['cart', 'checkout'].includes(st.route.parts[0])) render();
    else drawHeaderBits();
  });

  $$('[data-qty]', root).forEach(b => b.onclick = () => {
    const i = $('#pdQty');
    i.value = Math.max(1, (+i.value || 1) + +b.dataset.qty);
    st.pdQty = +i.value;
    $('.pd .tot').textContent = money(priceFor(P(st.route.parts[1]), st.pdQty) * st.pdQty);
  });

  const pl = $('#place');
  if (pl) pl.onclick = place;
}

let typedT;
function typed(v) {
  clearTimeout(typedT);
  const box = $('#typed');
  const kw = v.toLowerCase().trim();
  if (!kw) { box.classList.add('hide'); return; }
  typedT = setTimeout(() => {
    const hits = st.cat.products.filter(p => p.name.toLowerCase().includes(kw) || p.code.toLowerCase().includes(kw)).slice(0, 6);
    box.innerHTML = hits.map(p => `
      <a class="sr" href="${url('product/' + p.id)}">
        ${thumb(p, true)}
        <div style="flex:1"><b>${esc(p.name)}</b></div>
        <b>${money(p.price)}</b>
      </a>
    `).join('') || '<div style="padding:16px;text-align:center;color:var(--gray)">No materials found</div>';
    box.classList.remove('hide');
  }, 120);
}

function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = html;
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  document.body.appendChild(bg);
  return bg;
}

async function place() {
  if (st.busy) return;
  if (!st.token) return signIn(() => { render(); place(); });
  const addr = ($('#addr') || {}).value || '', note = ($('#note') || {}).value || '';
  if (!$('#agree')?.checked) return notify('danger', 'Please confirm the agreement checkbox');
  ls.set('addr', addr);
  st.busy = true;
  loading(true);
  try {
    const lines = selLines().map(({ pid, qty }) => ({ pid, qty }));
    const j = await api('/order', { method: 'POST', body: { lines, deliver: true, address: addr, note, pay: 'cod' } });
    st.placed = { ...j, total: totals().total };
    st.cart = [];
    saveCart();
    notify('success', 'Order placed successfully');
    go('done/' + j.no);
  } catch (e) {
    notify('danger', e.message);
  } finally {
    st.busy = false;
    loading(false);
  }
}

function signIn(then) {
  let phone = st.phone || '', stage = 'phone', code = '';
  const el = modal('<div class="modal"></div>');
  const box = $('.modal', el);
  const draw = () => {
    box.innerHTML = `<button class="close" data-close>✕</button><div class="mb">
      <h2>${stage === 'phone' ? 'Customer Sign In' : 'Enter SMS Code'}</h2>
      <div class="form-group"><label class="lbl">Mobile Number</label><input class="form-control" id="shPh" value="${esc(phone)}" placeholder="07XXXXXXXX"></div>
      ${stage === 'code' ? `<div class="form-group"><label class="lbl">6-Digit Code</label><input class="form-control code-in" id="shCode" maxlength="6" placeholder="••••••"></div>` : ''}
      <button class="btn btn-primary btn-block btn-lg" id="shGo">${stage === 'phone' ? 'Send Code' : 'Verify'}</button>
    </div>`;
    $('#shGo', box).onclick = step;
  };
  const step = async () => {
    try {
      if (stage === 'phone') {
        phone = $('#shPh', box).value.replace(/\D/g, '');
        await api('/otp', { method: 'POST', body: { phone } });
        stage = 'code';
        draw();
      } else {
        code = $('#shCode', box).value.trim();
        const j = await api('/login', { method: 'POST', body: { phone, code, name: 'Trade Customer' } });
        st.token = j.token; st.name = j.name; st.phone = j.phone;
        ls.set('token', j.token); ls.set('name', j.name); ls.set('phone', j.phone);
        el.remove();
        notify('success', 'Welcome, ' + j.name);
        if (then) then();
      }
    } catch (e) { notify('danger', e.message); }
  };
  draw();
}
