<!-- Firebase SDK (Auth + Firestore) -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, collection, addDoc, query, where, orderBy, getDocs, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  // ── REPLACE with your Firebase project config ──────────────────────────────
  // Go to: console.firebase.google.com → Project Settings → Your apps → Web app
  const FIREBASE_CONFIG = {
    apiKey:            "PASTE_YOUR_API_KEY_HERE",
    authDomain:        "PASTE_YOUR_AUTH_DOMAIN_HERE",
    projectId:         "PASTE_YOUR_PROJECT_ID_HERE",
    storageBucket:     "PASTE_YOUR_STORAGE_BUCKET_HERE",
    messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID_HERE",
    appId:             "PASTE_YOUR_APP_ID_HERE"
  };
  // ────────────────────────────────────────────────────────────────────────────

  let _app, _auth, _db, _provider;
  const FIREBASE_READY = !FIREBASE_CONFIG.apiKey.includes('PASTE');

  if (FIREBASE_READY) {
    _app      = initializeApp(FIREBASE_CONFIG);
    _auth     = getAuth(_app);
    _db       = getFirestore(_app);
    _provider = new GoogleAuthProvider();
    _provider.setCustomParameters({ prompt: 'select_account' });

    onAuthStateChanged(_auth, user => {
      window.__rglGUser = user;
      if (window.__rglOnAuthChange) window.__rglOnAuthChange(user);
    });
  }

  // Expose to global scope (used by signIn() in the main script)
  window.__firebaseReady = FIREBASE_READY;
  window.__fbSignInGoogle = async () => {
    if (!FIREBASE_READY) throw new Error('Firebase not configured. Please add your Firebase config keys.');
    const result = await signInWithPopup(_auth, _provider);
    return result.user;
  };
  window.__fbSignOut = async () => {
    if (FIREBASE_READY && _auth) await fbSignOut(_auth);
  };
  window.__fbSaveOrder = async (uid, order) => {
    if (!FIREBASE_READY || !_db) return null;
    const ref = await addDoc(collection(_db, 'orders'), { uid, ...order, createdAt: serverTimestamp() });
    return ref.id;
  };
  window.__fbGetOrders = async (uid) => {
    if (!FIREBASE_READY || !_db) return [];
    const q = query(collection(_db, 'orders'), where('uid', '==', uid), orderBy('createdAt', 'desc'));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  };
</script>

/* ==========================================================================
   Hero Section (Concentric Ambient Rings & Tradesmen Interactive Showcase)
   ========================================================================== */
.hero-section {
  position: relative;
  width: 100%;
  max-width: var(--container);
  margin: 0 auto;
  padding: 32px 24px 0;
  overflow: visible;
}

/* Concentric Circles Ambient Backdrop in exact SVG from Sample UI with Breathing Glow */
.hero-concentric-bg {
  position: absolute;
  top: -40px;
  right: -80px;
  width: 960px;
  height: 960px;
  pointer-events: none;
  user-select: none;
  z-index: 0;
  transform-origin: 60% 50%;
  animation: heroConcentricPulse 14s ease-in-out infinite alternate;
  will-change: transform, opacity;
}
@keyframes heroConcentricPulse {
  0% {
    transform: scale(1) rotate(0deg);
    opacity: 0.88;
  }
  50% {
    transform: scale(1.05) rotate(1.4deg);
    opacity: 1;
  }
  100% {
    transform: scale(1) rotate(0deg);
    opacity: 0.88;
  }
}

.hero-grid {
  display: grid;
  grid-template-columns: 5fr 7fr;
  gap: 32px;
  align-items: center;
  position: relative;
  z-index: 10;
}

.hero-left {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  padding-right: 12px;
}

/* Hero Staggered Fluid Entrances */
@keyframes heroFadeSlideUp {
  0% {
    opacity: 0;
    transform: translateY(22px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-live-dot {

  height: 7px;
  border-radius: 50%;
  background: #10B981;
  display: inline-block;
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  animation: liveDotPulse 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
}
@keyframes liveDotPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
  }
  70% {
    box-shadow: 0 0 0 8px rgba(16, 185, 129, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }

.hero-title {

  color: #fff;
  font-size: 14px;

  border: 1px solid #111215;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);

/* Floating Badges with Organic Levitation Physics */
.hero-badge-top-left {
  position: absolute;
  left: 0;
  top: 40px;
  z-index: 25;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(146, 27, 29, 0.20);
  border-radius: 18px;
  padding: 10px 14px;
  box-shadow: 0 16px 30px -10px rgba(17, 18, 21, 0.12);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  animation: heroFadeSlideUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.38s both, badgeFloatTop 6s ease-in-out 1.25s infinite alternate;
  will-change: transform;
}
@keyframes badgeFloatTop {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(-9px) rotate(-0.6deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
.hero-badge-top-left:hover {
  transform: scale(1.07) translateY(-5px) !important;
  box-shadow: 0 20px 35px -6px rgba(146, 27, 29, 0.24);
}

.badge-icon-box {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: linear-gradient(135deg, #921B1D 0%, #751416 100%);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  transition: transform 0.3s ease;
}
.hero-badge-top-left:hover .badge-icon-box {
  transform: scale(1.1) rotate(4deg);
}

.badge-lbl { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; color: var(--brand-red); text-transform: uppercase; }
.badge-val { font-size: 12.5px; font-weight: 700; color: #111827; }

.hero-badge-bottom-left {
  position: absolute;
  left: 10px;
  bottom: 24px;
  z-index: 25;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(146, 27, 29, 0.20);
  border-radius: 18px;
  padding: 10px 14px;
  box-shadow: 0 16px 30px -10px rgba(17, 18, 21, 0.12);
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  animation: heroFadeSlideUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.5s both, badgeFloatBottom 6.8s ease-in-out 1.4s infinite alternate;
  will-change: transform;
}
@keyframes badgeFloatBottom {
  0% { transform: translateY(0px) rotate(0deg); }
  50% { transform: translateY(8px) rotate(0.6deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}
.hero-badge-bottom-left:hover {
  transform: scale(1.07) translateY(-4px) !important;
  box-shadow: 0 20px 35px -6px rgba(146, 27, 29, 0.24);
}
.hero-badge-bottom-left:hover .badge-icon-box {
  transform: scale(1.1) rotate(-4deg);
}

.hero-badge-action {
  position: absolute;
  right: 12px;
  bottom: 30px;
  z-index: 25;
  width: 58px;
  height: 58px;
  background: #921B1D;
  border-radius: 20px;
  box-shadow: 0 16px 32px rgba(146, 27, 29, 0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  cursor: pointer;
  border: 3.5px solid rgba(255, 255, 255, 0.85);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  animation: heroFadeSlideUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.62s both, actionPulse 3.4s ease-in-out 1.5s infinite;
  will-change: transform, box-shadow;
}
.hero-badge-action::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 24px;
  border: 2px solid rgba(146, 27, 29, 0.45);
  animation: actionRadarRing 2.6s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
  pointer-events: none;
}
@keyframes actionRadarRing {
  0% {
    transform: scale(0.92);
    opacity: 0.9;
  }
  100% {
    transform: scale(1.4);
    opacity: 0;
  }
}
@keyframes actionPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 16px 32px rgba(146, 27, 29, 0.45);
  }
  50% {
    transform: scale(1.08) translateY(-3px);
    box-shadow: 0 22px 40px rgba(146, 27, 29, 0.65), 0 0 0 8px rgba(146, 27, 29, 0.12);
  }
}
.hero-badge-action:hover {
  transform: scale(1.15) !important;
  box-shadow: 0 24px 45px rgba(146, 27, 29, 0.70);
}
.hero-badge-action svg {
  width: 26px;
  height: 26px;
  transition: transform 0.25s ease;
}
.hero-badge-action:hover svg {
  transform: scale(1.12);
}

/* Accessibility: Respect Reduced Motion Preferences */
@media (prefers-reduced-motion: reduce) {
  .hero-concentric-bg,
  .hero-tag,
  .hero-live-dot,
  .hero-title,
  .hero-desc,
  .hero-cta-row,
  .btn-hero-start::after,
  .hero-tradesmen-img,
  .hero-badge-top-left,
  .hero-badge-bottom-left,
  .hero-badge-action,
  .hero-badge-action::before {
    animation: none !important;
    transition: none !important;
  }
}

.aiz-card-box {

/* API and State Helpers */
function notify(kind, msg) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3400);
}
function loading(on) { $('#loader').classList.toggle('active', !!on); }
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (st.token) h.Authorization = 'Bearer ' + st.token;
  const r = await fetch(API + path, { ...opts, headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && st.token && !/^\/(otp|login)/.test(path)) { signOut(false); }
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;
}
const P = id => st.cat && st.cat.products.find(p => String(p.id) === String(id));
const cartN = () => st.cart.reduce((a, l) => a + l.qty, 0);
const selLines = () => st.cart.filter(l => l.sel !== false && P(l.pid));
function totals(lines = selLines()) {
  const w = st.cat ? st.cat.settings : { delivery: 0, freeOver: 0 };
  const goods = lines.reduce((a, l) => {
    const p = P(l.pid);
    return a + (p ? l.qty * priceFor(p, l.qty) : 0);
  }, 0);
  const del = (st.deliver && goods < w.freeOver && goods > 0) ? w.delivery : 0;
  return { goods, del, total: goods + del, n: lines.length };
}
function priceFor(p, qty) {
  let pr = p.price;
  if (st.isContractorMode) {
    pr = Math.round(p.price * 0.88); // 12% Contractor discount
  }
  if (p.tiers && p.tiers.length) {
    const t = p.tiers.filter(t => qty >= t.min).sort((a, b) => b.min - a.min)[0];
    if (t) return Math.min(pr, t.price);
  }
  return pr;
}
const discPct = p => p.mrp > p.price ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
function saveCart() { ls.set('cart', st.cart.map(({ pid, qty, sel }) => ({ pid, qty, sel }))); }
function addToCart(pid, qty = 1, quiet) {
  const p = P(pid);
  if (!p) return;
  qty = +qty || 1;
  if (qty <= 0) return;
  if (p.stock !== null && p.stock <= 0) return notify('warning', p.name + ' is out of stock just now');
  const ex = st.cart.find(l => String(l.pid) === String(pid));
  if (ex) { ex.qty += qty; ex.sel = true; } else st.cart.push({ pid, qty, sel: true });
  saveCart();
  if (!quiet) notify('success', `${p.name} added to cart`);
  drawHeaderBits();
  const box = $('#cartModalContainer');
  if (box) box.innerHTML = cartModalInnerHtml();
}

function updateCartQty(pid, delta) {
  const line = st.cart.find(l => String(l.pid) === String(pid));
  if (!line) return;
  line.qty += delta;
  if (line.qty <= 0) {
    st.cart = st.cart.filter(l => String(l.pid) !== String(pid));
    notify('danger', 'Item removed');
  }
  saveCart();
  drawHeaderBits();
  const box = $('#cartModalContainer');
  if (box) {
    box.innerHTML = cartModalInnerHtml();
  } else if (['cart', 'checkout'].includes(st.route.parts[0])) {
    render();
  }
}

function removeFromCart(pid) {
  st.cart = st.cart.filter(l => String(l.pid) !== String(pid));
  saveCart();
  drawHeaderBits();
  notify('danger', 'Item removed');
  const box = $('#cartModalContainer');
  if (box) {
    box.innerHTML = cartModalInnerHtml();
  } else if (['cart', 'checkout'].includes(st.route.parts[0])) {
    render();
  }
}

/* Routing */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = {};
  (qs || '').split('&').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split('=');
    q[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  const parts = path.split('/').filter(Boolean);
  return { path, parts, q };
}
function go(path, q) {
  const qs = q ? Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '';
  location.hash = '#/' + path + (qs ? '?' + qs : '');
}
const url = (path, q) => '#/' + path + (q ? '?' + Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '');

function smoothScrollTo(targetId) {
  if (st.route && st.route.path && st.route.path !== '') {
    st.route = { path: '', parts: [], q: {} };
    location.hash = '#/';
    render();
    setTimeout(() => {
      const el = document.getElementById(targetId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 90);
  } else {
    const el = document.getElementById(targetId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
}

function calcPaintCoverage() {
  const area = Math.max(10, parseFloat($('#paintArea')?.value || '1200'));
  const coats = parseInt($('#paintCoats')?.value || '2', 10);
  const totalArea = area * coats;
  const liters = Math.ceil(totalArea / 110);
  const cans4L = Math.ceil(liters / 4);
  const litersEl = $('#paintLiters');
  if (litersEl) litersEl.textContent = liters;
  const resEl = $('#paintResult .res-desc');
  if (resEl) {
    resEl.textContent = `Approx. ${cans4L} cans (4L) of Dulux Weathershield or Asian Paints Royale for ${area} sq. ft (${coats} coats)`;
  }
}

function drawHeaderBits() {
  const lines = st.cart.filter(l => P(l.pid)), n = cartN(), t = totals(lines);
  const c = $('#cartN');
  if (c) {
    c.textContent = n;
    c.style.display = n > 0 ? 'flex' : 'none';
  }
  const d = $('#cartDrop'); if (d) d.innerHTML = cartDropdown();

  // Floating bottom cart bar dynamic update (Amore pattern)
  const v = st.route.parts[0] || '';
  if (!['cart', 'checkout', 'done'].includes(v)) {
    let bar = $('#floatingCartBar');
    if (lines.length > 0) {
      if (!bar) {
        const wrap = document.createElement('div');
        wrap.innerHTML = floatingCartBar(lines);
        if (wrap.firstElementChild) document.body.appendChild(wrap.firstElementChild);
      } else {
        const bubble = $('.fcb-count-bubble', bar);
        const lbl = $('.fcb-items-label', bar);
        const val = $('.fcb-total-val', bar);
        if (bubble) bubble.textContent = n;
        if (lbl) lbl.textContent = `${n} ${n === 1 ? 'material' : 'materials'} in order cart`;
        if (val) val.textContent = money(t.goods);
        bar.classList.add('visible');
      }
    } else if (bar) {
      bar.classList.remove('visible');
    }
  }
}

/* Modern Product Card with Real-World Imagery, Options & Stock Urgency (Square & Non-clickable) */
function productBox(p) {
  const d = discPct(p), out = p.stock !== null && p.stock <= 0;
  const price = priceFor(p, 1);
  const isContractor = !!st.isContractorMode;
  const contractorPrice = Math.round(price * 0.88);
  const pidStr = String(p.id || 'p0');
  const reviewsCount = p.reviews || Math.floor(((pidStr.charCodeAt(0) || 7) * 19) % 150 + 25);
  const ratingScore = (4.7 + (((pidStr.charCodeAt(pidStr.length - 1) || 5) % 3) / 10)).toFixed(1);
  const badgeLabel = d > 0 ? `-${d}%` : (p.featured ? 'Featured' : (p.sold > 80 ? 'Best Seller' : ''));
  const currentOption = st.selectedOptions[p.id] || (p.options && p.options[0]) || '';

  return `
  <div class="aiz-card-box aiz-card-square">
    <div class="pic">
      ${thumb(p)}
      ${badgeLabel ? `<div class="disc"><span class="dot"></span><span>${badgeLabel}</span></div>` : ''}
      <div class="aiz-p-hov-icon">
        <a href="#" data-wish="${p.id}" class="${st.wish.includes(p.id) ? 'on' : ''}" title="Save to wishlist" onclick="event.stopPropagation(); toggleWish('${p.id}')">
          ${I.heartO}
        </a>
      </div>
    </div>
    <div class="body">
      <div>
        <div class="card-meta-line">
          <span class="card-cat-name">${esc(p.cat || 'Hardware')}${p.brand ? ` · ${esc(p.brand)}` : ''}</span>
          <span>${esc(p.code || '')}</span>
        </div>
        <h3 style="cursor:default"><span style="color:#111215;font-weight:800">${esc(p.name)}</span></h3>
        
        <div class="card-rating-stock" style="margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:4px;color:#F59E0B">
            ${I.star} <b style="color:#111215;font-size:12px">${ratingScore}</b>
            <span style="color:#9CA3AF;font-size:11px">(${reviewsCount})</span>
          </div>
          ${out ? `<span style="color:#DC2626;font-size:11.5px;font-weight:700">Out of stock</span>` : 
            (p.stock !== null && p.stock <= 5 ? 
              `<div class="stock-badge-urgent"><span class="dot"></span>Only ${p.stock} left!</div>` : 
              `<div class="pulse-stock"><span class="pulse-stock-dot"></span>${fq(p.stock || 25)} in stock</div>`
            )
          }
        </div>

        ${p.options && p.options.length ? `
        <div class="card-options-box" onclick="event.stopPropagation()">
          ${p.options.map((opt, i) => `
            <span class="card-opt-chip ${(currentOption === opt || (!currentOption && i === 0)) ? 'active' : ''}" onclick="selectProductOption('${p.id}', '${esc(opt)}', this)">
              ${esc(opt)}
            </span>
          `).join('')}
        </div>` : ''}
      </div>

      <div class="price-row" style="margin-top:14px">
        <div class="price-block">
          <span class="price-bold">${money(isContractor ? contractorPrice : price)}${p.unit ? `<small style="font-size:11px;color:#6B7280;font-weight:600"> /${esc(p.unit)}</small>` : ''}</span>
          ${p.mrp > price ? `<span class="price-mrp">${money(p.mrp)}</span>` : ''}
          ${isContractor ? `<span class="contractor-pill">Trade Pro -12%</span>` : ''}
        </div>
        ${out ? `<div class="oos">Sold out</div>` : `
          <button class="card-add-btn" data-add="${p.id}" onclick="event.stopPropagation(); addToCart('${p.id}', 1)" title="Add to cart">
            ${I.cart} Add

}

/* Comprehensive Ecommerce Listing with Horizontal Top Filters & Square Cards */
function listing() {
  const q = st.route.q || {};
  const kw = (q.q || '').toLowerCase().trim();
  const cat = q.cat || '';
  const brand = q.brand || '';
  const range = q.range || '';
  const instock = q.instock || '';
  const sort = q.sort || '';

  // Multi-criteria filtering
  let list = st.cat.products.filter(p => {
    if (cat && p.cat !== cat) return false;
    if (brand && p.brand !== brand) return false;
    if (instock === '1' && p.stock !== null && p.stock <= 0) return false;
    if (kw && !p.name.toLowerCase().includes(kw) && !p.code.toLowerCase().includes(kw) && !(p.desc || '').toLowerCase().includes(kw)) return false;
    
    // Price range filters
    if (range === 'under10' && p.price >= 10000) return false;
    if (range === '10to20' && (p.price < 10000 || p.price > 20000)) return false;
    if (range === '20to30' && (p.price < 20000 || p.price > 30000)) return false;
    if (range === 'over30' && p.price <= 30000) return false;
    
    return true;
  });

  // Sorting
  if (sort === 'best') list.sort((a, b) => (b.sold || 0) - (a.sold || 0));
  else if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
  else if (sort === 'name-asc') list.sort((a, b) => a.name.localeCompare(b.name));

  // Unique brands for filter
  const allBrands = Array.from(new Set(st.cat.products.map(p => p.brand).filter(Boolean)));

          ${st.cat.categories.map(c => `
            <button class="card-opt-chip ${cat === c.name ? 'active' : ''}" style="padding:8px 16px;font-size:13px;border-radius:9999px;white-space:nowrap;cursor:pointer" onclick="go('search',{...q,cat:'${esc(c.name)}'})">
              ${esc(c.name)} (${c.count})
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Row 2: Secondary Horizontal Filters (Budget, Brand, Stock, Sort) -->
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;padding-top:16px;border-top:1px solid #F3F4F6">
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px">
          <!-- Price Budget Filter -->
          <div style="display:flex;align-items:center;gap:6px">
            <span style="font-size:12px;font-weight:700;color:#4B5563">Budget:</span>
            <select style="border:1.5px solid var(--border-subtle);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:600;background:#fff;cursor:pointer;outline:none" onchange="go('search',{...q,range:this.value})">

  if (!p) return `<div class="empty">${I.frown}<h3>Product not found</h3><a class="btn btn-primary" href="#/search">Browse Catalog</a></div>`;
  const price = priceFor(p, st.pdQty || 1);
  const out = p.stock !== null && p.stock <= 0;

  return `<div class="container" style="padding:40px 24px">
    <div class="pd">
      <div class="gallery"><div class="main">${thumb(p)}</div></div>
      <div class="info">
        <h1>${esc(p.name)}</h1>
        <div class="meta">
          <div>Category: <b>${esc(p.cat)}</b></div>
          <div>SKU: <b>${esc(p.code)}</b></div>
        </div>
        <div class="pricing">
          <h6>${money(price)} <span style="font-size:16px;color:var(--gray)">/ ${esc(p.unit || 'pc')}</span></h6>
          <span class="badge badge-soft-orange">✔ Jobsite Ready</span>
        </div>
        <div class="qtybox">
          <div class="r1">
            <div class="tot">${money(price * (st.pdQty || 1))}</div>
            <div class="aiz-plus-minus">
              <button data-qty="-1">−</button>
              <input type="number" id="pdQty" value="${st.pdQty || 1}" min="1">
              <button data-qty="1">+</button>
            </div>
          </div>
          ${out ? `<button class="btn btn-light btn-block btn-lg" style="margin-top:16px" disabled>Out of Stock</button>` : `
            <div class="buttons">
              <button class="btn btn-dark" data-buynow="${p.id}">Buy Now</button>
              <button class="btn btn-primary" data-add="${p.id}" data-qtyfrom="pdQty">${I.cart} Add to Cart</button>
            </div>`}
        </div>
      </div>
    </div>
  </div>`;
}

function cartPage() {
  const lines = st.cart.filter(l => P(l.pid));
  if (!lines.length) return `<div class="empty">${I.frown}<h3>Your cart is empty</h3><a class="btn btn-primary" href="#/search">Explore Materials</a></div>`;
  const t = totals();

  return `<div class="container"><div class="two-col">
    <div class="main"><div class="cart-card">
      <h2 style="font-size:24px;margin-bottom:20px">Order Cart (${lines.length})</h2>
      ${lines.map(l => {
        const p = P(l.pid), u = priceFor(p, l.qty);
        return `<div class="cart-item">
          ${thumb(p, true)}
          <div style="flex:1"><b>${esc(p.name)}</b><div>${fq(l.qty)} × ${money(u)}</div></div>
          <div style="font-size:16px;font-weight:800;color:var(--brand-orange)">${money(u * l.qty)}</div>
          <button class="btn btn-light btn-sm" data-cartrm="${p.id}">✕</button>
        </div>`;
      }).join('')}
    </div></div>
    <div class="side">${summary(t, true)}</div>
  </div></div>`;
}

function summary(t, proceed) {
  return `<div class="summary">
    <div class="ch">Order Breakdown</div>
    <div class="cb">
      <table>
        <tr><td>Items Subtotal</td><td>${money(t.goods)}</td></tr>
        <tr><td>Jobsite Delivery</td><td>${money(t.del)}</td></tr>
        <tr class="total"><td>Total Payable</td><td>${money(proceed ? t.goods : t.total)}</td></tr>
      </table>
      ${proceed ? `<a class="btn btn-primary btn-block btn-lg" style="margin-top:20px" href="#/checkout">Proceed to Checkout →</a>` : ''}
    </div>
  </div>`;
}

function floatingCartBar(lines) {
  lines = lines || st.cart.filter(l => P(l.pid));
  if (!lines.length) return '';
  const t = totals(lines);
  const n = cartN();
  return `
  <div class="floating-cart-bar visible" id="floatingCartBar">
    <div class="fcb-left" onclick="openCartModal()" title="Click to review cart">
      <div class="fcb-icon-badge">
        ${I.cart}
        <span class="fcb-count-bubble">${n}</span>
      </div>
      <div class="fcb-info">
        <span class="fcb-items-label">${n} ${n === 1 ? 'material' : 'materials'} in order cart</span>
        <span class="fcb-total-val">${money(t.goods)}</span>
      </div>
    </div>
    <div class="fcb-right">
      <button class="fcb-btn-checkout" onclick="openCartModal()" title="Review materials in cart">
        <span>Review Order &amp; Checkout</span>
        ${I.right}
      </button>
    </div>
  </div>`;
}

function checkout() {
  const lines = selLines();
  if (!lines.length) return `<div class="empty"><h3>Cart is empty</h3><a class="btn btn-primary" href="#/search">Return to Store</a></div>`;
  const t = totals(lines);
  const addr = ls.get('addr', '') || (st.name ? '748, Main Street, Kaduruwela' : '');
  const custName = st.name || '';
  const custPhone = st.phone || '';

  return `
  <div class="container" style="padding-top:32px;padding-bottom:60px">
    <div class="two-col">
      <div class="main">
        <div class="cart-card">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #F3F4F6">

            <span style="font-size:13px;color:#16A34A;font-weight:700;background:#F0FDF4;padding:4px 10px;border-radius:9999px">✔ Depot Stock Verified</span>
          </div>

          <!-- Customer Contact -->
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
            <div class="form-group">
              <label class="lbl">Customer / Contractor Name *</label>
              <input class="form-control" id="custName" value="${esc(custName)}" placeholder="e.g. Priyantha Silva">
            </div>
            <div class="form-group">
              <label class="lbl">Mobile / WhatsApp Number *</label>
              <input class="form-control" id="custPhone" value="${esc(custPhone)}" placeholder="077 222 2259">
            </div>
          </div>

          <!-- Jobsite Address -->
          <div class="form-group" style="margin-bottom:16px">
            <label class="lbl">Jobsite / Delivery Address *</label>
            <input class="form-control" id="addr" value="${esc(addr)}" placeholder="Road name, building/site number, town in Polonnaruwa / North Central">
          </div>

          <!-- Gate / Unloading instructions -->
          <div class="form-group" style="margin-bottom:20px">
            <label class="lbl">Gate / Delivery Instructions (Optional)</label>
            <input class="form-control" id="note" placeholder="Crane required, gate access code, contractor on site...">
          </div>

          <!-- Payment Method (Amore pattern) -->
          <div style="margin-bottom:24px">
            <label class="lbl" style="margin-bottom:10px">Select Payment Method</label>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px">
              <label style="border:2px solid ${st.pay === 'cod' ? 'var(--brand-red)' : '#E5E7EB'};border-radius:14px;padding:14px;cursor:pointer;background:${st.pay === 'cod' ? '#FEF2F2' : '#fff'};display:flex;align-items:center;gap:10px" onclick="st.pay='cod';ls.set('pay','cod');render()">
                <input type="radio" name="payMethod" ${st.pay === 'cod' ? 'checked' : ''} style="display:none">
                <span style="font-size:20px">💵</span>
                <div>
                  <b style="font-size:13.5px;display:block">Cash on Delivery</b>
                  <small style="color:#6B7280;font-size:11.5px">Pay driver upon unloading</small>
                </div>
              </label>

              <label style="border:2px solid ${st.pay === 'card' ? 'var(--brand-red)' : '#E5E7EB'};border-radius:14px;padding:14px;cursor:pointer;background:${st.pay === 'card' ? '#FEF2F2' : '#fff'};display:flex;align-items:center;gap:10px" onclick="st.pay='card';ls.set('pay','card');render()">
                <input type="radio" name="payMethod" ${st.pay === 'card' ? 'checked' : ''} style="display:none">
                <span style="font-size:20px">💳</span>
                <div>
                  <b style="font-size:13.5px;display:block">Card at Jobsite</b>
                  <small style="color:#6B7280;font-size:11.5px">Wireless POS on delivery truck</small>
                </div>
              </label>

              <label style="border:2px solid ${st.pay === 'depot' ? 'var(--brand-red)' : '#E5E7EB'};border-radius:14px;padding:14px;cursor:pointer;background:${st.pay === 'depot' ? '#FEF2F2' : '#fff'};display:flex;align-items:center;gap:10px" onclick="st.pay='depot';ls.set('pay','depot');render()">

                <span style="font-size:20px">🏢</span>
                <div>
                  <b style="font-size:13.5px;display:block">Pay at Kaduruwela Depot</b>
                  <small style="color:#6B7280;font-size:11.5px">Pickup / Cash counter</small>
                </div>
              </label>
            </div>
          </div>

          <div style="margin:20px 0">
            <label class="aiz-checkbox" style="font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer">

          <div style="max-height:260px;overflow-y:auto;display:flex;flex-direction:column;gap:10px">
            ${lines.map(l => {
              const p = P(l.pid);

              return `
              <div style="display:flex;align-items:center;gap:10px;font-size:12.5px;padding-bottom:8px;border-bottom:1px solid #F3F4F6">

              </div>`;
            }).join('')}
          </div>
        </div>
        ${summary(t, false)}
      </div>
    </div>
  </div>`;
}

function donePage() {
  const o = st.placed || (st.orders && st.orders[0]);
  if (!o) return `<div class="empty"><h3>No recent order found</h3><a class="btn btn-primary" href="#/search">Return to Store</a></div>`;

  // WhatsApp receipt text generator (exact Amore pattern)
  const itemsText = (o.items || []).map((it, idx) => `${idx + 1}. ${it.name} ${it.option ? `(${it.option})` : ''} × ${it.qty} = Rs. ${(it.total || 0).toLocaleString()}`).join('%0A');
  const waMsg = `Hi Regal Hardware Kaduruwela,%0A%0A*NEW ORDER RECEIPT:* %23${o.ref || o.no}%0A*Customer:* ${encodeURIComponent(o.customerName || 'Customer')}%0A*Phone:* ${encodeURIComponent(o.phone || '')}%0A*Address:* ${encodeURIComponent(o.address || '')}%0A*Payment:* ${o.pay === 'cod' ? 'Cash on Delivery' : (o.pay === 'card' ? 'Card at Jobsite' : 'Pay at Depot')}%0A%0A*MATERIALS:*%0A${itemsText}%0A%0A*TOTAL AMOUNT:* Rs. ${(o.total || 0).toLocaleString()}%0A%0APlease confirm jobsite fleet dispatch. Thank you!`;
  const waLink = `https://wa.me/94772222259?text=${waMsg}`;

  return `
  <div class="container" style="padding:40px 24px 80px;max-width:860px">
    <!-- Status Banner -->
    <div class="confirm-status-banner">
      <div class="confirm-check-icon">${I.check}</div>
      <div>
        <h1 style="font-size:24px;font-weight:900;margin:0 0 4px;color:#166534">Order Received &amp; Confirmed!</h1>
        <p style="margin:0;font-size:14px;color:#15803D">Your materials are reserved at our Kaduruwela showroom &amp; depot for same-day dispatch.</p>
      </div>
    </div>

    <!-- Order Reference & Copy Box -->
    <div class="order-confirm-card">
      <div class="confirm-ref-box">
        <div>
          <small style="color:#6B7280;font-size:12px;font-weight:700;display:block">CONSIGNMENT ORDER REFERENCE</small>
          <span class="confirm-ref-val">#${esc(o.ref || o.no)}</span>
        </div>
        <button class="btn btn-light btn-sm" onclick="navigator.clipboard.writeText('${esc(o.ref || o.no)}');notify('success','Order reference copied!')">
          ${I.copy} Copy Reference
        </button>
      </div>

      <!-- Live Dispatch Progress Timeline -->
      <div class="confirm-timeline">
        <div class="timeline-step done">
          <div class="timeline-circle">✓</div>
          <span class="timeline-label">Order Placed</span>
        </div>
        <div class="timeline-step active">
          <div class="timeline-circle">2</div>
          <span class="timeline-label">Depot Pack</span>
        </div>
        <div class="timeline-step">
          <div class="timeline-circle">3</div>
          <span class="timeline-label">Fleet Truck</span>
        </div>
        <div class="timeline-step">
          <div class="timeline-circle">4</div>
          <span class="timeline-label">Jobsite Drop</span>
        </div>
      </div>

      <!-- Customer & Fulfillment Information -->
      <div style="background:#F9FAFB;border-radius:16px;padding:20px;margin-bottom:24px;display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:13.5px">
        <div>
          <b style="color:#111;display:block;margin-bottom:4px">👤 Customer Name:</b>
          <span>${esc(o.customerName || 'Trade Customer')}</span>
        </div>
        <div>
          <b style="color:#111;display:block;margin-bottom:4px">📞 Contact Phone:</b>
          <span>${esc(o.phone || '077 222 2259')}</span>
        </div>
        <div style="grid-column:1/-1">
          <b style="color:#111;display:block;margin-bottom:4px">📍 Jobsite Delivery Address:</b>
          <span>${esc(o.address || '748, Main Street, Kaduruwela')}</span>
        </div>
        ${o.note ? `<div style="grid-column:1/-1"><b style="color:#111;display:block;margin-bottom:4px">📝 Gate / Site Note:</b><span>${esc(o.note)}</span></div>` : ''}
      </div>

      <!-- Itemized Products Ordered -->
      <h3 style="font-size:18px;font-weight:800;margin-bottom:14px">Ordered Materials (${(o.items || []).length})</h3>
      <div style="border:1px solid var(--border-subtle);border-radius:16px;overflow:hidden;margin-bottom:24px">
        ${(o.items || []).map(it => `
          <div style="display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid #F3F4F6;background:#fff">
            ${it.img ? `<img src="${esc(it.img)}" style="width:48px;height:48px;border-radius:10px;object-fit:cover;border:1px solid #E5E7EB" alt="Product">` : ''}
            <div style="flex:1;min-width:0">
              <b style="font-size:14px;color:#111;display:block">${esc(it.name)}</b>
              ${it.option ? `<span style="font-size:11.5px;color:var(--brand-red);font-weight:600;display:inline-block;background:#FEF2F2;padding:1px 6px;border-radius:4px;margin-top:2px">${esc(it.option)}</span>` : ''}
              <div style="color:#6B7280;font-size:12.5px;margin-top:2px">${it.qty} × ${money(it.price)}</div>
            </div>
            <b style="font-size:15px;color:#111">${money(it.total)}</b>
          </div>
        `).join('')}

        <!-- Bill Totals -->
        <div style="padding:16px 20px;background:#FCF9F5">
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px">
            <span>Materials Subtotal:</span>
            <b>${money(o.goods || o.total)}</b>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:8px">
            <span>Fleet Logistics:</span>
            <span style="color:#16A34A;font-weight:700">${o.del > 0 ? money(o.del) : 'FREE (Over Rs. 50,000)'}</span>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:900;border-top:1.5px solid var(--border-subtle);padding-top:10px;color:var(--brand-red)">
            <span>Total Payable:</span>
            <span>${money(o.total)}</span>
          </div>
        </div>
      </div>

      <!-- Action Buttons (Amore-Style) -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <a href="${waLink}" target="_blank" rel="noopener" class="btn btn-primary btn-lg" style="flex:1.2;background:#15803D;border-color:#15803D;display:inline-flex;align-items:center;justify-content:center;gap:8px">
          ${I.wa}
          <span>WhatsApp Order Receipt</span>
        </a>
        <a href="#/track?no=${esc(o.ref || o.no)}" class="btn btn-dark btn-lg" style="flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px">
          ${I.truck}
          <span>Track Consignment</span>
        </a>
        <a href="#/search" class="btn btn-light btn-lg" style="flex:1">
          Continue Shopping →
        </a>
      </div>
    </div>
  </div>`;
}

/* Render & Binding */
function render() {
  const app = $('#app');
  if (!st.cat) st.cat = DEFAULT_CATALOG;
  const v = st.route.parts[0] || '';
  const page = ({ '': home, search: listing, categories: categoriesPage, product: productPage, cart: cartPage, checkout: checkout, done: donePage, account: accountPage, track: trackPage, contact: contactPage })[v] || home;
  const waNo = (st.cat.settings?.whatsapp || '').replace(/\D/g, '').replace(/^0/, '94');
  const cartLines = st.cart.filter(l => P(l.pid));
  const showFloatingCart = cartLines.length > 0 && !['cart', 'checkout', 'done'].includes(v);

  app.innerHTML = header() + `<main>${page()}</main>` + footer()
    + (showFloatingCart ? floatingCartBar(cartLines) : '')
    + (waNo ? `<a class="wa-float" href="https://wa.me/${waNo}" target="_blank" rel="noopener">${I.wa}<span>Direct Quotes</span></a>` : '');
  bind();
}

function bind() {
  const root = $('#app');
  $$('[data-login]', root).forEach(a => a.onclick = e => { e.preventDefault(); signIn(() => { st.me = null; render(); }); });
  $$('[data-logout]', root).forEach(a => a.onclick = e => { e.preventDefault(); signOut(); });

  const cBtn = $('#contractorBtn');
  if (cBtn) cBtn.onclick = toggleContractorMode;

  const s = $('#search');
  if (s) {
    s.oninput = () => typed(s.value);
    s.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('#typed')?.classList.add('hide');
        go('search', { q: s.value.trim() });
      }
    };
  }
  document.onclick = e => {
    if (!e.target.closest('.search-wrap')) $('#typed')?.classList.add('hide');
    if (!e.target.closest('#navUser')) $('#navUser')?.classList.remove('open');
  };

  $$('[data-add]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    const q = b.dataset.qtyfrom ? +$('#' + b.dataset.qtyfrom).value || 1 : 1;
    addToCart(b.dataset.add, q);
  });
  $$('[data-buynow]', root).forEach(b => b.onclick = () => {
    addToCart(b.dataset.buynow, +$('#pdQty').value || 1, true);
    go('checkout');
  });
  $$('[data-wish]', root).forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      toggleWish(a.dataset.wish);
    };
  });
  $$('[data-cartrm]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    removeFromCart(b.dataset.cartrm);
  });

  $$('[data-qty]', root).forEach(b => b.onclick = () => {
    const i = $('#pdQty');
    i.value = Math.max(1, (+i.value || 1) + +b.dataset.qty);
    st.pdQty = +i.value;
    $('.pd .tot').textContent = money(priceFor(P(st.route.parts[1]), st.pdQty) * st.pdQty);
  });

  const pl = $('#place');
  if (pl) pl.onclick = place;
}

let typedT;
function typed(v) {
  clearTimeout(typedT);
  const box = $('#typed');
  const kw = v.toLowerCase().trim();
  if (!kw) { box.classList.add('hide'); return; }
  typedT = setTimeout(() => {
    const hits = st.cat.products.filter(p => p.name.toLowerCase().includes(kw) || p.code.toLowerCase().includes(kw)).slice(0, 6);
    box.innerHTML = hits.map(p => `
      <a class="sr" href="${url('product/' + p.id)}">
        ${thumb(p, true)}
        <div style="flex:1"><b>${esc(p.name)}</b></div>
        <b>${money(p.price)}</b>
      </a>
    `).join('') || '<div style="padding:16px;text-align:center;color:var(--gray)">No materials found</div>';
    box.classList.remove('hide');
  }, 120);
}

function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = html;
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  document.body.appendChild(bg);
  return bg;
}

async function place() {
  if (st.busy) return;
  const name = ($('#custName')?.value || st.name || 'Trade Customer').trim();
  const phone = ($('#custPhone')?.value || st.phone || '').trim();
  const addr = ($('#addr')?.value || ls.get('addr') || '').trim();
  const note = ($('#note')?.value || '').trim();
  const lines = selLines();

  if (!lines.length) return notify('danger', 'Your cart is empty');
  if (!name) return notify('warning', 'Please enter your name');
  if (!phone) return notify('warning', 'Please enter your contact mobile number');
  if (!addr) return notify('warning', 'Please enter your jobsite delivery address');
  if (!$('#agree')?.checked) return notify('warning', 'Please confirm the agreement checkbox');

  ls.set('addr', addr);
  st.name = name;
  st.phone = phone;
  ls.set('name', name);
  ls.set('phone', phone);

  st.busy = true;
  loading(true);

  try {
    const t = totals(lines);
    const oRef = 'RGL-' + Math.floor(1000 + Math.random() * 9000);
    const order = {
      ref: oRef,
      no: oRef,
      createdAt: new Date().toISOString(),
      customerName: name,
      phone: phone,
      email: st.email || '',
      address: addr,
      note: note,
      pay: st.pay || 'cod',
      items: lines.map(l => {
        const p = P(l.pid);
        return {
          pid: l.pid,
          name: p.name,
          code: p.code,
          img: p.img,
          option: st.selectedOptions[l.pid] || (p.options && p.options[0]) || '',
          price: priceFor(p, l.qty),
          qty: l.qty,
          total: l.qty * priceFor(p, l.qty)
        };
      }),
      goods: t.goods,
      del: t.del,
      total: t.total,
      status: 'Confirmed & Logged'
    };

    // Save to local storage orders history (Amore pattern)
    const storedOrders = ls.get('regal_orders_v1', []);
    storedOrders.unshift(order);
    ls.set('regal_orders_v1', storedOrders);
    st.orders = storedOrders;

    // Async save to Firestore if connected
    if (window.__fbSaveOrder) {
      try {
        await window.__fbSaveOrder(st.gUser?.uid || 'guest', order);
      } catch (err) {
        console.warn('Firestore sync note:', err.message);
      }
    }

    // Attempt backend API call if running
    try {
      await api('/order', {
        method: 'POST',
        body: { lines: lines.map(({ pid, qty }) => ({ pid, qty })), deliver: true, address: addr, note, pay: st.pay || 'cod' }
      });
    } catch (e) {
      // Offline / standalone fallback gracefully handled
    }

    st.placed = order;
    st.cart = [];
    saveCart();
    drawHeaderBits();
    notify('success', `Order #${oRef} confirmed!`);
    go('done/' + oRef);
  } catch (e) {
    notify('danger', e.message || 'Error processing order');
  } finally {
    st.busy = false;
    loading(false);
  }
}

function signIn(then) {
  const el = modal(`
  <div class="auth-modal-card">
    <button class="close" data-close style="position:absolute;top:18px;right:20px;border:0;background:none;font-size:20px;cursor:pointer;color:#9CA3AF">✕</button>
    <div class="auth-header">
      <div class="auth-logo-badge">
        <img src="regal-logo.png" alt="Regal Hardware">
      </div>
      <h2 class="auth-title">Welcome to Regal</h2>
      <p class="auth-subtitle">Sign in with Google for 1-click trade pricing, saved jobsite addresses, and live order tracking.</p>
    </div>

    <!-- Prominent Google Sign-In Button -->
    <button class="btn-google-auth" id="btnGoogleAuth">
      <svg class="google-g-icon" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="auth-divider">or sign in with mobile / email</div>

    <div class="form-group" style="margin-bottom:12px">
      <label class="lbl">Customer / Contractor Name</label>
      <input class="form-control" id="shName" value="${esc(st.name || '')}" placeholder="e.g. Priyantha Silva">
    </div>
    <div class="form-group" style="margin-bottom:18px">
      <label class="lbl">Mobile or WhatsApp Number</label>
      <input class="form-control" id="shPh" value="${esc(st.phone || '')}" placeholder="077 222 2259">
    </div>

    <button class="btn btn-primary btn-block btn-lg" id="shDirectLogin" style="font-weight:700">
      Sign In Instantly →
    </button>
  </div>`);

  const box = $('.auth-modal-card', el);

  // Google Sign-In Handler
  $('#btnGoogleAuth', box).onclick = async () => {
    try {
      if (window.__firebaseReady && window.__fbSignInGoogle) {
        const u = await window.__fbSignInGoogle();
        st.token = u.accessToken || 'google_' + u.uid;
        st.name = u.displayName || 'Google Customer';
        st.phone = u.phoneNumber || st.phone || '';
        st.email = u.email || '';
        st.gUser = { uid: u.uid, displayName: u.displayName, email: u.email, photoURL: u.photoURL };
      } else {
        // Smooth one-click demo fallback if Firebase keys pending
        const gEmail = prompt('Enter your Google email for fast sign in:', st.email || 'contractor@gmail.com');
        if (!gEmail) return;
        const gName = gEmail.split('@')[0].replace(/[._]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
        st.token = 'demo_g_' + Date.now();
        st.name = gName;
        st.email = gEmail;
        st.gUser = { uid: 'usr_' + Date.now(), displayName: gName, email: gEmail, photoURL: '' };
      }
      ls.set('token', st.token);
      ls.set('name', st.name);
      ls.set('email', st.email);
      ls.set('phone', st.phone);
      ls.set('gUser', st.gUser);
      el.remove();
      notify('success', `Welcome, ${st.name}!`);
      render();
      if (then) then();
    } catch (err) {
      notify('danger', err.message || 'Google sign-in error');
    }
  };

  // Direct Mobile / Name Login Handler
  $('#shDirectLogin', box).onclick = () => {
    const nm = ($('#shName', box).value || '').trim() || 'Contractor Customer';
    const ph = ($('#shPh', box).value || '').trim();
    st.token = 'cust_' + Date.now();
    st.name = nm;
    st.phone = ph;
    ls.set('token', st.token);
    ls.set('name', nm);
    ls.set('phone', ph);
    el.remove();
    notify('success', `Welcome, ${nm}!`);
    render();
    if (then) then();
  };
}

async function loadCatalog() {
  try {
    st.cat = await api('/catalog');
    const live = await api('/catalog');
    if (live && live.products && live.products.length > 0) {
      st.cat = live;
      render();
    }
  } catch (e) {
    st.cat = {
      shop: { name: 'Regal Hardware' },
      settings: { open: true },
      categories: [
        { name: 'Power Tools', count: 18 },
        { name: 'Paints & Finishes', count: 32 },
        { name: 'Hand Tools', count: 26 },
        { name: 'Hardware & Fasteners', count: 48 },
        { name: 'Plumbing & PVC', count: 40 },
        { name: 'Safety & Tools', count: 20 },
        { name: 'House Construction', count: 35 }
      ],
      products: []
    };
    // Keep using DEFAULT_CATALOG seamlessly
  }
  if (!st.cat.products || st.cat.products.length === 0) {
    st.cat.products = DEFAULT_PRODUCTS;
  }
  if (!st.cat.categories || st.cat.categories.length === 0) {
    st.cat.categories = [
      { name: 'Power Tools', count: 18 },
      { name: 'Paints & Finishes', count: 32 },
      { name: 'Hand Tools', count: 26 },
      { name: 'Hardware & Fasteners', count: 48 },
      { name: 'Plumbing & PVC', count: 40 },
      { name: 'Safety & Tools', count: 20 },
      { name: 'House Construction', count: 35 }
    ];
  }
}

(async () => {
  st.route = parseRoute();
  render();
  await loadCatalog();
  render();
})();
