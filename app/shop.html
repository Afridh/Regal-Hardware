<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware</title>
<meta name="description" content="Regal Hardware — order cement, steel, pipes, paint and hardware online for delivery or collection.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23101E22'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' fill='%23F0A81E' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101E22;--ink2:#1B2E33;--steel:#5A6E72;--faint:#8C9CA0;--page:#EEF1F0;--panel:#F7F9F8;--line:#D8DEDD;--line2:#EAEEED;
 --yellow:#F0A81E;--rust:#C0442C;--blue:#16799B;--green:#1E8A5A;--tint-yellow:#FFF4DA;--tint-rust:#FBE4DE;--tint-green:#DCF1E7;--tint-blue:#DCEEF4;
 --r:8px;--shadow:0 1px 2px rgba(16,30,34,.05),0 6px 18px rgba(16,30,34,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
a{color:var(--blue)}
h1,h2{font-family:Archivo,sans-serif;letter-spacing:-.01em;margin:0 0 10px}
h2{font-size:19px}
.hide{display:none!important}

/* header */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--ink) 0%,var(--ink2) 60%,#16343A 100%);color:#fff;border-bottom:3px solid var(--yellow);box-shadow:0 2px 10px rgba(16,30,34,.25)}
.top-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:14px;height:56px}
.brand{font-family:Archivo,sans-serif;font-weight:800;font-size:19px;letter-spacing:.01em;white-space:nowrap}
.brand span{color:var(--yellow)}
.brand small{display:block;font:400 10.5px 'IBM Plex Sans',sans-serif;color:#9BB0AE;letter-spacing:.08em;margin-top:-2px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav button{background:none;border:0;color:#D7E0DF;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav button.on{background:rgba(240,168,30,.18);color:#fff;box-shadow:inset 0 -2px 0 var(--yellow)}
.nav i{font-style:normal;background:var(--yellow);color:var(--ink);font-size:11px;font-weight:700;border-radius:99px;padding:0 7px;line-height:18px}
.staff{color:#9BB0AE;font-size:12px;text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:5px 10px}
.staff:hover{color:#fff;border-color:#fff}
.who{font-size:12.5px;color:#D7E0DF;white-space:nowrap}
.who a{color:var(--yellow);text-decoration:none;margin-left:6px}

main{max-width:1180px;margin:0 auto;padding:18px 16px 80px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.muted{color:var(--steel);font-size:13px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:9px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--panel)}
.btn.tape{background:linear-gradient(180deg,#F7BB3C,#EFA412);border-color:#D08F09;color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 2px 6px rgba(240,168,30,.35)}
.btn.tape:hover{filter:brightness(1.04)}
.btn.big{width:100%;padding:14px;font-family:Archivo,sans-serif;font-size:16px;font-weight:800}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:12px;font-weight:600}
.tag.ok{background:var(--tint-green);color:#12613D}.tag.warn{background:var(--tint-yellow);color:#8A5D06}.tag.bad{background:var(--tint-rust);color:#9A2F1B}.tag.blue{background:var(--tint-blue);color:#0E5B76}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f label{font-size:12px;font-weight:700;color:var(--steel);letter-spacing:.04em;text-transform:uppercase}
input,select{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:10px 12px;width:100%;font-size:16px}
input:focus{outline:none;border-color:var(--yellow);box-shadow:0 0 0 3px rgba(240,168,30,.2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;z-index:50;max-width:90vw}

/* shop */
.hero{background:linear-gradient(135deg,var(--ink) 0%,#16323A 60%,#123A3F 100%);color:#fff;border-radius:calc(var(--r) + 4px);padding:22px 20px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end}
.hero b{font-family:Archivo,sans-serif;font-size:26px;letter-spacing:-.01em;display:block;line-height:1.1}
.hero b span{color:var(--yellow)}
.hero .muted{color:#B9C8C6;font-size:13.5px}
.hero .del{margin-left:auto;background:rgba(240,168,30,.15);border:1px solid rgba(240,168,30,.5);border-radius:var(--r);padding:8px 12px;font-size:13px}
.closed{background:var(--tint-yellow);border:1px solid var(--yellow);border-radius:var(--r);padding:14px;margin-bottom:14px}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:40px;height:48px;font-size:16px}
.search svg{position:absolute;left:13px;top:14px;width:20px;height:20px;color:var(--faint)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--steel)}
.chips button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.p{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow)}
.p .img{height:64px;border-radius:6px;background:linear-gradient(135deg,var(--tint-blue),var(--tint-green));display:flex;align-items:center;justify-content:center;font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:var(--ink2);letter-spacing:.04em}
.p .n{font-weight:700;font-size:15px;line-height:1.25;min-height:2.5em}
.p .c{font-size:12px;color:var(--faint)}
.p .pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.p .pr b{font-family:Archivo,sans-serif;font-size:19px;color:var(--rust)}
.p .pr s{color:var(--faint);font-size:12.5px}
.p .pr i{font-style:normal;font-size:11.5px;color:var(--green);font-weight:700}
.p .st{font-size:12px;color:var(--green);font-weight:600}
.p .st.out{color:var(--rust)}
.p .add{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.p .add input{width:64px;text-align:center;padding:8px 4px}
.p .add .btn{flex:1}

/* basket */
.bl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line2)}
.bl .n{flex:1;min-width:0}
.bl .n b{display:block}
.bl input{width:70px;text-align:center;padding:8px 4px}
.bl .amt{font-family:Archivo,sans-serif;font-weight:700;width:96px;text-align:right}
.bl .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:18px;padding:4px}
.sum{margin-top:12px}
.sum div{display:flex;justify-content:space-between;padding:4px 0}
.sum .tot{border-top:2px solid var(--ink);margin-top:6px;padding-top:8px;font-family:Archivo,sans-serif;font-size:20px;font-weight:800}
.chk{display:flex;gap:10px;align-items:center;cursor:pointer;padding:10px 0}
.chk input{width:20px;height:20px;margin:0}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start}
@media (max-width:820px){.two{grid-template-columns:1fr}}

/* orders */
.o{margin-bottom:12px}
.o .h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.o .h b{font-family:Archivo,sans-serif;font-size:16px}
.track{display:flex;gap:6px;margin:10px 0 6px}
.track i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.track i.on{background:var(--green)}
.track.bad i{background:var(--tint-rust)}
.o table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:6px}
.o td{padding:3px 0;border-bottom:1px solid var(--line2)}
.o td.n{text-align:right;white-space:nowrap}

/* ask */
.chat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;max-height:50vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.wc{max-width:80%;padding:8px 12px;border-radius:12px;font-size:14px}
.wc.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:3px}
.wc.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:3px}

/* sign-in sheet */
.sheet{position:fixed;inset:0;background:rgba(16,30,34,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet .box{background:#fff;width:100%;max-width:440px;border-radius:14px 14px 0 0;padding:20px 18px 26px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media (min-width:600px){.sheet{align-items:center;padding:16px}.sheet .box{border-radius:14px}}
.code input{letter-spacing:.35em;font-family:Archivo,sans-serif;font-size:24px;text-align:center}
.demo{background:var(--tint-yellow);border:1px dashed var(--yellow);border-radius:var(--r);padding:8px 10px;font-size:13px;margin:8px 0}

footer{border-top:1px solid var(--line);margin-top:30px;padding:18px 16px;color:var(--steel);font-size:13px;text-align:center}
footer a{color:var(--steel)}

/* phone-sized */
@media (max-width:640px){
 .top-in{gap:8px;height:52px}
 .brand{font-size:16px}.brand small{display:none}
 .nav button{padding:8px 8px;font-size:13px}
 .nav button span{display:none}
 .staff{display:none}
 .who{display:none}
 main{padding:12px 12px 90px}
 .pgrid{grid-template-columns:repeat(2,1fr);gap:8px}
 .p{padding:9px}.p .img{height:46px;font-size:18px}.p .n{font-size:13.5px}.p .pr b{font-size:17px}
 .p .add input{width:48px}
 .hero{padding:16px}.hero b{font-size:22px}.hero .del{margin-left:0}
 .fab{position:fixed;left:12px;right:12px;bottom:12px;z-index:30}
 .fab .btn{box-shadow:0 8px 24px rgba(0,0,0,.25)}
}
@media (min-width:641px){.fab{display:none}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">REGAL <span>HARDWARE</span><small id="domain">regalhw.lk</small></div>
  <nav class="nav">
    <button data-v="shop" class="on">🛠 <span>Shop</span></button>
    <button data-v="cart">🧺 <span>Basket</span> <i id="cartN" class="hide">0</i></button>
    <button data-v="mine">📦 <span>My orders</span></button>
    <button data-v="help">💬 <span>Ask us</span></button>
  </nav>
  <span class="who" id="who"></span>
  <a class="staff" id="staffLink" href="/pos" title="Regal Hardware staff: open the shop system">Staff sign in →</a>
</div></header>

<main id="main"></main>
<div class="fab" id="fab"></div>
<footer id="foot"></footer>

<script>
/* ======================= Regal Hardware — the shop site =======================
   Talks only to /api/shop/*.  Products, prices and stock are the shop's own; an
   order goes to the shop's till the moment it is placed.  The basket and the
   sign-in live in this browser. */
const API='/api/shop';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const money=n=>'Rs '+(+n||0).toLocaleString('en-LK',{minimumFractionDigits:2,maximumFractionDigits:2});
const fq=n=>(+n||0).toLocaleString('en-LK',{maximumFractionDigits:3});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get:(k,d)=>{try{const v=localStorage.getItem('rh_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem('rh_'+k,JSON.stringify(v))}catch(e){}}};

const st={view:'shop',cat:null,cart:ls.get('cart',[]),q:'',category:'all',deliver:ls.get('deliver',true),token:ls.get('token',''),name:ls.get('name',''),phone:ls.get('phone',''),me:null,chat:[],placed:null,busy:false};

let toastT; function toast(m){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';document.body.appendChild(t)} t.textContent=m; clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),2800) }
async function api(path,opts={}){
  const h={'Content-Type':'application/json'}; if(st.token) h.Authorization='Bearer '+st.token;
  const r=await fetch(API+path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  let j={}; try{ j=await r.json() }catch(e){}
  if(r.status===401&&st.token){ signOut(false) }
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
const P=id=>st.cat&&st.cat.products.find(p=>p.id===id);
const cartN=()=>st.cart.reduce((a,l)=>a+l.qty,0);
function totals(){ const w=st.cat?st.cat.settings:{delivery:0,freeOver:0}; const goods=st.cart.reduce((a,l)=>{const p=P(l.pid);return a+(p?l.qty*p.price:0)},0);
  const del=(st.deliver&&goods<w.freeOver)?w.delivery:0; return {goods,del,total:goods+del} }
function saveCart(){ ls.set('cart',st.cart); const n=cartN(); const b=$('#cartN'); b.textContent=n; b.classList.toggle('hide',!n) }
function addToCart(pid,qty){ const p=P(pid); if(!p) return; qty=+qty||1; if(qty<=0) return;
  const ex=st.cart.find(l=>l.pid===pid); if(ex) ex.qty+=qty; else st.cart.push({pid,qty});
  saveCart(); toast(`${p.name} — ${fq(qty)} ${p.unit} in the basket`); drawFab() }
function signOut(redraw=true){ st.token=''; st.name=''; st.me=null; ls.set('token',''); ls.set('name',''); drawWho(); if(redraw) render() }

/* ---------------- views ---------------- */
function render(){
  $$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view));
  const m=$('#main');
  if(!st.cat){ m.innerHTML='<div class="card muted">Loading the shop…</div>'; return }
  m.innerHTML=({shop,cart,mine,help})[st.view]();
  bind(); drawFab(); window.scrollTo({top:0});
}
function hero(){ const w=st.cat.settings, s=st.cat.shop;
  return `<div class="hero"><div><b>${esc(w.name.replace(/ Online$/,''))} <span>Online</span></b>
    <div class="muted">${esc(s.tags||'')}${s.tags&&w.hours?' · ':''}${esc(w.hours||'')}</div></div>
    <div class="del">🚚 Delivery ${money(w.delivery)} in town, <b>free over ${money(w.freeOver)}</b>${w.payNote?'<br>'+esc(w.payNote):''}</div></div>`;
}
function shop(){
  const w=st.cat.settings;
  if(!w.open) return hero()+`<div class="closed"><b>The shop is not taking online orders just now.</b><div class="muted">${esc(w.hours||'')}${st.cat.shop.phone?' · Call '+esc(st.cat.shop.phone):''}</div></div>`;
  const q=st.q.toLowerCase();
  const list=st.cat.products.filter(p=>(st.category==='all'||p.cat===st.category)&&(!q||p.name.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||String(p.num).includes(q)||(p.short||'').startsWith(q))&&(w.showOutOfStock||p.stock===null||p.stock>0));
  return hero()+`
   <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" value="${esc(st.q)}" placeholder="Search — cement, wire, paint…" autocomplete="off"></div>
   <div class="chips">${['all',...st.cat.categories].map(c=>`<button data-cat="${esc(c)}" class="${st.category===c?'on':''}">${c==='all'?'Everything':esc(c)}</button>`).join('')}</div>
   <div class="pgrid">${list.map(p=>{const save=p.mrp-p.price; return `<div class="p">
     <div class="img">${esc(p.name.slice(0,2).toUpperCase())}</div>
     <div class="n">${esc(p.name)}</div>
     <div class="c">${esc(p.code)} · per ${esc(p.unit)}</div>
     <div class="pr">${save>0?`<s>${money(p.mrp)}</s>`:''}<b>${money(p.price)}</b>${save>0?`<i>save ${money(save)}</i>`:''}</div>
     ${p.stock===null?'':`<div class="st ${p.stock>0?'':'out'}">${p.stock>0?`${fq(p.stock)} ${esc(p.unit)} in stock`:'out of stock — ask us'}</div>`}
     ${p.stock===null||p.stock>0?`<div class="add"><input type="number" min="1" step="any" value="1" data-q="${p.id}" inputmode="decimal"><button class="btn tape" data-add="${p.id}">Add</button></div>`
       :`<div class="add"><button class="btn" data-ask="${p.id}">Ask when it is back</button></div>`}
    </div>`}).join('')||'<div class="card muted">Nothing matches that.</div>'}</div>`;
}
function cart(){
  const t=totals(), w=st.cat.settings;
  if(st.placed){ const o=st.placed; return `<div class="card" style="text-align:center;padding:30px 16px">
     <div style="font-size:44px">✅</div><h2>Order ${esc(o.no)} is with the shop</h2>
     <div class="muted">${money(o.total)} · ${o.deliver?'we will bring it':'ready to collect'} · a text goes to ${esc(st.phone)} when it is confirmed.</div>
     ${o.short&&o.short.length?`<div class="tag warn" style="margin-top:10px">${esc(o.short.join(', '))} may be short — the shop will confirm</div>`:''}
     <div style="display:flex;gap:8px;justify-content:center;margin-top:18px;flex-wrap:wrap"><button class="btn tape" data-v="mine">Track it</button><button class="btn" data-v="shop" data-clearplaced="1">Keep shopping</button></div></div>` }
  if(!st.cart.length) return `<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px">🧺</div><h2>Your basket is empty</h2><button class="btn tape" data-v="shop">Go to the shop</button></div>`;
  return `<div class="two"><div class="card"><h2>Your basket</h2>
     ${st.cart.map((l,i)=>{const p=P(l.pid); if(!p) return ''; return `<div class="bl"><div class="n"><b>${esc(p.name)}</b><span class="muted">${money(p.price)} per ${esc(p.unit)}${p.stock!==null&&p.stock<l.qty?` · <span class="tag warn">only ${fq(p.stock)} in stock</span>`:''}</span></div>
       <input type="number" min="1" step="any" value="${l.qty}" data-cq="${i}" inputmode="decimal"><div class="amt">${money(l.qty*p.price)}</div><button class="x" data-cx="${i}" title="Take it out">✕</button></div>`}).join('')}
     <div class="sum"><div><span>Goods</span><b>${money(t.goods)}</b></div>
      <label class="chk"><input type="checkbox" id="deliver" ${st.deliver?'checked':''}> Deliver it — ${money(w.delivery)}, free over ${money(w.freeOver)}</label>
      ${t.del?`<div><span>Delivery</span><b>${money(t.del)}</b></div>`:''}
      <div class="tot"><span>To pay</span><b>${money(t.total)}</b></div>
      ${t.goods<w.minOrder?`<div class="tag warn" style="display:block;padding:8px 10px;margin-top:8px">Smallest online order is ${money(w.minOrder)}.</div>`:''}</div></div>
    <div class="card"><h2>${st.deliver?'Where to send it':'Who is collecting'}</h2>
     ${st.token?`<div class="muted" style="margin-bottom:8px">Ordering as <b>${esc(st.name)}</b> · ${esc(st.phone)} · <a href="#" id="notMe">not you?</a></div>`
       :`<div class="muted" style="margin-bottom:8px">We text a code to your mobile so we know it is you.</div>`}
     ${st.deliver?`<div class="f"><label>Delivery address</label><input id="addr" value="${esc(ls.get('addr',''))}" placeholder="e.g. 12 Temple Road, New Town — call on arrival"></div>`:''}
     <div class="f"><label>A note for the shop</label><input id="note" placeholder="optional — sizes, when you need it…"></div>
     <button class="btn tape big" id="place" ${t.goods>=w.minOrder?'':'disabled'}>${st.token?'Place the order':'Sign in & place the order'} · ${money(t.total)}</button>
     <div class="muted" style="margin-top:8px">Nothing is charged now. ${esc(w.payNote||'')}</div></div></div>`;
}
const stepOf=s=>({placed:1,accepted:2,picking:2,ready:3,despatched:3,done:4,collected:4})[s]||0;
const tagOf=s=>`<span class="tag ${['done','collected','despatched'].includes(s)?'ok':s==='rejected'||s==='cancelled'?'bad':'warn'}">${({placed:'with the shop',accepted:'being picked',picking:'being picked',ready:'ready',despatched:'on the way',done:'delivered',collected:'collected',rejected:'not accepted',cancelled:'cancelled'})[s]||esc(s)}</span>`;
const whereOf=o=>({placed:'The shop has it and will confirm shortly.',accepted:'Being picked at the shop.',picking:'Being picked at the shop.',ready:o.deliver?'Ready — the lorry will bring it.':'Ready to collect at the counter.',despatched:'On the way to you.',done:'Delivered. Thank you.',collected:'Collected. Thank you.',rejected:'The shop could not take this one'+(o.reason?' — '+esc(o.reason):'. Call us.'),cancelled:'Cancelled.'})[o.status]||'';
function mine(){
  if(!st.token) return `<div class="card" style="text-align:center;padding:30px"><div style="font-size:40px">📦</div><h2>Your orders</h2><div class="muted" style="margin-bottom:12px">Sign in with your mobile to see where your orders are and what you owe.</div><button class="btn tape" id="signin">Sign in with my mobile</button></div>`;
  if(!st.me) { loadMe(); return '<div class="card muted">Fetching your orders…</div>' }
  const me=st.me;
  return `<div class="two"><div>${me.orders.length?me.orders.map(o=>`<div class="card o">
     <div class="h"><div><b>${esc(o.no)}</b><div class="muted">${esc(o.date)} ${esc(o.time||'')} · ${o.lines.length} item${o.lines.length===1?'':'s'} · ${o.deliver?'delivery':'collect'}</div></div>
      <div style="text-align:right"><b style="font-family:Archivo">${money(o.total)}</b><div>${tagOf(o.status)}</div></div></div>
     <div class="track ${['rejected','cancelled'].includes(o.status)?'bad':''}">${[1,2,3,4].map(n=>`<i class="${stepOf(o.status)>=n?'on':''}"></i>`).join('')}</div>
     <div class="muted">${whereOf(o)}${o.invoice?` · billed as ${esc(o.invoice)}`:''}</div>
     <table>${o.lines.map(l=>{const p=P(l.pid);return `<tr><td>${esc(p?p.name:'Item '+l.pid)}</td><td class="n">${fq(l.qty)} × ${money(l.price)}</td><td class="n">${money(l.qty*l.price)}</td></tr>`}).join('')}</table></div>`).join('')
     :'<div class="card muted">No orders yet.</div>'}</div>
    <div class="card"><h2>${esc(me.name)}</h2><div class="muted">${esc(me.phone)}</div>
     ${me.known?`<div class="sum"><div><span>Outstanding with the shop</span><b>${money(me.owing)}</b></div><div><span>Bills</span><b>${me.bills}</b></div>${me.points?`<div><span>Loyalty points</span><b>${fq(me.points)}</b></div>`:''}</div>`:'<div class="muted" style="margin-top:8px">Your first order opens your account with the shop.</div>'}
     <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="refresh">Refresh</button><button class="btn" id="out">Sign out</button></div></div></div>`;
}
function help(){
  return `<div class="two"><div><h2>Ask us</h2><div class="muted" style="margin-bottom:8px">A price, whether we have it, delivery, where your order is, what you owe. Anything else — ${st.cat.shop.phone?'call '+esc(st.cat.shop.phone):'call the shop'}.</div>
    <div class="chat" id="chat">${st.chat.map(m=>`<div class="wc ${m.who}">${esc(m.text)}</div>`).join('')||'<div class="wc bot">Ask me something — “price of Tokyo cement”, “do you have 25mm pipe”, “where is my order”, “what do I owe”.</div>'}</div>
    <div style="display:flex;gap:6px;margin-top:8px"><input id="askQ" placeholder="Type your question…" autocomplete="off"><button class="btn tape" id="askGo">Ask</button></div></div>
   <div class="card"><h2>${esc(st.cat.shop.name)}</h2><div class="muted">${esc(st.cat.shop.addr||'')}</div>${st.cat.shop.phone?`<div style="margin-top:8px"><a class="btn" href="tel:${esc(st.cat.shop.phone)}">📞 ${esc(st.cat.shop.phone)}</a></div>`:''}<div class="muted" style="margin-top:10px">${esc(st.cat.settings.hours||'')}</div></div></div>`;
}
function drawFab(){ const f=$('#fab'); const n=cartN(); if(st.view==='shop'&&n){ f.innerHTML=`<button class="btn tape big" data-v="cart">Basket · ${n} item${n===1?'':'s'} · ${money(totals().total)}</button>`; bindNav(f) } else f.innerHTML='' }
function drawWho(){ $('#who').innerHTML=st.token?`${esc(st.name)}<a href="#" id="whoOut">sign out</a>`:''; const o=$('#whoOut'); if(o) o.onclick=e=>{e.preventDefault();signOut()} }
function bindNav(root){ $$('[data-v]',root).forEach(b=>b.onclick=()=>{ if(b.dataset.clearplaced) st.placed=null; st.view=b.dataset.v; render() }) }

function bind(){
  const m=$('#main'); bindNav(m);
  const q=$('#q'); if(q){ q.oninput=()=>{ st.q=q.value; const pos=q.selectionStart; render(); const q2=$('#q'); q2.focus(); q2.setSelectionRange(pos,pos) } }
  $$('[data-cat]',m).forEach(b=>b.onclick=()=>{st.category=b.dataset.cat;render()});
  $$('[data-add]',m).forEach(b=>b.onclick=()=>{ const id=+b.dataset.add; const inp=$(`[data-q="${id}"]`,m); addToCart(id,+inp.value||1); inp.value=1 });
  $$('[data-q]',m).forEach(i=>i.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $(`[data-add="${i.dataset.q}"]`,m).click() } });
  $$('[data-ask]',m).forEach(b=>b.onclick=()=>{ const p=P(+b.dataset.ask); st.view='help'; render(); ask(`Do you have ${p.name}?`) });
  $$('[data-cq]',m).forEach(i=>i.onchange=()=>{ const l=st.cart[+i.dataset.cq]; l.qty=Math.max(0,+i.value||0); if(!l.qty) st.cart.splice(+i.dataset.cq,1); saveCart(); render() });
  $$('[data-cx]',m).forEach(b=>b.onclick=()=>{ st.cart.splice(+b.dataset.cx,1); saveCart(); render() });
  const d=$('#deliver'); if(d) d.onchange=()=>{ st.deliver=d.checked; ls.set('deliver',st.deliver); render() };
  const pl=$('#place'); if(pl) pl.onclick=place;
  const nm=$('#notMe'); if(nm) nm.onclick=e=>{e.preventDefault();signOut()};
  const si=$('#signin'); if(si) si.onclick=()=>signIn(()=>{st.me=null;render()});
  const rf=$('#refresh'); if(rf) rf.onclick=()=>{st.me=null;render()};
  const out=$('#out'); if(out) out.onclick=()=>signOut();
  const ag=$('#askGo'), aq=$('#askQ'); if(ag){ ag.onclick=()=>{ const v=aq.value.trim(); if(v){ aq.value=''; ask(v) } }; aq.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();ag.click()} }; aq.focus() }
}

/* ---------------- doing things ---------------- */
async function loadMe(){ try{ st.me=await api('/me') }catch(e){ toast(e.message); st.me={name:st.name,phone:st.phone,orders:[],known:false,owing:0,bills:0} } if(st.view==='mine') render() }
async function ask(q){
  st.chat.push({who:'me',text:q}); render();
  try{ const j=await api('/ask',{method:'POST',body:{q}}); st.chat.push({who:'bot',text:j.answer}) }catch(e){ st.chat.push({who:'bot',text:'Sorry — '+e.message}) }
  render(); const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight;
}
async function place(){
  if(st.busy) return;
  if(!st.token) return signIn(place);
  const addr=($('#addr')||{}).value||'', note=($('#note')||{}).value||'';
  if(st.deliver&&!addr.trim()) return toast('Tell us where to send it');
  ls.set('addr',addr);
  st.busy=true; const b=$('#place'); if(b){b.disabled=true;b.textContent='Sending…'}
  try{
    const j=await api('/order',{method:'POST',body:{lines:st.cart,deliver:st.deliver,address:addr,note}});
    st.placed={...j,deliver:st.deliver}; st.cart=[]; saveCart(); st.me=null; render();
  }catch(e){ toast(e.message); render() }
  finally{ st.busy=false }
}
/* sign in: mobile → code by SMS → (name, first time) */
function signIn(then){
  const el=document.createElement('div'); el.className='sheet';
  let phone=st.phone||'', stage='phone', hint='';
  const draw=()=>{
    el.innerHTML=`<div class="box">
      <h2 style="margin-bottom:2px">${stage==='phone'?'Your mobile':stage==='code'?'The code we sent':'Your name'}</h2>
      <div class="muted" style="margin-bottom:12px">${stage==='phone'?'We text you a code — no password to remember.':stage==='code'?'Sent to '+esc(phone)+'. It works for 5 minutes.':'So the shop knows who the order is for.'}</div>
      ${stage==='phone'?`<div class="f"><label>Mobile</label><input id="shPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel"></div>`:''}
      ${stage==='code'?`${hint?`<div class="demo">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="f code"><label>Code</label><input id="shCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>`:''}
      ${stage==='name'?`<div class="f"><label>Name or shop</label><input id="shNm" placeholder="e.g. Nimal — or Nimal Constructions" autocomplete="name"></div>`:''}
      <div style="display:flex;gap:8px;margin-top:6px"><button class="btn" id="shX">Cancel</button><button class="btn tape" id="shGo" style="flex:1">${stage==='phone'?'Text me a code':stage==='code'?'Sign in':'Done'}</button></div>
      ${stage==='code'?'<div class="muted" style="margin-top:10px"><a href="#" id="shBack">Wrong number?</a></div>':''}
    </div>`;
    $('#shX',el).onclick=()=>el.remove();
    const bk=$('#shBack',el); if(bk) bk.onclick=e=>{e.preventDefault();stage='phone';draw()};
    const go=$('#shGo',el); go.onclick=step;
    const inp=$('input',el); inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();step()} };
  };
  let code='';
  const step=async()=>{
    const go=$('#shGo',el); go.disabled=true;
    try{
      if(stage==='phone'){ phone=$('#shPh',el).value.replace(/\D/g,''); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567');
        const j=await api('/otp',{method:'POST',body:{phone}}); hint=j.sent?'':j.code; stage='code'; return draw() }
      if(stage==='code'){ code=$('#shCode',el).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code');
        const j=await api('/login',{method:'POST',body:{phone,code}}); if(j.needName){ stage='name'; return draw() } return done(j) }
      if(stage==='name'){ const name=$('#shNm',el).value.trim(); if(!name) throw new Error('Enter a name');
        const j=await api('/login',{method:'POST',body:{phone,code,name}}); if(j.needName) throw new Error('Enter a name'); return done(j) }
    }catch(e){ toast(e.message); go.disabled=false }
  };
  const done=(j)=>{ st.token=j.token; st.name=j.name; st.phone=j.phone; ls.set('token',j.token); ls.set('name',j.name); ls.set('phone',j.phone); el.remove(); drawWho(); toast('Signed in as '+j.name); if(then) then() };
  document.body.appendChild(el); draw();
}

/* ---------------- boot ---------------- */
async function loadCatalog(){
  try{ st.cat=await api('/catalog'); }
  catch(e){ st.cat={shop:{name:'Regal Hardware'},settings:{open:false,name:'Regal Hardware Online',hours:'The site cannot reach the shop right now — '+e.message},categories:[],products:[]} }
  const w=st.cat.settings; document.title=(st.cat.shop.name||'Regal Hardware')+' — order online';
  $('#domain').textContent=w.domain||''; $('#staffLink').href=w.staffPath||'/pos';
  $('#foot').innerHTML=`${esc(st.cat.shop.name||'')}${st.cat.shop.addr?' · '+esc(st.cat.shop.addr):''}${st.cat.shop.phone?' · '+esc(st.cat.shop.phone):''}${w.hours?' · '+esc(w.hours):''}<br><a href="${esc(w.staffPath||'/pos')}">Staff sign in</a>`;
}
(async()=>{ drawWho(); saveCart(); render(); await loadCatalog(); render(); setInterval(async()=>{ const v=st.view; await loadCatalog(); if(v==='shop'&&document.activeElement!==$('#q')) render() },60000) })();
</script>
