<style>
/* ==========================================================================
   Regal Hardware — Modern Customer Storefront
   Clean, intuitive, high-performance UI designed for construction & retail
   ========================================================================== */
:root {
  --primary: #a32830;
  --hov-primary: #801c23;
  --soft-primary: rgba(163, 40, 48, 0.08);
  --secondary-base: #f59e0b;
  --hov-secondary-base: #d97706;
  --soft-secondary-base: rgba(245, 158, 11, 0.12);
  --blue: #2563eb;
  --hov-blue: #1d4ed8;
  --soft-blue: rgba(37, 99, 235, 0.08);
  --success: #10b981;
  --soft-success: rgba(16, 185, 129, 0.12);
  --warning: #f59e0b;
  --soft-warning: rgba(245, 158, 11, 0.12);
  --danger: #ef4444;
  --soft-danger: rgba(239, 68, 68, 0.1);
  --dark: #0f172a;
  --soft-dark: #1e293b;
  --gray: #64748b;
  --secondary: #64748b;
  --soft-secondary: rgba(100, 116, 139, 0.1);
  --light: #f1f5f9;
  --soft-light: #e2e8f0;
  --soft-white: #cbd5e1;
  --bg-body: #f8fafc;
  --bg-card: #ffffff;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;
  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.04);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  --container: 1240px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg-body);
  color: var(--dark);
  font-family: 'Plus Jakarta Sans', 'Public Sans', system-ui, -apple-system, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; transition: color 0.15s ease; }
a:hover { color: var(--hov-blue); }
button, input, select, textarea { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
h1, h2, h3, h4, h5, h6 { margin: 0; font-weight: 700; line-height: 1.25; color: var(--dark); letter-spacing: -0.015em; }
.container { max-width: var(--container); margin: 0 auto; padding: 0 20px; }
.hide { display: none !important; }

/* Utility typography & colors */
.text-primary { color: var(--primary) !important; }
.text-blue { color: var(--blue) !important; }
.text-gray { color: var(--gray) !important; }
.text-secondary { color: var(--secondary) !important; }
.text-dark { color: var(--dark) !important; }
.fw-500 { font-weight: 500; }
.fw-600 { font-weight: 600; }
.fw-700 { font-weight: 700; }
.fw-800 { font-weight: 800; }
.fs-11 { font-size: 11px; }
.fs-12 { font-size: 12px; }
.fs-13 { font-size: 13px; }
.fs-14 { font-size: 14px; }
.fs-15 { font-size: 15px; }
.fs-16 { font-size: 16px; }
.fs-18 { font-size: 18px; }
.fs-20 { font-size: 20px; }
.fs-24 { font-size: 24px; }
.opacity-75 { opacity: 0.75; }
.opacity-60 { opacity: 0.6; }
.opacity-50 { opacity: 0.5; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 1px solid transparent;
  padding: 10px 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  border-radius: var(--radius-md);
  background: #fff;
  transition: all 0.2s ease;
  line-height: 1.4;
  user-select: none;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 2px 8px rgba(163, 40, 48, 0.25); }
.btn-primary:hover { background: var(--hov-primary); border-color: var(--hov-primary); color: #fff; }
.btn-dark { background: var(--dark); color: #fff; border-color: var(--dark); }
.btn-dark:hover { background: var(--soft-dark); border-color: var(--soft-dark); color: #fff; }
.btn-soft-blue { background: var(--soft-blue); color: var(--blue); border-color: transparent; }
.btn-soft-blue:hover { background: var(--blue); color: #fff; }
.btn-soft-primary { background: var(--soft-primary); color: var(--primary); border-color: transparent; }
.btn-soft-primary:hover { background: var(--primary); color: #fff; }
.btn-light { background: var(--light); border-color: var(--soft-light); color: var(--dark); }
.btn-light:hover { background: #e2e8f0; }
.btn-outline { border-color: var(--soft-light); background: #fff; color: var(--dark); }
.btn-outline:hover { border-color: var(--dark); }
.btn-link { background: none; border-color: transparent; padding: 0; color: var(--blue); font-weight: 600; }
.btn-link:hover { text-decoration: underline; }
.btn-block { width: 100%; }
.btn-lg { padding: 14px 24px; font-size: 15px; border-radius: var(--radius-lg); }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: var(--radius-sm); }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none !important; }

/* Forms */
.form-control {
  width: 100%;
  border: 1.5px solid var(--soft-light);
  padding: 10px 14px;
  background: #fff;
  border-radius: var(--radius-md);
  font-size: 14px;
  outline: none;
  transition: all 0.2s ease;
  color: var(--dark);
}
.form-control:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--soft-primary);
}
textarea.form-control { min-height: 86px; resize: vertical; }
label.lbl { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--dark); }
.form-group { margin-bottom: 18px; }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  font-size: 11.5px;
  font-weight: 700;
  border-radius: var(--radius-full);
  line-height: 1.4;
  letter-spacing: 0.01em;
}
.badge-soft-success { background: var(--soft-success); color: #047857; }
.badge-soft-warning { background: var(--soft-warning); color: #b45309; }
.badge-soft-danger { background: var(--soft-danger); color: var(--primary); }
.badge-soft-blue { background: var(--soft-blue); color: var(--blue); }
.badge-soft-secondary { background: var(--soft-secondary); color: var(--secondary); }

/* Layout utilities */
.border { border: 1px solid var(--soft-light); }
.bg-light { background: var(--light); }
.bg-white { background: #fff; }
.row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
.col { padding: 0 8px; flex: 1 1 0; min-width: 0; }

/* Checkbox & Radio */
.aiz-checkbox { cursor: pointer; display: inline-flex; align-items: center; position: relative; user-select: none; }
.aiz-square-check {
  position: relative;
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--soft-white);
  border-radius: 4px;
  vertical-align: middle;
  margin-right: 10px;
  background: #fff;
  transition: all 0.15s ease;
  flex: none;
}
.aiz-checkbox input { position: absolute; opacity: 0; width: 0; height: 0; }
.aiz-checkbox input:checked + .aiz-square-check { background: var(--primary); border-color: var(--primary); }
.aiz-checkbox input:checked + .aiz-square-check:after {
  content: '';
  position: absolute;
  left: 5px;
  top: 2px;
  width: 5px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.aiz-radio {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  padding: 14px 16px;
  border: 1.5px solid var(--soft-light);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  background: #fff;
  transition: all 0.2s ease;
  user-select: none;
}
.aiz-radio input { accent-color: var(--primary); width: 18px; height: 18px; margin: 0; flex: none; }
.aiz-radio:hover { border-color: var(--soft-white); background: #fbfcfe; }
.aiz-radio.on { border-color: var(--primary); background: var(--soft-primary); box-shadow: 0 0 0 1px var(--primary); }

.text-truncate-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.section-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 0 16px;
}
.section-top h3 { font-size: 22px; font-weight: 700; color: var(--dark); letter-spacing: -0.02em; }
.section-top a {
  font-size: 13px;
  font-weight: 700;
  color: var(--primary);
  display: inline-flex;
  align-items: center;
  gap: 4px;
}
.section-top a:hover { color: var(--hov-primary); text-decoration: underline; }
section.sec { margin: 32px 0; }
svg.i { width: 16px; height: 16px; fill: currentColor; vertical-align: middle; flex: none; }

/* ==========================================================================
   Header & Navigation (Sleek Glassmorphic)
   ========================================================================== */
.top-navbar {
  background: var(--dark);
  color: #e2e8f0;
  font-size: 12px;
  height: 38px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.top-navbar .container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 100%;
}
.top-navbar a { color: #fff; opacity: 0.85; display: inline-flex; align-items: center; gap: 6px; }
.top-navbar a:hover { opacity: 1; color: var(--secondary-base); }
.top-navbar .tagline { opacity: 0.9; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.top-navbar .tagline .pulse {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #10b981;
  display: inline-block;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.4);
}

header.hdr {
  position: sticky;
  top: 0;
  z-index: 1020;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--soft-light);
  box-shadow: var(--shadow-sm);
  transition: all 0.2s ease;
}
.logo-bar .container {
  display: flex;
  align-items: center;
  height: 72px;
  gap: 20px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--dark);
  flex: none;
}
.logo img {
  height: 44px;
  max-width: 190px;
  object-fit: contain;
}
.logo .mark {
  width: 42px;
  height: 42px;
  background: var(--primary);
  color: #fff;
  font-weight: 800;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  letter-spacing: 0.02em;
  box-shadow: 0 3px 10px rgba(163, 40, 48, 0.3);
}
.logo b { font-size: 19px; font-weight: 800; line-height: 1.1; display: block; letter-spacing: -0.02em; }
.logo b span { color: var(--primary); }
.logo small { font-size: 10.5px; letter-spacing: 0.12em; color: var(--secondary); font-weight: 600; display: block; margin-top: 2px; text-transform: uppercase; }

/* Modern Search Box */
.search-wrap {
  flex: 1;
  position: relative;
  max-width: 620px;
  margin: 0 auto;
}
.search-input-box { position: relative; }
.search-input-box input {
  width: 100%;
  height: 44px;
  border: 1.5px solid var(--soft-light);
  border-radius: var(--radius-full);
  padding: 0 46px 0 20px;
  outline: none;
  font-size: 14px;
  background: #f8fafc;
  color: var(--dark);
  transition: all 0.2s ease;
}
.search-input-box input:focus {
  background: #fff;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--soft-primary);
}
.search-input-box svg {
  position: absolute;
  right: 16px;
  top: 12px;
  width: 20px;
  height: 20px;
  fill: var(--gray);
  pointer-events: none;
  transition: fill 0.2s ease;
}
.search-input-box input:focus ~ svg { fill: var(--primary); }

.typed-search-box {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(100% + 8px);
  background: #fff;
  border: 1px solid var(--soft-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  z-index: 1050;
  max-height: 420px;
  overflow: auto;
  padding: 8px 0;
}
.typed-search-box .hd {
  padding: 8px 16px 4px;
  font-size: 11px;
  font-weight: 700;
  color: var(--secondary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.typed-search-box a.sr {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  color: var(--dark);
  border-bottom: 1px solid #f8fafc;
  transition: background 0.15s ease;
}
.typed-search-box a.sr:hover { background: var(--light); }
.typed-search-box .sr .th { width: 42px; height: 42px; border-radius: var(--radius-sm); border: 1px solid var(--soft-light); flex: none; }
.typed-search-box .sr b { color: var(--primary); margin-left: auto; white-space: nowrap; font-size: 14px; font-weight: 700; }

/* Header Action Icons */
.hdr-icons {
  display: flex;
  align-items: center;
  gap: 16px;
  flex: none;
}
.hdr-icon {
  position: relative;
  color: var(--dark);
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--soft-light);
  background: #fff;
  cursor: pointer;
  transition: all 0.2s ease;
}
.hdr-icon:hover {
  border-color: var(--primary);
  color: var(--primary);
  box-shadow: var(--shadow-sm);
  transform: translateY(-1px);
}
.hdr-icon svg { width: 18px; height: 18px; }
.hdr-icon .cnt {
  position: absolute;
  top: -4px;
  right: -4px;
  background: var(--primary);
  color: #fff;
  border-radius: var(--radius-full);
  font-size: 10px;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 4px rgba(163, 40, 48, 0.4);
}

/* User Account Chip */
.nav-user {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  position: relative;
  flex: none;
  padding: 4px 6px 4px 4px;
  border-radius: var(--radius-full);
  border: 1px solid var(--soft-light);
  background: #fff;
  transition: all 0.2s ease;
}
.nav-user:hover { border-color: var(--soft-white); box-shadow: var(--shadow-sm); }
.nav-user .circle {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--light);
  color: var(--primary);
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  flex: none;
}
.nav-user .who { font-size: 12px; color: var(--secondary); padding-right: 8px; line-height: 1.2; }
.nav-user .who b { display: block; color: var(--dark); font-size: 13px; font-weight: 700; }
.user-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 8px);
  width: 220px;
  background: #fff;
  box-shadow: var(--shadow-xl);
  border-radius: var(--radius-lg);
  border: 1px solid var(--soft-light);
  display: none;
  z-index: 1050;
  overflow: hidden;
  animation: popIn 0.15s ease-out;
}
@keyframes popIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.nav-user:hover .user-menu, .nav-user.open .user-menu { display: block; }
.user-menu a {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  color: var(--dark);
  border-bottom: 1px solid var(--light);
  font-size: 13.5px;
  font-weight: 500;
  transition: background 0.15s ease;
}
.user-menu a:last-child { border-bottom: 0; }
.user-menu a:hover { background: var(--light); }
.user-menu a svg { color: var(--gray); }

/* Cart Pill Button */
.nav-cart-box {
  flex: none;
  background: var(--soft-primary);
  border: 1px solid rgba(163, 40, 48, 0.16);
  color: var(--primary);
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 16px;
  position: relative;
  cursor: pointer;
  transition: all 0.2s ease;
  user-select: none;
}
.nav-cart-box:hover {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
  box-shadow: 0 4px 12px rgba(163, 40, 48, 0.3);
}
.nav-cart-box .cart-icon { position: relative; display: flex; align-items: center; }
.nav-cart-box .cart-icon svg { width: 18px; height: 18px; }
.nav-cart-box .cart-icon i {
  position: absolute;
  top: -8px;
  right: -10px;
  background: var(--dark);
  color: #fff;
  font-style: normal;
  font-size: 10px;
  font-weight: 700;
  border-radius: var(--radius-full);
  min-width: 18px;
  height: 18px;
  padding: 0 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1.5px solid #fff;
}
.nav-cart-box:hover .cart-icon i { background: #fff; color: var(--primary); }
.nav-cart-box .txt { font-size: 12px; line-height: 1.2; text-align: left; }
.nav-cart-box .txt b { display: block; font-size: 13.5px; font-weight: 700; }

/* Mini-cart Dropdown */
.cart-dropdown {
  position: absolute;
  right: 0;
  top: calc(100% + 10px);
  width: 360px;
  background: #fff;
  color: var(--dark);
  border-radius: var(--radius-lg);
  border: 1px solid var(--soft-light);
  box-shadow: var(--shadow-xl);
  display: none;
  z-index: 1050;
  cursor: default;
  overflow: hidden;
  animation: popIn 0.2s ease-out;
}
.nav-cart-box:hover .cart-dropdown { display: block; }
.cart-dropdown .items { max-height: 310px; overflow: auto; }
.cart-dropdown .it {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--light);
  font-size: 13px;
}
.cart-dropdown .it .th { width: 44px; height: 44px; border-radius: var(--radius-sm); border: 1px solid var(--soft-light); flex: none; }
.cart-dropdown .it .nm { flex: 1; min-width: 0; text-align: left; }
.cart-dropdown .it .nm span { display: block; color: var(--secondary); font-size: 12px; margin-top: 2px; }
.cart-dropdown .it b { color: var(--primary); white-space: nowrap; font-size: 13.5px; }
.cart-dropdown .x { background: none; border: 0; color: var(--gray); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; }
.cart-dropdown .x:hover { color: var(--danger); background: var(--soft-danger); }
.cart-dropdown .sub { display: flex; justify-content: space-between; padding: 14px 16px; font-weight: 700; border-top: 1px solid var(--soft-light); background: #fbfcfe; font-size: 15px; }
.cart-dropdown .ft { padding: 12px 16px; display: flex; gap: 10px; background: #fff; border-top: 1px solid var(--light); }

/* Menu Bar */
.menu-bar {
  background: #fff;
  border-top: 1px solid var(--soft-light);
  height: 48px;
  position: relative;
}
.menu-bar .container { display: flex; align-items: stretch; height: 100%; }
.all-category {
  width: 260px;
  flex: none;
  background: var(--primary);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  cursor: pointer;
  user-select: none;
  border-top-left-radius: var(--radius-md);
  border-top-right-radius: var(--radius-md);
  margin-top: 4px;
  height: calc(100% - 4px);
  transition: background 0.15s ease;
}
.all-category:hover { background: var(--hov-primary); }
.all-category b { font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
.all-category span { font-size: 12px; opacity: 0.8; margin-left: 4px; font-weight: 400; }
.all-category svg { transition: transform 0.25s ease; }
.all-category.open svg { transform: rotate(180deg); }
.menu-links { display: flex; align-items: center; flex: 1; overflow-x: auto; scrollbar-width: none; margin-left: 12px; }
.menu-links::-webkit-scrollbar { display: none; }
.menu-links a {
  color: var(--dark);
  font-size: 13.5px;
  font-weight: 600;
  padding: 0 16px;
  height: 100%;
  display: flex;
  align-items: center;
  white-space: nowrap;
  transition: all 0.15s ease;
  position: relative;
}

/* Category Dropdown Menu */

}
.aiz-category-menu li a .cat-image { width: 20px; height: 20px; object-fit: cover; border-radius: 4px; }
.aiz-category-menu li a .cat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--soft-white); flex: none; }

/* ==========================================================================

   ========================================================================== */
.home-banner-area { margin: 20px 0 32px; }
.home-banner-area .container { display: flex; gap: 20px; position: relative; align-items: stretch; }

.home-slider {

}

.home-slider .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.home-slider .promo {

}

.home-slider .promo h2 {

}
.home-slider .promo p {

}

.home-slider .dots {

}

}

.home-slider .arr {

.home-slider .arr.r { right: 16px; }

/* Value Propositions / Trust Bar */
.trust-bar {

}
.trust-item {

}

.trust-item .icon-circle {

/* Featured Categories Grid */
.feat-cats {

}
.feat-cats .fc {

}

}

.feat-cats .fc h6 a { color: var(--dark); }
.feat-cats .fc h6 a:hover { color: var(--primary); }
.feat-cats .fc p { margin: 3px 0 0; font-size: 13px; }
.feat-cats .fc p a { color: var(--secondary); font-weight: 400; }
.feat-cats .fc p a:hover { color: var(--primary); }

/* Delivery Promo Band */
.delivery-band {
  background: linear-gradient(135deg, var(--dark) 0%, #1e1b2e 100%);
  color: #fff;
  border-radius: var(--radius-xl);
  padding: 36px 40px;

  box-shadow: var(--shadow-lg);

  overflow: hidden;
}

}

}

/* Banners Grid */
.banners { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.banners a { display: block; overflow: hidden; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.banners img { width: 100%; display: block; transition: transform 0.4s ease; }
.banners a:hover img { transform: scale(1.03); }

/* ==========================================================================
   Product Cards & Carousels
   ========================================================================== */
.aiz-carousel { position: relative; }
.aiz-carousel .track {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
  gap: 16px;
  padding: 4px 2px 14px;
  scroll-behavior: smooth;
}
.aiz-carousel .track::-webkit-scrollbar { display: none; }
.aiz-carousel .track > * {
  flex: 0 0 calc(20% - 13px);
  scroll-snap-align: start;
}
.aiz-carousel .arrow {
  position: absolute;
  top: calc(50% - 20px);
  transform: translateY(-50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #fff;
  border: 1px solid var(--soft-light);
  box-shadow: var(--shadow-md);
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--dark);
  transition: all 0.2s ease;
}
.aiz-carousel .arrow:hover { background: var(--primary); color: #fff; border-color: var(--primary); }
.aiz-carousel .arrow.l { left: -18px; }
.aiz-carousel .arrow.r { right: -18px; }

.pgrid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}
.pgrid.six, .pgrid.per6 { grid-template-columns: repeat(6, 1fr); }
.pgrid.per5 { grid-template-columns: repeat(5, 1fr); }

/* Modern Product Card Box */
.aiz-card-box {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--soft-light);
  border-radius: var(--radius-lg);

.aiz-card-box .pic {

/* Product Badges */

  font-size: 11px;

  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-xs);

}
.aiz-card-box .lbl {

}

.aiz-p-hov-icon a {
  display: flex;

}

.aiz-card-box .body {

  flex-direction: column;

}
.aiz-card-box h3 {

/* Add to Cart button inside product card */
.cart-btn {
  width: 100%;

  background: #fff;
  color: var(--dark);
  border-radius: var(--radius-md);

}

/* ==========================================================================
   Product Listing & Filter Sidebar
   ========================================================================== */
.listing { display: flex; gap: 24px; margin: 20px 0 48px; align-items: flex-start; }
.filter-side { width: 270px; flex: none; position: sticky; top: 90px; }

}

/* API and State Helpers */
function notify(kind, msg) {
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(() => t.remove(), 3400);
}
function loading(on) { $('#loader').classList.toggle('active', !!on); }
async function api(path, opts = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (st.token) h.Authorization = 'Bearer ' + st.token;
  const r = await fetch(API + path, { ...opts, headers: h, body: opts.body ? JSON.stringify(opts.body) : undefined });
  let j = {};
  try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && st.token && !/^\/(otp|login)/.test(path)) { signOut(false); }
  if (!r.ok) throw new Error(j.error || ('Request failed (' + r.status + ')'));
  return j;
}
const P = id => st.cat && st.cat.products.find(p => p.id === +id);
const cartN = () => st.cart.reduce((a, l) => a + l.qty, 0);
const selLines = () => st.cart.filter(l => l.sel !== false && P(l.pid));
function totals(lines = selLines()) {
  const w = st.cat ? st.cat.settings : { delivery: 0, freeOver: 0 };
  const goods = lines.reduce((a, l) => {
    const p = P(l.pid);
    return a + (p ? l.qty * priceFor(p, l.qty) : 0);
  }, 0);
  const del = (st.deliver && goods < w.freeOver && goods > 0) ? w.delivery : 0;
  return { goods, del, total: goods + del, n: lines.length };
}
function priceFor(p, qty) {
  if (p.tiers && p.tiers.length) {
    const t = p.tiers.filter(t => qty >= t.min).sort((a, b) => b.min - a.min)[0];
    if (t) return t.price;
  }
  return p.price;
}
const discPct = p => p.mrp > p.price ? Math.round((p.mrp - p.price) / p.mrp * 100) : 0;
function saveCart() { ls.set('cart', st.cart.map(({ pid, qty, sel }) => ({ pid, qty, sel }))); }
function addToCart(pid, qty = 1, quiet) {
  const p = P(pid);
  if (!p) return;
  qty = +qty || 1;
  if (qty <= 0) return;
  if (p.stock !== null && p.stock <= 0) return notify('warning', p.name + ' is out of stock just now');
  const ex = st.cart.find(l => l.pid === pid);
  if (ex) { ex.qty += qty; ex.sel = true; } else st.cart.push({ pid, qty, sel: true });
  saveCart();
  if (!quiet) notify('success', `${p.name} added to cart`);
  drawHeaderBits();
}
function toggleWish(pid) {
  const i = st.wish.indexOf(pid);
  if (i >= 0) {
    st.wish.splice(i, 1);
    notify('warning', 'Removed from your wishlist');
  } else {
    st.wish.push(pid);
    notify('success', 'Added to your wishlist');
  }
  ls.set('wish', st.wish);
  drawHeaderBits();
  $$(`[data-wish="${pid}"]`).forEach(a => a.classList.toggle('on', st.wish.includes(pid)));
}
function signOut(redraw = true) {
  st.token = '';
  st.name = '';
  st.me = null;
  ls.set('token', '');
  ls.set('name', '');
  if (redraw) { notify('success', 'Signed out'); go(''); }
}
const hue = s => {
  let h = 0;
  for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360;
  return h;
};
function thumb(p, small) {
  if (p.img) return `<div class="th"><img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy"></div>`;
  const h = hue(p.cat || p.name);
  return `<div class="th"><div class="ph ${small ? 'sm' : ''}" style="background:linear-gradient(135deg,hsl(${h} 45% 55%),hsl(${(h + 40) % 360} 50% 40%))">${esc(initials(p.name) || initials(p.cat) || 'RH')}</div></div>`;
}
const initials = s => String(s || '').split(/\s+/).filter(w => /^[A-Za-z]/.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function catThumb(c) {
  if (c.img) return `<div class="th"><img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy"></div>`;
  const h = hue(c.name);
  return `<div class="th"><div class="ph" style="background:linear-gradient(135deg,hsl(${h} 40% 92%),hsl(${(h + 30) % 360} 40% 80%));color:hsl(${h} 40% 35%);font-size:22px">${esc(c.name.slice(0, 2).toUpperCase())}</div></div>`;
}

/* Routing */
function parseRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const q = {};
  (qs || '').split('&').filter(Boolean).forEach(kv => {
    const [k, v] = kv.split('=');
    q[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  const parts = path.split('/').filter(Boolean);
  return { path, parts, q };
}
function go(path, q) {
  const qs = q ? Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '';
  location.hash = '#/' + path + (qs ? '?' + qs : '');
}
const url = (path, q) => '#/' + path + (q ? '?' + Object.entries(q).filter(([, v]) => v !== '' && v != null).map(([k, v]) => encodeURIComponent(k) + '=' + encodeURIComponent(v)).join('&') : '');
window.addEventListener('hashchange', () => {
  st.route = parseRoute();
  st.catOpen = false;
  st.drawer = false;
  render();
  window.scrollTo({ top: 0 });
});

function listing() {
  const q = st.route.q, w = st.cat.settings, kw = (q.q || '').toLowerCase().trim(), cat = q.cat || '', sort = q.sort || '', page = Math.max(1, +q.page || 1), min = +q.min || 0, max = +q.max || 0, avail = q.avail || '';
  const hit = p => !kw || p.name.toLowerCase().includes(kw) || p.code.toLowerCase().includes(kw) || String(p.num).includes(kw) || (p.short || '').toLowerCase().startsWith(kw) || (p.cat || '').toLowerCase().includes(kw);
  let list = st.cat.products.filter(p => (w.showOutOfStock || p.stock === null || p.stock > 0) && (!cat || p.cat === cat) && hit(p) && (!min || p.price >= min) && (!max || p.price <= max) && (!avail || (avail === 'in' ? (p.stock === null || p.stock > 0) : (p.stock !== null && p.stock <= 0))));
  if (kw) list.sort((a, b) => { const ax = a.name.toLowerCase().startsWith(kw) ? 0 : 1, bx = b.name.toLowerCase().startsWith(kw) ? 0 : 1; return ax - bx || b.sold - a.sold; });
  if (sort === 'newest') list.sort((a, b) => b.id - a.id);
  else if (sort === 'oldest') list.sort((a, b) => a.id - b.id);
  else if (sort === 'price-asc') list.sort((a, b) => a.price - b.price);
  else if (sort === 'price-desc') list.sort((a, b) => b.price - a.price);
  else if (sort === 'best') list.sort((a, b) => b.sold - a.sold);

  const per = 24, pages = Math.max(1, Math.ceil(list.length / per)), pg = Math.min(page, pages), show = list.slice((pg - 1) * per, pg * per);
  const counts = {}; let allN = 0;
  st.cat.products.filter(hit).forEach(p => { counts[p.cat] = (counts[p.cat] || 0) + 1; allN++; });
  const sideCats = st.cat.categories.filter(c => counts[c.name] || c.name === cat);
  const link = (o) => url('search', { ...q, page: '', ...o });
  const pager = () => {
    if (pages <= 1) return '';
    const btns = [];
    const push = (n) => btns.push(`<button data-page="${n}" class="${n === pg ? 'on' : ''}">${n}</button>`);
    btns.push(`<button data-page="${pg - 1}" ${pg === 1 ? 'disabled' : ''}>‹</button>`);
    for (let n = 1; n <= pages; n++) {
      if (n === 1 || n === pages || Math.abs(n - pg) <= 2) push(n);
      else if (Math.abs(n - pg) === 3) btns.push('<button disabled>…</button>');
    }
    btns.push(`<button data-page="${pg + 1}" ${pg === pages ? 'disabled' : ''}>›</button>`);
    return `<div class="pagination">${btns.join('')}</div>`;
  };

  return `<div class="container"><div class="listing">
    <aside class="filter-side" id="filterSide">
      <div class="filter-box">
        <div class="fh">Categories ${I.down}</div>
        <div class="fb"><ul>
          <li><a href="${link({ cat: '' })}" class="${!cat ? 'on' : ''}">All categories <span>${allN}</span></a></li>
          ${sideCats.map(c => `<li><a href="${link({ cat: c.name })}" class="${cat === c.name ? 'on' : ''}">${esc(c.name)} <span>${counts[c.name] || 0}</span></a></li>`).join('')}
        </ul></div>
      </div>
      <div class="filter-box">
        <div class="fh">Price Range ${I.down}</div>
        <div class="fb">
          <div class="range">
            <input class="form-control" type="number" id="fmin" placeholder="Min" value="${min || ''}">
            <span>—</span>
            <input class="form-control" type="number" id="fmax" placeholder="Max" value="${max || ''}">
          </div>
          <button class="btn btn-dark btn-sm btn-block" id="fapply" style="margin-top:12px">Apply Filter</button>
        </div>
      </div>
      ${w.tracked ? `<div class="filter-box"><div class="fh">Stock Availability ${I.down}</div><div class="fb"><ul><li><a href="${link({ avail: '' })}" class="${!avail ? 'on' : ''}">All Items</a></li><li><a href="${link({ avail: 'in' })}" class="${avail === 'in' ? 'on' : ''}">In Stock</a></li><li><a href="${link({ avail: 'out' })}" class="${avail === 'out' ? 'on' : ''}">Out of Stock</a></li></ul></div></div>` : ''}
    </aside>
    <div style="flex:1;min-width:0">
      <ul class="breadcrumb"><li><a href="#/">Home</a></li>${I.right}<li><a href="#/search">All Products</a></li>${cat ? `${I.right}<li><b>"${esc(cat)}"</b></li>` : ''}</ul>
      <div class="listing-head">
        <div>
          <h1>${kw ? `Search results for "${esc(q.q)}"` : (cat ? esc(cat) : 'All Products')}</h1>
          <div class="cnt"><b>${list.length}</b> product${list.length === 1 ? '' : 's'} available</div>
        </div>
        <button class="btn btn-light btn-sm filter-thumb" id="filterOpen">${I.filter} Filters</button>
        <select id="sortSel">
          <option value="">Sort by: Featured</option>
          ${[['best', 'Best selling'], ['newest', 'Newest arrivals'], ['oldest', 'Oldest'], ['price-asc', 'Price: low to high'], ['price-desc', 'Price: high to low']].map(o => `<option value="${o[0]}" ${sort === o[0] ? 'selected' : ''}>${o[1]}</option>`).join('')}
        </select>
        <div class="col-btns">
          ${[3, 4, 6].map(n => `<button data-cols="${n}" class="${(st.cols || 4) === n ? 'on' : ''}" title="${n} columns">${'<i></i>'.repeat(n)}</button>`).join('')}
        </div>
      </div>
      <div class="pgrid ${(st.cols || 4) === 6 ? 'six' : ''}" style="${(st.cols || 4) === 3 ? 'grid-template-columns:repeat(3,1fr)' : ''}" id="products-row">
        ${show.map(productBox).join('') || '<div style="grid-column:1/-1;padding:60px 20px;text-align:center;color:var(--secondary);background:#fff;border-radius:var(--radius-xl);border:1px solid var(--soft-light)"><div style="font-size:36px;margin-bottom:10px">🔍</div><b>No products match your criteria</b><p style="margin:6px 0 0">Try searching with a broader keyword or resetting your filters.</p></div>'}
      </div>
      ${pager()}
    </div>
  </div></div>`;
}

/* Account & History */
const stepOf = s => ({ placed: 1, accepted: 2, picking: 2, ready: 3, despatched: 3, done: 4, collected: 4, invoiced: 4 })[s] || 0;
const statusOf = s => ({ placed: 'Pending Verification', accepted: 'Being Picked', picking: 'Being Picked', ready: 'Ready', despatched: 'Out for Delivery', done: 'Delivered', collected: 'Collected', invoiced: 'Billed', rejected: 'Declined', cancelled: 'Cancelled' })[s] || s;
const badgeOf = s => `<span class="badge ${['done', 'collected', 'despatched', 'invoiced'].includes(s) ? 'badge-soft-success' : s === 'rejected' || s === 'cancelled' ? 'badge-soft-danger' : s === 'placed' ? 'badge-soft-warning' : 'badge-soft-blue'}">${statusOf(s)}</span>`;
const whereOf = o => ({ placed: 'Order received. Store team will confirm shortly.', accepted: 'Being picked at the warehouse.', picking: 'Being picked at the warehouse.', ready: o.deliver ? 'Ready — our delivery truck will bring it.' : 'Ready for collection at the counter.', despatched: 'On the way to your delivery address.', done: 'Delivered successfully. Thank you!', collected: 'Collected at counter. Thank you!', invoiced: 'Invoiced' + (o.invoice ? ' as ' + o.invoice : '') + '. Thank you!', rejected: 'Store could not accept this order' + (o.reason ? ' — ' + o.reason : '. Please contact helpline.'), cancelled: 'Order cancelled.' })[o.status] || '';

function sideNav(tab) {
  const me = st.me || { name: st.name, phone: st.phone };
  const items = [['account', 'Dashboard', I.home], ['account/orders', 'Purchase History', I.list], ['account/wishlist', 'My Wishlist', I.heartO]];
  return `<aside class="aiz-user-sidenav">
    <div class="me">
      <div class="avatar">${esc((me.name || '?').slice(0, 1).toUpperCase())}</div>
      <h4>${esc(me.name || '')}</h4>
      <div>${esc(me.phone || '')}</div>
    </div>
    ${items.map(i => `<a class="aiz-side-nav-link ${tab === i[0] ? 'on' : ''}" href="#/${i[0]}">${i[2]}<span>${i[1]}</span>${i[0] === 'account/wishlist' && st.wish.length ? `<span class="badge badge-soft-danger">${st.wish.length}</span>` : ''}</a>`).join('')}
    <a class="aiz-side-nav-link" href="#" data-logout>${I.out}<span>Sign Out</span></a>
  </aside>`;
}

        <div><div class="ic" style="background:var(--primary)">${I.cart}</div><div><b>${pad2(st.cart.length)}</b><span>Products in Cart</span></div></div>
        <div><div class="ic" style="background:var(--blue)">${I.heartO}</div><div><b>${pad2(st.wish.length)}</b><span>Products in Wishlist</span></div></div>
        <div><div class="ic" style="background:var(--success)">${I.box}</div><div><b>${pad2(me.orders.length)}</b><span>Orders Placed</span></div></div>
      </div>

        <h6>Default Delivery Address</h6>
        ${(me.address || ls.get('addr', '')) ? `<p><b>Address:</b> ${esc(me.address || ls.get('addr', ''))}</p><p><b>Phone:</b> ${esc(me.phone)}</p>` : '<p class="text-secondary">No default address recorded yet.</p>'}

    </div>`;
  }
  return `<div class="container"><div class="panel">${sideNav(tab)}<div class="aiz-user-panel">${body}</div></div></div>`;
}

/* ==========================================================================
   Render & DOM Binding
   ========================================================================== */
function render() {
  const app = $('#app');
  if (!st.cat) {
    app.innerHTML = '<div style="padding:100px 20px;text-align:center;color:var(--secondary)"><div class="dot-loader" style="justify-content:center;margin-bottom:14px"><i></i><i></i><i></i></div><b>Connecting to Regal Hardware...</b></div>';
    return;
  }
  const v = st.route.parts[0] || '';
  const page = ({ '': home, search: listing, categories: categoriesPage, product: productPage, cart: cartPage, checkout: checkout, done: donePage, account: accountPage, track: trackPage, contact: contactPage })[v] || home;
  const waNo = (st.cat.settings.whatsapp || '').replace(/\D/g, '').replace(/^0/, '94');

  app.innerHTML = header() + `<main>${page()}</main>` + footer() + drawer() + `<div class="mob-cart" id="mobCart">${mobCart()}</div>`
    + (waNo ? `<a class="wa-float" href="https://wa.me/${waNo}?text=${encodeURIComponent('Hi ' + (st.cat.shop.name || 'Regal Hardware') + ', I would like to enquire about ')}" target="_blank" rel="noopener" title="WhatsApp Customer Support">${I.wa}<span>Chat with us</span></a>` : '');
  bind();
}

function bind() {
  const root = $('#app');
  // Authentication triggers
  $$('[data-login]', root).forEach(a => a.onclick = e => { e.preventDefault(); signIn(() => { st.me = null; render(); }); });
  $$('[data-logout]', root).forEach(a => a.onclick = e => { e.preventDefault(); signOut(); });

  // Categories Dropdown
  const cb = $('#catBtn');
  if (cb) cb.onclick = () => {
    st.catOpen = !st.catOpen;
    $('#catMenu').classList.toggle('show', st.catOpen);
    cb.classList.toggle('open', st.catOpen);
  };
  document.onclick = e => {
    if (st.catOpen && !e.target.closest('#catBtn') && !e.target.closest('#catMenu')) {
      st.catOpen = false;
      $('#catMenu')?.classList.remove('show');
      $('#catBtn')?.classList.remove('open');
    }
    if (!e.target.closest('.search-wrap')) $('#typed')?.classList.add('hide');
    if (!e.target.closest('#navUser')) $('#navUser')?.classList.remove('open');
  };

  const nu = $('#navUser');
  if (nu && st.token) nu.querySelector('.circle').onclick = () => nu.classList.toggle('open');

  // Mobile drawer & search toggles
  $$('[data-drawer]', root).forEach(b => b.onclick = () => { st.drawer = true; $('#drawer').classList.add('show'); });
  $$('[data-drawerclose]', root).forEach(b => b.onclick = () => { st.drawer = false; $('#drawer').classList.remove('show'); });
  $$('[data-mobsearch]', root).forEach(b => b.onclick = () => {
    st.mobSearch = !st.mobSearch;
    $('.search-wrap').classList.toggle('show', st.mobSearch);
    if (st.mobSearch) $('#search').focus();
  });

  // Search input with live autocomplete
  const s = $('#search');
  if (s) {
    s.oninput = () => typed(s.value);
    s.onfocus = () => { if (s.value) typed(s.value); };
    s.onkeydown = e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        $('#typed').classList.add('hide');
        go('search', { q: s.value.trim() });
      }
    };
  }

  // Product card & detail actions
  $$('[data-add]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    const q = b.dataset.qtyfrom ? +$('#' + b.dataset.qtyfrom).value || 1 : 1;
    addToCart(+b.dataset.add, q);
  });
  $$('[data-buynow]', root).forEach(b => b.onclick = () => {
    addToCart(+b.dataset.buynow, +$('#pdQty').value || 1, true);
    go('checkout');
  });
  $$('[data-wish]', root).forEach(a => a.onclick = e => {
    e.preventDefault();
    toggleWish(+a.dataset.wish);
    if ((st.route.parts[0] || '') === 'account') render();
  });
  $$('[data-cartrm]', root).forEach(b => b.onclick = e => {
    e.preventDefault();
    e.stopPropagation();
    st.cart = st.cart.filter(l => l.pid !== +b.dataset.cartrm);
    saveCart();
    notify('danger', 'Item removed from cart');
    if (['cart', 'checkout'].includes(st.route.parts[0])) render();
    else drawHeaderBits();
  });
  $$('[data-scroll]', root).forEach(b => b.onclick = () => {
    const t = $('#' + b.dataset.scroll + ' .track');
    t.scrollBy({ left: t.clientWidth * 0.8 * +b.dataset.dir });
  });
  $$('[data-slide]', root).forEach(b => b.onclick = () => slideTo(st.slide + +b.dataset.slide));
  $$('[data-slideto]', root).forEach(b => b.onclick = () => slideTo(+b.dataset.slideto));
  $$('[data-copy]', root).forEach(b => b.onclick = () => {
    navigator.clipboard?.writeText(b.dataset.copy);
    notify('success', 'SKU copied to clipboard');
  });
  $$('[data-share]', root).forEach(b => b.onclick = () => {
    if (navigator.share) navigator.share({ title: document.title, url: location.href });
    else { navigator.clipboard?.writeText(location.href); notify('success', 'Product link copied to clipboard'); }
  });
  $$('[data-askback]', root).forEach(a => a.onclick = e => {
    e.preventDefault();
    const p = P(+a.dataset.askback);
    go('contact');
    setTimeout(() => ask(`Do you have ${p.name}?`), 50);
  });

  // Listing page actions
  const fo = $('#filterOpen');
  if (fo) fo.onclick = () => {
    $('#filterSide').classList.add('show');
    const ov = document.createElement('div');
    ov.className = 'side-drawer show';
    ov.innerHTML = '<div class="ov"></div>';
    ov.style.zIndex = 1055;
    ov.onclick = () => { ov.remove(); $('#filterSide').classList.remove('show'); };
    document.body.appendChild(ov);
  };
  const fa = $('#fapply');
  if (fa) fa.onclick = () => go('search', { ...st.route.q, min: $('#fmin').value, max: $('#fmax').value, page: '' });
  const ss = $('#sortSel');
  if (ss) ss.onchange = () => go('search', { ...st.route.q, sort: ss.value, page: '' });
  $$('[data-cols]', root).forEach(b => b.onclick = () => { st.cols = +b.dataset.cols; render(); });
  $$('[data-page]', root).forEach(b => b.onclick = () => go('search', { ...st.route.q, page: b.dataset.page }));

  // Product detail page
  $$('[data-qty]', root).forEach(b => b.onclick = () => {
    const i = $('#pdQty');
    i.value = Math.max(1, (+i.value || 1) + +b.dataset.qty);
    i.dispatchEvent(new Event('input'));
  });
  const pq = $('#pdQty');
  if (pq) pq.oninput = () => {
    st.pdQty = Math.max(1, +pq.value || 1);
    const p = P(st.route.parts[1]);
    $('.pd .tot').textContent = money(priceFor(p, st.pdQty) * st.pdQty);
    const c = $('#addCnt');
    if (c) c.textContent = '(' + pad2(st.pdQty) + ')';
  };
  $$('[data-pdtab]', root).forEach(b => b.onclick = () => {
    st.pdTab = b.dataset.pdtab;
    render();
    window.scrollTo({ top: $('.pd-tabs').offsetTop - 110 });
  });

  // Cart page actions
  const sa = $('#selAll');
  if (sa) sa.onchange = () => { st.cart.forEach(l => l.sel = sa.checked); saveCart(); render(); };
  $$('[data-sel]', root).forEach(c => c.onchange = () => {
    const l = st.cart.find(x => x.pid === +c.dataset.sel);
    if (l) l.sel = c.checked;
    saveCart();
    render();
  });
  $$('[data-cq]', root).forEach(b => b.onclick = () => {
    const l = st.cart.find(x => x.pid === +b.dataset.cq);
    l.qty = Math.max(1, l.qty + +b.dataset.d);
    saveCart();
    render();
  });
  $$('[data-cqin]', root).forEach(i => i.onchange = () => {
    const l = st.cart.find(x => x.pid === +i.dataset.cqin);
    l.qty = Math.max(1, +i.value || 1);
    saveCart();
    render();
  });

  // Checkout page actions
  $$('input[name=dl]', root).forEach(r => r.onchange = () => { st.deliver = r.value === '1'; ls.set('deliver', st.deliver); render(); });
  $$('input[name=pay]', root).forEach(r => r.onchange = () => { st.pay = r.value; ls.set('pay', st.pay); render(); });
  const ag = $('#agree'); if (ag) ag.onchange = () => { st.agree = ag.checked; };
  const pl = $('#place'); if (pl) pl.onclick = place;
  $$('.acc-card .ah', root).forEach(h => h.onclick = () => {
    const b = h.nextElementSibling;
    b.style.display = b.style.display === 'none' ? '' : 'none';
  });

  // Account actions
  $$('[data-ordtab]', root).forEach(b => b.onclick = () => { st.ordTab = b.dataset.ordtab; render(); });
  $$('[data-order]', root).forEach(b => b.onclick = () => {
    const o = (st.me?.orders || []).find(x => x.no === b.dataset.order);
    if (o) modal(orderDetail(o));
  });
  $$('[data-editaddr]', root).forEach(b => b.onclick = () => {
    const el = modal(`<div class="modal"><button class="close" data-close title="Close">✕</button><div class="mb"><h2 class="fs-20">Delivery Address</h2><div class="lead">Used for site and home consignment deliveries.</div><input class="form-control" id="adr" value="${esc(ls.get('addr', '') || st.me?.address || '')}" placeholder="e.g. No. 45, Temple Road, Vavuniya"><button class="btn btn-primary btn-block btn-lg" style="margin-top:16px" id="adrOk">Save Address</button></div></div>`);
    $('#adrOk', el).onclick = () => { ls.set('addr', $('#adr', el).value.trim()); el.remove(); render(); };
  });

  // Tracking and Contact
  const tg = $('#trackGo');
  if (tg) {
    tg.onclick = async () => {
      tg.disabled = true;
      try {
        const j = await api('/track', { method: 'POST', body: { no: $('#tno').value.trim(), phone: $('#tph').value.trim() } });
        st.trackRes = j.order;
        render();
      } catch (e) { notify('danger', e.message); }
      tg.disabled = false;
    };
    $('#tph').onkeydown = $('#tno').onkeydown = e => { if (e.key === 'Enter') tg.click(); };
  }
  const agk = $('#askGo'), aq = $('#askQ');
  if (agk) {
    agk.onclick = () => {
      const v = aq.value.trim();
      if (v) { aq.value = ''; ask(v); }
    };
    aq.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); agk.click(); } };
    const c = $('#chat');
    if (c) c.scrollTop = c.scrollHeight;
  }
  document.title = (st.cat.shop.name || 'Regal Hardware') + (st.route.parts[0] === 'product' && P(st.route.parts[1]) ? ' — ' + P(st.route.parts[1]).name : ' — Order Online');
}

let typedT;
function typed(v) {
  clearTimeout(typedT);
  const box = $('#typed');
  const kw = v.toLowerCase().trim();
  if (!kw) { box.classList.add('hide'); return; }
  typedT = setTimeout(() => {
    const hits = st.cat.products.filter(p => p.name.toLowerCase().includes(kw) || p.code.toLowerCase().includes(kw) || (p.short || '').toLowerCase().startsWith(kw)).sort((a, b) => (a.name.toLowerCase().startsWith(kw) ? 0 : 1) - (b.name.toLowerCase().startsWith(kw) ? 0 : 1) || b.sold - a.sold).slice(0, 8);
    const cats = st.cat.categories.filter(c => c.name.toLowerCase().includes(kw)).slice(0, 3);
    box.innerHTML = (cats.length ? `<div class="hd">Categories</div>${cats.map(c => `<a class="sr" href="${url('search', { cat: c.name })}">${esc(c.name)}<b>${c.count} items</b></a>`).join('')}` : '')
      + (hits.length ? `<div class="hd">Products</div>${hits.map(p => `<a class="sr" href="${url('product/' + p.id)}">${thumb(p, true)}<span class="text-truncate-2">${esc(p.name)}</span><b>${money(p.price)}</b></a>`).join('')}<a class="sr" href="${url('search', { q: v.trim() })}" style="justify-content:center;color:var(--primary);font-weight:700">View all results for “${esc(v.trim())}” →</a>` : `<div style="padding:20px;text-align:center;color:var(--secondary)">No results found for “${esc(v)}”</div>`);
    box.classList.remove('hide');
  }, 120);
}

function slideTo(n) {
  const k = Math.max(1, st.cat.slides.length);
  st.slide = ((n % k) + k) % k;
  $$('#slider .slide').forEach((s, i) => s.classList.toggle('on', i === st.slide));
  $$('#slider .dots i').forEach((d, i) => d.classList.toggle('on', i === st.slide));
}

function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = html;
  bg.onclick = e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); };
  document.body.appendChild(bg);
  return bg;
}

/* API Actions */
async function loadMe() {
  try { st.me = await api('/me'); }
  catch (e) {
    notify('danger', e.message);
    st.me = { name: st.name, phone: st.phone, orders: [], known: false, owing: 0, bills: 0, spent: 0 };
  }
  if ((st.route.parts[0] || '') === 'account') render();
}

async function ask(q) {
  st.chat.push({ who: 'me', text: q });
  render();
  try {
    const j = await api('/ask', { method: 'POST', body: { q } });
    st.chat.push({ who: 'bot', text: j.answer });
  } catch (e) {
    st.chat.push({ who: 'bot', text: 'Sorry — ' + e.message });
  }
  render();
}

async function place() {
  if (st.busy) return;
  if (!st.token) return signIn(() => { render(); place(); });
  const addr = ($('#addr') || {}).value || '', note = ($('#note') || {}).value || '';
  if (st.deliver && !addr.trim()) return notify('danger', 'Please enter your delivery site address');
  if (!$('#agree').checked) return notify('danger', 'Please confirm the agreement checkbox to place your order');
  ls.set('addr', addr);
  st.busy = true;
  loading(true);
  try {
    const lines = selLines().map(({ pid, qty }) => ({ pid, qty }));
    const j = await api('/order', { method: 'POST', body: { lines, deliver: st.deliver, address: addr, note, pay: st.pay } });
    st.placed = { ...j, deliver: st.deliver, lines: selLines().map(l => ({ pid: l.pid, qty: l.qty, price: priceFor(P(l.pid), l.qty) })), del: totals().del };
    st.cart = st.cart.filter(l => l.sel === false);
    saveCart();
    st.me = null;
    notify('success', 'Order placed successfully');
    go('done/' + j.no);
  } catch (e) {
    notify('danger', e.message);
  } finally {
    st.busy = false;
    loading(false);
  }
}

/* Customer OTP Authentication */
function signIn(then) {
  let phone = st.phone || '', stage = 'phone', hint = '', code = '';
  const el = modal('<div class="modal"></div>');
  const box = $('.modal', el);
  const draw = () => {
    box.innerHTML = `<button class="close" data-close title="Close">✕</button><div class="mb">
      <h2>${stage === 'phone' ? 'Customer Sign In' : stage === 'code' ? 'Enter SMS Code' : 'Your Name'}</h2>
      <div class="lead">${stage === 'phone' ? 'Enter your mobile number. We will text you a secure verification code.' : stage === 'code' ? 'A 6-digit code was sent to ' + esc(phone) + '. Valid for 5 minutes.' : 'Enter your name or construction business name.'}</div>
      ${stage === 'phone' ? `<div class="form-group"><label class="lbl">Mobile Number</label><input class="form-control" id="shPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel"></div>` : ''}
      ${stage === 'code' ? `${hint ? `<div class="demo-code">Demo test code: <b>${hint}</b></div>` : ''}<div class="form-group"><label class="lbl">6-Digit Code</label><input class="form-control code-in" id="shCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>` : ''}
      ${stage === 'name' ? `<div class="form-group"><label class="lbl">Your Name or Business</label><input class="form-control" id="shNm" placeholder="e.g. Nimal Construction" autocomplete="name"></div>` : ''}
      <button class="btn btn-primary btn-block btn-lg" id="shGo">${stage === 'phone' ? 'Send Verification Code' : stage === 'code' ? 'Verify & Sign In' : 'Done'}</button>
      ${stage === 'code' ? '<div class="fs-13" style="margin-top:14px;text-align:center"><a href="#" id="shBack" class="text-primary fw-600">Incorrect mobile number? Edit number</a></div>' : ''}
    </div>`;
    const bk = $('#shBack', box);
    if (bk) bk.onclick = e => { e.preventDefault(); stage = 'phone'; draw(); };
    $('#shGo', box).onclick = step;
    const inp = $('input', box);
    if (inp) {
      inp.focus();
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); step(); } };
    }
  };
  const step = async () => {
    const goBtn = $('#shGo', box);
    goBtn.disabled = true;
    try {
      if (stage === 'phone') {
        phone = $('#shPh', box).value.replace(/\D/g, '');
        if (!/^0\d{9}$/.test(phone)) throw new Error('Please enter a valid 10-digit mobile number starting with 07');
        const j = await api('/otp', { method: 'POST', body: { phone } });
        hint = j.sent ? '' : j.code;
        stage = 'code';
        return draw();
      }
      if (stage === 'code') {
        code = $('#shCode', box).value.trim();
        if (code.length < 6) throw new Error('Please enter the full 6-digit code');
        const j = await api('/login', { method: 'POST', body: { phone, code } });
        if (j.needName) { stage = 'name'; return draw(); }
        return done(j);
      }
      if (stage === 'name') {
        const name = $('#shNm', box).value.trim();
        if (!name) throw new Error('Please enter your name');
        const j = await api('/login', { method: 'POST', body: { phone, code, name } });
        if (j.needName) throw new Error('Please enter your name');
        return done(j);
      }
    } catch (e) {
      notify('danger', e.message);
      goBtn.disabled = false;
    }
  };
  const done = j => {
    st.token = j.token;
    st.name = j.name;
    st.phone = j.phone;
    ls.set('token', j.token);
    ls.set('name', j.name);
    ls.set('phone', j.phone);
    el.remove();
    notify('success', 'Welcome, ' + j.name);
    if (then) then();
  };
  draw();
}

/* ==========================================================================
   Theme & Boot Engine
   ========================================================================== */
const THEME_DEFAULTS = {
  preset: 'modern',
  color: '#a32830',
  accent: '#f59e0b',
  font: 'Plus Jakarta Sans',
  headerDark: false,
  topbar: true,
  cardStyle: 'shadow',
  perRow: 6,
  showSold: true,
  showMrp: true,
  showStock: true,
  catwise: 4,
  hero: { title: '', text: '', button: 'Shop Now' },
  band: { title: '', text: '', button: 'Start Shopping' },
  sections: [
    { k: 'featured', on: true, t: 'Featured Products' },
    { k: 'categories', on: true, t: 'Popular Categories' },
    { k: 'banners', on: true, t: '' },
    { k: 'best', on: true, t: 'Best Selling Materials' },
    { k: 'newest', on: true, t: 'New Arrivals' },
    { k: 'band', on: true, t: '' },
    { k: 'catwise', on: true, t: '' }
  ],
  menu: [
    { label: 'Home', href: '#/' },
    { label: 'All Products', href: '#/search' },
    { label: 'Categories', href: '#/categories' },
    { label: 'Track Order', href: '#/track' },
    { label: 'Contact Us', href: '#/contact' }
  ]
};
let T = THEME_DEFAULTS;

function applyTheme() {
  const t = st.cat.settings.theme || {};
  T = { ...THEME_DEFAULTS, ...t, hero: { ...THEME_DEFAULTS.hero, ...(t.hero || {}) }, band: { ...THEME_DEFAULTS.band, ...(t.band || {}) } };
  if (!Array.isArray(T.sections) || !T.sections.length) T.sections = THEME_DEFAULTS.sections;
  if (!Array.isArray(T.menu) || !T.menu.length) T.menu = THEME_DEFAULTS.menu;

  const root = document.documentElement.style;
  const hex = c => /^#[0-9a-f]{6}$/i.test(c || '');
  const rgb = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));

  const main = hex(T.color) ? T.color : hex(st.cat.settings.color) ? st.cat.settings.color : THEME_DEFAULTS.color;
  const [r, g, b] = rgb(main);
  root.setProperty('--primary', main);
  root.setProperty('--hov-primary', `rgb(${r * 0.76 | 0} ${g * 0.76 | 0} ${b * 0.76 | 0})`);
  root.setProperty('--soft-primary', `rgba(${r}, ${g}, ${b}, 0.08)`);

  const acc = hex(T.accent) ? T.accent : THEME_DEFAULTS.accent;
  const [ar, ag, ab] = rgb(acc);
  root.setProperty('--secondary-base', acc);
  root.setProperty('--soft-secondary-base', `rgba(${ar}, ${ag}, ${ab}, 0.12)`);

  const font = ['Plus Jakarta Sans', 'Inter', 'Roboto', 'Poppins', 'Public Sans'].includes(T.font) ? T.font : 'Plus Jakarta Sans';
  if (font !== 'Plus Jakarta Sans' && !document.getElementById('fontX')) {
    const l = document.createElement('link');
    l.id = 'fontX';
    l.rel = 'stylesheet';
    l.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@400;500;600;700;800&display=swap`;
    document.head.appendChild(l);
  }
  document.body.style.fontFamily = `'${font}', 'Public Sans', sans-serif`;
  root.setProperty('--per-row', String(+T.perRow || 6));
}

async function loadCatalog() {
  try {
    st.cat = await api('/catalog');
  } catch (e) {
    st.cat = {
      shop: { name: 'Regal Hardware' },
      settings: { open: false, name: 'Regal Hardware Online', hours: 'Connecting to store till... ' + e.message },
      categories: [],
      products: [],
      slides: [],
      banners: []
    };
  }
  st.cat.slides = st.cat.slides || [];
  st.cat.banners = st.cat.banners || [];
  applyTheme();
}

(async () => {
  st.route = parseRoute();
  render();
  await loadCatalog();
  render();
  setInterval(() => {
    if (st.cat && st.cat.slides.length > 1 && $('#slider')) slideTo(st.slide + 1);
  }, 5000);
  setInterval(async () => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    await loadCatalog();
    drawHeaderBits();
  }, 120000);
})();
