<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Regal Hardware</title>
<meta name="description" content="Regal Hardware — order cement, steel, pipes, paint and hardware online for delivery or collection.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d43533'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='800' font-size='16' fill='%23fff' text-anchor='middle'%3ERH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Active eCommerce "classic" look, rebuilt for the Regal shop site ===== */
:root{--primary:#d43533;--hov-primary:#9d1b1a;--soft-primary:rgba(212,53,51,.15);--secondary-base:#ffc519;--hov-secondary-base:#dbaa17;--soft-secondary-base:rgba(255,197,25,.15);
 --blue:#3490f3;--hov-blue:#2e7fd6;--soft-blue:rgba(0,123,255,.15);--gray:#9d9da6;--secondary:#919199;--soft-secondary:rgba(145,145,153,.15);--success:#85b567;--soft-success:rgba(133,181,103,.15);
 --warning:#f3af3d;--soft-warning:rgba(243,175,61,.15);--light:#f5f5f5;--soft-light:#dfdfe6;--soft-white:#b5b5bf;--dark:#292933;--soft-dark:#1b1b28;--container:1200px}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--dark);font-family:'Public Sans',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}a:hover{color:var(--hov-blue)}
button,input,select,textarea{font:inherit;color:inherit}
img{max-width:100%}
h1,h2,h3,h4,h5{margin:0;font-weight:700;line-height:1.2}
.container{max-width:var(--container);margin:0 auto;padding:0 15px}
.hide{display:none!important}
.text-primary{color:var(--primary)!important}.text-blue{color:var(--blue)!important}.text-gray{color:var(--gray)!important}.text-secondary{color:var(--secondary)!important}.text-dark{color:var(--dark)!important}
.fw-700{font-weight:700}.fs-12{font-size:12px}.fs-13{font-size:13px}.fs-14{font-size:14px}.fs-16{font-size:16px}.fs-20{font-size:20px}.opacity-60{opacity:.6}.opacity-50{opacity:.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;padding:9px 18px;cursor:pointer;font-weight:700;font-size:14px;border-radius:0;background:#fff;transition:.25s;line-height:1.4}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--hov-primary);color:#fff}
.btn-dark{background:#000;color:#fff}.btn-dark:hover{opacity:.75}
.btn-soft-blue{background:var(--soft-blue);color:var(--blue)}.btn-soft-blue:hover{background:var(--blue);color:#fff}
.btn-light{background:var(--light);border-color:var(--soft-light)}.btn-light:hover{background:#e9e9ee}
.btn-outline{border-color:var(--soft-light)}.btn-outline:hover{border-color:var(--dark)}
.btn-link{background:none;padding:0;color:var(--blue);font-weight:400}
.btn-block{width:100%}.btn-lg{padding:16px 20px}.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.form-control{width:100%;border:1px solid var(--soft-light);padding:9px 12px;background:#fff;border-radius:0;font-size:14px;outline:none;transition:.2s}
.form-control:focus{border-color:var(--primary);border-width:2px;padding:8px 11px}
textarea.form-control{min-height:80px;resize:vertical}
label.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--dark)}
.form-group{margin-bottom:16px}
.badge{display:inline-block;padding:2px 8px;font-size:11px;font-weight:700;border-radius:3px;line-height:1.6}
.badge-soft-success{background:var(--soft-success);color:#5f9a3e}.badge-soft-warning{background:var(--soft-warning);color:#b47d21}.badge-soft-danger{background:var(--soft-primary);color:var(--primary)}.badge-soft-blue{background:var(--soft-blue);color:var(--blue)}.badge-soft-secondary{background:var(--soft-secondary);color:var(--secondary)}
.border{border:1px solid var(--soft-light)}.bg-light{background:var(--light)}.bg-white{background:#fff}
.row{display:flex;flex-wrap:wrap;margin:0 -8px}.col{padding:0 8px;flex:1 1 0;min-width:0}
.aiz-square-check{position:relative;display:inline-block;width:16px;height:16px;border:1px solid var(--soft-white);vertical-align:-3px;margin-right:8px;background:#fff}
.aiz-checkbox input{position:absolute;opacity:0;width:0;height:0}
.aiz-checkbox input:checked+.aiz-square-check{background:var(--primary);border-color:var(--primary)}
.aiz-checkbox input:checked+.aiz-square-check:after{content:'';position:absolute;left:5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.aiz-checkbox{cursor:pointer;display:inline-flex;align-items:center;position:relative}
.aiz-radio{display:flex;align-items:center;gap:10px;cursor:pointer;padding:12px 14px;border:1px solid var(--soft-light);margin-bottom:8px}
.aiz-radio input{accent-color:var(--primary);width:16px;height:16px;margin:0}
.aiz-radio.on{border-color:var(--primary);background:var(--soft-primary)}
.has-transition{transition:.3s}
.animate-underline{position:relative}.animate-underline:after{content:'';position:absolute;left:0;bottom:-2px;width:0;height:1px;background:currentColor;transition:.3s}.animate-underline:hover:after{width:100%}
.text-truncate-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.section-top{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.section-top h3{font-size:20px;font-weight:700}.section-top a{font-size:12px;font-weight:700;color:var(--blue)}
.section-top a:hover{color:var(--primary)}
section.sec{margin:16px 0 24px}
svg.i{width:16px;height:16px;fill:currentColor;vertical-align:middle;flex:none}

/* ---------- header ---------- */
.top-navbar{background:var(--dark);color:#fff;font-size:12px;height:35px}
.top-navbar .container{display:flex;align-items:center;justify-content:space-between;height:100%}
.top-navbar a{color:#fff;opacity:.85}.top-navbar a:hover{opacity:1}
.top-navbar .tagline{opacity:.75}
header.hdr{position:sticky;top:0;z-index:1020;background:#fff;box-shadow:0 1px 0 var(--soft-light)}
.logo-bar{border-bottom:1px solid var(--soft-light)}
.logo-bar .container{display:flex;align-items:center;height:80px;gap:16px}
.logo{display:flex;align-items:center;gap:10px;color:var(--dark);flex:none}
.logo img{height:44px;max-width:180px;object-fit:contain}
.logo .mark{width:40px;height:40px;background:var(--primary);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;letter-spacing:.02em}
.logo b{font-size:20px;font-weight:800;line-height:1;display:block}.logo b span{color:var(--primary)}
.logo small{font-size:10.5px;letter-spacing:.14em;color:var(--secondary);font-weight:600;display:block;margin-top:2px}
.search-wrap{flex:1;position:relative;margin:0 32px}
.search-input-box{position:relative}
.search-input-box input{width:100%;height:44px;border:1px solid var(--soft-light);padding:0 44px 0 16px;outline:none;font-size:14px;transition:.3s}
.search-input-box input:focus{border-color:var(--dark);box-shadow:0 0 0 2px rgba(41,41,51,.06)}
.search-input-box svg{position:absolute;right:16px;top:12px;width:20px;height:20px;fill:var(--soft-white)}
.typed-search-box{position:absolute;left:0;top:100%;width:100%;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.15);z-index:30;max-height:420px;overflow:auto}
.typed-search-box .hd{padding:8px 14px;font-size:12px;font-weight:700;color:var(--secondary);text-transform:uppercase;background:var(--light)}
.typed-search-box a.sr{display:flex;align-items:center;gap:12px;padding:8px 14px;color:var(--dark);border-bottom:1px solid var(--light)}
.typed-search-box a.sr:hover{background:var(--soft-secondary-base)}
.typed-search-box .sr .th{width:40px;height:40px;flex:none}
.typed-search-box .sr b{color:var(--primary);margin-left:auto;white-space:nowrap}
.hdr-icons{display:flex;align-items:center;gap:26px;flex:none}
.hdr-icon{position:relative;color:var(--secondary);display:flex;align-items:center;justify-content:center;width:24px;height:24px;cursor:pointer}
.hdr-icon:hover{color:var(--primary)}
.hdr-icon svg{width:20px;height:20px}
.hdr-icon .cnt{position:absolute;top:-8px;right:-10px;background:var(--primary);color:#fff;border-radius:99px;font-size:10px;font-weight:700;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.nav-user{display:flex;align-items:center;gap:10px;cursor:pointer;position:relative;flex:none}
.nav-user .circle{width:40px;height:40px;border-radius:50%;border:1px solid var(--soft-light);display:flex;align-items:center;justify-content:center;color:var(--secondary);background:#fff;transition:.3s}
.nav-user:hover .circle{border-color:var(--dark);box-shadow:0 6px 10px rgba(0,0,0,.16)}
.nav-user .who{font-size:12px;color:var(--secondary)}.nav-user .who b{display:block;color:var(--dark);font-size:14px}
.user-menu{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.14);border-top:2px solid var(--primary);display:none;z-index:40}
.nav-user:hover .user-menu,.nav-user.open .user-menu{display:block}
.user-menu a{display:flex;align-items:center;gap:12px;padding:12px 18px;color:var(--dark);border-bottom:1px solid var(--light);font-size:14px}
.user-menu a:hover{background:var(--soft-secondary-base)}
.user-menu a svg{color:var(--soft-white)}
.menu-bar{background:var(--dark);height:50px;position:relative}
.menu-bar .container{display:flex;align-items:stretch;height:100%}
.all-category{width:270px;flex:none;background:rgba(0,0,0,.1);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;cursor:pointer;user-select:none}
.all-category b{font-size:16px}.all-category span{font-size:13px;opacity:.7;margin-left:8px}
.all-category svg{transition:.3s}.all-category.open svg{transform:rotate(180deg)}
.menu-links{display:flex;align-items:center;flex:1;overflow:auto;scrollbar-width:none;margin-left:16px}
.menu-links a{color:#fff;font-size:13px;font-weight:700;padding:0 16px;height:50px;display:flex;align-items:center;white-space:nowrap;transition:.3s}
.menu-links a:hover,.menu-links a.on{background:rgba(0,0,0,.14)}
.nav-cart-box{flex:none;background:rgba(0,0,0,.1);color:#fff;display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;cursor:pointer;margin-left:20px}
.nav-cart-box .cart-icon{position:relative}
.nav-cart-box .cart-icon i{position:absolute;top:-8px;right:-10px;background:var(--primary);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;min-width:18px;height:18px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.nav-cart-box .txt{font-size:12px;line-height:1.3}.nav-cart-box .txt b{display:block;font-size:14px}
.cart-dropdown{position:absolute;right:0;top:100%;width:340px;background:#fff;color:var(--dark);box-shadow:0 10px 30px rgba(0,0,0,.18);display:none;z-index:45;cursor:default}
.nav-cart-box:hover .cart-dropdown{display:block}
.cart-dropdown .items{max-height:300px;overflow:auto}
.cart-dropdown .it{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--light);font-size:13px}
.cart-dropdown .it .th{width:44px;height:44px;flex:none}
.cart-dropdown .it .nm{flex:1;min-width:0}.cart-dropdown .it .nm span{display:block;color:var(--secondary);font-size:12px}
.cart-dropdown .it b{color:var(--primary);white-space:nowrap}
.cart-dropdown .x{background:none;border:0;color:var(--gray);cursor:pointer;font-size:16px}
.cart-dropdown .ft{padding:12px 14px;display:flex;gap:8px}
.cart-dropdown .sub{display:flex;justify-content:space-between;padding:10px 14px;font-weight:700;border-top:1px solid var(--soft-light)}
/* category menu (hover / click) */
.aiz-category-menu{width:270px;background:#fff;border:1px solid var(--soft-light);border-top:0}
.aiz-category-menu ul{list-style:none;margin:0;padding:0}
.aiz-category-menu li a{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--dark);font-size:14px;border-bottom:1px solid var(--light);transition:.2s}
.aiz-category-menu li a:hover{background:var(--soft-secondary-base);padding-left:26px}
.aiz-category-menu li a .cat-image{width:18px;height:18px;object-fit:cover;opacity:.7;border-radius:2px}
.aiz-category-menu li a .cat-dot{width:8px;height:8px;border-radius:50%;background:var(--soft-white)}
.aiz-category-menu li a small{margin-left:auto;color:var(--gray);font-size:11px}
.aiz-category-menu li.more a{color:var(--blue);font-weight:700;font-size:13px;justify-content:center}
.hover-category-menu{position:absolute;left:0;right:0;top:100%;z-index:35;display:none}
.hover-category-menu.show{display:block}
.hover-category-menu .aiz-category-menu{box-shadow:0 10px 30px rgba(0,0,0,.18)}

/* ---------- home ---------- */
.home-banner-area{margin:16px 0}
.home-banner-area .container{display:flex;gap:0;position:relative}
.home-banner-area .aiz-category-menu{flex:none;height:460px;overflow:auto;border-top:1px solid var(--soft-light)}
.home-slider{flex:1;min-width:0;position:relative;height:460px;overflow:hidden;background:var(--light)}
.home-slider .slide{position:absolute;inset:0;opacity:0;transition:opacity .8s}
.home-slider .slide.on{opacity:1}
.home-slider .slide img{width:100%;height:100%;object-fit:cover;display:block}
.home-slider .promo{position:absolute;inset:0;background:linear-gradient(110deg,var(--dark) 0%,#3a2f2f 55%,var(--primary) 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 60px}
.home-slider .promo small{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--secondary-base);font-weight:700}
.home-slider .promo h2{font-size:44px;font-weight:800;margin:10px 0;line-height:1.05;max-width:560px}
.home-slider .promo p{font-size:16px;opacity:.8;max-width:480px;margin:0 0 22px}
.home-slider .promo .btn{width:max-content}
.home-slider .dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.home-slider .dots i{width:11px;height:11px;border-radius:50%;background:#ddd;cursor:pointer;opacity:.9}.home-slider .dots i.on{background:var(--primary)}
.home-slider .arr{position:absolute;top:50%;transform:translateY(-50%);width:25px;height:60px;background:rgba(177,174,174,.3);color:#fff;border:0;cursor:pointer;font-size:18px}
.home-slider .arr.l{left:0}.home-slider .arr.r{right:0}
.feat-cats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--soft-light);border-left:1px solid var(--soft-light);background:#fff}
.feat-cats .fc{border-right:1px solid var(--soft-light);border-bottom:1px solid var(--soft-light);padding:24px;display:flex;gap:18px;align-items:flex-start}
.feat-cats .fc .th{width:110px;height:110px;flex:none}
.feat-cats .fc h6{font-size:14px;font-weight:700;margin:0 0 6px}.feat-cats .fc h6 a{color:var(--dark)}.feat-cats .fc h6 a:hover{color:var(--primary)}
.feat-cats .fc p{margin:4px 0 0;font-size:13px}.feat-cats .fc p a{color:var(--dark);font-weight:300}.feat-cats .fc p a:hover{color:var(--primary)}
.banners{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.banners a{display:block;overflow:hidden}.banners img{width:100%;display:block;transition:.5s}.banners a:hover img{transform:scale(1.05)}
.aiz-carousel{position:relative}
.aiz-carousel .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-top:1px solid var(--soft-light);border-left:1px solid var(--soft-light);scroll-behavior:smooth}
.aiz-carousel .track::-webkit-scrollbar{display:none}
.aiz-carousel .track>*{flex:0 0 20%;scroll-snap-align:start;border-right:1px solid var(--soft-light);border-bottom:1px solid var(--soft-light)}
.aiz-carousel .arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 10px rgba(20,23,28,.13);cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;color:var(--dark)}
.aiz-carousel .arrow:hover{background:var(--primary);color:#fff}
.aiz-carousel .arrow.l{left:-16px}.aiz-carousel .arrow.r{right:-16px}
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--soft-light);border-left:1px solid var(--soft-light)}
.pgrid.six,.pgrid.per6{grid-template-columns:repeat(6,1fr)}.pgrid.per5{grid-template-columns:repeat(5,1fr)}
.pgrid>*{border-right:1px solid var(--soft-light);border-bottom:1px solid var(--soft-light)}
/* theme switches set at the till */
body.light-header .menu-bar{background:#fff;box-shadow:inset 0 -1px 0 var(--soft-light)}
body.light-header .all-category,body.light-header .nav-cart-box{background:var(--light);color:var(--dark)}
body.light-header .menu-links a{color:var(--dark)}body.light-header .menu-links a:hover,body.light-header .menu-links a.on{background:var(--soft-secondary-base)}
body.light-header .top-navbar{background:var(--light);color:var(--dark)}body.light-header .top-navbar a{color:var(--dark)}
body.cards-shadow .pgrid,body.cards-shadow .aiz-carousel .track{border:0;gap:16px}
body.cards-shadow .pgrid>*,body.cards-shadow .aiz-carousel .track>*{border:0;box-shadow:0 2px 12px rgba(0,0,0,.08);border-radius:6px;overflow:hidden}
body.cards-shadow .aiz-carousel .track>*{flex-basis:calc(20% - 13px)}
.delivery-band{background:var(--dark);color:#fff;padding:36px 0;margin:24px 0}
.delivery-band .container{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.delivery-band h5{font-size:32px;font-weight:400}.delivery-band p{color:var(--gray);font-size:18px;margin:8px 0 0}
.delivery-band .btn{margin-left:auto;border:2px solid #fff;color:#fff;background:rgba(255,255,255,.2);border-radius:28px;padding:12px 28px;box-shadow:0 20px 30px rgba(0,0,0,.16)}
.delivery-band .btn:hover{background:#fff;color:var(--dark)}

/* ---------- product box ---------- */
.aiz-card-box{position:relative;background:#fff;padding:16px 0 0;overflow:hidden;transition:.3s;z-index:1;height:100%;display:flex;flex-direction:column}
.aiz-card-box:hover{box-shadow:0 20px 40px rgba(0,0,0,.16);z-index:2}
.aiz-card-box .pic{position:relative;height:200px;overflow:hidden;display:block}
.aiz-card-box .pic .th{width:100%;height:100%}
.th{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}
.th img{width:100%;height:100%;object-fit:contain;transition:.5s}
.aiz-card-box:hover .pic img{transform:scale(1.08)}
.th .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:28px;color:#fff;letter-spacing:.04em}
.th .ph.sm{font-size:14px}
.aiz-card-box .disc{position:absolute;left:6px;top:6px;background:var(--primary);color:#fff;font-size:11px;font-weight:700;padding:2px 0;width:38px;text-align:center;border-radius:4px}
.aiz-card-box .lbl{position:absolute;left:6px;top:32px;background:var(--dark);color:#fff;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px}
.aiz-p-hov-icon{position:absolute;right:0;top:0}
.aiz-p-hov-icon a{display:flex;align-items:center;justify-content:center;width:36px;height:36px;background:#fff;color:var(--secondary);transform:translateX(100%);transition:.3s;box-shadow:-1px 1px 4px rgba(0,0,0,.06)}
.aiz-p-hov-icon a:hover{background:var(--primary);color:#fff}
.aiz-card-box:hover .aiz-p-hov-icon a{transform:translateX(0)}
.aiz-p-hov-icon a.on{color:var(--primary)}
.cart-btn{position:absolute;left:0;bottom:0;width:100%;height:35px;background:#000;opacity:.7;color:#fff;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateY(100%);transition:.3s;overflow:hidden;border:0;cursor:pointer}
.cart-btn .t{margin-top:48px;margin-bottom:20px;transition:.4s}.cart-btn:hover .t{margin-top:-40px}
.cart-btn svg{width:22px;height:22px}
.aiz-card-box:hover .cart-btn{transform:translateY(0)}
.aiz-card-box .body{padding:12px 16px 16px;text-align:center;margin-top:auto}
.aiz-card-box h3{font-size:13px;font-weight:400;line-height:1.4;height:36px;overflow:hidden}
.aiz-card-box h3 a{color:var(--dark)}.aiz-card-box h3 a:hover{color:var(--primary)}
.aiz-card-box .price{display:flex;justify-content:center;gap:6px;margin-top:12px;font-size:14px}
.aiz-card-box .price del{color:var(--secondary);opacity:0;margin-right:-37%;transition:.3s}
.aiz-card-box:hover .price del{opacity:1;margin-right:0}
.aiz-card-box .price b{color:var(--primary)}
.aiz-card-box .oos{position:absolute;left:0;right:0;bottom:0;background:var(--soft-white);color:#fff;font-size:12px;font-weight:700;text-align:center;padding:8px}

/* ---------- listing ---------- */
.listing{display:flex;gap:24px;margin:16px 0 40px}
.filter-side{width:270px;flex:none}
.filter-box{background:#fff;border-bottom:1px solid var(--soft-light);margin-bottom:8px}

/* ---------- modal / toast / loader ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1050;display:flex;align-items:center;justify-content:center;padding:16px}

/* ---------- api / state helpers ---------- */
let toastT;
function notify(kind,msg){ const t=document.createElement('div'); t.className='toast '+kind; t.textContent=msg; $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3200) }
function loading(on){ $('#loader').classList.toggle('active',!!on) }
async function api(path,opts={}){
  const h={'Content-Type':'application/json'}; if(st.token) h.Authorization='Bearer '+st.token;
  const r=await fetch(API+path,{...opts,headers:h,body:opts.body?JSON.stringify(opts.body):undefined});
  let j={}; try{ j=await r.json() }catch(e){}
  if(r.status===401&&st.token&&!/^\/(otp|login)/.test(path)){ signOut(false) }
  if(!r.ok) throw new Error(j.error||('Request failed ('+r.status+')'));
  return j;
}
const P=id=>st.cat&&st.cat.products.find(p=>p.id===+id);
const cartN=()=>st.cart.reduce((a,l)=>a+l.qty,0);
const selLines=()=>st.cart.filter(l=>l.sel!==false&&P(l.pid));
function totals(lines=selLines()){ const w=st.cat?st.cat.settings:{delivery:0,freeOver:0}; const goods=lines.reduce((a,l)=>{const p=P(l.pid);return a+(p?l.qty*priceFor(p,l.qty):0)},0);
  const del=(st.deliver&&goods<w.freeOver&&goods>0)?w.delivery:0; return {goods,del,total:goods+del,n:lines.length} }
function priceFor(p,qty){ if(p.tiers&&p.tiers.length){ const t=p.tiers.filter(t=>qty>=t.min).sort((a,b)=>b.min-a.min)[0]; if(t) return t.price } return p.price }
const discPct=p=>p.mrp>p.price?Math.round((p.mrp-p.price)/p.mrp*100):0;
function saveCart(){ ls.set('cart',st.cart.map(({pid,qty,sel})=>({pid,qty,sel}))) }
function addToCart(pid,qty=1,quiet){ const p=P(pid); if(!p) return; qty=+qty||1; if(qty<=0) return;
  if(p.stock!==null&&p.stock<=0) return notify('warning',p.name+' is out of stock just now');
  const ex=st.cart.find(l=>l.pid===pid); if(ex){ ex.qty+=qty; ex.sel=true } else st.cart.push({pid,qty,sel:true});
  saveCart(); if(!quiet) notify('success',`${p.name} added to the cart`); drawHeaderBits() }
function toggleWish(pid){ const i=st.wish.indexOf(pid); if(i>=0){ st.wish.splice(i,1); notify('warning','Removed from your wishlist') } else { st.wish.push(pid); notify('success','Added to your wishlist') } ls.set('wish',st.wish); drawHeaderBits(); $$(`[data-wish="${pid}"]`).forEach(a=>a.classList.toggle('on',st.wish.includes(pid))) }
function signOut(redraw=true){ st.token=''; st.name=''; st.me=null; ls.set('token',''); ls.set('name',''); if(redraw){ notify('success','Signed out'); go('') } }
const hue=s=>{ let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))%360; return h };
function thumb(p,small){ if(p.img) return `<div class="th"><img src="${esc(p.img)}" alt="${esc(p.name)}" loading="lazy"></div>`;
  const h=hue(p.cat||p.name); return `<div class="th"><div class="ph ${small?'sm':''}" style="background:linear-gradient(135deg,hsl(${h} 45% 55%),hsl(${(h+40)%360} 50% 40%))">${esc(initials(p.name)||initials(p.cat)||'RH')}</div></div>` }
const initials=s=>String(s||'').split(/\s+/).filter(w=>/^[A-Za-z]/.test(w)).slice(0,2).map(w=>w[0]).join('').toUpperCase();
function catThumb(c){ if(c.img) return `<div class="th"><img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy"></div>`; const h=hue(c.name); return `<div class="th"><div class="ph" style="background:linear-gradient(135deg,hsl(${h} 40% 92%),hsl(${(h+30)%360} 40% 80%));color:hsl(${h} 40% 35%);font-size:22px">${esc(c.name.slice(0,2).toUpperCase())}</div></div>` }

/* ---------- routing ---------- */
function parseRoute(){ const h=location.hash.replace(/^#\/?/,''); const [path,qs]=h.split('?'); const q={}; (qs||'').split('&').filter(Boolean).forEach(kv=>{const [k,v]=kv.split('=');q[decodeURIComponent(k)]=decodeURIComponent(v||'')}); const parts=path.split('/').filter(Boolean); return {path,parts,q} }
function go(path,q){ const qs=q?Object.entries(q).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):''; location.hash='#/'+path+(qs?'?'+qs:'') }
const url=(path,q)=>'#/'+path+(q?'?'+Object.entries(q).filter(([,v])=>v!==''&&v!=null).map(([k,v])=>encodeURIComponent(k)+'='+encodeURIComponent(v)).join('&'):'');
window.addEventListener('hashchange',()=>{ st.route=parseRoute(); st.catOpen=false; st.drawer=false; render(); window.scrollTo({top:0}) });

/* ---------- header / footer ---------- */
function categoryMenu(limit=12){ const cats=st.cat.categories; return `<div class="aiz-category-menu"><ul>
  ${cats.slice(0,limit).map(c=>`<li><a href="${url('search',{cat:c.name})}">${c.img?`<img class="cat-image" src="${esc(c.img)}" alt="">`:'<span class="cat-dot"></span>'}<span>${esc(c.name)}</span><small>${c.count}</small></a></li>`).join('')}
  ${cats.length>limit?`<li class="more"><a href="#/categories">See all ${cats.length} categories</a></li>`:''}</ul></div>` }
function header(){
  const s=st.cat.shop, w=st.cat.settings, n=cartN(), t=totals(st.cart.filter(l=>P(l.pid)));
  const cur='#/'+(st.route.path||'');
  const menu=T.menu.map(m=>{ const ext=/^https?:/i.test(m.href); const on=!ext&&(m.href==='#/'?cur==='#/':cur.startsWith(m.href.split('?')[0])&&m.href!=='#/'); return `<a href="${esc(m.href||'#/')}" class="${on?'on':''}" ${ext?'target="_blank" rel="noopener"':''}>${esc(m.label)}</a>` }).join('');
  return `${T.topbar!==false?`<div class="top-navbar"><div class="container">
     <div>${w.tagline?`<span class="tagline">${esc(w.tagline)}</span>`:`<span class="tagline">${esc(s.tags||'Everything for the build, delivered')}</span>`}</div>
     <div>${s.phone?`<a href="tel:${esc(s.phone)}">Helpline: ${esc(s.phone)}</a>`:''}${st.token?`<span style="margin-left:18px;opacity:.85">Hi, ${esc(st.name)}</span>`:`<a href="#" data-login style="margin-left:18px">Login</a>`}</div></div></div>`:''}
   <header class="hdr"><div class="logo-bar"><div class="container">

function listing(){

const stepOf=s=>({placed:1,accepted:2,picking:2,ready:3,despatched:3,done:4,collected:4,invoiced:4})[s]||0;
const statusOf=s=>({placed:'Pending',accepted:'Being picked',picking:'Being picked',ready:'Ready',despatched:'On the way',done:'Delivered',collected:'Collected',invoiced:'Billed',rejected:'Not accepted',cancelled:'Cancelled'})[s]||s;

function contactPage(){ const s=st.cat.shop, w=st.cat.settings; return `<div class="container"><div class="two-col"><div class="main"><div class="card-p"><h5 class="fs-20" style="margin-bottom:6px">Ask us</h5><div class="text-secondary fs-13" style="margin-bottom:12px">A price, whether we have it, delivery, where your order is, what you owe. Anything else — ${s.phone?'call '+esc(s.phone):'call the shop'}.</div>
   <div class="chat" id="chat">${st.chat.map(m=>`<div class="wc ${m.who}">${esc(m.text)}</div>`).join('')||'<div class="wc bot">Ask me something — “price of Tokyo cement”, “do you have 25mm pipe”, “where is my order”, “what do I owe”.</div>'}</div>
   <div style="display:flex;gap:8px;margin-top:10px"><input class="form-control" id="askQ" placeholder="Type your question…" autocomplete="off"><button class="btn btn-primary" id="askGo">Ask</button></div></div></div>
   <div class="side"><div class="card-p"><h5 class="fs-16" style="margin-bottom:10px">${esc(s.name)}</h5><ul class="info-list"><li><span>Address</span>${esc(s.addr||'')}</li>${s.phone?`<li><span>Mobile</span><a href="tel:${esc(s.phone)}">${esc(s.phone)}</a></li>`:''}${s.land?`<li><span>Land line</span><a href="tel:${esc(s.land)}">${esc(s.land)}</a></li>`:''}${w.email?`<li><span>Email</span><a href="mailto:${esc(w.email)}">${esc(w.email)}</a></li>`:''}${(w.hours||s.hours)?`<li><span>Hours</span>${esc(w.hours||s.hours)}</li>`:''}</ul>
   ${w.whatsapp?`<a class="btn btn-block" style="margin-top:14px;background:#25d366;color:#fff" href="https://wa.me/${esc(w.whatsapp.replace(/\D/g,'').replace(/^0/,'94'))}" target="_blank" rel="noopener">${I.wa} Message us on WhatsApp</a>`:''}</div></div></div></div>` }

/* ---------- render ---------- */
function render(){
  const app=$('#app');
  if(!st.cat){ app.innerHTML='<div style="padding:60px;text-align:center;color:var(--secondary)">Loading the shop…</div>'; return }
  const v=st.route.parts[0]||'';
  const page=({'':home,search:listing,categories:categoriesPage,product:productPage,cart:cartPage,checkout:checkout,done:donePage,account:accountPage,track:trackPage,contact:contactPage})[v]||home;
  const waNo=(st.cat.settings.whatsapp||'').replace(/\D/g,'').replace(/^0/,'94');
  app.innerHTML=header()+`<main>${page()}</main>`+footer()+drawer()+`<div class="mob-cart" id="mobCart">${mobCart()}</div>`
    +(waNo?`<a class="wa-float" href="https://wa.me/${waNo}?text=${encodeURIComponent('Hi '+(st.cat.shop.name||'')+', ')}" target="_blank" rel="noopener" title="Chat with us on WhatsApp">${I.wa}<span>Chat with us</span></a>`:'');
  bind();
}
function bind(){
  const root=$('#app');
  // header
  $$('[data-login]',root).forEach(a=>a.onclick=e=>{e.preventDefault();signIn(()=>{st.me=null;render()})});
  $$('[data-logout]',root).forEach(a=>a.onclick=e=>{e.preventDefault();signOut()});
  const cb=$('#catBtn'); if(cb) cb.onclick=()=>{st.catOpen=!st.catOpen;$('#catMenu').classList.toggle('show',st.catOpen);cb.classList.toggle('open',st.catOpen)};
  document.onclick=e=>{ if(st.catOpen&&!e.target.closest('#catBtn')&&!e.target.closest('#catMenu')){ st.catOpen=false; $('#catMenu')?.classList.remove('show'); $('#catBtn')?.classList.remove('open') } if(!e.target.closest('.search-wrap')) $('#typed')?.classList.add('hide'); if(!e.target.closest('#navUser')) $('#navUser')?.classList.remove('open') };
  const nu=$('#navUser'); if(nu&&st.token) nu.querySelector('.circle').onclick=()=>nu.classList.toggle('open');
  $$('[data-drawer]',root).forEach(b=>b.onclick=()=>{st.drawer=true;$('#drawer').classList.add('show')});
  $$('[data-drawerclose]',root).forEach(b=>b.onclick=()=>{st.drawer=false;$('#drawer').classList.remove('show')});
  $$('[data-mobsearch]',root).forEach(b=>b.onclick=()=>{st.mobSearch=!st.mobSearch;$('.search-wrap').classList.toggle('show',st.mobSearch);if(st.mobSearch)$('#search').focus()});
  const s=$('#search'); if(s){ s.oninput=()=>typed(s.value); s.onfocus=()=>{ if(s.value) typed(s.value) }; s.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#typed').classList.add('hide'); go('search',{q:s.value.trim()}) } } }
  // product boxes & shared
  $$('[data-add]',root).forEach(b=>b.onclick=e=>{e.preventDefault(); const q=b.dataset.qtyfrom?+$('#'+b.dataset.qtyfrom).value||1:1; addToCart(+b.dataset.add,q)});
  $$('[data-buynow]',root).forEach(b=>b.onclick=()=>{ addToCart(+b.dataset.buynow,+$('#pdQty').value||1,true); go('checkout') });
  $$('[data-wish]',root).forEach(a=>a.onclick=e=>{e.preventDefault();toggleWish(+a.dataset.wish); if((st.route.parts[0]||'')==='account') render()});
  $$('[data-cartrm]',root).forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation(); st.cart=st.cart.filter(l=>l.pid!==+b.dataset.cartrm); saveCart(); notify('danger','Item has been removed from cart'); if(['cart','checkout'].includes(st.route.parts[0])) render(); else drawHeaderBits()});
  $$('[data-scroll]',root).forEach(b=>b.onclick=()=>{const t=$('#'+b.dataset.scroll+' .track'); t.scrollBy({left:t.clientWidth*.8*+b.dataset.dir})});
  $$('[data-slide]',root).forEach(b=>b.onclick=()=>slideTo(st.slide+ +b.dataset.slide));
  $$('[data-slideto]',root).forEach(b=>b.onclick=()=>slideTo(+b.dataset.slideto));
  $$('[data-copy]',root).forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);notify('success','Copied')});
  $$('[data-share]',root).forEach(b=>b.onclick=()=>{ if(navigator.share) navigator.share({title:document.title,url:location.href}); else { navigator.clipboard?.writeText(location.href); notify('success','Link copied') } });
  $$('[data-askback]',root).forEach(a=>a.onclick=e=>{e.preventDefault(); const p=P(+a.dataset.askback); go('contact'); setTimeout(()=>ask(`Do you have ${p.name}?`),50)});
  // listing
  const fo=$('#filterOpen'); if(fo) fo.onclick=()=>{$('#filterSide').classList.add('show'); const ov=document.createElement('div'); ov.className='side-drawer show'; ov.innerHTML='<div class="ov"></div>'; ov.style.zIndex=1055; ov.onclick=()=>{ov.remove();$('#filterSide').classList.remove('show')}; document.body.appendChild(ov)};
  const fa=$('#fapply'); if(fa) fa.onclick=()=>go('search',{...st.route.q,min:$('#fmin').value,max:$('#fmax').value,page:''});
  const ss=$('#sortSel'); if(ss) ss.onchange=()=>go('search',{...st.route.q,sort:ss.value,page:''});
  $$('[data-cols]',root).forEach(b=>b.onclick=()=>{st.cols=+b.dataset.cols;render()});
  $$('[data-page]',root).forEach(b=>b.onclick=()=>go('search',{...st.route.q,page:b.dataset.page}));
  // product page
  $$('[data-qty]',root).forEach(b=>b.onclick=()=>{const i=$('#pdQty'); i.value=Math.max(1,(+i.value||1)+ +b.dataset.qty); i.dispatchEvent(new Event('input'))});
  const pq=$('#pdQty'); if(pq) pq.oninput=()=>{ st.pdQty=Math.max(1,+pq.value||1); const p=P(st.route.parts[1]); $('.pd .tot').textContent=money(priceFor(p,st.pdQty)*st.pdQty); const c=$('#addCnt'); if(c) c.textContent='('+pad2(st.pdQty)+')' };
  $$('[data-pdtab]',root).forEach(b=>b.onclick=()=>{st.pdTab=b.dataset.pdtab;render();window.scrollTo({top:$('.pd-tabs').offsetTop-120})});
  // cart
  const sa=$('#selAll'); if(sa) sa.onchange=()=>{st.cart.forEach(l=>l.sel=sa.checked);saveCart();render()};
  $$('[data-sel]',root).forEach(c=>c.onchange=()=>{const l=st.cart.find(x=>x.pid===+c.dataset.sel); if(l) l.sel=c.checked; saveCart(); render()});
  $$('[data-cq]',root).forEach(b=>b.onclick=()=>{const l=st.cart.find(x=>x.pid===+b.dataset.cq); l.qty=Math.max(1,l.qty+ +b.dataset.d); saveCart(); render()});
  $$('[data-cqin]',root).forEach(i=>i.onchange=()=>{const l=st.cart.find(x=>x.pid===+i.dataset.cqin); l.qty=Math.max(1,+i.value||1); saveCart(); render()});
  // checkout
  $$('input[name=dl]',root).forEach(r=>r.onchange=()=>{st.deliver=r.value==='1';ls.set('deliver',st.deliver);render()});
  $$('input[name=pay]',root).forEach(r=>r.onchange=()=>{st.pay=r.value;ls.set('pay',st.pay);render()});
  const ag=$('#agree'); if(ag) ag.onchange=()=>{st.agree=ag.checked};
  const pl=$('#place'); if(pl) pl.onclick=place;
  $$('.acc-card .ah',root).forEach(h=>h.onclick=()=>{const b=h.nextElementSibling; b.style.display=b.style.display==='none'?'':'none'});
  // account
  $$('[data-ordtab]',root).forEach(b=>b.onclick=()=>{st.ordTab=b.dataset.ordtab;render()});
  $$('[data-order]',root).forEach(b=>b.onclick=()=>{const o=(st.me?.orders||[]).find(x=>x.no===b.dataset.order); if(o) modal(orderDetail(o))});
  $$('[data-editaddr]',root).forEach(b=>b.onclick=()=>{ const el=modal(`<div class="modal"><button class="close" data-close>✕</button><div class="mb"><h2 class="fs-20">Delivery address</h2><div class="lead">Used for your next order.</div><input class="form-control" id="adr" value="${esc(ls.get('addr','')||st.me?.address||'')}" placeholder="e.g. 12 Temple Road, New Town"><button class="btn btn-primary btn-block" style="margin-top:14px" id="adrOk">Save</button></div></div>`); $('#adrOk',el).onclick=()=>{ls.set('addr',$('#adr',el).value.trim());el.remove();render()} });
  // track / contact
  const tg=$('#trackGo'); if(tg){ tg.onclick=async()=>{ tg.disabled=true; try{ const j=await api('/track',{method:'POST',body:{no:$('#tno').value,phone:$('#tph').value}}); st.trackRes=j.order; render() }catch(e){ notify('danger',e.message) } tg.disabled=false }; $('#tph').onkeydown=$('#tno').onkeydown=e=>{ if(e.key==='Enter') tg.click() } }
  const agk=$('#askGo'), aq=$('#askQ'); if(agk){ agk.onclick=()=>{ const v=aq.value.trim(); if(v){ aq.value=''; ask(v) } }; aq.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();agk.click()} }; const c=$('#chat'); if(c) c.scrollTop=c.scrollHeight }
  document.title=(st.cat.shop.name||'Regal Hardware')+(st.route.parts[0]==='product'&&P(st.route.parts[1])?' — '+P(st.route.parts[1]).name:' — order online');
}
let typedT; function typed(v){ clearTimeout(typedT); const box=$('#typed'); const kw=v.toLowerCase().trim(); if(!kw){ box.classList.add('hide'); return }
  typedT=setTimeout(()=>{ const hits=st.cat.products.filter(p=>p.name.toLowerCase().includes(kw)||p.code.toLowerCase().includes(kw)||(p.short||'').toLowerCase().startsWith(kw)).sort((a,b)=>(a.name.toLowerCase().startsWith(kw)?0:1)-(b.name.toLowerCase().startsWith(kw)?0:1)||b.sold-a.sold).slice(0,8);
    const cats=st.cat.categories.filter(c=>c.name.toLowerCase().includes(kw)).slice(0,3);
    box.innerHTML=(cats.length?`<div class="hd">Categories</div>${cats.map(c=>`<a class="sr" href="${url('search',{cat:c.name})}">${esc(c.name)}<b>${c.count} items</b></a>`).join('')}`:'')+(hits.length?`<div class="hd">Products</div>${hits.map(p=>`<a class="sr" href="${url('product/'+p.id)}">${thumb(p,true)}<span class="text-truncate-2">${esc(p.name)}</span><b>${money(p.price)}</b></a>`).join('')}<a class="sr" href="${url('search',{q:v.trim()})}" style="justify-content:center;color:var(--blue);font-weight:700">See all results for "${esc(v.trim())}"</a>`:`<div style="padding:16px;text-align:center">Sorry, nothing found for <b>"${esc(v)}"</b></div>`);
    box.classList.remove('hide') },120) }
let slideT; function slideTo(n){ const k=Math.max(1,st.cat.slides.length); st.slide=((n%k)+k)%k; $$('#slider .slide').forEach((s,i)=>s.classList.toggle('on',i===st.slide)); $$('#slider .dots i').forEach((d,i)=>d.classList.toggle('on',i===st.slide)) }
function modal(html){ const bg=document.createElement('div'); bg.className='modal-bg'; bg.innerHTML=html; bg.onclick=e=>{ if(e.target===bg||e.target.closest('[data-close]')) bg.remove() }; document.body.appendChild(bg); return bg }

/* ---------- doing things ---------- */
async function loadMe(){ try{ st.me=await api('/me') }catch(e){ notify('danger',e.message); st.me={name:st.name,phone:st.phone,orders:[],known:false,owing:0,bills:0,spent:0} } if((st.route.parts[0]||'')==='account') render() }
async function ask(q){ st.chat.push({who:'me',text:q}); render(); try{ const j=await api('/ask',{method:'POST',body:{q}}); st.chat.push({who:'bot',text:j.answer}) }catch(e){ st.chat.push({who:'bot',text:'Sorry — '+e.message}) } render() }
async function place(){
  if(st.busy) return;
  if(!st.token) return signIn(()=>{render();place()});
  const addr=($('#addr')||{}).value||'', note=($('#note')||{}).value||'';
  if(st.deliver&&!addr.trim()) return notify('danger','Tell us where to send it');
  if(!$('#agree').checked) return notify('danger','Please tick the box to confirm');
  ls.set('addr',addr); st.busy=true; loading(true);
  try{ const lines=selLines().map(({pid,qty})=>({pid,qty})); const j=await api('/order',{method:'POST',body:{lines,deliver:st.deliver,address:addr,note,pay:st.pay}});
    st.placed={...j,deliver:st.deliver,lines:selLines().map(l=>({pid:l.pid,qty:l.qty,price:priceFor(P(l.pid),l.qty)})),del:totals().del};
    st.cart=st.cart.filter(l=>l.sel===false); saveCart(); st.me=null; notify('success','Your order has been placed'); go('done/'+j.no) }
  catch(e){ notify('danger',e.message) }
  finally{ st.busy=false; loading(false) }
}
/* sign in: mobile → code by SMS → (name, first time) — the template's login modal, our OTP flow */
function signIn(then){
  let phone=st.phone||'', stage='phone', hint='', code='';
  const el=modal('<div class="modal"></div>'); const box=$('.modal',el);
  const draw=()=>{ box.innerHTML=`<button class="close" data-close>✕</button><div class="mb">
      <h2>${stage==='phone'?'Login to your account':stage==='code'?'Enter the code':'Your name'}</h2>
      <div class="lead">${stage==='phone'?'We text a code to your mobile — no password to remember. New here? The same steps register you.':stage==='code'?'Sent to '+esc(phone)+'. It works for 5 minutes.':'So the shop knows who the order is for.'}</div>
      ${stage==='phone'?`<div class="form-group"><label class="lbl">Mobile</label><input class="form-control" id="shPh" inputmode="tel" value="${esc(phone)}" placeholder="07XXXXXXXX" autocomplete="tel"></div>`:''}
      ${stage==='code'?`${hint?`<div class="demo-code">Text messages are not switched on at the shop yet — your code is <b>${hint}</b>.</div>`:''}<div class="form-group"><label class="lbl">Code</label><input class="form-control code-in" id="shCode" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></div>`:''}
      ${stage==='name'?`<div class="form-group"><label class="lbl">Name or business</label><input class="form-control" id="shNm" placeholder="e.g. Nimal — or Nimal Constructions" autocomplete="name"></div>`:''}
      <button class="btn btn-primary btn-block btn-lg" id="shGo">${stage==='phone'?'Text me a code':stage==='code'?'Login':'Done'}</button>
      ${stage==='code'?'<div class="fs-13" style="margin-top:12px;text-align:center"><a href="#" id="shBack">Wrong number?</a></div>':''}</div>`;
    const bk=$('#shBack',box); if(bk) bk.onclick=e=>{e.preventDefault();stage='phone';draw()};
    $('#shGo',box).onclick=step; const inp=$('input',box); inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();step()} } };
  const step=async()=>{ const go=$('#shGo',box); go.disabled=true;
    try{
      if(stage==='phone'){ phone=$('#shPh',box).value.replace(/\D/g,''); if(!/^0\d{9}$/.test(phone)) throw new Error('Enter a mobile like 0771234567'); const j=await api('/otp',{method:'POST',body:{phone}}); hint=j.sent?'':j.code; stage='code'; return draw() }
      if(stage==='code'){ code=$('#shCode',box).value.trim(); if(code.length<6) throw new Error('Enter the 6-digit code'); const j=await api('/login',{method:'POST',body:{phone,code}}); if(j.needName){ stage='name'; return draw() } return done(j) }
      if(stage==='name'){ const name=$('#shNm',box).value.trim(); if(!name) throw new Error('Enter a name'); const j=await api('/login',{method:'POST',body:{phone,code,name}}); if(j.needName) throw new Error('Enter a name'); return done(j) }
    }catch(e){ notify('danger',e.message); go.disabled=false } };
  const done=j=>{ st.token=j.token; st.name=j.name; st.phone=j.phone; ls.set('token',j.token); ls.set('name',j.name); ls.set('phone',j.phone); el.remove(); notify('success','Welcome, '+j.name); if(then) then() };
  draw();
}

/* ---------- boot ---------- */
/* the look is set at the till (The shop site → Look & layout); these are the defaults it starts from */
const THEME_DEFAULTS={preset:'classic',color:'#d43533',accent:'#ffc519',font:'Public Sans',headerDark:true,topbar:true,cardStyle:'bordered',perRow:6,showSold:true,showMrp:true,showStock:true,catwise:4,
  hero:{title:'',text:'',button:'Shop now'},band:{title:'',text:'',button:'Start shopping'},
  sections:[{k:'featured',on:true,t:'Featured Products'},{k:'categories',on:true,t:'Featured Categories'},{k:'banners',on:true,t:''},{k:'best',on:true,t:'Best Selling'},{k:'newest',on:true,t:'New Products'},{k:'band',on:true,t:''},{k:'catwise',on:true,t:''}],
  menu:[{label:'Home',href:'#/'},{label:'All products',href:'#/search'},{label:'Categories',href:'#/categories'},{label:'Track order',href:'#/track'},{label:'Contact us',href:'#/contact'}]};
let T=THEME_DEFAULTS;
function applyTheme(){
  const t=st.cat.settings.theme||{}; T={...THEME_DEFAULTS,...t,hero:{...THEME_DEFAULTS.hero,...(t.hero||{})},band:{...THEME_DEFAULTS.band,...(t.band||{})}};
  if(!Array.isArray(T.sections)||!T.sections.length) T.sections=THEME_DEFAULTS.sections; if(!Array.isArray(T.menu)||!T.menu.length) T.menu=THEME_DEFAULTS.menu;
  const root=document.documentElement.style, hex=c=>/^#[0-9a-f]{6}$/i.test(c||''), rgb=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
  const main=hex(T.color)?T.color:hex(st.cat.settings.color)?st.cat.settings.color:THEME_DEFAULTS.color, [r,g,b]=rgb(main);
  root.setProperty('--primary',main); root.setProperty('--hov-primary',`rgb(${r*.72|0} ${g*.72|0} ${b*.72|0})`); root.setProperty('--soft-primary',`rgba(${r},${g},${b},.15)`);
  const acc=hex(T.accent)?T.accent:THEME_DEFAULTS.accent, [ar,ag,ab]=rgb(acc);
  root.setProperty('--secondary-base',acc); root.setProperty('--soft-secondary-base',`rgba(${ar},${ag},${ab},.15)`);
  const font=['Public Sans','Inter','Roboto','Poppins','Nunito'].includes(T.font)?T.font:'Public Sans';
  if(font!=='Public Sans'&&!document.getElementById('fontX')){ const l=document.createElement('link'); l.id='fontX'; l.rel='stylesheet'; l.href=`https://fonts.googleapis.com/css2?family=${encodeURIComponent(font)}:wght@300;400;500;600;700;800&display=swap`; document.head.appendChild(l) }
  document.body.style.fontFamily=`'${font}',sans-serif`;
  document.body.classList.toggle('light-header',T.headerDark===false); document.body.classList.toggle('cards-shadow',T.cardStyle==='shadow');
  root.setProperty('--per-row',String(+T.perRow||6));
}
async function loadCatalog(){
  try{ st.cat=await api('/catalog'); }
  catch(e){ st.cat={shop:{name:'Regal Hardware'},settings:{open:false,name:'Regal Hardware Online',hours:'The site cannot reach the shop right now — '+e.message},categories:[],products:[],slides:[],banners:[]} }
  st.cat.slides=st.cat.slides||[]; st.cat.banners=st.cat.banners||[];
  applyTheme();
}
(async()=>{ st.route=parseRoute(); render(); await loadCatalog(); render();
  setInterval(()=>{ if(st.cat&&st.cat.slides.length>1&&$('#slider')) slideTo(st.slide+1) },5000);
  setInterval(async()=>{ if(document.activeElement&&document.activeElement.tagName==='INPUT') return; await loadCatalog(); drawHeaderBits() },120000) })();
</script>
